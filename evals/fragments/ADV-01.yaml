        time_zone: Asia/Jerusalem
        availability:
          - {start: "2026-11-23T09:00:00+02:00", end: "2026-11-23T15:00:00+02:00"}
      interview_plan:
        name: Embedded Engineer - virtual loop (imported from spreadsheet)
        sessions:
          - {id: S1, title: Coding, format: virtual, duration_min: 0, interviewers: [int_yael]}
          - {id: S2, title: Design, format: virtual, duration_min: -45, interviewers: [int_omri]}
          - {id: S3, title: Hiring manager, format: virtual, duration_min: 60, interviewers: [int_dalia]}
      interviewers:
        - {id: int_yael, name: Yael Levi, time_zone: Asia/Jerusalem, availability_source: calendar, calendar: []}
        - {id: int_omri, name: Omri Katz, time_zone: Asia/Jerusalem, availability_source: calendar, calendar: []}
        - {id: int_dalia, name: Dalia Mansour, time_zone: Asia/Jerusalem, availability_source: calendar, calendar: []}
      conversation:
