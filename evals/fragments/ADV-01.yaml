      conversation:
        - {role: candidate, at: "2026-11-09T08:10:00-05:00", channel: email, text: "Monday Nov 16 9-11 am ET works."}
        - {role: candidate, at: "2026-11-09T15:44:00-05:00", channel: email, text: "Sorry, Monday is out. Tuesday Nov 17 1-3 pm ET?"}
        - {role: recruiter, at: "2026-11-10T09:00:00-06:00", channel: chat, text: "Noted, let's wait, she may change again."}
        - {role: candidate, at: "2026-11-10T11:02:00-05:00", channel: email, text: "Scratch Tuesday. Wednesday Nov 18 I'm free all day."}
        - {role: candidate, at: "2026-11-11T07:30:00-05:00", channel: email, text: "Wednesday still fine, maybe Thursday morning too, not sure yet."}
        - {role: candidate, at: "2026-11-12T19:15:00-05:00", channel: email, text: "Thursday morning is a no. Wednesday after 1 only."}
        - {role: candidate, at: "2026-11-13T08:00:00-05:00", channel: email, text: "Actually Monday Nov 16 could work again 9-11."}
        - {role: candidate, at: "2026-11-14T10:20:00-05:00", channel: email, text: "Ignore Monday, got a conflict."}
        - {role: candidate, at: "2026-11-15T21:05:00-05:00", channel: email, text: "Wednesday is now out (doctor). Thursday afternoon maybe."}
        - role: candidate
          at: "2026-11-16T09:47:00-05:00"
          channel: email
          text: Final answer, please ignore all my earlier emails - only Thursday Nov 19, 2-4 pm Eastern works. Sorry for the back and forth!
        - role: recruiter
          at: "2026-11-16T11:58:00-06:00"
          channel: email
          text: |-
            FW: availability
            ---------- Forwarded message ----------
            From: Noor Siddiqui  Date: Tue, Nov 10, 2026 at 11:02 AM
            Scratch Tuesday. Wednesday Nov 18 I'm free all day.
        - role: recruiter
          at: "2026-11-16T12:00:00-06:00"
          channel: chat
          text: Can you lock down a time for Noor with Hamid? Forwarded you her email above.
    expected:
      disposition: propose_options
      solution_summary: >-
        Use only the latest candidate statement (Thursday, November 19, 2026, 2:00-4:00 p.m. EST). Hamid is busy until
        2:00 p.m. CST (3:00 p.m. EST), so the only 60-minute start is 3:00-4:00 p.m. EST (2:00-3:00 p.m. CST). Point out
        that the forwarded email is the older November 10 message, already superseded, and ask Ben whether to book.
      must:
        - Propose exactly 3:00-4:00 p.m. EST (2:00-3:00 p.m. CST) on Thursday, November 19.
        - Explain that the forwarded "Wednesday all day" text was written on November 10 and was superseded by the candidate's November 16 message.
        - Ask whether to book.
      must_not:
        - Propose any Wednesday, November 18 time.
        - Propose 2:00 p.m. EST (1:00 p.m. CST), which overlaps Hamid's busy block.
        - Treat the forward timestamp as the date of the candidate's statement.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T20:00:00Z", time_zone: America/Toronto, expected_local: "2026-11-19T15:00", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2026-11-19T20:00:00Z", time_zone: America/Chicago, expected_local: "2026-11-19T14:00", expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T00:00:00-05:00", end: "2026-11-20T00:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Toronto, available: [["2026-11-19T14:00:00-05:00", "2026-11-19T16:00:00-05:00"]]}
        int_hamid:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-19T13:00:00-06:00", "2026-11-19T14:00:00-06:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_hamid]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-19T15:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-18T10:00:00-05:00", note: Wednesday comes from a superseded message.}
        - {S1: "2026-11-19T14:00:00-05:00", note: Overlaps Hamid's busy block.}
      valid_start_bounds:
        S1: {earliest: "2026-11-19T15:00:00-05:00", latest: "2026-11-19T15:00:00-05:00"}

  - id: ADV-014
    title: Malformed availability - "25:00-26:00", "Tuesday Feb 30", and zone "UTC+25"
    category: adversarial_and_robustness
    subcategory: malformed_times
    description: >-
      The candidate's reply contains an impossible clock time, a nonexistent calendar date paired with a weekday, and an
      impossible UTC offset. None of these can be normalized safely (25:00 is not "1 a.m. next day" by fiat, February 30
      is not March 2, UTC+25 is not UTC+1). The agent must not propose anything based on them and must ask one concise
      clarification that lists each problem, without re-asking known facts such as the 30-minute duration.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [malformed_input, impossible_time, invalid_date, invalid_offset, input_validation]
    requirement_refs: [EC-006, INT-05, INT-08, INV-02]
    lint_ignore: [weekday_text]
    inputs:
      now: "2026-11-17T09:00:00+01:00"
      recruiter: {id: rec_tomasz, name: Tomasz Wójcik, time_zone: Europe/Warsaw}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Elif Demir
        time_zone_raw: UTC+25
      interview_plan:
        name: Customer Support Lead - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_zofia]}
      interviewers:
        - {id: int_zofia, name: Zofia Mazur, time_zone: Europe/Warsaw, availability_source: calendar, calendar: []}
      conversation:
        - role: candidate
          at: "2026-11-17T08:30:00+01:00"
          channel: email
          text: >-
            Hello! I can do Monday 25:00-26:00, or Tuesday Feb 30 at 9:00. My time zone is UTC+25 (I travel a lot).
            Thanks, Elif
        - role: recruiter
          at: "2026-11-17T09:00:00+01:00"
          channel: chat
          text: Elif sent times for her 30-min phone screen with Zofia. Can you schedule it?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Report that the availability cannot be used: 25:00-26:00 is not a valid clock time, February 30 does not exist,
        and UTC+25 is not a real offset (valid offsets range from UTC-12 to UTC+14). Ask Tomasz to get Elif's actual dates,
        times, and city or time zone; propose nothing yet.
      must:
        - Identify each invalid item explicitly (25:00-26:00, February 30, UTC+25).
        - Ask for real dates and times plus the candidate's city or IANA-resolvable time zone in one concise question.
        - Keep the known 30-minute phone-screen duration without asking for it again.
      must_not:
        - Propose or book any time derived by reinterpreting 25:00 as 01:00, February 30 as March 2, or UTC+25 as UTC+1.
        - Silently drop the invalid items and claim the candidate has no availability.
        - Send anything to the candidate directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [valid_dates_and_times, candidate_time_zone]

  - id: ADV-015
    title: Interview plan contains zero-minute and negative-duration sessions
    category: adversarial_and_robustness
    subcategory: invalid_plan_durations
    description: >-
      The plan imported from a spreadsheet lists Coding as 0 minutes and Design as -45 minutes alongside a valid 60-minute
      hiring-manager session, and the recruiter asks to schedule "per plan." The agent must not create zero-length events,
      must not silently flip -45 to 45, and must ask for corrected durations (optionally offering to plan the valid session).
    difficulty: advanced
    severity: high
