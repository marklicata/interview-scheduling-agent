  - id: TZ-064
    title: Candidate in London Monday-Tuesday and Singapore Thursday-Friday - "mornings 9-11 local" changes zone mid-week
    category: cross_timezone
    subcategory: traveling_candidate
    description: >-
      The candidate travels mid-week: London on Monday-Tuesday, overnight flight Wednesday, Singapore Thursday-Friday, and
      says "mornings 9-11 local any day". The Singapore interviewer works 9:00-18:00 SGT and is busy Thursday 9:00-10:30.
      Valid 60-minute starts: Monday or Tuesday 9:00 a.m. GMT (5:00 p.m. SGT), and Friday 9:00-10:00 a.m. SGT. Using a single
      zone for the whole week produces either middle-of-the-night London times or wrong Singapore slots.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [traveling_candidate, zone_changes_midweek, london, singapore, per_date_zone]
    requirement_refs: [AVL-10, INT-04, EC-015]
    inputs:
      now: "2026-11-10T10:00:00+08:00"
      recruiter: {id: rec_wen, name: Wen Hui Lim, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Oluwaseun Adeyemi
        travel_itinerary:
          - {dates: "Mon Nov 16 to Tue Nov 17", location: London, time_zone: Europe/London}
          - {dates: "Wed Nov 18", location: in transit, note: overnight flight, unavailable}
          - {dates: "Thu Nov 19 to Fri Nov 20", location: Singapore, time_zone: Asia/Singapore}
        availability:
          - {start: "2026-11-16T09:00:00+00:00", end: "2026-11-16T11:00:00+00:00", time_zone: Europe/London}
          - {start: "2026-11-17T09:00:00+00:00", end: "2026-11-17T11:00:00+00:00", time_zone: Europe/London}
          - {start: "2026-11-19T09:00:00+08:00", end: "2026-11-19T11:00:00+08:00", time_zone: Asia/Singapore}
          - {start: "2026-11-20T09:00:00+08:00", end: "2026-11-20T11:00:00+08:00", time_zone: Asia/Singapore}
      interview_plan:
        name: Commodities Trader - desk head interview
        sessions:
          - {id: S1, title: Desk head interview, format: virtual, duration_min: 60, interviewers: [int_daniel]}
      interviewers:
        - id: int_daniel
          name: Daniel Koh
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-19T09:00:00+08:00", end: "2026-11-19T10:30:00+08:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: >-
            I'm in London Mon-Tue, flying Wednesday, then in Singapore Thu-Fri. Mornings 9-11 local time work any of those
            days except Wednesday.
        - role: recruiter
          text: Find options with Daniel.
    expected:
      disposition: propose_options
      solution_summary: >-
        Monday, November 16 or Tuesday, November 17, 2026: 9:00-10:00 a.m. GMT (London) = 5:00-6:00 p.m. SGT. Friday,
        November 20: start 9:00-10:00 a.m. SGT (candidate in Singapore). Thursday has only 30 free minutes after Daniel's meeting.
      must:
        - Apply London time to Monday-Tuesday and Singapore time to Thursday-Friday.
        - Propose Monday/Tuesday 9:00 a.m. GMT (5:00 p.m. SGT) and Friday starts from 9:00 to 10:00 a.m. SGT.
        - Explain why Thursday does not fit and why Wednesday is excluded.
        - Ask whether to book one option.
      must_not:
        - Use Singapore time for the London days (e.g. 9:00 a.m. SGT Monday = 1:00 a.m. in London).
        - Propose Monday or Tuesday later than 9:00 a.m. GMT (ends after Daniel's 6:00 p.m. SGT).
        - Propose Thursday 9:00-10:30 a.m. SGT.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-16T09:00:00Z", time_zone: Europe/London, expected_local: "2026-11-16T09:00", expected_weekday: Monday}
      - {instant: "2026-11-16T09:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-11-16T17:00", expected_utc_offset: "+08:00"}
      - {instant: "2026-11-20T01:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-11-20T09:00", expected_weekday: Friday}
      - {instant: "2026-11-16T01:00:00Z", time_zone: Europe/London, expected_local: "2026-11-16T01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T00:00:00Z", end: "2026-11-20T16:00:00Z"}
      participants:
        candidate:
          available: [["2026-11-16T09:00:00+00:00", "2026-11-16T11:00:00+00:00"], ["2026-11-17T09:00:00+00:00", "2026-11-17T11:00:00+00:00"], ["2026-11-19T09:00:00+08:00", "2026-11-19T11:00:00+08:00"], ["2026-11-20T09:00:00+08:00", "2026-11-20T11:00:00+08:00"]]
        int_daniel:
          time_zone: Asia/Singapore
          working_hours: {time_zone: Asia/Singapore, start: "09:00", end: "18:00"}
          busy: [["2026-11-19T09:00:00+08:00", "2026-11-19T10:30:00+08:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_daniel]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-16T09:00:00+00:00"}
        - {S1: "2026-11-17T09:00:00+00:00"}
        - {S1: "2026-11-20T09:30:00+08:00"}
      invalid_examples:
        - {S1: "2026-11-16T09:00:00+08:00", note: "1:00 a.m. in London."}
        - {S1: "2026-11-16T09:30:00+00:00", note: "Ends 6:30 p.m. SGT."}
        - {S1: "2026-11-19T10:30:00+08:00", note: Thursday window ends at 11:00.}
      valid_start_bounds:
        S1: {earliest: "2026-11-16T09:00:00+00:00", latest: "2026-11-20T10:00:00+08:00"}

  - id: TZ-065
    title: Interviewer's Outlook still says Pacific working hours after relocating to Dublin
    category: cross_timezone
    subcategory: stale_working_hours_after_relocation
    description: >-
      Erin's mailbox working hours are 9:00-17:00 Pacific, but the recruiter mentions she moved to the Dublin office last
      month and her recent meetings sit in Dublin daytime. For a Boston candidate free 9:00 a.m.-12:00 p.m. EST on December 1,
      the stale Pacific hours yield nothing (her day would start at noon EST), while Dublin hours allow 10:00-11:00 a.m. EST
      starts after her 2:00-3:00 p.m. GMT meeting. The contradiction must be surfaced and confirmed, not silently resolved.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [stale_working_hours, relocation, dublin, boston, source_conflict]
    requirement_refs: [AVL-01, AVL-15, AVL-10, UX-06]
    inputs:
      now: "2026-11-24T09:00:00-05:00"
      recruiter: {id: rec_brooke, name: Brooke Lansing, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Patrick Nwosu
        time_zone: America/New_York
        availability:
          - {start: "2026-12-01T09:00:00-05:00", end: "2026-12-01T12:00:00-05:00"}
      interview_plan:
        name: Developer Experience Lead - interview
        sessions:
          - {id: S1, title: DX interview, format: virtual, duration_min: 60, interviewers: [int_erin]}
      interviewers:
        - id: int_erin
          name: Erin Castellano
          time_zone: America/Los_Angeles
          time_zone_source: Outlook mailbox settings (last changed before her move)
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00", time_zone_label: Pacific Standard Time}
          calendar:
            - {start: "2026-12-01T09:30:00Z", end: "2026-12-01T10:00:00Z", status: busy, subject: Dublin team standup}
            - {start: "2026-12-01T14:00:00Z", end: "2026-12-01T15:00:00Z", status: busy}
      conversation:
        - role: recruiter
          text: >-
            Erin moved to our Dublin office last month, not sure she updated Outlook. Patrick is free 9-12 Eastern on Tue
            Dec 1. What works?
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [interviewer_current_zone_and_hours]
      solution_summary: >-
        Flag the conflict: Outlook working hours are 9-5 Pacific (12:00-8:00 p.m. EST), which gives no overlap with Patrick,
        while her calendar and the recruiter suggest Dublin (9-5 GMT = 4:00 a.m.-12:00 p.m. EST). If Dublin is confirmed,
        starts 10:00-11:00 a.m. EST (3:00-4:00 p.m. GMT) work. Ask the recruiter to confirm Erin's current zone and hours.
      must:
        - Point out the contradiction between Erin's Pacific working-hours setting and the Dublin evidence.
        - Show what each interpretation implies for December 1, including the conditional 10:00-11:00 a.m. EST starts under Dublin hours.
        - Ask the recruiter to confirm Erin's current time zone and working hours (and suggest she update Outlook).
      must_not:
        - Silently use the stale Pacific hours and report no availability.
        - Silently assume Dublin and book.
        - Book anything before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-01T15:00:00Z", time_zone: America/New_York, expected_local: "2026-12-01T10:00", expected_weekday: Tuesday}
      - {instant: "2026-12-01T15:00:00Z", time_zone: Europe/Dublin, expected_local: "2026-12-01T15:00", expected_utc_offset: "+00:00"}
      - {instant: "2026-12-01T17:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-01T09:00", expected_utc_offset: "-08:00"}

  - id: TZ-066
    title: Candidate moved from Toronto to Vancouver between intake and scheduling - the old proposal is now 6:30 a.m.
    category: cross_timezone
    subcategory: candidate_relocation_revalidation
    description: >-
      At intake (November 9) the case recorded the candidate in Toronto and a draft option "Thu Nov 19, 9:30 a.m. ET" was
      prepared. On November 16 the candidate writes that she has moved to Vancouver and is free "9-11 am my time" on
      Thursday. The old draft is 6:30 a.m. in Vancouver. With the Toronto interviewer busy 12:30-1:00 p.m. EST, the only
      60-minute start is 1:00 p.m. EST = 10:00 a.m. PST. The agent must update the zone with provenance and invalidate the draft.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [candidate_relocation, case_continuity, revalidation, vancouver, toronto]
    requirement_refs: [INT-04, INT-06, AVL-05, UX-06, EC-010]
    inputs:
      now: "2026-11-16T10:00:00-05:00"
      recruiter: {id: rec_noor, name: Noor Rahimi, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Amelia Fontaine-Wu
        time_zone: America/Vancouver
        time_zone_history:
          - {zone: America/Toronto, source: intake form, recorded_at: "2026-11-09T11:00:00-05:00"}
          - {zone: America/Vancouver, source: candidate email, recorded_at: "2026-11-16T06:40:00-08:00"}
        availability:
          - {start: "2026-11-19T09:00:00-08:00", end: "2026-11-19T11:00:00-08:00"}
      interview_plan:
        name: Clinical Data Manager - interview
        sessions:
          - {id: S1, title: Data management interview, format: virtual, duration_min: 60, interviewers: [int_raj]}
      interviewers:
        - id: int_raj
          name: Raj Malhotra
          time_zone: America/Toronto
          availability_source: calendar
          working_hours: {start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-19T12:30:00-05:00", end: "2026-11-19T13:00:00-05:00", status: busy}
      case_state:
        prior_proposals:
          - {created_at: "2026-11-09T11:30:00-05:00", text: "Thu Nov 19, 9:30-10:30 a.m. ET with Raj (draft, not booked)"}
      conversation:
        - role: candidate
          channel: email
          at: "2026-11-16T06:40:00-08:00"
          text: Quick update - I've moved to Vancouver! Same availability though, 9-11 am my time on Thursday the 19th.
        - role: recruiter
          at: "2026-11-16T10:00:00-05:00"
          text: Is our Thursday 9:30 draft still good for Amelia?
    expected:
      disposition: propose_options
      solution_summary: >-
        No. 9:30 a.m. EST is 6:30 a.m. in Vancouver. Update the candidate's zone to America/Vancouver (source - her November 16
        email) and propose Thursday, November 19, 2026, 1:00-2:00 p.m. EST = 10:00-11:00 a.m. PST, the only fit.
      must:
        - Invalidate the November 9 draft and explain that 9:30 a.m. ET is 6:30 a.m. in Vancouver.
        - Record the new zone with its source and keep the old value in history.
        - Propose only 1:00 p.m. EST = 10:00 a.m. PST on November 19.
        - Ask whether to book.
      must_not:
        - Reuse the 9:30 a.m. ET draft.
        - Propose 12:00 p.m. EST (overlaps Raj's 12:30 block) or interpret "9-11 my time" in Toronto time.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T14:30:00Z", time_zone: America/Vancouver, expected_local: "2026-11-19T06:30", expected_weekday: Thursday}
      - {instant: "2026-11-19T18:00:00Z", time_zone: America/Vancouver, expected_local: "2026-11-19T10:00", expected_utc_offset: "-08:00"}
      - {instant: "2026-11-19T18:00:00Z", time_zone: America/Toronto, expected_local: "2026-11-19T13:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T00:00:00-05:00", end: "2026-11-20T00:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Vancouver, available: [["2026-11-19T09:00:00-08:00", "2026-11-19T11:00:00-08:00"]]}
        int_raj:
          time_zone: America/Toronto
          working_hours: {time_zone: America/Toronto, start: "09:00", end: "17:00"}
          busy: [["2026-11-19T12:30:00-05:00", "2026-11-19T13:00:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_raj]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-19T13:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-19T09:30:00-05:00", note: "Stale draft - 6:30 a.m. in Vancouver."}
      valid_start_bounds:
        S1: {earliest: "2026-11-19T13:00:00-05:00", latest: "2026-11-19T13:00:00-05:00"}

  - id: TZ-067
    title: Interviewer's blocked-time list has no time zone while he is visiting another office
    category: cross_timezone
    subcategory: supplied_blocks_missing_zone
    description: >-
      Mehmet (profile zone Istanbul, UTC+3) emails "This week I'm at the Dubai office. Busy Mon-Wed 9-12 and 2-3, rest is
      free." The list has no zone, and he is temporarily in Dubai (UTC+4). For a Berlin candidate the readings differ by an
      hour. Missing zones on supplied blocks require clarification; the agent may note which slots would hold under either
      reading but must not treat them as confirmed.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [supplied_blocks, missing_time_zone, istanbul, dubai, berlin, temporary_location]
    requirement_refs: [AVL-13, INT-05, EC-154]
    inputs:
      now: "2026-11-20T10:00:00+01:00"
      recruiter: {id: rec_katrin, name: Katrin Vogel, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Felix Baumann
        time_zone: Europe/Berlin
        availability:
          - {start: "2026-11-24T10:00:00+01:00", end: "2026-11-24T12:00:00+01:00"}
      interview_plan:
        name: Logistics Network Planner - interview
        sessions:
          - {id: S1, title: Network planning interview, format: virtual, duration_min: 60, interviewers: [int_mehmet]}
      interviewers:
        - id: int_mehmet
          name: Mehmet Yilmaz
          time_zone: Europe/Istanbul
          availability_source: supplied
          supplied_blocks_raw: "Busy Mon-Wed 9-12 and 2-3, rest is free (no zone stated; currently at the Dubai office)"
      conversation:
        - role: interviewer
          channel: email
          text: This week I'm at the Dubai office. Busy Mon-Wed 9-12 and 2-3, rest is free.
        - role: recruiter
          text: Felix can do Tue 24 Nov 10-12 Berlin time. Use Mehmet's list and book it.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [block_list_time_zone, working_hours_bounds_for_rest_is_free]
      solution_summary: >-
        Ask which zone the blocks are in (Dubai, where he is this week, or Istanbul) and what hours "rest is free" covers.
        For Tuesday, November 24, 2026: under Istanbul time Felix's 10-12 CET window (12:00-2:00 p.m. Istanbul) is fully free;
        under Dubai time only 10:00-11:00 a.m. CET (1:00-2:00 p.m. Dubai) is free. 10:00 a.m. CET would hold under both, but
        confirm before booking.
      must:
        - Explain that the block list lacks a time zone and that Mehmet is temporarily in a different zone from his profile.
        - Show how the two readings change Tuesday's free time.
        - Ask the recruiter to confirm the zone (and the bounds of "rest is free") before booking.
      must_not:
        - Book any time based on the zone-less list.
        - Assume the profile zone without noting the Dubai visit.
        - Treat "rest is free" as 24-hour availability.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-24T09:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-24T10:00", expected_weekday: Tuesday}
      - {instant: "2026-11-24T09:00:00Z", time_zone: Europe/Istanbul, expected_local: "2026-11-24T12:00", expected_utc_offset: "+03:00"}
      - {instant: "2026-11-24T09:00:00Z", time_zone: Asia/Dubai, expected_local: "2026-11-24T13:00", expected_utc_offset: "+04:00"}

