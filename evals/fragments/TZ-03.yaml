  - id: TZ-078
    title: '"Tomorrow" in an email sent from Tokyo at 00:20 - which date?'
    category: cross_timezone
    subcategory: relative_date_near_midnight
    description: >-
      The Tokyo candidate emails at 12:20 a.m. JST on Wednesday, January 13, 2027: "I can do tomorrow 10:00-12:00 Japan time."
      Sent just after midnight, "tomorrow" could mean Wednesday the 13th (the day after the evening she was living through)
      or Thursday the 14th (literally the next calendar day). The Los Angeles recruiter reads it on Tuesday morning and
      assumes Wednesday PST. The agent must ask with explicit dates.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [relative_date, tomorrow, near_midnight, tokyo, los_angeles]
    requirement_refs: [INT-03, INT-05, EC-001, EC-016]
    inputs:
      now: "2027-01-12T07:30:00-08:00"
      recruiter: {id: rec_dana, name: Dana Whitfield, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hina Okabe
        time_zone: Asia/Tokyo
        availability_raw: "tomorrow 10:00-12:00 Japan time (email sent 2027-01-13 00:20 JST)"
      interview_plan:
        name: Localization QA Lead - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_noah]}
      interviewers:
        - id: int_noah
          name: Noah Greenberg
          time_zone: America/Los_Angeles
          availability_source: supplied
          supplied_availability:
            - {start: "2027-01-12T17:00:00-08:00", end: "2027-01-12T18:00:00-08:00"}
            - {start: "2027-01-13T17:00:00-08:00", end: "2027-01-13T18:00:00-08:00"}
      conversation:
        - role: candidate
          channel: email
          at: "2027-01-13T00:20:00+09:00"
          text: Sorry for the late reply! I can do tomorrow 10:00-12:00 Japan time.
        - role: recruiter
          at: "2027-01-12T07:30:00-08:00"
          text: She says tomorrow - so Wednesday. Noah can do 5-6pm either day. Set it up.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [which_date_tomorrow_means]
      solution_summary: >-
        Ask the candidate to confirm the date. If Wednesday, January 13, 10:00-12:00 JST = Tuesday, January 12, 5:00-7:00 p.m.
        PST (Noah's 5-6 p.m. today works). If Thursday, January 14, 10:00-12:00 JST = Wednesday, January 13, 5:00-7:00 p.m. PST.
        The recruiter's "Wednesday" assumption is a third reading.
      must:
        - Explain that the email was sent at 12:20 a.m. JST Wednesday, so "tomorrow" is ambiguous (Wednesday or Thursday in Tokyo).
        - Give both readings with explicit dates in JST and PST.
        - Point out that the recruiter's Pacific "Wednesday" is not necessarily the candidate's tomorrow.
        - Ask the recruiter to confirm with the candidate before proposing a booking.
      must_not:
        - Interpret "tomorrow" relative to the recruiter's Pacific date.
        - Book or propose a single definitive slot.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-12T15:20:00Z", time_zone: Asia/Tokyo, expected_local: "2027-01-13T00:20", expected_weekday: Wednesday}
      - {instant: "2027-01-12T15:20:00Z", time_zone: America/Los_Angeles, expected_local: "2027-01-12T07:20", expected_weekday: Tuesday}
      - {instant: "2027-01-13T01:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-01-12T17:00", expected_weekday: Tuesday}
      - {instant: "2027-01-14T01:00:00Z", time_zone: Asia/Tokyo, expected_local: "2027-01-14T10:00", expected_weekday: Thursday}

  - id: TZ-079
    title: Four-zone panel with exactly one common hour, only on days the Bengaluru panelist has extended hours
    category: cross_timezone
    subcategory: exactly_one_common_hour_four_zones
    description: >-
      Panelists in Boston (9:00-17:00 EST), London (9:00-17:00 GMT), Lagos (8:00-17:00 WAT) and Bengaluru (9:30-18:30 IST,
      extended to 20:30 on Tuesdays and Thursdays by her own standing arrangement) need a 60-minute panel with a candidate in
      Accra (1:00-5:00 p.m. GMT, February 9-11, 2027). Boston starts at 14:00 UTC and Bengaluru's extended day ends at 15:00
      UTC, so exactly one hour exists, only on Tuesday and Thursday; Wednesday has none.
