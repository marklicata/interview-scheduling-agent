      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kwame Asante-Boateng
        time_zone: Africa/Accra
        availability:
          - {start: "2027-02-09T13:00:00+00:00", end: "2027-02-09T17:00:00+00:00"}
          - {start: "2027-02-10T13:00:00+00:00", end: "2027-02-10T17:00:00+00:00"}
          - {start: "2027-02-11T13:00:00+00:00", end: "2027-02-11T17:00:00+00:00"}
      interview_plan:
        name: Head of Mobile Money Partnerships (West Africa) - panel
        sessions:
          - {id: P1, title: Partnerships panel, format: virtual, duration_min: 60, interviewers: [int_bos, int_ldn, int_los, int_blr], all_required: true}
      interviewers:
        - {id: int_bos, name: Catherine Doyle, time_zone: America/New_York, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
        - {id: int_ldn, name: Samuel Okoro, time_zone: Europe/London, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
        - {id: int_los, name: Funmilayo Adebayo, time_zone: Africa/Lagos, availability_source: calendar, working_hours: {start: "08:00", end: "17:00"}, calendar: []}
        - id: int_blr
          name: Deepa Krishnan
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours:
            - {days: [Mon, Wed, Fri], start: "09:30", end: "18:30"}
            - {days: [Tue, Thu], start: "09:30", end: "20:30", source: standing arrangement set by Deepa in her working-hours settings}
          calendar: []
      conversation:
        - role: recruiter
          text: Kwame can do 1-5pm GMT Tue-Thu next week. All four panelists please - any options?
    expected:
