  - id: TZ-072
    title: Ordered Bengaluru-then-New York loop for a London candidate breaks the 60-minute maximum gap
    category: cross_timezone
    subcategory: loop_gap_across_zones
    description: >-
      The plan orders a technical interview (Bengaluru, 9:30 a.m.-6:00 p.m. IST) before a hiring-manager interview (New York,
      9:00 a.m.-5:00 p.m. EST), with 15-60 minute breaks, for a London candidate free 9:00 a.m.-6:00 p.m. GMT on Wednesday,
      January 13, 2027. Bengaluru's day ends at 12:30 p.m. GMT and New York's starts at 2:00 p.m. GMT, so the gap is at least
      90 minutes. The loop is infeasible as specified; the agent should give precise recruiter-owned fixes.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, hiring_manager, technical_coding]
    tags: [ordered_loop, max_gap, bengaluru, new_york, london, infeasible_with_options]
    requirement_refs: [CON-03, CON-04, SCH-04, SCH-05, AVL-10]
    inputs:
