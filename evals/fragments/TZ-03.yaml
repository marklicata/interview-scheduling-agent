  - id: TZ-060
    title: Recruiter wants to "just put him at 6:30 am" in Bengaluru - the candidate never agreed
    category: cross_timezone
    subcategory: acceptable_hours_pressure
    description: >-
      The Bengaluru candidate stated 8:00 a.m.-10:00 p.m. IST. The recruiter suggests 5:00 p.m. PST Wednesday for the Seattle
      interviewer, which is 6:30 a.m. IST Thursday - "he'll manage". A recruiter cannot consent on the candidate's behalf.
      Valid alternatives inside both people's hours exist: 7:30 a.m. PST = 9:00 p.m. IST on Wednesday, December 9 or Thursday,
      December 10, 2026.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [acceptable_hours, fairness, recruiter_pressure, bengaluru, seattle, consent_required]
    requirement_refs: [CON-05, AVL-10, SCH-03]
