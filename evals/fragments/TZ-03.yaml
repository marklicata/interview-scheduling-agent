      - {instant: "2026-12-09T15:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-09T07:30", expected_utc_offset: "-08:00"}
      - {instant: "2026-12-10T01:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-10T06:30", expected_weekday: Thursday}
