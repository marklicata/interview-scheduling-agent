    severity: medium
    release_scope: mvp
    interview_types: [panel]
    tags: [four_zone_panel, exactly_one_hour, extended_hours, accra, lagos, bengaluru, boston, london]
    requirement_refs: [CON-11, AVL-03, AVL-10, SCH-02]
