  - id: TZ-059
    title: Candidate explicitly volunteers 6:30 a.m. Sydney time - that consent makes the only slot valid
    category: cross_timezone
    subcategory: explicit_candidate_consent_early
    description: >-
      The plan's default candidate hours are 8:00 a.m.-8:00 p.m. local unless the candidate opts in. The Sydney candidate
      writes: "Tuesday 1 Dec I'm happy to start as early as 6:30 am my time, until 9." The Seattle interviewer is free only
      9:00 a.m.-12:00 p.m. PST on Monday, November 30 (= 4:00-7:00 a.m. AEDT Tuesday). With her opt-in, a 30-minute screen fits
      exactly at 6:30 a.m. AEDT = 11:30 a.m. PST Monday. The agent should use the consent precisely and not extend it to 6:00.
    difficulty: intermediate
    severity: medium
