          text: Thomas is free all day Wed 13 Jan. Kavitha's tech round first, then Robert. Usual 15-60 min break rule.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Not feasible as specified: S1 must end by 12:30 p.m. GMT (6:00 p.m. IST) and S2 cannot start before 2:00 p.m. GMT
        (9:00 a.m. EST), a gap of at least 90 minutes. Options: Kavitha runs S1 at 1:00-2:00 p.m. GMT (6:30-7:30 p.m. IST) with
        S2 at 2:15 p.m. GMT (9:15 a.m. EST); or Robert starts at 8:30 a.m. EST (S1 11:30 a.m.-12:30 p.m. GMT, S2 1:30 p.m. GMT);
        or the plan owner allows a 90-minute gap; or the sessions move to different days.
      must:
        - State the loop is infeasible under the 60-minute maximum gap and explain the 12:30-2:00 p.m. GMT dead zone.
        - Give at least two concrete recruiter-owned options with exact local times for the affected interviewer.
        - Keep S1 before S2 as the plan requires.
      must_not:
        - Propose a schedule with a 90-minute or longer gap as valid.
        - Reverse the session order without authorization.
        - Contact interviewers or book.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-13T12:30:00Z", time_zone: Asia/Kolkata, expected_local: "2027-01-13T18:00", expected_weekday: Wednesday}
      - {instant: "2027-01-13T14:00:00Z", time_zone: America/New_York, expected_local: "2027-01-13T09:00", expected_utc_offset: "-05:00"}
      - {instant: "2027-01-13T13:00:00Z", time_zone: Asia/Kolkata, expected_local: "2027-01-13T18:30"}
      - {instant: "2027-01-13T13:30:00Z", time_zone: America/New_York, expected_local: "2027-01-13T08:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-13T00:00:00Z", end: "2027-01-14T00:00:00Z"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2027-01-13T09:00:00+00:00", "2027-01-13T18:00:00+00:00"]]}
        int_kavitha: {time_zone: Asia/Kolkata, working_hours: {time_zone: Asia/Kolkata, start: "09:30", end: "18:00"}}
        int_robert: {time_zone: America/New_York, working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}}
