      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Thomas Achterberg
        time_zone: Europe/London
        availability:
          - {start: "2027-01-13T09:00:00+00:00", end: "2027-01-13T18:00:00+00:00"}
      interview_plan:
        name: Engineering Manager, Payments - loop
        sessions:
          - {id: S1, title: Technical deep dive, format: virtual, duration_min: 60, interviewers: [int_kavitha], order: 1}
          - {id: S2, title: Hiring manager, format: virtual, duration_min: 60, interviewers: [int_robert], order: 2}
        rules: {break_between_sessions_min: 15, max_gap_between_sessions_min: 60, same_day: true}
      interviewers:
        - {id: int_kavitha, name: Kavitha Ramesh, time_zone: Asia/Kolkata, availability_source: calendar, working_hours: {start: "09:30", end: "18:00"}, calendar: []}
        - {id: int_robert, name: Robert Klein, time_zone: America/New_York, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
      conversation:
