        9:00 a.m. EST (Boston), 3:00 p.m. WAT (Lagos), 7:30 p.m. IST (Bengaluru, within her Tuesday/Thursday extended hours).
        Wednesday has no common hour.
      must:
        - Propose only 14:00 UTC on February 9 and February 11, listing all five local times.
        - Explain that Wednesday fails because Deepa's Wednesday day ends at 6:30 p.m. IST (13:00 UTC), before Boston starts.
        - Cite Deepa's own Tuesday/Thursday extended hours as the reason 7:30 p.m. IST is acceptable.
        - Ask whether to book one.
