          available: [["2026-12-09T08:00:00+05:30", "2026-12-09T22:00:00+05:30"], ["2026-12-10T08:00:00+05:30", "2026-12-10T22:00:00+05:30"]]
        int_dave: {time_zone: America/Los_Angeles, working_hours: {time_zone: America/Los_Angeles, start: "07:30", end: "18:00"}}
      sessions:
