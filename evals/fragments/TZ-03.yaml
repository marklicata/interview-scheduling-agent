# Cross-timezone cases, part 3: midnight crossings, multi-zone panels, fairness, travel/relocation,
# local-day rules, deadlines, and authority interactions. All conversions computed with Python zoneinfo.
test_cases:
  - id: TZ-054
    title: Tuesday evening in Los Angeles is Wednesday morning in Shanghai - show both dates
    category: cross_timezone
    subcategory: cross_date_session
    description: >-
      The Los Angeles interviewer offers Tuesday, December 8, 2026, 4:00-6:00 p.m. PST; the Shanghai candidate is free
      Wednesday, December 9, 9:00-11:00 a.m. These overlap for exactly one hour: 5:00-6:00 p.m. PST Tuesday = 9:00-10:00 a.m.
      CST (China) Wednesday. The candidate-facing message must say Wednesday; the interviewer invite must say Tuesday.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [cross_date, shanghai, los_angeles, dual_date_display]
    requirement_refs: [AVL-10, COM-02, EC-016]
    inputs:
      now: "2026-12-01T10:00:00-08:00"
      recruiter: {id: rec_dana, name: Dana Whitfield, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Chen Mingyu
        time_zone: Asia/Shanghai
        availability:
          - {start: "2026-12-09T09:00:00+08:00", end: "2026-12-09T11:00:00+08:00"}
      interview_plan:
        name: Supplier Quality Engineer - interview
        sessions:
          - {id: S1, title: Quality interview, format: virtual, duration_min: 60, interviewers: [int_rebecca]}
      interviewers:
        - id: int_rebecca
          name: Rebecca Lindgren
          time_zone: America/Los_Angeles
          availability_source: supplied
          supplied_availability:
            - {start: "2026-12-08T16:00:00-08:00", end: "2026-12-08T18:00:00-08:00"}
      conversation:
        - role: recruiter
          text: Rebecca can stay late Tue 12/8 4-6pm. Mingyu said Wed 9-11am his time. Do these overlap?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes, exactly one slot: Tuesday, December 8, 2026, 5:00-6:00 p.m. PST = Wednesday, December 9, 9:00-10:00 a.m. China
        Standard Time (UTC+8).
      must:
        - Propose only 5:00 p.m. PST Tuesday = 9:00 a.m. Wednesday in Shanghai.
        - Show each participant's own local date (Tuesday for Rebecca, Wednesday for the candidate).
        - Ask whether to book.
      must_not:
        - Present the candidate's interview as Tuesday or the interviewer's as Wednesday.
        - Propose 4:00 p.m. PST (8:00 a.m. Wednesday, before the candidate's window).
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-09T01:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-08T17:00", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-12-09T01:00:00Z", time_zone: Asia/Shanghai, expected_local: "2026-12-09T09:00", expected_weekday: Wednesday, expected_utc_offset: "+08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T00:00:00-08:00", end: "2026-12-10T00:00:00-08:00"}
      participants:
        candidate: {time_zone: Asia/Shanghai, available: [["2026-12-09T09:00:00+08:00", "2026-12-09T11:00:00+08:00"]]}
        int_rebecca: {time_zone: America/Los_Angeles, available: [["2026-12-08T16:00:00-08:00", "2026-12-08T18:00:00-08:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_rebecca]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-08T17:00:00-08:00"}
      invalid_examples:
        - {S1: "2026-12-08T16:00:00-08:00", note: "8:00 a.m. Wednesday in Shanghai."}
      valid_start_bounds:
        S1: {earliest: "2026-12-08T17:00:00-08:00", latest: "2026-12-08T17:00:00-08:00"}

  - id: TZ-055
    title: '"9 pm to midnight" in Kolkata means the interview must end by 00:00 IST, not start before it'
    category: cross_timezone
    subcategory: session_crosses_midnight
    description: >-
      A Kolkata candidate offers "Thursday 9 pm to midnight IST" (Thursday, December 10, 2026). The New York interviewer is
      busy until 12:15 p.m. EST. A 45-minute interview can start 12:15-12:45 p.m. EST (10:45-11:15 p.m. IST). A 1:00 p.m. EST
      start looks tempting but runs from 11:30 p.m. Thursday to 12:15 a.m. Friday in Kolkata, crossing midnight and the
      candidate's limit.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [crosses_midnight, kolkata, new_york, until_boundary, dual_date_display]
    requirement_refs: [AVL-10, SCH-01, EC-009, EC-021]
    inputs:
      now: "2026-12-03T09:00:00-05:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Vikram Chatterjee
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-12-10T21:00:00+05:30", end: "2026-12-11T00:00:00+05:30"}
      interview_plan:
        name: Fraud Analytics Lead - interview
        sessions:
          - {id: S1, title: Analytics interview, format: virtual, duration_min: 45, interviewers: [int_shannon]}
      interviewers:
        - id: int_shannon
          name: Shannon Doyle
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-12-10T09:00:00-05:00", end: "2026-12-10T12:15:00-05:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: Thursday 9 pm to midnight IST works for me.
        - role: recruiter
          text: Shannon's free after 12:15 Thursday. How about 1pm our time?
    expected:
      disposition: propose_options
      solution_summary: >-
        Thursday, December 10, 2026: start 12:15-12:45 p.m. EST = 10:45-11:15 p.m. IST, ending by midnight IST. 1:00 p.m. EST
        would end at 12:15 a.m. Friday IST.
      must:
        - Propose only starts from 12:15 to 12:45 p.m. EST (10:45-11:15 p.m. IST Thursday).
        - Explain that 1:00 p.m. EST runs past midnight in Kolkata into Friday, December 11.
        - Ask whether to book.
      must_not:
        - Propose 1:00 p.m. EST or any session ending after 00:00 IST.
        - Propose a start before 12:15 p.m. EST (Shannon is busy).
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-10T17:15:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-10T22:45", expected_weekday: Thursday, expected_utc_offset: "+05:30"}
      - {instant: "2026-12-10T17:15:00Z", time_zone: America/New_York, expected_local: "2026-12-10T12:15", expected_utc_offset: "-05:00"}
      - {instant: "2026-12-10T18:45:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-11T00:15", expected_weekday: Friday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T00:00:00-05:00", end: "2026-12-11T00:00:00-05:00"}
      participants:
        candidate: {time_zone: Asia/Kolkata, available: [["2026-12-10T21:00:00+05:30", "2026-12-11T00:00:00+05:30"]]}
        int_shannon:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}
          busy: [["2026-12-10T09:00:00-05:00", "2026-12-10T12:15:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_shannon]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-10T12:15:00-05:00"}
      invalid_examples:
        - {S1: "2026-12-10T13:00:00-05:00", note: "Ends 12:15 a.m. Friday IST."}
      valid_start_bounds:
        S1: {earliest: "2026-12-10T12:15:00-05:00", latest: "2026-12-10T12:45:00-05:00"}

  - id: TZ-056
    title: Four-zone panel (San Francisco, London, Bengaluru, Sydney) has no common working hour
    category: cross_timezone
    subcategory: no_common_working_hour
    description: >-
      A 60-minute panel requires interviewers in San Francisco, London, Bengaluru and Sydney (all 9:00-17:00 local) and a
      Singapore candidate (9:00 a.m.-9:00 p.m. SGT). San Francisco's day starts when London's ends, so no instant is inside
      all four working days. The agent must report infeasibility and offer concrete alternatives: split into sub-panels,
      substitutes, or explicit after-hours consent - without deciding for anyone.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [four_zone_panel, no_common_hour, infeasible_with_options, split_panel, after_hours_consent]
    requirement_refs: [CON-11, SCH-04, SCH-05, AVL-10, CRD-01]
    inputs:
      now: "2027-01-25T10:00:00+08:00"
      recruiter: {id: rec_wen, name: Wen Hui Lim, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Nurul Aisyah binti Rahman
        time_zone: Asia/Singapore
        availability:
          - {start: "2027-02-02T09:00:00+08:00", end: "2027-02-02T21:00:00+08:00"}
          - {start: "2027-02-03T09:00:00+08:00", end: "2027-02-03T21:00:00+08:00"}
      interview_plan:
        name: Principal Product Manager, Global Payments - leadership panel
        sessions:
          - {id: P1, title: Leadership panel, format: virtual, duration_min: 60, interviewers: [int_sf, int_ldn, int_blr, int_syd], all_required: true}
      interviewers:
        - {id: int_sf, name: Jordan Whitlock, time_zone: America/Los_Angeles, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
        - {id: int_ldn, name: Amara Okonkwo, time_zone: Europe/London, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
        - {id: int_blr, name: Karthik Subramanian, time_zone: Asia/Kolkata, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
        - {id: int_syd, name: Hannah Mercer, time_zone: Australia/Sydney, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: All four leaders need to be on Nurul's panel on Tue 2 or Wed 3 Feb (her dates). Can you find an hour?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        No hour fits all four working days. San Francisco 9-5 PST is 17:00-01:00 UTC; London 9-5 GMT is 09:00-17:00 UTC;
        they never overlap. Options: (a) split into a London + Bengaluru sub-panel (fits 5:00-7:30 p.m. SGT = 9:00-11:30 a.m. GMT
        = 2:30-5:00 p.m. IST) and a San Francisco + Sydney sub-panel (needs the candidate before 9:00 a.m. SGT, e.g. 8:00 a.m. SGT
        = 4:00 p.m. PST previous day = 11:00 a.m. AEDT, only with her consent); (b) substitute closer-zone interviewers;
        (c) ask one interviewer to consent explicitly to after-hours time.
      must:
        - State clearly that no common working hour exists for the four required panelists and explain why with UTC ranges.
        - Offer at least two concrete alternatives with exact local times and dates for each person affected.
        - Mark any option outside someone's working or acceptable hours as requiring that person's explicit consent, gathered by the recruiter.
        - Not book anything.
      must_not:
        - Propose a full four-person panel time as valid.
        - Silently schedule someone outside their working hours or the candidate outside 9:00 a.m.-9:00 p.m. SGT.
        - Contact interviewers or the candidate.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-02-02T09:00:00Z", time_zone: Asia/Singapore, expected_local: "2027-02-02T17:00", expected_weekday: Tuesday}
      - {instant: "2027-02-02T09:00:00Z", time_zone: Asia/Kolkata, expected_local: "2027-02-02T14:30"}
      - {instant: "2027-02-02T00:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-02-01T16:00", expected_weekday: Monday, expected_utc_offset: "-08:00"}
      - {instant: "2027-02-02T00:00:00Z", time_zone: Australia/Sydney, expected_local: "2027-02-02T11:00", expected_utc_offset: "+11:00"}
      - {instant: "2027-02-02T00:00:00Z", time_zone: Asia/Singapore, expected_local: "2027-02-02T08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-02T00:00:00+08:00", end: "2027-02-04T00:00:00+08:00"}
      participants:
        candidate:
          time_zone: Asia/Singapore
          available: [["2027-02-02T09:00:00+08:00", "2027-02-02T21:00:00+08:00"], ["2027-02-03T09:00:00+08:00", "2027-02-03T21:00:00+08:00"]]
        int_sf: {time_zone: America/Los_Angeles, working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}}
        int_ldn: {time_zone: Europe/London, working_hours: {time_zone: Europe/London, start: "09:00", end: "17:00"}}
        int_blr: {time_zone: Asia/Kolkata, working_hours: {time_zone: Asia/Kolkata, start: "09:00", end: "17:00"}}
        int_syd: {time_zone: Australia/Sydney, working_hours: {time_zone: Australia/Sydney, start: "09:00", end: "17:00"}}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_sf, int_ldn, int_blr, int_syd]}
      expect_feasible: false
      invalid_examples:
        - {P1: "2027-02-02T17:00:00+08:00", note: "1:00 a.m. PST for Jordan and 8:00 p.m. AEDT for Hannah."}
        - {P1: "2027-02-03T08:00:00+08:00", note: "Before the candidate's 9:00 a.m. SGT; midnight in London."}

  - id: TZ-057
    title: San Francisco, New York and London panel has exactly one common hour - present one option, not three
    category: cross_timezone
    subcategory: exactly_one_common_hour
    description: >-
      In February, San Francisco (8:00-17:00 PST), New York (9:00-17:00 EST) and London (9:00-17:00 GMT) overlap only from
      16:00 to 17:00 UTC. For a 60-minute panel with a Chicago candidate free all day, exactly one start exists: 8:00 a.m. PST
      = 10:00 a.m. CST = 11:00 a.m. EST = 4:00 p.m. GMT. The agent should not pad the answer with invented alternatives on
      the same day.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [panel]
    tags: [three_zone_panel, exactly_one_hour, single_option, no_invented_alternatives]
    requirement_refs: [CON-11, SCH-02, AVL-10]
    inputs:
      now: "2027-02-02T09:00:00-06:00"
      recruiter: {id: rec_grace, name: Grace Holloway, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Malik Johnson
        time_zone: America/Chicago
        availability:
          - {start: "2027-02-09T08:00:00-06:00", end: "2027-02-09T17:00:00-06:00"}
      interview_plan:
        name: Staff ML Engineer - architecture panel
        sessions:
          - {id: P1, title: Architecture panel, format: virtual, duration_min: 60, interviewers: [int_sf, int_ny, int_ldn], all_required: true}
      interviewers:
        - {id: int_sf, name: Elena Vasquez, time_zone: America/Los_Angeles, availability_source: calendar, working_hours: {start: "08:00", end: "17:00"}, calendar: []}
        - {id: int_ny, name: Desmond Clarke, time_zone: America/New_York, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
        - {id: int_ldn, name: Freya Holmberg, time_zone: Europe/London, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: Give me three options on Tue Feb 9 for Malik's panel with Elena, Desmond and Freya.
    expected:
      disposition: propose_options
      solution_summary: >-
        Only one option on Tuesday, February 9, 2027: 8:00-9:00 a.m. PST = 10:00-11:00 a.m. CST = 11:00 a.m.-12:00 p.m. EST =
        4:00-5:00 p.m. GMT.
      must:
        - Present exactly one option on February 9 and explain that only one hour overlaps all three working days.
        - Show the time in all four zones.
        - Offer to look at other dates if the recruiter needs more choices, and ask whether to book.
      must_not:
        - Invent additional February 9 options outside someone's working hours.
        - Propose any start other than 16:00 UTC on February 9.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-02-09T16:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-02-09T08:00", expected_weekday: Tuesday}
      - {instant: "2027-02-09T16:00:00Z", time_zone: America/Chicago, expected_local: "2027-02-09T10:00"}
      - {instant: "2027-02-09T16:00:00Z", time_zone: America/New_York, expected_local: "2027-02-09T11:00"}
      - {instant: "2027-02-09T16:00:00Z", time_zone: Europe/London, expected_local: "2027-02-09T16:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-09T00:00:00-06:00", end: "2027-02-10T00:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2027-02-09T08:00:00-06:00", "2027-02-09T17:00:00-06:00"]]}
        int_sf: {time_zone: America/Los_Angeles, working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}}
        int_ny: {time_zone: America/New_York, working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}}
        int_ldn: {time_zone: Europe/London, working_hours: {time_zone: Europe/London, start: "09:00", end: "17:00"}}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_sf, int_ny, int_ldn]}
      expect_feasible: true
      valid_examples:
        - {P1: "2027-02-09T10:00:00-06:00"}
      invalid_examples:
        - {P1: "2027-02-09T10:30:00-06:00", note: "Ends 5:30 p.m. GMT."}
        - {P1: "2027-02-09T09:30:00-06:00", note: "7:30 a.m. PST, before Elena's day."}
      valid_start_bounds:
        P1: {earliest: "2027-02-09T10:00:00-06:00", latest: "2027-02-09T10:00:00-06:00"}

  - id: TZ-058
    title: Singapore candidate and New York interviewer have zero overlap within acceptable hours
    category: cross_timezone
    subcategory: acceptable_hours_fairness
    description: >-
      The candidate's acceptable hours are 8:00 a.m.-9:00 p.m. SGT; the interviewer works 8:00 a.m.-6:00 p.m. EST. In
      December these touch at a single instant (9:00 p.m. SGT = 8:00 a.m. EST) with no overlap. A 45-minute interview is
      infeasible without someone stepping outside their hours. The agent must not push the candidate to 7:00 a.m. or past
      9:00 p.m. silently; it should report infeasibility and lay out consent-based options for the recruiter.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [acceptable_hours, fairness, singapore, new_york, infeasible_with_options, consent_required]
    requirement_refs: [AVL-10, CON-05, SCH-04, SCH-05]
    inputs:
      now: "2026-12-02T09:00:00-05:00"
      recruiter: {id: rec_brooke, name: Brooke Lansing, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lim Jia Hui
        time_zone: Asia/Singapore
        acceptable_hours: {start: "08:00", end: "21:00", source: candidate statement}
        availability:
          - {start: "2026-12-09T08:00:00+08:00", end: "2026-12-09T21:00:00+08:00"}
          - {start: "2026-12-10T08:00:00+08:00", end: "2026-12-10T21:00:00+08:00"}
      interview_plan:
        name: Regional Compliance Manager - interview
        sessions:
          - {id: S1, title: Compliance interview, format: virtual, duration_min: 45, interviewers: [int_paul]}
      interviewers:
        - {id: int_paul, name: Paul Esposito, time_zone: America/New_York, availability_source: calendar, working_hours: {start: "08:00", end: "18:00"}, calendar: []}
      conversation:
        - role: candidate
          channel: email
          text: Any time between 8am and 9pm Singapore time on Wed 9 or Thu 10 Dec works.
        - role: recruiter
          text: Find something for Jia Hui with Paul. Early morning for her is probably fine.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        No 45-minute slot fits both: 9:00 p.m. SGT (end of her hours) is exactly 8:00 a.m. EST (start of his). Consent-based
        options: Paul starts at 7:15 a.m. EST (8:15-9:00 p.m. SGT), or the candidate agrees to 9:00-9:45 p.m. SGT (8:00-8:45 a.m.
        EST), or an APAC-based interviewer substitutes. An early-morning SGT slot (e.g. 7:00 a.m. SGT = 6:00 p.m. EST) is outside
        both people's hours.
      must:
        - Report that no slot exists within both stated hour ranges on December 9-10, 2026, with the conversion that shows why.
        - List consent-based options with exact times for each side and say who must agree (via the recruiter).
        - Point out that "early morning for her" is outside the candidate's own stated 8:00 a.m. start and also outside Paul's hours.
      must_not:
        - Propose any time before 8:00 a.m. or after 9:00 p.m. SGT as if the candidate had agreed.
        - Propose any time outside Paul's 8:00 a.m.-6:00 p.m. EST as if he had agreed.
        - Contact either person or book.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-09T13:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-09T21:00", expected_weekday: Wednesday}
      - {instant: "2026-12-09T13:00:00Z", time_zone: America/New_York, expected_local: "2026-12-09T08:00", expected_utc_offset: "-05:00"}
      - {instant: "2026-12-09T12:15:00Z", time_zone: America/New_York, expected_local: "2026-12-09T07:15"}
      - {instant: "2026-12-09T23:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-10T07:00", expected_weekday: Thursday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T00:00:00+08:00", end: "2026-12-11T00:00:00+08:00"}
      participants:
        candidate:
          time_zone: Asia/Singapore
