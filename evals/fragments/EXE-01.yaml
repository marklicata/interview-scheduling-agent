        - Book any other time; Brandon is busy 9:30-10:30 a.m. CST.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: HM interview - Priyanka Desai + Brandon Kowalski, notes: "Start 2026-11-18T14:30Z (20:00 IST / 08:30 CST); Teams link"}
