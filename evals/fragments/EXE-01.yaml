        - {id: int_sun, name: Sun-hee Kang, time_zone: America/Toronto, availability_source: calendar, calendar: []}
      policies: {organizer: recruiting@contoso.example, idempotency_key_format: "<requisition>-<session>-<start>"}
      conversation:
        - role: agent
          at: "2026-11-18T09:10:00-05:00"
          text: >-
            Kwame's loop on Monday, November 23, 2026 (EST): Technical with Marc 10:00-11:00 a.m., Manager with Sun-hee
            11:15 a.m.-12:00 p.m., separate Teams invitations from recruiting@contoso.example. Want me to book it?
        - role: recruiter
          at: "2026-11-18T09:12:00-05:00"
          text: "yes"
          confirmation: true
      tool_results:
        - {action: create_event, session: S1, idempotency_key: REQ-6610-S1-20261123T1000, status: timeout, at: "2026-11-18T09:12:31-05:00", detail: "Request timed out after 30 s; no response body."}
        - {action: query_events, session: S1, status: success, at: "2026-11-18T09:13:05-05:00", detail: "1 event found with transactionId REQ-6610-S1-20261123T1000 - 10:00-11:00 a.m. EST, attendees Kwame Asante and Marc Lefebvre, Teams link present, created 09:12:29."}
        - {action: create_event, session: S2, status: not_attempted, detail: "Execution paused after S1 timeout."}
    expected:
      disposition: book
      solution_summary: S1 already exists (verified by lookup); create only S2 on Monday, November 23, 2026, 11:15 a.m.-12:00 p.m. EST and report both as sent.
      must:
        - Treat S1 as created based on the lookup and do not create it again.
        - Create S2 once, 11:15 a.m.-12:00 p.m. EST on November 23, with Kwame and Sun-hee and a Teams link.
