      - {instant: "2026-11-18T14:30:00Z", time_zone: America/Chicago, expected_local: "2026-11-18T08:30", expected_utc_offset: "-06:00"}
      - {instant: "2026-11-18T14:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-18T06:30", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
