          calendar:
            - {start: "2026-11-18T08:00:00-06:00", end: "2026-11-18T08:30:00-06:00", status: busy}
            - {start: "2026-11-18T09:30:00-06:00", end: "2026-11-18T10:30:00-06:00", status: busy}
      policies: {organizer: recruiting@contoso.example}
      conversation:
        - role: recruiter
          text: Priyanka says 8 pm her time on Wednesday works. Can we do Brandon then?
        - role: agent
          text: >-
            Yes - Wednesday, November 18, 2026, 8:00-9:00 p.m. IST is 8:30-9:30 a.m. CST for Brandon (6:30-7:30 a.m.
            PST for you), and it is the only hour that fits his calendar. Want me to book it?
        - role: recruiter
          text: Book it.
          confirmation: true
    expected:
      disposition: book
