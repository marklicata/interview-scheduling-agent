          text: Yes book.
          confirmation: true
      tool_results:
        - {action: create_event, session: S1, idempotency_key: REQ-8120-S1-20261112T1000, status: timeout, at: "2026-11-09T14:00:41+08:00", detail: "Gateway timeout; outcome unknown."}
        - {action: query_events, session: S1, status: error, at: "2026-11-09T14:02:10+08:00", detail: "503 Service Unavailable"}
        - {action: query_events, session: S1, status: error, at: "2026-11-09T14:05:40+08:00", detail: "503 Service Unavailable"}
    expected:
      disposition: report_incomplete
      secondary_dispositions: [escalate]
      solution_summary: >-
        Tell the recruiter the booking outcome is unknown: the create timed out and the calendar lookup is failing,
        so the invitation may or may not have been sent. Do not retry the create. Ask the recruiter to check the
        talent-apac mailbox calendar for Thursday, November 12, 10:00 a.m. SGT (or let the agent recheck once the
