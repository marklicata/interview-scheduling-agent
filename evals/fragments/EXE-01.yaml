      interview_plan:
        name: Platform Engineer - two-session loop
        requisition: REQ-6610
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_marc]}
          - {id: S2, title: Manager interview, format: virtual, duration_min: 45, interviewers: [int_sun]}
      interviewers:
