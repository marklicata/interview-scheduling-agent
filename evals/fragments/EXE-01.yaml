  - id: EXE-012
    title: Calendar API throttled with Retry-After - back off, report the delay, finish the remaining sessions
    category: execution_and_recovery
    subcategory: throttling_backoff
    description: >-
      Mid-execution of a confirmed three-session loop, S1 succeeded and S2 returned HTTP 429 with Retry-After 120
      seconds. Fifteen seconds have passed. Correct behavior honors the back-off, tells the recruiter what is sent and
      what is pending, then creates S2 and S3 once each after the wait. Failing behaviors are hammering the API,
      reporting the loop as booked, or skipping S2/S3.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [throttling, http_429, retry_after, honest_status, colombia, mexico]
    requirement_refs: [ACT-05, ACT-12, COM-03]
    inputs:
      now: "2026-12-01T08:15:20-05:00"
      recruiter: {id: rec_valentina, name: Valentina Gómez, time_zone: America/Bogota}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Diego Herrera
        email: diego.herrera@example.com
        time_zone: America/Bogota
        availability:
          - {start: "2026-12-03T08:30:00-05:00", end: "2026-12-03T12:30:00-05:00"}
      interview_plan:
        name: Sales Engineer - virtual loop
        sessions:
          - {id: S1, title: Technical discovery, format: virtual, duration_min: 45, interviewers: [int_lucia]}
          - {id: S2, title: Demo, format: virtual, duration_min: 45, interviewers: [int_andres]}
          - {id: S3, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_camila]}
      interviewers:
        - {id: int_lucia, name: Lucía Ramírez, time_zone: America/Mexico_City, availability_source: calendar, calendar: []}
        - {id: int_andres, name: Andrés Castillo, time_zone: America/Bogota, availability_source: calendar, calendar: []}
        - {id: int_camila, name: Camila Restrepo, time_zone: America/Bogota, availability_source: calendar, calendar: []}
      policies: {organizer: talento-latam@contoso.example, throttling: "Honor Retry-After; never retry sooner."}
      conversation:
        - role: agent
          at: "2026-12-01T08:10:00-05:00"
          text: >-
            Diego's loop on Thursday, December 3, 2026 (COT): Technical discovery 9:00-9:45 a.m. with Lucía (8:00-8:45
            a.m. CST in Mexico City), Demo 10:00-10:45 with Andrés, Hiring manager 11:00-11:45 with Camila. Want me to
            book it?
        - role: recruiter
          at: "2026-12-01T08:14:50-05:00"
          text: Sí, book it.
          confirmation: true
      tool_results:
        - {action: create_event, session: S1, status: success, event_id: evt_b1, at: "2026-12-01T08:15:02-05:00"}
        - {action: create_event, session: S2, status: throttled, at: "2026-12-01T08:15:05-05:00", detail: "HTTP 429 Too Many Requests; Retry-After 120"}
        - {action: create_event, session: S3, status: not_attempted}
    expected:
      disposition: book
      secondary_dispositions: [report_incomplete]
      solution_summary: >-
        Tell Valentina that S1 is sent, S2 and S3 are pending because the calendar service is throttling, and that the
        agent will retry no earlier than 8:17:05 a.m. COT. After the back-off, create S2 (10:00-10:45 a.m. COT) and S3
        (11:00-11:45 a.m. COT) once each, then report final per-session status.
      must:
        - Wait at least 120 seconds after 8:15:05 a.m. COT before retrying S2.
        - Report now that S1 is sent and S2/S3 are not yet created, with the expected retry time.
        - Create S2 and S3 once each after the back-off and then report their status.
      must_not:
        - Retry S2 before the Retry-After interval elapses.
        - Report the loop as booked while S2 and S3 are pending.
        - Recreate S1.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S2 Demo - Diego Herrera + Andrés Castillo, notes: "Only after Retry-After; 2026-12-03 10:00-10:45 COT"}
          - {type: create_event, target: S3 Hiring manager - Diego Herrera + Camila Restrepo, notes: "2026-12-03 11:00-11:45 COT"}
    local_time_checks:
      - {instant: "2026-12-03T14:00:00Z", time_zone: America/Mexico_City, expected_local: "2026-12-03T08:00", expected_weekday: Thursday, expected_utc_offset: "-06:00"}
      - {instant: "2026-12-03T14:00:00Z", time_zone: America/Bogota, expected_local: "2026-12-03T09:00", expected_utc_offset: "-05:00"}

