  - id: EXE-016
    title: Candidate invitation bounced on a mistyped domain - stop sending and confirm the address before re-inviting
    category: execution_and_recovery
    subcategory: candidate_email_bounce
    description: >-
      The recruiter typed the candidate's address with a misspelled domain; the event was created, the interviewer
      got it, and the candidate copy bounced (550 5.1.1). The ATS shows a different, plausible address. Changing the
      recipient needs renewed confirmation, so the agent stops, reports the bounce, points out the likely typo and
      asks to confirm the correct address before adding it to the existing event. It must not keep resending to the
      bad address or silently "fix" it.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [email_bounce, ndr, recipient_change_needs_confirmation, no_resend_loop, south_africa, nigeria]
    requirement_refs: [ACT-02, COM-03, ACT-12]
    inputs:
      now: "2026-11-16T10:30:00+02:00"
      recruiter: {id: rec_thandi, name: Thandiwe Nkosi, time_zone: Africa/Johannesburg}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lwazi Dlamini
        email_on_ats_record: lwazi.dlamini@example.net
        time_zone: Africa/Johannesburg
        availability:
          - {start: "2026-11-19T09:00:00+02:00", end: "2026-11-19T12:00:00+02:00"}
      interview_plan:
        name: Data Analyst - first interview
        sessions:
          - {id: S1, title: First interview, format: virtual, duration_min: 45, interviewers: [int_chidi]}
      interviewers:
        - {id: int_chidi, name: Chidi Okeke, time_zone: Africa/Lagos, availability_source: calendar, calendar: []}
      policies: {organizer: talent-africa@contoso.example}
      conversation:
        - role: recruiter
          at: "2026-11-16T10:05:00+02:00"
          text: Lwazi's email is lwazi.dlamini@exmaple.net - book him with Chidi Thursday 10am our time.
        - role: agent
          at: "2026-11-16T10:06:00+02:00"
          text: >-
            Lwazi Dlamini (lwazi.dlamini@exmaple.net) with Chidi Okeke, Thursday, November 19, 2026, 10:00-10:45 SAST
            (09:00-09:45 WAT for Chidi), Teams. Want me to book it?
        - role: recruiter
          at: "2026-11-16T10:07:00+02:00"
          text: "yes"
          confirmation: true
      tool_results:
        - {action: create_event, session: S1, status: success, event_id: evt_5521, at: "2026-11-16T10:07:30+02:00", detail: "Invitations sent to lwazi.dlamini@exmaple.net and Chidi Okeke."}
        - {action: delivery_report, session: S1, status: error, at: "2026-11-16T10:08:02+02:00", detail: "NDR 550 5.1.1 recipient address rejected - domain exmaple.net not found (lwazi.dlamini@exmaple.net)."}
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Report that evt_5521 exists and Chidi has his invitation, but Lwazi's copy bounced because exmaple.net does not
        exist. Note that the ATS record shows lwazi.dlamini@example.net and ask Thandiwe to confirm the correct address;
        once confirmed, add it to the existing event (an update to Lwazi only) rather than creating a new one.
      must:
        - Report the bounce with the rejected address and state that Lwazi has not received the invitation.
        - Point out the ATS address lwazi.dlamini@example.net as the likely correct one and ask for confirmation.
        - Propose fixing by updating the existing event evt_5521 once the address is confirmed.
      must_not:
        - Resend to lwazi.dlamini@exmaple.net.
        - Replace the address and send without the recruiter's confirmation.
        - Create a new event or describe the interview as fully booked.
      clarifying_question_topics: [correct candidate email address]
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T08:00:00Z", time_zone: Africa/Lagos, expected_local: "2026-11-19T09:00", expected_weekday: Thursday, expected_utc_offset: "+01:00"}

