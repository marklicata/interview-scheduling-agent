# Execution and recovery cases, part 1 (EXE-001 to EXE-026).
test_cases:
  - id: EXE-001
    title: Book a confirmed four-session virtual loop as four separate invitations, each with its own Teams link
    category: execution_and_recovery
    subcategory: one_invite_per_session
    description: >-
      The recruiter confirmed a reviewed four-session virtual loop. The plan's invitation policy is one Outlook event
      per session, each with its own Teams meeting and only that session's interviewer plus the candidate. A
      pre-booking recheck shows nothing changed. Tests that execution creates exactly four events (not one combined
      event, not duplicates), uses the authorized organizer, keeps every attendee's zone right, and reports "sent"
      rather than "accepted".
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, technical_coding, system_design, hiring_manager]
    tags: [per_session_invites, teams_link_per_session, confirmed_booking, recheck_before_booking, four_time_zones]
    requirement_refs: [ACT-01, ACT-05, ACT-07, COM-06]
    inputs:
      now: "2026-11-12T11:00:00-06:00"
      recruiter: {id: rec_tomas, name: Tomás Rivera, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aisha Bello
        email: aisha.bello@example.net
        time_zone: America/New_York
        availability:
          - {start: "2026-11-17T10:00:00-05:00", end: "2026-11-17T16:00:00-05:00"}
      interview_plan:
        name: Senior Data Scientist - virtual loop
        requisition: REQ-5120
        region: US
        sessions:
          - {id: S1, title: Statistics deep dive, format: virtual, duration_min: 45, interviewers: [int_lena], order: 1}
          - {id: S2, title: Coding, format: virtual, duration_min: 45, interviewers: [int_raj], order: 2}
          - {id: S3, title: ML system design, format: virtual, duration_min: 45, interviewers: [int_sofia], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_kenji], order: 4}
        rules: {same_day: true, break_between_sessions_min: 10, max_gap_between_sessions_min: 60}
      interviewers:
        - {id: int_lena, name: Lena Hoffmann, email: lena.hoffmann@contoso.example, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-17T11:00:00-06:00", end: "2026-11-17T12:00:00-06:00", status: busy}]}
        - {id: int_raj, name: Raj Malhotra, email: raj.malhotra@contoso.example, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-11-17T08:00:00-07:00", end: "2026-11-17T10:00:00-07:00", status: busy}]}
        - {id: int_sofia, name: Sofia Marchetti, email: sofia.marchetti@contoso.example, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-17T08:00:00-08:00", end: "2026-11-17T10:30:00-08:00", status: busy}]}
        - {id: int_kenji, name: Kenji Mori, email: kenji.mori@contoso.example, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-17T12:00:00-06:00", end: "2026-11-17T13:30:00-06:00", status: busy}]}
      policies:
        organizer: recruiting@contoso.example
        invite_strategy: one_event_per_session
        teams_link_strategy: one_meeting_per_session
        candidate_event_subject: "Contoso interview - <session title>"
      case_state:
        prior_proposals:
          - id: P1
            proposed_at: "2026-11-12T10:40:00-06:00"
            sessions:
              - {session: S1, start: "2026-11-17T10:00:00-06:00", end: "2026-11-17T10:45:00-06:00"}
              - {session: S2, start: "2026-11-17T11:00:00-06:00", end: "2026-11-17T11:45:00-06:00"}
              - {session: S3, start: "2026-11-17T12:30:00-06:00", end: "2026-11-17T13:15:00-06:00"}
              - {session: S4, start: "2026-11-17T13:30:00-06:00", end: "2026-11-17T14:15:00-06:00"}
      tool_results:
        - {action: recheck_availability, status: success, at: "2026-11-12T10:59:30-06:00", detail: "Candidate window and all four interviewer calendars unchanged since proposal P1."}
      conversation:
        - role: agent
          at: "2026-11-12T10:40:00-06:00"
          text: >-
            Proposed loop for Aisha Bello on Tuesday, November 17, 2026 (CST / Aisha's EST): Statistics with Lena
            10:00-10:45 a.m. CST (11:00-11:45 a.m. EST); Coding with Raj 11:00-11:45 a.m. CST (12:00-12:45 p.m. EST);
            ML system design with Sofia 12:30-1:15 p.m. CST (1:30-2:15 p.m. EST); Hiring manager with Kenji
            1:30-2:15 p.m. CST (2:30-3:15 p.m. EST). Each session gets its own Outlook invitation and Teams link from
            recruiting@contoso.example. Want me to book it?
        - role: recruiter
          at: "2026-11-12T10:58:00-06:00"
          text: Yes, book all four as proposed.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Create four Outlook events from recruiting@contoso.example on Tuesday, November 17, 2026 - 10:00, 11:00,
        12:30 and 1:30 p.m. CST (11:00 a.m., 12:00, 1:30 and 2:30 p.m. EST), 45 minutes each - each with Aisha and
        only that session's interviewer and its own Teams link, then report four invitations sent and responses pending.
      must:
        - Create exactly four events, one per session, at the confirmed times (10:00, 11:00, 12:30, 1:30 p.m. CST).
        - Put only the candidate and that session's interviewer on each event and generate a distinct Teams meeting for each.
        - Use recruiting@contoso.example as organizer for all four events.
        - Report each session as invitation sent with responses pending, listing times in EST for Aisha and in each interviewer's own zone.
      must_not:
        - Create one combined event for the whole loop or put all four interviewers on every event.
        - Create more than one event for any session.
        - Describe the loop as confirmed or accepted.
        - Use the recruiter's personal calendar as organizer.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 Statistics deep dive - Aisha Bello + Lena Hoffmann, notes: "2026-11-17 10:00-10:45 CST; own Teams link"}
          - {type: create_event, target: S2 Coding - Aisha Bello + Raj Malhotra, notes: "11:00-11:45 CST (10:00-10:45 MST); own Teams link"}
          - {type: create_event, target: S3 ML system design - Aisha Bello + Sofia Marchetti, notes: "12:30-1:15 p.m. CST (10:30-11:15 a.m. PST); own Teams link"}
          - {type: create_event, target: S4 Hiring manager - Aisha Bello + Kenji Mori, notes: "1:30-2:15 p.m. CST; own Teams link"}
    local_time_checks:
      - {instant: "2026-11-17T16:00:00Z", time_zone: America/New_York, expected_local: "2026-11-17T11:00", expected_weekday: Tuesday, expected_utc_offset: "-05:00"}
      - {instant: "2026-11-17T17:00:00Z", time_zone: America/Denver, expected_local: "2026-11-17T10:00", expected_utc_offset: "-07:00"}
      - {instant: "2026-11-17T18:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T10:30", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T08:00:00-06:00", end: "2026-11-17T17:00:00-06:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-11-17T10:00:00-05:00", "2026-11-17T16:00:00-05:00"]]}
        int_lena: {time_zone: America/Chicago, busy: [["2026-11-17T11:00:00-06:00", "2026-11-17T12:00:00-06:00"]]}
        int_raj: {time_zone: America/Denver, busy: [["2026-11-17T08:00:00-07:00", "2026-11-17T10:00:00-07:00"]]}
        int_sofia: {time_zone: America/Los_Angeles, busy: [["2026-11-17T08:00:00-08:00", "2026-11-17T10:30:00-08:00"]]}
        int_kenji: {time_zone: America/Chicago, busy: [["2026-11-17T12:00:00-06:00", "2026-11-17T13:30:00-06:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_lena]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_raj]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_sofia]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_kenji]}
      constraints:
        order: [S1, S2, S3, S4]
        min_gap_min: 10
        max_gap_min: 60
        same_local_day: {time_zone: America/New_York}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-17T10:00:00-06:00", S2: "2026-11-17T11:00:00-06:00", S3: "2026-11-17T12:30:00-06:00", S4: "2026-11-17T13:30:00-06:00"}
      invalid_examples:
        - {S1: "2026-11-17T10:00:00-06:00", S2: "2026-11-17T11:00:00-06:00", S3: "2026-11-17T12:00:00-06:00", S4: "2026-11-17T13:30:00-06:00", note: S3 overlaps Sofia's busy block until 10:30 a.m. PST.}
    grading_notes: The oracle confirms the reviewed schedule is still valid at execution time; grade mostly on the number and shape of events created.

  - id: EXE-002
    title: Single-itinerary policy - one candidate itinerary event plus internal per-session events
    category: execution_and_recovery
    subcategory: single_itinerary_candidate_invite
    description: >-
      A UK team's policy says the candidate receives exactly one calendar invitation covering the whole loop with an
      agenda that lists each session and its Teams link, while interviewers receive internal per-session events
      without the candidate. The tempting wrong answers are sending the candidate four invitations (itinerary plus
      three per-session) or adding the candidate to the internal events, which produces duplicates on her calendar.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, portfolio_review, hiring_manager]
    tags: [single_itinerary, internal_vs_candidate_events, no_duplicate_candidate_invites, uk, berlin_interviewer]
    requirement_refs: [ACT-03, COM-01, COM-02, COM-06]
    inputs:
      now: "2026-11-13T15:00:00+00:00"
      recruiter: {id: rec_harriet, name: Harriet Okoye, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Freya Lindgren
        email: freya.lindgren@example.org
        time_zone: Europe/London
        availability:
          - {start: "2026-11-19T09:30:00+00:00", end: "2026-11-19T15:00:00+00:00"}
      interview_plan:
        name: Product Designer - virtual loop
        region: UK
        sessions:
          - {id: S1, title: Portfolio review, format: virtual, duration_min: 60, interviewers: [int_hanna]}
          - {id: S2, title: Design exercise debrief, format: virtual, duration_min: 45, interviewers: [int_oisin]}
          - {id: S3, title: Hiring manager conversation, format: virtual, duration_min: 45, interviewers: [int_mei]}
      interviewers:
        - {id: int_hanna, name: Hanna Vogel, time_zone: Europe/Berlin, availability_source: calendar, calendar: []}
        - {id: int_oisin, name: Oisín Walsh, time_zone: Europe/London, availability_source: calendar, calendar: []}
        - {id: int_mei, name: Mei Chen, time_zone: Europe/London, availability_source: calendar, calendar: []}
      policies:
        organizer: talent-uk@contoso.example
        candidate_invite_mode: >-
          single_itinerary_event - the candidate receives exactly one invitation spanning the first start to the last
          end, titled "Contoso interviews - Product Designer", whose body lists each session (time in the candidate's
          zone, interviewer name and role, and that session's Teams link). Interviewers receive one internal event per
          session with that session's Teams meeting; the candidate is never an attendee on internal events.
        teams_link_strategy: one_meeting_per_session
      conversation:
        - role: agent
          at: "2026-11-13T14:40:00+00:00"
          text: >-
            Ready to book Freya's loop on Thursday, November 19, 2026 (GMT): Portfolio review with Hanna 10:00-11:00
            (11:00-12:00 CET for Hanna), Design exercise debrief with Oisín 11:15-12:00, break, Hiring manager with Mei
            13:00-13:45. Per the UK itinerary policy Freya gets one itinerary invitation 10:00-13:45 GMT listing all
            three sessions and links; Hanna, Oisín and Mei each get an internal event for their session. Want me to
            book it?
        - role: recruiter
          at: "2026-11-13T14:58:00+00:00"
          text: go ahead
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Create one candidate itinerary event (Thursday, November 19, 2026, 10:00-13:45 GMT) listing the three sessions
        with their Teams links, plus three internal per-session events (10:00-11:00 with Hanna, 11:15-12:00 with Oisín,
        13:00-13:45 with Mei), each with its own Teams meeting, from talent-uk@contoso.example.
      must:
        - Send Freya exactly one invitation, 10:00-13:45 GMT on November 19, whose agenda lists all three sessions with GMT times and the matching Teams links.
        - Create three internal events, one per session, each containing only that session's interviewer and a Teams meeting whose link matches the itinerary entry.
        - Show the 12:00-13:00 gap as a break in the itinerary, not as an interview.
        - Report that invitations were sent and responses are pending.
      must_not:
        - Add Freya as an attendee on any internal per-session event.
        - Send Freya separate per-session invitations in addition to the itinerary.
        - List Hanna's session as 11:00 GMT in the itinerary (11:00 is her CET local time).
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Candidate itinerary - Freya Lindgren, notes: "2026-11-19 10:00-13:45 GMT; agenda with three sessions and links"}
          - {type: create_event, target: Internal S1 Portfolio review - Hanna Vogel, notes: "10:00-11:00 GMT (11:00-12:00 CET); Teams meeting A"}
          - {type: create_event, target: Internal S2 Design exercise debrief - Oisín Walsh, notes: "11:15-12:00 GMT; Teams meeting B"}
          - {type: create_event, target: Internal S3 Hiring manager - Mei Chen, notes: "13:00-13:45 GMT; Teams meeting C"}
    local_time_checks:
      - {instant: "2026-11-19T10:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-19T11:00", expected_weekday: Thursday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-19T10:00:00Z", time_zone: Europe/London, expected_local: "2026-11-19T10:00", expected_utc_offset: "+00:00"}
    grading_notes: Count candidate-facing invitations - exactly one is correct under this policy.

  - id: EXE-003
    title: Phone screen booked with conference-bridge details and the tenant's default Teams link turned off
    category: execution_and_recovery
    subcategory: phone_details_not_teams
    description: >-
      A confirmed 30-minute phone screen must carry the org's phone bridge details. The tenant adds a Teams meeting
      to every new event by default, so the agent must explicitly create the event without a Teams link. Interviewer
      is in Arizona (no DST) and candidate in Colorado; both are UTC-7 in November, which should not confuse the
      times.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [phone_bridge, no_teams_for_phone, tenant_default_override, arizona_no_dst]
    requirement_refs: [COM-02, COM-06, ACT-01]
    inputs:
      now: "2026-11-09T09:00:00-07:00"
      recruiter: {id: rec_dana, name: Dana Whitehorse, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Luis Romero
        email: luis.romero@example.com
        phone: "+1 720 555 0188"
        time_zone: America/Denver
        availability:
          - {start: "2026-11-12T13:00:00-07:00", end: "2026-11-12T16:00:00-07:00"}
      interview_plan:
        name: Field Service Technician - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_carmen]}
      interviewers:
        - {id: int_carmen, name: Carmen Begay, time_zone: America/Phoenix, availability_source: calendar,
           calendar: [{start: "2026-11-12T13:00:00-07:00", end: "2026-11-12T14:00:00-07:00", status: busy}]}
      policies:
        organizer: recruiting@contoso.example
        phone_screen_logistics: "Use the Contoso conference bridge +1 425 555 0142, conference ID 8812 4407#. Phone screens never include a Teams meeting."
        tenant_defaults: {add_online_meeting_to_all_events: true}
      conversation:
        - role: agent
          text: >-
            Luis Romero / Carmen Begay phone screen: Thursday, November 12, 2026, 2:00-2:30 p.m. MST (same clock time
            for Carmen in Arizona). Dial-in +1 425 555 0142, conference ID 8812 4407#. Want me to book it?
        - role: recruiter
          text: Yep, book it.
          confirmation: true
    expected:
      disposition: book
      solution_summary: Create one 30-minute event on Thursday, November 12, 2026, 2:00-2:30 p.m. MST with the bridge number and conference ID and no Teams meeting.
      must:
        - Create one event 2:00-2:30 p.m. MST on November 12 with Luis and Carmen from recruiting@contoso.example.
        - Put the bridge number +1 425 555 0142 and conference ID 8812 4407# in the location/body.
        - Explicitly disable the default online meeting so no Teams link is attached.
        - Report that the invitation was sent, not accepted.
      must_not:
        - Attach a Teams link or describe the interview as a video call.
        - Shift the time by an hour because Arizona does not observe daylight saving time.
        - Create more than one event.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Phone screen - Luis Romero + Carmen Begay, notes: "2026-11-12 2:00-2:30 p.m. MST; bridge details; isOnlineMeeting false"}
    local_time_checks:
      - {instant: "2026-11-12T21:00:00Z", time_zone: America/Phoenix, expected_local: "2026-11-12T14:00", expected_weekday: Thursday, expected_utc_offset: "-07:00"}
      - {instant: "2026-11-12T21:00:00Z", time_zone: America/Denver, expected_local: "2026-11-12T14:00", expected_utc_offset: "-07:00"}

  - id: EXE-004
    title: Hybrid onsite - venue details for in-person sessions and a Teams link only on the remote-interviewer session
    category: execution_and_recovery
    subcategory: venue_and_hybrid_logistics
    description: >-
      Three-session onsite in Redmond where the middle session's interviewer joins remotely from New York. In-person
      events need building, room and lobby check-in details and no Teams link; the hybrid session needs both the room
      and a Teams link. The recruiter already reserved the room through facilities (the agent does not book rooms).
      Tests per-session logistics and correct New York local time for the remote interviewer.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hybrid_loop, in_person_loop]
    tags: [venue_details, hybrid_session, remote_interviewer, room_supplied_by_recruiter, per_session_logistics]
    requirement_refs: [COM-02, COM-06, ACT-05]
    inputs:
      now: "2026-12-02T10:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Noah Feldman
        email: noah.feldman@example.com
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-08T09:00:00-08:00", end: "2026-12-08T13:00:00-08:00"}
      interview_plan:
        name: Hardware Test Engineer - onsite
        venue: {site: Contoso Redmond campus, building: Building 41, room: Room 2201, lobby_instructions: "Check in at Building 41 lobby reception with photo ID 15 minutes early."}
        sessions:
          - {id: S1, title: Lab practical, format: in_person, duration_min: 45, interviewers: [int_ola], order: 1}
          - {id: S2, title: Test strategy, format: hybrid, duration_min: 45, interviewers: [int_dmitri], order: 2, notes: Candidate stays in Room 2201; Dmitri joins by Teams from New York.}
          - {id: S3, title: Team lead, format: in_person, duration_min: 45, interviewers: [int_yuki], order: 3}
        rules: {min_break_between_sessions_min: 15}
      interviewers:
        - {id: int_ola, name: Ola Nordmann, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-08T10:30:00-08:00", end: "2026-12-08T12:00:00-08:00", status: busy}]}
        - id: int_dmitri
          name: Dmitri Volkov
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-12-08T12:00:00-05:00", end: "2026-12-08T13:30:00-05:00", status: busy}
        - {id: int_yuki, name: Yuki Tanaka, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-08T09:00:00-08:00", end: "2026-12-08T11:30:00-08:00", status: busy}]}
      policies:
        organizer: recruiting@contoso.example
        in_person_events: Location = building + room + site address; body includes lobby instructions; no Teams link.
        hybrid_events: Location = room; include a Teams link for the remote participant.
        room_booking: Recruiter reserves rooms through facilities; the agent does not book rooms.
      case_state:
        room_reservation: {room: Building 41 Room 2201, reserved_by: rec_maya, reference: FAC-22841, start: "2026-12-08T09:00:00-08:00", end: "2026-12-08T13:00:00-08:00"}
      conversation:
        - role: agent
          text: >-
            Noah's onsite on Tuesday, December 8, 2026 (PST): Lab practical with Ola 9:30-10:15 a.m. in Building 41
            Room 2201; Test strategy with Dmitri 10:30-11:15 a.m. (1:30-2:15 p.m. EST for Dmitri, joining by Teams;
            Noah stays in Room 2201); Team lead with Yuki 11:30 a.m.-12:15 p.m. in Room 2201. Want me to book it?
        - role: recruiter
          text: Looks right - book it please.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Create three events on Tuesday, December 8, 2026 - S1 9:30-10:15 a.m. PST and S3 11:30 a.m.-12:15 p.m. PST in
        Building 41 Room 2201 with lobby instructions and no Teams link; S2 10:30-11:15 a.m. PST (1:30-2:15 p.m. EST)
        located in Room 2201 with a Teams link for Dmitri.
      must:
        - Create exactly three events at the confirmed times from recruiting@contoso.example.
        - Give S1 and S3 the building, room and lobby check-in instructions and no Teams link.
        - Give S2 both the room location and a Teams link, and show Dmitri's time as 1:30-2:15 p.m. EST.
        - Report invitations as sent, with responses pending.
      must_not:
        - Attach Teams links to the in-person sessions or omit the Teams link from the hybrid session.
        - Book or modify the room reservation (rooms are recruiter-owned in the MVP).
        - Tell Noah to join S2 remotely.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 Lab practical - Noah Feldman + Ola Nordmann, notes: "9:30-10:15 a.m. PST; Building 41 Room 2201; no Teams link"}
          - {type: create_event, target: S2 Test strategy - Noah Feldman + Dmitri Volkov, notes: "10:30-11:15 a.m. PST; Room 2201 + Teams link"}
