      tool_results:
        - {action: create_online_meeting, session: S1, status: error, at: "2026-11-12T11:18:40+01:00", detail: "500 TeamsMeetingProvisioningFailed"}
        - {action: create_online_meeting, session: S1, status: error, at: "2026-11-12T11:19:50+01:00", detail: "500 TeamsMeetingProvisioningFailed"}
