  - id: EXE-036
    title: Move only S3 inside a booked loop; every other session and invitation stays untouched
    category: execution_and_recovery
    subcategory: reschedule_one_session_in_loop
    description: >-
      An interviewer gained a mandatory all-hands over his session. Only S3 must move; S1, S2 and S4 are fixed. With
      plan order, 15-120 minute breaks and the candidate's lunch gap, S3 can only start between 12:45 and 1:00 p.m.
      SGT. The recruiter confirmed 12:45. Execution updates evt_s3 alone; sending "updated" notices for unchanged
      sessions or recreating the loop is wrong.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [partial_reschedule, preserve_unaffected_sessions, ordered_loop, singapore]
    requirement_refs: [CHG-01, ACT-03, ACT-05]
    inputs:
      now: "2027-01-07T15:00:00+08:00"
      recruiter: {id: rec_weijie, name: Lim Wei Jie, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Nur Aisyah
        email: nur.aisyah@example.com
        time_zone: Asia/Singapore
        availability:
          - {start: "2027-01-12T09:00:00+08:00", end: "2027-01-12T12:15:00+08:00"}
          - {start: "2027-01-12T12:45:00+08:00", end: "2027-01-12T17:00:00+08:00"}
      interview_plan:
        name: Cloud Solutions Architect - virtual loop
        sessions:
          - {id: S1, title: Architecture fundamentals, format: virtual, duration_min: 45, interviewers: [int_ana], order: 1}
          - {id: S2, title: Migration case, format: virtual, duration_min: 45, interviewers: [int_ben], order: 2}
          - {id: S3, title: Security design, format: virtual, duration_min: 45, interviewers: [int_daniel], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_hm], order: 4}
        rules: {break_between_sessions_min: 15, max_gap_between_sessions_min: 120, same_day: true}
      interviewers:
        - {id: int_ana, name: Ana Reyes, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_ben, name: Ben Tan, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_daniel, name: Daniel Goh, time_zone: Asia/Singapore, availability_source: calendar,
           calendar: [{start: "2027-01-12T11:00:00+08:00", end: "2027-01-12T12:30:00+08:00", status: busy, subject: Regional all-hands (mandatory)}]}
        - {id: int_hm, name: Farhan Rahman, time_zone: Asia/Singapore, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_s1, session: S1, time_zone: Asia/Singapore, start: "2027-01-12T09:30:00+08:00", end: "2027-01-12T10:15:00+08:00"}
          - {event_id: evt_s2, session: S2, time_zone: Asia/Singapore, start: "2027-01-12T10:30:00+08:00", end: "2027-01-12T11:15:00+08:00"}
          - {event_id: evt_s3, session: S3, time_zone: Asia/Singapore, start: "2027-01-12T11:30:00+08:00", end: "2027-01-12T12:15:00+08:00"}
          - {event_id: evt_s4, session: S4, time_zone: Asia/Singapore, start: "2027-01-12T14:00:00+08:00", end: "2027-01-12T14:45:00+08:00"}
      conversation:
        - role: interviewer
          channel: teams
          text: Sorry - mandatory all-hands landed on Tuesday 11-12:30. Can you move my Security design slot?
        - role: agent
          text: >-
            Only S3 needs to move. With the 15-minute breaks, Nur's 12:15-12:45 lunch and S4 at 2:00 p.m., S3 can start
            12:45 or 1:00 p.m. SGT on Tuesday, January 12, 2027. I suggest 12:45-1:30 p.m., updating only the S3
            invitation. Want me to do that?
        - role: recruiter
          text: Yes, 12:45.
          confirmation: true
