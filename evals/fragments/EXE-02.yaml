  - id: EXE-051
    title: Provisional gated rounds - round 1 fail recorded, so cancel the provisionally booked rounds 2 and 3 neutrally
    category: execution_and_recovery
    subcategory: provisional_rounds_cancel_on_fail
    description: >-
      The plan uses provisional_book_cancel_on_fail, and a configuration grant covers cancelling provisional rounds
      for this case when a fail is recorded. The round 1 interviewer recorded a fail in the ATS. Execution must cancel
      exactly the provisional round 2 and round 3 events with the plan's neutral cancellation text; the outcome itself
      is communicated by the recruiter, not by the cancellation notice. India candidate, Singapore round 2 interviewer.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [gated_rounds, virtual_1on1]
    tags: [gated_rounds, provisional_booking, cancel_on_fail, neutral_messaging, autonomous_grant, india, singapore]
    requirement_refs: [ACT-08, CFG-04, COM-01]
    source_inspiration: APAC sequential-round processes where later rounds are pencilled in and released if an earlier round is not cleared.
    inputs:
      now: "2027-01-19T13:00:00+05:30"
      recruiter: {id: rec_kavya, name: Kavya Iyer, time_zone: Asia/Kolkata}
      authority:
        mode: autonomous_grant_active
        grant:
          route: configuration
          granted_by: rec_kavya
          granted_at: "2027-01-11T10:00:00+05:30"
          scope:
            case: REQ-9120 / Siddharth Rao
            actions: [book, cancel_provisional_rounds_on_recorded_fail]
            date_range: {start: "2027-01-18T00:00:00+05:30", end: "2027-01-30T00:00:00+05:30"}
            organizer: recruiting-in@contoso.example
          expires: "2027-01-30T00:00:00+05:30"
      candidate: {id: candidate, name: Siddharth Rao, email: siddharth.rao@example.com, time_zone: Asia/Kolkata}
      interview_plan:
        name: Site Reliability Engineer II - sequential rounds
        sessions:
          - {id: R1, title: Technical round 1, format: virtual, duration_min: 60, interviewers: [int_anu]}
          - {id: R2, title: Technical round 2, format: virtual, duration_min: 60, interviewers: [int_kelvin], gate: R1 pass}
          - {id: R3, title: Manager round, format: virtual, duration_min: 45, interviewers: [int_rekha], gate: R2 pass}
        rules:
          gating_policy: provisional_book_cancel_on_fail
          cancellation_text: "Neutral - 'These interviews have been cancelled. Your recruiter will be in touch with you.'"
          outcome_communication: recruiter only
      interviewers:
        - {id: int_anu, name: Anu Varghese, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_kelvin, name: Kelvin Ong, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_rekha, name: Rekha Pillai, time_zone: Asia/Kolkata, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_g_r1, session: R1, time_zone: Asia/Kolkata, start: "2027-01-19T10:00:00+05:30", end: "2027-01-19T11:00:00+05:30", state: completed}
          - {event_id: evt_g_r2, session: R2, time_zone: Asia/Kolkata, start: "2027-01-20T11:00:00+05:30", end: "2027-01-20T12:00:00+05:30", state: provisional_invitations_sent}
          - {event_id: evt_g_r3, session: R3, time_zone: Asia/Kolkata, start: "2027-01-22T10:00:00+05:30", end: "2027-01-22T10:45:00+05:30", state: provisional_invitations_sent}
        round_results:
          - {round: R1, result: fail, recorded_by: int_anu, recorded_at: "2027-01-19T12:30:00+05:30", source: ATS scorecard}
      conversation:
        - role: system
          text: "ATS event - R1 scorecard submitted by Anu Varghese for REQ-9120 / Siddharth Rao: result fail."
    expected:
      disposition: cancel
      solution_summary: >-
        Under the configuration grant, cancel evt_g_r2 (Wednesday, January 20, 2027, 11:00 a.m.-12:00 p.m. IST / 1:30-2:30
        p.m. SGT) and evt_g_r3 (Friday, January 22, 2027, 10:00-10:45 a.m. IST) with the plan's neutral text, and tell
        Kavya that she owns communicating the outcome to Siddharth.
      must:
        - Cancel exactly evt_g_r2 and evt_g_r3 using the plan's neutral cancellation text.
        - Cite the recorded R1 fail (Anu Varghese, ATS scorecard, 12:30 p.m. IST) and the grant scope.
        - Remind the recruiter that the outcome message is hers to send.
      must_not:
        - Mention the round 1 result, "fail" or performance in any candidate-facing text.
        - Cancel or alter the completed R1 event.
        - Send the candidate any message beyond the cancellation notices.
      side_effects:
        external_writes: as_listed
        actions:
