      must:
        - Update only evt_s3 to 12:45-1:30 p.m. SGT.
        - Leave S1, S2 and S4 events untouched (no updates sent).
        - Report the move and that responses for S3 are pending again.
      must_not:
        - Send updates, cancellations or new invitations for S1, S2 or S4.
        - Place S3 during Daniel's all-hands or the candidate's lunch.
        - Disclose the all-hands subject to the candidate.
      side_effects:
        external_writes: as_listed
        actions:
