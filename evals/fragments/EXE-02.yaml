        - {S1: "2027-01-21T09:00:00-03:00", S2: "2027-01-21T10:00:00-03:00", S3: "2027-01-21T11:00:00-03:00", note: S2 at 13:00 WET overlaps Marta's busy block.}

  - id: EXE-043
