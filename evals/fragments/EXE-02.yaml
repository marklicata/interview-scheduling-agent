  - id: EXE-034
    title: '"Cancel Priya''s interview on Thursday" matches a candidate named Priya and an interviewer named Priya'
    category: execution_and_recovery
    subcategory: ambiguous_cancellation_target
    description: >-
      Two Thursday events match "Priya": a hiring-manager interview whose candidate is Priya Shah, and another
      candidate's technical interview where Priya Natarajan is the interviewer. Cancelling the wrong one would cancel
      another candidate's interview. Cancellation requires a positively identified target, so the agent asks which
      event is meant (and notes that removing an interviewer is a change, not a cancellation).
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager, technical_coding]
    tags: [ambiguous_target, cancellation_scope, other_candidate_protection, name_collision]
    requirement_refs: [ACT-08, COM-05]
    inputs:
      now: "2026-11-10T09:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Priya Shah, email: priya.shah@example.com, time_zone: America/Los_Angeles}
      interview_plan:
        name: Program Manager - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_derek]}
      interviewers:
        - {id: int_derek, name: Derek Holm, time_zone: America/Denver, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_p1, title: Hiring manager interview - Priya Shah, candidate: Priya Shah, interviewers: [Derek Holm], time_zone: America/Los_Angeles, start: "2026-11-12T10:00:00-08:00", end: "2026-11-12T10:45:00-08:00"}
          - {event_id: evt_p2, title: Technical interview - Diego Alvarez, candidate: Diego Alvarez, interviewers: [Priya Natarajan], time_zone: America/Los_Angeles, start: "2026-11-12T14:00:00-08:00", end: "2026-11-12T15:00:00-08:00"}
      conversation:
        - role: recruiter
          text: Cancel Priya's interview on Thursday pls
          confirmation: true
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask which event: Priya Shah's hiring-manager interview (Thursday, November 12, 2026, 10:00-10:45 a.m. PST) or
        Diego Alvarez's technical interview at 2:00-3:00 p.m. PST where Priya Natarajan interviews. If the latter, ask
        whether Maya wants to cancel Diego's interview or replace Priya Natarajan.
      must:
        - List both matching events with candidate, interviewer and time.
        - Ask which one is meant before cancelling anything.
        - Point out that cancelling evt_p2 would cancel Diego Alvarez's interview, and that replacing an interviewer is a different action.
      must_not:
        - Cancel either event before the target is positively identified.
        - Cancel both events.
      clarifying_question_topics: [which event to cancel, cancel versus replace interviewer]
      side_effects: {external_writes: none}

