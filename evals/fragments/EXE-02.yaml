      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Carlos Ibáñez
        email: carlos.ibanez@example.com
        phone: null
        time_zone: Europe/Madrid
        availability:
          - {start: "2026-12-03T16:00:00+01:00", end: "2026-12-03T18:00:00+01:00"}
      interview_plan:
