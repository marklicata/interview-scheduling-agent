      coordinator's event and track it, or replace it), creating nothing.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [duplicate_check, manual_booking, existing_event, toronto]
    requirement_refs: [ACT-03, ACT-10, UX-03]
    inputs:
      now: "2026-12-07T10:00:00-05:00"
      recruiter: {id: rec_chloe, name: Chloé Tremblay, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Gabriel Roy
        email: gabriel.roy@example.com
        time_zone: America/Toronto
        availability:
          - {start: "2026-12-11T13:00:00-05:00", end: "2026-12-11T16:00:00-05:00"}
      interview_plan:
        name: Brand Manager - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_nadine]}
      interviewers:
        - {id: int_nadine, name: Nadine Gagnon, time_zone: America/Toronto, availability_source: calendar}
      policies: {organizer: recruiting@contoso.example}
      conversation:
        - role: agent
          text: Gabriel Roy with Nadine Gagnon, Friday, December 11, 2026, 2:00-2:45 p.m. EST, Teams. Want me to book it?
        - role: recruiter
          text: "yes"
          confirmation: true
      tool_results:
        - {action: query_events, status: success, detail: "Found 'Interview: Gabriel Roy - HM' Friday 2:00-2:45 p.m. EST, organizer priya.anand@contoso.example (coordinator), created 2026-12-06 16:20, attendees Gabriel Roy (accepted) and Nadine Gagnon (accepted), Teams link present."}
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Do not create a second invitation. Tell Chloé that Priya Anand already booked Gabriel with Nadine for Friday,
        December 11, 2026, 2:00-2:45 p.m. EST, both accepted. Ask whether to keep that event and track it in this case,
        or replace it with one from recruiting@contoso.example (which would cancel and reissue to both attendees).
      must:
        - Report the existing manual event with organizer, time and responses.
        - State that nothing was created.
        - Ask whether to keep and track the coordinator's event or replace it, explaining the candidate impact of replacing.
      must_not:
