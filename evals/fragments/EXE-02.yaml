          - {event_id: evt_q2, session: S2, time_zone: Europe/London, start: "2026-12-10T10:00:00+00:00", end: "2026-12-10T10:45:00+00:00", state: invitations_sent}
          - {event_id: evt_q3, session: S3, time_zone: Europe/London, start: "2026-12-10T11:00:00+00:00", end: "2026-12-10T11:45:00+00:00", state: invitations_sent}
          - {event_id: evt_q4, session: S4, time_zone: Europe/London, start: "2026-12-11T14:00:00+00:00", end: "2026-12-11T14:45:00+00:00", state: invitations_sent}
        other_cases_visible_in_organizer_calendar:
