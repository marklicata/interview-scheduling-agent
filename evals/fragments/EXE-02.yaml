      participants:
        candidate:
          time_zone: Asia/Singapore
          available: [["2027-01-12T09:00:00+08:00", "2027-01-12T12:15:00+08:00"], ["2027-01-12T12:45:00+08:00", "2027-01-12T17:00:00+08:00"]]
        int_ana: {time_zone: Asia/Singapore, available: [["2027-01-12T09:30:00+08:00", "2027-01-12T10:15:00+08:00"]]}
        int_ben: {time_zone: Asia/Singapore, available: [["2027-01-12T10:30:00+08:00", "2027-01-12T11:15:00+08:00"]]}
        int_daniel: {time_zone: Asia/Singapore, busy: [["2027-01-12T11:00:00+08:00", "2027-01-12T12:30:00+08:00"]]}
        int_hm: {time_zone: Asia/Singapore, available: [["2027-01-12T14:00:00+08:00", "2027-01-12T14:45:00+08:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_ana]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_ben]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_daniel]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_hm]}
      constraints:
        order: [S1, S2, S3, S4]
        min_gap_min: 15
        max_gap_min: 120
        same_local_day: {time_zone: Asia/Singapore}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-12T09:30:00+08:00", S2: "2027-01-12T10:30:00+08:00", S3: "2027-01-12T12:45:00+08:00", S4: "2027-01-12T14:00:00+08:00"}
      invalid_examples:
        - {S1: "2027-01-12T09:30:00+08:00", S2: "2027-01-12T10:30:00+08:00", S3: "2027-01-12T11:30:00+08:00", S4: "2027-01-12T14:00:00+08:00", note: Original S3 slot overlaps Daniel's all-hands.}
        - {S1: "2027-01-12T09:30:00+08:00", S2: "2027-01-12T10:30:00+08:00", S3: "2027-01-12T12:30:00+08:00", S4: "2027-01-12T14:00:00+08:00", note: Overlaps the candidate's lunch gap.}
      valid_start_bounds:
        S3: {earliest: "2027-01-12T12:45:00+08:00", latest: "2027-01-12T13:00:00+08:00"}
    grading_notes: S1, S2 and S4 are modeled as fixed by restricting their interviewers to the booked slots.

