        Hold the booking for Thursday, December 3, 2026, 16:30-17:00 CET until a phone number is available. Ask Lucía for
        Carlos's number (or whether she wants to ask him), since policy requires it in the invitation; then book.
      must:
        - Explain that the phone screen policy requires the candidate's number in the invitation and none is on file.
        - Ask for the number (or whether the recruiter will obtain it), keeping the 16:30-17:00 CET slot as the plan.
        - Offer to book immediately once the number is supplied.
      must_not:
