            Two complete options for Min-seo's platform panel (all four panelists, Teams) - Option 1 Tuesday,
            February 16, 2027, 2:00-3:00 p.m. KST; Option 2 Wednesday, February 17, 2027, 10:00-11:00 a.m. KST.
            Organizer recruiting-kr@contoso.example. Want me to book one of them?
        - role: recruiter
          at: "2027-02-12T10:00:00+09:00"
          text: Book option 2 please - Wednesday 10am.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Recheck, then create one Teams meeting for Wednesday, February 17, 2027, 10:00-11:00 a.m. KST from
        recruiting-kr@contoso.example with Min-seo and all four panelists as required attendees, and report
        that invitations were sent (not accepted).
      must:
        - Recheck all five participants before booking and find them still free 10:00-11:00 a.m. KST on February 17.
        - Create exactly one event, 10:00-11:00 a.m. KST on Wednesday, February 17, 2027, organized by recruiting-kr@contoso.example.
        - Include Min-seo and all four panelists as required attendees with the same Teams join link and time.
        - Report that invitations were sent and responses are pending, not that attendees accepted.
      must_not:
        - Create an event for option 1 or any duplicate event.
        - Send separate invitations with differing times or join details.
        - Put internal notes or panelists' calendar details into the candidate-facing invitation.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: P1 platform panel for Min-seo Kang and four panelists, notes: "Wed 2027-02-17 10:00-11:00 KST; organizer recruiting-kr@contoso.example; Teams link for all attendees."}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-16T00:00:00+09:00", end: "2027-02-18T00:00:00+09:00"}
      participants:
        candidate: {time_zone: Asia/Seoul, available: [["2027-02-16T14:00:00+09:00", "2027-02-16T16:00:00+09:00"], ["2027-02-17T10:00:00+09:00", "2027-02-17T12:00:00+09:00"]]}
        int_donghyun: {time_zone: Asia/Seoul, busy: [["2027-02-16T15:00:00+09:00", "2027-02-16T16:00:00+09:00"]]}
        int_soyeon: {time_zone: Asia/Seoul, busy: [["2027-02-17T11:00:00+09:00", "2027-02-17T12:00:00+09:00"]]}
        int_ahmed: {time_zone: Asia/Seoul}
        int_yerin: {time_zone: Asia/Seoul}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_donghyun, int_soyeon, int_ahmed, int_yerin]}
      expect_feasible: true
      valid_examples:
        - {P1: "2027-02-17T10:00:00+09:00"}
        - {P1: "2027-02-16T14:00:00+09:00"}
      invalid_examples:
        - {P1: "2027-02-17T10:30:00+09:00", note: So-yeon busy from 11:00.}
      valid_start_bounds:
        P1: {earliest: "2027-02-16T14:00:00+09:00", latest: "2027-02-17T10:00:00+09:00"}
