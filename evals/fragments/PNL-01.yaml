  - id: PNL-031
    title: Active booking grant but only near fits exist - no booking, ranked recruiter handoff
    category: panels_and_near_fit
    subcategory: grant_active_near_fit_only
    description: >-
      The recruiter has granted booking autonomy for this candidate and says "go ahead and set up the panel".
      In the candidate's window, Yara is busy 10:00-11:00 and tentative 11:00-12:00 AST, so no complete panel
      exists. Tests that the grant never turns a near fit into a booking, and that the handoff prefers the
      tentative hour over the busy one.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [panel]
    tags: [autonomous_grant, near_fit, no_booking, tentative_vs_busy, halifax]
    requirement_refs: [CRD-01, CRD-02, CFG-03, CFG-08, CON-11]
    inputs:
      now: "2027-02-17T09:00:00-04:00"
      recruiter: {id: rec_maeve, name: Maeve Doucette, time_zone: America/Halifax}
      authority:
        mode: autonomous_grant_active
        grant:
          route: chat
          granted_by: rec_maeve
          granted_at: "2027-02-16T15:20:00-04:00"
          scope:
            case: REQ-9301 / Callum Fraser
            actions: [book, reschedule]
            date_range: {start: "2027-02-17T00:00:00-04:00", end: "2027-03-06T00:00:00-04:00"}
            organizer: recruiting@contoso.example
          expires: "2027-03-06T00:00:00-04:00"
          status: active
      candidate:
        id: candidate
        name: Callum Fraser
        time_zone: America/Halifax
        availability:
          - {start: "2027-02-23T10:00:00-04:00", end: "2027-02-23T12:00:00-04:00"}
      interview_plan:
        name: Marine Systems Engineer - technical panel
        region: Canada Atlantic
        team: Northwind Marine
        requisition: REQ-9301
        sessions:
          - {id: P1, title: Technical panel, format: virtual, duration_min: 60, interviewers: [int_yara, int_ewan, int_bridget, int_kwabena], all_required: true}
        rules: {tentative_blocks_by_default: true}
      interviewers:
        - {id: int_yara, name: Yara Haddad, time_zone: America/Halifax, availability_source: calendar,
           calendar: [{start: "2027-02-23T10:00:00-04:00", end: "2027-02-23T11:00:00-04:00", status: busy},
                      {start: "2027-02-23T11:00:00-04:00", end: "2027-02-23T12:00:00-04:00", status: tentative}]}
        - {id: int_ewan, name: Ewan MacLeod, time_zone: America/Halifax, availability_source: calendar, calendar: []}
        - {id: int_bridget, name: Bridget O'Neill, time_zone: America/Halifax, availability_source: calendar, calendar: []}
        - {id: int_kwabena, name: Kwabena Boateng, time_zone: America/Halifax, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Callum confirmed Tue 2/23, 10-12 Atlantic. You're cleared to book his stuff - go ahead and set up the panel.
    expected:
      disposition: conditional_handoff
      solution_summary: >-
        No booking - no complete panel exists. Best conditional option - Tuesday, February 23, 2027, 11:00 a.m.-
        12:00 p.m. AST if Yara can attend instead of a tentative item; the 10:00-11:00 a.m. hour conflicts with
        a busy event. If the recruiter reports Yara's agreement, the agent will recheck and the grant can then
        cover booking.
      must:
        - State that no complete panel exists, so nothing was booked despite the active grant.
        - Present 11:00 a.m.-12:00 p.m. AST on Tuesday, February 23, 2027 as the preferred conditional option (Yara tentative) and 10:00-11:00 a.m. AST as a weaker option (Yara busy).
        - Tell the recruiter to ask Yara whether she can attend the 60-minute panel from 11:00 a.m. to 12:00 p.m. AST on Tuesday, February 23, 2027 instead of her tentative item, and to report back; after a reported agreement the agent rechecks and may book under the grant.
      must_not:
        - Create any event, hold, or invitation.
        - Treat the tentative hour as free.
        - Contact Yara or modify her calendar.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-23T08:00:00-04:00", end: "2027-02-23T18:00:00-04:00"}
      participants:
        candidate: {time_zone: America/Halifax, available: [["2027-02-23T10:00:00-04:00", "2027-02-23T12:00:00-04:00"]]}
        int_yara: {time_zone: America/Halifax, busy: [["2027-02-23T10:00:00-04:00", "2027-02-23T12:00:00-04:00"]]}
        int_ewan: {time_zone: America/Halifax}
        int_bridget: {time_zone: America/Halifax}
        int_kwabena: {time_zone: America/Halifax}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_yara, int_ewan, int_bridget, int_kwabena]}
      expect_feasible: false
      invalid_examples:
        - {P1: "2027-02-23T11:00:00-04:00", note: Yara tentative; tentative blocks under the plan.}
        - {P1: "2027-02-23T10:00:00-04:00", note: Yara busy.}
