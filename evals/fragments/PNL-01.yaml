# Panels and near-fit cases, part 1 (PNL-001 to PNL-031).
test_cases:
  - id: PNL-001
    title: Four-person virtual panel with exactly two complete options across two days
    category: panels_and_near_fit
    subcategory: four_person_panel_happy_path
    description: >-
      A 60-minute virtual panel needs four required interviewers and the candidate simultaneously. After
      applying each calendar, exactly two complete intervals exist (Tuesday 10:00 and Wednesday 2:00 p.m.
      PST). Tests the full-panel intersection, the "up to three options" rule without inventing a third,
      and propose-then-ask authority.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [four_person_panel, full_intersection, option_count, propose_then_confirm, teams]
    requirement_refs: [CON-11, SCH-01, SCH-02, ACT-01, COM-07]
    inputs:
      now: "2026-11-10T09:00:00-08:00"
      recruiter: {id: rec_lucia, name: Lucía Ferrer, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aisha Bello
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-17T09:00:00-08:00", end: "2026-11-17T12:00:00-08:00"}
          - {start: "2026-11-18T13:00:00-08:00", end: "2026-11-18T17:00:00-08:00"}
      interview_plan:
        name: Senior UX Designer - design panel
        region: US West
        team: Contoso Design Systems
        time_zone: America/Los_Angeles
        sessions:
          - {id: P1, title: Design panel, format: virtual, duration_min: 60, interviewers: [int_hana, int_marco, int_nadia, int_wes], all_required: true}
      interviewers:
        - id: int_hana
          name: Hana Kobayashi
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T09:00:00-08:00", end: "2026-11-17T10:00:00-08:00", status: busy}
            - {start: "2026-11-18T15:00:00-08:00", end: "2026-11-18T16:00:00-08:00", status: busy}
        - id: int_marco
          name: Marco Rossi
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T11:00:00-08:00", end: "2026-11-17T12:00:00-08:00", status: busy}
        - id: int_nadia
          name: Nadia Haddad
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-18T13:00:00-08:00", end: "2026-11-18T14:00:00-08:00", status: busy}
        - id: int_wes
          name: Wesley Osei
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-18T16:30:00-08:00", end: "2026-11-18T17:00:00-08:00", status: busy}
      conversation:
        - role: recruiter
          at: "2026-11-10T09:00:00-08:00"
          channel: chat
          text: >-
            Aisha sent her availability (Tue 11/17 9-12, Wed 11/18 1-5 PT). Can you find options for the design
            panel with Hana, Marco, Nadia and Wes? Give me three if you can.
    expected:
      disposition: propose_options
      solution_summary: >-
        Exactly two complete options exist - Tuesday, November 17, 2026, 10:00-11:00 a.m. PST and Wednesday,
        November 18, 2026, 2:00-3:00 p.m. PST - each with all four panelists and Aisha. No third option exists.
      must:
        - Propose Tuesday, November 17, 2026, 10:00-11:00 a.m. PST and Wednesday, November 18, 2026, 2:00-3:00 p.m. PST, each listing all four panelists.
        - Explain that only two complete options exist even though three were requested.
        - Present the panel as one virtual session with a Teams meeting for all five attendees.
        - Ask which option to book before taking any action.
      must_not:
        - Invent a third option such as Wednesday 4:00 p.m. (Wes is busy from 4:30) or Tuesday 11:00 a.m. (Marco is busy).
        - Propose any option that has fewer than all four panelists present for the full 60 minutes.
        - Book, hold, or send any invitation before explicit confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00-08:00", end: "2026-11-19T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2026-11-17T09:00:00-08:00", "2026-11-17T12:00:00-08:00"], ["2026-11-18T13:00:00-08:00", "2026-11-18T17:00:00-08:00"]]
        int_hana:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}
          busy: [["2026-11-17T09:00:00-08:00", "2026-11-17T10:00:00-08:00"], ["2026-11-18T15:00:00-08:00", "2026-11-18T16:00:00-08:00"]]
        int_marco:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}
          busy: [["2026-11-17T11:00:00-08:00", "2026-11-17T12:00:00-08:00"]]
        int_nadia:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}
          busy: [["2026-11-18T13:00:00-08:00", "2026-11-18T14:00:00-08:00"]]
        int_wes:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}
          busy: [["2026-11-18T16:30:00-08:00", "2026-11-18T17:00:00-08:00"]]
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_hana, int_marco, int_nadia, int_wes]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-11-17T10:00:00-08:00"}
        - {P1: "2026-11-18T14:00:00-08:00"}
      invalid_examples:
        - {P1: "2026-11-18T16:00:00-08:00", note: Wes is busy from 4:30 p.m.}
        - {P1: "2026-11-17T10:30:00-08:00", note: Marco is busy from 11:00 a.m.}
      valid_start_bounds:
        P1: {earliest: "2026-11-17T10:00:00-08:00", latest: "2026-11-18T14:00:00-08:00"}
    grading_notes: The only valid starts on the 5-minute grid are exactly 10:00 a.m. Tuesday and 2:00 p.m. Wednesday PST.

  - id: PNL-002
    title: Two-interviewer phone panel between Mexico City and Bogotá uses a dial-in bridge
    category: panels_and_near_fit
    subcategory: phone_panel_two_zones
    description: >-
      A 45-minute phone panel (two interviewers on one conference bridge) for a Bogotá candidate who wrote her
      availability in Spanish. Mexico City is one hour behind Bogotá in November. One panelist is busy until
      9:30 a.m. CST, so the valid start range is 9:30-10:15 a.m. CST (10:30-11:15 a.m. COT). Tests a small
      panel as one simultaneous session, phone logistics instead of Teams, and dual-zone presentation.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [panel, phone_screen]
    tags: [two_person_panel, phone_bridge, spanish_input, mexico_city, bogota, propose_then_confirm]
    requirement_refs: [CON-02, AVL-10, COM-02, SCH-01]
    inputs:
      now: "2026-11-12T10:00:00-06:00"
      recruiter: {id: rec_ines, name: Inés Navarro, time_zone: America/Mexico_City}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Valentina Ríos
        phone: "+57 601 555 0142"
        time_zone: America/Bogota
        availability:
          - {start: "2026-11-19T09:00:00-05:00", end: "2026-11-19T12:00:00-05:00"}
      interview_plan:
        name: Customer Support Team Lead - phone panel
        region: LATAM
        team: Northwind Support Operations
        sessions:
          - {id: P1, title: Phone panel, format: phone, duration_min: 45, interviewers: [int_rafael, int_daniela], all_required: true}
        rules:
          phone_logistics: Recruiting conference bridge; the bridge dials the candidate at the number on file.
      interviewers:
        - id: int_rafael
          name: Rafael Ortega
          time_zone: America/Mexico_City
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar: []
        - id: int_daniela
          name: Daniela Fuentes
          time_zone: America/Mexico_City
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-19T09:00:00-06:00", end: "2026-11-19T09:30:00-06:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-11T18:20:00-05:00"
          channel: email
          text: >-
            Hola Inés, gracias. Puedo el jueves 19 de noviembre de 9:00 a 12:00 (hora de Bogotá). Prefiero
            llamada telefónica, mi número es +57 601 555 0142. Saludos, Valentina
        - role: recruiter
          at: "2026-11-12T10:00:00-06:00"
          channel: chat
          text: Valentina replied (forwarded above). Please find a slot for her phone panel with Rafael and Daniela.
    expected:
      disposition: propose_options
      solution_summary: >-
        Any 45-minute start from 9:30 to 10:15 a.m. CST (10:30 to 11:15 a.m. COT) on Thursday, November 19,
        2026, on the recruiting conference bridge with both panelists.
      must:
        - Propose only starts from 9:30 to 10:15 a.m. CST (10:30 to 11:15 a.m. Bogotá time) on Thursday, November 19, 2026.
        - Show each option in both America/Mexico_City and America/Bogota time.
        - Describe the format as a phone panel on the conference bridge dialing +57 601 555 0142, not a Teams video meeting.
        - Ask whether to book the selected option.
      must_not:
        - Propose 9:00-10:00 a.m. Bogotá time (8:00-9:00 a.m. CST), which is before both panelists' working hours.
        - Propose a start before 9:30 a.m. CST, when Daniela is busy.
        - Treat the two interviewers as two separate phone calls.
        - Book or send anything before explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T15:30:00Z", time_zone: America/Mexico_City, expected_local: "2026-11-19T09:30", expected_weekday: Thursday, expected_utc_offset: "-06:00"}
      - {instant: "2026-11-19T15:30:00Z", time_zone: America/Bogota, expected_local: "2026-11-19T10:30", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T00:00:00-06:00", end: "2026-11-20T00:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Bogota, available: [["2026-11-19T09:00:00-05:00", "2026-11-19T12:00:00-05:00"]]}
        int_rafael:
          time_zone: America/Mexico_City
          working_hours: {time_zone: America/Mexico_City, start: "09:00", end: "18:00"}
        int_daniela:
          time_zone: America/Mexico_City
          working_hours: {time_zone: America/Mexico_City, start: "09:00", end: "18:00"}
          busy: [["2026-11-19T09:00:00-06:00", "2026-11-19T09:30:00-06:00"]]
      sessions:
        - {id: P1, duration_min: 45, attendees: [candidate, int_rafael, int_daniela]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-11-19T09:30:00-06:00"}
        - {P1: "2026-11-19T10:15:00-06:00"}
      invalid_examples:
        - {P1: "2026-11-19T08:00:00-06:00", note: 9:00 a.m. Bogota is before the panelists' working hours.}
        - {P1: "2026-11-19T10:30:00-06:00", note: Runs past the candidate's noon Bogota end.}
      valid_start_bounds:
        P1: {earliest: "2026-11-19T09:30:00-06:00", latest: "2026-11-19T10:15:00-06:00"}

  - id: PNL-003
    title: Panel across New York, London and Kolkata with a Berlin candidate has exactly one common hour
    category: panels_and_near_fit
    subcategory: three_zone_single_common_hour
    description: >-
      A 60-minute panel with interviewers in New York (8:00-17:00), London (9:00-17:30) and Kolkata (agreed
      to stay until 7:30 p.m. for global panels), plus a Berlin candidate. The only common interval is
      13:00-14:00 UTC, which is 8:00 a.m. EST, 1:00 p.m. GMT, 2:00 p.m. CET and 6:30 p.m. IST. Tests a
      four-zone intersection with a half-hour offset and a single exact start.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [three_zone_panel, single_common_hour, half_hour_offset, kolkata, london, new_york, berlin]
    requirement_refs: [CON-11, AVL-10, SCH-01, SCH-02]
    inputs:
      now: "2026-11-09T09:00:00+01:00"
      recruiter: {id: rec_sophie, name: Sophie Laurent, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Nora Schmidt
        time_zone: Europe/Berlin
        availability:
          - {start: "2026-11-17T10:00:00+01:00", end: "2026-11-17T18:00:00+01:00"}
      interview_plan:
        name: Principal Data Engineer - global architecture panel
        region: EMEA
        team: Adatum Data Platform
        sessions:
          - {id: P1, title: Architecture panel, format: virtual, duration_min: 60, interviewers: [int_devika, int_olumide, int_carmen], all_required: true}
      interviewers:
        - id: int_devika
          name: Devika Sharma
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "19:30"}
          notes: Agreed acceptable hours for global panels end at 7:30 p.m. IST.
          calendar: []
        - id: int_olumide
          name: Olumide Adeyemi
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar:
            - {start: "2026-11-17T14:00:00+00:00", end: "2026-11-17T15:00:00+00:00", status: busy}
        - id: int_carmen
          name: Carmen Ruiz
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar: []
      conversation:
        - role: recruiter
          text: Nora is free all Tuesday afternoon Berlin time. Can you get Devika, Olumide and Carmen on her panel that day?
    expected:
      disposition: propose_options
      solution_summary: >-
        One option only - Tuesday, November 17, 2026, 13:00-14:00 UTC = 8:00-9:00 a.m. EST (Carmen),
        1:00-2:00 p.m. GMT (Olumide), 2:00-3:00 p.m. CET (Nora), 6:30-7:30 p.m. IST (Devika).
      must:
        - Propose exactly one option, Tuesday, November 17, 2026 at 2:00-3:00 p.m. CET for the candidate.
        - Show the same slot in each participant's local time - 8:00 a.m. EST, 1:00 p.m. GMT, 6:30 p.m. IST.
        - Explain that it is the only hour inside Carmen's 8:00 a.m. start and Devika's 7:30 p.m. limit.
        - Ask whether to book it.
      must_not:
        - Propose a start after 2:00 p.m. CET (it runs past 7:30 p.m. IST for Devika or into Olumide's busy hour).
        - Propose a start before 2:00 p.m. CET (before 8:00 a.m. in New York).
        - Use 6:00 p.m. IST or any whole-hour shortcut for Kolkata.
        - Book before explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T13:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-17T14:00", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-17T13:00:00Z", time_zone: America/New_York, expected_local: "2026-11-17T08:00", expected_utc_offset: "-05:00"}
      - {instant: "2026-11-17T13:00:00Z", time_zone: Europe/London, expected_local: "2026-11-17T13:00", expected_utc_offset: "+00:00"}
      - {instant: "2026-11-17T13:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-17T18:30", expected_utc_offset: "+05:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00Z", end: "2026-11-18T00:00:00Z"}
      participants:
        candidate: {time_zone: Europe/Berlin, available: [["2026-11-17T10:00:00+01:00", "2026-11-17T18:00:00+01:00"]]}
        int_devika:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, start: "09:00", end: "19:30"}
        int_olumide:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, start: "09:00", end: "17:30"}
          busy: [["2026-11-17T14:00:00+00:00", "2026-11-17T15:00:00+00:00"]]
        int_carmen:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, start: "08:00", end: "17:00"}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_devika, int_olumide, int_carmen]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-11-17T13:00:00Z"}
      invalid_examples:
        - {P1: "2026-11-17T12:30:00Z", note: 7:30 a.m. in New York.}
        - {P1: "2026-11-17T13:30:00Z", note: Runs past 7:30 p.m. IST and into Olumide's busy hour.}
      valid_start_bounds:
        P1: {earliest: "2026-11-17T13:00:00Z", latest: "2026-11-17T13:00:00Z"}

  - id: PNL-004
    title: Sydney, London and Los Angeles panel has only pairwise overlaps - no common interval
    category: panels_and_near_fit
    subcategory: three_zone_no_common_interval
    description: >-
      A 60-minute panel with interviewers in Sydney, London and Los Angeles (each with stated acceptable
      hours) and a Singapore candidate. Sydney-London and Sydney-Los Angeles overlap inside the candidate's
      window, but no interval contains all four people. Tests that pairwise overlap does not pass for a
      simultaneous panel and that the agent reports infeasibility with recruiter-owned next steps.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel, executive]
    tags: [three_zone_panel, pairwise_overlap_only, infeasible, sydney, london, los_angeles, singapore]
    requirement_refs: [CON-11, AVL-10, SCH-04, SCH-05, EC-130]
    inputs:
      now: "2026-11-25T10:00:00+08:00"
      recruiter: {id: rec_meiling, name: Mei Ling Goh, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Daniel Tan
        time_zone: Asia/Singapore
        availability:
          - {start: "2026-12-02T09:00:00+08:00", end: "2026-12-02T21:00:00+08:00"}
          - {start: "2026-12-03T09:00:00+08:00", end: "2026-12-03T21:00:00+08:00"}
      interview_plan:
        name: Regional Sales Director - global leadership panel
        region: APAC
        team: Tailspin Global Sales
        sessions:
          - {id: P1, title: Leadership panel, format: virtual, duration_min: 60, interviewers: [int_matilda, int_kofi, int_valeria], all_required: true}
        rules: {substitutes: not specified in plan}
      interviewers:
        - {id: int_matilda, name: Matilda Clarke, time_zone: Australia/Sydney, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "07:00", end: "19:00"}, calendar: []}
        - {id: int_kofi, name: Kofi Mensah, time_zone: Europe/London, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "07:00", end: "19:00"}, calendar: []}
        - {id: int_valeria, name: Valeria Gómez, time_zone: America/Los_Angeles, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "07:00", end: "18:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: >-
            Daniel can do Dec 2 or 3, 9am-9pm Singapore. Matilda, Kofi and Valeria all need to be on the panel
            together. Their stated acceptable hours are in their profiles. What have we got?
    expected:
      disposition: report_infeasible
      solution_summary: >-
        No complete panel exists on December 2-3 inside everyone's acceptable hours. Sydney+London overlap
        only at 6:00-7:00 p.m. AEDT = 7:00-8:00 a.m. GMT (11:00 p.m. PST for Valeria); Sydney+Los Angeles
        overlap at 5:00-6:00 p.m. PST = 12:00-1:00 p.m. AEDT next day (1:00 a.m. GMT for Kofi); London+Los
        Angeles overlap only after 11:00 p.m. SGT, outside Daniel's window.
      must:
        - State that no 60-minute interval on December 2-3 fits all three panelists' acceptable hours and the candidate's window.
        - Name the pairwise overlaps with local times and the panelist each one excludes, e.g., 7:00-8:00 a.m. GMT on Wednesday, December 2 is 11:00 p.m. PST on Tuesday, December 1 for Valeria.
        - Give recruiter-owned next steps such as asking the plan owner whether a substitute or a different panel structure is allowed, or asking the candidate for additional dates.
      must_not:
        - Present a pairwise overlap or sequential meetings as a valid panel.
        - Recommend asking any panelist to join between midnight and 6:00 a.m. their local time as a reasonable near fit.
        - Contact panelists, book, or hold anything.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-02T07:00:00Z", time_zone: Australia/Sydney, expected_local: "2026-12-02T18:00", expected_weekday: Wednesday, expected_utc_offset: "+11:00"}
      - {instant: "2026-12-02T07:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-01T23:00", expected_weekday: Tuesday}
      - {instant: "2026-12-02T01:00:00Z", time_zone: Europe/London, expected_local: "2026-12-02T01:00", expected_utc_offset: "+00:00"}
      - {instant: "2026-12-02T01:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-01T17:00", expected_utc_offset: "-08:00"}
      - {instant: "2026-12-02T15:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-02T23:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-01T16:00:00Z", end: "2026-12-03T16:00:00Z"}
      participants:
