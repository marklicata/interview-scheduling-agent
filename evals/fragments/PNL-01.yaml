        int_jonathan: {time_zone: Asia/Singapore, busy: [["2027-01-26T15:00:00+08:00", "2027-01-26T16:00:00+08:00"]]}
        int_shufen: {time_zone: Asia/Singapore}
        int_arif: {time_zone: Asia/Singapore}
        int_nadine: {time_zone: Asia/Singapore}
      sessions:
