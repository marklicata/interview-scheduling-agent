        - {id: int_ruby, name: Ruby Castillo, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_aditya, name: Aditya Rao, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_sven, name: Sven Eriksson, time_zone: America/New_York, availability_source: calendar, calendar: []}
