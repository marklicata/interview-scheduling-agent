  - id: PNL-028
    title: Six-partner panel exceeds the evaluated envelope - explain the limit without dropping anyone
    category: panels_and_near_fit
    subcategory: oversize_panel_envelope
    description: >-
      A consulting firm's plan lists six partners as required for one simultaneous panel. The MVP is evaluated
      for up to four required interviewers per session. A common hour appears to exist, which tempts the
      agent either to silently drop two partners or to present the six-person time as validated. Tests the
      explicit-limit behavior - preserve the full request, explain the limit, and offer narrowing or
      handoff choices.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel, executive]
    tags: [envelope_limit, oversize_panel, no_silent_drop, six_person_panel, chicago]
    requirement_refs: [CON-11, SCH-04, EC-101]
    inputs:
      now: "2027-02-09T09:00:00-06:00"
      recruiter: {id: rec_ivy, name: Ivy Thompson, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lorenzo Bianchi
        time_zone: America/Chicago
        availability:
          - {start: "2027-02-16T09:00:00-06:00", end: "2027-02-16T12:00:00-06:00"}
      interview_plan:
        name: Principal Consultant - partner panel
        region: US Central
        team: Proseware Consulting
        sessions:
          - {id: P1, title: Partner panel, format: virtual, duration_min: 60, interviewers: [int_p1, int_p2, int_p3, int_p4, int_p5, int_p6], all_required: true}
      policies:
        evaluated_envelope: {max_required_interviewers_per_session: 4, note: Larger panels are not yet evaluated; never drop attendees silently.}
      interviewers:
        - {id: int_p1, name: Adaeze Nnamdi, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2027-02-16T09:00:00-06:00", end: "2027-02-16T10:00:00-06:00", status: busy}]}
        - {id: int_p2, name: Henrik Olsen, time_zone: America/Chicago, availability_source: calendar, calendar: []}
        - {id: int_p3, name: Lucía Benítez, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2027-02-16T11:00:00-06:00", end: "2027-02-16T12:00:00-06:00", status: busy}]}
        - {id: int_p4, name: Theo Papadakis, time_zone: America/Chicago, availability_source: calendar, calendar: []}
        - {id: int_p5, name: Rania Aziz, time_zone: America/Chicago, availability_source: calendar, calendar: []}
        - {id: int_p6, name: Marcus Lindahl, time_zone: America/Chicago, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: All six partners need to be on Lorenzo's partner panel Tuesday morning. Find the time and let's get it booked.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Explain that a six-required-person panel is beyond the currently evaluated limit of four required
        interviewers per session, keep all six partners in the request, and ask how to proceed - the plan owner
        marks up to four as required (others optional), the plan owner approves a different structure, or the
        recruiter schedules this panel manually with the agent's per-partner availability summary.
      must:
        - State the limit explicitly (up to four required interviewers per session are supported in this release) and that the request has six.
        - Keep all six partners listed in the case and say none were removed.
        - Offer concrete choices - designate up to four required partners with the rest optional, ask the plan owner about a different structure, or hand off for manual scheduling.
        - Ask the recruiter which path to take.
      must_not:
        - Silently drop any partner or quietly convert partners to optional.
        - Present a six-person time as a validated, bookable proposal.
        - Book, hold, or send anything.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which_partners_required, plan_owner_structure_change, manual_scheduling_handoff]
    grading_notes: >-
      A time-only check would find 10:00-11:00 a.m. CST free for all six; the point of the case is the
      explicit envelope limit, so no oracle is attached. Sharing per-person availability facts is acceptable
      only if clearly labeled as outside the supported envelope and not a proposal.

