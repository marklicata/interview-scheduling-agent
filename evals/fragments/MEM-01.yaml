  - id: MEM-024
    title: Remembered candidate zone conflicts with a newer signature saying he moved - confirm before booking
    category: memory_and_learning
    subcategory: conflicting_remembered_fact
    description: >-
      Case memory says the candidate is in Chicago (from his October application). His email today says "Tue
      9-11am" with a signature "Denver, CO (moved last week)". The recruiter asks to book 9:00 Tuesday. The two
      readings differ by an hour. The newer evidence suggests Mountain time, but the contradiction must be resolved
      visibly before booking.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [conflicting_memory, newer_evidence, time_zone_ambiguity, visible_reconciliation, denver, chicago]
    requirement_refs: [CHG-03, INT-04, INT-06, AVL-15, UX-06]
    inputs:
      now: "2026-11-20T09:00:00-06:00"
      recruiter: {id: rec_tom, name: Tom Becker, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hamza Qureshi
        availability_raw: Tue 9-11am
      interview_plan:
        name: Inside Sales Representative - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_leah]}
      interviewers:
        - {id: int_leah, name: Leah Goldberg, time_zone: America/Chicago, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}, calendar: []}
      case_state:
        memory:
          entries:
            - id: mem_case_hamza_zone
              owner: rec_tom
              scope: case:REQ-6620/Hamza Qureshi
              created_at: "2026-10-30T10:00:00-05:00"
              source: application form
              content: Candidate time zone America/Chicago.
      conversation:
        - role: candidate
          at: "2026-11-19T19:00:00-07:00"
          channel: email
          text: >-
            Hi Tom, I can do Tue 9-11am for the call. Thanks! -- Hamza Qureshi | Denver, CO (moved last week)
        - role: recruiter
          at: "2026-11-20T08:58:00-06:00"
          channel: chat
          text: Book Hamza's screen with Leah for Tuesday at 9.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Point out the conflict: memory says Chicago, but Hamza's signature says he moved to Denver. Ask the
        recruiter to confirm that "9-11am" is Mountain time (9:00 a.m. MST = 10:00 a.m. CST on Tuesday, November 24,
        2026). Offer to update the case's remembered zone once confirmed; book only after confirmation.
      must:
        - Surface the conflict between the remembered Chicago zone and the Denver signature.
        - Show both readings for Tuesday, November 24 (9:00 a.m. CST vs 9:00 a.m. MST = 10:00 a.m. CST).
        - Ask one concise question to confirm the zone, and offer to update the case memory afterwards.
      must_not:
        - Book 9:00 a.m. CST based on the old remembered zone.
        - Silently overwrite the remembered zone without confirmation.
        - Book anything before the zone is confirmed.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate_time_zone]
