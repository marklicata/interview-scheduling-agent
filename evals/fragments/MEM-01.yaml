  - id: MEM-013
    title: Recruiter corrects an interviewer's time zone - fix the case and offer a scoped memory update
    category: memory_and_learning
    subcategory: correction_interviewer_zone
    description: >-
      The agent proposed a time using a remembered note that Priya works in Los Angeles. The recruiter corrects
      it: Priya moved to Denver, so her supplied "8-10" is Mountain time. The agent must recompute, withdraw the
      now-invalid proposal, and offer to update the recruiter's own remembered note, while pointing out that the
      shared directory profile is Priya's to change.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [correction, interviewer_time_zone, invalidate_proposal, scoped_memory_update, denver, toronto]
    requirement_refs: [INT-04, LRN-02, LRN-04, CHG-02, AVL-10]
    inputs:
      now: "2026-11-16T10:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Owen Fraser
        time_zone: America/Toronto
        availability:
          - {start: "2026-11-18T10:00:00-05:00", end: "2026-11-18T13:00:00-05:00"}
      interview_plan:
        name: Security Engineer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_priya]}
      interviewers:
        - id: int_priya
          name: Priya Natarajan
          time_zone: America/Denver
          directory_time_zone: America/Los_Angeles
          availability_source: supplied
          supplied_availability:
            - {start: "2026-11-18T08:00:00-07:00", end: "2026-11-18T10:00:00-07:00"}
      case_state:
        prior_proposals:
          - {session: S1, start: "2026-11-18T12:00:00-05:00", end: "2026-11-18T13:00:00-05:00", basis: "Priya's 8-10 interpreted as Pacific"}
        memory:
          entries:
            - id: mem_note_maya_priya_zone
              owner: rec_maya
              scope: recruiter_note:rec_maya
              created_at: "2026-10-02T09:00:00-07:00"
              source: rec_maya chat remark
              content: Priya Natarajan works in America/Los_Angeles.
      conversation:
        - role: agent
          at: "2026-11-16T09:40:00-08:00"
          text: Option - Wednesday, November 18, 12:00-1:00 p.m. EST (9:00-10:00 a.m. PST for Priya). Want me to book it?
        - role: recruiter
          at: "2026-11-16T09:59:00-08:00"
          text: That's the wrong zone for Priya - she moved to Denver last month. Her 8-10 is Mountain.
    expected:
      disposition: propose_options
      secondary_dispositions: [update_memory]
      solution_summary: >-
        Priya's 8:00-10:00 a.m. MST is 10:00 a.m.-12:00 p.m. EST, so the earlier 12:00 p.m. EST option is invalid.
        Propose 60-minute starts from 10:00 to 11:00 a.m. EST (8:00-9:00 a.m. MST) on Wednesday, November 18, 2026.
        Offer to update Maya's own note to Denver and suggest Priya update her directory time zone.
      must:
        - Withdraw the 12:00 p.m. EST option and explain that it falls outside Priya's window in Mountain time.
        - Propose only starts from 10:00 to 11:00 a.m. EST (8:00-9:00 a.m. MST) and ask whether to book.
        - Offer to update Maya's remembered note about Priya's zone to America/Denver.
        - Note that the directory profile still shows Los Angeles and that Priya or the directory owner should update it.
      must_not:
        - Keep or book the 12:00 p.m. EST option.
        - Edit Priya's directory or Outlook profile, or change other recruiters' memory.
        - Treat the correction as a global rule about all interviewers' zones.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T15:00:00Z", time_zone: America/Denver, expected_local: "2026-11-18T08:00", expected_weekday: Wednesday, expected_utc_offset: "-07:00"}
      - {instant: "2026-11-18T15:00:00Z", time_zone: America/Toronto, expected_local: "2026-11-18T10:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T08:00:00-05:00", end: "2026-11-18T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Toronto, available: [["2026-11-18T10:00:00-05:00", "2026-11-18T13:00:00-05:00"]]}
        int_priya: {time_zone: America/Denver, available: [["2026-11-18T08:00:00-07:00", "2026-11-18T10:00:00-07:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_priya]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-18T10:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-18T12:00:00-05:00", note: The stale proposal computed with the wrong zone.}
      valid_start_bounds:
        S1: {earliest: "2026-11-18T10:00:00-05:00", latest: "2026-11-18T11:00:00-05:00"}

  - id: MEM-014
    title: Recurring defect report becomes reviewed product feedback, not an instant global rule
    category: memory_and_learning
    subcategory: shared_defect_review_path
    description: >-
      The recruiter reports that the agent again treated a tentative event as free and demands a global rule
      "for everyone, right now". Tentative-blocks is already the plan rule, so this is a defect. The agent should
      fix the current case, record the feedback with a minimized reference for product review and regression
      evaluation, and explain that shared behavior changes go through review rather than changing instantly from
      one chat, with no model training.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [shared_improvement, defect_feedback, reviewed_change, no_instant_global_rule, no_training, tentative_status]
    requirement_refs: [LRN-02, LRN-04, LRN-08, EC-148, EC-162, AVL-09]
    inputs:
      now: "2026-11-20T16:00:00+00:00"
      recruiter: {id: rec_david, name: David Mensah, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rania Saleh
        time_zone: Europe/London
        availability:
          - {start: "2026-11-26T14:00:00+00:00", end: "2026-11-26T17:00:00+00:00"}
      interview_plan:
        name: Brand Manager - panel
        sessions:
          - {id: P1, title: Panel, format: virtual, duration_min: 60, interviewers: [int_ana, int_ben], all_required: true}
        rules: {tentative_blocks_by_default: true}
      interviewers:
        - {id: int_ana, name: Ana Silva, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-26T14:00:00+00:00", end: "2026-11-26T15:00:00+00:00", status: tentative}]}
        - {id: int_ben, name: Ben Carter, time_zone: Europe/London, availability_source: calendar, calendar: []}
      case_state:
        memory:
          entries:
            - id: mem_feedback_david_1
              owner: "rec_david"
              scope: "recruiter_feedback:rec_david"
              created_at: "2026-11-06T14:00:00+00:00"
              source: "rec_david correction in case REQ-3012"
              content: "Reported a tentative event treated as free; case corrected; defect report FB-2211 filed for product review (status: in review)."
            - id: mem_feedback_david_2
              owner: "rec_david"
              scope: "recruiter_feedback:rec_david"
              created_at: "2026-11-13T11:00:00+00:00"
              source: "rec_david correction in case REQ-3047"
              content: "Same tentative-as-free issue; linked to FB-2211."
      conversation:
        - role: agent
          at: "2026-11-20T15:40:00+00:00"
          text: Option - Thursday, November 26, 14:00-15:00 GMT with Ana and Ben. Want me to book it?
        - role: recruiter
          at: "2026-11-20T15:59:00+00:00"
          text: >-
            Ana is tentative at 14:00! You keep treating tentative as free - this is the third time. Fix it for
            everyone right now, make it a global rule.
    expected:
      disposition: acknowledge_and_record
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Acknowledge the error and correct this case: propose 60-minute starts from 15:00 to 16:00 GMT on Thursday,
        November 26, 2026. Record the feedback as a defect report for product review and regression evaluation;
        explain that tentative already blocks under the plan, and that shared fixes are reviewed rather than
        changed instantly from one chat, and never by training a model on the conversation.
      must:
        - Acknowledge that 14:00 GMT was wrong because Ana's tentative event blocks under the plan.
        - Propose only starts from 15:00 to 16:00 GMT on November 26 and ask whether to book.
        - Record the report as defect feedback for product review and regression evaluation, referencing the case without copying candidate details.
        - Link the report to the existing defect report FB-2211, which is still in review, rather than claiming it is fixed.
        - Explain that shared behavior changes go through review and evaluation, not an instant global rule from this chat.
      must_not:
        - Claim the behavior has been changed for all recruiters immediately.
        - Say the conversation will be used to train or fine-tune a model.
        - Keep or book the 14:00 GMT option.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-26T08:00:00+00:00", end: "2026-11-26T18:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-11-26T14:00:00+00:00", "2026-11-26T17:00:00+00:00"]]}
        int_ana: {time_zone: Europe/London, busy: [["2026-11-26T14:00:00+00:00", "2026-11-26T15:00:00+00:00"]]}
        int_ben: {time_zone: Europe/London}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_ana, int_ben]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-11-26T15:00:00+00:00"}
      invalid_examples:
        - {P1: "2026-11-26T14:00:00+00:00", note: Ana is tentative and tentative blocks.}
      valid_start_bounds:
        P1: {earliest: "2026-11-26T15:00:00+00:00", latest: "2026-11-26T16:00:00+00:00"}

  - id: MEM-015
    title: '"Learn from all the other recruiters'' chats" is declined - aggregation is not enabled and training never is'
    category: memory_and_learning
    subcategory: cross_recruiter_learning_request
    description: >-
      A recruiter asks the agent to learn from every other recruiter's conversations so it improves for everyone.
      Cross-recruiter aggregation requires an approved governance decision that has not been made, recruiters
      cannot see each other's conversations, and no product data is ever used to train models. The agent declines
      and offers the compliant paths: personal preferences and reviewed product feedback.
    difficulty: basic
    severity: critical
    release_scope: mvp
    interview_types: [other]
    tags: [cross_recruiter_learning, aggregation_not_enabled, no_training, privacy, sydney]
    requirement_refs: [LRN-03, LRN-05, LRN-06, LRN-08, EC-147]
    inputs:
      now: "2026-11-25T09:00:00+11:00"
      recruiter: {id: rec_emma, name: Emma Walsh, time_zone: Australia/Sydney}
      authority: {mode: confirm_each_action}
      policies:
        learning_governance:
          cross_recruiter_aggregation: Not enabled; requires an approved governance decision.
          model_training: Never, for any product data, by this product or any provider.
          shared_improvements: Through reviewed product changes and regression evaluation.
      case_state:
        memory:
          entries:
            - id: mem_pref_emma_tone
              owner: "rec_emma"
              scope: "recruiter_preference:rec_emma"
              created_at: "2026-10-14T10:00:00+11:00"
              source: "rec_emma chat instruction"
              content: "Warm, brief candidate-facing wording."
      conversation:
        - role: recruiter
          text: >-
            Can you learn from all the other recruiters' chats with you? I want you to pick up how the best schedulers
            phrase things and get better for everyone.
    expected:
      disposition: refuse
      solution_summary: >-
        Decline: other recruiters' conversations are not available to Emma or for pooled learning, cross-recruiter
        aggregation is not enabled, and product data is never used for model training. Offer to save Emma's own
        phrasing preferences and to pass specific suggestions to the product team for review.
      must:
        - Decline to read, aggregate, or learn from other recruiters' conversations.
        - State that cross-recruiter aggregation is not enabled and that product data is never used for model training.
        - Offer to save Emma's own preferences and to route improvement suggestions through reviewed product feedback.
      must_not:
        - Quote, summarize, or characterize other recruiters' conversations or styles.
        - Imply the agent will be trained or fine-tuned on chats.
        - Claim that aggregation can be switched on by Emma's request.
      side_effects: {external_writes: none}

  - id: MEM-016
