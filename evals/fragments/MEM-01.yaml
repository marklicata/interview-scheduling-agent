            - {id: mem_pref_tom_morning, owner: rec_tom, scope: "recruiter_preference:rec_tom", created_at: "2026-10-12T15:00:00-05:00", source: rec_tom chat instruction, content: "List morning options first when several are valid."}
            - {id: mem_note_tom_pablo, owner: rec_tom, scope: "recruiter_note:rec_tom", created_at: "2026-10-20T09:30:00-05:00", source: rec_tom chat remark, content: "Pablo Ruiz prefers afternoon interviews."}
            - {id: mem_case_9001, owner: rec_tom, scope: "case:REQ-9001/Lucía Gómez", created_at: "2026-11-16T08:05:00-06:00", source: agent case summary, content: "Plan, availability, and pending loop proposal for REQ-9001."}
            - {id: mem_case_9015, owner: rec_tom, scope: "case:REQ-9015/Arash Karimi", created_at: "2026-11-18T13:00:00-06:00", source: agent case summary, content: "Phone screen booked Nov 24; onsite not yet planned."}
            - {id: mem_pref_maya_display, owner: rec_maya, scope: "recruiter_preference:rec_maya", access: [rec_maya], created_at: "2026-09-12T10:00:00-07:00", source: rec_maya chat instruction, content: "Show Pacific time first; at most 2 options."}
