      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Beatriz Alves
        time_zone: Europe/Lisbon
        availability:
          - {start: "2026-11-19T13:00:00+00:00", end: "2026-11-19T17:00:00+00:00"}
      interview_plan:
        name: Marketing Analyst - interview
        sessions:
          - {id: S1, title: Interview, format: virtual, duration_min: 60, interviewers: [int_rui]}
      interviewers:
