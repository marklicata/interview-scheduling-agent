        sessions:
          - {id: P1, title: Panel, format: virtual, duration_min: 60, interviewers: [int_greta, int_samir]}
      interviewers:
        - {id: int_greta, name: Greta Lund, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_samir, name: Samir Haddad, time_zone: America/New_York, availability_source: calendar, calendar: []}
      case_state:
        memory:
          entries:
            - id: mem_tombstone_2290
              owner: system
              scope: case:REQ-2290/Felipe Araujo
              created_at: "2027-03-01T00:00:00-05:00"
              source: retention job
              content: Case memory deleted on 2027-03-01 under the 180-day retention rule; no details retained.
