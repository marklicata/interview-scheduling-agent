           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}, calendar: []}
      case_state:
        memory: {entries: []}
      conversation:
        - role: recruiter
          text: Remember that I prefer morning interviews for all my candidates. Now, options for Beatriz with Rui on Thursday?
    expected:
      disposition: update_memory
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Save "prefers morning interviews" as a soft preference for Inês only. Beatriz is available only in the
        afternoon, so propose 60-minute starts from 1:00 to 4:00 p.m. WET on Thursday, November 19, 2026, noting
        that the morning preference could not be met.
      must:
