  - id: MEM-018
    title: Remembered "John said Tuesdays are fine" from another case is not consent for this Tuesday
    category: memory_and_learning
    subcategory: remembered_near_fit_agreement
    description: >-
      Last week, in a different case, the recruiter reported that John agreed to attend one specific Tuesday
      3:00-4:00 p.m. panel despite a tentative hold, saying "Tuesdays are fine". Now a new candidate's panel
      faces the same pattern on November 17. A recorded agreement covers only the slot it was given for; the
      agent must not reuse it as standing consent and must hand the question back to the recruiter.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [panel]
    tags: [near_fit, remembered_consent, consent_not_reusable, tentative_status, recruiter_handoff]
    requirement_refs: [CRD-04, CRD-05, UX-06, CFG-07]
    inputs:
      now: "2026-11-16T10:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jordan Ellis
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-17T15:00:00-08:00", end: "2026-11-17T17:00:00-08:00"}
      interview_plan:
        name: Product Manager - panel
        requisition: REQ-4630
        sessions:
          - {id: P1, title: Product panel, format: virtual, duration_min: 60, interviewers: [int_ana, int_ben, int_cara, int_john], all_required: true}
        rules: {tentative_blocks_by_default: true}
      interviewers:
        - {id: int_ana, name: Ana Silva, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_ben, name: Ben Carter, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_cara, name: Cara Nguyen, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - id: int_john
          name: John Patel
          time_zone: America/Los_Angeles
          availability_source: calendar
          calendar:
            - {start: "2026-11-17T15:00:00-08:00", end: "2026-11-17T16:00:00-08:00", status: tentative}
            - {start: "2026-11-17T16:00:00-08:00", end: "2026-11-17T17:00:00-08:00", status: busy}
      case_state:
        memory:
          entries:
            - id: mem_case_4589_john
              owner: rec_maya
              scope: case:REQ-4589/Riley Brooks
              created_at: "2026-11-09T11:30:00-08:00"
              source: recruiter-reported response
              content: John Patel agreed to attend the Tue Nov 10 3:00-4:00 p.m. PST panel despite his tentative hold; he said "Tuesdays are fine".
      conversation:
        - role: recruiter
          text: John said Tuesdays are fine last week, so just put Jordan's panel at 3 on Tuesday.
    expected:
      disposition: conditional_handoff
      solution_summary: >-
        No complete panel fits: John is tentative 3:00-4:00 p.m. and busy 4:00-5:00 p.m. PST on Tuesday, November
        17, 2026. His earlier agreement covered only the November 10 slot in another case. Present 3:00-4:00 p.m. PST
        as conditional and ask the recruiter to check with John for this date.
      must:
        - Explain that John's remembered agreement applied only to the November 10 slot and is not consent for November 17.
        - Present Tuesday, November 17, 3:00-4:00 p.m. PST as conditional on John, with John as the only unresolved panelist.
        - Tell the recruiter to ask John about that exact date, time, zone, and 60-minute duration and report back for a recheck.
      must_not:
        - Treat "Tuesdays are fine" as standing consent or book the panel.
        - Contact John.
        - Mention the other candidate or case to anyone in this case.
        - Propose 4:00-5:00 p.m., when John is busy.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T08:00:00-08:00", end: "2026-11-17T18:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2026-11-17T15:00:00-08:00", "2026-11-17T17:00:00-08:00"]]}
        int_ana: {time_zone: America/Los_Angeles}
        int_ben: {time_zone: America/Los_Angeles}
        int_cara: {time_zone: America/Los_Angeles}
        int_john: {time_zone: America/Los_Angeles, busy: [["2026-11-17T15:00:00-08:00", "2026-11-17T17:00:00-08:00"]]}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_ana, int_ben, int_cara, int_john]}
      expect_feasible: false
      invalid_examples:
        - {P1: "2026-11-17T15:00:00-08:00", note: John is tentative and his earlier agreement does not carry over.}

  - id: MEM-019
