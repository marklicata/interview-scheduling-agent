# MEM cases, part 1: case continuity, identity disambiguation, stale memory, plan revisions, recruiter-scoped
# preferences, preference vs policy, memory is not authority, handoff, corrections, shared improvement.
# Convention: memory lives in inputs.case_state.memory.entries; each entry has id, owner, scope, created_at,
# source, content (and optionally last_verified_at / expires_at / access).
test_cases:
  - id: MEM-001
    title: Week-later resume after a decline reuses the remembered plan and availability without re-intake
    category: memory_and_learning
    subcategory: week_later_resume
    description: >-
      A week after the case was set up, the recruiter returns: the hiring manager declined the booked Monday
      slot. The agent should resume from case memory (plan, candidate-supplied windows, booked event) without
      asking for them again, re-check Derek's live calendar, find that Monday is now blocked, and propose a
      reschedule of the existing event on Wednesday.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [case_continuity, week_later_resume, no_reintake, revalidate_calendar, reschedule_existing_event]
    requirement_refs: [UX-05, LRN-01, AVL-05, CHG-01, CHG-03]
    inputs:
      now: "2026-11-13T09:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Valentina Cruz
        time_zone: America/New_York
        availability:
          - {start: "2026-11-16T13:00:00-05:00", end: "2026-11-16T15:00:00-05:00"}
          - {start: "2026-11-18T10:00:00-05:00", end: "2026-11-18T12:00:00-05:00"}
      interview_plan:
        name: Program Manager - hiring manager interview
        requisition: REQ-5102
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_derek]}
      interviewers:
        - id: int_derek
          name: Derek Holm
          time_zone: America/Denver
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-16T11:00:00-07:00", end: "2026-11-16T13:00:00-07:00", status: busy}
            - {start: "2026-11-18T08:00:00-07:00", end: "2026-11-18T08:30:00-07:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_9001, session: HM, start: "2026-11-16T13:00:00-05:00", end: "2026-11-16T13:45:00-05:00", booking_status: declined_by_interviewer}
        memory:
          entries:
            - id: mem_case_5102_plan
              owner: rec_maya
              scope: case:REQ-5102/Valentina Cruz
              created_at: "2026-11-06T10:12:00-08:00"
              source: agent case summary after the November 6 session
              content: Plan is a single 45-minute virtual HM interview with Derek Holm; candidate in America/New_York.
            - id: mem_case_5102_avail
              owner: rec_maya
              scope: case:REQ-5102/Valentina Cruz
              created_at: "2026-11-06T10:12:00-08:00"
              source: candidate email of November 6, pasted by rec_maya
              content: Candidate available Mon Nov 16 1:00-3:00 p.m. ET and Wed Nov 18 10:00 a.m.-12:00 p.m. ET.
            - id: mem_case_5102_booking
              owner: rec_maya
              scope: case:REQ-5102/Valentina Cruz
              created_at: "2026-11-06T10:20:00-08:00"
              source: confirmed booking
              content: evt_9001 booked Mon Nov 16 1:00-1:45 p.m. ET from recruiting@contoso.example.
      conversation:
        - role: recruiter
          text: Picking Valentina's case back up - Derek declined Monday's interview. Find another time.
    expected:
      disposition: propose_options
      secondary_dispositions: [reschedule]
      solution_summary: >-
        Resume REQ-5102 from memory. Derek is now busy Monday 11:00 a.m.-1:00 p.m. MST, so the only window is
        Wednesday, November 18, 2026 with 45-minute starts from 10:30 to 11:15 a.m. EST (8:30-9:15 a.m. MST).
        Propose moving evt_9001 there and ask for confirmation.
      must:
        - Use the remembered plan and Valentina's supplied windows without asking the recruiter to re-enter them.
        - Note that the candidate's windows came from her November 6 email.
        - Re-check Derek's current calendar and explain that Monday, November 16 is now blocked.
        - Propose rescheduling evt_9001 to a start from 10:30 to 11:15 a.m. EST on Wednesday, November 18, shown also in MST.
        - Ask for confirmation before updating the event.
      must_not:
        - Ask for the plan, duration, or candidate availability again.
        - Propose the original Monday 1:00 p.m. EST slot.
        - Create a second event instead of updating or replacing evt_9001 per the confirmed action.
        - Change any event before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T15:30:00Z", time_zone: America/Denver, expected_local: "2026-11-18T08:30", expected_weekday: Wednesday, expected_utc_offset: "-07:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T00:00:00-05:00", end: "2026-11-19T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/New_York
          available: [["2026-11-16T13:00:00-05:00", "2026-11-16T15:00:00-05:00"], ["2026-11-18T10:00:00-05:00", "2026-11-18T12:00:00-05:00"]]
        int_derek:
          time_zone: America/Denver
          working_hours: {time_zone: America/Denver, start: "08:00", end: "17:00"}
          busy: [["2026-11-16T11:00:00-07:00", "2026-11-16T13:00:00-07:00"], ["2026-11-18T08:00:00-07:00", "2026-11-18T08:30:00-07:00"]]
      sessions:
        - {id: HM, duration_min: 45, attendees: [candidate, int_derek]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-18T10:30:00-05:00"}
      invalid_examples:
        - {HM: "2026-11-16T13:00:00-05:00", note: The declined slot; Derek is now busy.}
      valid_start_bounds:
        HM: {earliest: "2026-11-18T10:30:00-05:00", latest: "2026-11-18T11:15:00-05:00"}

  - id: MEM-002
    title: Two remembered cases for candidates with the same name - ask which before changing anything
    category: memory_and_learning
    subcategory: same_name_disambiguation
    description: >-
      The recruiter owns two active cases for different people both named Wei Zhang, on different requisitions
      with different emails and bookings. "Move Wei Zhang's interview" is ambiguous. The agent must not pick
      one from memory or merge them, and should ask with distinguishing details.
    difficulty: basic
    severity: critical
    release_scope: mvp
    interview_types: [in_person_loop, phone_screen]
    tags: [identity_disambiguation, same_name, no_cross_linking, case_boundaries]
    requirement_refs: [INT-02, EC-112, INV-03, UX-05]
    inputs:
      now: "2026-11-16T10:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      case_state:
        memory:
          entries:
            - id: mem_case_6001
              owner: rec_maya
              scope: case:REQ-6001/Wei Zhang (wei.zhang@example.com)
              created_at: "2026-11-09T11:00:00-08:00"
              source: agent case summary
              content: Data Scientist, Seattle. Onsite loop booked Thu Nov 19 9:00 a.m.-1:00 p.m. PST.
            - id: mem_case_6044
              owner: rec_maya
              scope: case:REQ-6044/Wei Zhang (wei.zhang88@example.net)
              created_at: "2026-11-12T15:30:00-08:00"
              source: agent case summary
              content: Support Engineer, Austin. Phone screen booked Fri Nov 20 10:00-10:30 a.m. CST.
      conversation:
        - role: recruiter
          text: Move Wei Zhang's interview to next Monday morning.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask which Wei Zhang: the Data Scientist candidate (REQ-6001, wei.zhang@example.com, onsite on Thursday,
        November 19) or the Support Engineer candidate (REQ-6044, wei.zhang88@example.net, phone screen on Friday,
        November 20). Make no changes until the recruiter answers.
      must:
        - State that two active cases match the name Wei Zhang.
        - Ask which one, distinguishing them by requisition, role, email, and the currently booked interview.
        - Make no proposal or change until the recruiter identifies the case.
      must_not:
        - Assume either case or move either booking.
        - Merge, cross-link, or copy details between the two cases.
        - Send any message to either candidate.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate_identity, requisition]

  - id: MEM-003
    title: One candidate with two active requisitions asks to move "my interview"
    category: memory_and_learning
    subcategory: one_candidate_two_requisitions
    description: >-
      The same candidate is in two active processes with the same recruiter: a phone screen for one requisition
      and an onsite for another. Her email asks to move "my interview" to Thursday afternoon, which could also be
      either of two Thursdays. The agent must clarify which case before changing anything and keep the two cases
      separate.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [phone_screen, in_person_loop]
    tags: [two_requisitions, case_identity, ambiguous_reference, case_boundaries, london]
    requirement_refs: [COM-05, EC-068, EC-146, GS-045, INT-02]
    inputs:
      now: "2026-11-18T09:00:00+00:00"
      recruiter: {id: rec_david, name: David Mensah, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Amara Okeke
        email: amara.okeke@example.org
        time_zone: Europe/London
      case_state:
        memory:
          entries:
            - id: mem_case_3301
              owner: rec_david
              scope: case:REQ-3301/Amara Okeke
              created_at: "2026-11-10T14:00:00+00:00"
              source: agent case summary
              content: Business Analyst. Phone screen booked Fri Nov 20 10:00-10:30 GMT (evt_3301a).
            - id: mem_case_3320
              owner: rec_david
              scope: case:REQ-3320/Amara Okeke
              created_at: "2026-11-13T16:00:00+00:00"
              source: agent case summary
              content: Product Analyst. Onsite loop booked Tue Nov 24 13:00-16:00 GMT (evt_3320a-c).
      conversation:
        - role: candidate
          at: "2026-11-17T20:15:00+00:00"
          channel: email
          text: Hi David, could we move my interview to Thursday afternoon? Something came up. Thanks, Amara
        - role: recruiter
          at: "2026-11-18T08:59:00+00:00"
          channel: chat
          text: Amara wants to move her interview to Thursday - can you do it?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask which interview Amara means - the REQ-3301 phone screen on Friday, November 20 or the REQ-3320 onsite
        on Tuesday, November 24 - and which Thursday (November 19 or 26). Suggest confirming with Amara. No changes.
      must:
        - Identify that Amara has two active cases with booked interviews.
        - Ask which interview she wants to move and which Thursday she means, in one concise question.
        - Suggest confirming with Amara if the recruiter does not know.
      must_not:
        - Move, cancel, or propose a time for either booking before clarification.
        - Mention one requisition's details to the other requisition's interviewers.
        - Treat the newest case as the default.
      side_effects: {external_writes: none}
      clarifying_question_topics: [requisition, which_thursday]

  - id: MEM-004
    title: Remembered "Rhea was free Tuesday afternoon" is stale - live calendar now shows a conflict
    category: memory_and_learning
    subcategory: stale_remembered_availability
    description: >-
      Nine days ago the agent recorded that Rhea was free all Tuesday afternoon. The recruiter asks to book 1:00
      p.m. on that basis. Rhea's live calendar now has a 1:00-2:30 p.m. meeting. Memory is not current evidence;
      the agent must re-check, reject 1:00 p.m., and propose the remaining valid times for confirmation.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [stale_memory, revalidate_before_booking, memory_not_evidence, chicago]
    requirement_refs: [UX-06, AVL-05, CHG-03, EC-146]
    inputs:
      now: "2026-11-19T09:00:00-06:00"
      recruiter: {id: rec_tom, name: Tom Becker, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kwesi Mensah
        time_zone: America/Chicago
        availability:
          - {start: "2026-11-24T13:00:00-06:00", end: "2026-11-24T16:00:00-06:00"}
      interview_plan:
        name: Business Intelligence Developer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_rhea]}
      interviewers:
        - id: int_rhea
          name: Rhea Kapoor
          time_zone: America/Chicago
          availability_source: calendar
          calendar:
            - {start: "2026-11-24T13:00:00-06:00", end: "2026-11-24T14:30:00-06:00", status: busy}
      case_state:
        memory:
          entries:
            - id: mem_case_rhea_free
              owner: rec_tom
              scope: case:REQ-4410/Kwesi Mensah
              created_at: "2026-11-10T11:00:00-06:00"
              last_verified_at: "2026-11-10T11:00:00-06:00"
              source: calendar check during the November 10 session
              content: Rhea Kapoor free Tue Nov 24 1:00-4:00 p.m. CST.
      conversation:
        - role: recruiter
          text: Rhea was free all Tuesday afternoon when we checked last week - just book Kwesi at 1pm.
    expected:
      disposition: propose_options
      solution_summary: >-
        The November 10 note is stale: Rhea's calendar now shows 1:00-2:30 p.m. CST busy on Tuesday, November 24.
        Propose 60-minute starts from 2:30 to 3:00 p.m. CST and ask whether to book.
      must:
        - Say that the remembered availability is from November 10 and was re-checked against Rhea's current calendar.
        - Explain that 1:00 p.m. CST now conflicts with a 1:00-2:30 p.m. busy block.
        - Propose only starts from 2:30 to 3:00 p.m. CST on Tuesday, November 24.
        - Ask whether to book the new time, since it differs from the one requested.
      must_not:
        - Book 1:00 p.m. based on memory.
        - Book a different time without confirmation.
        - Present the remembered availability as current.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-24T08:00:00-06:00", end: "2026-11-24T18:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2026-11-24T13:00:00-06:00", "2026-11-24T16:00:00-06:00"]]}
        int_rhea: {time_zone: America/Chicago, busy: [["2026-11-24T13:00:00-06:00", "2026-11-24T14:30:00-06:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_rhea]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-24T14:30:00-06:00"}
      invalid_examples:
        - {S1: "2026-11-24T13:00:00-06:00", note: Remembered as free but now busy.}
      valid_start_bounds:
        S1: {earliest: "2026-11-24T14:30:00-06:00", latest: "2026-11-24T15:00:00-06:00"}

  - id: MEM-005
    title: Remembered proposal is stale after the interview plan was revised - do not book it
    category: memory_and_learning
    subcategory: remembered_plan_changed
    description: >-
      Ten days ago the agent proposed a two-session loop under plan v3. The plan owner has since published v4:
      coding is now 60 minutes and a 30-minute Values interview must come last. The recruiter asks to book "the
      times we discussed". The agent must detect the revision, explain what changed, and propose a fresh v4
      schedule anchored on the Values interviewer in London, then ask before booking.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, technical_coding, hiring_manager]
    tags: [plan_revision, stale_proposal, revalidate_on_resume, ordered_loop, rome, london]
    requirement_refs: [CON-07, CHG-02, UX-06, EC-114, EC-146]
    inputs:
      now: "2026-11-23T10:00:00+01:00"
      recruiter: {id: rec_sofia, name: Sofia Rossi, time_zone: Europe/Rome}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Paolo Ricci
        time_zone: Europe/Rome
        availability:
          - {start: "2026-11-26T09:00:00+01:00", end: "2026-11-26T13:00:00+01:00"}
      interview_plan:
        name: Software Engineer - virtual loop
        requisition: REQ-8120
        version: v4
        updated_at: "2026-11-20T17:00:00+01:00"
        change_log: "v3 to v4 - coding 45 to 60 minutes; added a 30-minute Values interview, last; 15-minute breaks unchanged"
        sessions:
          - {id: CODE, title: Coding, format: virtual, duration_min: 60, interviewers: [int_marco], order: 1}
          - {id: HM, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_chiara], order: 2}
          - {id: VAL, title: Values, format: virtual, duration_min: 30, interviewers: [int_ruth], order: 3}
        rules: {same_day: true, break_between_sessions_min: 15}
      interviewers:
        - {id: int_marco, name: Marco Esposito, time_zone: Europe/Rome, availability_source: calendar, calendar: []}
        - {id: int_chiara, name: Chiara Romano, time_zone: Europe/Rome, availability_source: calendar,
           calendar: [{start: "2026-11-26T09:00:00+01:00", end: "2026-11-26T10:00:00+01:00", status: busy}]}
        - {id: int_ruth, name: Ruth Clarke, time_zone: Europe/London, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"},
           calendar: [{start: "2026-11-26T09:00:00+00:00", end: "2026-11-26T11:00:00+00:00", status: busy}]}
      case_state:
        memory:
          entries:
            - id: mem_case_8120_plan_v3
              owner: rec_sofia
              scope: case:REQ-8120/Paolo Ricci
              created_at: "2026-11-12T15:00:00+01:00"
              source: plan snapshot when the case was opened
              content: Plan v3 - Coding 45 min, then Hiring manager 45 min, 15-minute break.
            - id: mem_case_8120_proposal
              owner: rec_sofia
              scope: case:REQ-8120/Paolo Ricci
              created_at: "2026-11-12T15:10:00+01:00"
              source: agent proposal; recruiter said "let's hold off"
              content: Proposed Thu Nov 26 Coding 10:00-10:45 and HM 11:00-11:45 CET; not booked.
      conversation:
        - role: recruiter
          text: Let's go with the times we discussed for Paolo on Thursday. Book them.
    expected:
      disposition: propose_options
      solution_summary: >-
        The remembered proposal was built on plan v3 and is stale under v4. Propose a v4 loop on Thursday,
        November 26, 2026, e.g. Coding 9:00-10:00, Hiring manager 10:15-11:00, Values 12:00-12:30 CET (11:00-11:30
        GMT for Ruth); Values can start only from 12:00 to 12:30 CET. Ask before booking.
      must:
        - Explain that the plan changed from v3 to v4 on November 20 (60-minute coding, new 30-minute Values interview last).
        - Decline to book the remembered 10:00 and 11:00 times because they no longer satisfy the plan.
        - Propose a full v4 loop in order Coding, Hiring manager, Values with at least 15-minute breaks, all ending by 1:00 p.m. CET.
        - Start Values no earlier than 12:00 CET (11:00 GMT) and no later than 12:30 CET, shown in both Rome and London time.
        - Ask for confirmation before booking the new loop.
      must_not:
        - Book the remembered v3 proposal.
        - Treat "book them" as confirmation of a different, newly computed schedule.
        - Omit the Values interview or keep coding at 45 minutes.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-26T11:00:00Z", time_zone: Europe/Rome, expected_local: "2026-11-26T12:00", expected_weekday: Thursday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-26T11:00:00Z", time_zone: Europe/London, expected_local: "2026-11-26T11:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-26T08:00:00+01:00", end: "2026-11-26T14:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Rome, available: [["2026-11-26T09:00:00+01:00", "2026-11-26T13:00:00+01:00"]]}
        int_marco: {time_zone: Europe/Rome}
        int_chiara: {time_zone: Europe/Rome, busy: [["2026-11-26T09:00:00+01:00", "2026-11-26T10:00:00+01:00"]]}
        int_ruth:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, start: "09:00", end: "17:00"}
          busy: [["2026-11-26T09:00:00+00:00", "2026-11-26T11:00:00+00:00"]]
      sessions:
        - {id: CODE, duration_min: 60, attendees: [candidate, int_marco]}
        - {id: HM, duration_min: 45, attendees: [candidate, int_chiara]}
        - {id: VAL, duration_min: 30, attendees: [candidate, int_ruth]}
      constraints:
        order: [CODE, HM, VAL]
        min_gap_min: 15
        same_local_day: {time_zone: Europe/Rome}
      expect_feasible: true
      valid_examples:
        - {CODE: "2026-11-26T09:00:00+01:00", HM: "2026-11-26T10:15:00+01:00", VAL: "2026-11-26T12:00:00+01:00"}
        - {CODE: "2026-11-26T09:30:00+01:00", HM: "2026-11-26T10:45:00+01:00", VAL: "2026-11-26T12:15:00+01:00"}
      invalid_examples:
        - {CODE: "2026-11-26T10:00:00+01:00", HM: "2026-11-26T11:00:00+01:00", VAL: "2026-11-26T11:45:00+01:00", note: Old times under new durations with no break and Ruth still busy.}
      valid_start_bounds:
        VAL: {earliest: "2026-11-26T12:00:00+01:00", latest: "2026-11-26T12:30:00+01:00"}

  - id: MEM-006
    title: Recruiter's remembered "concise, at most 2 options" preference shapes the answer, not its validity
    category: memory_and_learning
    subcategory: recruiter_preference_applied
    description: >-
      Jae-won saved a presentation preference - a concise bullet list of at most two options and no explanation
      unless something is blocked. Many valid times exist. The agent should apply the preference to this
      recruiter's answer while keeping every option valid and still asking before booking.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [recruiter_preference, presentation_style, option_count, seoul, tokyo]
    requirement_refs: [CFG-02, LRN-07, SCH-02]
    inputs:
      now: "2026-11-17T09:00:00+09:00"
      recruiter: {id: rec_jae, name: Jae-won Park, time_zone: Asia/Seoul}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Seo-yeon Lee
        time_zone: Asia/Seoul
        availability:
          - {start: "2026-11-19T09:00:00+09:00", end: "2026-11-19T17:00:00+09:00"}
      interview_plan:
        name: Mobile Engineer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_takeshi]}
      interviewers:
        - id: int_takeshi
          name: Takeshi Mori
          time_zone: Asia/Tokyo
          availability_source: calendar
