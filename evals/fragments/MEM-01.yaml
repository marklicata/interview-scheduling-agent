        - Imply the deleted data still exists somewhere accessible.
        - Send anything to Felipe without the recruiter's review.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate_availability, candidate_time_zone]

  - id: MEM-020
    title: New "I prefer mornings" preference is saved as a soft, recruiter-scoped ranking hint
    category: memory_and_learning
    subcategory: save_soft_preference
    description: >-
      Inês asks the agent to remember that she prefers morning interviews for all her candidates, then asks for
