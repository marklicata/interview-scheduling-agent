      Carmen's earlier case for a different requisition closed in August. The recruiter says "same as last time -
      use her old availability and setup" for a new requisition with its own plan. Old availability is months
      stale, the old plan does not apply, and an accommodation record from the prior process is restricted and
      must not be silently carried into a new case. The agent should confirm and request fresh inputs.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [closed_case_memory, new_requisition, stale_availability, accommodation_not_carried_silently, confirm_before_reuse]
    requirement_refs: [EC-146, UX-06, LRN-01, CON-09, COM-01]
    inputs:
      now: "2026-12-01T10:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Carmen Ruiz
        email: carmen.ruiz@example.com
      interview_plan:
        name: Analytics Engineer - phone screen
        requisition: REQ-8800
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_dev]}
      interviewers:
        - {id: int_dev, name: Dev Patel, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
      case_state:
        memory:
          entries:
            - {id: mem_case_6210_avail, owner: rec_maya, scope: "case:REQ-6210/Carmen Ruiz (closed 2026-08-14)", created_at: "2026-07-20T09:00:00-07:00", source: candidate email of July 20, content: "Tue/Thu mornings Pacific."}
            - {id: mem_case_6210_plan, owner: rec_maya, scope: "case:REQ-6210/Carmen Ruiz (closed 2026-08-14)", created_at: "2026-07-20T09:00:00-07:00", source: plan snapshot, content: "Data Analyst loop - three 45-minute sessions."}
            - {id: mem_case_6210_acc, owner: rec_maya, scope: "case:REQ-6210/Carmen Ruiz (closed 2026-08-14)", created_at: "2026-07-22T12:00:00-07:00", source: accommodations team, content: "Approved accommodation on file for REQ-6210 (record ACC-1830, restricted)."}
      conversation:
        - role: recruiter
          text: Carmen's back for REQ-8800. Same as last time - use her old availability and setup.
    expected:
