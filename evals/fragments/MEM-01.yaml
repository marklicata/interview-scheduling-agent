      case_state:
        memory:
          entries:
            - id: mem_pref_tom_autobook
              owner: rec_tom
              scope: recruiter_preference:rec_tom
              created_at: "2026-10-15T16:20:00-05:00"
              source: rec_tom chat remark
              content: Tom said "always book without asking me, I trust you."
