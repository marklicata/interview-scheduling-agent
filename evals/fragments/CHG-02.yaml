        int_yael: {time_zone: Asia/Jerusalem, busy: [["2027-01-18T09:00:00+02:00", "2027-01-18T10:00:00+02:00"], ["2027-01-18T11:30:00+02:00", "2027-01-18T12:30:00+02:00"]]}
      sessions:
        - {id: S2, duration_min: 60, attendees: [candidate, int_yael]}
      expect_feasible: true
      valid_examples:
        - {S2: "2027-01-18T10:00:00+02:00"}
      invalid_examples:
