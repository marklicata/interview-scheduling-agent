  - id: CHG-034
    title: '"Same time next week" across the US daylight-saving change - New York and London are 4 hours apart'
    category: changes_and_rescheduling
    subcategory: dst_between_original_and_new_date
    description: >-
      The original interview on Tuesday, March 9, 2027 was 10:00 a.m. EST = 3:00 p.m. GMT. The London candidate
      asks for "the same time next week". On March 16 New York is on daylight time and London is not, so the
      same London time is 11:00 a.m. EDT (interviewer busy) and the same New York time is 2:00 p.m. GMT (before the
      candidate's stated window). The only fit is 10:30-11:30 a.m. EDT = 2:30-3:30 p.m. GMT.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [dst_change, same_time_next_week, us_uk_mismatch, fixed_offset_trap, uk, us_eastern]
    requirement_refs: [SCH-01, AVL-10, CHG-01]
    inputs:
      now: "2027-03-08T09:00:00-05:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Fiona Walsh
        time_zone: Europe/London
        availability:
          - {start: "2027-03-16T14:30:00+00:00", end: "2027-03-16T17:00:00+00:00"}
      interview_plan:
        name: Credit Risk Analyst - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_tyler]}
      interviewers:
        - id: int_tyler
          name: Tyler Brooks
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-03-16T09:00:00-04:00", end: "2027-03-16T10:30:00-04:00", status: busy}
            - {start: "2027-03-16T11:30:00-04:00", end: "2027-03-16T12:30:00-04:00", status: busy}
            - {start: "2027-03-16T13:00:00-04:00", end: "2027-03-16T17:00:00-04:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_fw_s1, session: S1, start: "2027-03-09T10:00:00-05:00", end: "2027-03-09T11:00:00-05:00", attendees: [{id: candidate, response: accepted}, {id: int_tyler, response: accepted}]}
      conversation:
        - role: candidate
          at: "2027-03-07T18:00:00+00:00"
          channel: email
          text: >-
            Hi Omar, something has come up on Tuesday 9 March. Could we do the same time next week instead, Tuesday 16
            March? I'm free from 2:30 to 5pm UK time that day.
        - role: recruiter
          text: Fiona wants the same time next week. Can you move it?
    expected:
      disposition: propose_options
      solution_summary: >-
        On Tuesday, March 16, 2027 New York is on EDT (UTC-4) and London on GMT (UTC+0), so they are 4 hours apart.
        "Same time" cannot hold for both: 3:00 p.m. GMT is 11:00 a.m. EDT (Tyler busy 11:30) and 10:00 a.m. EDT is
        2:00 p.m. GMT (before Fiona's 2:30). The only fit is 10:30-11:30 a.m. EDT = 2:30-3:30 p.m. GMT. Ask to move
        evt_fw_s1 there.
      must:
        - Explain that the US changes clocks on March 14 and the UK on March 28, so the offset that week is 4 hours, not 5.
        - Explain why neither interpretation of "same time" works.
        - Propose only 10:30-11:30 a.m. EDT / 2:30-3:30 p.m. GMT on Tuesday, March 16 and ask to update evt_fw_s1.
      must_not:
        - Use a fixed 5-hour offset (e.g., claim 10:00 a.m. New York equals 3:00 p.m. London on March 16).
        - Book 10:00 a.m. EDT or 11:00 a.m. EDT.
        - Update anything without confirmation.
      side_effects: {external_writes: none}
