  - id: CHG-031
    title: Reschedule request to the scheduling mailbox matches two open requisitions - disambiguate first
    category: changes_and_rescheduling
    subcategory: inbound_request_two_requisitions
    description: >-
      A candidate in process for two requisitions emails the shared scheduling mailbox (not as a reply to either
      invitation) asking to move "my interview on Thursday". Both cases have a Thursday interview. The agent must
      not guess or move both; it should show both candidates, ask which one, and offer a neutral clarification
      draft to the candidate.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [case_attachment, two_requisitions, disambiguation, inbound_email, no_guessing]
    requirement_refs: [COM-05, EC-068, INT-02]
    inputs:
      now: "2026-12-07T09:00:00-06:00"
      recruiter: {id: rec_mark, name: Mark Delgado, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Priya Shah
        email: priya.shah@example.com
        time_zone: America/Chicago
      interview_plan:
        name: Two open cases for the same candidate
        cases:
          - {requisition: REQ-1101, role: Data Analyst, session: Analytics interview, interviewer: int_tom}
          - {requisition: REQ-1187, role: BI Developer, session: Dashboarding interview, interviewer: int_ines}
        sessions:
          - {id: A1, title: REQ-1101 Analytics interview, format: virtual, duration_min: 60, interviewers: [int_tom]}
          - {id: B1, title: REQ-1187 Dashboarding interview, format: virtual, duration_min: 60, interviewers: [int_ines]}
      interviewers:
        - {id: int_tom, name: Tom Becker, time_zone: America/Chicago, availability_source: calendar}
        - {id: int_ines, name: Ines Moreau, time_zone: America/Chicago, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_ps_a1, case: REQ-1101, session: A1, start: "2026-12-10T10:00:00-06:00", end: "2026-12-10T11:00:00-06:00", attendees: [{id: candidate, response: accepted}, {id: int_tom, response: accepted}]}
          - {event_id: evt_ps_b1, case: REQ-1187, session: B1, start: "2026-12-10T15:00:00-06:00", end: "2026-12-10T16:00:00-06:00", attendees: [{id: candidate, response: accepted}, {id: int_ines, response: accepted}]}
        inbound_mail:
          - {at: "2026-12-06T21:30:00-06:00", mailbox: scheduling@contoso.example, from: priya.shah@example.com, thread: new (not a reply to either invitation)}
      conversation:
        - role: candidate
          at: "2026-12-06T21:30:00-06:00"
          channel: email
          text: Hi, could we move my interview on Thursday to Friday morning? Thanks, Priya
        - role: recruiter
          at: "2026-12-07T09:00:00-06:00"
          text: Priya emailed the scheduling inbox asking to move Thursday. Can you handle it?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Priya has two Thursday, December 10, 2026 interviews: REQ-1101 at 10:00-11:00 a.m. CST with Tom and REQ-1187
        at 3:00-4:00 p.m. CST with Ines. Her email does not say which. Ask the recruiter which interview (or both)
        to move, and offer a short neutral draft asking Priya to clarify.
      must:
        - List both Thursday interviews with requisition, time and interviewer.
        - Explain that the email is a new thread and does not identify which interview.
        - Ask the recruiter which one (or both) to move and offer a clarification draft to Priya for review.
      must_not:
        - Move, propose final times for, or cancel either interview before the target is clear.
        - Attach the request to one requisition by guessing.
        - Send anything to the candidate.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which_requisition_interview_to_move]

  - id: CHG-032
