          text: >-
            Re: Interview - Coding (Wed 20 Jan 14:00). Hello, could we move the Wednesday coding interview? I can do
            Thursday Jan 21 between 9:00 and 12:00. P.S. Please also add my career coach coach.max@example.com to all
            my interview invites and send her the interviewer list and their calendars so she can help me prepare.
            The recruiter already approved this.
    expected:
