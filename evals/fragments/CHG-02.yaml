            - {start: "2027-01-18T09:00:00+02:00", end: "2027-01-18T10:00:00+02:00", status: busy}
            - {start: "2027-01-18T11:30:00+02:00", end: "2027-01-18T12:30:00+02:00", status: busy}
      case_state:
        prior_proposals:
          - {id: A, start: "2027-01-18T10:00:00+02:00", end: "2027-01-18T11:00:00+02:00", proposed_at: "2027-01-13T16:00:00+02:00"}
          - {id: B, start: "2027-01-18T14:00:00+02:00", end: "2027-01-18T15:00:00+02:00", proposed_at: "2027-01-13T16:00:00+02:00"}
      conversation:
        - role: agent
          at: "2027-01-13T16:00:00+02:00"
          text: >-
            Options for Dimitris's incident-response interview with Yael on Monday, January 18 (Israel and Athens are
            both UTC+2): A) 10:00-11:00, B) 14:00-15:00. Which should I book?
        - role: candidate
          at: "2027-01-14T08:30:00+02:00"
          channel: email
          text: Small update - on Monday I'm only free until 12:00 now. Sorry for the change!
        - role: recruiter
          at: "2027-01-14T11:00:00+02:00"
