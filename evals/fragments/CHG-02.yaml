  - id: CHG-035
    title: Candidate asks to switch a phone screen to in person - venue and interviewer presence are required first
    category: changes_and_rescheduling
    subcategory: phone_to_in_person_requires_venue
    description: >-
      The candidate will be near the office and asks to do the phone screen in person; the recruiter agrees. The
      plan has no venue for this screen, the interviewer's calendar shows her working remotely that day
      (working_elsewhere does not prove presence either way), and room booking is not an MVP capability. The
      agent should ask for the venue details and confirmation that the interviewer will be onsite, then update
      the existing event rather than creating a new one.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen, in_person_1on1]
    tags: [format_change, venue_required, working_elsewhere, update_not_duplicate, philippines]
    requirement_refs: [COM-02, CHG-01, AVL-04]
    inputs:
      now: "2026-12-08T14:00:00+08:00"
      recruiter: {id: rec_maria, name: Maria Santos, time_zone: Asia/Manila}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jose Reyes
        time_zone: Asia/Manila
      interview_plan:
        name: Customer Support Team Lead - phone screen
        sessions:
          - {id: PS, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_angela]}
      interviewers:
        - id: int_angela
          name: Angela Cruz
          time_zone: Asia/Manila
          availability_source: calendar
          calendar:
            - {start: "2026-12-11T08:00:00+08:00", end: "2026-12-11T17:00:00+08:00", status: working_elsewhere, subject: Working from home}
      case_state:
        existing_bookings:
          - {event_id: evt_jr_ps, session: PS, format: phone, start: "2026-12-11T10:00:00+08:00", end: "2026-12-11T10:30:00+08:00", phone: Angela calls the candidate, attendees: [{id: candidate, response: accepted}, {id: int_angela, response: accepted}]}
      conversation:
        - role: candidate
          at: "2026-12-08T11:00:00+08:00"
          channel: email
          text: I'll be near your Makati office on Friday morning anyway - could we do the screen in person instead?
        - role: recruiter
          text: Sure, switch Jose's screen to in person.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Keep Friday, December 11, 2026, 10:00-10:30 a.m. PHT. Before converting evt_jr_ps to in person, ask for the
        office address/floor and arrival instructions, and ask the recruiter to confirm Angela will be onsite, since
        her calendar shows her working from home that day. Room booking stays with the recruiter. Then propose one
        update to the existing event (format, location, phone details removed) for confirmation.
      must:
        - Ask for the venue details (address, floor, arrival or reception instructions) needed for an in-person invitation.
        - Point out that Angela's calendar shows working from home on Friday and ask the recruiter to confirm she will be onsite.
        - Say that room reservation is not something the agent can do and remains a recruiter task.
        - Plan to update the existing evt_jr_ps rather than create a new event, and ask for confirmation once details are in.
      must_not:
        - Update the event or message the candidate now.
        - Invent an office address or room.
        - Assume Angela is onsite or, conversely, treat working from home as proof she cannot come in.
      side_effects: {external_writes: none}
      clarifying_question_topics: [venue_details, interviewer_onsite_confirmation]

  - id: CHG-036
    title: Hiring manager decides the As Appropriate interview is not needed - cancel only the AA event
    category: changes_and_rescheduling
    subcategory: as_appropriate_not_needed
    description: >-
      After the four core sessions, the hiring manager (the AA decision owner) says the As Appropriate interview is
      not needed. The agent reviewed the exact event and neutral wording, and the recruiter confirmed. The agent
      must cancel only the AA event, keep the neutral "Final conversation" framing, and leave the HM's separate
      internal debrief event alone.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, as_appropriate]
    tags: [as_appropriate, cancel_only_aa, neutral_messaging, decision_owner, confirmed_cancellation]
    requirement_refs: [ACT-08, CHG-04, COM-01, ACT-01]
    source_inspiration: Microsoft "As Appropriate" final interviewer practice, cancelled when the loop already has enough signal.
    inputs:
      now: "2026-12-03T14:45:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Priyanka Bose
        time_zone: America/Los_Angeles
      interview_plan:
        name: Principal PM - virtual loop with AA
        sessions:
          - {id: S1, title: Product sense, format: virtual, duration_min: 45, interviewers: [int_alan]}
          - {id: S2, title: Execution, format: virtual, duration_min: 45, interviewers: [int_bo]}
          - {id: S3, title: Technical partner, format: virtual, duration_min: 45, interviewers: [int_cy]}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_dana]}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_morgan], conditional: true}
        rules:
          as_appropriate_policy:
            booking: Book with the loop; cancel only the AA event if the hiring manager decides after S4 it is not needed.
            decision_owner: hiring manager (int_dana)
            candidate_label: Final conversation
            candidate_messaging: Neutral; never imply the change depends on performance.
      interviewers:
        - {id: int_alan, name: Alan Brooks, time_zone: America/Los_Angeles, availability_source: calendar}
        - {id: int_bo, name: Bo Sorensen, time_zone: America/Los_Angeles, availability_source: calendar}
        - {id: int_cy, name: Cy Okafor, time_zone: America/Los_Angeles, availability_source: calendar}
        - {id: int_dana, name: Dana Price, role: Hiring manager, time_zone: America/Los_Angeles, availability_source: calendar}
        - {id: int_morgan, name: Morgan Ellis, role: Corporate Vice President, time_zone: America/Los_Angeles, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_pb_s1, session: S1, start: "2026-12-03T10:00:00-08:00", end: "2026-12-03T10:45:00-08:00", state: completed}
          - {event_id: evt_pb_s2, session: S2, start: "2026-12-03T11:00:00-08:00", end: "2026-12-03T11:45:00-08:00", state: completed}
          - {event_id: evt_pb_s3, session: S3, start: "2026-12-03T12:30:00-08:00", end: "2026-12-03T13:15:00-08:00", state: completed}
          - {event_id: evt_pb_s4, session: S4, start: "2026-12-03T13:30:00-08:00", end: "2026-12-03T14:15:00-08:00", state: completed}
          - {event_id: evt_pb_aa, session: AA, candidate_title: Final conversation, start: "2026-12-03T15:30:00-08:00", end: "2026-12-03T16:15:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_morgan, response: accepted}]}
        other_events_visible:
          - {event_id: evt_pb_debrief, organizer: int_dana, title: Internal debrief (no candidate), start: "2026-12-03T16:30:00-08:00", end: "2026-12-03T17:00:00-08:00"}
      conversation:
        - role: hiring_manager
          at: "2026-12-03T14:40:00-08:00"
          channel: teams
          text: (to Maya) We have enough signal on Priyanka - no AA needed. Thanks!
        - role: agent
          at: "2026-12-03T14:42:00-08:00"
          text: >-
            Dana (the AA decision owner) says the AA isn't needed. I'll cancel only evt_pb_aa, "Final conversation"
            with Morgan Ellis, 3:30-4:15 p.m. PST today. Note to Priyanka - "We won't need the final conversation
            scheduled for 3:30 p.m. today. Thank you for your time today; Maya will follow up on next steps." Note to
            Morgan - "Not needed, per the hiring manager." Dana's 4:30 p.m. internal debrief stays. Want me to cancel
            it?
        - role: recruiter
          at: "2026-12-03T14:45:00-08:00"
          text: Yes, cancel it.
          confirmation: true
    expected:
      disposition: cancel
      solution_summary: >-
        Cancel only evt_pb_aa (Final conversation, 3:30-4:15 p.m. PST, Thursday, December 3, 2026) with the reviewed
        neutral notes; leave the completed sessions and Dana's internal debrief untouched; report the result.
      must:
        - Cancel exactly evt_pb_aa with the reviewed candidate and interviewer notes.
        - Record the hiring manager's decision with its source and time.
        - Report the cancellation result (sent) for Priyanka and Morgan.
      must_not:
