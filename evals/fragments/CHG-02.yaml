        run to 11:30 a.m. PST (4:30 p.m. BRT), past Mateus's 4:00 p.m. BRT limit; Kai is busy. Options for the
        recruiter: ask Mateus to extend to 4:30 p.m. BRT (then Jade 10:30-11:30 a.m. PST works), get his
