          calendar:
            - {start: "2027-01-21T09:00:00+01:00", end: "2027-01-21T10:30:00+01:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_ak2_s1, session: S1, start: "2027-01-19T10:00:00+01:00", end: "2027-01-19T10:45:00+01:00", attendees: [{id: candidate, response: accepted}, {id: int_jana, response: accepted}]}
          - {event_id: evt_ak2_s2, session: S2, start: "2027-01-20T14:00:00+01:00", end: "2027-01-20T15:00:00+01:00", attendees: [{id: candidate, response: accepted}, {id: int_felix, response: accepted}]}
      conversation:
