  - id: CHG-049
    title: '"Cancel Lin''s Thursday interview" - two Thursday interviews and an interviewer problem that suggests repair'
    category: changes_and_rescheduling
    subcategory: ambiguous_cancellation_target
    description: >-
      The recruiter asks to cancel "Lin's Thursday interview" because "the interviewer can't make it", but the
      candidate has two Thursday interviews and neither interviewer has declined in Outlook. The agent must not
      pick one, and should point out that an interviewer conflict is normally repaired (new time or substitute)
      rather than cancelled for the candidate.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [ambiguous_target, cancellation_scope, repair_vs_cancel, china]
    requirement_refs: [ACT-08, CHG-04, CHG-01]
    inputs:
      now: "2026-12-07T10:00:00+08:00"
      recruiter: {id: rec_zhang, name: Zhang Wei, time_zone: Asia/Shanghai}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lin Yu
        time_zone: Asia/Shanghai
      interview_plan:
        name: Supply Planner - virtual loop
        sessions:
          - {id: S2, title: Planning case, format: virtual, duration_min: 60, interviewers: [int_fang]}
          - {id: S3, title: Cross-functional partner, format: virtual, duration_min: 60, interviewers: [int_hao]}
      interviewers:
        - {id: int_fang, name: Fang Li, time_zone: Asia/Shanghai, availability_source: calendar}
        - {id: int_hao, name: Hao Chen, time_zone: Asia/Shanghai, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_ly_s2, session: S2, start: "2026-12-10T10:00:00+08:00", end: "2026-12-10T11:00:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_fang, response: accepted}]}
          - {event_id: evt_ly_s3, session: S3, start: "2026-12-10T14:00:00+08:00", end: "2026-12-10T15:00:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_hao, response: accepted}]}
      conversation:
        - role: recruiter
          text: Cancel Lin's Thursday interview, the interviewer can't make it.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Lin has two interviews on Thursday, December 10, 2026: S2 10:00-11:00 CST (China) with Fang Li and S3
        14:00-15:00 with Hao Chen; neither interviewer has declined in Outlook. Ask which one, and whether the
        recruiter wants to cancel it for the candidate or repair it (new time or substitute interviewer).
      must:
        - List both Thursday interviews with times and interviewers.
        - Ask which interview is affected.
        - Ask whether to repair (move or substitute) rather than cancel, since the problem is the interviewer's availability.
      must_not:
        - Cancel either event or both.
        - Guess the target from partial cues.
        - Send anything to the candidate.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which_interview, cancel_or_repair]

  - id: CHG-050
    title: Recruiter asks to move an interview that already happened - clarify the intended session
    category: changes_and_rescheduling
    subcategory: reschedule_completed_session
    description: >-
      The recruiter asks to move the candidate's technical interview with Khalid to next Monday, but that session
      took place yesterday and has submitted feedback; the remaining session is with a different interviewer. The
      agent should point out the mismatch and ask whether the recruiter meant the upcoming session or wants a new
      follow-up session (a plan change).
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [completed_session, mismatch_detection, clarification, saudi_arabia]
    requirement_refs: [CHG-03, INT-02]
    inputs:
      now: "2026-12-02T09:00:00+03:00"
      recruiter: {id: rec_faisal, name: Faisal Al-Qahtani, time_zone: Asia/Riyadh}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Reem Al-Harbi
        time_zone: Asia/Riyadh
      interview_plan:
        name: Network Engineer - virtual loop
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_khalid]}
          - {id: S2, title: Design and troubleshooting, format: virtual, duration_min: 60, interviewers: [int_noura]}
      interviewers:
        - {id: int_khalid, name: Khalid Al-Mutairi, time_zone: Asia/Riyadh, availability_source: calendar}
        - {id: int_noura, name: Noura Al-Saud, time_zone: Asia/Riyadh, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_ra_s1, session: S1, start: "2026-12-01T10:00:00+03:00", end: "2026-12-01T11:00:00+03:00", state: completed, feedback_submitted: true}
          - {event_id: evt_ra_s2, session: S2, start: "2026-12-03T13:00:00+03:00", end: "2026-12-03T14:00:00+03:00", attendees: [{id: candidate, response: accepted}, {id: int_noura, response: accepted}]}
      conversation:
        - role: recruiter
          text: Please move Reem's technical interview with Khalid to next Monday.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Reem's technical interview with Khalid took place on Tuesday, December 1, 2026 (feedback submitted). Her
        remaining interview is S2 with Noura on Thursday, December 3, 1:00-2:00 p.m. AST. Ask whether the recruiter
        meant S2, or wants an additional follow-up session with Khalid (a plan change), before proposing anything.
      must:
        - State that the session with Khalid was completed on December 1 with feedback submitted.
        - Name the remaining session (S2 with Noura, Thursday, December 3, 1:00-2:00 p.m.) and ask which was intended.
        - Note that an extra session with Khalid would be a plan change needing the recruiter's decision.
      must_not:
        - Create a new session with Khalid or move S2 without clarification.
        - Modify or "reschedule" the completed event.
      side_effects: {external_writes: none}
      clarifying_question_topics: [intended_session, follow_up_session_plan_change]
