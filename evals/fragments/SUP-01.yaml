  - id: SUP-013
    title: Supplied window contradicted by a newer calendar event - use the uncontested parts and reconcile visibly
    category: supplied_availability
    subcategory: supplied_vs_calendar_contradiction
    description: >-
      Two days ago the interviewer said he was free Wednesday 14:00-17:00. His calendar, readable now, shows a
      steering committee 15:00-16:00 that was created yesterday. The agent must not silently pick either source:
      it should offer the uncontested hours (14:00 and 16:00), point out the contradiction for 15:00, and ask the
      recruiter to confirm with the interviewer if that hour is wanted.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, case_interview]
    tags: [contradiction, supplied_vs_calendar, recency, reconcile_visibly, france]
    requirement_refs: [AVL-15, AVL-14, EC-155]
    inputs:
      now: "2026-12-11T09:00:00+01:00"
      recruiter: {id: rec_fatou, name: Fatou Diallo, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Antoine Mercier
        time_zone: Europe/Paris
        availability:
          - {start: "2026-12-16T14:00:00+01:00", end: "2026-12-16T17:00:00+01:00"}
      interview_plan:
        name: Pricing Analyst - case interview
        sessions:
          - {id: CASE, title: Pricing case, format: virtual, duration_min: 60, interviewers: [int_lucas]}
      interviewers:
        - id: int_lucas
          name: Lucas Bernard
          time_zone: Europe/Paris
          availability_source: mixed
          supplied_availability:
            - {start: "2026-12-16T14:00:00+01:00", end: "2026-12-16T17:00:00+01:00", supplied_at: "2026-12-09T11:00:00+01:00", source: Lucas via recruiter}
          calendar_fetched_at: "2026-12-11T09:00:00+01:00"
          calendar:
            - {start: "2026-12-16T15:00:00+01:00", end: "2026-12-16T16:00:00+01:00", status: busy, subject: Steering committee, created_at: "2026-12-10T08:30:00+01:00"}
      conversation:
        - role: recruiter
          text: Lucas told me Wed 2-5 is free. Antoine is free then too. Book 3pm?
    expected:
      disposition: propose_options
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Lucas's supplied 14:00-17:00 (given December 9) conflicts with a steering committee 15:00-16:00 CET on his
        calendar that was added December 10. Uncontested options on Wednesday, December 16, 2026: 2:00-3:00 p.m. or
        4:00-5:00 p.m. CET. 3:00 p.m. needs Lucas's explicit confirmation that he is free despite the new meeting.
      must:
        - Point out that the 3:00-4:00 p.m. calendar event was created after Lucas supplied his window, so the two sources disagree.
        - Offer 2:00-3:00 p.m. and 4:00-5:00 p.m. CET on Wednesday, December 16 as options consistent with both sources.
        - Tell the recruiter that 3:00 p.m. requires Lucas's current explicit confirmation, and ask which option to book.
      must_not:
        - Book 3:00 p.m. based only on the older supplied window.
        - Silently discard Lucas's supplied window or the calendar event.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-16T09:00:00+01:00", end: "2026-12-16T18:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Paris, available: [["2026-12-16T14:00:00+01:00", "2026-12-16T17:00:00+01:00"]]}
        int_lucas:
          time_zone: Europe/Paris
          available: [["2026-12-16T14:00:00+01:00", "2026-12-16T17:00:00+01:00"]]
          busy: [["2026-12-16T15:00:00+01:00", "2026-12-16T16:00:00+01:00"]]
      sessions:
        - {id: CASE, duration_min: 60, attendees: [candidate, int_lucas]}
      expect_feasible: true
      valid_examples:
        - {CASE: "2026-12-16T14:00:00+01:00"}
        - {CASE: "2026-12-16T16:00:00+01:00"}
      invalid_examples:
        - {CASE: "2026-12-16T15:00:00+01:00", note: Contested by the newer calendar event.}
      valid_start_bounds:
        CASE: {earliest: "2026-12-16T14:00:00+01:00", latest: "2026-12-16T16:00:00+01:00"}

  - id: SUP-014
    title: Interviewer's explicit current confirmation supersedes a stale calendar block
    category: supplied_availability
    subcategory: explicit_confirmation_supersedes_calendar
    description: >-
      The interviewer's calendar still shows a vendor call at the only candidate-compatible hour, but she tells the
      recruiter in Teams that the call was cancelled and she is free. That is an attributable, current, specific
      confirmation that supersedes the calendar for that hour. The agent should use it, record the reconciliation,
      and still mention the calendar discrepancy.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [explicit_confirmation, superseding_evidence, reconcile_visibly, bulgaria]
    requirement_refs: [AVL-15, GS-053, EC-155]
    inputs:
      now: "2026-12-14T10:00:00+02:00"
      recruiter: {id: rec_ivan, name: Ivan Petrov, time_zone: Europe/Sofia}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Nikolai Georgiev
        time_zone: Europe/Sofia
        availability:
          - {start: "2026-12-17T15:00:00+02:00", end: "2026-12-17T16:00:00+02:00"}
      interview_plan:
        name: Localization Engineer - technical interview
        sessions:
          - {id: TECH, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_svetla]}
      interviewers:
        - id: int_svetla
          name: Svetla Ivanova
          time_zone: Europe/Sofia
          availability_source: mixed
          calendar:
            - {start: "2026-12-17T15:00:00+02:00", end: "2026-12-17T16:00:00+02:00", status: busy, subject: Vendor call}
          supplied_availability:
            - {start: "2026-12-17T15:00:00+02:00", end: "2026-12-17T16:00:00+02:00", supplied_at: "2026-12-14T09:50:00+02:00", source: Svetla via Teams}
      conversation:
        - role: interviewer
          channel: teams
          at: "2026-12-14T09:50:00+02:00"
          text: The vendor call on Thursday at 3 is cancelled - the organizer just hasn't removed it yet. I'm free 15:00-16:00 for the interview.
        - role: recruiter
          text: Forwarding Svetla's note. Nikolai only has Thursday 3-4pm. OK to go ahead?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes: Thursday, December 17, 2026, 3:00-4:00 p.m. EET, based on Svetla's explicit confirmation that the vendor
        call is cancelled. Note that her calendar still shows it as busy; record her confirmation as the reason. Ask
        whether to book.
      must:
        - Propose 3:00-4:00 p.m. EET on Thursday, December 17.
        - State that Svetla's calendar still shows a busy vendor call and that her explicit current confirmation is being used to supersede it for this hour.
        - Ask whether to book.
      must_not:
        - Ignore Svetla's confirmation and report no availability.
        - Edit or delete the vendor-call event on her calendar.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
