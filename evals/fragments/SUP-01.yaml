  - id: SUP-030
    title: Supplied block list includes a "maybe" call - treat it as blocking, offer it only conditionally
    category: supplied_availability
    subcategory: uncertain_supplied_block
    description: >-
      The Singapore interviewer's complete list for Monday includes a firm block and a "maybe 14:00-15:00, might have
      a call". An uncertain self-reported block behaves like tentative: it blocks by default. The Jakarta candidate's
      window covers the maybe-hour and the hour after it, so the agent proposes the clean hour and offers the
      maybe-hour only as conditional.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [uncertain_block, tentative_like, supplied_block_list, singapore, indonesia]
    requirement_refs: [AVL-13, AVL-09, CRD-01]
    inputs:
      now: "2027-02-24T10:00:00+08:00"
      recruiter: {id: rec_sanjay, name: Sanjay Gupta, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Putri Wulandari
        time_zone: Asia/Jakarta
        availability:
          - {start: "2027-03-01T13:00:00+07:00", end: "2027-03-01T15:00:00+07:00"}
      interview_plan:
        name: Treasury Analyst - interview
        sessions:
          - {id: S1, title: Treasury interview, format: virtual, duration_min: 60, interviewers: [int_wenhui]}
      interviewers:
        - id: int_wenhui
          name: Lim Wen Hui
          time_zone: Asia/Singapore
          availability_source: supplied
          supplied_blocks:
            complete: true
            period: {start: "2027-03-01T09:00:00+08:00", end: "2027-03-01T18:00:00+08:00"}
            blocks:
              - {start: "2027-03-01T10:00:00+08:00", end: "2027-03-01T11:00:00+08:00", certainty: firm}
              - {start: "2027-03-01T14:00:00+08:00", end: "2027-03-01T15:00:00+08:00", certainty: maybe}
            source_text: "Mon 1 Mar 9-6 SGT: blocked 10-11 (team meeting); maybe 14:00-15:00 - might have a call, not sure yet. Otherwise free."
      conversation:
        - role: recruiter
          text: Wen Hui sent her Monday blocks. Putri is in Jakarta, free 1-3pm her time. What can we do?
    expected:
      disposition: propose_options
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Firm option: Monday, March 1, 2027, 2:00-3:00 p.m. WIB (3:00-4:00 p.m. SGT). 1:00-2:00 p.m. WIB (2:00-3:00 p.m. SGT)
        overlaps Wen Hui's "maybe" call and is only conditional on her confirming it will not happen.
      must:
        - Treat the "maybe" 2:00-3:00 p.m. SGT block as blocking by default, like a tentative event.
        - Offer 2:00-3:00 p.m. WIB (3:00-4:00 p.m. SGT) on Monday, March 1 as the firm option.
        - Present 1:00-2:00 p.m. WIB only as conditional, with a precise question for Wen Hui, and ask which to book.
      must_not:
        - Present 1:00-2:00 p.m. WIB as fully available.
