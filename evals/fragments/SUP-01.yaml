  - id: SUP-018
    title: Candidate forwards what the interviewer supposedly said - not an interviewer source
    category: supplied_availability
    subcategory: candidate_relayed_interviewer_availability
    description: >-
      The candidate writes that the interviewer told them at a conference she is free Thursday 1-3 p.m., and asks
      for 1 p.m. The interviewer's calendar is accessible and shows a busy meeting 1-2 p.m. A candidate relay is
      not interviewer-supplied availability and cannot override the calendar. The agent should propose the
      calendar-valid 2 p.m. hour and, if 1 p.m. is wanted, have the recruiter check with the interviewer.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, job_talk]
    tags: [source_attribution, candidate_relay, untrusted_source, calendar_conflict]
    requirement_refs: [AVL-15, AVL-01, INV-08, CRD-03]
