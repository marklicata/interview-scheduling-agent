  - id: SUP-036
    title: Pasted table has one zone-less row - clarify only that row, keep the rest
    category: supplied_availability
    subcategory: table_partial_missing_zone
    description: >-
      A two-interviewer mini-loop. The pasted table gives one interviewer's row in Pacific time and the other's
      "4:00-6:00 pm" with a blank zone and a note that he is in Dublin that week (his profile says New York). In the
      US/EU daylight-saving mismatch week, Dublin reading gives 9-11 a.m. Pacific (feasible) and New York reading gives
      1-3 p.m. Pacific (outside the candidate). The agent should ask one targeted question and not re-request the
      complete row.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [pasted_table, missing_time_zone, targeted_clarification, dst_mismatch, ireland]
    requirement_refs: [AVL-13, EC-154, AVL-10, INT-05]
    inputs:
      now: "2027-03-10T10:00:00-08:00"
      recruiter: {id: rec_rafael, name: Rafael Cruz, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mei Chen
        time_zone: America/Los_Angeles
        availability:
          - {start: "2027-03-18T09:00:00-07:00", end: "2027-03-18T12:00:00-07:00"}
      interview_plan:
        name: Solutions Architect - mini loop
        sessions:
          - {id: S1, title: Architecture, format: virtual, duration_min: 60, interviewers: [int_tanvi]}
          - {id: S2, title: Customer scenario, format: virtual, duration_min: 45, interviewers: [int_owen]}
        rules: {same_day: true, break_between_sessions_min: 10}
      interviewers:
        - {id: int_tanvi, name: Tanvi Rao, time_zone: America/Los_Angeles, availability_source: supplied}
        - {id: int_owen, name: Owen Gallagher, time_zone: America/New_York, availability_source: supplied}
      conversation:
        - role: coordinator
          text: |
            | Interviewer    | Date       | Time        | Zone    | Notes                      |
            |----------------|------------|-------------|---------|----------------------------|
            | Tanvi Rao      | Thu Mar 18 | 9:00-11:00  | Pacific |                            |
            | Owen Gallagher | Thu Mar 18 | 4:00-6:00pm |         | I'm in Dublin that week    |
            Mei is free 9-12 Pacific on the 18th.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask only which zone Owen's 4:00-6:00 p.m. is in. If Dublin (GMT that week), it is 9:00-11:00 a.m. PDT on Thursday,
        March 18, 2027 and both sessions fit (for example Owen 9:00-9:45 and Tanvi 10:00-11:00 a.m. PDT). If New York
        (EDT), it is 1:00-3:00 p.m. PDT, outside Mei's window. Tanvi's row is complete and needs no follow-up.
      must:
        - Ask a single targeted question about the time zone of Owen's row, mentioning the Dublin note versus his New York profile.
        - Show both interpretations in Pacific time (9:00-11:00 a.m. PDT versus 1:00-3:00 p.m. PDT).
        - Use the correct offsets for that week (Dublin UTC+0, Pacific UTC-7, New York UTC-4) because US daylight saving has started but Ireland's has not.
        - Treat Tanvi's row as complete and not ask about it.
      must_not:
        - Assume Dublin or New York and propose or book.
        - Re-request availability for Tanvi.
      side_effects: {external_writes: none}
      clarifying_question_topics: [time zone of Owen's supplied row]
    local_time_checks:
      - {instant: "2027-03-18T16:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-18T09:00", expected_weekday: Thursday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-18T16:00:00Z", time_zone: Europe/Dublin, expected_local: "2027-03-18T16:00", expected_utc_offset: "+00:00"}
      - {instant: "2027-03-18T20:00:00Z", time_zone: America/New_York, expected_local: "2027-03-18T16:00", expected_utc_offset: "-04:00"}
      - {instant: "2027-03-18T20:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-18T13:00"}

