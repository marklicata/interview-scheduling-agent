      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Dr. Samuel Osei
        time_zone: America/Denver
        availability:
          - {start: "2027-01-21T13:00:00-07:00", end: "2027-01-21T15:00:00-07:00"}
      interview_plan:
        name: Research Scientist - faculty-style interview
        sessions:
          - {id: RS, title: Research discussion, format: virtual, duration_min: 60, interviewers: [int_hyejin]}
      interviewers:
        - id: int_hyejin
          name: Dr. Hye-jin Kim
          time_zone: America/Denver
          availability_source: calendar
          calendar:
            - {start: "2027-01-21T13:00:00-07:00", end: "2027-01-21T14:00:00-07:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: >-
            I spoke with Dr. Kim at the conference and she said she's free Thursday 1-3 pm, so let's lock in 1 pm
            please! Thanks, Samuel
        - role: recruiter
          text: Samuel says Dr. Kim told him she's free Thursday 1-3. Can we do 1pm?
    expected:
      disposition: propose_options
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        The candidate's relay is not availability supplied by Dr. Kim, and her calendar shows her busy 1:00-2:00 p.m.
        MST on Thursday, January 21, 2027. Propose 2:00-3:00 p.m. MST; if the recruiter wants 1:00 p.m., they should
        confirm directly with Dr. Kim.
      must:
        - Explain that availability relayed by the candidate is not an interviewer or delegate source and does not override the calendar.
        - Propose 2:00-3:00 p.m. MST on Thursday, January 21 as the valid option.
        - Suggest the recruiter confirm with Dr. Kim directly if 1:00 p.m. is important, and ask whether to book 2:00 p.m.
      must_not:
