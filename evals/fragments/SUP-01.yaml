  - id: SUP-027
    title: Supplied "Mondays 4-6 pm London" across the US/UK daylight-saving mismatch
    category: supplied_availability
    subcategory: supplied_recurrence_dst_mismatch
    description: >-
      A London interviewer offers Mondays 4-6 p.m. London time for three weeks. The New York candidate offers 1-2 p.m.
      EDT on March 22 and March 29. On March 22 London is still on GMT (four hours ahead of New York), so 1 p.m. EDT is
      5 p.m. London - valid. On March 29 London is on BST (five hours ahead), so 1 p.m. EDT is 6 p.m. London - outside
      the window. A fixed offset gets at least one date wrong.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [supplied_recurrence, dst_mismatch, uk, us_east]
    requirement_refs: [AVL-13, AVL-10]
    inputs:
      now: "2027-03-10T10:00:00-05:00"
      recruiter: {id: rec_omar_b, name: Omar Benali, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ashley Morgan
        time_zone: America/New_York
        availability:
          - {start: "2027-03-22T13:00:00-04:00", end: "2027-03-22T14:00:00-04:00"}
          - {start: "2027-03-29T13:00:00-04:00", end: "2027-03-29T14:00:00-04:00"}
      interview_plan:
        name: Compliance Director - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_george_e]}
      interviewers:
        - id: int_george_e
          name: George Ellis
          time_zone: Europe/London
          availability_source: supplied
          supplied_availability_raw: "Mondays 4-6 pm London time for the next three weeks (15, 22 and 29 March)."
          supplied_availability:
            - {start: "2027-03-15T16:00:00+00:00", end: "2027-03-15T18:00:00+00:00"}
            - {start: "2027-03-22T16:00:00+00:00", end: "2027-03-22T18:00:00+00:00"}
            - {start: "2027-03-29T16:00:00+01:00", end: "2027-03-29T18:00:00+01:00"}
      conversation:
        - role: recruiter
          text: George is free Mondays 4-6pm London. Ashley can do 1-2pm Eastern on Mar 22 or Mar 29. Both work, right?
    expected:
      disposition: propose_options
      solution_summary: >-
        Only Monday, March 22, 2027 works: 1:00-2:00 p.m. EDT = 5:00-6:00 p.m. GMT. On Monday, March 29, 1:00 p.m. EDT
        is 6:00 p.m. BST, after George's window, because the UK moves to summer time on March 28.
      must:
        - Propose only Monday, March 22, 1:00-2:00 p.m. EDT (5:00-6:00 p.m. GMT).
        - Explain that March 29 fails because the UK changes to BST on March 28, making 1:00 p.m. EDT 6:00 p.m. in London.
        - Correct the recruiter's assumption that both dates work, and ask whether to book March 22.
      must_not:
        - Propose March 29 at 1:00 p.m. EDT.
        - Use a fixed four- or five-hour offset for both dates.
        - Book before confirmation.
      side_effects: {external_writes: none}
