      search_window: {start: "2026-12-17T09:00:00+02:00", end: "2026-12-17T18:00:00+02:00"}
      participants:
        candidate: {time_zone: Europe/Sofia, available: [["2026-12-17T15:00:00+02:00", "2026-12-17T16:00:00+02:00"]]}
        int_svetla: {time_zone: Europe/Sofia, available: [["2026-12-17T15:00:00+02:00", "2026-12-17T16:00:00+02:00"]]}
      sessions:
        - {id: TECH, duration_min: 60, attendees: [candidate, int_svetla]}
      expect_feasible: true
      valid_examples:
        - {TECH: "2026-12-17T15:00:00+02:00"}
      valid_start_bounds:
        TECH: {earliest: "2026-12-17T15:00:00+02:00", latest: "2026-12-17T15:00:00+02:00"}
    grading_notes: The oracle reflects the reconciled evidence (explicit confirmation supersedes the stale calendar block for this hour).

  - id: SUP-015
    title: '"Available 9-5, prefer 10-12" - preference ranks options but does not shrink availability'
    category: supplied_availability
    subcategory: preferred_vs_available
    description: >-
      The Budapest interviewer is available all day but prefers 10-12. The London candidate has a morning and an
      afternoon window. The agent should rank the option that falls inside the preference first while still
      listing other valid options, and not treat the preference as the only window.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [preference_vs_availability, ranking, supplied_windows, hungary, uk]
    requirement_refs: [AVL-12, SCH-06, CON-05]
    inputs:
      now: "2027-01-05T10:00:00+01:00"
      recruiter: {id: rec_noemi, name: Noemi Varga, time_zone: Europe/Budapest}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sophie Turner-Hall
        time_zone: Europe/London
        availability:
          - {start: "2027-01-11T08:00:00+00:00", end: "2027-01-11T10:00:00+00:00"}
          - {start: "2027-01-11T13:00:00+00:00", end: "2027-01-11T15:00:00+00:00"}
      interview_plan:
        name: Quantitative Analyst - interview
        sessions:
          - {id: QA, title: Quant interview, format: virtual, duration_min: 60, interviewers: [int_balazs]}
      interviewers:
        - id: int_balazs
          name: Balazs Toth
          time_zone: Europe/Budapest
          availability_source: supplied
          supplied_availability:
            - {start: "2027-01-11T09:00:00+01:00", end: "2027-01-11T17:00:00+01:00", label: available}
          supplied_preferences:
            - {start: "2027-01-11T10:00:00+01:00", end: "2027-01-11T12:00:00+01:00", label: preferred}
      conversation:
        - role: recruiter
          text: Balazs says he's available Monday 9-5 Budapest time but prefers 10-12. Sophie is in London - 8-10am or 1-3pm. Options?
    expected:
      disposition: propose_options
      solution_summary: >-
        Recommended: Monday, January 11, 2027, 9:00-10:00 a.m. GMT (10:00-11:00 a.m. CET), inside Balazs's preference.
        Also valid: other starts from 8:00 to 9:00 a.m. GMT and from 1:00 to 2:00 p.m. GMT (2:00-3:00 p.m. CET starts).
      must:
        - Rank 9:00-10:00 a.m. GMT (10:00-11:00 a.m. CET) first as the option inside Balazs's preferred window.
        - Present other valid options within his available 09:00-17:00 CET, such as 1:00-2:00 p.m. GMT (2:00-3:00 p.m. CET).
        - Ask which option to book.
      must_not:
        - Treat 10:00-12:00 CET as the only acceptable window.
        - Propose times before 9:00 a.m. CET (8:00 a.m. GMT is 9:00 CET and is the earliest valid start).
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-11T09:00:00Z", time_zone: Europe/Budapest, expected_local: "2027-01-11T10:00", expected_weekday: Monday, expected_utc_offset: "+01:00"}
      - {instant: "2027-01-11T09:00:00Z", time_zone: Europe/London, expected_local: "2027-01-11T09:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-11T06:00:00+00:00", end: "2027-01-11T18:00:00+00:00"}
      participants:
        candidate:
          time_zone: Europe/London
          available: [["2027-01-11T08:00:00+00:00", "2027-01-11T10:00:00+00:00"], ["2027-01-11T13:00:00+00:00", "2027-01-11T15:00:00+00:00"]]
        int_balazs: {time_zone: Europe/Budapest, available: [["2027-01-11T09:00:00+01:00", "2027-01-11T17:00:00+01:00"]]}
      sessions:
        - {id: QA, duration_min: 60, attendees: [candidate, int_balazs]}
      expect_feasible: true
      valid_examples:
        - {QA: "2027-01-11T09:00:00+00:00"}
        - {QA: "2027-01-11T13:00:00+00:00"}
      invalid_examples:
        - {QA: "2027-01-11T09:30:00+00:00", note: Runs past the candidate's 10:00 GMT end.}
      valid_start_bounds:
        QA: {earliest: "2027-01-11T08:00:00+00:00", latest: "2027-01-11T14:00:00+00:00"}

  - id: SUP-016
    title: Coordinator pastes interviewer availability as a table with mixed US zones
    category: supplied_availability
    subcategory: pasted_table
    description: >-
      Availability for two interviewers arrives as a pasted table with a "Zone" column (Central and Eastern). The
      candidate needs both 45-minute interviews the same morning with at least a 10-minute break. Misreading the
      Eastern row as Central makes an infeasible 11:00 CST slot look valid. The agent must parse the table row by
      row and convert.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [pasted_table, multi_row_parsing, us_zones, two_session_loop]
    requirement_refs: [AVL-12, AVL-13, AVL-10, SCH-01]
    inputs:
      now: "2027-01-06T09:00:00-06:00"
      recruiter: {id: rec_emma, name: Emma Wilson, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jacob Martinez
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-12T09:00:00-06:00", end: "2027-01-12T12:00:00-06:00"}
      interview_plan:
        name: Product Analyst - mini loop
        sessions:
          - {id: S1, title: Product sense, format: virtual, duration_min: 45, interviewers: [int_grace_k]}
          - {id: S2, title: Analytics, format: virtual, duration_min: 45, interviewers: [int_marco_s]}
        rules: {same_day: true, break_between_sessions_min: 10}
      interviewers:
        - {id: int_grace_k, name: Grace Kim, time_zone: America/Chicago, availability_source: supplied}
        - {id: int_marco_s, name: Marco Silva, time_zone: America/New_York, availability_source: supplied}
      conversation:
        - role: coordinator
          text: |
            Pasting what the interviewers sent:
            | Interviewer | Date       | From  | To    | Zone    |
            |-------------|------------|-------|-------|---------|
            | Grace Kim   | Tue Jan 12 | 9:00  | 11:00 | Central |
            | Grace Kim   | Tue Jan 12 | 13:00 | 14:00 | Central |
            | Marco Silva | Tue Jan 12 | 10:00 | 12:00 | Eastern |
            Jacob is free 9-12 Central that day. Please set up both.
    expected:
      disposition: propose_options
      solution_summary: >-
        Marco's 10:00 a.m.-12:00 p.m. EST is 9:00-11:00 a.m. CST, so both interviews must fit 9:00-11:00 a.m. CST on
        Tuesday, January 12, 2027 with a 10-minute break. Example: Analytics with Marco 9:00-9:45, Product sense with
        Grace 9:55-10:40 a.m. CST; or Grace 9:00-9:45 and Marco 9:55-10:40 (Marco can start as late as 10:15 CST).
      must:
        - Convert Marco's row from Eastern to 9:00-11:00 a.m. CST.
        - Propose schedules where both 45-minute sessions fall within 9:00-11:00 a.m. CST with at least 10 minutes between them.
        - Ignore Grace's 1:00-2:00 p.m. row for this candidate (outside his window) and ask whether to book.
      must_not:
        - Schedule Marco at or after 11:00 a.m. CST (that would be after 12:00 p.m. Eastern).
        - Ask for calendars or re-request the availability already supplied in the table.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-12T15:00:00Z", time_zone: America/Chicago, expected_local: "2027-01-12T09:00", expected_weekday: Tuesday, expected_utc_offset: "-06:00"}
      - {instant: "2027-01-12T15:00:00Z", time_zone: America/New_York, expected_local: "2027-01-12T10:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-12T08:00:00-06:00", end: "2027-01-12T15:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2027-01-12T09:00:00-06:00", "2027-01-12T12:00:00-06:00"]]}
        int_grace_k: {time_zone: America/Chicago, available: [["2027-01-12T09:00:00-06:00", "2027-01-12T11:00:00-06:00"], ["2027-01-12T13:00:00-06:00", "2027-01-12T14:00:00-06:00"]]}
        int_marco_s: {time_zone: America/New_York, available: [["2027-01-12T10:00:00-05:00", "2027-01-12T12:00:00-05:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_grace_k]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_marco_s]}
      constraints:
        min_gap_min: 10
        same_local_day: {time_zone: America/Chicago}
      expect_feasible: true
      valid_examples:
        - {S2: "2027-01-12T09:00:00-06:00", S1: "2027-01-12T09:55:00-06:00"}
        - {S1: "2027-01-12T09:00:00-06:00", S2: "2027-01-12T10:15:00-06:00"}
      invalid_examples:
        - {S1: "2027-01-12T09:00:00-06:00", S2: "2027-01-12T11:00:00-06:00", note: Marco's row read as Central time.}
        - {S1: "2027-01-12T09:00:00-06:00", S2: "2027-01-12T09:50:00-06:00", note: Only a 5-minute break.}

