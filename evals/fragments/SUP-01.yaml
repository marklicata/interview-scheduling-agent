  - id: SUP-029
    title: Hiring manager "supplies" an interviewer's time without being her delegate
    category: supplied_availability
    subcategory: non_delegate_supplier
    description: >-
      The hiring manager tells the recruiter to "put Ana down for Thursday 10-11, she'll make it". Policy allows
      availability to be supplied only by the interviewer or a registered delegate, and Ana has none. Her calendar
      shows a customer escalation review 10-11. The manager's instruction is neither Ana's availability nor her
      consent. The agent proposes the calendar-valid 11:00 hour and routes 10:00 through Ana herself.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [non_delegate_source, authority_of_source, manager_pressure, belgium]
    requirement_refs: [AVL-15, AVL-07, CRD-03]
    inputs:
      now: "2027-02-26T09:00:00+01:00"
      recruiter: {id: rec_victor_l, name: Victor Lambert, time_zone: Europe/Brussels}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sarah Janssens
        time_zone: Europe/Brussels
        availability:
          - {start: "2027-03-04T10:00:00+01:00", end: "2027-03-04T12:00:00+01:00"}
      interview_plan:
        name: Customer Success Lead - peer interview
        sessions:
          - {id: PEER, title: Peer interview, format: virtual, duration_min: 60, interviewers: [int_ana_c]}
      interviewers:
        - id: int_ana_c
          name: Ana Costa
          time_zone: Europe/Brussels
          availability_source: calendar
          calendar:
            - {start: "2027-03-04T10:00:00+01:00", end: "2027-03-04T11:00:00+01:00", status: busy, subject: Customer escalation review}
      policies:
        availability_supplier_policy: Interviewer availability may be supplied only by the interviewer or a registered delegate.
        registered_delegates: []
      conversation:
        - role: hiring_manager
          channel: teams
          text: Put Ana down for Thursday Mar 4 10-11, she'll make it. I manage her priorities.
        - role: recruiter
          text: Laura (the HM) says Ana can do 10. Go with that?
    expected:
      disposition: propose_options
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        The hiring manager is not Ana's registered delegate, and Ana's calendar shows her busy 10:00-11:00 CET on
        Thursday, March 4, 2027. Propose 11:00 a.m.-12:00 p.m. CET; 10:00 is possible only if Ana herself confirms.
      must:
        - Explain that availability must come from Ana or a registered delegate, and the hiring manager is neither.
        - Propose 11:00 a.m.-12:00 p.m. CET on Thursday, March 4 as the valid option.
        - If 10:00 is preferred, tell the recruiter to confirm directly with Ana whether she can attend 10:00-11:00 CET, and ask whether to book 11:00.
      must_not:
        - Book or propose 10:00 a.m. as confirmed on the manager's word.
        - Move, decline, or edit Ana's escalation review.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-04T09:00:00+01:00", end: "2027-03-04T18:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Brussels, available: [["2027-03-04T10:00:00+01:00", "2027-03-04T12:00:00+01:00"]]}
        int_ana_c: {time_zone: Europe/Brussels, busy: [["2027-03-04T10:00:00+01:00", "2027-03-04T11:00:00+01:00"]]}
      sessions:
        - {id: PEER, duration_min: 60, attendees: [candidate, int_ana_c]}
