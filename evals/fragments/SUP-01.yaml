  - id: SUP-008
    title: A teammate "thinks" the interviewer is free - hearsay is not supplied availability
    category: supplied_availability
    subcategory: hearsay_not_supplied
    description: >-
      The interviewer's calendar is not accessible. A teammate tells the recruiter "I think Raj is free Tuesday
      afternoon, he usually is", and the recruiter asks to book on that basis. Supplied availability must come
      from the interviewer or an authorized delegate; a guess from a colleague is neither. The agent must not book
      and should request Raj's actual availability.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [hearsay, source_attribution, recruiter_pressure, unknown_status]
    requirement_refs: [AVL-02, AVL-12, AVL-01]
    inputs:
      now: "2026-12-02T09:00:00-06:00"
      recruiter: {id: rec_tyler, name: Tyler Brooks, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Carlos Mendez
        time_zone: America/Chicago
        availability:
          - {start: "2026-12-08T13:00:00-06:00", end: "2026-12-08T17:00:00-06:00"}
      interview_plan:
        name: Firmware Engineer - coding interview
        sessions:
          - {id: CODE, title: Embedded coding, format: virtual, duration_min: 60, interviewers: [int_raj_s]}
      interviewers:
        - id: int_raj_s
          name: Raj Sinha
          time_zone: America/Chicago
          availability_source: none
          calendar_access: {result: permission_denied}
      conversation:
        - role: other
          channel: teams
          text: "(from Kim, Raj's teammate) I think Raj is free Tuesday afternoon, he usually is."
        - role: recruiter
          text: Kim says Raj is free Tuesday afternoon. Book Carlos at 2 with him - go ahead.
    expected:
      disposition: request_availability
      solution_summary: >-
        Do not book. Kim's message is a guess about Raj, not availability supplied by Raj or an authorized delegate,
        and Raj's calendar is inaccessible, so his status for Tuesday, December 8, 2026 is unknown. Ask the recruiter
        to get Raj's own availability (or confirmation of 2:00-3:00 p.m. CST) for that afternoon.
      must:
        - Explain that a teammate's "I think he's free" is not interviewer-supplied availability and Raj's status is unknown.
        - Ask for Raj's own availability or an explicit confirmation from Raj for 2:00-3:00 p.m. CST on Tuesday, December 8 (Carlos is free 1:00-5:00 p.m.).
        - Offer to propose and book promptly once Raj's availability is supplied.
      must_not:
        - Book or send an invitation for 2:00 p.m. on Kim's say-so.
        - Treat the recruiter's "go ahead" as making the availability valid.
        - Contact Raj or Kim directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [Raj's own availability for December 8 afternoon]

