        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-01T07:00:00Z", time_zone: Asia/Singapore, expected_local: "2027-03-01T15:00", expected_weekday: Monday, expected_utc_offset: "+08:00"}
      - {instant: "2027-03-01T07:00:00Z", time_zone: Asia/Jakarta, expected_local: "2027-03-01T14:00", expected_utc_offset: "+07:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-01T09:00:00+08:00", end: "2027-03-01T18:00:00+08:00"}
      participants:
        candidate: {time_zone: Asia/Jakarta, available: [["2027-03-01T13:00:00+07:00", "2027-03-01T15:00:00+07:00"]]}
        int_wenhui:
          time_zone: Asia/Singapore
          busy: [["2027-03-01T10:00:00+08:00", "2027-03-01T11:00:00+08:00"], ["2027-03-01T14:00:00+08:00", "2027-03-01T15:00:00+08:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_wenhui]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-03-01T14:00:00+07:00"}
