# Supplied availability (SUP) - interviewer-supplied windows and block lists, bounded complements, mixed sources, contradictions.
test_cases:
  - id: SUP-001
    title: Complete supplied windows with an inaccessible calendar - book after confirmation
    category: supplied_availability
    subcategory: supplied_windows_book_with_confirmation
    description: >-
      The interviewer's calendar is not shared, but he supplied a complete window for the interview day. The
      agent proposed a fitting slot and the recruiter explicitly confirmed it. The supplied window is sufficient
      evidence: the agent should book without demanding calendar access or another willingness check, and show
      times in London and India.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [supplied_windows, calendar_inaccessible, book_after_confirmation, uk, india]
    requirement_refs: [AVL-12, AVL-02, ACT-01, EC-151, GS-049]
    inputs:
      now: "2026-11-12T10:00:00+00:00"
      recruiter: {id: rec_amelia, name: Amelia Clarke, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rahul Nair
        email: rahul.nair@example.com
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-11-18T14:00:00+05:30", end: "2026-11-18T17:00:00+05:30"}
      interview_plan:
        name: Platform Engineer - coding interview
        sessions:
          - {id: CODE, title: Coding interview, format: virtual, duration_min: 45, interviewers: [int_tom]}
      interviewers:
        - id: int_tom
          name: Tom Fletcher
          time_zone: Europe/London
          availability_source: supplied
          calendar_access: {result: not_shared}
          supplied_availability:
            - {start: "2026-11-18T09:00:00+00:00", end: "2026-11-18T10:30:00+00:00", source: Tom via email to recruiter, complete_for: "2026-11-18"}
      conversation:
        - role: recruiter
          at: "2026-11-12T09:40:00+00:00"
          text: Tom says he's free Wed 18 Nov 9:00-10:30 UK time, that's all he has that day. Rahul can do 2-5pm IST. Options?
        - role: agent
          at: "2026-11-12T09:41:00+00:00"
          text: >-
            Using Tom's supplied window, a 45-minute interview can start from 9:00 to 9:45 a.m. GMT (2:30-3:15 p.m. IST)
            on Wednesday, November 18. Earliest is 9:00-9:45 a.m. GMT / 2:30-3:15 p.m. IST. Want me to book that?
        - role: recruiter
          at: "2026-11-12T10:00:00+00:00"
          text: Yes, book 9:00 GMT.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book one 45-minute Teams interview on Wednesday, November 18, 2026, 9:00-9:45 a.m. GMT (2:30-3:15 p.m. IST)
        with Tom and Rahul, and report invitations as sent (not accepted).
      must:
        - Book exactly 9:00-9:45 a.m. GMT (2:30-3:15 p.m. IST) on Wednesday, November 18 with a Teams link.
        - Rely on Tom's supplied window without asking for calendar access or re-confirming his willingness.
        - Report that invitations were sent and acceptance is pending, in both time zones.
      must_not:
        - Refuse or delay booking because Tom's calendar is not shared.
        - Book any other time or create duplicate events.
        - Claim that Tom's calendar was checked.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Coding interview for Rahul Nair and Tom Fletcher, notes: "2026-11-18 09:00-09:45 GMT; Teams link."}
    local_time_checks:
      - {instant: "2026-11-18T09:00:00Z", time_zone: Europe/London, expected_local: "2026-11-18T09:00", expected_weekday: Wednesday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-18T09:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-18T14:30", expected_utc_offset: "+05:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T06:00:00+00:00", end: "2026-11-18T14:00:00+00:00"}
      participants:
        candidate: {time_zone: Asia/Kolkata, available: [["2026-11-18T14:00:00+05:30", "2026-11-18T17:00:00+05:30"]]}
        int_tom: {time_zone: Europe/London, available: [["2026-11-18T09:00:00+00:00", "2026-11-18T10:30:00+00:00"]]}
      sessions:
        - {id: CODE, duration_min: 45, attendees: [candidate, int_tom]}
      expect_feasible: true
      valid_examples:
        - {CODE: "2026-11-18T09:00:00+00:00"}
      invalid_examples:
        - {CODE: "2026-11-18T10:00:00+00:00", note: Runs past the end of Tom's supplied window.}
      valid_start_bounds:
        CODE: {earliest: "2026-11-18T09:00:00+00:00", latest: "2026-11-18T09:45:00+00:00"}

  - id: SUP-002
    title: Complete blocked-time list for a bounded week and hours - complement only inside that scope
    category: supplied_availability
    subcategory: bounded_block_list_complement
    description: >-
      An external interviewer sends a complete list of blocked times for the week of November 16 (Monday to Friday), 09:00-17:00
      Prague time. The London candidate offers Tuesday late morning, Wednesday afternoon, and Saturday. Free time
      may be inferred only inside the declared week and hours: the Wednesday window is cut at 17:00 Prague time
      and Saturday is outside the scope even though nothing is listed as blocked.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, case_interview]
    tags: [complete_block_list, bounded_scope, complement, czechia, uk]
    requirement_refs: [AVL-13, AVL-12, EC-153, GS-051]
    inputs:
      now: "2026-11-10T09:00:00+01:00"
      recruiter: {id: rec_karin, name: Karin Weber, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Oliver Hughes
        time_zone: Europe/London
        availability:
          - {start: "2026-11-17T10:00:00+00:00", end: "2026-11-17T12:00:00+00:00"}
          - {start: "2026-11-18T15:00:00+00:00", end: "2026-11-18T17:00:00+00:00"}
          - {start: "2026-11-21T09:00:00+00:00", end: "2026-11-21T11:00:00+00:00"}
      interview_plan:
        name: Management Consultant - case interview
        sessions:
          - {id: CASE, title: Case interview, format: virtual, duration_min: 60, interviewers: [int_jan]}
      interviewers:
        - id: int_jan
          name: Jan Novak
          role: External partner (Fabrikam Advisory)
          time_zone: Europe/Prague
          availability_source: supplied
          supplied_blocks:
            complete: true
            period: {start: "2026-11-16T00:00:00+01:00", end: "2026-11-21T00:00:00+01:00"}
            daily_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00", time_zone: Europe/Prague}
            blocks:
              - {start: "2026-11-17T10:00:00+01:00", end: "2026-11-17T12:00:00+01:00"}
              - {start: "2026-11-18T13:00:00+01:00", end: "2026-11-18T15:00:00+01:00"}
            source_text: "Complete list of my blocked time Mon 16 - Fri 20 Nov, 9:00-17:00 Prague time - Tue 10-12, Wed 13-15. Everything else in those hours is open."
      conversation:
        - role: recruiter
          text: Jan sent his complete blocked times for next week. Oliver's free Tue 10-12, Wed 3-5 or Sat 9-11 UK time. What works?
    expected:
      disposition: propose_options
      solution_summary: >-
        Two options: Tuesday, November 17, 2026, 11:00 a.m.-12:00 p.m. GMT (12:00-1:00 p.m. CET) and Wednesday, November 18,
        3:00-4:00 p.m. GMT (4:00-5:00 p.m. CET). Saturday and anything after 5:00 p.m. Prague time are outside Jan's
        declared scope.
      must:
        - Offer exactly Tuesday, November 17 at 11:00 a.m.-12:00 p.m. GMT and Wednesday, November 18 at 3:00-4:00 p.m. GMT, each also in Prague time.
        - Explain that free time is inferred only within Monday-Friday 09:00-17:00 Prague time, so Wednesday ends at 4:00 p.m. GMT and Saturday is not covered.
        - Use Jan's list directly without asking for calendar access.
        - Ask which option to book.
      must_not:
        - Offer Saturday, November 21 or any interview ending after 5:00 p.m. Prague time.
        - Offer Tuesday 10:00 a.m. GMT, which overlaps Jan's 10:00 a.m.-12:00 p.m. Prague-time block.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T11:00:00Z", time_zone: Europe/Prague, expected_local: "2026-11-17T12:00", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-18T15:00:00Z", time_zone: Europe/Prague, expected_local: "2026-11-18T16:00", expected_weekday: Wednesday}
      - {instant: "2026-11-21T09:00:00Z", time_zone: Europe/Prague, expected_local: "2026-11-21T10:00", expected_weekday: Saturday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T00:00:00+01:00", end: "2026-11-22T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/London
          available: [["2026-11-17T10:00:00+00:00", "2026-11-17T12:00:00+00:00"], ["2026-11-18T15:00:00+00:00", "2026-11-18T17:00:00+00:00"], ["2026-11-21T09:00:00+00:00", "2026-11-21T11:00:00+00:00"]]
        int_jan:
          time_zone: Europe/Prague
          working_hours: {time_zone: Europe/Prague, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-17T10:00:00+01:00", "2026-11-17T12:00:00+01:00"], ["2026-11-18T13:00:00+01:00", "2026-11-18T15:00:00+01:00"]]
      sessions:
        - {id: CASE, duration_min: 60, attendees: [candidate, int_jan]}
      expect_feasible: true
      valid_examples:
        - {CASE: "2026-11-17T11:00:00+00:00"}
        - {CASE: "2026-11-18T15:00:00+00:00"}
      invalid_examples:
        - {CASE: "2026-11-18T15:30:00+00:00", note: Ends after 17:00 Prague time - outside the declared hours.}
        - {CASE: "2026-11-21T09:00:00+00:00", note: Saturday is outside the declared period.}
      valid_start_bounds:
        CASE: {earliest: "2026-11-17T11:00:00+00:00", latest: "2026-11-18T15:00:00+00:00"}

  - id: SUP-003
    title: '"These are some of my conflicts" is a partial list - ask, do not infer free time'
    category: supplied_availability
    subcategory: partial_block_list
    description: >-
      The interviewer, whose calendar is not accessible, lists "some" of his conflicts for next week and says more
      may come up. A partial block list cannot be complemented into free time. The agent must ask for a complete
      list or positive windows for the candidate's Monday morning instead of proposing the unlisted hours.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [partial_block_list, clarification, calendar_inaccessible, brazil]
    requirement_refs: [AVL-13, EC-154, AVL-02]
    inputs:
      now: "2026-11-16T09:00:00-03:00"
      recruiter: {id: rec_ana, name: Ana Lima, time_zone: America/Sao_Paulo}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lucas Ferreira
        time_zone: America/Sao_Paulo
        availability:
          - {start: "2026-11-23T09:00:00-03:00", end: "2026-11-23T12:00:00-03:00"}
      interview_plan:
        name: Brand Marketing Manager - team interview
        sessions:
          - {id: S1, title: Team interview, format: virtual, duration_min: 60, interviewers: [int_bruno]}
      interviewers:
        - id: int_bruno
          name: Bruno Alves
          time_zone: America/Sao_Paulo
          availability_source: supplied
          calendar_access: {result: not_shared}
          supplied_blocks:
            complete: false
            blocks:
              - {start: "2026-11-23T10:00:00-03:00", end: "2026-11-23T11:00:00-03:00"}
              - {start: "2026-11-25T14:00:00-03:00", end: "2026-11-25T16:00:00-03:00"}
            source_text: "Some of my conflicts next week: Mon 10-11, Wed 14-16. I'll let you know if more come up."
      conversation:
        - role: recruiter
          text: Bruno sent some conflicts for next week. Lucas is free Monday 9-12. Can you find an hour?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Bruno's list is explicitly partial, so Monday 9:00-10:00 and 11:00 a.m.-12:00 p.m. BRT cannot be treated as
        free. Ask the recruiter to get either Bruno's complete blocked times for Monday, November 23, 9:00 a.m.-12:00
        p.m. BRT, or his confirmation of a specific hour (9:00-10:00 or 11:00 a.m.-12:00 p.m.).
      must:
        - Explain that "some of my conflicts" is a partial list, so unlisted time is not known to be free.
        - Ask for a complete block list or positive availability covering Monday, November 23, 9:00 a.m.-12:00 p.m. BRT.
        - Mention that 9:00-10:00 a.m. and 11:00 a.m.-12:00 p.m. would fit if Bruno confirms them.
      must_not:
        - Propose or book 9:00 or 11:00 a.m. as available on the basis of the partial list.
        - Demand calendar access as the only way forward.
        - Contact Bruno directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [complete block list or positive windows for November 23 morning]

  - id: SUP-004
    title: Traveling interviewer supplies windows without a time zone
    category: supplied_availability
    subcategory: zone_less_windows_traveling
    description: >-
      The interviewer's profile says Denver, but his email says he is at a conference in Lisbon this week and lists
      "free Tue 2-4 and Wed 9-11" with no zone. Read as Lisbon time, both windows overlap the Amsterdam candidate;
      read as Denver time, Tuesday lands at 10 p.m. in Amsterdam. The agent must ask which zone he meant rather
      than guessing.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [missing_time_zone, traveling_interviewer, clarification, netherlands, portugal]
    requirement_refs: [AVL-13, EC-154, INT-05, AVL-10]
    inputs:
      now: "2026-11-27T09:00:00+01:00"
      recruiter: {id: rec_tessa, name: Tessa van Dijk, time_zone: Europe/Amsterdam}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Pieter de Boer
        time_zone: Europe/Amsterdam
        availability:
          - {start: "2026-12-01T14:00:00+01:00", end: "2026-12-01T18:00:00+01:00"}
          - {start: "2026-12-02T09:00:00+01:00", end: "2026-12-02T12:00:00+01:00"}
      interview_plan:
        name: Logistics Director - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_marcus]}
      interviewers:
        - id: int_marcus
          name: Marcus Lee
          time_zone: America/Denver
          availability_source: supplied
          supplied_availability_raw: "I'm in Lisbon this week for a conference. Free Tue 2-4 and Wed 9-11."
      conversation:
        - role: recruiter
          text: Marcus emailed his availability (pasted above). Pieter can do Tue 2-6pm or Wed 9-12 Amsterdam time. Set something up?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask whether Marcus's windows are Lisbon time or Denver time. If Lisbon (WET), Tuesday, December 1, 2:00-4:00
        p.m. is 3:00-5:00 p.m. CET and Wednesday, December 2, 9:00-11:00 a.m. is 10:00 a.m.-12:00 p.m. CET - both
        overlap Pieter. If Denver (MST), Tuesday would be 10:00 p.m.-midnight CET, outside Pieter's window.
      must:
        - Ask which time zone Marcus's "Tue 2-4 and Wed 9-11" refers to, noting he is traveling in Lisbon while his profile says Denver.
        - Show what each interpretation would mean in Amsterdam time, so the recruiter sees why it matters.
        - Offer to propose immediately once the zone is confirmed.
      must_not:
        - Assume Lisbon time or the Denver profile zone and propose or book.
        - Ask the recruiter to do the time-zone conversions.
      side_effects: {external_writes: none}
      clarifying_question_topics: [time zone of supplied windows]
    local_time_checks:
      - {instant: "2026-12-01T14:00:00Z", time_zone: Europe/Lisbon, expected_local: "2026-12-01T14:00", expected_weekday: Tuesday, expected_utc_offset: "+00:00"}
      - {instant: "2026-12-01T14:00:00Z", time_zone: Europe/Amsterdam, expected_local: "2026-12-01T15:00", expected_utc_offset: "+01:00"}
      - {instant: "2026-12-01T21:00:00Z", time_zone: America/Denver, expected_local: "2026-12-01T14:00", expected_utc_offset: "-07:00"}
      - {instant: "2026-12-01T21:00:00Z", time_zone: Europe/Amsterdam, expected_local: "2026-12-01T22:00"}

  - id: SUP-005
    title: Interviewer states windows in Pacific time while her profile says Eastern
    category: supplied_availability
    subcategory: explicit_zone_differs_from_profile
    description: >-
      The New York-based interviewer is working from the San Francisco office next week and explicitly says "free
      Thu 10am-12pm PT". The explicit zone in the message wins over the profile. Applied correctly, her window is
      1:00-3:00 p.m. EST and overlaps the candidate fully; applying the profile zone would wrongly yield 10 a.m.-12
      p.m. EST.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [explicit_zone, profile_zone_mismatch, supplied_windows, us_coasts]
    requirement_refs: [AVL-13, AVL-10, AVL-12]
    inputs:
      now: "2026-11-25T10:00:00-05:00"
      recruiter: {id: rec_priscilla, name: Priscilla Owusu, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Brandon Hayes
        time_zone: America/New_York
        availability:
          - {start: "2026-12-03T13:00:00-05:00", end: "2026-12-03T15:00:00-05:00"}
      interview_plan:
        name: Corporate Counsel - legal team interview
        sessions:
          - {id: LEGAL, title: Legal team interview, format: virtual, duration_min: 60, interviewers: [int_devon]}
      interviewers:
        - id: int_devon
          name: Devon Clarke
          profile_time_zone: America/New_York
          time_zone: America/Los_Angeles
          availability_source: supplied
          supplied_availability:
            - {start: "2026-12-03T10:00:00-08:00", end: "2026-12-03T12:00:00-08:00", source_text: "I'm in the SF office next week - free Thu 10am-12pm PT."}
      conversation:
        - role: recruiter
          text: Devon sent her availability. Brandon is free Thursday 1-3 Eastern. Anything?
    expected:
      disposition: propose_options
      solution_summary: >-
        Devon's 10:00 a.m.-12:00 p.m. PST is 1:00-3:00 p.m. EST on Thursday, December 3, 2026, matching Brandon's
        window. Valid 60-minute starts from 1:00 to 2:00 p.m. EST (10:00-11:00 a.m. PST).
      must:
        - Interpret Devon's window in Pacific time as she stated, not her Eastern profile zone.
        - Propose starts from 1:00 to 2:00 p.m. EST (10:00-11:00 a.m. PST) on Thursday, December 3.
        - Ask whether to book.
      must_not:
        - Treat "10am-12pm" as Eastern time and report no overlap.
        - Ask for Devon's calendar or a re-confirmation of the supplied window.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-03T18:00:00Z", time_zone: America/New_York, expected_local: "2026-12-03T13:00", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2026-12-03T18:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-03T10:00", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T08:00:00-05:00", end: "2026-12-03T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-12-03T13:00:00-05:00", "2026-12-03T15:00:00-05:00"]]}
        int_devon: {time_zone: America/Los_Angeles, available: [["2026-12-03T10:00:00-08:00", "2026-12-03T12:00:00-08:00"]]}
      sessions:
        - {id: LEGAL, duration_min: 60, attendees: [candidate, int_devon]}
      expect_feasible: true
      valid_examples:
        - {LEGAL: "2026-12-03T13:00:00-05:00"}
      invalid_examples:
        - {LEGAL: "2026-12-03T10:00:00-05:00", note: Profile-zone misreading; outside both windows.}
      valid_start_bounds:
        LEGAL: {earliest: "2026-12-03T13:00:00-05:00", latest: "2026-12-03T14:00:00-05:00"}

  - id: SUP-006
    title: Supplied availability is three weeks old and the policy limits it to 14 days
    category: supplied_availability
    subcategory: stale_supplied_availability
    description: >-
      Three weeks ago a contractor interviewer said "for the next month I'm free Tuesdays and Thursdays 1-3 p.m."
      Org policy says supplied availability older than 14 days must be reconfirmed. The candidate offers a matching
      Tuesday. The agent must flag the age, ask for reconfirmation, and may show the candidate-compatible slot only
      as pending reconfirmation.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, portfolio_review]
    tags: [stale_supplied, freshness_policy, reconfirm, australia]
    requirement_refs: [AVL-05, AVL-01, EC-155]
    inputs:
      now: "2026-11-26T09:00:00+11:00"
      recruiter: {id: rec_kirsten, name: Kirsten Hall, time_zone: Australia/Melbourne}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Isabella Romano
        time_zone: Australia/Melbourne
        availability:
          - {start: "2026-12-01T13:00:00+11:00", end: "2026-12-01T15:00:00+11:00"}
      interview_plan:
        name: Senior Architect (buildings) - portfolio review
        sessions:
          - {id: PORT, title: Portfolio review, format: virtual, duration_min: 90, interviewers: [int_rahul]}
      interviewers:
        - id: int_rahul
          name: Rahul Bose
          role: Contract design principal
          time_zone: Australia/Melbourne
          availability_source: supplied
          calendar_access: {result: no_mailbox_in_tenant}
          supplied_availability_raw: "For the next month I'm free Tuesdays and Thursdays 1-3 pm."
          supplied_at: "2026-11-05T16:00:00+11:00"
      policies:
        supplied_availability_max_age_days: 14
      conversation:
        - role: recruiter
          text: Rahul gave us Tue/Thu 1-3pm a while back. Isabella can do Tue 1 Dec 1-3pm. Let's lock it in.
    expected:
      disposition: request_availability
      solution_summary: >-
        Rahul's availability was supplied on November 5 (21 days ago), beyond the 14-day policy limit. Ask the
        recruiter to reconfirm with Rahul that Tuesday, December 1, 2026, 1:00-2:30 p.m. AEDT (or anytime 1:00-3:00
        p.m.) still works before proposing or booking.
      must:
        - State that Rahul's supplied availability is 21 days old and exceeds the 14-day freshness policy.
        - Ask the recruiter to reconfirm Rahul's availability for Tuesday, December 1, 1:00-3:00 p.m. AEDT.
        - Indicate that 1:00-2:30 p.m. AEDT (any start from 1:00 to 1:30 p.m.) would fit a 90-minute review once reconfirmed.
      must_not:
        - Book or present the slot as confirmed on the basis of the stale message.
