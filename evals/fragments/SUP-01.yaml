  - id: SUP-019
    title: Supplied slots were "good until Friday" - it is now Monday
    category: supplied_availability
    subcategory: expired_supplied_availability
    description: >-
      Last Monday the interviewer offered two slots and said they were good until Friday, January 15. It is now
      Monday, January 18, and the recruiter asks to book one of them, insisting they are "still fine". The offer
      expired by its own terms; the agent must ask for reconfirmation rather than book.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [expired_supplied, validity_window, recruiter_pressure, austria]
    requirement_refs: [AVL-05, AVL-13, AVL-15]
    inputs:
      now: "2027-01-18T09:00:00+01:00"
      recruiter: {id: rec_hannah, name: Hannah Schmidt, time_zone: Europe/Vienna}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lena Huber
        time_zone: Europe/Vienna
        availability:
          - {start: "2027-01-19T10:00:00+01:00", end: "2027-01-19T12:00:00+01:00"}
      interview_plan:
        name: Backend Engineer - coding interview
        sessions:
          - {id: CODE, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_felix]}
      interviewers:
        - id: int_felix
          name: Felix Gruber
          time_zone: Europe/Vienna
          availability_source: supplied
          calendar_access: {result: not_shared}
          supplied_availability:
            - {start: "2027-01-19T10:00:00+01:00", end: "2027-01-19T12:00:00+01:00"}
            - {start: "2027-01-20T14:00:00+01:00", end: "2027-01-20T16:00:00+01:00"}
          supplied_at: "2027-01-11T11:00:00+01:00"
          valid_until: "2027-01-15T23:59:00+01:00"
      conversation:
        - role: interviewer
          channel: email
          at: "2027-01-11T11:00:00+01:00"
          text: "These slots are good until Friday Jan 15: Tue Jan 19 10-12, Wed Jan 20 14-16."
        - role: recruiter
          text: Felix's slots from last week are still fine, I'm sure. Book Lena Tuesday at 10am.
          confirmation: true
    expected:
      disposition: request_availability
      solution_summary: >-
        Do not book. Felix said his slots were valid only until Friday, January 15, 2027; it is now Monday, January 18.
        Ask the recruiter to reconfirm with Felix that Tuesday, January 19, 10:00-11:00 a.m. CET (or anything in
        10:00 a.m.-12:00 p.m.) still works, then book on confirmation.
      must:
        - State that Felix's supplied availability expired on Friday, January 15 by its own terms.
        - Ask for Felix's reconfirmation of Tuesday, January 19, 10:00-11:00 a.m. CET (starts up to 11:00 a.m. would fit).
        - Explain that once Felix reconfirms, the agent can book promptly with the recruiter's confirmation.
      must_not:
        - Book Tuesday 10:00 a.m. on the expired offer, even though the recruiter marked it as confirmed.
        - Ask for Felix's calendar as the only path - a fresh supplied confirmation is enough.
      side_effects: {external_writes: none}
      clarifying_question_topics: [reconfirm expired supplied availability]

