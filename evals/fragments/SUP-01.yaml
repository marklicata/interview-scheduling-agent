  - id: SUP-022
    title: '"My only conflicts are standups" has no date range or hours - clarify before using it'
    category: supplied_availability
    subcategory: unbounded_block_list
    description: >-
      A contractor interviewer says his only conflicts are a daily 9:30-9:45 standup and he is otherwise "wide
      open", without a date range or working hours. The candidate offers a Monday evening and a Tuesday morning.
      Treating the statement as universal free time would make 6-8 p.m. look available. The agent must ask for the
      period and hours it covers instead of complementing an unbounded list.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [unbounded_block_list, clarification, evening_trap, portugal]
    requirement_refs: [AVL-13, EC-154]
    inputs:
      now: "2027-02-01T10:00:00+00:00"
      recruiter: {id: rec_isabel, name: Isabel Duarte, time_zone: Europe/Lisbon}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ricardo Gomes
        time_zone: Europe/Lisbon
        availability:
          - {start: "2027-02-08T18:00:00+00:00", end: "2027-02-08T20:00:00+00:00"}
          - {start: "2027-02-09T10:00:00+00:00", end: "2027-02-09T12:00:00+00:00"}
      interview_plan:
        name: DevOps Engineer - infrastructure interview
        sessions:
          - {id: INFRA, title: Infrastructure interview, format: virtual, duration_min: 60, interviewers: [int_nuno]}
      interviewers:
        - id: int_nuno
          name: Nuno Pereira
          role: Contract SRE
          time_zone: Europe/Lisbon
          availability_source: supplied
          calendar_access: {result: no_mailbox_in_tenant}
          supplied_blocks:
            complete: unspecified
            source_text: "My only conflicts are the daily standup 9:30-9:45 - otherwise I'm wide open."
      conversation:
        - role: recruiter
          text: Nuno says he's wide open apart from standup. Ricardo can do Mon 8 Feb 6-8pm or Tue 9 Feb 10-12. Pick one and set it up.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Nuno's statement has no date range or hours, so it cannot be turned into free time. Ask the recruiter to
        confirm with Nuno that it covers Monday, February 8 and Tuesday, February 9, and whether he would interview in
        the evening (6:00-8:00 p.m. WET). Once confirmed, Tuesday 10:00-11:00 a.m. WET (or a start up to 11:00) or Monday
        evening could be proposed.
      must:
        - Explain that the statement lacks a date range and hours, so it cannot be treated as complete availability.
        - Ask specifically whether it covers Monday, February 8 and Tuesday, February 9, and whether Monday 6:00-8:00 p.m. WET is acceptable to Nuno.
        - Indicate which candidate times would fit once confirmed.
      must_not:
        - Propose or book Monday 6:00-8:00 p.m. on the basis of "wide open".
        - Treat the standup as the only possible conflict for every date and hour.
      side_effects: {external_writes: none}
      clarifying_question_topics: [date range of the block list, hours covered including evenings]

