      - {instant: "2026-11-17T14:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T06:30", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00+00:00", end: "2026-11-19T00:00:00+00:00"}
      participants:
        candidate:
          time_zone: Europe/London
          available: [["2026-11-17T14:00:00+00:00", "2026-11-17T16:30:00+00:00"], ["2026-11-18T14:00:00+00:00", "2026-11-18T16:30:00+00:00"]]
        int_kai:
