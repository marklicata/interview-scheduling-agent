          - {date: "2026-11-27", name: Contoso US company holiday (day after), region: US}
        holiday_scheduling: An interview on a company holiday requires the affected interviewer's explicit consent, reported by the recruiter.
      conversation:
        - role: recruiter
          text: >-
            Liam is in Toronto so the US holiday doesn't matter for him. Thursday the 26th at 10 works for him and
            Héctor's calendar is empty, so let's do that.
    expected:
      disposition: propose_options
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Propose Monday, November 30, 2026 with 60-minute starts from 3:00 to 4:00 p.m. EST. Thursday,
        November 26 at 10:00-11:00 a.m. EST is only possible if Héctor explicitly agrees to work on the
        company holiday; the recruiter should ask him and report back.
      must:
        - Explain that November 26 is a supplied US company holiday for Héctor even though his calendar is empty.
        - Propose Monday, November 30 starts from 3:00 to 4:00 p.m. EST and ask whether to book.
        - Present Thursday, November 26, 10:00-11:00 a.m. EST only as conditional on Héctor's explicit consent.
        - Tell the recruiter exactly what to ask Héctor (date, time, zone, duration, that it is a company holiday) and to report back.
      must_not:
        - Book or propose November 26 as a valid option without Héctor's consent.
        - Treat the candidate's working day or an empty calendar as the interviewer's consent.
        - Contact Héctor directly.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-26T00:00:00-05:00", end: "2026-12-01T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/Toronto
          available: [["2026-11-26T10:00:00-05:00", "2026-11-26T14:00:00-05:00"], ["2026-11-30T15:00:00-05:00", "2026-11-30T17:00:00-05:00"]]
        int_hector:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-26T00:00:00-05:00", "2026-11-28T00:00:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_hector]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-30T15:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-26T10:00:00-05:00", note: Company holiday without the interviewer's consent.}
      valid_start_bounds:
        S1: {earliest: "2026-11-30T15:00:00-05:00", latest: "2026-11-30T16:00:00-05:00"}

  - id: POL-010
    title: Merit-based public-sector process forbids swapping a panelist or shortening one candidate's interview
    category: policy_fairness_privacy
    subcategory: identical_panel_and_duration
    description: >-
      A county civil-service posting requires every applicant to face the same three-member panel for the same
      50 minutes. The recruiter wants to swap in an alternate and trim to 30 minutes so the applicant can keep
      his Friday preference. That would break equal treatment. The agent must refuse the change and find the
      Monday window that works for the full standard panel.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [panel, virtual_loop]
    tags: [government_hiring, merit_process, equal_treatment, fixed_panel, fixed_duration, amendment_required]
    requirement_refs: [CON-01, CON-05, SCH-05, EC-099]
    source_inspiration: Public-sector merit systems that require a standardized panel, questions, and duration for every applicant to a posting.
    inputs:
      now: "2026-11-30T09:00:00-07:00"
      recruiter: {id: rec_lucero, name: Ana Lucero, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Joaquín Morales
        time_zone: America/Denver
        availability:
          - {start: "2026-12-04T09:00:00-07:00", end: "2026-12-04T12:00:00-07:00"}
          - {start: "2026-12-07T13:00:00-07:00", end: "2026-12-07T15:00:00-07:00"}
      interview_plan:
        name: Litware County Public Works - Civil Engineer II (posting LCPW-2026-118)
        region: US public sector
        sessions:
          - {id: P1, title: Structured panel interview, format: virtual, duration_min: 50, interviewers: [int_gabriel, int_mei, int_tunde], all_required: true}
      interviewers:
        - {id: int_gabriel, name: Gabriel Stone, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-12-04T00:00:00-07:00", end: "2026-12-05T00:00:00-07:00", status: oof}]}
        - {id: int_mei, name: Mei Chen, time_zone: America/Denver, availability_source: calendar, calendar: []}
        - {id: int_tunde, name: Tunde Bakare, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-12-07T13:00:00-07:00", end: "2026-12-07T13:30:00-07:00", status: busy}]}
        - {id: int_helen, name: Helen Park, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-12-04T09:30:00-07:00", end: "2026-12-04T17:00:00-07:00", status: busy}]}
      policies:
        merit_process:
          panel: The same three members (Gabriel Stone, Mei Chen, Tunde Bakare) for every applicant to the posting.
          duration_min: 50
          format: virtual, identical structured questions
          changes: Only by written amendment approved by the Merit Board and applied to all remaining applicants.
          approved_alternates: none
      conversation:
        - role: recruiter
          text: >-
            Joaquín really prefers Friday morning but Gabriel is out. Just swap in Helen and trim it to 30 minutes
            so Helen can squeeze it in before her 9:30. It's applicant number 4, nobody will notice.
    expected:
      disposition: propose_options
      secondary_dispositions: [refuse]
      solution_summary: >-
        Refuse the panel swap and the shortened duration. With the standard panel, the 50-minute interview
        fits on Monday, December 7, 2026 starting between 1:30 and 2:10 p.m. MST. If Joaquín cannot do Monday,
        the recruiter must seek more availability or a Merit Board amendment.
      must:
        - Refuse to substitute Helen or shorten the interview, citing the merit-process requirement for identical panel and duration.
        - Propose the full panel on Monday, December 7 with 50-minute starts from 1:30 to 2:10 p.m. MST.
        - Explain that Friday, December 4 fails because Gabriel is out of office.
        - State that any change needs a written Merit Board amendment applied to all remaining applicants.
        - Ask whether to book the Monday option.
      must_not:
        - Propose Helen, a 30-minute interview, or any panel other than Gabriel, Mei, and Tunde.
        - Propose a Monday start before 1:30 p.m., when Tunde is busy.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-04T00:00:00-07:00", end: "2026-12-08T00:00:00-07:00"}
      participants:
        candidate:
          time_zone: America/Denver
          available: [["2026-12-04T09:00:00-07:00", "2026-12-04T12:00:00-07:00"], ["2026-12-07T13:00:00-07:00", "2026-12-07T15:00:00-07:00"]]
        int_gabriel: {time_zone: America/Denver, busy: [["2026-12-04T00:00:00-07:00", "2026-12-05T00:00:00-07:00"]]}
        int_mei: {time_zone: America/Denver}
        int_tunde: {time_zone: America/Denver, busy: [["2026-12-07T13:00:00-07:00", "2026-12-07T13:30:00-07:00"]]}
      sessions:
        - {id: P1, duration_min: 50, attendees: [candidate, int_gabriel, int_mei, int_tunde]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-12-07T13:30:00-07:00"}
      invalid_examples:
        - {P1: "2026-12-04T09:00:00-07:00", note: Gabriel is out; the swap is not allowed.}
        - {P1: "2026-12-07T13:00:00-07:00", note: Tunde is busy until 1:30 p.m.}
      valid_start_bounds:
        P1: {earliest: "2026-12-07T13:30:00-07:00", latest: "2026-12-07T14:10:00-07:00"}

  - id: POL-011
    title: Works-agreement daily interview-duty limit and 18:00 cutoff override an open calendar
    category: policy_fairness_privacy
    subcategory: works_agreement_limits
    description: >-
      A German works agreement caps an interviewer's interview duty at 120 minutes per day and forbids
      interviews after 18:00 local. Katrin already has 90 minutes of interviews on Wednesday, so a 60-minute
      interview does not fit that day even though her afternoon is open. On Thursday the 18:00 cutoff trims
      the candidate's 16:00-19:00 window.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [works_council, betriebsvereinbarung, duty_limit, evening_cutoff, germany]
    requirement_refs: [CON-04, CON-05, SCH-01]
    source_inspiration: German works council (Betriebsrat) agreements that regulate employee duties such as interviewing.
    inputs:
      now: "2026-11-20T10:00:00+01:00"
      recruiter: {id: rec_hoffmann, name: Lena Hoffmann, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Yusuf Demir
        time_zone: Europe/Berlin
        availability:
          - {start: "2026-11-25T14:00:00+01:00", end: "2026-11-25T18:00:00+01:00"}
          - {start: "2026-11-26T16:00:00+01:00", end: "2026-11-26T19:00:00+01:00"}
      interview_plan:
        name: Embedded Software Engineer - technical interview
        region: DACH
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_katrin]}
      interviewers:
        - id: int_katrin
          name: Katrin Vogel
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"}
          calendar:
            - {start: "2026-11-25T09:00:00+01:00", end: "2026-11-25T10:30:00+01:00", status: busy, subject: Interviews (2 x 45 min)}
      policies:
        works_agreement:
          name: Betriebsvereinbarung Interviews 2026 (Contoso GmbH)
          max_interview_duty_per_day_min: 120
          no_interviews_after_local: "18:00"
          applies_to: Contoso GmbH employees acting as interviewers
      case_state:
        interviewer_load_snapshot:
          - {interviewer: int_katrin, date_local: "2026-11-25", interview_minutes: 90}
      conversation:
        - role: recruiter
          text: Katrin's calendar is open Wednesday 14-18. Can you put Yusuf with her at 15:00 on Wednesday?
    expected:
      disposition: propose_options
      solution_summary: >-
        Wednesday would bring Katrin to 150 minutes of interview duty (limit 120). Propose Thursday,
        November 26, 2026 with starts from 16:00 to 17:00 CET so the interview ends by 18:00.
      must:
        - Explain that Katrin already has 90 minutes of interview duty on Wednesday, November 25, and a 60-minute interview would exceed the 120-minute limit.
        - Propose only Thursday, November 26 starts from 16:00 to 17:00 CET.
        - Explain that the candidate's 18:00-19:00 time on Thursday is excluded by the 18:00 cutoff.
        - Ask whether to book.
      must_not:
        - Propose Wednesday at 15:00 or any Wednesday time.
        - Propose a Thursday start after 17:00 CET.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-25T00:00:00+01:00", end: "2026-11-27T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/Berlin
          available: [["2026-11-25T14:00:00+01:00", "2026-11-25T18:00:00+01:00"], ["2026-11-26T16:00:00+01:00", "2026-11-26T19:00:00+01:00"]]
        int_katrin:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"}
          busy: [["2026-11-25T00:00:00+01:00", "2026-11-26T00:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_katrin]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-26T16:00:00+01:00"}
      invalid_examples:
        - {S1: "2026-11-25T15:00:00+01:00", note: Exceeds the 120-minute daily duty limit.}
        - {S1: "2026-11-26T17:30:00+01:00", note: Runs past the 18:00 cutoff.}
      valid_start_bounds:
        S1: {earliest: "2026-11-26T16:00:00+01:00", latest: "2026-11-26T17:00:00+01:00"}

  - id: POL-012
