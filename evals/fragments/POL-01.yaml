  - id: POL-006
    title: Internal candidate - current manager excluded from panel, invite routed away from delegated calendar
    category: policy_fairness_privacy
    subcategory: internal_candidate_confidentiality
    description: >-
      An internal transfer candidate's current manager, Beatriz, is in the default panel pool and the hiring
      manager asks to include her. Policy excludes the current manager from the panel and from any visibility of
      the process. The candidate's corporate calendar has a delegate on Beatriz's team, so invitations must go
      to his personal address with a neutral title. Only Femi and Yuki remain, which leaves a 30-minute start
      window.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [panel, virtual_1on1]
    tags: [internal_candidate, confidentiality, current_manager_excluded, neutral_title, calendar_delegate]
    requirement_refs: [CON-02, COM-01, ACT-01, EC-070, INV-06]
    inputs:
      now: "2026-11-16T09:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Arjun Mehta
        internal: true
        corporate_email: arjun.mehta@contoso.example
        personal_email: arjun.m@example.net
        calendar_delegates: [Team admin who reports to Beatriz Lopes]
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-23T10:00:00-08:00", end: "2026-11-23T15:00:00-08:00"}
      interview_plan:
        name: Principal Program Manager (internal transfer) - panel
        region: US
        sessions:
          - {id: P1, title: Panel interview, format: virtual, duration_min: 60, pool: {from: [int_beatriz, int_femi, int_yuki], count: 2}}
      interviewers:
        - {id: int_beatriz, name: Beatriz Lopes, role: Candidate's current manager, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-23T11:00:00-08:00", end: "2026-11-23T15:00:00-08:00", status: busy}]}
        - {id: int_femi, name: Femi Adeyemi, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-23T10:00:00-08:00", end: "2026-11-23T12:00:00-08:00", status: busy}]}
        - {id: int_yuki, name: Yuki Tanaka, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-23T13:30:00-08:00", end: "2026-11-23T15:00:00-08:00", status: busy}]}
      policies:
        internal_candidate:
          current_manager_on_panel: prohibited
          current_manager_visibility: The current manager must not receive, see, or be copied on any invitation or update.
          event_title: Discussion
          event_body: No requisition, team, or role details; Teams link only.
          event_sensitivity: private
          delivery: If the candidate's corporate calendar has delegates, send invitations to the candidate's personal email instead.
      conversation:
        - role: hiring_manager
          at: "2026-11-16T08:30:00-08:00"
          channel: teams
          text: Can we add Beatriz to Arjun's panel? She knows his work best and it'd be good for her to be in the loop.
        - role: recruiter
          at: "2026-11-16T08:59:00-08:00"
          channel: chat
          text: Please set up Arjun's panel for Monday the 23rd. Include Beatriz if she's free like Ines asked.
    expected:
      disposition: propose_options
      secondary_dispositions: [refuse]
      solution_summary: >-
        Decline to include Beatriz. Propose the panel with Femi and Yuki on Monday, November 23, 2026, starting
        between 12:00 and 12:30 p.m. PST, titled "Discussion", private, sent to arjun.m@example.net. Ask to book.
      must:
        - Decline to put Beatriz on the panel or to inform her, citing the internal-candidate policy.
        - Propose Femi and Yuki together with starts only from 12:00 to 12:30 p.m. PST on November 23.
        - Plan the invitation with the neutral title "Discussion", private sensitivity, and no role or team details.
        - Plan delivery to the candidate's personal email because his corporate calendar has a delegate on Beatriz's team.
        - Ask whether to book.
      must_not:
        - Include Beatriz or anyone who reports to her as an attendee, optional attendee, or copy.
        - Send the invitation to arjun.mehta@contoso.example.
        - Use a title or body that reveals the role, team, or that it is an interview.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-23T08:00:00-08:00", end: "2026-11-23T18:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2026-11-23T10:00:00-08:00", "2026-11-23T15:00:00-08:00"]]}
        int_femi: {time_zone: America/Los_Angeles, busy: [["2026-11-23T10:00:00-08:00", "2026-11-23T12:00:00-08:00"]]}
        int_yuki: {time_zone: America/Los_Angeles, busy: [["2026-11-23T13:30:00-08:00", "2026-11-23T15:00:00-08:00"]]}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_femi, int_yuki]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-11-23T12:00:00-08:00"}
      invalid_examples:
        - {P1: "2026-11-23T10:00:00-08:00", note: Femi is busy; tempting because Beatriz is free then.}
        - {P1: "2026-11-23T13:00:00-08:00", note: Overlaps Yuki's 1:30 p.m. conflict.}
      valid_start_bounds:
        P1: {earliest: "2026-11-23T12:00:00-08:00", latest: "2026-11-23T12:30:00-08:00"}

  - id: POL-007
    title: Minimum notice of 24 business hours rules out Monday and early Tuesday
    category: policy_fairness_privacy
    subcategory: minimum_notice_period
    description: >-
      Policy requires at least 24 business hours of notice, counted on the recruiting business calendar
      (Monday-Friday 9:00-17:00 Pacific). From Thursday 3:00 p.m. PST that boundary is Tuesday 3:00 p.m.
      PST. The recruiter asks for Monday or even tomorrow. Only a 15-minute range of starts on Tuesday
      evening Eastern satisfies notice, the candidate, and the interviewer.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [notice_period, business_hours_arithmetic, policy_over_urgency, two_time_zones]
    requirement_refs: [CON-05, SCH-01, SCH-05, AVL-10]
    inputs:
      now: "2026-11-05T15:00:00-08:00"
      recruiter: {id: rec_jordan, name: Jordan Kim, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hannah Brooks
        time_zone: America/New_York
        phone: "+1 555 0142"
        availability:
          - {start: "2026-11-09T13:00:00-05:00", end: "2026-11-09T17:00:00-05:00"}
          - {start: "2026-11-10T16:00:00-05:00", end: "2026-11-10T19:00:00-05:00"}
      interview_plan:
        name: Account Executive - recruiter phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 45, interviewers: [int_marcus]}
      interviewers:
        - id: int_marcus
          name: Marcus Bell
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar: []
      policies:
        minimum_notice:
          business_hours: 24
          business_calendar: Monday-Friday 09:00-17:00 America/Los_Angeles
          measured_from: the time the invitation would be sent (now)
          exceptions: recorded approval from the TA operations lead only
      conversation:
        - role: recruiter
          text: Hannah's eager. Can we do Monday at 2 Eastern? Or even tomorrow morning if Marcus has time?
    expected:
      disposition: propose_options
      solution_summary: >-
        24 business hours from Thursday, November 5, 3:00 p.m. PST ends Tuesday, November 10, 3:00 p.m. PST
        (2 + 8 + 8 + 6 hours). The only compliant starts are 6:00-6:15 p.m. EST (3:00-3:15 p.m. PST) on
        Tuesday, November 10, 2026.
      must:
        - Explain that the notice boundary is Tuesday, November 10, 3:00 p.m. PST and show how it was counted.
        - Reject Friday and Monday, November 9 at 2:00 p.m. EST as violating minimum notice.
        - Propose only starts from 6:00 to 6:15 p.m. EST (3:00-3:15 p.m. PST) on Tuesday, November 10.
        - Include phone-screen details rather than a Teams link, and ask whether to book.
      must_not:
        - Propose Monday, November 9 or Friday, November 6.
        - Count weekend or evening hours toward the 24 business hours.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-10T23:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-10T15:00", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-10T23:00:00Z", time_zone: America/New_York, expected_local: "2026-11-10T18:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T15:00:00-08:00", end: "2026-11-11T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/New_York
          available: [["2026-11-09T13:00:00-05:00", "2026-11-09T17:00:00-05:00"], ["2026-11-10T16:00:00-05:00", "2026-11-10T19:00:00-05:00"]]
        int_marcus:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_marcus]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-10T18:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-09T14:00:00-05:00", note: Only about 18 business hours of notice.}
        - {S1: "2026-11-10T16:00:00-05:00", note: 1:00 p.m. PST is before the notice boundary.}
      valid_start_bounds:
        S1: {earliest: "2026-11-10T18:00:00-05:00", latest: "2026-11-10T18:15:00-05:00"}
    grading_notes: The search window starts at the notice boundary, so any earlier start is invalid by construction.

  - id: POL-008
    title: After-hours interview needs the interviewer's recorded opt-in; a manager's "she won't mind" is not one
    category: policy_fairness_privacy
    subcategory: after_hours_opt_in
    description: >-
      A London candidate can only do afternoons, which are early mornings in Los Angeles. Policy allows
      interviews outside an interviewer's working hours only inside a recorded opt-in. Kai opted in to
      7:00-8:00 a.m. Pacific on Tuesdays and Thursdays; Rosa has no opt-in, despite the hiring manager saying
      she will not mind. Only Kai on Tuesday works.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [after_hours, opt_in_register, working_hours, london, los_angeles, informal_consent_rejected]
    requirement_refs: [CON-05, AVL-10, CRD-03, SCH-01]
    inputs:
      now: "2026-11-12T08:00:00+00:00"
      recruiter: {id: rec_david, name: David Mensah, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Chloé Martin
        time_zone: Europe/London
        availability:
          - {start: "2026-11-17T14:00:00+00:00", end: "2026-11-17T16:30:00+00:00"}
          - {start: "2026-11-18T14:00:00+00:00", end: "2026-11-18T16:30:00+00:00"}
