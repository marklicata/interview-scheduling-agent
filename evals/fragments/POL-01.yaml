          availability_source: calendar
          calendar:
            - {start: "2026-11-19T00:00:00+02:00", end: "2026-11-20T00:00:00+02:00", status: oof}
      policies:
        conflict_of_interest:
          rule: Exclude any interviewer listed in the COI register for this candidate from every evaluative session.
          categories: [former direct manager within 5 years, relative or household member, close collaborator]
          candidate_messaging: Never mention a conflict of interest or why an interviewer changed.
        coi_register:
          - {interviewer: int_marek, candidate: Ewa Kowalska, relationship: former direct manager 2023-2025, disclosed_by: int_marek, recorded_at: "2026-11-12T16:20:00+01:00"}
      conversation:
        - role: recruiter
