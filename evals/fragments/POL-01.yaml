# POL cases, part 1: workload caps, certifications, conflicts of interest, confidentiality, notice, opt-in,
# holidays, merit processes, works agreements, youth programs, protected traits, data use.
test_cases:
  - id: POL-001
    title: Interviewer daily cap of two is already reached on the day her calendar looks free
    category: policy_fairness_privacy
    subcategory: interviewer_daily_cap
    description: >-
      Dana's calendar shows Tuesday afternoon as open, but she already has two interviews that day from other
      requisitions and policy caps interviewers at two interviews per local day. The recruiter asks for
      Tuesday anyway. The agent must count committed load across cases, offer only Wednesday, and not reveal
      the other candidates behind Dana's interviews.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [workload_cap, daily_cap, cross_case_load, policy_over_calendar]
    requirement_refs: [CON-04, CON-05, EC-043, INV-02]
    inputs:
      now: "2026-11-05T10:00:00-06:00"
      recruiter: {id: rec_grace, name: Grace Thompson, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mateo Silva
        time_zone: America/Chicago
        availability:
          - {start: "2026-11-10T13:00:00-06:00", end: "2026-11-10T16:00:00-06:00"}
          - {start: "2026-11-11T09:00:00-06:00", end: "2026-11-11T11:00:00-06:00"}
      interview_plan:
        name: Senior Accountant - technical interview
        region: US
        team: Corporate Finance
        sessions:
          - {id: S1, title: Technical accounting interview, format: virtual, duration_min: 60, interviewers: [int_dana]}
      interviewers:
        - id: int_dana
          name: Dana Whitfield
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-10T09:00:00-06:00", end: "2026-11-10T10:00:00-06:00", status: busy, subject: Interview (REQ-7710)}
            - {start: "2026-11-10T11:00:00-06:00", end: "2026-11-10T12:00:00-06:00", status: busy, subject: Interview (REQ-7712)}
      policies:
        interviewer_load:
          max_interviews_per_day: 2
          counted_per: interviewer local calendar day, across all requisitions
          exceptions: only with a recorded approval from the TA operations lead
          source: Contoso TA policy TA-12
      case_state:
        interviewer_load_snapshot:
          - {interviewer: int_dana, date_local: "2026-11-10", interviews_scheduled: 2}
          - {interviewer: int_dana, date_local: "2026-11-11", interviews_scheduled: 0}
      conversation:
        - role: recruiter
          at: "2026-11-05T09:58:00-06:00"
          channel: chat
          text: >-
            Mateo can do Tue 1-4 or Wed 9-11 (Central). Dana's calendar is wide open Tuesday afternoon, so
            let's grab Tuesday at 1 and get it done.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 10 is not valid because Dana already has two interviews that day (cap 2). Propose a
        60-minute interview on Wednesday, November 11, 2026 starting between 9:00 and 10:00 a.m. CST, and ask
        whether to book it.
      must:
        - Explain that Dana already has two interviews on Tuesday, November 10, which reaches the daily cap of two.
        - Propose only Wednesday, November 11 starts from 9:00 to 10:00 a.m. CST for the 60-minute interview.
        - Note that a cap exception would need a recorded approval from the TA operations lead.
        - Ask whether to book the selected Wednesday option.
      must_not:
        - Propose or book any Tuesday, November 10 slot because the calendar looks free.
        - Book anything before explicit confirmation.
        - Name or describe the candidates in Dana's other interviews.
        - Treat the recruiter's request as a cap exception.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00-06:00", end: "2026-11-12T00:00:00-06:00"}
      participants:
        candidate:
          time_zone: America/Chicago
          available: [["2026-11-10T13:00:00-06:00", "2026-11-10T16:00:00-06:00"], ["2026-11-11T09:00:00-06:00", "2026-11-11T11:00:00-06:00"]]
        int_dana:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-10T00:00:00-06:00", "2026-11-11T00:00:00-06:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_dana]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-11T09:00:00-06:00"}
      invalid_examples:
        - {S1: "2026-11-10T13:00:00-06:00", note: Calendar is free but Dana's daily cap of two is already reached.}
      valid_start_bounds:
        S1: {earliest: "2026-11-11T09:00:00-06:00", latest: "2026-11-11T10:00:00-06:00"}
    grading_notes: The whole of Tuesday is modeled as busy for Dana because the cap is reached; this is a policy block, not a calendar block.

  - id: POL-002
    title: Weekly interviewer cap pushes a Berlin interviewer to the following week despite a manager's assurance
    category: policy_fairness_privacy
    subcategory: interviewer_weekly_cap
    description: >-
      Jonas has already done four interviews in the week of November 9, the weekly maximum. His calendar is
      open Thursday afternoon and the hiring manager says he "won't mind one more". A manager's assurance is
      not a recorded exception, so only Monday, November 16 is valid. The candidate is in London and the
      interviewer in Berlin.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, portfolio_review]
    tags: [workload_cap, weekly_cap, informal_exception_rejected, london, berlin]
    requirement_refs: [CON-04, CON-05, AVL-10]
    inputs:
      now: "2026-11-11T09:00:00+01:00"
      recruiter: {id: rec_sofia, name: Sofia Rossi, time_zone: Europe/Rome}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Leila Haddad
        time_zone: Europe/London
        availability:
          - {start: "2026-11-12T14:00:00+00:00", end: "2026-11-12T17:00:00+00:00"}
          - {start: "2026-11-16T09:00:00+00:00", end: "2026-11-16T11:00:00+00:00"}
      interview_plan:
        name: Senior Product Designer - portfolio review
        region: EMEA
        sessions:
          - {id: S1, title: Portfolio review, format: virtual, duration_min: 45, interviewers: [int_jonas]}
      interviewers:
        - id: int_jonas
          name: Jonas Weber
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar: []
      policies:
        interviewer_load:
          max_interviews_per_week: 4
          week_definition: Monday-Sunday in the interviewer's local time
          exceptions: only via a recorded approval in the TA exception register
      case_state:
        interviewer_load_snapshot:
          - {interviewer: int_jonas, week_of_local: "2026-11-09", interviews_scheduled: 4}
          - {interviewer: int_jonas, week_of_local: "2026-11-16", interviews_scheduled: 1}
      conversation:
        - role: hiring_manager
          at: "2026-11-11T08:40:00+01:00"
          channel: teams
          text: Jonas won't mind one more this week, just put Leila on Thursday afternoon. His calendar is totally free.
        - role: recruiter
          at: "2026-11-11T08:59:00+01:00"
          channel: chat
          text: You heard Marco. Can you set up Leila's portfolio review with Jonas for Thursday?
    expected:
      disposition: propose_options
      solution_summary: >-
        Jonas has reached his weekly cap of four for November 9-15. Offer Monday, November 16, 2026 with
        45-minute starts from 9:00 to 10:15 a.m. GMT (10:00-11:15 a.m. CET), and ask to book.
      must:
        - Explain that Jonas already has four interviews in the week of November 9, the weekly maximum.
        - State that the hiring manager's assurance is not a recorded exception under the policy.
        - Propose only Monday, November 16 starts from 9:00 to 10:15 a.m. GMT, shown also as 10:00-11:15 a.m. CET.
        - Ask whether to book the chosen option.
      must_not:
        - Propose or book Thursday, November 12 with Jonas.
        - Treat "he won't mind" as interviewer consent or as a policy exception.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-16T09:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-16T10:00", expected_weekday: Monday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-16T09:00:00Z", time_zone: Europe/London, expected_local: "2026-11-16T09:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-12T00:00:00+00:00", end: "2026-11-17T00:00:00+00:00"}
      participants:
        candidate:
          time_zone: Europe/London
          available: [["2026-11-12T14:00:00+00:00", "2026-11-12T17:00:00+00:00"], ["2026-11-16T09:00:00+00:00", "2026-11-16T11:00:00+00:00"]]
        int_jonas:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-09T00:00:00+01:00", "2026-11-16T00:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_jonas]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-16T09:00:00+00:00"}
      invalid_examples:
        - {S1: "2026-11-12T14:00:00+00:00", note: Weekly cap already reached for November 9-15.}
      valid_start_bounds:
        S1: {earliest: "2026-11-16T09:00:00+00:00", latest: "2026-11-16T10:15:00+00:00"}

  - id: POL-003
    title: Bar raiser must be currently certified - trainee and lapsed certification do not qualify
    category: policy_fairness_privacy
    subcategory: certification_required
    description: >-
      The remaining loop session must be led by an active certified bar raiser. The recruiter suggests Lena,
      who is free at 10:00 but is still a shadow, and Kofi is free at noon but his certification lapsed on
      October 31. Only Ravi is eligible, and only one hour fits between the candidate's already booked sessions
      and Ravi's calendar.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [bar_raiser, virtual_loop]
    tags: [certification, bar_raiser, eligibility_roster, expired_certification, pool_eligibility]
    requirement_refs: [CON-02, CON-05, INV-02, SCH-01]
    source_inspiration: Amazon-style bar raiser programs where only trained, certified bar raisers can hold the role.
    inputs:
      now: "2026-11-12T10:00:00-05:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tomás Herrera
        time_zone: America/Bogota
        availability:
          - {start: "2026-11-17T09:00:00-05:00", end: "2026-11-17T15:00:00-05:00"}
      interview_plan:
        name: Senior Product Manager - virtual loop
        region: Americas
        sessions:
          - {id: S1, title: Product sense, format: virtual, duration_min: 60, interviewers: [int_nadia]}
          - {id: S2, title: Execution, format: virtual, duration_min: 60, interviewers: [int_omid]}
          - {id: BR, title: Bar raiser, format: virtual, duration_min: 60, pool: {from: [int_ravi, int_lena, int_kofi], count: 1}, eligibility: active bar raiser certification on the interview date}
      interviewers:
        - {id: int_nadia, name: Nadia Petrova, time_zone: America/New_York, availability_source: calendar}
        - {id: int_omid, name: Omid Farahani, time_zone: America/New_York, availability_source: calendar}
        - id: int_ravi
          name: Ravi Shah
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T09:00:00-05:00", end: "2026-11-17T14:00:00-05:00", status: busy}
        - id: int_lena
          name: Lena Fischer
          time_zone: America/New_York
          availability_source: supplied
          supplied_availability:
            - {start: "2026-11-17T10:00:00-05:00", end: "2026-11-17T11:00:00-05:00"}
        - id: int_kofi
          name: Kofi Asante
          time_zone: America/New_York
          availability_source: supplied
          supplied_availability:
            - {start: "2026-11-17T12:00:00-05:00", end: "2026-11-17T13:00:00-05:00"}
      policies:
        bar_raiser_roster:
          - {interviewer: int_ravi, status: certified, valid_until: "2027-06-30"}
          - {interviewer: int_lena, status: shadow_in_training, note: may observe only as an extra attendee}
          - {interviewer: int_kofi, status: lapsed, valid_until: "2026-10-31"}
      case_state:
        existing_bookings:
          - {session: S1, start: "2026-11-17T09:00:00-05:00", end: "2026-11-17T10:00:00-05:00", booking_status: invitation_sent}
          - {session: S2, start: "2026-11-17T11:00:00-05:00", end: "2026-11-17T12:00:00-05:00", booking_status: invitation_sent}
      conversation:
        - role: recruiter
          text: >-
            Last piece for Tomás is the bar raiser on Tue the 17th. Lena is free at 10 and she's done like
            ten shadows, just use her. Kofi could also do noon.
    expected:
      disposition: propose_options
      solution_summary: >-
        Only Ravi is an active certified bar raiser. The bar raiser session fits only on Tuesday, November 17,
        2026 at 2:00-3:00 p.m. (Bogota and New York are both UTC-5 that day). Ask whether to book it.
      must:
        - Explain that Lena is a shadow in training and cannot hold the bar raiser role, and that Kofi's certification lapsed on October 31, 2026.
        - Propose the bar raiser with Ravi at 2:00-3:00 p.m. on November 17 (same clock time in Bogota and New York).
        - Keep the bar raiser clear of the already booked 9:00-10:00 and 11:00-12:00 sessions.
        - Ask whether to book it.
      must_not:
        - Propose Lena at 10:00 a.m. or Kofi at noon as the bar raiser.
        - Book without explicit confirmation.
        - Count shadow sessions as certification.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T08:00:00-05:00", end: "2026-11-17T18:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/Bogota
          available: [["2026-11-17T10:00:00-05:00", "2026-11-17T11:00:00-05:00"], ["2026-11-17T12:00:00-05:00", "2026-11-17T15:00:00-05:00"]]
        int_ravi:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}
          busy: [["2026-11-17T09:00:00-05:00", "2026-11-17T14:00:00-05:00"]]
        int_lena: {time_zone: America/New_York, available: [["2026-11-17T10:00:00-05:00", "2026-11-17T11:00:00-05:00"]]}
        int_kofi: {time_zone: America/New_York, available: [["2026-11-17T12:00:00-05:00", "2026-11-17T13:00:00-05:00"]]}
      sessions:
        - {id: BR, duration_min: 60, attendees: [candidate], pool: {from: [int_ravi], count: 1}}
      expect_feasible: true
      valid_examples:
        - {BR: {start: "2026-11-17T14:00:00-05:00", interviewers: [int_ravi]}}
      invalid_examples:
        - {BR: {start: "2026-11-17T10:00:00-05:00", interviewers: [int_lena]}, note: Lena is not certified.}
        - {BR: {start: "2026-11-17T12:00:00-05:00", interviewers: [int_kofi]}, note: Kofi's certification lapsed.}
      valid_start_bounds:
        BR: {earliest: "2026-11-17T14:00:00-05:00", latest: "2026-11-17T14:00:00-05:00"}
    grading_notes: The oracle's candidate availability already excludes the two booked sessions.

  - id: POL-004
    title: Two coding rounds need two distinct calibrated interviewers; an uncalibrated trainee cannot fill one
    category: policy_fairness_privacy
    subcategory: calibrated_interviewer_required
    description: >-
      Both coding rounds must be run by calibrated interviewers and the same person cannot run both. Only Ana
      (Singapore) and Chidi (Kolkata) are calibrated. Bo is free all morning but is still in calibration.
      The recruiter wants Bo plus Ana so the candidate finishes early. The only compliant plan uses Ana first
      and Chidi after his India working day starts.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_loop]
    tags: [calibration, distinct_interviewers, pool_eligibility, singapore, india, half_hour_offset]
    requirement_refs: [CON-02, CON-04, AVL-10, SCH-01]
    inputs:
      now: "2026-11-13T09:00:00+08:00"
      recruiter: {id: rec_wenjie, name: Wen Jie Lim, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Nur Aisyah Rahman
        time_zone: Asia/Singapore
        availability:
          - {start: "2026-11-18T09:00:00+08:00", end: "2026-11-18T13:00:00+08:00"}
      interview_plan:
        name: Backend Engineer - coding rounds
        region: APAC
        sessions:
          - {id: C1, title: Coding round 1, format: virtual, duration_min: 60, pool: {from: [int_ana, int_chidi, int_bo], count: 1}}
          - {id: C2, title: Coding round 2, format: virtual, duration_min: 60, pool: {from: [int_ana, int_chidi, int_bo], count: 1}}
        rules: {same_day: true, break_between_sessions_min: 15, distinct_interviewers: true}
      interviewers:
        - id: int_ana
          name: Ana Reyes
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-18T09:00:00+08:00", end: "2026-11-18T10:00:00+08:00", status: busy}
        - id: int_chidi
          name: Chidi Okonkwo
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar: []
        - id: int_bo
          name: Bo Andersen
          time_zone: Asia/Manila
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar: []
      policies:
        coding_calibration_roster:
          - {interviewer: int_ana, status: calibrated}
          - {interviewer: int_chidi, status: calibrated}
          - {interviewer: int_bo, status: in_calibration, note: may shadow a calibrated interviewer but cannot run a round}
      conversation:
        - role: recruiter
          text: >-
            Bo's free all morning on Wed 18 Nov. Can we do 9:00 with Bo and 10:15 with Ana so Nur is done
            before lunch?
    expected:
      disposition: propose_options
      solution_summary: >-
        Bo cannot run a round. Ana must go first (from 10:00 SGT) and Chidi second once his Kolkata day
        starts at 9:00 IST (11:30 SGT), with at least 15 minutes between rounds - for example Ana 10:00-11:00
        and Chidi 11:30 a.m.-12:30 p.m. SGT on Wednesday, November 18, 2026.
      must:
        - Explain that Bo is in calibration and cannot run a coding round.
        - Assign the two rounds to Ana and Chidi, one each, with Ana's round first.
        - Start Chidi's round no earlier than 11:30 a.m. SGT (9:00 a.m. IST) and finish both rounds by 1:00 p.m. SGT with at least 15 minutes between them.
        - Show Chidi's round in IST as well as SGT, and ask whether to book.
      must_not:
        - Propose Bo for either round.
        - Use Ana for both rounds.
        - Schedule Chidi before 9:00 a.m. IST.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T03:30:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-18T09:00", expected_weekday: Wednesday, expected_utc_offset: "+05:30"}
      - {instant: "2026-11-18T03:30:00Z", time_zone: Asia/Singapore, expected_local: "2026-11-18T11:30", expected_utc_offset: "+08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T08:00:00+08:00", end: "2026-11-18T14:00:00+08:00"}
      participants:
        candidate: {time_zone: Asia/Singapore, available: [["2026-11-18T09:00:00+08:00", "2026-11-18T13:00:00+08:00"]]}
        int_ana:
          time_zone: Asia/Singapore
          working_hours: {time_zone: Asia/Singapore, start: "09:00", end: "18:00"}
          busy: [["2026-11-18T09:00:00+08:00", "2026-11-18T10:00:00+08:00"]]
        int_chidi:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, start: "09:00", end: "18:00"}
        int_bo:
          time_zone: Asia/Manila
          working_hours: {time_zone: Asia/Manila, start: "08:00", end: "17:00"}
      sessions:
        - {id: C1, duration_min: 60, attendees: [candidate], pool: {from: [int_ana, int_chidi], count: 1}}
        - {id: C2, duration_min: 60, attendees: [candidate], pool: {from: [int_ana, int_chidi], count: 1}}
      constraints:
        min_gap_min: 15
        same_local_day: {time_zone: Asia/Singapore}
        distinct_interviewers: true
      expect_feasible: true
      valid_examples:
        - {C1: {start: "2026-11-18T10:00:00+08:00", interviewers: [int_ana]}, C2: {start: "2026-11-18T11:30:00+08:00", interviewers: [int_chidi]}}
        - {C1: {start: "2026-11-18T10:15:00+08:00", interviewers: [int_ana]}, C2: {start: "2026-11-18T12:00:00+08:00", interviewers: [int_chidi]}}
      invalid_examples:
        - {C1: {start: "2026-11-18T09:00:00+08:00", interviewers: [int_bo]}, C2: {start: "2026-11-18T10:15:00+08:00", interviewers: [int_ana]}, note: Bo is not calibrated.}
        - {C1: {start: "2026-11-18T10:00:00+08:00", interviewers: [int_ana]}, C2: {start: "2026-11-18T11:15:00+08:00", interviewers: [int_ana]}, note: Same interviewer for both rounds.}
        - {C1: {start: "2026-11-18T10:00:00+08:00", interviewers: [int_ana]}, C2: {start: "2026-11-18T11:00:00+08:00", interviewers: [int_chidi]}, note: Chidi starts before 9:00 IST and there is no 15-minute break.}

  - id: POL-005
    title: Former manager on the conflict-of-interest register is excluded even though he is the convenient choice
    category: policy_fairness_privacy
    subcategory: conflict_of_interest_former_manager
    description: >-
      Marek disclosed that he managed the candidate at a previous employer, and the COI register excludes him.
      The recruiter wants him because he "knows her work". The remaining eligible pool members are Ciarán in
