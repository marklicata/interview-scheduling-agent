          calendar:
            - {start: "2026-12-01T16:00:00-06:00", end: "2026-12-01T17:30:00-06:00", status: busy}
        - {id: int_brenda, name: Brenda Kowalczyk, role: Program coordinator, time_zone: America/Chicago, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri, Sat], start: "08:00", end: "18:00"}, calendar: []}
      policies:
        youth_program:
          windows: Interviews only inside guardian-approved windows on file.
          guardian_approved_windows:
            - {start: "2026-12-01T16:00:00-06:00", end: "2026-12-01T18:00:00-06:00"}
            - {start: "2026-12-03T16:00:00-06:00", end: "2026-12-03T17:30:00-06:00"}
            - {start: "2026-12-05T10:00:00-06:00", end: "2026-12-05T12:00:00-06:00"}
          school_hours: Never Monday-Friday 08:00-15:30 local.
          coordinator: The program coordinator attends every interview; virtual only.
          data_minimization: Invitations say "Youth internship program" and never include date of birth, school, or grade.
      conversation:
        - role: candidate
          at: "2026-11-23T19:10:00-06:00"
          channel: email
          text: Hi! I'm free Tue or Thu after school, Saturday morning, or Wednesday at 11 during study hall if that's easier :)
        - role: recruiter
          at: "2026-11-24T08:58:00-06:00"
          channel: chat
          text: Destiny suggested Wednesday at 11, that's easiest for Olu. Can you set it up?
