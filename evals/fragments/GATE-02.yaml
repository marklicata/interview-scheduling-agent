      solution_summary: >-
        Flag that R3 (evt-mum-r3, Friday, December 4, 2026, 15:00-15:45 IST) was created on December 1, before R2 was held, and R2 still has no
        recorded result, so it conflicts with the plan's book_after_pass policy. Ask whether the recruiter/plan owner wants to keep it (an
        authorized exception), cancel it, or wait for the R2 result before adding the Teams link.
