  - id: GATE-068
    title: Candidate writes "CST" while relocating from Dallas to Shanghai - clarify before scheduling round 2
    category: gated_sequential_rounds
    subcategory: ambiguous_abbreviation_next_round
    description: >-
      The R1 pass is recorded for a Shanghai role. The candidate is currently in Dallas and relocating to Shanghai in
      mid-December, and offers "Thursday Dec 10 between 9-11am CST". China Standard Time and US Central Standard Time
      give completely different instants (and different dates in Chicago). One reading fits the Shanghai interviewer;
      the other is 23:00 in Shanghai. Context does not resolve it, so the agent must ask.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, hiring_manager, virtual_1on1]
    tags: [china, united_states, ambiguous_abbreviation, cst, relocation, ask_clarification]
    requirement_refs: [AVL-10, CON-10]
    inputs:
      now: "2026-12-07T09:00:00-06:00"
      recruiter: {id: rec_megan, name: Megan Walsh, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Zhou Xin
        location_note: Currently in Dallas; relocating to Shanghai "mid-December" (exact date not given).
        time_zone_raw: CST
        availability_raw: Thursday Dec 10 between 9-11am CST
      interview_plan:
        name: Supply Chain Manager - Shanghai
        region: China
        sessions:
          - {id: R1, title: Functional interview, format: virtual, duration_min: 60, interviewers: [int_liqiang], gate: none}
          - {id: R2, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_fengjun], gate: R1 pass}
        rules:
          gating_policy: book_after_pass
      interviewers:
        - {id: int_liqiang, name: Li Qiang, time_zone: Asia/Shanghai, availability_source: calendar}
        - id: int_fengjun
          name: Feng Jun
          role: Hiring manager
          time_zone: Asia/Shanghai
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar: []
      case_state:
        round_results:
          - {round: R1, result: pass, recorded_by: int_liqiang, recorded_at: "2026-12-04T17:00:00+08:00"}
      conversation:
        - role: candidate
          at: "2026-12-06T20:00:00-06:00"
          channel: email
          text: Thanks for the update! I'm available Thursday Dec 10 between 9-11am CST for the next conversation. Best, Zhou Xin
        - role: recruiter
          at: "2026-12-07T09:00:00-06:00"
          channel: chat
          text: Zhou Xin passed R1. Set up R2 with Feng Jun from her availability.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask which "CST" she means. China Standard Time: Thursday, December 10, 2026, 9:00-11:00 a.m. in Shanghai (Wednesday, December 9, 7:00-9:00 p.m. in
        Chicago) - inside Feng Jun's hours. US Central Standard Time: Thursday, December 10, 9:00-11:00 a.m. in Chicago = 11:00 p.m.-1:00 a.m. in Shanghai -
        outside his hours. Propose R2 once clarified.
      must:
        - Flag "CST" as ambiguous (China Standard Time vs US Central Standard Time) given her Dallas-to-Shanghai move.
        - Show both interpretations with absolute dates and times in Shanghai and Chicago, including that the China reading is Wednesday evening in Chicago.
        - Explain that only the China Standard Time reading falls within Feng Jun's working hours.
        - Ask the recruiter to confirm with the candidate (or supply her time zone) before proposing R2.
      must_not:
        - Silently assume either meaning and propose or book R2.
        - Store "CST" as an IANA time zone.
      side_effects: {external_writes: none}
      clarifying_question_topics: [time_zone_abbreviation, candidate_location_on_date]
    local_time_checks:
