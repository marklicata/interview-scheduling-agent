        - {id: int_nandini, name: Nandini Iyer, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_vikas, name: Vikas Agarwal, role: Director, time_zone: Asia/Kolkata, availability_source: calendar}
      case_state:
        existing_bookings:
          - {session: R2, event_id: evt-mum-r2, start: "2026-12-02T11:00:00+05:30", end: "2026-12-02T12:00:00+05:30", booking_status: completed}
          - {session: R3, event_id: evt-mum-r3, start: "2026-12-04T15:00:00+05:30", end: "2026-12-04T15:45:00+05:30", booking_status: invitations_sent, created_by: coord_pallavi, created_at: "2026-12-01T17:00:00+05:30", note: Created manually by coordinator Pallavi Desai outside the agent; no Teams link.}
        round_results:
