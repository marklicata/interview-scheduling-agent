        - {id: int_kumaresan, name: Kumaresan Pillai, time_zone: Asia/Kuala_Lumpur, availability_source: calendar}
        - {id: int_leemh, name: Lee Mun Hong, role: Hiring manager, time_zone: Asia/Kuala_Lumpur, availability_source: calendar}
      case_state:
        existing_bookings:
