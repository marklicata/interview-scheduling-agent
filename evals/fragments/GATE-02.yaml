        id: candidate
        name: Aakash Mehra
        email: aakash.mehra@example.net
        time_zone: Asia/Kolkata
      interview_plan:
        name: Risk Analytics Manager - Mumbai
        region: India
        sessions:
          - {id: R1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_farhan], gate: none}
          - {id: R2, title: Case interview, format: virtual, duration_min: 60, interviewers: [int_nandini], gate: R1 pass}
          - {id: R3, title: Director interview, format: virtual, duration_min: 45, interviewers: [int_vikas], gate: R2 pass}
