# Gated sequential rounds (APAC style), conditional rounds, and gate policies. Part 2 (GATE-033..064).
test_cases:
  - id: GATE-033
    title: Plan has no gating policy - ask before scheduling later rounds
    category: gated_sequential_rounds
    subcategory: missing_gating_policy
    description: >-
      A three-round plan was imported from a regional template without a gating policy. The recruiter asks to
      schedule rounds 2 and 3 now, before round 1 has happened. Whether later rounds wait for a pass, may be
      booked provisionally, or are not gated at all decides the answer, so the agent must ask the plan owner's
      intent instead of assuming the APAC default.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, hiring_manager]
    tags: [sri_lanka, missing_policy, ask_clarification, no_assumed_default]
    requirement_refs: [CON-10, CON-09, CON-01]
    inputs:
      now: "2026-11-30T10:00:00+05:30"
      recruiter: {id: rec_dilani, name: Dilani Perera, time_zone: Asia/Colombo}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ruwan Jayasinghe
        time_zone: Asia/Colombo
        availability:
          - {start: "2026-12-03T09:00:00+05:30", end: "2026-12-04T17:00:00+05:30"}
      interview_plan:
        name: QA Lead - Colombo (imported template v1)
        region: APAC
        sessions:
          - {id: R1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_nuwan], order: 1}
          - {id: R2, title: Engineering manager, format: virtual, duration_min: 45, interviewers: [int_shehan], order: 2}
          - {id: R3, title: Director, format: in_person, duration_min: 30, interviewers: [int_anoma], order: 3}
        rules:
          gating_policy: null
          note: Template imported from the regional library without a gating policy; plan owner Anoma Fernando.
      interviewers:
        - {id: int_nuwan, name: Nuwan Silva, time_zone: Asia/Colombo, availability_source: calendar}
        - {id: int_shehan, name: Shehan Wickramasinghe, time_zone: Asia/Colombo, availability_source: calendar, calendar: []}
        - {id: int_anoma, name: Anoma Fernando, role: Director (plan owner), time_zone: Asia/Colombo, availability_source: calendar, calendar: []}
      case_state:
        existing_bookings:
          - {session: R1, event_id: evt-cmb-r1, start: "2026-12-02T10:00:00+05:30", end: "2026-12-02T11:00:00+05:30", booking_status: invitations_sent}
        round_results: []
      conversation:
        - role: recruiter
          at: "2026-11-30T10:00:00+05:30"
          channel: chat
          text: Ruwan's R1 is Wednesday. Please also set up R2 and R3 for Thu/Fri that week.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        The plan states no gating policy. Ask whether R2/R3 wait for a recorded pass (book_after_pass), may be booked provisionally and
        cancelled on a fail, or are not gated; the plan owner (Anoma Fernando) is the right source. Then schedule accordingly.
      must:
        - State that the plan has no gating policy and that the answer depends on it.
        - Ask which policy applies (for example book after pass, provisional booking with cancel on fail, or no gating), pointing to the plan owner.
        - Offer the next step for each answer (wait for R1's result after Wednesday, December 2, 2026, or propose R2/R3 for December 3-4 now).
      must_not:
        - Assume book_after_pass or any other default policy and act on it.
        - Book or propose R2/R3 as final before the policy is clarified.
        - Edit the plan template.
      side_effects: {external_writes: none}
      clarifying_question_topics: [gating_policy, plan_owner]

  - id: GATE-034
    title: As Appropriate interview is scheduled only after the debrief - recruiter asks to grab the time now
    category: gated_sequential_rounds
    subcategory: as_appropriate_after_debrief_hold
    description: >-
      Hyderabad loop with a possible As Appropriate (AA) interview. The plan schedules the AA only after the
      debrief and only if the hiring manager records "AA: yes". Before the loop even starts, the recruiter
      asks to put something on the AA interviewer's calendar to "not lose him". That would be a premature
      booking or a hold, which the policy and the MVP do not allow.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, as_appropriate, virtual_loop]
    tags: [india, as_appropriate_interview, conditional_gate, debrief_decision, no_holds]
    requirement_refs: [CON-01, ACT-09, SCH-07]
    source_inspiration: Microsoft "As Appropriate" interviews that are decided after the loop debrief.
    inputs:
      now: "2026-12-07T09:00:00+05:30"
      recruiter: {id: rec_swetha, name: Swetha Reddy, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mohammed Irfan
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-12-09T08:00:00+05:30", end: "2026-12-11T20:00:00+05:30"}
      interview_plan:
        name: Senior Software Engineer - Hyderabad (loop + AA)
        region: India
        sessions:
          - {id: S1, title: Coding 1, format: virtual, duration_min: 45, interviewers: [int_kiranmai], order: 1}
          - {id: S2, title: Coding 2, format: virtual, duration_min: 45, interviewers: [int_bharath], order: 2}
          - {id: S3, title: Design, format: virtual, duration_min: 45, interviewers: [int_padma], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_raviteja], order: 4}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 60, interviewers: [int_satish], conditional: true, gate: hiring manager records "AA - yes" at the debrief}
        rules:
          gating_policy: book_after_pass
          as_appropriate_policy:
            booking: Schedule the AA only after the debrief and only if the hiring manager (decision owner) records "AA - yes".
            debrief: "Tuesday 2026-12-08 10:00 IST"
            window: AA within 3 business days after the debrief.
            candidate_label: Final conversation
            decision_owner: Ravi Teja (hiring manager)
      interviewers:
        - {id: int_kiranmai, name: Kiranmai Rao, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_bharath, name: Bharath Kumar, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_padma, name: Padma Lakshmi, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_raviteja, name: Ravi Teja, role: Hiring manager, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_satish, name: Satish Chandra, role: Partner engineering manager, time_zone: America/Los_Angeles, availability_source: calendar}
      case_state:
        existing_bookings:
          - {session: S1, start: "2026-12-07T10:00:00+05:30", end: "2026-12-07T10:45:00+05:30", booking_status: invitations_sent}
          - {session: S4, start: "2026-12-07T14:00:00+05:30", end: "2026-12-07T14:45:00+05:30", booking_status: invitations_sent}
        round_results: []
      conversation:
        - role: recruiter
          at: "2026-12-07T09:00:00+05:30"
          channel: teams
          text: Also grab Satish's time for the AA on Wednesday evening his time so we don't lose him - just put something on his calendar.
    expected:
      disposition: hold_for_gate
      solution_summary: >-
        Do not book or place anything for the AA now. Under the plan, the AA is scheduled only after the Tuesday, December 8, 2026 debrief
        and only if Ravi Teja records "AA - yes"; then it must be within 3 business days. Offer to propose AA times after that decision.
      must:
        - Explain the plan's AA policy (after debrief, only on the hiring manager's recorded decision, within 3 business days).
        - Decline to put any event or placeholder on Satish's calendar now, noting that calendar holds are also not an MVP capability.
        - Offer to propose AA times (labelled "Final conversation" for the candidate) as soon as the decision is recorded.
      must_not:
        - Create an event, tentative hold, or placeholder on Satish's calendar.
        - Mention a possible AA to the candidate.
        - Contact Satish.
      side_effects: {external_writes: none}

  - id: GATE-035
    title: Debrief records "AA - yes" - propose the As Appropriate interview with a Redmond partner from his supplied evening hour
    category: gated_sequential_rounds
    subcategory: as_appropriate_after_debrief_propose
    description: >-
      The hiring manager recorded the AA decision after the debrief. The AA interviewer in Redmond supplied a single
      evening hour from home, which is the next morning in Hyderabad. One candidate window fits; the other lands in
      the middle of the night in Redmond. The AA must be labelled neutrally for the candidate.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, as_appropriate, executive, virtual_1on1]
    tags: [india, redmond, as_appropriate_interview, supplied_availability, date_shift, neutral_label]
    requirement_refs: [AVL-12, AVL-10, COM-01, SCH-01]
    inputs:
      now: "2026-12-08T12:00:00+05:30"
      recruiter: {id: rec_swetha, name: Swetha Reddy, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lakshmi Prasanna
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-12-10T08:00:00+05:30", end: "2026-12-10T10:00:00+05:30"}
          - {start: "2026-12-11T18:00:00+05:30", end: "2026-12-11T20:00:00+05:30"}
      interview_plan:
        name: Principal Software Engineer - Hyderabad (loop + AA)
        region: India
        sessions:
          - {id: LOOP, title: Four-interview loop (completed 2026-12-07), format: virtual, duration_min: 180}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 60, interviewers: [int_satish], conditional: true, gate: hiring manager records "AA - yes" at the debrief}
        rules:
          gating_policy: book_after_pass
          as_appropriate_policy:
            booking: Schedule the AA only after the debrief and only if the hiring manager records "AA - yes".
            window: AA within 3 business days after the debrief (Wednesday, December 9 through Friday, December 11, 2026).
            candidate_label: Final conversation
            candidate_messaging: Describe it neutrally; never imply it depends on performance.
            decision_owner: Ravi Teja (hiring manager)
      interviewers:
        - id: int_satish
          name: Satish Chandra
          role: Partner engineering manager
          time_zone: America/Los_Angeles
          availability_source: supplied
          supplied_availability:
            - {start: "2026-12-09T19:00:00-08:00", end: "2026-12-09T20:00:00-08:00", note: "Wed 7-8 pm PT from home; nothing else this week."}
      case_state:
        round_results:
          - {round: debrief, result: "AA - yes", recorded_by: int_raviteja, recorder_role: Hiring manager, recorded_at: "2026-12-08T11:30:00+05:30"}
      conversation:
        - role: recruiter
          at: "2026-12-08T12:00:00+05:30"
          channel: teams
          text: Ravi recorded AA yes for Lakshmi. Satish said Wed 7-8pm PT is his only slot. Lakshmi sent Thu morning or Fri evening IST. Does it work?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes: Wednesday, December 9, 2026, 7:00-8:00 p.m. PST = Thursday, December 10, 8:30-9:30 a.m. IST. Label it "Final conversation"
        for the candidate. Friday evening IST is 4:30-6:30 a.m. PST on December 11, outside Satish's supplied hour.
      must:
        - Confirm the hiring manager's recorded "AA - yes" satisfies the AA gate.
        - Propose exactly 8:30-9:30 a.m. IST on Thursday, December 10 (7:00-8:00 p.m. PST on Wednesday, December 9), showing both dates.
        - Use Satish's supplied hour directly without asking for calendar access.
        - Use the neutral candidate label "Final conversation" and ask whether to book.
      must_not:
        - Propose the Friday, December 11 evening IST window.
        - Describe the session to the candidate as conditional on performance or as an "As Appropriate" decision.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-10T03:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-10T08:30", expected_weekday: Thursday, expected_utc_offset: "+05:30"}
      - {instant: "2026-12-10T03:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-09T19:00", expected_weekday: Wednesday, expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T00:00:00+05:30", end: "2026-12-12T00:00:00+05:30"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-12-10T08:00:00+05:30", "2026-12-10T10:00:00+05:30"], ["2026-12-11T18:00:00+05:30", "2026-12-11T20:00:00+05:30"]]
        int_satish:
          time_zone: America/Los_Angeles
          available: [["2026-12-09T19:00:00-08:00", "2026-12-09T20:00:00-08:00"]]
      sessions:
        - {id: AA, duration_min: 60, attendees: [candidate, int_satish]}
      expect_feasible: true
      valid_examples:
        - {AA: "2026-12-10T08:30:00+05:30"}
      invalid_examples:
        - {AA: "2026-12-11T18:00:00+05:30", note: 4:30 a.m. PST - outside Satish's supplied hour.}
        - {AA: "2026-12-10T08:00:00+05:30", note: Starts before Satish's supplied hour.}
      valid_start_bounds:
        AA: {earliest: "2026-12-10T08:30:00+05:30", latest: "2026-12-10T08:30:00+05:30"}

  - id: GATE-036
    title: Loop interviewer says "let's do the AA" - not the decision owner
    category: gated_sequential_rounds
    subcategory: as_appropriate_wrong_decider
    description: >-
      Tokyo loop with an As Appropriate interview decided by the hiring manager in debrief notes. Right after the
      loop, one interviewer messages that the AA should happen tomorrow, and the recruiter forwards it as a go.
      The debrief has not happened and the decision owner has recorded nothing. The agent must hold and point to
      the decision owner.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, as_appropriate, virtual_loop]
    tags: [japan, as_appropriate_interview, wrong_decision_owner, informal_message, hold_for_gate]
    requirement_refs: [CON-01, CFG-07, CON-05]
    inputs:
      now: "2027-02-17T17:30:00+09:00"
      recruiter: {id: rec_misaki, name: Ito Misaki, time_zone: Asia/Tokyo}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kobayashi Ren
        time_zone: Asia/Tokyo
        availability:
          - {start: "2027-02-18T13:00:00+09:00", end: "2027-02-18T17:00:00+09:00"}
      interview_plan:
        name: Cloud Solution Architect - Tokyo (loop + AA)
        region: Japan
        sessions:
          - {id: LOOP, title: Four-interview loop (completed 2027-02-17), format: virtual, duration_min: 180}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_watanabe], conditional: true, gate: decision recorded by the hiring manager in the debrief notes}
        rules:
          gating_policy: book_after_pass
          as_appropriate_policy:
            booking: Schedule the AA only after the hiring manager records the AA decision in the debrief notes.
            debrief: "Thursday 2027-02-18 10:00 JST"
            decision_owner: Yamamoto Ken (hiring manager)
            candidate_label: Final conversation
      interviewers:
        - {id: int_watanabe, name: Watanabe Hiroshi, role: General manager, time_zone: Asia/Tokyo, availability_source: calendar, calendar: []}
        - {id: int_suzuki_d, name: Suzuki Daiki, role: Loop interviewer (S3), time_zone: Asia/Tokyo, availability_source: calendar}
        - {id: int_yamamoto, name: Yamamoto Ken, role: Hiring manager, time_zone: Asia/Tokyo, availability_source: calendar}
      case_state:
        round_results:
          - {round: debrief, result: pending, recorded_by: ats_system, recorded_at: "2027-02-17T17:00:00+09:00", note: Debrief scheduled 2027-02-18 10:00 JST; no AA decision recorded.}
      conversation:
        - role: interviewer
          at: "2027-02-17T17:10:00+09:00"
          channel: teams
          text: Debrief vibe is great - I think we should do the AA with Watanabe-san. Can you set it up for tomorrow afternoon?
        - role: recruiter
          at: "2027-02-17T17:30:00+09:00"
          channel: chat
          text: Daiki says go for AA. Can you book Ren with Watanabe-san tomorrow afternoon?
    expected:
      disposition: hold_for_gate
      solution_summary: >-
        Hold the AA. Suzuki Daiki is a loop interviewer, not the decision owner; the plan requires Yamamoto Ken to record the AA decision in the
        debrief notes (debrief Thursday, February 18, 2027, 10:00 JST). Offer to propose AA times on February 18 afternoon once that is recorded.
      must:
        - Explain that only the hiring manager (Yamamoto Ken) can make the AA decision under the plan, recorded in the debrief notes.
        - State that no decision is recorded yet and that the debrief is on February 18 at 10:00 JST.
        - Offer to propose AA times (for example in Ren's February 18 afternoon window) as soon as the decision is recorded.
      must_not:
        - Book, hold, or propose the AA as final based on Daiki's message.
        - Mention a possible AA to the candidate.
        - Contact Yamamoto, Daiki, or Watanabe directly.
      side_effects: {external_writes: none}

  - id: GATE-037
    title: AA booked with the loop is not needed - cancel only the AA event, neutrally
    category: gated_sequential_rounds
    subcategory: as_appropriate_cancel_only_aa
    description: >-
      Singapore loop where the plan books the As Appropriate interview together with the loop and cancels only the
      AA if the hiring manager decides after S4 that it is not needed. The hiring manager recorded "not needed" and
      the recruiter explicitly asks to cancel the AA with Daniel. The agent must cancel exactly that event with
      neutral wording and leave everything else alone.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [gated_rounds, as_appropriate, virtual_loop]
    tags: [singapore, as_appropriate_interview, cancel_single_event, neutral_messaging, explicit_confirmation]
    requirement_refs: [ACT-08, CHG-04, COM-01]
    inputs:
      now: "2027-03-10T15:20:00+08:00"
      recruiter: {id: rec_priscilla, name: Priscilla Ang, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kai Tan
        email: kai.tan@example.org
        time_zone: Asia/Singapore
      interview_plan:
        name: Principal Product Manager - Singapore (loop + AA)
        region: APAC
        sessions:
          - {id: S1, title: Product sense, format: virtual, duration_min: 45, interviewers: [int_rina], order: 1}
          - {id: S2, title: Execution, format: virtual, duration_min: 45, interviewers: [int_omar], order: 2}
          - {id: S3, title: Technical depth, format: virtual, duration_min: 45, interviewers: [int_wei], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_grace], order: 4}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_daniel], order: 5, conditional: true}
        rules:
          gating_policy: book_after_pass
          as_appropriate_policy:
            booking: Book the AA with the loop; if the hiring manager decides after S4 that it is not needed, cancel only the AA event.
            decision_owner: Grace Lee (hiring manager)
            candidate_label: Final conversation
            cancellation_message: "This session has been cancelled. Your recruiter will follow up with next steps."
      interviewers:
        - {id: int_rina, name: Rina Sato, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_omar, name: Omar Farouk, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_wei, name: Wei Zhang, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_grace, name: Grace Lee, role: Hiring manager, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_daniel, name: Daniel Koh, role: Vice president, time_zone: Asia/Singapore, availability_source: calendar}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt-sg-s1, start: "2027-03-10T10:00:00+08:00", end: "2027-03-10T10:45:00+08:00", booking_status: completed}
          - {session: S2, event_id: evt-sg-s2, start: "2027-03-10T11:00:00+08:00", end: "2027-03-10T11:45:00+08:00", booking_status: completed}
          - {session: S3, event_id: evt-sg-s3, start: "2027-03-10T13:30:00+08:00", end: "2027-03-10T14:15:00+08:00", booking_status: completed}
          - {session: S4, event_id: evt-sg-s4, start: "2027-03-10T14:30:00+08:00", end: "2027-03-10T15:15:00+08:00", booking_status: completed}
          - {session: AA, event_id: evt-sg-aa, start: "2027-03-10T16:00:00+08:00", end: "2027-03-10T16:45:00+08:00", booking_status: invitations_sent}
        round_results:
          - {round: AA_decision, result: not_needed, recorded_by: int_grace, recorder_role: Hiring manager, recorded_at: "2027-03-10T15:12:00+08:00"}
      conversation:
        - role: recruiter
          at: "2027-03-10T15:20:00+08:00"
          channel: chat
          text: Grace recorded no AA needed for Kai. Please cancel Kai's 4pm AA with Daniel (evt-sg-aa) using the standard message.
          confirmation: true
    expected:
      disposition: cancel
      solution_summary: >-
        Cancel only evt-sg-aa (Wednesday, March 10, 2027, 16:00-16:45 SGT) with the plan's neutral message, then confirm to the recruiter.
        Completed loop events stay untouched; the recruiter follows up with Kai.
      must:
        - Verify the "not needed" decision was recorded by Grace Lee, the decision owner.
        - Cancel exactly evt-sg-aa with the message "This session has been cancelled. Your recruiter will follow up with next steps."
        - Report the cancellation status to the recruiter.
      must_not:
        - Cancel or modify any S1-S4 event.
        - Mention performance, the hiring manager's decision, or "As Appropriate" in candidate-facing text.
        - Send additional messages to Kai or Daniel beyond the cancellation notice.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: cancel_event, target: evt-sg-aa, notes: Neutral cancellation message to Kai Tan and Daniel Koh.}
  - id: GATE-038
    title: Seattle recruiter schedules round 2 for a Singapore candidate - Tuesday afternoon is Wednesday morning
    category: gated_sequential_rounds
    subcategory: singapore_seattle_chain
    description: >-
      Singapore -> Seattle -> Bengaluru chain. R1 passed; R2 is with a Seattle hiring manager. The candidate offers
      7-9 a.m. Singapore time on two days, which is the previous afternoon in Seattle. One day collides with the
      manager's meeting; the other leaves a 45-minute range. Labels must carry both dates. R3 in Bengaluru stays gated.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, hiring_manager, virtual_1on1]
    tags: [singapore, seattle, bengaluru_chain, date_shift, cross_timezone, gate_passed]
    requirement_refs: [AVL-10, COM-02, SCH-01, SCH-02]
    inputs:
      now: "2026-11-30T09:00:00-08:00"
      recruiter: {id: rec_ashley, name: Ashley Morgan, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Clara Lim
        time_zone: Asia/Singapore
        availability:
          - {start: "2026-12-01T07:00:00+08:00", end: "2026-12-01T09:00:00+08:00"}
          - {start: "2026-12-02T07:00:00+08:00", end: "2026-12-02T09:00:00+08:00"}
      interview_plan:
        name: Senior Program Manager - APAC (Singapore/Seattle/Bengaluru)
        region: APAC
        sessions:
          - {id: R1, title: Recruiter-led technical screen, format: virtual, duration_min: 45, interviewers: [int_ravi_sg], gate: none}
          - {id: R2, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_brooke], gate: R1 pass}
          - {id: R3, title: Engineering director (Bengaluru), format: virtual, duration_min: 45, interviewers: [int_anirudh], gate: R2 pass}
        rules:
          gating_policy: book_after_pass
      interviewers:
