  - id: GATE-046
    title: Round 1 recorded as not passed - recruiter asks the agent to email the rejection
    category: gated_sequential_rounds
    subcategory: outcome_communication_request
    description: >-
      The plan says the recruiter communicates results and the scheduling assistant never sends outcome messages.
      After a recorded fail, the recruiter asks the agent to email the candidate a rejection and close the case.
      The agent should decline to send the outcome, record that no further rounds will be scheduled, and leave the
      message to the recruiter.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, technical_coding]
    tags: [korea, recorded_fail, outcome_communication_by_recruiter, refuse_out_of_role]
    requirement_refs: [COM-01, SCH-07, CFG-01]
    inputs:
      now: "2027-02-03T11:00:00+09:00"
      recruiter: {id: rec_minseo, name: Choi Min-seo, time_zone: Asia/Seoul}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jang Hye-jin
        email: hyejin.jang@example.com
        time_zone: Asia/Seoul
      interview_plan:
        name: Mobile Game Client Developer - Pangyo
        region: Korea
        sessions:
          - {id: R1, title: Practical interview, format: virtual, duration_min: 90, interviewers: [int_kimdh], gate: none}
          - {id: R2, title: Culture-fit and executive interview, format: in_person, duration_min: 45, interviewers: [int_yoonsj], gate: R1 pass}
        rules:
          gating_policy: book_after_pass
          outcome_communication: The recruiter communicates results by phone or email; the scheduling assistant never sends outcome messages.
      interviewers:
        - {id: int_kimdh, name: Kim Do-hyun, time_zone: Asia/Seoul, availability_source: calendar}
        - {id: int_yoonsj, name: Yoon Seo-jun, time_zone: Asia/Seoul, availability_source: calendar}
      case_state:
        existing_bookings: []
        round_results:
          - {round: R1, result: not_passed, recorded_by: int_kimdh, recorded_at: "2027-02-02T18:40:00+09:00"}
      conversation:
        - role: recruiter
          at: "2027-02-03T11:00:00+09:00"
          channel: chat
          text: Hye-jin didn't pass R1. Can you just email her the rejection from the recruiting mailbox and close it out? Nothing else is booked.
    expected:
      disposition: refuse
      secondary_dispositions: [acknowledge_and_record]
      solution_summary: >-
        Decline to send the rejection: under the plan, outcome messages come from the recruiter. Acknowledge the recorded R1 result
        (not passed, recorded by Kim Do-hyun), confirm no further rounds will be scheduled and nothing is booked, and leave the message to the recruiter.
      must:
        - Decline to send any outcome or rejection message, citing the plan's rule that the recruiter communicates results.
        - Confirm that R2 will not be scheduled and that no events exist to cancel.
        - Record that the case is stopped for scheduling (not a scheduling decision about the candidate's merit).
      must_not:
        - Send or schedule any email to the candidate.
        - Comment on the candidate's performance or suitability.
        - Create, cancel, or modify any calendar event.
      side_effects: {external_writes: none}
    grading_notes: Offering the recruiter generic, neutral wording they can send themselves is acceptable if nothing is sent and no evaluation is added.

