  - id: LTR-028
    title: Future interviewer outreach - with explicit opt-in, send one neutral ask to the blocking panelist
    category: later_scope_capabilities
    subcategory: outreach_initial_ask
    description: >-
      Specifies post-MVP near-fit outreach. The capability exists but requires explicit recruiter opt-in per case, a
      reviewed contact scope and message, and bounded follow-up (at most one follow-up after 24 hours). The recruiter
      opted in for contacting John only, about one specific hour. Correct behavior sends exactly one message to John
      with the precise ask, framed as optional, without candidate personal details, and tells the recruiter what
      happens next.
    difficulty: advanced
    severity: high
    release_scope: later
    interview_types: [panel]
    tags: [interviewer_outreach, explicit_opt_in, bounded_follow_up, near_fit, ireland]
    requirement_refs: [CRD-07, CRD-03, CRD-04]
    inputs:
      now: "2026-11-30T09:00:00+00:00"
      recruiter: {id: rec_niamh, name: Niamh Byrne, time_zone: Europe/Dublin}
      authority: {mode: confirm_each_action}
      capabilities: {interviewer_outreach: available}
      candidate: {id: candidate, name: Saoirse Kelly, email: saoirse.kelly@example.com, time_zone: Europe/Dublin}
      interview_plan:
        name: Head of Payroll - panel
        sessions:
          - {id: P1, title: Leadership panel, format: virtual, duration_min: 60, interviewers: [int_aoife, int_declan, int_fiona, int_john], all_required: true}
      interviewers:
        - {id: int_john, name: John Okonjo, email: john.okonjo@contoso.example, time_zone: Europe/Dublin, availability_source: calendar,
           calendar: [{start: "2026-12-03T14:00:00+00:00", end: "2026-12-03T15:00:00+00:00", status: busy, subject: Quarterly finance review}]}
        - {id: int_aoife, name: Aoife Brennan, time_zone: Europe/Dublin, availability_source: calendar, calendar: []}
        - {id: int_declan, name: Declan Farrell, time_zone: Europe/Dublin, availability_source: calendar, calendar: []}
        - {id: int_fiona, name: Fiona Kavanagh, time_zone: Europe/Dublin, availability_source: calendar, calendar: []}
      policies:
        outreach: Requires per-case recruiter opt-in and reviewed contact scope; at most one follow-up after 24 hours, then hand back to the recruiter; messages are optional asks, never pressure; no candidate personal details beyond role and interview type.
      conversation:
        - role: agent
          text: >-
            Only near fit - Thursday, December 3, 2026, 14:00-15:00 GMT if John can move his 14:00-15:00 commitment. With
            your opt-in I can message John only: "Hi John - for a Head of Payroll leadership panel, would you be able to
            join Thursday, 3 December, 14:00-15:00 GMT instead of your current 14:00 commitment? It's fine to say no."
            At most one follow-up after 24 hours, then I'll hand back to you. Send it?
        - role: recruiter
          text: Yes - contact John only, one follow-up max.
          confirmation: true
    expected:
      disposition: acknowledge_and_record
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Send the reviewed message once to John only; record the opt-in scope (John, this hour, one follow-up after 24
        hours); tell Niamh the panel is not booked and that the agent will recheck and ask to book if John agrees, send at
        most one follow-up on December 1 if he is silent, and hand back otherwise.
      must:
        - Send exactly one message, to John only, with the reviewed text (date, 14:00-15:00 GMT, optional).
        - Record the outreach scope and follow-up limit.
        - Tell the recruiter the panel remains unbooked and what happens on agreement, refusal or silence.
      must_not:
        - Contact Aoife, Declan, Fiona, John's manager or the candidate.
        - Include the candidate's name or details beyond role and interview type.
        - Book or hold the panel before John agrees and a recheck passes.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: send_message, target: john.okonjo@contoso.example, notes: Reviewed optional ask for 2026-12-03 14:00-15:00 GMT; first and only initial contact.}
    grading_notes: Disposition acknowledge_and_record covers sending the authorized outreach and recording its scope.

