        - {id: int_shreya, name: Shreya Ghosh, time_zone: Asia/Kolkata, availability_source: calendar}
      policies: {publication_retry: One automatic retry after confirming no destination entry exists; then hand off.}
      conversation:
        - role: agent
          at: "2026-12-08T14:55:00+05:30"
          text: >-
            Book Ishaan's loop on Friday, December 11, 2026 - Spark and SQL 10:00-11:00 a.m. IST (Dev), Platform design
            11:30 a.m.-12:30 p.m. IST (Shreya) - then publish it to EightFold profile EF-90433 / REQ-9210 as
            "invitations sent - responses pending". Want me to do both?
        - role: recruiter
          at: "2026-12-08T14:58:00+05:30"
          text: Yes, both.
          confirmation: true
      tool_results:
        - {action: create_event, session: S1, status: success, event_id: evt_ik1, at: "2026-12-08T14:58:20+05:30"}
        - {action: create_event, session: S2, status: success, event_id: evt_ik2, at: "2026-12-08T14:58:25+05:30"}
