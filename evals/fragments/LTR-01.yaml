      candidate: {id: candidate, name: Ishaan Kapoor, email: ishaan.kapoor@example.com, time_zone: Asia/Kolkata}
      interview_plan:
        name: Data Platform Engineer - loop
        requisition: REQ-9210
        sessions:
          - {id: S1, title: Spark and SQL, format: virtual, duration_min: 60, interviewers: [int_dev]}
          - {id: S2, title: Platform design, format: virtual, duration_min: 60, interviewers: [int_shreya]}
