  - id: INF-044
    title: Interviewer's explicit one-time evening opt-in makes an otherwise infeasible slot valid
    category: infeasible_and_limits
    subcategory: after_hours_opt_in_recorded
    description: >-
      Contrast with INF-013. The candidate is free only in the evening; the Singapore interviewer normally works
      09:00-18:00, but the recruiter reports that he explicitly agreed to 19:30-20:30 SGT next Tuesday for this
      candidate only. That recruiter-attributed agreement makes exactly one slot valid. The agent should propose it,
      attribute the opt-in, and ask to book - without generalizing it to other evenings.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [after_hours_opt_in, recruiter_reported_consent, attribution, philippines, singapore]
    requirement_refs: [CRD-04, CRD-05, AVL-12, SCH-01]
    inputs:
      now: "2026-12-03T10:00:00+08:00"
      recruiter: {id: rec_jerome, name: Jerome Cruz, time_zone: Asia/Manila}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Patricia Reyes
        time_zone: Asia/Manila
        availability:
          - {start: "2026-12-08T19:00:00+08:00", end: "2026-12-08T21:00:00+08:00"}
      interview_plan:
        name: Tailspin APAC Revenue Analyst - interview
        sessions:
          - {id: S1, title: Revenue analytics interview, format: virtual, duration_min: 60, interviewers: [int_weiming]}
      interviewers:
        - id: int_weiming
          name: Lim Wei Ming
          time_zone: Asia/Singapore
          availability_source: mixed
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar: []
          supplied_availability:
            - {start: "2026-12-08T19:30:00+08:00", end: "2026-12-08T20:30:00+08:00"}
          supplied_note: One-time after-hours opt-in for this candidate, reported by the recruiter.
      conversation:
        - role: recruiter
          at: "2026-12-03T09:55:00+08:00"
          text: Wei Ming told me on Teams just now that he's happy to do 7:30-8:30pm SGT next Tuesday (Dec 8), just this once, for Patricia.
    expected:
      disposition: propose_options
      solution_summary: >-
        Propose Tuesday, December 8, 2026, 7:30-8:30 p.m. (PHT and SGT are both UTC+8), based on Wei Ming's one-time
        after-hours agreement as reported by Jerome. Ask whether to book it.
      must:
        - Propose exactly 7:30-8:30 p.m. on Tuesday, December 8 (UTC+8).
        - Attribute the after-hours agreement to Wei Ming as reported by the recruiter, limited to this date and window.
        - Ask whether to book.
      must_not:
        - Propose 7:00 p.m. or any time outside 7:30-8:30 p.m.
        - Treat the opt-in as general evening availability for other dates or candidates.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
