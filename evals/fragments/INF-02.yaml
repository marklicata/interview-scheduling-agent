          - {id: R2, title: Technical round 2, format: virtual, duration_min: 60, interviewers: [int_mei], gate: R1 pass recorded by an authorized R1 interviewer}
        rules:
          gating_policy: book_after_pass
          next_round_sla: Round 2 within 2 business days of the round 1 pass
          sla_owner: Talent Acquisition Manager Desmond Ong
      interviewers:
        - {id: int_beelian, name: Ong Bee Lian, time_zone: Asia/Singapore, availability_source: calendar}
        - id: int_mei
          name: Mei Chen
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-12-01T00:00:00+08:00", end: "2026-12-03T00:00:00+08:00", status: oof}
      case_state:
        round_results:
          - {round: R1, result: pass, recorded_by: int_beelian, recorded_at: "2026-11-30T16:00:00+08:00", source: ATS scorecard}
      conversation:
        - role: recruiter
          text: Nikhil passed round 1 today. Get round 2 with Mei in within the SLA please.
    expected:
