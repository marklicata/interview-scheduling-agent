    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T00:00:00+05:45", end: "2026-12-09T00:00:00+05:45"}
      participants:
        candidate: {time_zone: Asia/Kathmandu, available: [["2026-12-08T13:00:00+05:45", "2026-12-08T15:00:00+05:45"]]}
        int_anjali:
          time_zone: Asia/Kathmandu
          working_hours: {time_zone: Asia/Kathmandu, start: "10:00", end: "17:00"}
          busy: [["2026-12-08T10:00:00+05:45", "2026-12-08T17:00:00+05:45"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_anjali]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-08T13:00:00+05:45", note: Anjali's status is unknown - not free.}
