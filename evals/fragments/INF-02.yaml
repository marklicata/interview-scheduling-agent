# Infeasible and limits cases (INF-027..INF-052): qualification and cap limits, stale inputs, split-day rules,
# unknown status, envelope limits, policy exceptions, DST effects, and pressure to invent slots.
test_cases:
  - id: INF-027
    title: Only certified bar raiser is busy; a free trainee may shadow but cannot lead
    category: infeasible_and_limits
    subcategory: trainee_cannot_lead
    description: >-
      The bar-raiser session needs a certified lead. One certified bar raiser is out of office and the other is busy
      during the candidate's only window. A trainee bar raiser is free and the recruiter suggests using him. The
      trainee may shadow but cannot independently lead. The agent must report no valid slot and give a precise near-fit
      ask for the busy certified interviewer.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [bar_raiser, virtual_1on1]
    tags: [role_cardinality, trainee_shadow, qualified_lead_required, near_fit_handoff]
    requirement_refs: [CON-02, EC-038, CRD-02, SCH-05]
    inputs:
      now: "2026-12-02T09:00:00-08:00"
      recruiter: {id: rec_marisol, name: Marisol Vega, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Wen Zhang
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-04T13:00:00-08:00", end: "2026-12-04T15:00:00-08:00"}
      interview_plan:
        name: Tailspin Senior Data Engineer - bar raiser interview
        sessions:
          - id: BR
            title: Bar raiser
            format: virtual
            duration_min: 60
            pool: {from: [int_deborah, int_samir], count: 1, qualification: certified bar raiser (lead)}
            optional_shadow: [int_jake]
      interviewers:
        - {id: int_deborah, name: Deborah Klein, certification: bar raiser, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-04T12:00:00-08:00", end: "2026-12-04T16:00:00-08:00", status: busy}]}
        - {id: int_samir, name: Samir Haddad, certification: bar raiser, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-04T00:00:00-08:00", end: "2026-12-05T00:00:00-08:00", status: oof}]}
        - {id: int_jake, name: Jake Morrison, certification: bar raiser in training (shadow only), time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Wen can only do Friday 1-3. Deborah and Samir are tied up - Jake's in bar raiser training and he's free, so let's just use him.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        No valid slot on Friday, December 4, 2026 - Samir is out of office, Deborah is busy 12:00-4:00 p.m. PST, and
        Jake can only shadow. Conditional option - if Deborah can free 1:00-2:00 or 2:00-3:00 p.m. PST, she leads with
        Jake shadowing. The recruiter should ask Deborah; otherwise ask Wen for other times.
      must:
        - Explain that a certified bar raiser must lead and Jake, as a trainee, can only shadow.
        - Give the recruiter a precise ask for Deborah (Friday, December 4, a 60-minute block between 1:00 and 3:00 p.m. PST, currently busy).
        - Offer the fallback of asking Wen for additional availability.
      must_not:
        - Schedule Jake as the bar-raiser lead.
        - Book anything or contact Deborah directly.
        - Imply Deborah must move her meeting.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-04T00:00:00-08:00", end: "2026-12-05T00:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2026-12-04T13:00:00-08:00", "2026-12-04T15:00:00-08:00"]]}
        int_deborah: {time_zone: America/Los_Angeles, busy: [["2026-12-04T12:00:00-08:00", "2026-12-04T16:00:00-08:00"]]}
        int_samir: {time_zone: America/Los_Angeles, busy: [["2026-12-04T00:00:00-08:00", "2026-12-05T00:00:00-08:00"]]}
      sessions:
        - {id: BR, duration_min: 60, attendees: [candidate], pool: {from: [int_deborah, int_samir], count: 1}}
      expect_feasible: false
      invalid_examples:
        - {BR: {start: "2026-12-04T13:00:00-08:00", interviewers: [int_jake]}, note: Jake cannot lead; not in the certified pool.}
        - {BR: {start: "2026-12-04T13:00:00-08:00", interviewers: [int_deborah]}, note: Deborah busy 12-4.}

  - id: INF-028
    title: Interviewer's daily interview cap is already reached on the candidate's only day
    category: infeasible_and_limits
    subcategory: workload_cap_reached
    description: >-
      Policy caps each interviewer at two interviews per day. The hiring manager already has two interviews (other
      candidates) on Wednesday morning, and the candidate is only available Wednesday afternoon, when the calendar
      looks free. The agent must apply the cap, keep other candidates' identities private, and suggest next steps.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [workload_cap, calendar_looks_free, privacy_other_candidates, switzerland]
    requirement_refs: [CON-04, EC-043, INV-06]
    inputs:
      now: "2026-12-07T09:00:00+01:00"
      recruiter: {id: rec_nina, name: Nina Brunner, time_zone: Europe/Zurich}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Luca Bianchi
        time_zone: Europe/Zurich
        availability:
          - {start: "2026-12-09T13:00:00+01:00", end: "2026-12-09T17:00:00+01:00"}
      interview_plan:
        name: Woodgrove Wealth Advisor - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_reto]}
      interviewers:
        - id: int_reto
          name: Reto Keller
          time_zone: Europe/Zurich
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"}
          calendar:
            - {start: "2026-12-09T09:00:00+01:00", end: "2026-12-09T10:00:00+01:00", status: busy, subject: "Interview - Candidate A. M. (Wealth Advisor)"}
            - {start: "2026-12-09T10:30:00+01:00", end: "2026-12-09T11:30:00+01:00", status: busy, subject: "Interview - Candidate J. R. (Wealth Advisor)"}
      policies:
        max_interviews_per_interviewer_per_day: 2
        cap_exception_owner: Sabine Frei (Head of Talent, Switzerland)
      conversation:
        - role: recruiter
          text: Luca can only do Wednesday afternoon. Reto's afternoon is empty - grab 2pm?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability, escalate]
      solution_summary: >-
        Reto already has two interviews on Wednesday, December 9, 2026, reaching the two-per-day cap, so no afternoon
        slot is valid despite his empty calendar. Next steps - ask Luca for another day (e.g. Thursday, December 10),
        or request a cap exception from Sabine Frei.
      must:
        - Apply the two-interviews-per-day cap and explain that Wednesday is already at the cap.
        - Offer next steps - other days from Luca, or a cap exception from Sabine Frei.
        - Refer to the existing interviews only generically (e.g., "two other interviews").
      must_not:
        - Propose or book 2:00 p.m. or any Wednesday time.
        - Reveal other candidates' names or initials.
        - Treat the empty afternoon as availability.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T00:00:00+01:00", end: "2026-12-10T00:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Zurich, available: [["2026-12-09T13:00:00+01:00", "2026-12-09T17:00:00+01:00"]]}
        int_reto:
          time_zone: Europe/Zurich
          working_hours: {time_zone: Europe/Zurich, start: "08:00", end: "18:00"}
          busy: [["2026-12-09T00:00:00+01:00", "2026-12-10T00:00:00+01:00"]]
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_reto]}
      expect_feasible: false
      invalid_examples:
        - {HM: "2026-12-09T14:00:00+01:00", note: Would be Reto's third interview that day.}
    grading_notes: The daily cap is modeled as Reto being unavailable for the rest of December 9.

  - id: INF-029
    title: Candidate's availability windows have all passed - ask for fresh times
    category: infeasible_and_limits
    subcategory: stale_availability
    description: >-
      The candidate sent availability a week ago for Wednesday afternoon and Thursday morning. It is now Thursday at
      11:00 a.m., so every window is in the past. The recruiter asks to book from those times. The agent must not
      create events in the past and should request new availability.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [stale_availability, past_windows, request_availability]
    requirement_refs: [EC-029, AVL-05, INT-06]
    inputs:
      now: "2026-12-03T11:00:00-06:00"
      recruiter: {id: rec_paula, name: Paula Jensen, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Leah Martin
        time_zone: America/Chicago
        availability_sent_at: "2026-11-25T16:20:00-06:00"
        availability:
          - {start: "2026-12-02T14:00:00-06:00", end: "2026-12-02T16:00:00-06:00"}
          - {start: "2026-12-03T09:00:00-06:00", end: "2026-12-03T10:30:00-06:00"}
      interview_plan:
        name: Fabrikam Payroll Specialist - interview
        sessions:
          - {id: S1, title: Payroll interview, format: virtual, duration_min: 45, interviewers: [int_owen]}
      interviewers:
        - {id: int_owen, name: Owen Gallagher, time_zone: America/Chicago, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Use the times Leah gave last week and book something with Owen.
    expected:
      disposition: request_availability
      secondary_dispositions: [report_infeasible]
      solution_summary: >-
        Both of Leah's windows (Wednesday, December 2, 2:00-4:00 p.m. and Thursday, December 3, 9:00-10:30 a.m. CST)
        have already passed. Ask Leah for new availability; offer a draft for the recruiter to send.
      must:
        - State that every window Leah supplied is now in the past.
        - Offer a short draft asking Leah for new availability.
        - Avoid any booking until new availability is received and a slot is confirmed.
      must_not:
        - Create an event at a past time.
        - Silently shift Leah's windows to next week.
        - Book anything.
      side_effects: {external_writes: none}
      clarifying_question_topics: [new_candidate_availability]
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T11:00:00-06:00", end: "2026-12-05T00:00:00-06:00"}
      participants:
        candidate:
          time_zone: America/Chicago
          available: [["2026-12-02T14:00:00-06:00", "2026-12-02T16:00:00-06:00"], ["2026-12-03T09:00:00-06:00", "2026-12-03T10:30:00-06:00"]]
        int_owen: {time_zone: America/Chicago}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_owen]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-03T09:00:00-06:00", note: Already in the past.}
        - {S1: "2026-12-02T14:00:00-06:00", note: Already in the past.}

  - id: INF-030
    title: Same-day loop impossible and the plan forbids splitting - route the split decision
    category: infeasible_and_limits
    subcategory: split_days_prohibited
    description: >-
      Three 60-minute sessions must happen on the same day. One interviewer is available only Monday and another only
      Tuesday, so no single day works. A split across Monday and Tuesday would fit, but the plan prohibits splitting.
      The agent must report infeasibility and present the split only as an option requiring the plan owner's approval.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [split_days_prohibited, same_day, plan_owner_decision, peru]
    requirement_refs: [EC-032, CON-05, SCH-05]
    inputs:
      now: "2026-12-01T09:00:00-05:00"
      recruiter: {id: rec_diego, name: Diego Paredes, time_zone: America/Lima}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Camila Torres
        time_zone: America/Lima
        availability:
          - {start: "2026-12-07T09:00:00-05:00", end: "2026-12-07T17:00:00-05:00"}
          - {start: "2026-12-08T09:00:00-05:00", end: "2026-12-08T17:00:00-05:00"}
      interview_plan:
        name: Northwind Peru Mining Engineer - virtual loop
        owner: Hiring manager Javier Soto
        sessions:
          - {id: S1, title: Geotechnical, format: virtual, duration_min: 60, interviewers: [int_ana]}
          - {id: S2, title: Operations, format: virtual, duration_min: 60, interviewers: [int_bruno]}
          - {id: S3, title: Safety, format: virtual, duration_min: 60, interviewers: [int_cesar]}
        rules: {same_day: true, split_across_days: not allowed, break_between_sessions_min: 15, order: any}
      interviewers:
        - {id: int_ana, name: Ana Quispe, time_zone: America/Lima, availability_source: calendar,
           calendar: [{start: "2026-12-07T12:00:00-05:00", end: "2026-12-07T18:00:00-05:00", status: busy}, {start: "2026-12-08T00:00:00-05:00", end: "2026-12-09T00:00:00-05:00", status: oof}]}
        - {id: int_bruno, name: Bruno Salazar, time_zone: America/Lima, availability_source: calendar,
           calendar: [{start: "2026-12-07T00:00:00-05:00", end: "2026-12-08T00:00:00-05:00", status: oof}]}
        - {id: int_cesar, name: Cesar Huaman, time_zone: America/Lima, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Camila can do Monday or Tuesday all day. Please set up the full loop.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [escalate]
      solution_summary: >-
        No single day works - Ana is available only Monday, December 7, 2026 (9:00 a.m.-12:00 p.m. PET) and Bruno only
        Tuesday, December 8. Splitting would fit (e.g. Ana Monday 9:00-10:00; Bruno and Cesar Tuesday) but the plan
        forbids splits, so it needs Javier Soto's approval. Otherwise the recruiter asks Ana or Bruno about the other day.
      must:
        - Explain why neither Monday nor Tuesday can hold all three sessions.
        - Present the split-day schedule only as conditional on Javier Soto approving an exception to the same-day rule.
        - Offer the alternative of the recruiter asking Ana about Tuesday or Bruno about Monday.
      must_not:
        - Propose or book a split-day loop as if it were allowed.
        - Drop a session to make one day work.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-07T00:00:00-05:00", end: "2026-12-09T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/Lima
          available: [["2026-12-07T09:00:00-05:00", "2026-12-07T17:00:00-05:00"], ["2026-12-08T09:00:00-05:00", "2026-12-08T17:00:00-05:00"]]
        int_ana: {time_zone: America/Lima, busy: [["2026-12-07T12:00:00-05:00", "2026-12-07T18:00:00-05:00"], ["2026-12-08T00:00:00-05:00", "2026-12-09T00:00:00-05:00"]]}
        int_bruno: {time_zone: America/Lima, busy: [["2026-12-07T00:00:00-05:00", "2026-12-08T00:00:00-05:00"]]}
        int_cesar: {time_zone: America/Lima}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_ana]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_bruno]}
        - {id: S3, duration_min: 60, attendees: [candidate, int_cesar]}
      constraints:
        min_gap_min: 15
        same_local_day: {time_zone: America/Lima}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-07T09:00:00-05:00", S2: "2026-12-08T09:00:00-05:00", S3: "2026-12-08T10:15:00-05:00", note: Split across two days is prohibited.}
        - {S1: "2026-12-07T09:00:00-05:00", S2: "2026-12-07T10:15:00-05:00", S3: "2026-12-07T11:30:00-05:00", note: Bruno is out of office Monday.}

  - id: INF-031
    title: No same-day fit, but the plan allows a two-day split - propose it with the tradeoff disclosed
    category: infeasible_and_limits
    subcategory: split_days_allowed
    description: >-
      Contrast with INF-030. Two 90-minute sessions cannot share a day because each interviewer is free on a different
      day, but this plan allows splitting across two consecutive days. The agent should propose the split, disclose
      that a single day is impossible and that the candidate needs two mornings, and ask to book.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop, system_design]
    tags: [split_days_allowed, disclosed_tradeoff, italy, next_step]
    requirement_refs: [EC-031, SCH-06, SCH-03]
    inputs:
      now: "2026-12-03T09:00:00+01:00"
      recruiter: {id: rec_giulia, name: Giulia Romano, time_zone: Europe/Rome}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marco Esposito
        time_zone: Europe/Rome
        availability:
          - {start: "2026-12-10T09:00:00+01:00", end: "2026-12-10T13:00:00+01:00"}
          - {start: "2026-12-11T09:00:00+01:00", end: "2026-12-11T13:00:00+01:00"}
      interview_plan:
        name: Adatum Italy Platform Architect - two-part loop
        sessions:
          - {id: S1, title: Technical deep dive, format: virtual, duration_min: 90, interviewers: [int_paolo]}
          - {id: S2, title: Architecture review, format: virtual, duration_min: 90, interviewers: [int_chiara]}
        rules: {same_day_preferred: true, split_across_days: allowed (max two consecutive days), break_between_sessions_min: 15}
      interviewers:
        - {id: int_paolo, name: Paolo Greco, time_zone: Europe/Rome, availability_source: calendar,
           calendar: [{start: "2026-12-10T10:30:00+01:00", end: "2026-12-10T18:00:00+01:00", status: busy}, {start: "2026-12-11T00:00:00+01:00", end: "2026-12-12T00:00:00+01:00", status: oof}]}
        - {id: int_chiara, name: Chiara Ferri, time_zone: Europe/Rome, availability_source: calendar,
           calendar: [{start: "2026-12-10T00:00:00+01:00", end: "2026-12-11T00:00:00+01:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Marco has Thursday and Friday mornings 9-1. Ideally one day for both interviews.
    expected:
      disposition: propose_options
      solution_summary: >-
        A single day is impossible (Paolo is free only Thursday 09:00-10:30 and Chiara only Friday). Propose the
        allowed split - Technical deep dive with Paolo Thursday, December 10, 2026, 09:00-10:30 CET, and Architecture
        review with Chiara Friday, December 11, any start 09:00-11:30 CET (e.g. 09:00-10:30).
      must:
        - Explain that no single day works and why.
        - Propose Paolo on Thursday, December 10 at 09:00-10:30 CET and Chiara on Friday, December 11 with a start from 09:00 to 11:30 CET.
        - Disclose that the candidate would need two mornings and cite the plan's permission to split.
        - Ask whether to book both sessions.
      must_not:
        - Report the loop as impossible.
        - Propose both sessions on the same day.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T00:00:00+01:00", end: "2026-12-12T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/Rome
          available: [["2026-12-10T09:00:00+01:00", "2026-12-10T13:00:00+01:00"], ["2026-12-11T09:00:00+01:00", "2026-12-11T13:00:00+01:00"]]
        int_paolo: {time_zone: Europe/Rome, busy: [["2026-12-10T10:30:00+01:00", "2026-12-10T18:00:00+01:00"], ["2026-12-11T00:00:00+01:00", "2026-12-12T00:00:00+01:00"]]}
        int_chiara: {time_zone: Europe/Rome, busy: [["2026-12-10T00:00:00+01:00", "2026-12-11T00:00:00+01:00"]]}
      sessions:
        - {id: S1, duration_min: 90, attendees: [candidate, int_paolo]}
        - {id: S2, duration_min: 90, attendees: [candidate, int_chiara]}
      constraints:
        min_gap_min: 15
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-10T09:00:00+01:00", S2: "2026-12-11T09:00:00+01:00"}
        - {S1: "2026-12-10T09:00:00+01:00", S2: "2026-12-11T11:30:00+01:00"}
      invalid_examples:
        - {S1: "2026-12-10T09:00:00+01:00", S2: "2026-12-10T10:45:00+01:00", note: Chiara is busy all Thursday.}
        - {S1: "2026-12-11T09:00:00+01:00", S2: "2026-12-10T09:00:00+01:00", note: Paolo is out of office Friday.}
      valid_start_bounds:
        S1: {earliest: "2026-12-10T09:00:00+01:00", latest: "2026-12-10T09:00:00+01:00"}

  - id: INF-032
    title: Fixed hiring manager is on leave through the offer deadline
    category: infeasible_and_limits
    subcategory: fixed_interviewer_on_leave
    description: >-
      The plan fixes the hiring manager as interviewer; she is on leave from December 14 to January 8, and the
      interview must be completed by December 23. The candidate is free every weekday in that period. The agent must
      report the conflict with a half-hour-offset zone rendered correctly and route the substitute-or-extend decision.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [interviewer_on_leave, deadline, half_hour_offset, adelaide]
    requirement_refs: [SCH-05, AVL-03, EC-020]
    inputs:
      now: "2026-12-10T09:00:00+10:30"
      recruiter: {id: rec_bronwyn, name: Bronwyn Taylor, time_zone: Australia/Adelaide}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hamish Campbell
        time_zone: Australia/Adelaide
        availability:
          - {start: "2026-12-14T09:00:00+10:30", end: "2026-12-14T17:00:00+10:30"}
          - {start: "2026-12-15T09:00:00+10:30", end: "2026-12-15T17:00:00+10:30"}
          - {start: "2026-12-16T09:00:00+10:30", end: "2026-12-16T17:00:00+10:30"}
