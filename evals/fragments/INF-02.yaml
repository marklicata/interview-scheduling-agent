        id: candidate
        name: Nikhil Rao
        time_zone: Asia/Singapore
        availability:
          - {start: "2026-12-01T10:00:00+08:00", end: "2026-12-01T17:00:00+08:00"}
          - {start: "2026-12-02T10:00:00+08:00", end: "2026-12-02T17:00:00+08:00"}
