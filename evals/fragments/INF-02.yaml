        name: Magnus Eriksen
        time_zone: Europe/Oslo
        availability:
          - {start: "2026-12-08T09:00:00+01:00", end: "2026-12-08T12:00:00+01:00"}
          - {start: "2026-12-09T09:00:00+01:00", end: "2026-12-09T12:00:00+01:00"}
          - {start: "2026-12-10T09:00:00+01:00", end: "2026-12-10T12:00:00+01:00"}
          - {start: "2026-12-11T09:00:00+01:00", end: "2026-12-11T12:00:00+01:00"}
      interview_plan:
        name: Northwind Offshore Wind Project Engineer - panel
        sessions:
          - {id: P1, title: Engineering panel, format: virtual, duration_min: 60, interviewers: [int_kari, int_lars], all_required: true}
      interviewers:
        - {id: int_kari, name: Kari Nilsen, time_zone: Europe/Oslo, availability_source: calendar,
           calendar: [{start: "2026-12-08T09:00:00+01:00", end: "2026-12-08T10:00:00+01:00", status: busy}]}
        - id: int_lars
          name: Lars Berg
          time_zone: Europe/Oslo
          availability_source: calendar
          calendar:
            - {start: "2026-12-08T09:00:00+01:00", end: "2026-12-08T12:00:00+01:00", status: busy}
            - {start: "2026-12-09T09:00:00+01:00", end: "2026-12-09T12:00:00+01:00", status: busy}
          calendar_coverage: {retrieved: "2026-12-08 to 2026-12-09", failed: "2026-12-10 to 2026-12-11 (service unavailable)"}
      conversation:
        - role: system
          text: "Availability lookup for Lars Berg failed for 2026-12-10 to 2026-12-11 (service unavailable). Data for 2026-12-08 to 2026-12-09 retrieved."
        - role: recruiter
