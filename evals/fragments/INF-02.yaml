      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-10T10:00:00+09:00", note: The 60-minute plan duration runs into Dong-min's 10:45 meeting.}

  - id: INF-047
    title: Spring-forward gap silently shrinks a night-shift candidate's two-hour window to one hour
    category: infeasible_and_limits
    subcategory: dst_gap_shrinks_window
    description: >-
      A night-shift nurse offers "Sunday March 14, 1:30 to 3:30 a.m. Eastern - that's 2 hours" for a 90-minute case
      interview with an interviewer in Israel (where Sunday is a workday). US clocks jump from 2:00 to 3:00 a.m. that
      night, so the window is only 60 real minutes (06:30-07:30 UTC). The 90-minute interview cannot fit, even though
      a naive reading says it does.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [case_interview, virtual_1on1]
    tags: [dst_spring_forward, nonexistent_local_time, night_shift_candidate, israel, window_shrinks]
    requirement_refs: [EC-017, AVL-10, SCH-05]
    inputs:
      now: "2027-03-08T09:00:00-05:00"
      recruiter: {id: rec_naomi, name: Naomi Price, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Danielle Okoro
        time_zone: America/New_York
        availability:
          - {start: "2027-03-14T01:30:00-05:00", end: "2027-03-14T03:30:00-04:00"}
        availability_text: "Sunday March 14 from 1:30 to 3:30 a.m. Eastern - that's 2 hours, right after my break."
      interview_plan:
        name: Woodgrove Health Clinical Informatics Specialist - case interview
        sessions:
          - {id: S1, title: Clinical informatics case, format: virtual, duration_min: 90, interviewers: [int_yossi]}
      interviewers:
        - id: int_yossi
          name: Yossi Mizrahi
          time_zone: Asia/Jerusalem
          availability_source: calendar
          working_hours: {days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "17:00"}
          calendar: []
      conversation:
        - role: candidate
          channel: email
          text: I work nights, so my best time is Sunday March 14 from 1:30 to 3:30 a.m. Eastern - that's 2 hours, right after my break.
        - role: recruiter
          text: Yossi works Sundays in Tel Aviv, so 1:30 a.m. Eastern should be his morning. Can we fit the 90-minute case?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        No - on Sunday, March 14, 2027 US clocks jump from 2:00 to 3:00 a.m., so 1:30 a.m. EST to 3:30 a.m. EDT is only
        60 minutes (08:30-09:30 in Israel), too short for 90 minutes. Ask Danielle for another window, e.g. between
        8:00 and 10:00 a.m. EDT on March 15-18 (14:00-16:00 in Israel), when Yossi is working.
      must:
        - Explain that 2:00-3:00 a.m. does not exist in New York on March 14 and the window is 60 real minutes.
        - Show the window in Israel time (08:30-09:30) and state that 90 minutes cannot fit.
        - Ask for another window with a concrete suggestion that fits Yossi's Sunday-Thursday 08:00-17:00 hours.
      must_not:
        - Propose 1:30-3:00 a.m. as a valid 90-minute slot.
        - Treat the window as two hours long.
        - Book anything.
      side_effects: {external_writes: none}
    local_time_checks:
      - {local: "2027-03-14T02:30", time_zone: America/New_York, expect: nonexistent}
      - {instant: "2027-03-14T06:30:00Z", time_zone: America/New_York, expected_local: "2027-03-14T01:30", expected_weekday: Sunday, expected_utc_offset: "-05:00"}
      - {instant: "2027-03-14T07:30:00Z", time_zone: America/New_York, expected_local: "2027-03-14T03:30", expected_utc_offset: "-04:00"}
      - {instant: "2027-03-14T06:30:00Z", time_zone: Asia/Jerusalem, expected_local: "2027-03-14T08:30", expected_utc_offset: "+02:00"}
      - {instant: "2027-03-15T12:00:00Z", time_zone: Asia/Jerusalem, expected_local: "2027-03-15T14:00", expected_weekday: Monday}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-14T00:00:00-05:00", end: "2027-03-15T00:00:00-04:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2027-03-14T01:30:00-05:00", "2027-03-14T03:30:00-04:00"]]}
        int_yossi:
          time_zone: Asia/Jerusalem
          working_hours: {time_zone: Asia/Jerusalem, days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 90, attendees: [candidate, int_yossi]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2027-03-14T01:30:00-05:00", note: Ends 4:00 a.m. EDT - past the candidate's 3:30 a.m. EDT end.}

  - id: INF-048
    title: Calendar lookup failed for part of the range - report incomplete coverage, not infeasibility
    category: infeasible_and_limits
    subcategory: partial_lookup_failure
    description: >-
      For a two-person panel, one panelist's calendar was retrieved for Tuesday-Wednesday (no common time) but the
      lookup failed for Thursday-Friday. The other panelist is free those mornings. The agent must say Tuesday and
      Wednesday do not work, that Thursday and Friday are unknown, and offer to retry or obtain supplied availability.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [partial_lookup_failure, coverage_gap, search_incomplete, norway]
    requirement_refs: [EC-055, AVL-04, SCH-04, ACT-12]
    inputs:
