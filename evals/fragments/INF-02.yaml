        1-2. The first option after the window is Thursday, December 3, 10:00-11:00 SGT, valid only if Desmond Ong
        waives the SLA. Do not book until the waiver is recorded and the recruiter confirms.
      must:
        - Confirm that the round-1 pass is recorded by an authorized interviewer, so round 2 may be scheduled.
        - State that no round-2 slot exists by Wednesday, December 2 because Mei is out of office.
        - Present Thursday, December 3 (from 10:00 SGT) only as conditional on Desmond Ong waiving the SLA.
      must_not:
        - Book Thursday, December 3 before the SLA waiver and confirmation.
        - Substitute another interviewer for Mei without authorization.
        - Schedule any later round.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-01T00:00:00+08:00", end: "2026-12-03T00:00:00+08:00"}
      participants:
        candidate:
          time_zone: Asia/Singapore
          available: [["2026-12-01T10:00:00+08:00", "2026-12-01T17:00:00+08:00"], ["2026-12-02T10:00:00+08:00", "2026-12-02T17:00:00+08:00"], ["2026-12-03T10:00:00+08:00", "2026-12-03T17:00:00+08:00"]]
        int_mei:
          time_zone: Asia/Singapore
          working_hours: {time_zone: Asia/Singapore, start: "09:00", end: "18:00"}
