  - id: INF-036
    title: Candidate's daily interviewing limit conflicts with a same-day superday rule
    category: infeasible_and_limits
    subcategory: accommodation_vs_plan_rule
    description: >-
      The candidate has an approved accommodation limiting interviewing to 120 minutes per day (reason restricted).
      The superday plan requires three 60-minute sessions on the same day. Both are hard rules, so no compliant
      schedule exists. The agent must not drop the accommodation or reveal its reason; it should route a split-day
      exception to the plan owner and present a two-day schedule as conditional.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [superday, virtual_loop]
    tags: [accommodation, restricted_reason, hard_rule_conflict, plan_owner_exception, canada]
    requirement_refs: [EC-069, CON-04, COM-01, EC-099]
    inputs:
      now: "2026-12-07T09:00:00-05:00"
      recruiter: {id: rec_mohammed, name: Mohammed Haddad, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Eleanor Wright
        time_zone: America/Toronto
        availability:
          - {start: "2026-12-17T09:00:00-05:00", end: "2026-12-17T17:00:00-05:00"}
          - {start: "2026-12-18T09:00:00-05:00", end: "2026-12-18T17:00:00-05:00"}
        accommodations:
          - {constraint: Maximum 120 minutes of interviewing per calendar day, reason: restricted - HR Accessibility only, approved_by: HR Accessibility team}
      interview_plan:
        name: Contoso Canada Graduate Analyst - superday
        owner: Talent Programs Lead Gloria Chen
        sessions:
          - {id: S1, title: Analytics case, format: virtual, duration_min: 60, interviewers: [int_raj2]}
          - {id: S2, title: Technical, format: virtual, duration_min: 60, interviewers: [int_emma]}
          - {id: S3, title: Behavioral, format: virtual, duration_min: 60, interviewers: [int_olu]}
        rules: {same_day: true, break_between_sessions_min: 15, order: any}
      interviewers:
        - {id: int_raj2, name: Raj Patel, time_zone: America/Toronto, availability_source: calendar, calendar: []}
        - {id: int_emma, name: Emma Lefebvre, time_zone: America/Toronto, availability_source: calendar, calendar: []}
        - {id: int_olu, name: Olu Adeleke, time_zone: America/Toronto, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Eleanor's superday - she's free Thu 17 and Fri 18 Dec. Usual format, all three on one day.
    expected:
      disposition: escalate
      secondary_dispositions: [report_infeasible]
      solution_summary: >-
        No compliant schedule - three 60-minute sessions on one day exceed Eleanor's approved 120-minute daily limit.
        Ask Gloria Chen to approve splitting the superday; a conditional two-day option is two sessions on Thursday,
        December 17, 2026 (e.g. 9:00-10:00 and 10:15-11:15 a.m. EST) and one on Friday, December 18 (e.g. 9:00-10:00
        a.m. EST). Keep the accommodation reason restricted.
      must:
        - Explain that the same-day rule and the 120-minute daily limit cannot both be met.
        - Route a split-day exception request to Gloria Chen and present the two-day option only as conditional.
        - Refer to the limit only as an approved scheduling constraint without stating or guessing the reason.
      must_not:
        - Schedule all three sessions on one day.
        - Drop or shorten a session silently.
        - Reveal or speculate about the accommodation's reason to interviewers or in any message.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-17T00:00:00-05:00", end: "2026-12-19T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/Toronto
          available: [["2026-12-17T09:00:00-05:00", "2026-12-17T17:00:00-05:00"], ["2026-12-18T09:00:00-05:00", "2026-12-18T17:00:00-05:00"]]
        int_raj2: {time_zone: America/Toronto}
        int_emma: {time_zone: America/Toronto}
        int_olu: {time_zone: America/Toronto}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_raj2]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_emma]}
        - {id: S3, duration_min: 60, attendees: [candidate, int_olu]}
      constraints:
        min_gap_min: 15
        max_total_span_min: 120
        same_local_day: {time_zone: America/Toronto}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-17T09:00:00-05:00", S2: "2026-12-17T10:15:00-05:00", S3: "2026-12-17T11:30:00-05:00", note: 180 minutes of interviewing in one day.}
        - {S1: "2026-12-17T09:00:00-05:00", S2: "2026-12-17T10:15:00-05:00", S3: "2026-12-18T09:00:00-05:00", note: Split day needs plan-owner approval.}
    grading_notes: The 120-minute daily limit is modeled conservatively as a 120-minute total span; with three 60-minute sessions both models are infeasible.

  - id: INF-037
    title: Four-hour maximum on-site span cannot cover interviewers spread across the day
    category: infeasible_and_limits
    subcategory: max_total_span
    description: >-
      Four 45-minute interviews must fit inside a 4-hour candidate day. The interviewers' supplied windows are spread
      from 08:00 to 15:30, so any complete schedule spans at least 7 hours 15 minutes. The agent must prove the span
      violation and suggest a specific availability ask that would make a 4-hour schedule possible.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [in_person_loop]
    tags: [max_total_span, supplied_availability, australia_west, targeted_ask]
    requirement_refs: [CON-04, SCH-05, CRD-02]
    inputs:
      now: "2026-12-08T09:00:00+08:00"
      recruiter: {id: rec_jessica, name: Jessica Lee, time_zone: Australia/Perth}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ryan Walsh
        time_zone: Australia/Perth
        availability:
          - {start: "2026-12-14T08:00:00+08:00", end: "2026-12-14T17:00:00+08:00"}
      interview_plan:
        name: Woodgrove Perth Mine Planning Engineer - onsite loop
        venue: "Woodgrove Perth office, Level 8, 50 Example Terrace"
        sessions:
          - {id: A, title: Geology, format: in_person, duration_min: 45, interviewers: [int_ahmed]}
          - {id: B, title: Scheduling, format: in_person, duration_min: 45, interviewers: [int_bella]}
          - {id: C, title: Safety, format: in_person, duration_min: 45, interviewers: [int_chen]}
          - {id: D, title: Hiring manager, format: in_person, duration_min: 45, interviewers: [int_dev]}
        rules: {same_day: true, order: any, break_between_sessions_min: 15, max_candidate_day_min: 240}
      interviewers:
        - {id: int_ahmed, name: Ahmed Karimi, time_zone: Australia/Perth, availability_source: supplied, supplied_availability: [{start: "2026-12-14T08:00:00+08:00", end: "2026-12-14T08:45:00+08:00"}]}
        - {id: int_bella, name: Bella Novak, time_zone: Australia/Perth, availability_source: supplied, supplied_availability: [{start: "2026-12-14T10:00:00+08:00", end: "2026-12-14T12:00:00+08:00"}]}
        - {id: int_chen, name: Chen Jing, time_zone: Australia/Perth, availability_source: supplied, supplied_availability: [{start: "2026-12-14T13:00:00+08:00", end: "2026-12-14T14:00:00+08:00"}]}
        - {id: int_dev, name: Dev Malhotra, time_zone: Australia/Perth, availability_source: supplied, supplied_availability: [{start: "2026-12-14T14:30:00+08:00", end: "2026-12-14T15:30:00+08:00"}]}
      conversation:
        - role: recruiter
          text: Ryan's onsite is Monday 14 Dec. Here's everyone's availability. Keep his day to 4 hours max as usual.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Infeasible on Monday, December 14, 2026 - Ahmed is free only 08:00-08:45 AWST and Dev only from 14:30, so any
        complete schedule spans at least 7 hours 15 minutes versus the 4-hour maximum. Targeted ask - if Ahmed could do
        12:15-13:00 AWST, the loop fits in exactly 4 hours (Bella 11:15, Ahmed 12:15, Chen 13:15, Dev 14:30).
      must:
        - Show that the minimum possible span exceeds 240 minutes because of Ahmed's 08:00 window and Dev's 14:30 window.
        - Give the recruiter a specific ask (e.g., Ahmed at 12:15-13:00 AWST) and show the resulting 4-hour schedule.
