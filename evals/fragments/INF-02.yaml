        int_weiming: {time_zone: Asia/Singapore, available: [["2026-12-08T19:30:00+08:00", "2026-12-08T20:30:00+08:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_weiming]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-08T19:30:00+08:00"}
      invalid_examples:
