  - id: INF-033
    title: Candidate's time zone is unknown - ask, because the answer flips feasibility
    category: infeasible_and_limits
    subcategory: missing_zone_not_infeasible
    description: >-
      The candidate writes "Monday 7 Dec 9-11am works" with an Australian (+61) mobile number in the signature but no
      city or zone. Read as London time it fits the interviewer; read as any Australian zone it is Sunday night or
      early Monday in London and does not fit. The agent must ask for the zone rather than assume either and declare a
      fit or an infeasibility.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [missing_time_zone, ambiguous_location, australia, missing_vs_infeasible]
    requirement_refs: [INT-05, EC-001, GS-002, SCH-04]
    inputs:
      now: "2026-12-01T10:00:00+00:00"
      recruiter: {id: rec_imogen, name: Imogen Hart, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jack Thompson
        availability_text: "Monday 7 Dec 9-11am works for me."
        signature: "Jack Thompson | Mobile: +61 4 5550 1234"
      interview_plan:
        name: Proseware Mining Analytics Consultant - interview
        sessions:
          - {id: S1, title: Analytics interview, format: virtual, duration_min: 60, interviewers: [int_sophie]}
      interviewers:
        - id: int_sophie
          name: Sophie Turner
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar: []
      conversation:
        - role: candidate
          channel: email
          text: "Hi Imogen, Monday 7 Dec 9-11am works for me. Cheers, Jack Thompson | Mobile: +61 4 5550 1234"
        - role: recruiter
          text: Can Sophie do Jack's time on Monday?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask Jack which city or time zone "9-11am" refers to. If it is London time, Monday, December 7, 2026 09:00-10:00
        GMT would work with Sophie; if it is Australian time (the +61 number suggests Australia, which has several
        zones), 9-11am is Sunday night or early Monday in London and outside Sophie's hours, so new windows would be
        needed.
      must:
        - Ask for Jack's city or time zone before proposing anything.
        - Explain that the answer changes feasibility (London time fits; any Australian zone does not).
        - Note that a +61 number does not identify a single Australian zone.
      must_not:
        - Assume London time and propose 09:00 GMT as confirmed.
        - Declare the request infeasible based on an assumed Australian zone.
        - Book anything.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate_time_zone]
    local_time_checks:
      - {instant: "2026-12-06T22:00:00Z", time_zone: Australia/Sydney, expected_local: "2026-12-07T09:00", expected_weekday: Monday, expected_utc_offset: "+11:00"}
      - {instant: "2026-12-06T22:00:00Z", time_zone: Europe/London, expected_local: "2026-12-06T22:00", expected_weekday: Sunday}
      - {instant: "2026-12-07T01:00:00Z", time_zone: Australia/Perth, expected_local: "2026-12-07T09:00", expected_utc_offset: "+08:00"}

  - id: INF-034
    title: Earlier turn wrongly said nothing fits - correct it when the recruiter pushes back with facts
    category: infeasible_and_limits
    subcategory: false_infeasibility_correction
    description: >-
      In a previous turn the agent claimed no time works, citing a quarter-hour start rule that does not exist. The
      recruiter points out the facts - the candidate is free 15:50-16:50 and the interviewer is free after 15:50. The
      only valid 60-minute slot is exactly 15:50-16:50. The agent must correct its own earlier answer rather than
      defending it.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [false_infeasibility, self_correction, odd_minute_boundary, argentina]
    requirement_refs: [SCH-08, EVL-06, EC-024, EC-120]
    inputs:
      now: "2026-12-02T10:00:00-03:00"
      recruiter: {id: rec_martina, name: Martina Gomez, time_zone: America/Argentina/Buenos_Aires}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lina Sosa
        time_zone: America/Argentina/Buenos_Aires
        availability:
          - {start: "2026-12-03T15:50:00-03:00", end: "2026-12-03T16:50:00-03:00"}
      interview_plan:
        name: Litware Argentina Business Analyst - interview
        sessions:
          - {id: S1, title: Business analysis interview, format: virtual, duration_min: 60, interviewers: [int_tomas]}
      interviewers:
        - id: int_tomas
          name: Tomas Herrera
          time_zone: America/Argentina/Buenos_Aires
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-12-03T15:00:00-03:00", end: "2026-12-03T15:50:00-03:00", status: busy}
      policies:
        start_alignment: none
      conversation:
        - role: recruiter
          at: "2026-12-02T09:40:00-03:00"
          text: Lina can do Thursday 15:50 to 16:50. Can Tomas do an hour?
        - role: agent
          at: "2026-12-02T09:41:00-03:00"
          text: There's no time on Thursday that works - Tomas is in a meeting until 15:50 and interviews have to start on the quarter hour.
        - role: recruiter
          at: "2026-12-02T09:59:00-03:00"
          text: Are you sure? We don't have a quarter-hour rule. Lina is 15:50-16:50 and Tomas is free right after 15:50.
    expected:
      disposition: propose_options
      solution_summary: >-
        Correct the earlier answer - Thursday, December 3, 2026, 15:50-16:50 ART fits exactly (Tomas's meeting ends at
        15:50; no alignment policy applies). Ask whether to book it.
      must:
        - Acknowledge that the earlier "no time works" answer was wrong because no quarter-hour rule applies.
        - Propose 15:50-16:50 ART on Thursday, December 3 as the only valid slot.
        - Ask whether to book.
      must_not:
        - Repeat the claim that nothing fits or invent a quarter-hour policy.
        - Propose 16:00-17:00, which runs past Lina's 16:50 limit.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T00:00:00-03:00", end: "2026-12-04T00:00:00-03:00"}
      participants:
        candidate: {time_zone: America/Argentina/Buenos_Aires, available: [["2026-12-03T15:50:00-03:00", "2026-12-03T16:50:00-03:00"]]}
        int_tomas:
          time_zone: America/Argentina/Buenos_Aires
          working_hours: {time_zone: America/Argentina/Buenos_Aires, start: "09:00", end: "18:00"}
          busy: [["2026-12-03T15:00:00-03:00", "2026-12-03T15:50:00-03:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_tomas]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-03T15:50:00-03:00"}
      invalid_examples:
        - {S1: "2026-12-03T16:00:00-03:00", note: Runs past Lina's 16:50 limit.}
        - {S1: "2026-12-03T15:45:00-03:00", note: Tomas busy until 15:50.}
      valid_start_bounds:
        S1: {earliest: "2026-12-03T15:50:00-03:00", latest: "2026-12-03T15:50:00-03:00"}

  - id: INF-035
    title: Only overlap has "unknown" free/busy status - neither free nor proven busy
    category: infeasible_and_limits
    subcategory: unknown_status_only_overlap
    description: >-
      The interviewer's free/busy lookup returns "unknown" for exactly the candidate's only window (a sync problem).
      Unknown is never free, so no slot can be confirmed, but infeasibility is not proven either. The agent should
      say availability is unknown and ask the recruiter to confirm the interviewer's availability for that window.
