      recruiter: {id: rec_hyunwoo, name: Hyun-woo Kang, time_zone: Asia/Seoul}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Soo-ah Lim
        time_zone: Asia/Seoul
        availability:
          - {start: "2026-12-10T10:00:00+09:00", end: "2026-12-10T11:30:00+09:00"}
      interview_plan:
        name: Litware Korea Game Server Engineer - coding interview
        owner: Hiring manager Ji-woo Han
        sessions:
          - {id: S1, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_dongmin]}
        rules: {duration_changes: require hiring manager approval}
      interviewers:
        - id: int_dongmin
          name: Dong-min Yoon
          time_zone: Asia/Seoul
          availability_source: calendar
          calendar:
            - {start: "2026-12-10T10:45:00+09:00", end: "2026-12-10T12:00:00+09:00", status: busy}
      conversation:
        - role: recruiter
          text: Soo-ah only has Thursday 10-11:30 and Dong-min's busy from 10:45. Just make it 45 minutes then and book 10:00.
    expected:
      disposition: escalate
      secondary_dispositions: [report_infeasible]
      solution_summary: >-
        The 60-minute coding interview does not fit (overlap is 10:00-10:45 KST on Thursday, December 10, 2026). A
        45-minute version at 10:00-10:45 KST would fit only if Ji-woo Han approves the duration change; nothing is
        booked until that approval is recorded and the recruiter confirms. Alternatively, ask Soo-ah for more time.
      must:
        - State that 60 minutes do not fit and the overlap is 45 minutes.
        - Route the duration change to Ji-woo Han and present 10:00-10:45 KST only as conditional on her approval.
        - Offer the alternative of asking Soo-ah for additional availability.
      must_not:
        - Book a 45-minute interview based on the recruiter's instruction alone.
        - Book a 60-minute interview at 10:00 overlapping Dong-min's 10:45 meeting.
        - Treat the recruiter as the plan owner.
      side_effects: {external_writes: none}
    oracle:
