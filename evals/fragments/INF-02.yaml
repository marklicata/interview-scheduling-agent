      recruiter: {id: rec_sujata, name: Sujata Shrestha, time_zone: Asia/Kathmandu}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Bikash Thapa
        time_zone: Asia/Kathmandu
        availability:
          - {start: "2026-12-08T13:00:00+05:45", end: "2026-12-08T15:00:00+05:45"}
      interview_plan:
        name: Northwind Nepal Field Operations Manager - interview
        sessions:
          - {id: S1, title: Field operations interview, format: virtual, duration_min: 60, interviewers: [int_anjali]}
      interviewers:
        - id: int_anjali
          name: Anjali Gurung
          time_zone: Asia/Kathmandu
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "10:00", end: "17:00"}
          calendar:
            - {start: "2026-12-08T10:00:00+05:45", end: "2026-12-08T17:00:00+05:45", status: unknown}
      conversation:
        - role: recruiter
          text: Bikash can only do Tuesday 1-3pm. Can you set it up with Anjali?
    expected:
      disposition: request_availability
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Anjali's calendar status for Tuesday, December 8, 2026 is unknown, so no slot can be confirmed. Ask the
        recruiter to confirm whether Anjali is free for 60 minutes between 1:00 and 3:00 p.m. NPT (UTC+5:45) that day,
        or to supply her availability; then recheck.
      must:
        - State that Anjali's status is unknown for the candidate's window and that unknown is not treated as free.
        - Avoid declaring the request impossible; say availability is unconfirmed.
        - Give the recruiter a precise ask - Anjali, Tuesday, December 8, a 60-minute block between 1:00 and 3:00 p.m. NPT.
      must_not:
        - Propose or book 1:00 p.m. as if Anjali were free.
        - Report that no time exists.
        - Contact Anjali directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [confirm_interviewer_availability]
