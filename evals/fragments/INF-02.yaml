  - id: INF-038
    title: Required campus transfer time leaves no room for two in-person interviews
    category: infeasible_and_limits
    subcategory: travel_transition_time
    description: >-
      Two in-person interviews are in buildings on different campuses with a 30-minute shuttle transfer. The
      candidate has two hours. 60 + 30 + 60 = 150 minutes, so no valid schedule exists even though the interviewers
      are free and back-to-back would fit the window.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [in_person_loop]
    tags: [transition_time, multi_site, in_person, austria]
    requirement_refs: [EC-042, CON-04, SCH-05]
    inputs:
      now: "2026-12-08T09:00:00+01:00"
      recruiter: {id: rec_florian, name: Florian Huber, time_zone: Europe/Vienna}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Elena Popescu
        time_zone: Europe/Vienna
        availability:
          - {start: "2026-12-10T10:00:00+01:00", end: "2026-12-10T12:00:00+01:00"}
      interview_plan:
        name: Fabrikam Biotech Lab Manager - onsite interviews
        owner: Hiring manager Katharina Gruber
        sessions:
          - {id: S1, title: Lab practical discussion, format: in_person, duration_min: 60, interviewers: [int_markus], venue: "Campus North, Building A, Example Gasse 1"}
          - {id: S2, title: Hiring manager interview, format: in_person, duration_min: 60, interviewers: [int_katharina], venue: "Campus South, Building F, Example Ring 40"}
        rules: {same_day: true, order: any, transition_between_campuses_min: 30}
      interviewers:
        - {id: int_markus, name: Markus Steiner, time_zone: Europe/Vienna, availability_source: calendar, calendar: []}
        - {id: int_katharina, name: Katharina Gruber, time_zone: Europe/Vienna, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Elena has 10-12 on Thursday. Lab interview at North and HM at South. Can we do both?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        Infeasible on Thursday, December 10, 2026 - two 60-minute interviews plus the 30-minute campus transfer need
        150 minutes, but Elena has 120 (10:00-12:00 CET). Next steps - ask Elena for 30 more minutes (to 12:30), or ask
        Katharina Gruber whether both interviews can be held on one campus or one can be virtual.
      must:
        - Account for the 30-minute transfer between campuses and show 150 minutes needed versus 120 available.
        - Offer next steps - extend to 12:30 CET, another day, or a plan-owner decision on location or format.
      must_not:
        - Propose 10:00-11:00 at North and 11:00-12:00 at South with no transfer time.
        - Switch a session to virtual without the plan owner's approval.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T00:00:00+01:00", end: "2026-12-11T00:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Vienna, available: [["2026-12-10T10:00:00+01:00", "2026-12-10T12:00:00+01:00"]]}
        int_markus: {time_zone: Europe/Vienna}
        int_katharina: {time_zone: Europe/Vienna}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_markus]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_katharina]}
      constraints:
        min_gap_min: 30
        same_local_day: {time_zone: Europe/Vienna}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-10T10:00:00+01:00", S2: "2026-12-10T11:00:00+01:00", note: No time to transfer between campuses.}
    grading_notes: The 30-minute campus transfer is modeled as a minimum gap.

  - id: INF-039
    title: Round 2 cannot meet the pass-to-next-round SLA because its interviewer is away
    category: infeasible_and_limits
    subcategory: gated_round_sla_infeasible
    description: >-
