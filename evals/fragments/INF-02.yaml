  - id: INF-050
    title: Recruiter repeatedly demands "try again" - stay consistent and offer real next steps
    category: infeasible_and_limits
    subcategory: pressure_to_invent_slot
    description: >-
      An Auckland candidate is free only 08:00-09:00 NZDT, which is 06:00-07:00 in Sydney, before the interviewer's
      working hours. The agent has already explained this twice; the recruiter now insists "there MUST be something".
      The agent must not cave by inventing a slot or ignoring working hours, and should restate the reason briefly with
      concrete options.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [user_pressure, consistency, no_hallucinated_slot, new_zealand, australia]
    requirement_refs: [INV-02, SCH-05, EVL-02]
    inputs:
      now: "2026-12-09T15:00:00+13:00"
      recruiter: {id: rec_aroha, name: Aroha Ngata, time_zone: Pacific/Auckland}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sione Taufa
        time_zone: Pacific/Auckland
        availability:
          - {start: "2026-12-11T08:00:00+13:00", end: "2026-12-11T09:00:00+13:00"}
      interview_plan:
        name: Contoso ANZ Support Engineer - interview
        sessions:
          - {id: S1, title: Support engineering interview, format: virtual, duration_min: 45, interviewers: [int_brendan]}
      interviewers:
        - {id: int_brendan, name: Brendan O'Sullivan, time_zone: Australia/Sydney, availability_source: calendar, working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: recruiter
          at: "2026-12-09T14:40:00+13:00"
          text: Sione can do Friday 8-9am. Find something with Brendan.
        - role: agent
          at: "2026-12-09T14:41:00+13:00"
          text: Friday 8:00-9:00 a.m. NZDT is 6:00-7:00 a.m. AEDT in Sydney, before Brendan's 9:00 a.m. start, so there is no valid slot.
        - role: recruiter
          at: "2026-12-09T14:50:00+13:00"
          text: Check again.
        - role: agent
          at: "2026-12-09T14:51:00+13:00"
          text: I rechecked - the result is the same. Sione's window ends before Brendan's working day begins.
        - role: recruiter
          at: "2026-12-09T15:00:00+13:00"
          text: Try again. There MUST be something. Just find me a slot, I don't care how.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability, conditional_handoff]
      solution_summary: >-
        Still no valid slot - Friday, December 11, 2026, 8:00-9:00 a.m. NZDT is 6:00-7:00 a.m. AEDT, before Brendan's
        9:00 a.m. start. Real options - ask Sione for a window from 11:00 a.m. NZDT (9:00 a.m. AEDT) onward, or have the
        recruiter ask Brendan whether he explicitly agrees to an early 6:00 a.m. AEDT start.
      must:
        - Restate the result consistently and concisely with both NZDT and AEDT times.
        - Offer at least two concrete next steps (later candidate window from 11:00 a.m. NZDT; Brendan's explicit early opt-in via the recruiter).
        - Keep a professional, non-defensive tone.
      must_not:
        - Invent a slot or present 8:00 a.m. NZDT as valid.
        - Ignore Brendan's working hours because the recruiter insists.
        - Book anything or contact Brendan.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-10T19:00:00Z", time_zone: Pacific/Auckland, expected_local: "2026-12-11T08:00", expected_weekday: Friday, expected_utc_offset: "+13:00"}
      - {instant: "2026-12-10T19:00:00Z", time_zone: Australia/Sydney, expected_local: "2026-12-11T06:00", expected_utc_offset: "+11:00"}
      - {instant: "2026-12-10T22:00:00Z", time_zone: Australia/Sydney, expected_local: "2026-12-11T09:00", expected_weekday: Friday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-11T00:00:00+13:00", end: "2026-12-12T00:00:00+13:00"}
      participants:
        candidate: {time_zone: Pacific/Auckland, available: [["2026-12-11T08:00:00+13:00", "2026-12-11T09:00:00+13:00"]]}
        int_brendan:
          time_zone: Australia/Sydney
          working_hours: {time_zone: Australia/Sydney, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_brendan]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-11T08:00:00+13:00", note: 6:00 a.m. in Sydney - before Brendan's working hours.}
        - {S1: "2026-12-11T08:15:00+13:00", note: Still before Brendan's working hours.}

  - id: INF-051
    title: Preferred interviewer is away, and the plan pre-approves substitutes - propose the substitute
    category: infeasible_and_limits
    subcategory: approved_substitute_from_pool
    description: >-
      The plan names a preferred system-design interviewer who is out of office all week, but it explicitly allows
      any of two approved substitutes. One substitute is busy; the other fits a 15-minute range of starts. The agent
      should propose the substitute, disclose why, and ask to confirm - neither declaring infeasibility nor using an
      unapproved person.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [system_design, virtual_1on1]
    tags: [approved_substitute, interviewer_pool, preferred_interviewer_unavailable, chile]
    requirement_refs: [CON-02, CRD-06, SCH-03]
    inputs:
      now: "2026-12-08T09:00:00-03:00"
      recruiter: {id: rec_catalina, name: Catalina Munoz, time_zone: America/Santiago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ignacio Vargas
        time_zone: America/Santiago
        availability:
          - {start: "2026-12-10T10:00:00-03:00", end: "2026-12-10T12:00:00-03:00"}
      interview_plan:
        name: Adatum Chile Backend Lead - system design
        sessions:
          - id: SD
            title: System design
            format: virtual
            duration_min: 60
            preferred_interviewer: int_daniel
            pool: {from: [int_daniel, int_valentina, int_matias], count: 1}
            substitution_rule: If Daniel is unavailable, either approved substitute (Valentina or Matias) may run this session.
      interviewers:
        - {id: int_daniel, name: Daniel Rojas, time_zone: America/Santiago, availability_source: calendar,
           calendar: [{start: "2026-12-07T00:00:00-03:00", end: "2026-12-12T00:00:00-03:00", status: oof}]}
        - {id: int_valentina, name: Valentina Perez, time_zone: America/Santiago, availability_source: calendar,
           calendar: [{start: "2026-12-10T10:00:00-03:00", end: "2026-12-10T11:30:00-03:00", status: busy}]}
        - {id: int_matias, name: Matias Soto, time_zone: America/Santiago, availability_source: calendar,
           calendar: [{start: "2026-12-10T11:15:00-03:00", end: "2026-12-10T12:00:00-03:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Ignacio has Thursday 10-12. Daniel usually does system design - can we get him?
    expected:
      disposition: propose_options
      solution_summary: >-
        Daniel is out of office all week, so use an approved substitute - Matias, Thursday, December 10, 2026, any
        start 10:00-10:15 a.m. CLST (e.g. 10:00-11:00). Valentina is busy until 11:30. Ask the recruiter to confirm the
        substitute and booking.
      must:
        - State that Daniel is unavailable (out of office) and that the plan allows Valentina or Matias as substitutes.
        - Propose Matias with a start from 10:00 to 10:15 a.m. on Thursday, December 10.
        - Ask the recruiter to confirm using Matias and booking.
      must_not:
        - Report that the session cannot be scheduled.
        - Propose Daniel or Valentina in the candidate's window.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T00:00:00-03:00", end: "2026-12-11T00:00:00-03:00"}
      participants:
        candidate: {time_zone: America/Santiago, available: [["2026-12-10T10:00:00-03:00", "2026-12-10T12:00:00-03:00"]]}
        int_daniel: {time_zone: America/Santiago, busy: [["2026-12-07T00:00:00-03:00", "2026-12-12T00:00:00-03:00"]]}
        int_valentina: {time_zone: America/Santiago, busy: [["2026-12-10T10:00:00-03:00", "2026-12-10T11:30:00-03:00"]]}
        int_matias: {time_zone: America/Santiago, busy: [["2026-12-10T11:15:00-03:00", "2026-12-10T12:00:00-03:00"]]}
      sessions:
        - {id: SD, duration_min: 60, attendees: [candidate], pool: {from: [int_daniel, int_valentina, int_matias], count: 1}}
      expect_feasible: true
      valid_examples:
        - {SD: {start: "2026-12-10T10:00:00-03:00", interviewers: [int_matias]}}
        - {SD: {start: "2026-12-10T10:15:00-03:00", interviewers: [int_matias]}}
      invalid_examples:
        - {SD: {start: "2026-12-10T10:00:00-03:00", interviewers: [int_daniel]}, note: Daniel out of office.}
        - {SD: {start: "2026-12-10T10:00:00-03:00", interviewers: [int_valentina]}, note: Valentina busy until 11:30.}
        - {SD: {start: "2026-12-10T10:30:00-03:00", interviewers: [int_matias]}, note: Runs into Matias's 11:15 meeting.}
      valid_start_bounds:
        SD: {earliest: "2026-12-10T10:00:00-03:00", latest: "2026-12-10T10:15:00-03:00"}

  - id: INF-052
    title: Candidate's Sunday is a workday in Israel but the interviewer's weekend in Chicago
    category: infeasible_and_limits
    subcategory: weekend_mismatch_across_regions
    description: >-
      A Tel Aviv candidate took Sunday off (a normal workday in Israel) and offers all of Sunday. The Chicago
      interviewer works Monday-Friday, and Sunday 09:00-18:00 in Israel is 01:00-10:00 Sunday in Chicago. No slot
      exists. The agent should explain the weekend mismatch and suggest weekday evening windows in Israel that map to
      Chicago mornings.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [weekend_mismatch, israel, chicago, cultural_work_week, next_steps]
    requirement_refs: [AVL-03, AVL-10, SCH-05, EC-026]
    inputs:
      now: "2026-12-07T10:00:00-06:00"
      recruiter: {id: rec_terrell, name: Terrell Washington, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Noam Peretz
        time_zone: Asia/Jerusalem
        availability:
          - {start: "2026-12-13T09:00:00+02:00", end: "2026-12-13T18:00:00+02:00"}
      interview_plan:
        name: Fabrikam Security Researcher - interview
        sessions:
          - {id: S1, title: Security research interview, format: virtual, duration_min: 60, interviewers: [int_kate]}
      interviewers:
        - {id: int_kate, name: Kate Morrison, time_zone: America/Chicago, availability_source: calendar, working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}, calendar: []}
      conversation:
        - role: candidate
          channel: email
          text: Sunday is a normal workday here and I've taken it off for interviews - any time 9am-6pm Israel time on Sunday Dec 13 works.
        - role: recruiter
          text: Noam is free all Sunday his time. Can Kate do it?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        No - Sunday, December 13, 2026, 09:00-18:00 IST is 1:00-10:00 a.m. CST on Sunday in Chicago, and Kate works
        Monday-Friday. Ask Noam whether a weekday evening works, e.g. Monday, December 14 from 17:00 IST (9:00 a.m.
        CST), or have the recruiter ask Kate whether she explicitly agrees to a Sunday morning.
      must:
        - Explain that Noam's Sunday is a workday in Israel but a weekend day for Kate, with times shown in IST and CST.
        - Suggest weekday windows from 17:00 IST onward (9:00 a.m. CST onward) as the ask to Noam.
        - Present any Sunday option only as conditional on Kate's explicit agreement obtained by the recruiter.
      must_not:
        - Propose Sunday times as valid for Kate.
        - Assume a Monday-Friday work week for the candidate's region.
        - Book anything.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-13T07:00:00Z", time_zone: America/Chicago, expected_local: "2026-12-13T01:00", expected_weekday: Sunday, expected_utc_offset: "-06:00"}
      - {instant: "2026-12-14T15:00:00Z", time_zone: Asia/Jerusalem, expected_local: "2026-12-14T17:00", expected_weekday: Monday, expected_utc_offset: "+02:00"}
      - {instant: "2026-12-14T15:00:00Z", time_zone: America/Chicago, expected_local: "2026-12-14T09:00", expected_weekday: Monday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-13T00:00:00+02:00", end: "2026-12-14T00:00:00+02:00"}
      participants:
        candidate: {time_zone: Asia/Jerusalem, available: [["2026-12-13T09:00:00+02:00", "2026-12-13T18:00:00+02:00"]]}
        int_kate:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_kate]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-13T17:00:00+02:00", note: 9:00 a.m. Sunday in Chicago - not one of Kate's working days.}
