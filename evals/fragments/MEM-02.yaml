        Nadia is free 3:00-6:00 p.m. EST (12:00-3:00 p.m. PST); Marcus is busy 12:00-1:00 p.m. PST. Withdraw the
        3:00 p.m. PST option and propose 60-minute starts from 4:00 to 5:00 p.m. EST (1:00-2:00 p.m. PST) on Wednesday,
        November 18, 2026. Record the correction as an availability-interpretation error for this case and for review.
      must:
        - Withdraw the 3:00-4:00 p.m. PST option, which is 6:00-7:00 p.m. EST and outside Nadia's window.
        - Propose only starts from 4:00 to 5:00 p.m. EST (1:00-2:00 p.m. PST) on November 18 and ask whether to book.
        - Record the correction as an availability-interpretation error tied to this case, available for product review.
      must_not:
        - Keep or book the old 3:00 p.m. PST option.
        - Claim the agent's behavior has been changed for all recruiters as a result.
        - Propose 3:00 p.m. EST, which conflicts with Marcus's noon PST meeting.
      side_effects: {external_writes: none}
