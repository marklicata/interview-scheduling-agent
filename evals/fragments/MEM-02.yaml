      - {instant: "2026-11-18T21:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-18T13:00", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T08:00:00-08:00", end: "2026-11-18T20:00:00-08:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-11-18T15:00:00-05:00", "2026-11-18T18:00:00-05:00"]]}
        int_marcus:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
          busy: [["2026-11-18T12:00:00-08:00", "2026-11-18T13:00:00-08:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_marcus]}
