      conversation:
        - role: candidate
          at: "2026-11-13T10:00:00-05:00"
          channel: email
          text: Wednesday after 3 works, until about 6.
        - role: agent
          at: "2026-11-13T09:00:00-08:00"
          text: Option - Wednesday, November 18, 3:00-4:00 p.m. PST with Marcus. Want me to book it?
        - role: recruiter
          at: "2026-11-16T08:58:00-08:00"
          text: She meant 3 Eastern - she's in New York. Fix it.
    expected:
