          availability_source: calendar
          calendar:
            - {start: "2026-11-24T13:00:00-08:00", end: "2026-11-24T13:30:00-08:00", status: busy}
      case_state:
        memory:
          entries:
            - {id: mem_thread_maya_7400, owner: rec_maya, scope: "case:REQ-7400/Hye-jin Kang (Maya's thread summary)", created_at: "2026-11-18T16:00:00-08:00", source: agent summary of Maya's chat, content: "Candidate free Wed Nov 25 10:00 a.m.-12:00 p.m. PST; proposed Wed 10:00-11:00."}
            - {id: mem_case_7400_update, owner: case_team, scope: "case:REQ-7400/Hye-jin Kang", access: [rec_maya, coord_lin], created_at: "2026-11-21T11:00:00-08:00", source: "candidate email of November 21, recorded by coord_lin", content: "Wednesday no longer works; available Tue Nov 24 1:00-3:00 p.m. PST."}
      conversation:
