    description: >-
      Tom's saved preference says to substitute the hiring manager's deputy when she is busy. This plan requires the
      hiring manager herself and allows no substitutes. The recruiter asks to use the deputy so the candidate can go
      Monday. The plan wins; the agent proposes the hiring manager's Tuesday window and explains that the preference
      does not apply to this plan.
