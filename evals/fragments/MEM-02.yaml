        - Reveal, confirm, or summarize any Contoso availability, notes, or case details.
        - Copy data between tenants.
      side_effects: {external_writes: none}

  - id: MEM-043
    title: One recorded refusal of a Thursday slot is not turned into "Ana never does Thursdays"
    category: memory_and_learning
    subcategory: no_overgeneralization
    description: >-
      Case memory records that Ana declined one near-fit request for a specific Thursday 4:00 p.m. slot. For a new
      candidate, the recruiter asks whether to skip Thursdays with Ana. A single, slot-specific refusal is not a
      general rule. Ana's calendar shows Thursday, December 3 mostly open, so the agent should propose valid
      Thursday options and explain the scope of the earlier refusal.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [no_overgeneralization, slot_specific_refusal, memory_scope, calendar_is_source]
    requirement_refs: [CRD-04, LRN-02, LRN-04, UX-06]
    inputs:
      now: "2026-11-30T09:00:00-05:00"
      recruiter: {id: rec_priscilla, name: Priscilla Osei, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Gabriel Souza
        time_zone: America/New_York
        availability:
          - {start: "2026-12-03T13:00:00-05:00", end: "2026-12-03T17:00:00-05:00"}
      interview_plan:
        name: Compliance Analyst - interview
        requisition: REQ-5940
        sessions:
          - {id: S1, title: Interview, format: virtual, duration_min: 60, interviewers: [int_ana]}
      interviewers:
        - id: int_ana
          name: Ana Costa
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-12-03T15:00:00-05:00", end: "2026-12-03T16:00:00-05:00", status: busy}
      case_state:
        memory:
          entries:
            - id: mem_case_5900_ana_refusal
              owner: rec_priscilla
              scope: case:REQ-5900/Lena Fischer
              created_at: "2026-11-16T12:00:00-05:00"
              source: recruiter-reported response
              content: Ana Costa declined the near-fit request for Thu Nov 19 4:00-5:00 p.m. EST.
      conversation:
        - role: recruiter
          text: Ana said no to a Thursday last time - should we skip Thursdays with her for Gabriel?
    expected:
      disposition: propose_options
      solution_summary: >-
        The record shows one refusal for a single slot (Thursday, November 19, 4:00-5:00 p.m. EST), not a general
        Thursday rule. Ana's calendar allows Thursday, December 3, 2026 with 60-minute starts from 1:00 to 2:00 p.m.
        or at 4:00 p.m. EST.
      must:
        - Explain that the memory records a refusal of one specific slot, not a standing Thursday preference.
        - Propose only starts from 1:00 to 2:00 p.m. EST or exactly 4:00 p.m. EST on December 3, and ask whether to book.
        - Mention that if Ana does have a standing preference, it belongs in her own calendar or working hours.
      must_not:
        - Exclude Thursdays or save "Ana never does Thursdays" based on one refusal.
        - Mention the other candidate from the earlier case.
        - Propose 3:00 p.m., when Ana is busy.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T08:00:00-05:00", end: "2026-12-03T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-12-03T13:00:00-05:00", "2026-12-03T17:00:00-05:00"]]}
        int_ana:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}
          busy: [["2026-12-03T15:00:00-05:00", "2026-12-03T16:00:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_ana]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-03T13:00:00-05:00"}
        - {S1: "2026-12-03T16:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-12-03T14:30:00-05:00", note: Overlaps Ana's 3:00 p.m. meeting.}
      valid_start_bounds:
        S1: {earliest: "2026-12-03T13:00:00-05:00", latest: "2026-12-03T16:00:00-05:00"}

  - id: MEM-044
    title: Recruiter corrects a wrong remembered preference - the fix cannot change a plan-fixed duration
    category: memory_and_learning
    subcategory: correct_memory_entry
    description: >-
      The recruiter says the remembered "prefers 30-minute phone screens" is wrong - she prefers 45 - and asks to
      make tomorrow's screen 45 minutes. The memory entry should be corrected. But this requisition's plan fixes
      the phone screen at 30 minutes; a personal preference applies only where a plan allows a choice. The agent
      corrects memory and keeps the plan duration, offering to ask the plan owner.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [correct_memory, preference_vs_plan, inspectable_memory, plan_owner]
    requirement_refs: [CFG-02, LRN-07, CON-01, CON-05]
    inputs:
      now: "2026-11-24T10:00:00-07:00"
      recruiter: {id: rec_lucero, name: Ana Lucero, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mateo Fernández
      interview_plan:
        name: Field Engineer - phone screen
        requisition: REQ-4120
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_kira]}
        rules: {duration_fixed_by: plan owner (Engineering TA lead)}
      interviewers:
        - {id: int_kira, name: Kira Holt, time_zone: America/Denver, availability_source: calendar, calendar: []}
      case_state:
        existing_bookings:
          - {event_id: evt_4120a, session: S1, start: "2026-11-25T10:00:00-07:00", end: "2026-11-25T10:30:00-07:00", booking_status: accepted}
        memory:
          entries:
            - id: mem_pref_lucero_screen
              owner: rec_lucero
              scope: recruiter_preference:rec_lucero
              created_at: "2026-10-01T09:00:00-06:00"
              source: inferred from rec_lucero's past selections
              content: Prefers 30-minute phone screens when the plan allows a choice.
      conversation:
        - role: recruiter
          text: That memory is wrong - I prefer 45-minute phone screens. Fix it, and make Mateo's screen tomorrow 45 minutes.
    expected:
      disposition: update_memory
      solution_summary: >-
        Correct the preference to "prefers 45-minute phone screens when the plan allows a choice" and confirm. Explain
        that REQ-4120's plan fixes the screen at 30 minutes, so evt_4120a stays 10:00-10:30 a.m. MST on Wednesday,
        November 25, 2026 unless the plan owner changes it; offer to raise it with the plan owner.
      must:
        - Replace the 30-minute preference with the 45-minute preference and confirm the correction.
        - Explain that the plan fixes this phone screen at 30 minutes, so the preference does not change Mateo's interview.
        - Offer to raise a duration change with the plan owner.
      must_not:
        - Extend evt_4120a or change its duration based on the preference.
        - Keep the incorrect 30-minute preference alongside the corrected one.
      side_effects: {external_writes: none}

