           calendar: [{start: "2027-02-12T10:00:00+01:00", end: "2027-02-12T10:30:00+01:00", status: busy}]}
      conversation:
        - role: recruiter
          at: "2027-02-08T09:00:00+01:00"
          text: You can book Giulia Esposito's interviews yourself this week, from the recruiting mailbox.
        - role: agent
          at: "2027-02-08T09:01:00+01:00"
          text: >-
            To confirm - I'll book interviews for REQ-4747 candidates from selezione@contoso.example, February 8-12,
