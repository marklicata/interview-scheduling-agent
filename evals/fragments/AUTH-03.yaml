        mode: autonomous_grant_active
        grant:
          route: chat
          granted_by: rec_matteo
          granted_at: "2027-02-08T09:02:00+01:00"
          scope:
            case: REQ-4747 - all candidates (as restated by the agent)
            actions: [book]
            date_range: {start: "2027-02-08T00:00:00+01:00", end: "2027-02-13T00:00:00+01:00"}
            organizer: selezione@contoso.example
          expires: "2027-02-13T00:00:00+01:00"
          status: active
      candidate:
        id: candidate
        name: Paolo Ricci
        time_zone: Europe/Rome
        availability:
          - {start: "2027-02-12T10:00:00+01:00", end: "2027-02-12T12:00:00+01:00"}
      interview_plan:
        name: Industrial Designer - interview
