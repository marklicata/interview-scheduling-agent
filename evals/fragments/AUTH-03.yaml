        int_chiarar: {time_zone: Europe/Rome, busy: [["2027-02-12T10:00:00+01:00", "2027-02-12T10:30:00+01:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_chiarar]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-02-12T10:30:00+01:00"}
      invalid_examples:
