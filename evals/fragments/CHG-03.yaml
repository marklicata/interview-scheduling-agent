          - {id: S2, title: Test leadership, format: virtual, duration_min: 60, interviewers: [int_sadia]}
      interviewers:
        - {id: int_sadia, name: Sadia Malik, time_zone: Asia/Karachi, availability_source: calendar}
      case_state:
        action_log:
          - {at: "2026-12-14T09:05:00+05:00", action: "update_event evt_ut_s2 from Tue 2026-12-15 11:00 to Wed 2026-12-16 11:00-12:00 PKT", trigger: candidate email 08:50, authority: active grant, result: success}
        existing_bookings:
          - {event_id: evt_ut_s2, session: S2, start: "2026-12-16T11:00:00+05:00", end: "2026-12-16T12:00:00+05:00", attendees: [{id: candidate, response: accepted, at: "2026-12-14T09:12:00+05:00"}, {id: int_sadia, response: accepted, at: "2026-12-14T09:14:00+05:00"}]}
      conversation:
        - role: candidate
          at: "2026-12-14T08:50:00+05:00"
          channel: email
          text: Could we move Tuesday's interview to Wednesday at 11am? Thanks, Usman
        - role: recruiter
          at: "2026-12-14T09:20:00+05:00"
          text: Usman also pinged me on Teams - he wants Tuesday's interview moved to Wednesday at 11. Can you do it?
    expected:
      disposition: acknowledge_and_record
      solution_summary: >-
        Already done: at 09:05 PKT evt_ut_s2 was moved to Wednesday, December 16, 2026, 11:00-12:00 PKT under the active
        grant, and both Usman and Sadia have accepted. No further change or invitation is needed.
      must:
        - Recognize the Teams request as the same change already executed at 09:05.
        - Report the current state of evt_ut_s2 including both acceptances.
      must_not:
        - Update or re-send the event, or create another invitation.
        - Tell the recruiter the change is still pending.
      side_effects: {external_writes: none}

  - id: CHG-077
