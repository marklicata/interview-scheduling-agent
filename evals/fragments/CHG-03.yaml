  - id: CHG-065
    title: Moving the conflicted session creates a gap over the 45-minute limit - the minimal valid repair moves two sessions
    category: changes_and_rescheduling
    subcategory: max_gap_cascade
    description: >-
      The third interviewer's new conflict leaves her free only before 10:30 or after 12:45. Simply moving S3 to
      12:45 leaves a two-hour idle gap, violating the team's 45-minute maximum. The minimal valid repair keeps S2,
      moves S1 to after S2 (start 11:15-11:30) and S3 to 12:45 or later; an alternative moves all three. The agent
      should find and recommend the two-move repair.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [max_gap, cascade, minimal_disruption, resequence, hong_kong]
    requirement_refs: [CHG-01, EC-044, SCH-03]
    inputs:
      now: "2027-03-01T09:00:00+08:00"
      recruiter: {id: rec_kelvin, name: Kelvin Lau, time_zone: Asia/Hong_Kong}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Chan Mei Ling
        time_zone: Asia/Hong_Kong
        availability:
          - {start: "2027-03-04T09:00:00+08:00", end: "2027-03-04T14:00:00+08:00"}
      interview_plan:
        name: Trade Finance Analyst - virtual loop
        sessions:
          - {id: S1, title: Trade documentation, format: virtual, duration_min: 45, interviewers: [int_alice]}
          - {id: S2, title: Risk scenario, format: virtual, duration_min: 45, interviewers: [int_brian]}
          - {id: S3, title: Team lead, format: virtual, duration_min: 45, interviewers: [int_cathy]}
        rules: {fixed_order: false, break_between_sessions_min: 10, max_gap_min: 45}
      interviewers:
        - id: int_alice
          name: Alice Wong
          time_zone: Asia/Hong_Kong
          availability_source: calendar
          calendar:
            - {start: "2027-03-04T13:00:00+08:00", end: "2027-03-04T17:00:00+08:00", status: busy}
        - {id: int_brian, name: Brian Ho, time_zone: Asia/Hong_Kong, availability_source: calendar, calendar: []}
        - id: int_cathy
          name: Cathy Leung
          time_zone: Asia/Hong_Kong
          availability_source: calendar
          calendar:
            - {start: "2027-03-04T10:30:00+08:00", end: "2027-03-04T12:45:00+08:00", status: busy, subject: Regulator call (new)}
      case_state:
        existing_bookings:
          - {event_id: evt_cm2_s1, session: S1, start: "2027-03-04T09:00:00+08:00", end: "2027-03-04T09:45:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_alice, response: accepted}]}
          - {event_id: evt_cm2_s2, session: S2, start: "2027-03-04T10:00:00+08:00", end: "2027-03-04T10:45:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_brian, response: accepted}]}
          - {event_id: evt_cm2_s3, session: S3, start: "2027-03-04T11:00:00+08:00", end: "2027-03-04T11:45:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_cathy, response: accepted}]}
      conversation:
        - role: recruiter
          text: Cathy has a regulator call over Mei Ling's 11am on Thursday. Just move hers to 12:45?
    expected:
      disposition: propose_options
      solution_summary: >-
        Moving only S3 to 12:45 leaves a 2-hour gap after S2 (limit 45 minutes). Recommended two-move repair on
        Thursday, March 4, 2027 (HKT): keep S2 10:00-10:45, move S1 (Alice) to start 11:15-11:30, and S3 (Cathy) to
        start at 12:45 or within 45 minutes of S1's end (e.g., S1 11:20-12:05, S3 12:45-13:30). Alternative moving all
        three: S3 9:00, S1 10:00, S2 11:00. Ask which to apply.
      must:
        - Explain that S3 alone at 12:45 breaks the 45-minute maximum gap.
        - Recommend the repair that keeps S2 and moves S1 (start 11:15-11:30) and S3 (12:45 or later, within the gap limit, ending by 2:00 p.m.).
        - Mention the all-three-move alternative as more disruptive.
        - Ask for confirmation before updating the two events.
      must_not:
        - Propose S3 at 12:45 with S1 and S2 unchanged.
        - Propose S3 between 10:30 and 12:45, or S1 after 1:00 p.m. (Alice busy).
        - Update anything without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-04T08:00:00+08:00", end: "2027-03-04T14:00:00+08:00"}
      participants:
        candidate: {time_zone: Asia/Hong_Kong, available: [["2027-03-04T09:00:00+08:00", "2027-03-04T14:00:00+08:00"]]}
        int_alice: {time_zone: Asia/Hong_Kong, busy: [["2027-03-04T13:00:00+08:00", "2027-03-04T17:00:00+08:00"]]}
        int_brian: {time_zone: Asia/Hong_Kong}
        int_cathy: {time_zone: Asia/Hong_Kong, busy: [["2027-03-04T10:30:00+08:00", "2027-03-04T12:45:00+08:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_alice]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_brian]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_cathy]}
      constraints:
        min_gap_min: 10
        max_gap_min: 45
      expect_feasible: true
      valid_examples:
        - {S2: "2027-03-04T10:00:00+08:00", S1: "2027-03-04T11:20:00+08:00", S3: "2027-03-04T12:45:00+08:00"}
        - {S3: "2027-03-04T09:00:00+08:00", S1: "2027-03-04T10:00:00+08:00", S2: "2027-03-04T11:00:00+08:00"}
      invalid_examples:
        - {S1: "2027-03-04T09:00:00+08:00", S2: "2027-03-04T10:00:00+08:00", S3: "2027-03-04T12:45:00+08:00", note: 120-minute gap after S2.}
        - {S2: "2027-03-04T10:00:00+08:00", S1: "2027-03-04T11:00:00+08:00", S3: "2027-03-04T12:45:00+08:00", note: 60-minute gap before S3.}

  - id: CHG-066
    title: Recruiter asks the agent to email two panelists to move their meetings - outreach is not an MVP capability
    category: changes_and_rescheduling
    subcategory: outreach_request_handoff
    description: >-
      The candidate's new window leaves no time when all four panelists are free. The recruiter asks the agent to
      email two panelists and ask them to move their meetings. Contacting or negotiating with interviewers is
      out of MVP scope. The agent should decline that part, confirm no complete fit exists, and give the recruiter
      precise instructions to make the ask themselves.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [outreach_not_supported, recruiter_handoff, near_fit, us_mountain]
    requirement_refs: [CRD-01, CRD-02, CRD-03]
    inputs:
      now: "2026-12-01T10:00:00-07:00"
      recruiter: {id: rec_marcus, name: Marcus Bell, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Isabella Ferreira
        time_zone: America/Denver
        availability:
          - {start: "2026-12-03T14:00:00-07:00", end: "2026-12-03T16:00:00-07:00"}
      interview_plan:
        name: Program Director - panel
        sessions:
          - {id: P1, title: Leadership panel, format: virtual, duration_min: 60, interviewers: [int_priya, int_tom, int_ursula, int_vic], all_required: true}
      interviewers:
        - id: int_priya
          name: Priya Kapoor
          time_zone: America/Denver
          availability_source: calendar
          calendar:
            - {start: "2026-12-03T14:00:00-07:00", end: "2026-12-03T15:00:00-07:00", status: busy}
        - id: int_tom
          name: Tom Haverford
          time_zone: America/Denver
          availability_source: calendar
          calendar:
            - {start: "2026-12-03T14:00:00-07:00", end: "2026-12-03T15:00:00-07:00", status: busy}
            - {start: "2026-12-03T15:30:00-07:00", end: "2026-12-03T16:30:00-07:00", status: busy}
        - {id: int_ursula, name: Ursula Kemp, time_zone: America/Denver, availability_source: calendar, calendar: []}
        - {id: int_vic, name: Vic Ramos, time_zone: America/Denver, availability_source: calendar, calendar: []}
      case_state:
        existing_bookings:
          - {event_id: evt_if_p1, session: P1, start: "2026-12-03T10:00:00-07:00", end: "2026-12-03T11:00:00-07:00", attendees: [{id: candidate, response: declined, comment: Only free 2-4 pm now}, {id: int_priya, response: accepted}, {id: int_tom, response: accepted}, {id: int_ursula, response: accepted}, {id: int_vic, response: accepted}]}
      conversation:
        - role: recruiter
          text: Can you email Priya and Tom and ask if they'd move their 2pm meetings on Thursday so we can do Isabella's panel at 2?
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        The agent can't contact interviewers in this version. No complete panel fits Isabella's 2:00-4:00 p.m. MST
        window on Thursday, December 3, 2026 (Priya and Tom are busy 2:00-3:00; Tom also 3:30-4:30). Give the recruiter
        the exact ask for Priya and Tom (2:00-3:00 p.m. MST, Thursday, December 3, 60 minutes, both currently busy) and
        offer to recheck and prepare the update of evt_if_p1 once they reply.
      must:
        - Say clearly that the agent does not email or negotiate with interviewers in this version.
        - Confirm that no 60-minute time inside 2:00-4:00 p.m. MST has all four panelists free.
        - Give precise recruiter instructions - who, date, 2:00-3:00 p.m. MST, duration, current busy status, and what to ask.
        - Offer to recheck all calendars and propose the update to evt_if_p1 after the recruiter reports back.
      must_not:
        - Send any message to Priya or Tom or claim to have asked them.
        - Treat a possible yes as agreement or update the panel now.
        - Reveal the subjects of Priya's or Tom's meetings to the candidate.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T08:00:00-07:00", end: "2026-12-03T18:00:00-07:00"}
      participants:
        candidate: {time_zone: America/Denver, available: [["2026-12-03T14:00:00-07:00", "2026-12-03T16:00:00-07:00"]]}
        int_priya: {time_zone: America/Denver, busy: [["2026-12-03T14:00:00-07:00", "2026-12-03T15:00:00-07:00"]]}
        int_tom: {time_zone: America/Denver, busy: [["2026-12-03T14:00:00-07:00", "2026-12-03T15:00:00-07:00"], ["2026-12-03T15:30:00-07:00", "2026-12-03T16:30:00-07:00"]]}
        int_ursula: {time_zone: America/Denver}
        int_vic: {time_zone: America/Denver}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_priya, int_tom, int_ursula, int_vic]}
      expect_feasible: false
      invalid_examples:
        - {P1: "2026-12-03T14:00:00-07:00", note: Priya and Tom are busy.}
        - {P1: "2026-12-03T15:00:00-07:00", note: Tom is busy from 3:30.}

  - id: CHG-067
    title: Confirmed reschedule plus a request to update EightFold - do the Outlook update, decline the publication
    category: changes_and_rescheduling
    subcategory: reschedule_with_publication_request
    description: >-
      The recruiter confirms a reviewed move and also asks the agent to update EightFold so the candidate portal
      shows the new time. Outlook rescheduling is in MVP scope; publishing to EightFold/ATS is later scope. The agent
      should execute exactly the confirmed Outlook update, clearly decline the publication part, and tell the
      recruiter what to update manually.
    difficulty: intermediate
    severity: high
    release_scope: mvp
