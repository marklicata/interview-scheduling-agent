  - id: CHG-059
    title: Candidate asks to move the final interview past the requisition's completion deadline
    category: changes_and_rescheduling
    subcategory: reschedule_beyond_deadline
    description: >-
      The plan requires all interviews to finish by the offer-committee date; exceptions belong to the hiring
      manager. The candidate prefers January 6 but also offers an afternoon before the deadline. The agent should
      propose the in-deadline option, present January 6 only as needing the hiring manager's exception, and avoid
      refusing the candidate or deciding the exception itself.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [deadline_policy, exception_owner, conditional_option, alaska]
    requirement_refs: [CHG-01, CON-07, ACT-01]
    inputs:
