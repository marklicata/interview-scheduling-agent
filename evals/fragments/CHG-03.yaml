      The candidate's new midday conflict hits S3, and S3's interviewer has no other Tuesday time inside the
      candidate's remaining windows. The plan requires all sessions on one day. Moving just S3 to Wednesday would
      split the loop. The valid repair moves all three sessions to Wednesday; the alternative is a same-day
      exception from the plan owner. The agent should explain this tradeoff instead of splitting silently.
