      expect_feasible: true
      valid_examples:
        - {S3: "2026-12-17T14:00:00-09:00"}
      invalid_examples:
        - {S3: "2026-12-17T13:00:00-09:00", note: Naomi is busy.}
      valid_start_bounds:
        S3: {earliest: "2026-12-17T14:00:00-09:00", latest: "2026-12-17T15:00:00-09:00"}
    grading_notes: The oracle covers only the in-deadline December 17 window; January 6 is a policy question, not a time question.

