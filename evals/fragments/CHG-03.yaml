          availability_source: calendar
          calendar:
            - {start: "2026-12-10T13:30:00+13:00", end: "2026-12-10T15:00:00+13:00", status: busy}
        - {id: int_ruby, name: Ruby Chen, time_zone: Pacific/Auckland, availability_source: calendar, calendar: []}
      case_state:
        existing_bookings:
          - {event_id: evt_jw_p1, session: P1, start: "2026-12-10T14:00:00+13:00", end: "2026-12-10T15:00:00+13:00", attendees: [{id: candidate, response: accepted}, {id: int_mere, response: accepted}, {id: int_tane, response: declined}, {id: int_hemi, response: declined}, {id: int_kiri, response: accepted}]}
      conversation:
