      recruiter: {id: rec_hina, name: Hina Qureshi, time_zone: Asia/Karachi}
      authority:
        mode: autonomous_grant_active
        grant:
          route: configuration
          granted_by: rec_hina
          scope:
            case: REQ-8840 / Usman Tariq
            actions: [book, reschedule]
            date_range: {start: "2026-12-07T00:00:00+05:00", end: "2026-12-24T00:00:00+05:00"}
            organizer: recruiting-pk@contoso.example
          expires: "2026-12-24T00:00:00+05:00"
      candidate:
        id: candidate
        name: Usman Tariq
        time_zone: Asia/Karachi
