  - id: CHG-068
    title: Move across Sydney's April fall-back - same local time, new offset, different day and hour in Los Angeles
    category: changes_and_rescheduling
    subcategory: dst_end_southern_hemisphere
    description: >-
      The original interview was 9:00 a.m. AEDT (UTC+11) on Thursday, April 1, 2027 - 3:00 p.m. Wednesday in Los
      Angeles. The Sydney candidate asks for "the same time" on Tuesday, April 6. Sydney falls back to AEST (UTC+10)
      on April 4, so 9:00 a.m. AEST is 4:00 p.m. Monday in Los Angeles. The interviewer is busy 3:00-3:30 p.m., so
      only starts 8:30-9:00 a.m. AEST fit. Labels, weekdays and the interviewer's local time must all be updated.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [dst_end, australia_sydney, us_pacific, date_line, zone_label_update]
    requirement_refs: [SCH-01, AVL-10, CHG-01]
    inputs:
      now: "2027-03-29T09:00:00-07:00"
      recruiter: {id: rec_nadia, name: Nadia Rahman, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Charlotte Evans
        time_zone: Australia/Sydney
        availability:
          - {start: "2027-04-06T08:00:00+10:00", end: "2027-04-06T11:00:00+10:00"}
      interview_plan:
        name: Developer Advocate - technical interview
        sessions:
          - {id: S1, title: Technical demo, format: virtual, duration_min: 60, interviewers: [int_devon]}
      interviewers:
        - id: int_devon
          name: Devon Price
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-04-05T15:00:00-07:00", end: "2027-04-05T15:30:00-07:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_ce_s1, session: S1, start: "2027-04-01T09:00:00+11:00", end: "2027-04-01T10:00:00+11:00", candidate_description_label: "9:00 a.m. AEDT", attendees: [{id: candidate, response: accepted}, {id: int_devon, response: accepted}]}
      conversation:
        - role: candidate
          at: "2027-03-30T08:00:00+11:00"
          channel: email
          text: Could we move to Tuesday 6 April, same time (9am my time)? I'm free 8-11am that morning.
        - role: recruiter
          text: Charlotte wants the same time next Tuesday. OK?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes: Tuesday, April 6, 2027, 9:00-10:00 a.m. AEST (UTC+10) = Monday, April 5, 4:00-5:00 p.m. PDT. Sydney leaves
        daylight time on April 4, so Devon's time moves from 3:00 to 4:00 p.m. and falls on Monday. Valid starts are
        8:30-9:00 a.m. AEST. Ask to update evt_ce_s1 and use the AEST label for the candidate.
      must:
        - Confirm 9:00-10:00 a.m. AEST on Tuesday, April 6 equals 4:00-5:00 p.m. PDT on Monday, April 5.
        - Explain that Sydney's offset changes from UTC+11 to UTC+10 on April 4, so the Los Angeles time differs from the original booking.
        - Show the interviewer's date as Monday, April 5, and use "AEST" (not "AEDT") in candidate-facing text.
        - Ask for confirmation before updating evt_ce_s1.
      must_not:
        - Propose 3:00 p.m. PDT or reuse the original UTC+11 offset.
        - Label the new time AEDT or show the interviewer's date as Tuesday.
        - Update anything without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-31T22:00:00Z", time_zone: Australia/Sydney, expected_local: "2027-04-01T09:00", expected_weekday: Thursday, expected_utc_offset: "+11:00"}
      - {instant: "2027-04-05T23:00:00Z", time_zone: Australia/Sydney, expected_local: "2027-04-06T09:00", expected_weekday: Tuesday, expected_utc_offset: "+10:00"}
      - {instant: "2027-04-05T23:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-04-05T16:00", expected_weekday: Monday, expected_utc_offset: "-07:00"}
      - {local: "2027-04-04T02:30", time_zone: Australia/Sydney, expect: ambiguous}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-04-06T06:00:00+10:00", end: "2027-04-06T14:00:00+10:00"}
      participants:
        candidate: {time_zone: Australia/Sydney, available: [["2027-04-06T08:00:00+10:00", "2027-04-06T11:00:00+10:00"]]}
        int_devon:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2027-04-05T15:00:00-07:00", "2027-04-05T15:30:00-07:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_devon]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-04-06T09:00:00+10:00"}
      invalid_examples:
        - {S1: "2027-04-06T08:00:00+10:00", note: 3:00 p.m. PDT - Devon is busy.}
        - {S1: "2027-04-06T09:30:00+10:00", note: Ends after Devon's 5:00 p.m. working hours.}
