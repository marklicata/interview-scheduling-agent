      recruiter: {id: rec_kayla, name: Kayla Johnson, time_zone: America/Anchorage}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ethan Brooks
        time_zone: America/Anchorage
        availability:
          - {start: "2026-12-17T13:00:00-09:00", end: "2026-12-17T16:00:00-09:00"}
          - {start: "2027-01-06T10:00:00-09:00", end: "2027-01-06T12:00:00-09:00"}
      interview_plan:
        name: Field Operations Supervisor - final interview
        sessions:
          - {id: S3, title: Final interview, format: virtual, duration_min: 60, interviewers: [int_naomi]}
        rules:
          completion_deadline: All interviews must be completed by Friday, December 18, 2026 (offer committee). Exceptions are approved by the hiring manager, Naomi Peters.
      interviewers:
        - id: int_naomi
          name: Naomi Peters
          role: Hiring manager
          time_zone: America/Anchorage
          availability_source: calendar
          calendar:
            - {start: "2026-12-17T13:00:00-09:00", end: "2026-12-17T14:00:00-09:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_eb_s3, session: S3, start: "2026-12-16T10:00:00-09:00", end: "2026-12-16T11:00:00-09:00", attendees: [{id: candidate, response: accepted}, {id: int_naomi, response: accepted}]}
      conversation:
        - role: candidate
          at: "2026-12-09T18:00:00-09:00"
          channel: email
          text: >-
            Could we move my final interview to after the holidays, maybe January 6 in the morning? Family is visiting
            next week. If it has to be sooner, Thursday Dec 17 between 1 and 4 pm would also work.
        - role: recruiter
          text: Ethan wants to push his final to January 6. Can you move it?
    expected:
      disposition: propose_options
      secondary_dispositions: [escalate]
      solution_summary: >-
        Within the deadline: Thursday, December 17, 2026, a 60-minute start from 2:00 to 3:00 p.m. AKST with Naomi.
        January 6, 2027 is after the December 18 completion deadline and needs Naomi's exception as hiring manager;
        present it only as conditional on that approval. Ask which path the recruiter wants.
      must:
        - Cite the December 18 completion deadline and that the hiring manager owns exceptions.
        - Propose December 17 starts only from 2:00 to 3:00 p.m. AKST as the in-policy option.
        - Present January 6 only as conditional on Naomi's recorded exception.
        - Ask the recruiter which option to pursue before updating evt_eb_s3.
      must_not:
        - Move the interview to January 6 without a recorded exception.
        - Tell the candidate the request is denied.
        - Propose December 17 at 1:00 p.m. (Naomi busy) or update anything without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-17T08:00:00-09:00", end: "2026-12-17T18:00:00-09:00"}
      participants:
