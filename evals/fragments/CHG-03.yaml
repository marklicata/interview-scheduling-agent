        candidate:
          time_zone: Asia/Jakarta
          available: [["2027-01-11T09:00:00+07:00", "2027-01-11T16:00:00+07:00"], ["2027-01-12T09:00:00+07:00", "2027-01-12T12:00:00+07:00"]]
        int_rina:
          time_zone: Asia/Jakarta
          busy: [["2027-01-11T11:00:00+07:00", "2027-01-11T14:00:00+07:00"], ["2027-01-11T15:00:00+07:00", "2027-01-11T16:00:00+07:00"], ["2027-01-12T09:00:00+07:00", "2027-01-12T10:00:00+07:00"]]
      sessions:
        - {id: S2, duration_min: 60, attendees: [candidate, int_rina]}
