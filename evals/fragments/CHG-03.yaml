          busy: [["2026-12-09T13:00:00-08:00", "2026-12-09T17:00:00-08:00"]]
        int_cole:
          time_zone: America/Vancouver
          working_hours: {time_zone: America/Vancouver, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-12-08T09:00:00-08:00", "2026-12-08T10:45:00-08:00"], ["2026-12-08T12:00:00-08:00", "2026-12-08T17:00:00-08:00"], ["2026-12-09T12:00:00-08:00", "2026-12-09T17:00:00-08:00"]]
