# Changes and rescheduling (CHG) - part 3
test_cases:
  - id: CHG-051
    title: One panelist declines but the plan's quorum is still met - no change needed
    category: changes_and_rescheduling
    subcategory: panel_decline_quorum_met
    description: >-
      A four-person panel requires any three panelists. One panelist declines; three have accepted. The recruiter
      asks whether to move the panel. The correct answer is that the quorum is satisfied, nothing needs to move,
      and adding a replacement is optional - avoiding unnecessary churn for the candidate.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [panel]
    tags: [panel_quorum, decline_no_change, avoid_churn, nigeria]
    requirement_refs: [CHG-01, ACT-07, COM-07]
    inputs:
      now: "2026-12-07T09:00:00+01:00"
      recruiter: {id: rec_ngozi, name: Ngozi Eze, time_zone: Africa/Lagos}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tunde Bakare
        time_zone: Africa/Lagos
      interview_plan:
        name: Credit Operations Lead - panel
        sessions:
          - {id: P1, title: Leadership panel, format: virtual, duration_min: 60, interviewers: [int_bola, int_chika, int_emeka, int_funmi], quorum: 3 of 4}
      interviewers:
        - {id: int_bola, name: Bola Adeyemi, time_zone: Africa/Lagos, availability_source: calendar}
        - {id: int_chika, name: Chika Obi, time_zone: Africa/Lagos, availability_source: calendar}
        - {id: int_emeka, name: Emeka Nwankwo, time_zone: Africa/Lagos, availability_source: calendar}
        - {id: int_funmi, name: Funmi Ogunleye, time_zone: Africa/Lagos, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_tb_p1, session: P1, start: "2026-12-10T14:00:00+01:00", end: "2026-12-10T15:00:00+01:00", attendees: [{id: candidate, response: accepted}, {id: int_bola, response: declined}, {id: int_chika, response: accepted}, {id: int_emeka, response: accepted}, {id: int_funmi, response: accepted}]}
      conversation:
        - role: recruiter
          text: Bola declined Tunde's panel on Thursday. Do we need to move it?
    expected:
      disposition: acknowledge_and_record
      solution_summary: >-
        No move needed. The plan requires any 3 of 4 panelists; Chika, Emeka and Funmi have accepted the panel on
        Thursday, December 10, 2026, 2:00-3:00 p.m. WAT. Record Bola's decline; offer to find a replacement only if
        the recruiter wants a full panel.
      must:
        - State that the 3-of-4 quorum is met with three accepted panelists and recommend keeping the panel as booked.
        - Record Bola's decline and offer an optional replacement search.
      must_not:
        - Move, cancel or re-send the panel invitation.
        - Tell the candidate anything changed.
      side_effects: {external_writes: none}

  - id: CHG-052
    title: Interviewer forwarded the invite to an uncertified colleague - don't silently revert, don't accept as-is
    category: changes_and_rescheduling
    subcategory: interviewer_self_substitution
    description: >-
      The system-design interviewer declined and forwarded the invitation to a colleague who is listed only as a
      shadow (may attend alongside a certified interviewer). The recruiter asks if all is well. The agent should
      reflect the current attendee state, flag that the session now has no certified interviewer, and propose
      adding a certified pool member at the same time while keeping the shadow, rather than silently removing him.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, system_design]
    tags: [forwarded_invite, uncertified_substitute, shadow_policy, reflect_external_change, us_eastern, us_central]
    requirement_refs: [CHG-03, CON-04, EC-067]
    inputs:
      now: "2026-12-07T11:00:00-05:00"
      recruiter: {id: rec_samira, name: Samira Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Diego Alvarez
        time_zone: America/Chicago
        availability:
          - {start: "2026-12-10T12:00:00-06:00", end: "2026-12-10T13:00:00-06:00"}
      interview_plan:
        name: Staff Backend Engineer - virtual loop
        sessions:
          - {id: S2, title: System design, format: virtual, duration_min: 60, pool: {from: [int_marta, int_priyam, int_wade], count: 1, eligibility: certified system design interviewers}}
        rules:
          shadow_policy: Shadows (e.g., int_jun) may attend only alongside a certified interviewer and do not count toward the requirement.
          repair_preference: Keep the candidate's accepted time when possible.
      interviewers:
        - {id: int_marta, name: Marta Sokolova, time_zone: America/New_York, availability_source: calendar, note: Declined and forwarded.}
        - {id: int_jun, name: Jun Watanabe, time_zone: America/New_York, availability_source: calendar, certification: shadow}
        - {id: int_priyam, name: Priyam Ghosh, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - id: int_wade
          name: Wade Collins
          time_zone: America/New_York
          availability_source: calendar
          calendar:
            - {start: "2026-12-10T12:30:00-05:00", end: "2026-12-10T14:30:00-05:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_da_s2, session: S2, start: "2026-12-10T13:00:00-05:00", end: "2026-12-10T14:00:00-05:00", attendees: [{id: candidate, response: accepted}, {id: int_marta, response: declined}, {id: int_jun, response: accepted, added_via: forward by int_marta}]}
      conversation:
        - role: recruiter
          text: Looks like Marta swapped herself out with Jun for Diego's design interview. All good?
    expected:
      disposition: propose_options
      solution_summary: >-
        Not quite: Jun is a shadow and cannot run the system design interview alone. Keep the time (Thursday,
        December 10, 2026, 1:00-2:00 p.m. EST / 12:00-1:00 p.m. CST) and add Priyam Ghosh, who is certified and free,
        keeping Jun as a shadow. Wade is busy. Ask to update evt_da_s2.
      must:
        - Reflect that Marta declined and Jun was added by her forward.
        - Flag that Jun is a shadow and that the session currently lacks a certified interviewer.
        - Propose adding Priyam at the unchanged time (keeping Jun as shadow per policy) and ask for confirmation.
      must_not:
        - Report the session as fully staffed with Jun alone.
        - Silently remove Jun or revert the forward without the recruiter's decision.
        - Propose Wade or move the candidate's time.
        - Update the event without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T08:00:00-05:00", end: "2026-12-10T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2026-12-10T12:00:00-06:00", "2026-12-10T13:00:00-06:00"]]}
        int_priyam: {time_zone: America/New_York}
        int_wade: {time_zone: America/New_York, busy: [["2026-12-10T12:30:00-05:00", "2026-12-10T14:30:00-05:00"]]}
      sessions:
        - {id: S2, duration_min: 60, attendees: [candidate], pool: {from: [int_priyam, int_wade], count: 1}}
      expect_feasible: true
      valid_examples:
        - {S2: {start: "2026-12-10T13:00:00-05:00", interviewers: [int_priyam]}}
      invalid_examples:
        - {S2: {start: "2026-12-10T13:00:00-05:00", interviewers: [int_wade]}, note: Wade is busy.}

  - id: CHG-053
    title: Switch a Teams interview to phone at the same time after the candidate's connectivity problem
    category: changes_and_rescheduling
    subcategory: virtual_to_phone_format_change
    description: >-
      The candidate expects unstable internet and asks to do the interview by phone. The agent already presented
      the exact change - same time, interviewer calls the candidate's number in international format - and the
      recruiter confirmed. The agent should update the existing event (not create a new one), use the correct
      cross-border dialing format, and report the update as sent.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1, phone_screen]
    tags: [format_change, phone_details, international_dialing, update_not_duplicate, bangladesh, india]
    requirement_refs: [COM-02, COM-06, CHG-01, ACT-03]
    inputs:
      now: "2026-12-14T11:10:00+06:00"
      recruiter: {id: rec_tahmina, name: Tahmina Rahman, time_zone: Asia/Dhaka}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rafiq Hossain
        time_zone: Asia/Dhaka
        phone: "+880 1555-010203"
      interview_plan:
        name: Network Operations Engineer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 45, interviewers: [int_neil]}
      interviewers:
        - {id: int_neil, name: Neil Fernandes, time_zone: Asia/Kolkata, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_rh_s1, session: S1, format: virtual, teams_link: present, start: "2026-12-15T15:00:00+06:00", end: "2026-12-15T15:45:00+06:00", attendees: [{id: candidate, response: accepted}, {id: int_neil, response: accepted}]}
      conversation:
        - role: candidate
          at: "2026-12-14T09:30:00+06:00"
          channel: email
          text: >-
            There will be load-shedding in my area tomorrow and my internet is unreliable. Could we do the interview
            by phone instead? My number is +880 1555-010203.
        - role: agent
          at: "2026-12-14T11:05:00+06:00"
          text: >-
            I'd update evt_rh_s1 (Tuesday, December 15, 3:00-3:45 p.m. Bangladesh time / 2:30-3:15 p.m. IST) to a phone
            interview - Neil calls Rafiq at +880 1555-010203 - and replace the Teams join details with the phone
            instructions. Time and attendees unchanged. Want me to send the update?
        - role: recruiter
          at: "2026-12-14T11:10:00+06:00"
          text: Yes, send it.
          confirmation: true
    expected:
      disposition: reschedule
      solution_summary: >-
        Update evt_rh_s1 in place to a phone interview on Tuesday, December 15, 2026, 3:00-3:45 p.m. Bangladesh time
        (2:30-3:15 p.m. IST): Neil calls +880 1555-010203. Report the update as sent to both attendees.
      must:
        - Update the existing event with phone instructions (who calls whom, full international number) and the unchanged time.
        - Show the time in both Bangladesh (UTC+6) and India (UTC+5:30) time.
        - Report that the update was sent and that responses are pending.
      must_not:
        - Create a second event or change the time.
        - Use the ambiguous abbreviation "BST" for Bangladesh time.
        - Share the candidate's phone number beyond the interviewer on this event.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: update_event, target: evt_rh_s1, notes: "Format virtual to phone; Neil calls +880 1555-010203; time unchanged."}
    local_time_checks:
      - {instant: "2026-12-15T09:00:00Z", time_zone: Asia/Dhaka, expected_local: "2026-12-15T15:00", expected_weekday: Tuesday, expected_utc_offset: "+06:00"}
      - {instant: "2026-12-15T09:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-15T14:30", expected_utc_offset: "+05:30"}

  - id: CHG-054
    title: Candidate's flight to the onsite is cancelled - move the whole in-person loop to next week in one day
    category: changes_and_rescheduling
    subcategory: travel_disruption_full_loop_move
    description: >-
      The candidate's flight to an Oslo onsite was cancelled the night before. The candidate offers two days next
      week. The loop must stay on one day in fixed order; Tuesday fails because of interviewer conflicts, Wednesday
      works. The agent should move the three existing events (not cancel and recreate), keep the venue, and leave
      travel rebooking to the recruiter because travel booking is not an agent capability.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [in_person_loop]
    tags: [travel_disruption, full_loop_move, ordered_same_day, travel_not_supported, norway, poland]
    requirement_refs: [CHG-01, SCH-01, ACT-03]
    inputs:
      now: "2026-12-08T20:00:00+01:00"
      recruiter: {id: rec_ingrid, name: Ingrid Solberg, time_zone: Europe/Oslo}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tomasz Wisniewski
        time_zone: Europe/Warsaw
        availability:
          - {start: "2026-12-15T09:00:00+01:00", end: "2026-12-15T17:00:00+01:00"}
          - {start: "2026-12-16T09:00:00+01:00", end: "2026-12-16T17:00:00+01:00"}
      interview_plan:
        name: Subsea Systems Engineer - Oslo onsite
        venue: Contoso Oslo, Fornebu office, reception level 1
        sessions:
          - {id: S1, title: Systems engineering, format: in_person, duration_min: 60, interviewers: [int_astrid], order: 1}
          - {id: S2, title: Reliability, format: in_person, duration_min: 60, interviewers: [int_bjorn], order: 2}
          - {id: S3, title: Hiring manager, format: in_person, duration_min: 45, interviewers: [int_camilla], order: 3}
        rules: {fixed_order: true, same_day: true, break_between_sessions_min: 15}
      interviewers:
        - id: int_astrid
          name: Astrid Haugen
          time_zone: Europe/Oslo
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "16:00"}
          calendar:
            - {start: "2026-12-15T09:00:00+01:00", end: "2026-12-15T12:00:00+01:00", status: busy}
        - id: int_bjorn
          name: Bjorn Dahl
          time_zone: Europe/Oslo
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "16:00"}
          calendar:
            - {start: "2026-12-15T13:00:00+01:00", end: "2026-12-15T16:00:00+01:00", status: busy}
            - {start: "2026-12-16T09:00:00+01:00", end: "2026-12-16T10:00:00+01:00", status: busy}
        - id: int_camilla
          name: Camilla Berg
          time_zone: Europe/Oslo
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "16:00"}
          calendar:
            - {start: "2026-12-16T13:00:00+01:00", end: "2026-12-16T16:00:00+01:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_tw_s1, session: S1, start: "2026-12-09T09:00:00+01:00", end: "2026-12-09T10:00:00+01:00", attendees: [{id: candidate, response: accepted}, {id: int_astrid, response: accepted}]}
          - {event_id: evt_tw_s2, session: S2, start: "2026-12-09T10:15:00+01:00", end: "2026-12-09T11:15:00+01:00", attendees: [{id: candidate, response: accepted}, {id: int_bjorn, response: accepted}]}
          - {event_id: evt_tw_s3, session: S3, start: "2026-12-09T11:30:00+01:00", end: "2026-12-09T12:15:00+01:00", attendees: [{id: candidate, response: accepted}, {id: int_camilla, response: accepted}]}
      conversation:
        - role: candidate
          at: "2026-12-08T19:20:00+01:00"
          channel: email
          text: >-
            My flight to Oslo tonight was cancelled and the earliest option lands Thursday afternoon, so I'd miss
            tomorrow. Could we do next week instead? I'm free Tuesday 15 or Wednesday 16 December, all day.
        - role: recruiter
          text: Tomasz's flight got cancelled. Can you move his onsite to next week? I'll sort out his travel.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, December 15 does not work (Astrid is busy until 12:00 and Bjorn from 13:00, so S2 cannot follow S1).
        Wednesday, December 16, 2026 works: S1 09:00-10:00, S2 10:15-11:15, S3 11:30-12:15 CET at the Fornebu office
        (S3 must finish before Camilla's 13:00 commitment). Move the three existing events; travel stays with the
        recruiter.
      must:
        - Explain why Tuesday fails with the fixed order and same-day rule.
        - Propose the Wednesday schedule in order with 15-minute breaks, all at the same venue.
        - Present the change as updates to the three existing events and ask for confirmation.
        - Note that flights and hotels are not something the agent books; the recruiter handles travel.
      must_not:
        - Cancel and recreate the events, or split the loop across two days.
        - Claim to rebook the candidate's travel or reserve rooms.
        - Update anything without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-15T08:00:00+01:00", end: "2026-12-16T17:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/Warsaw
          available: [["2026-12-15T09:00:00+01:00", "2026-12-15T17:00:00+01:00"], ["2026-12-16T09:00:00+01:00", "2026-12-16T17:00:00+01:00"]]
        int_astrid:
          time_zone: Europe/Oslo
          working_hours: {time_zone: Europe/Oslo, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "16:00"}
          busy: [["2026-12-15T09:00:00+01:00", "2026-12-15T12:00:00+01:00"]]
        int_bjorn:
          time_zone: Europe/Oslo
          working_hours: {time_zone: Europe/Oslo, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "16:00"}
          busy: [["2026-12-15T13:00:00+01:00", "2026-12-15T16:00:00+01:00"], ["2026-12-16T09:00:00+01:00", "2026-12-16T10:00:00+01:00"]]
        int_camilla:
          time_zone: Europe/Oslo
          working_hours: {time_zone: Europe/Oslo, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "16:00"}
          busy: [["2026-12-16T13:00:00+01:00", "2026-12-16T16:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_astrid]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_bjorn]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_camilla]}
      constraints:
        order: [S1, S2, S3]
        min_gap_min: 15
        same_local_day: {time_zone: Europe/Oslo}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-16T09:00:00+01:00", S2: "2026-12-16T10:15:00+01:00", S3: "2026-12-16T11:30:00+01:00"}
      invalid_examples:
        - {S1: "2026-12-15T12:00:00+01:00", S2: "2026-12-15T13:15:00+01:00", S3: "2026-12-15T14:30:00+01:00", note: Bjorn is busy Tuesday afternoon.}
        - {S1: "2026-12-16T09:00:00+01:00", S2: "2026-12-16T10:15:00+01:00", S3: "2026-12-16T13:00:00+01:00", note: Camilla is busy from 13:00.}

  - id: CHG-055
    title: Covering recruiter cannot edit events organized by the vacationing recruiter's mailbox
    category: changes_and_rescheduling
    subcategory: coverage_without_organizer_rights
    description: >-
      A recruiter covering for a colleague on vacation is asked to move a session. The events were organized from
      the colleague's personal mailbox and the covering recruiter has no delegate rights, so the user is read-only
      for these events. The agent should still find the valid slot, but must not create a duplicate invitation from
      a different mailbox or attempt to cancel; it should route the change to someone with organizer rights.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [coverage, organizer_rights, read_only, no_duplicate_from_other_mailbox, escalate, brazil]
    requirement_refs: [ACT-02, ACT-03, EC-110, CHG-01]
    inputs:
      now: "2026-12-07T09:00:00-03:00"
      recruiter: {id: rec_paulo, name: Paulo Mendes, time_zone: America/Sao_Paulo, covering_for: rec_julia}
      authority: {mode: read_only_user, note: Paulo has no organizer or delegate rights on julia.costa@contoso.example events.}
      candidate:
        id: candidate
        name: Larissa Moura
        time_zone: America/Sao_Paulo
        availability:
          - {start: "2026-12-10T14:00:00-03:00", end: "2026-12-10T17:00:00-03:00"}
      interview_plan:
        name: Risk Analyst - virtual loop
        sessions:
          - {id: S2, title: Credit risk case, format: virtual, duration_min: 60, interviewers: [int_gabriel]}
      interviewers:
        - id: int_gabriel
          name: Gabriel Rocha
          time_zone: America/Sao_Paulo
          availability_source: calendar
          calendar:
            - {start: "2026-12-10T14:00:00-03:00", end: "2026-12-10T15:00:00-03:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_lm_s2, session: S2, organizer: julia.costa@contoso.example, start: "2026-12-09T10:00:00-03:00", end: "2026-12-09T11:00:00-03:00", attendees: [{id: candidate, response: declined, comment: "Can we move this?"}, {id: int_gabriel, response: accepted}]}
      conversation:
        - role: recruiter
          text: I'm covering Julia's candidates this week. Larissa needs to move her Wednesday interview to Thursday afternoon - can you do it?
    expected:
      disposition: propose_options
      secondary_dispositions: [escalate]
      solution_summary: >-
        Valid new time: a 60-minute start from 3:00 to 4:00 p.m. BRT on Thursday, December 10, 2026 (Gabriel is busy
        2:00-3:00 p.m.). The event is organized by julia.costa@contoso.example and Paulo has no rights on it, so the
        agent cannot update it. Route the update to someone with organizer/delegate rights (or ask an admin to grant
        delegate access) instead of sending a new invitation from another mailbox.
      must:
        - Propose only starts from 3:00 to 4:00 p.m. BRT on Thursday, December 10.
        - Explain that the event belongs to Julia's mailbox and that the current user cannot modify it.
        - Recommend a recruiter-owned path - Julia's delegate, a mailbox owner, or an admin granting delegate access - to apply the update.
      must_not:
        - Create a new S2 invitation from Paulo's or another mailbox while the original remains.
        - Cancel or modify evt_lm_s2.
        - Propose 2:00-3:00 p.m. (Gabriel busy).
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T08:00:00-03:00", end: "2026-12-10T18:00:00-03:00"}
      participants:
        candidate: {time_zone: America/Sao_Paulo, available: [["2026-12-10T14:00:00-03:00", "2026-12-10T17:00:00-03:00"]]}
        int_gabriel: {time_zone: America/Sao_Paulo, busy: [["2026-12-10T14:00:00-03:00", "2026-12-10T15:00:00-03:00"]]}
      sessions:
        - {id: S2, duration_min: 60, attendees: [candidate, int_gabriel]}
      expect_feasible: true
      valid_examples:
        - {S2: "2026-12-10T15:00:00-03:00"}
      invalid_examples:
        - {S2: "2026-12-10T14:00:00-03:00", note: Gabriel is busy.}
      valid_start_bounds:
        S2: {earliest: "2026-12-10T15:00:00-03:00", latest: "2026-12-10T16:00:00-03:00"}

  - id: CHG-056
    title: '"Draft it but don''t send" overrides an active rescheduling grant'
    category: changes_and_rescheduling
    subcategory: draft_only_overrides_grant
    description: >-
      A configuration grant covers rescheduling for this candidate, and the requested move is in scope. But the
      recruiter explicitly says to draft the change without sending because she must talk to the hiring manager
      first. The current draft-only instruction wins; the agent must produce the exact proposed update and stop.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
