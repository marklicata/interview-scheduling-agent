      participants:
        candidate: {time_zone: Etc/GMT-8, available: [["2026-12-10T09:00:00+08:00", "2026-12-10T11:00:00+08:00"]]}
        int_olivia:
          time_zone: Australia/Sydney
          working_hours: {time_zone: Australia/Sydney, start: "09:00", end: "17:00"}
          busy: [["2026-12-10T12:00:00+11:00", "2026-12-10T12:30:00+11:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_olivia]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-10T09:30:00+08:00"}
      invalid_examples:
        - {S1: "2026-12-10T09:00:00+08:00", note: Olivia is busy.}
      valid_start_bounds:
        S1: {earliest: "2026-12-10T09:30:00+08:00", latest: "2026-12-10T10:00:00+08:00"}

  - id: TZ-044
    title: Candidate writes "UTC+11 (Sydney)" for a date after Sydney has returned to UTC+10
    category: cross_timezone
    subcategory: offset_label_conflict
    description: >-
      On Tuesday, April 6, 2027 Sydney is on AEST (UTC+10). The candidate, copying her March signature, writes "10:00-12:00
      UTC+11 (Sydney)". The offset and the city disagree by an hour. With the Tokyo interviewer free 10:00-11:30 a.m. JST,
      the Sydney-local reading allows 45-minute starts at 10:00-10:15 a.m. JST, while the literal UTC+11 reading has no
      overlap at all. The agent must surface the conflict and ask, not silently pick one.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [offset_label_conflict, sydney, tokyo, australia_dst_end, stale_signature]
    requirement_refs: [INT-03, INT-05, EC-002, EC-019]
    inputs:
      now: "2027-03-30T09:00:00+09:00"
      recruiter: {id: rec_yui, name: Yui Nakamura, time_zone: Asia/Tokyo}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Charlotte Nguyen-Baker
        time_zone: Australia/Sydney
        time_zone_raw: UTC+11 (Sydney)
        availability_raw: Tue 6 Apr 10:00-12:00 UTC+11 (Sydney)
      interview_plan:
        name: Robotics Engineer - interview with Tokyo lead
        sessions:
          - {id: S1, title: Robotics interview, format: virtual, duration_min: 45, interviewers: [int_kaito]}
      interviewers:
        - id: int_kaito
          name: Kaito Morishita
          time_zone: Asia/Tokyo
          availability_source: supplied
          supplied_availability:
            - {start: "2027-04-06T10:00:00+09:00", end: "2027-04-06T11:30:00+09:00"}
      conversation:
        - role: candidate
          channel: email
          text: Tuesday 6 April works, 10:00-12:00 UTC+11 (Sydney).
        - role: recruiter
          text: Kaito has 10-11:30 Tokyo time that day. Please set it up.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [offset_vs_city_conflict]
      solution_summary: >-
        Sydney is UTC+10 on April 6, 2027. If the candidate means Sydney time, 10:00-12:00 AEST = 9:00-11:00 a.m. JST and a
        45-minute start at 11:00-11:15 a.m. AEST (10:00-10:15 a.m. JST) works. If she literally means UTC+11, her window is
        8:00-10:00 a.m. JST and nothing fits. Ask which she means.
      must:
        - Point out that Sydney returns to UTC+10 on April 4, 2027, so "UTC+11 (Sydney)" is self-contradictory for April 6.
        - Give both readings in JST and AEST and state which one would allow a slot.
        - Ask the recruiter to confirm with the candidate before proposing or booking.
      must_not:
        - Silently use either the stated offset or the city.
        - Book or send anything.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-04-06T00:00:00Z", time_zone: Australia/Sydney, expected_local: "2027-04-06T10:00", expected_weekday: Tuesday, expected_utc_offset: "+10:00"}
      - {instant: "2027-04-06T00:00:00Z", time_zone: Asia/Tokyo, expected_local: "2027-04-06T09:00"}
      - {instant: "2027-04-05T23:00:00Z", time_zone: Asia/Tokyo, expected_local: "2027-04-06T08:00"}
      - {instant: "2027-04-06T01:00:00Z", time_zone: Australia/Sydney, expected_local: "2027-04-06T11:00"}

  - id: TZ-045
