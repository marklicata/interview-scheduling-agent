  - id: TZ-043
    title: Candidate gives availability as "UTC+8" with no city - the offset is enough
    category: cross_timezone
    subcategory: explicit_utc_offset
    description: >-
      The candidate writes "Thu Dec 10, 09:00-11:00 (UTC+8)" without naming a city. A fixed offset fully determines the
      instants, so the agent should not demand a city or guess one (Singapore, Perth, Manila...). The Sydney interviewer
      (AEDT, UTC+11) is busy until 12:30 p.m., so 60-minute starts are 12:30-1:00 p.m. AEDT = 9:30-10:00 UTC+8.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [explicit_utc_offset, sydney, avoid_overclarification, no_city_guess]
    requirement_refs: [INT-03, INT-05, AVL-10]
    inputs:
      now: "2026-12-03T09:00:00+11:00"
      recruiter: {id: rec_mia, name: Mia Kowalczyk, time_zone: Australia/Sydney}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Arif Rahman
        time_zone: Etc/GMT-8
        time_zone_raw: UTC+8
        availability:
          - {start: "2026-12-10T09:00:00+08:00", end: "2026-12-10T11:00:00+08:00"}
      interview_plan:
        name: Treasury Operations Analyst - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 60, interviewers: [int_olivia]}
      interviewers:
        - id: int_olivia
          name: Olivia Brennan
          time_zone: Australia/Sydney
          availability_source: calendar
          working_hours: {start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-12-10T12:00:00+11:00", end: "2026-12-10T12:30:00+11:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: I'm available Thu Dec 10, 09:00-11:00 (UTC+8).
        - role: recruiter
          text: He didn't say which city. Can you still find a slot with Olivia?
    expected:
      disposition: propose_options
      solution_summary: >-
        Thursday, December 10, 2026: start 12:30-1:00 p.m. AEDT = 9:30-10:00 a.m. UTC+8.
      must:
        - Use the stated UTC+8 offset directly and show the candidate's time as UTC+8.
        - Propose only starts from 12:30 to 1:00 p.m. AEDT (9:30-10:00 a.m. UTC+8).
        - Ask whether to book (phone details will be needed for a phone screen).
      must_not:
        - Require the candidate's city before proposing.
        - Label the candidate's time with a guessed city or zone name.
        - Propose 12:00 p.m. AEDT (Olivia is busy).
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-10T01:30:00Z", time_zone: Australia/Sydney, expected_local: "2026-12-10T12:30", expected_weekday: Thursday, expected_utc_offset: "+11:00"}
      - {instant: "2026-12-10T01:30:00Z", time_zone: Etc/GMT-8, expected_local: "2026-12-10T09:30", expected_utc_offset: "+08:00"}
    oracle:
      granularity_min: 5
