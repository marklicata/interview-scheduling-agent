  - id: TZ-041
    title: '"10am-12pm AEST" from Melbourne in January - propose the hour that is valid under either reading'
    category: cross_timezone
    subcategory: ambiguous_abbreviation_robust_slot
    description: >-
      A Melbourne candidate writes "Thu 21 Jan 10am-12pm AEST". In January Melbourne is on AEDT (UTC+11); AEST is UTC+10
      (Brisbane's year-round time). Literal AEST = 11:00 a.m.-1:00 p.m. Melbourne; local reading = 9-11 a.m. Brisbane. The
      Brisbane interviewer is free 9:00 a.m.-12:00 p.m. AEST. The intersection of both readings is 10:00-11:00 a.m. AEST
      (11:00 a.m.-12:00 p.m. AEDT), which fits a 60-minute interview exactly. The agent can propose that robust slot while
      asking the candidate to confirm the label.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [ambiguous_abbreviation, aest_in_summer, melbourne, brisbane, robust_slot]
    requirement_refs: [INT-03, INT-05, EC-002, SCH-01]
    inputs:
      now: "2027-01-14T09:00:00+10:00"
      recruiter: {id: rec_kirra, name: Kirra Simmons, time_zone: Australia/Brisbane}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Georgia Papadakis
        time_zone: Australia/Melbourne
        time_zone_raw: AEST
        availability_raw: Thu 21 Jan 10am-12pm AEST
        availability_robust_interpretation:
          - {start: "2027-01-21T11:00:00+11:00", end: "2027-01-21T12:00:00+11:00"}
      interview_plan:
        name: Clinical Trials Coordinator - interview
        sessions:
          - {id: S1, title: Coordinator interview, format: virtual, duration_min: 60, interviewers: [int_dean]}
      interviewers:
        - id: int_dean
          name: Dean Mackenzie
          time_zone: Australia/Brisbane
          availability_source: supplied
          supplied_availability:
            - {start: "2027-01-21T09:00:00+10:00", end: "2027-01-21T12:00:00+10:00"}
      conversation:
        - role: candidate
          channel: email
          text: Thursday 21 Jan works, 10am-12pm AEST.
        - role: recruiter
          text: Dean's free 9-12 Brisbane time that day. Options?
    expected:
      disposition: propose_options
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Propose Thursday, January 21, 2027, 10:00-11:00 a.m. AEST (Brisbane) = 11:00 a.m.-12:00 p.m. AEDT (Melbourne), which
        is inside the candidate's window under both readings; note the label and ask the candidate to confirm.
      must:
        - Point out that Melbourne is on AEDT (UTC+11) in January, so "AEST" is ambiguous.
        - Propose only 10:00 a.m. AEST = 11:00 a.m. AEDT as the slot valid under both readings, showing both local times.
        - Ask the candidate (via the recruiter) to confirm, and ask whether to book.
      must_not:
        - Propose 9:00 a.m. AEST (valid only under the local-time reading) or 11:00 a.m. AEST (valid only under the literal reading) as certain.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-21T00:00:00Z", time_zone: Australia/Brisbane, expected_local: "2027-01-21T10:00", expected_weekday: Thursday, expected_utc_offset: "+10:00"}
      - {instant: "2027-01-21T00:00:00Z", time_zone: Australia/Melbourne, expected_local: "2027-01-21T11:00", expected_utc_offset: "+11:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-21T00:00:00+10:00", end: "2027-01-22T00:00:00+10:00"}
      participants:
        candidate: {time_zone: Australia/Melbourne, available: [["2027-01-21T11:00:00+11:00", "2027-01-21T12:00:00+11:00"]]}
        int_dean: {time_zone: Australia/Brisbane, available: [["2027-01-21T09:00:00+10:00", "2027-01-21T12:00:00+10:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_dean]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-21T10:00:00+10:00"}
      invalid_examples:
        - {S1: "2027-01-21T09:00:00+10:00", note: Valid only if AEST meant Melbourne local time.}
        - {S1: "2027-01-21T11:00:00+10:00", note: Valid only under the literal AEST reading.}
      valid_start_bounds:
        S1: {earliest: "2027-01-21T10:00:00+10:00", latest: "2027-01-21T10:00:00+10:00"}
    grading_notes: The oracle encodes only the intersection of both readings, which is what may be proposed without clarification.

