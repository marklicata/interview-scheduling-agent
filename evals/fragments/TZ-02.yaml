    category: cross_timezone
    subcategory: abbreviation_resolved_by_context
    description: >-
      A Lyon candidate writes in French "Mardi 13 avril : 10h00-12h00 CET (09h00-11h00 heure de Londres)". In April France
      is on CEST, so "CET" is technically wrong, but the explicit London equivalent (9-11 BST) matches Paris local time and
      resolves the label. The London interviewer is busy until 9:30 a.m. BST, so 60-minute starts are 9:30-10:00 a.m. BST
      (10:30-11:00 a.m. Paris). Reading "CET" literally (UTC+1) would shift the window an hour later.
