# Cross-timezone cases, part 2: odd offsets, date line, abbreviations, labels and offset formats.
# All conversions computed with Python zoneinfo.
test_cases:
  - id: TZ-027
    title: Kathmandu's +5:45 offset is not India time - a New York panel fits only at 8:15 p.m. Nepal time
    category: cross_timezone
    subcategory: quarter_hour_offset
    description: >-
      A Kathmandu candidate (UTC+5:45) is free 7:00-9:00 p.m. Nepal time; two New York panelists are needed for 45
      minutes, and one is busy until 9:30 a.m. EST. The real window is 9:30-10:15 a.m. EST, so the only start is 9:30
      a.m. EST = 8:15 p.m. NPT. Treating Nepal as India time (UTC+5:30) shifts everything by 15 minutes and makes a 9:45
      a.m. EST start look valid when it actually ends at 9:15 p.m. NPT.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [nepal, quarter_hour_offset, new_york, india_time_confusion, exact_boundary]
    requirement_refs: [AVL-10, SCH-01, SCH-08, EC-020]
    inputs:
      now: "2026-11-10T09:00:00-05:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sujata Shrestha
        time_zone: Asia/Kathmandu
        availability:
          - {start: "2026-11-17T19:00:00+05:45", end: "2026-11-17T21:00:00+05:45"}
      interview_plan:
        name: Mobile Engineer - two-person panel
        sessions:
          - {id: P1, title: Mobile architecture panel, format: virtual, duration_min: 45, interviewers: [int_greg, int_annika], all_required: true}
      interviewers:
        - {id: int_greg, name: Greg Novak, time_zone: America/New_York, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
        - id: int_annika
          name: Annika Lund
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T09:00:00-05:00", end: "2026-11-17T09:30:00-05:00", status: busy}
      conversation:
        - role: recruiter
          text: >-
            Sujata is free 7-9pm Nepal time on Tue Nov 17. Nepal is basically India time, 10.5 hrs ahead of us. Find a
            45-min slot with Greg and Annika.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 17, 2026: only 9:30-10:15 a.m. EST = 8:15-9:00 p.m. NPT (UTC+5:45).
      must:
        - State that Nepal is UTC+5:45, 10 hours 45 minutes ahead of New York in November, not 10.5 hours.
        - Propose only 9:30 a.m. EST = 8:15 p.m. NPT.
        - Show the candidate's time with its quarter-hour offset.
        - Ask whether to book.
      must_not:
        - Propose 9:45 a.m. EST (ends 9:15 p.m. NPT, after the candidate's window).
        - Propose any start before 9:30 a.m. EST (Annika is busy).
        - Round the candidate's time to a half-hour offset.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T14:30:00Z", time_zone: Asia/Kathmandu, expected_local: "2026-11-17T20:15", expected_weekday: Tuesday, expected_utc_offset: "+05:45"}
      - {instant: "2026-11-17T14:30:00Z", time_zone: America/New_York, expected_local: "2026-11-17T09:30", expected_utc_offset: "-05:00"}
      - {instant: "2026-11-17T14:30:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-17T20:00", expected_utc_offset: "+05:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00-05:00", end: "2026-11-18T00:00:00-05:00"}
      participants:
        candidate: {time_zone: Asia/Kathmandu, available: [["2026-11-17T19:00:00+05:45", "2026-11-17T21:00:00+05:45"]]}
        int_greg: {time_zone: America/New_York, working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}}
        int_annika:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}
          busy: [["2026-11-17T09:00:00-05:00", "2026-11-17T09:30:00-05:00"]]
      sessions:
        - {id: P1, duration_min: 45, attendees: [candidate, int_greg, int_annika]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-11-17T09:30:00-05:00"}
      invalid_examples:
        - {P1: "2026-11-17T09:45:00-05:00", note: "Ends 9:15 p.m. NPT."}
        - {P1: "2026-11-17T09:00:00-05:00", note: Annika is busy.}
      valid_start_bounds:
        P1: {earliest: "2026-11-17T09:30:00-05:00", latest: "2026-11-17T09:30:00-05:00"}

  - id: TZ-028
    title: Dhaka, Kolkata and Kathmandu panel - three offsets 15 minutes apart and "BST" meaning Bangladesh time
    category: cross_timezone
    subcategory: south_asia_odd_offsets
    description: >-
      A Dhaka candidate writes "3-5 pm BST" (Bangladesh Standard Time, UTC+6; context: Dhaka address, +880 phone). Panelists
      are in Kolkata (UTC+5:30, busy until 3:00 p.m. IST) and Kathmandu (UTC+5:45, leaves at 4:00 p.m. NPT). The 45-minute
      panel fits exactly once: 3:30 p.m. Dhaka = 3:00 p.m. IST = 3:15 p.m. NPT. The agent should not read BST as British
      Summer Time and should label the candidate time unambiguously.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [panel]
    tags: [bangladesh, nepal, india, quarter_hour_offset, bst_abbreviation, context_resolves_label]
    requirement_refs: [AVL-10, SCH-01, EC-002, EC-020]
    inputs:
      now: "2026-11-24T10:00:00+05:30"
      recruiter: {id: rec_kavya, name: Kavya Iyer, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tanvir Hossain
        time_zone: Asia/Dhaka
        time_zone_raw: BST
        location: Dhaka, Bangladesh (phone +880)
        availability:
          - {start: "2026-12-01T15:00:00+06:00", end: "2026-12-01T17:00:00+06:00"}
      interview_plan:
        name: Microfinance Product Analyst - regional panel
        sessions:
          - {id: P1, title: Regional product panel, format: virtual, duration_min: 45, interviewers: [int_meera, int_bikash], all_required: true}
      interviewers:
        - id: int_meera
          name: Meera Joshi
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {start: "09:30", end: "18:00"}
          calendar:
            - {start: "2026-12-01T14:30:00+05:30", end: "2026-12-01T15:00:00+05:30", status: busy}
        - id: int_bikash
          name: Bikash Gurung
          time_zone: Asia/Kathmandu
          availability_source: supplied
          supplied_availability:
            - {start: "2026-12-01T10:00:00+05:45", end: "2026-12-01T16:00:00+05:45"}
      conversation:
        - role: candidate
          channel: email
          text: Tuesday 1 December I am free 3-5 pm BST. Regards, Tanvir (Dhaka)
        - role: recruiter
          text: Please find a 45-min slot for Tanvir with Meera and Bikash.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, December 1, 2026: only 3:30-4:15 p.m. Dhaka time (UTC+6) = 3:00-3:45 p.m. IST = 3:15-4:00 p.m. NPT.
      must:
        - Interpret "BST" as Bangladesh Standard Time (UTC+6) because the candidate is in Dhaka, and label it as Dhaka time in the output.
        - Propose only the 3:30 p.m. Dhaka start, with IST and NPT equivalents.
        - Explain that Meera is busy until 3:00 p.m. IST (3:30 p.m. Dhaka) and Bikash leaves at 4:00 p.m. NPT (4:15 p.m. Dhaka).
        - Ask whether to book.
      must_not:
        - Interpret BST as British Summer Time.
        - Propose 3:00 p.m. or 3:45 p.m. Dhaka time.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-01T09:30:00Z", time_zone: Asia/Dhaka, expected_local: "2026-12-01T15:30", expected_weekday: Tuesday, expected_utc_offset: "+06:00"}
      - {instant: "2026-12-01T09:30:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-01T15:00", expected_utc_offset: "+05:30"}
      - {instant: "2026-12-01T09:30:00Z", time_zone: Asia/Kathmandu, expected_local: "2026-12-01T15:15", expected_utc_offset: "+05:45"}
      - {instant: "2026-12-01T10:15:00Z", time_zone: Asia/Kathmandu, expected_local: "2026-12-01T16:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-01T00:00:00+06:00", end: "2026-12-02T00:00:00+06:00"}
      participants:
        candidate: {time_zone: Asia/Dhaka, available: [["2026-12-01T15:00:00+06:00", "2026-12-01T17:00:00+06:00"]]}
        int_meera:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, start: "09:30", end: "18:00"}
          busy: [["2026-12-01T14:30:00+05:30", "2026-12-01T15:00:00+05:30"]]
        int_bikash: {time_zone: Asia/Kathmandu, available: [["2026-12-01T10:00:00+05:45", "2026-12-01T16:00:00+05:45"]]}
      sessions:
        - {id: P1, duration_min: 45, attendees: [candidate, int_meera, int_bikash]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-12-01T15:30:00+06:00"}
      invalid_examples:
        - {P1: "2026-12-01T15:00:00+06:00", note: "Meera is busy until 3:00 p.m. IST."}
        - {P1: "2026-12-01T15:45:00+06:00", note: "Ends 4:15 p.m. NPT, after Bikash leaves."}
      valid_start_bounds:
        P1: {earliest: "2026-12-01T15:30:00+06:00", latest: "2026-12-01T15:30:00+06:00"}

  - id: TZ-029
    title: Newfoundland's -3:30 offset with a Seattle interviewer - not Atlantic time
    category: cross_timezone
    subcategory: half_hour_offset
    description: >-
      A St. John's candidate is free 1:00-3:00 p.m. Newfoundland time (UTC-3:30). The Seattle interviewer starts at 9:00
      a.m. PST, which is 1:30 p.m. NST. A 45-minute interview can start 9:00-9:45 a.m. PST (1:30-2:15 p.m. NST). Treating
      Newfoundland as Atlantic time (UTC-4) shifts the window by 30 minutes and makes a 10:00 a.m. PST start look valid.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [newfoundland, half_hour_offset, seattle, atlantic_confusion]
    requirement_refs: [AVL-10, SCH-01, EC-020]
    inputs:
      now: "2026-11-11T09:00:00-08:00"
      recruiter: {id: rec_lucia, name: Lucia Ferreira, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Siobhan Walsh-Pittman
        time_zone: America/St_Johns
        availability:
          - {start: "2026-11-18T13:00:00-03:30", end: "2026-11-18T15:00:00-03:30"}
      interview_plan:
        name: Offshore Logistics Coordinator - interview
        sessions:
          - {id: S1, title: Logistics interview, format: virtual, duration_min: 45, interviewers: [int_kenji]}
      interviewers:
        - {id: int_kenji, name: Kenji Harada, time_zone: America/Los_Angeles, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: Siobhan's in St. John's, free 1-3pm her time Wed 11/18. That's Atlantic, so 4 hours ahead of us? Book-able with Kenji?
    expected:
      disposition: propose_options
      solution_summary: >-
        Wednesday, November 18, 2026: start 9:00-9:45 a.m. PST = 1:30-2:15 p.m. NST (UTC-3:30).
      must:
        - Explain that Newfoundland is UTC-3:30, 4.5 hours ahead of Seattle in November (not Atlantic time).
        - Propose only starts from 9:00 to 9:45 a.m. PST (1:30-2:15 p.m. NST).
        - Ask whether to book.
      must_not:
        - Propose 10:00 a.m. PST (ends 3:15 p.m. NST).
        - Propose 8:30 a.m. PST (before Kenji's day).
        - Label the candidate's time as AST.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T17:00:00Z", time_zone: America/St_Johns, expected_local: "2026-11-18T13:30", expected_weekday: Wednesday, expected_utc_offset: "-03:30"}
      - {instant: "2026-11-18T17:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-18T09:00", expected_utc_offset: "-08:00"}
      - {instant: "2026-11-18T17:00:00Z", time_zone: America/Halifax, expected_local: "2026-11-18T13:00", expected_utc_offset: "-04:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T00:00:00-08:00", end: "2026-11-19T00:00:00-08:00"}
      participants:
        candidate: {time_zone: America/St_Johns, available: [["2026-11-18T13:00:00-03:30", "2026-11-18T15:00:00-03:30"]]}
        int_kenji: {time_zone: America/Los_Angeles, working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_kenji]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-18T09:00:00-08:00"}
      invalid_examples:
        - {S1: "2026-11-18T10:00:00-08:00", note: "Ends 3:15 p.m. NST."}
      valid_start_bounds:
        S1: {earliest: "2026-11-18T09:00:00-08:00", latest: "2026-11-18T09:45:00-08:00"}

  - id: TZ-030
    title: Tehran candidate with a Saturday-Wednesday workweek and a New York interviewer
    category: cross_timezone
    subcategory: half_hour_offset_workweek
    description: >-
      A Tehran candidate (UTC+3:30, no DST) states her own availability: weekday evenings 5:00-8:00 p.m. Saturday-Wednesday
      and Thursday 10:00 a.m.-8:00 p.m.; Friday is her weekend. The New York interviewer supplied Wednesday 10:30 a.m.-12:00
      p.m. and Friday 9:00-10:00 a.m. EST. Only Wednesday 10:30 a.m. EST = 7:00 p.m. Tehran fits a 60-minute interview;
      Friday 9:00 a.m. EST (5:30 p.m. Tehran) is her weekend and was not offered.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [iran, half_hour_offset, non_standard_workweek, new_york, candidate_stated_week]
    requirement_refs: [AVL-10, AVL-12, SCH-01, EC-020, EC-026]
    inputs:
      now: "2026-12-02T09:00:00-05:00"
      recruiter: {id: rec_brooke, name: Brooke Lansing, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Shirin Tavakoli
        time_zone: Asia/Tehran
        availability_note: Saturday-Wednesday 17:00-20:00 and Thursday 10:00-20:00 Tehran time; Friday off.
        availability:
          - {start: "2026-12-07T17:00:00+03:30", end: "2026-12-07T20:00:00+03:30"}
          - {start: "2026-12-08T17:00:00+03:30", end: "2026-12-08T20:00:00+03:30"}
          - {start: "2026-12-09T17:00:00+03:30", end: "2026-12-09T20:00:00+03:30"}
          - {start: "2026-12-10T10:00:00+03:30", end: "2026-12-10T20:00:00+03:30"}
      interview_plan:
        name: Computational Linguist - research interview
        sessions:
          - {id: S1, title: Research interview, format: virtual, duration_min: 60, interviewers: [int_rachel]}
      interviewers:
        - id: int_rachel
          name: Rachel Goldberg
          time_zone: America/New_York
          availability_source: supplied
          supplied_availability:
            - {start: "2026-12-09T10:30:00-05:00", end: "2026-12-09T12:00:00-05:00"}
            - {start: "2026-12-11T09:00:00-05:00", end: "2026-12-11T10:00:00-05:00"}
      conversation:
        - role: candidate
          channel: email
          text: >-
            My week runs Saturday to Wednesday, so I'm free 5-8pm Tehran time on those days and all day Thursday 10am-8pm.
            Friday is my weekend.
        - role: recruiter
          text: Rachel gave Wed 12/9 10:30-12 and Fri 12/11 9-10 our time. Which works for Shirin?
    expected:
      disposition: propose_options
      solution_summary: >-
        Only Wednesday, December 9, 2026, 10:30-11:30 a.m. EST = 7:00-8:00 p.m. Tehran (UTC+3:30).
      must:
        - Propose only 10:30 a.m. EST on December 9 = 7:00 p.m. Tehran time.
        - Explain that Friday, December 11 at 9:00 a.m. EST is 5:30 p.m. Friday in Tehran, the candidate's stated weekend.
        - Show the Tehran time with its UTC+3:30 offset.
        - Ask whether to book.
      must_not:
        - Propose Friday, December 11.
        - Propose a Wednesday start after 10:30 a.m. EST (ends after 8:00 p.m. Tehran).
        - Assume the candidate's weekend from memory instead of using her statement.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-09T15:30:00Z", time_zone: Asia/Tehran, expected_local: "2026-12-09T19:00", expected_weekday: Wednesday, expected_utc_offset: "+03:30"}
      - {instant: "2026-12-09T15:30:00Z", time_zone: America/New_York, expected_local: "2026-12-09T10:30", expected_utc_offset: "-05:00"}
      - {instant: "2026-12-11T14:00:00Z", time_zone: Asia/Tehran, expected_local: "2026-12-11T17:30", expected_weekday: Friday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-07T00:00:00-05:00", end: "2026-12-12T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: Asia/Tehran
          available: [["2026-12-07T17:00:00+03:30", "2026-12-07T20:00:00+03:30"], ["2026-12-08T17:00:00+03:30", "2026-12-08T20:00:00+03:30"], ["2026-12-09T17:00:00+03:30", "2026-12-09T20:00:00+03:30"], ["2026-12-10T10:00:00+03:30", "2026-12-10T20:00:00+03:30"]]
        int_rachel:
          time_zone: America/New_York
          available: [["2026-12-09T10:30:00-05:00", "2026-12-09T12:00:00-05:00"], ["2026-12-11T09:00:00-05:00", "2026-12-11T10:00:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_rachel]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-09T10:30:00-05:00"}
      invalid_examples:
        - {S1: "2026-12-11T09:00:00-05:00", note: "Friday 5:30 p.m. Tehran, the candidate's weekend."}
        - {S1: "2026-12-09T11:00:00-05:00", note: "Ends 8:30 p.m. Tehran."}
      valid_start_bounds:
        S1: {earliest: "2026-12-09T10:30:00-05:00", latest: "2026-12-09T10:30:00-05:00"}

  - id: TZ-031
    title: Chatham Islands (+13:45) candidate with an Auckland interviewer - a 45-minute offset
    category: cross_timezone
    subcategory: quarter_hour_offset
    description: >-
      The Chatham Islands are UTC+13:45 in January (45 minutes ahead of Auckland). The candidate is free 9:00-10:00 a.m.
      Chatham time; the Auckland interviewer supplied 8:30-9:30 a.m. NZDT. The overlap is exactly 45 minutes, so the only
      start is 8:30 a.m. NZDT = 9:15 a.m. Chatham time. Assuming the islands share Auckland's clock (or are one hour ahead)
      yields a wrong slot.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [chatham_islands, quarter_hour_offset, auckland, exact_boundary]
    requirement_refs: [AVL-10, SCH-01, SCH-08, EC-020]
    inputs:
      now: "2027-01-07T10:00:00+13:00"
      recruiter: {id: rec_aroha, name: Aroha Ngata, time_zone: Pacific/Auckland}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hemi Tuuta
        time_zone: Pacific/Chatham
        availability:
          - {start: "2027-01-14T09:00:00+13:45", end: "2027-01-14T10:00:00+13:45"}
      interview_plan:
        name: Fisheries Compliance Officer - interview
        sessions:
          - {id: S1, title: Compliance interview, format: virtual, duration_min: 45, interviewers: [int_sione]}
      interviewers:
        - id: int_sione
          name: Sione Latu
          time_zone: Pacific/Auckland
          availability_source: supplied
          supplied_availability:
            - {start: "2027-01-14T08:30:00+13:00", end: "2027-01-14T09:30:00+13:00"}
      conversation:
        - role: recruiter
          text: Hemi is on the Chathams, free 9-10am his time Thu 14 Jan. Sione can do 8:30-9:30 Auckland time. Does that overlap?
    expected:
      disposition: propose_options
      solution_summary: >-
        Thursday, January 14, 2027: only 8:30-9:15 a.m. NZDT = 9:15-10:00 a.m. Chatham time (UTC+13:45).
      must:
        - State that the Chatham Islands are 45 minutes ahead of Auckland in January 2027.
        - Propose only 8:30 a.m. NZDT = 9:15 a.m. Chatham time.
        - Ask whether to book.
      must_not:
        - Propose 9:00 a.m. NZDT (ends 10:30 a.m. Chatham time).
        - Treat the islands as one hour ahead or on the same clock.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-13T19:30:00Z", time_zone: Pacific/Chatham, expected_local: "2027-01-14T09:15", expected_weekday: Thursday, expected_utc_offset: "+13:45"}
      - {instant: "2027-01-13T19:30:00Z", time_zone: Pacific/Auckland, expected_local: "2027-01-14T08:30", expected_utc_offset: "+13:00"}
    oracle:
      granularity_min: 5
