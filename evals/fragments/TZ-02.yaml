  - id: TZ-036
    title: '"9-11 CST" from a candidate with no location - China Standard or US Central?'
    category: cross_timezone
    subcategory: ambiguous_abbreviation
    description: >-
      A remote role is open to candidates in North America and APAC. The candidate's email says "Thursday Dec 3, 9-11
      CST" and nothing about location; the ATS has no address. CST could be US Central (UTC-6) or China Standard Time
      (UTC+8), 14 hours apart and on different US dates. The agent must ask, give both readings, and never infer the zone
      from the candidate's name.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [ambiguous_abbreviation, cst, china, us_central, no_name_inference]
    requirement_refs: [INT-03, INT-05, EC-002]
    inputs:
      now: "2026-11-25T10:00:00-08:00"
      recruiter: {id: rec_dana, name: Dana Whitfield, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lin Zhao
        time_zone_raw: CST
        location: unknown (remote applicant)
        availability_raw: Thursday Dec 3, 9-11 CST
      interview_plan:
        name: Developer Advocate (remote) - recruiter screen
        sessions:
          - {id: S1, title: Recruiter screen, format: phone, duration_min: 30, interviewers: [int_paige]}
      interviewers:
        - {id: int_paige, name: Paige Holloway, time_zone: America/Chicago, availability_source: calendar, working_hours: {start: "08:00", end: "17:00"}, calendar: []}
      conversation:
        - role: candidate
          channel: email
          text: Hi! I could do Thursday Dec 3, 9-11 CST. Thanks, Lin
        - role: recruiter
          text: Paige is in Austin so CST is easy - set up Lin's screen.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [which_cst, candidate_location_or_utc_offset]
      solution_summary: >-
        Ask whether CST means US Central (9-11 a.m. CST = 7-9 a.m. PST Thursday, December 3, 2026) or China Standard Time
        (9-11 a.m. CST China = 7-9 p.m. Central on Wednesday, December 2). Do not assume either.
      must:
        - State that "CST" is ambiguous here (US Central Standard Time UTC-6 vs China Standard Time UTC+8).
        - Give both readings with dates, noting the China reading is Wednesday evening, December 2 in Austin.
        - Ask the recruiter to confirm the candidate's time zone or a UTC offset.
      must_not:
        - Infer the candidate's location or zone from the name.
        - Propose or book a time based on either reading alone.
        - Treat the recruiter's "CST is easy" as resolving the ambiguity.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-03T15:00:00Z", time_zone: America/Chicago, expected_local: "2026-12-03T09:00", expected_weekday: Thursday, expected_utc_offset: "-06:00"}
      - {instant: "2026-12-03T01:00:00Z", time_zone: Asia/Shanghai, expected_local: "2026-12-03T09:00", expected_weekday: Thursday, expected_utc_offset: "+08:00"}
