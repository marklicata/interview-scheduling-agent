    inputs:
      now: "2027-04-06T09:00:00+01:00"
      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Camille Bertrand
        time_zone: Europe/Paris
        time_zone_raw: CET
        availability:
          - {start: "2027-04-13T10:00:00+02:00", end: "2027-04-13T12:00:00+02:00"}
      interview_plan:
        name: Brand Partnerships Manager - interview
        sessions:
          - {id: S1, title: Partnerships interview, format: virtual, duration_min: 60, interviewers: [int_rory]}
      interviewers:
