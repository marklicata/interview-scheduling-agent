  - id: TZ-037
    title: '"CST" resolved by context - Chinese message says Beijing time, recruiter misreads it as Central'
    category: cross_timezone
    subcategory: abbreviation_resolved_by_context
    description: >-
      A Chengdu candidate writes in Chinese "北京时间 (CST) 12月8日 周二 上午9点到11点" - Beijing time, Tuesday December 8,
      9-11 a.m. The Chicago recruiter thinks "that's our time". The context (explicit Beijing time, Chengdu address)
      resolves the label to Asia/Shanghai, so the agent should proceed without a clarification round. The Tokyo
      interviewer is busy 10:00-10:30 a.m. JST, so 60-minute starts are 10:30-11:00 a.m. JST = 9:30-10:00 a.m. Beijing.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [cst, china, context_resolves_label, chinese_language, tokyo, avoid_overclarification]
    requirement_refs: [INT-03, EC-002, AVL-10]
    inputs:
      now: "2026-12-01T09:00:00-06:00"
      recruiter: {id: rec_grace, name: Grace Holloway, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Wang Jiayi
        time_zone: Asia/Shanghai
        time_zone_raw: 北京时间 (CST)
        location: Chengdu, China
        availability:
          - {start: "2026-12-08T09:00:00+08:00", end: "2026-12-08T11:00:00+08:00"}
      interview_plan:
        name: Game Localization Producer - interview with Tokyo lead
        sessions:
          - {id: S1, title: Producer interview, format: virtual, duration_min: 60, interviewers: [int_haruto]}
      interviewers:
        - id: int_haruto
          name: Haruto Saito
          time_zone: Asia/Tokyo
          availability_source: calendar
          working_hours: {start: "09:30", end: "18:00"}
          calendar:
            - {start: "2026-12-08T10:00:00+09:00", end: "2026-12-08T10:30:00+09:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: "您好，我北京时间 (CST) 12月8日 周二 上午9点到11点有空。谢谢！"
        - role: recruiter
          text: Jiayi says Tue Dec 8 9-11 CST - that's our time, right? Find something with Haruto.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, December 8, 2026: start 10:30-11:00 a.m. JST = 9:30-10:00 a.m. Beijing time (UTC+8) = Monday, December 7,
        7:30-8:00 p.m. CST in Chicago.
      must:
        - Interpret the candidate's time as China Standard Time (Asia/Shanghai, UTC+8) because the message says Beijing time.
        - Propose starts from 10:30 to 11:00 a.m. JST (9:30-10:00 a.m. Beijing time).
        - Gently correct the recruiter that this is not US Central time and show the Chicago equivalent with its Monday date.
        - Ask whether to book.
      must_not:
        - Treat the candidate's CST as US Central.
        - Ask a redundant clarification about which CST.
        - Propose 10:00 a.m. JST (Haruto is busy).
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-08T01:30:00Z", time_zone: Asia/Shanghai, expected_local: "2026-12-08T09:30", expected_weekday: Tuesday, expected_utc_offset: "+08:00"}
      - {instant: "2026-12-08T01:30:00Z", time_zone: Asia/Tokyo, expected_local: "2026-12-08T10:30", expected_utc_offset: "+09:00"}
      - {instant: "2026-12-08T01:30:00Z", time_zone: America/Chicago, expected_local: "2026-12-07T19:30", expected_weekday: Monday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T00:00:00+08:00", end: "2026-12-09T00:00:00+08:00"}
      participants:
        candidate: {time_zone: Asia/Shanghai, available: [["2026-12-08T09:00:00+08:00", "2026-12-08T11:00:00+08:00"]]}
        int_haruto:
          time_zone: Asia/Tokyo
          working_hours: {time_zone: Asia/Tokyo, start: "09:30", end: "18:00"}
          busy: [["2026-12-08T10:00:00+09:00", "2026-12-08T10:30:00+09:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_haruto]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-08T10:30:00+09:00"}
      invalid_examples:
        - {S1: "2026-12-08T09:00:00-06:00", note: US Central reading - midnight in Tokyo.}
        - {S1: "2026-12-08T10:00:00+09:00", note: Haruto is busy.}
      valid_start_bounds:
        S1: {earliest: "2026-12-08T10:30:00+09:00", latest: "2026-12-08T11:00:00+09:00"}

  - id: TZ-038
    title: '"11:00-13:00 IST" from a Dublin-based candidate to a Pune hiring team - India or Irish time?'
    category: cross_timezone
    subcategory: ambiguous_abbreviation
    description: >-
      The candidate's CV and address are in Dublin; the interviewers are in Pune. Her email says "Wed 13 Jan 11:00-13:00
      IST". IST can mean India Standard Time (UTC+5:30) or Irish Standard Time (Ireland's summer clock; in January
      Ireland is on GMT, which makes the label even less certain). The readings are 5.5 hours apart. The agent must ask.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [technical_coding]
    tags: [ambiguous_abbreviation, ist, ireland, india, dublin, pune]
    requirement_refs: [INT-03, INT-05, EC-002]
    inputs:
      now: "2027-01-06T10:00:00+05:30"
      recruiter: {id: rec_aditya, name: Aditya Bhosale, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Niamh Gallagher-Rao
        time_zone_raw: IST
        location: Dublin, Ireland (per CV)
        availability_raw: Wed 13 Jan 11:00-13:00 IST
      interview_plan:
        name: Platform Engineer - coding round
        sessions:
          - {id: S1, title: Coding round, format: virtual, duration_min: 60, interviewers: [int_prasad]}
      interviewers:
        - {id: int_prasad, name: Prasad Kulkarni, time_zone: Asia/Kolkata, availability_source: calendar, working_hours: {start: "10:00", end: "19:00"}, calendar: []}
      conversation:
        - role: candidate
          channel: email
          text: Happy to do Wed 13 Jan, 11:00-13:00 IST.
        - role: recruiter
          text: IST, perfect, same as us. Book her with Prasad at 11.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [india_or_irish_time]
      solution_summary: >-
        Ask the candidate which zone she means. Dublin reading: 11:00-13:00 GMT = 4:30-6:30 p.m. India time. India reading:
        11:00 a.m.-1:00 p.m. India time = 5:30-7:30 a.m. in Dublin. Both fit Prasad's day, so the difference matters.
      must:
        - Explain that IST is ambiguous for a Dublin-based candidate (India Standard Time UTC+5:30 vs Irish time, which is GMT in January).
        - Give both readings for Wednesday, January 13, 2027 with times in both zones.
        - Ask the recruiter to confirm with the candidate before proposing a booking.
      must_not:
        - Book 11:00 a.m. India time on the recruiter's assumption.
        - Silently pick the Dublin reading either.
        - Claim Ireland uses UTC+1 in January.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-13T11:00:00Z", time_zone: Europe/Dublin, expected_local: "2027-01-13T11:00", expected_weekday: Wednesday, expected_utc_offset: "+00:00"}
      - {instant: "2027-01-13T11:00:00Z", time_zone: Asia/Kolkata, expected_local: "2027-01-13T16:30", expected_utc_offset: "+05:30"}
      - {instant: "2027-01-13T05:30:00Z", time_zone: Europe/Dublin, expected_local: "2027-01-13T05:30"}

  - id: TZ-039
    title: '"Tuesday 2:00 pm EST" in April - literal EST or loosely Eastern daylight time?'
    category: cross_timezone
    subcategory: ambiguous_abbreviation
    description: >-
      A Philadelphia candidate offers a single slot "Tuesday April 13, 2:00 pm EST". In April the Eastern US is on EDT; many
      people still write EST. Literally, 2:00 p.m. EST is 3:00 p.m. EDT. Both readings fit the Toronto interviewer's free
      afternoon, so either guess could book the wrong hour. The agent must ask which hour is meant.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [ambiguous_abbreviation, est_in_summer, philadelphia, toronto]
    requirement_refs: [INT-03, INT-05, EC-002]
    inputs:
      now: "2027-04-07T10:00:00-04:00"
      recruiter: {id: rec_noor, name: Noor Rahimi, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marcus Oyelowo
        time_zone: America/New_York
        time_zone_raw: EST
        availability_raw: Tuesday April 13, 2:00 pm EST (45 minutes)
      interview_plan:
        name: Actuarial Analyst - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 45, interviewers: [int_claire]}
      interviewers:
        - {id: int_claire, name: Claire Fontaine, time_zone: America/Toronto, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: candidate
          channel: email
          text: I can only do one slot that week - Tuesday April 13 at 2:00 pm EST.
        - role: recruiter
          text: Claire is free all afternoon on the 13th. Set it up.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [est_literal_or_local_eastern]
      solution_summary: >-
        Ask whether the candidate means 2:00 p.m. Eastern local time (EDT, 18:00 UTC) or literally 2:00 p.m. EST (UTC-5),
        which is 3:00 p.m. EDT (19:00 UTC) on Tuesday, April 13, 2027. Both fit Claire's afternoon.
      must:
        - Explain that on April 13, 2027 the Eastern US is on EDT (UTC-4), so "2:00 pm EST" could mean 2:00 or 3:00 p.m. local.
        - Give both readings as Eastern local times (Toronto and Philadelphia share the clock).
        - Ask the recruiter to confirm the intended hour with the candidate.
      must_not:
        - Book or propose a single definitive time without clarification.
        - Claim Toronto and Philadelphia are in different zones.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-04-13T18:00:00Z", time_zone: America/New_York, expected_local: "2027-04-13T14:00", expected_weekday: Tuesday, expected_utc_offset: "-04:00"}
      - {instant: "2027-04-13T19:00:00Z", time_zone: America/Toronto, expected_local: "2027-04-13T15:00", expected_utc_offset: "-04:00"}

  - id: TZ-040
    title: London interviewer writes "9-10am GMT" in April; both readings suit the Dubai candidate
    category: cross_timezone
