      - {instant: "2026-11-18T13:30:00Z", time_zone: America/New_York, expected_local: "2026-11-18T08:30", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T00:00:00-05:00", end: "2026-11-19T00:00:00-05:00"}
      participants:
        candidate: {time_zone: Europe/Berlin, available: [["2026-11-18T14:00:00+01:00", "2026-11-18T16:30:00+01:00"]]}
        int_kevin: {time_zone: America/New_York, available: [["2026-11-18T08:30:00-05:00", "2026-11-18T10:00:00-05:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_kevin]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-18T08:30:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-18T09:30:00-05:00", note: "Ends 10:30 a.m. EST, after Kevin's window."}
      valid_start_bounds:
        S1: {earliest: "2026-11-18T08:30:00-05:00", latest: "2026-11-18T09:00:00-05:00"}

  - id: TZ-053
    title: '"Wednesday 12:00-1:00 am" from Manila - start of Wednesday or Wednesday night?'
    category: cross_timezone
    subcategory: twelve_hour_midnight_ambiguity
    description: >-
      A Manila candidate on a night schedule offers "Wednesday 12:00-1:00 am". With 12-hour clocks this could mean the first
      hour of Wednesday, December 2 (Tuesday 11 a.m. EST in New York) or the night after Wednesday's workday, i.e. Thursday,
      December 3, 00:00-01:00 PHT (Wednesday 11 a.m. EST). The New York interviewer is free both mornings, so the agent must
      ask, giving explicit dates.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [twelve_hour_clock, midnight_ambiguity, manila, new_york, cross_date]
    requirement_refs: [INT-03, INT-05, EC-016]
    inputs:
      now: "2026-11-25T09:00:00-05:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Paolo Dimaculangan
        time_zone: Asia/Manila
        availability_raw: Wednesday 12:00-1:00 am
      interview_plan:
        name: Overnight Customer Support Lead - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 45, interviewers: [int_janet]}
      interviewers:
        - {id: int_janet, name: Janet Morrow, time_zone: America/New_York, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: candidate
          channel: email
          text: I'm on night shift - Wednesday 12:00-1:00 am is good for me.
        - role: recruiter
          text: Set Paolo up with Janet.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [which_midnight]
      solution_summary: >-
        Ask whether he means Wednesday, December 2, 2026, 00:00-01:00 PHT (Tuesday, December 1, 11:00 a.m.-12:00 p.m. EST) or
        Thursday, December 3, 00:00-01:00 PHT, i.e. Wednesday night (Wednesday, December 2, 11:00 a.m.-12:00 p.m. EST).
      must:
        - Explain that "Wednesday 12:00 am" can mean the start of Wednesday or the midnight at the end of Wednesday.
        - Give both readings with explicit dates in Manila and New York.
        - Ask the recruiter to confirm with the candidate.
      must_not:
        - Silently choose one reading and propose or book it.
        - Present a time without both participants' dates.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-01T16:00:00Z", time_zone: Asia/Manila, expected_local: "2026-12-02T00:00", expected_weekday: Wednesday, expected_utc_offset: "+08:00"}
      - {instant: "2026-12-01T16:00:00Z", time_zone: America/New_York, expected_local: "2026-12-01T11:00", expected_weekday: Tuesday}
      - {instant: "2026-12-02T16:00:00Z", time_zone: Asia/Manila, expected_local: "2026-12-03T00:00", expected_weekday: Thursday}
      - {instant: "2026-12-02T16:00:00Z", time_zone: America/New_York, expected_local: "2026-12-02T11:00", expected_weekday: Wednesday}
