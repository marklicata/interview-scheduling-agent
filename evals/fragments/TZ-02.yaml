          name: Rory Pemberton
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {start: "09:00", end: "17:30"}
          calendar:
            - {start: "2027-04-13T09:00:00+01:00", end: "2027-04-13T09:30:00+01:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: "Bonjour, je suis disponible mardi 13 avril : 10h00-12h00 CET (09h00-11h00 heure de Londres). Camille"
        - role: recruiter
          text: Find a slot with Rory.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, April 13, 2027: start 9:30-10:00 a.m. BST = 10:30-11:00 a.m. CEST (Paris).
      must:
        - Use the candidate's London cross-reference to interpret the window as Paris local time (CEST, UTC+2).
        - Propose only starts from 9:30 to 10:00 a.m. BST (10:30-11:00 a.m. Paris).
        - Optionally note that France is on CEST in April, without blocking on it.
        - Ask whether to book.
      must_not:
        - Read "CET" literally as UTC+1 and propose 10:30-11:00 a.m. BST starts.
        - Ask an unnecessary clarification.
        - Propose 9:00 a.m. BST (Rory is busy).
      side_effects: {external_writes: none}
    local_time_checks:
