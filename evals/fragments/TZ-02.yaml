      - {instant: "2027-04-13T08:30:00Z", time_zone: Europe/London, expected_local: "2027-04-13T09:30", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-04-13T00:00:00+01:00", end: "2027-04-14T00:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Paris, available: [["2027-04-13T10:00:00+02:00", "2027-04-13T12:00:00+02:00"]]}
        int_rory:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, start: "09:00", end: "17:30"}
          busy: [["2027-04-13T09:00:00+01:00", "2027-04-13T09:30:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_rory]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-04-13T09:30:00+01:00"}
      invalid_examples:
        - {S1: "2027-04-13T10:30:00+01:00", note: "Literal-CET reading; ends 12:30 p.m. Paris."}
      valid_start_bounds:
        S1: {earliest: "2027-04-13T09:30:00+01:00", latest: "2027-04-13T10:00:00+01:00"}

  - id: TZ-048
    title: '"9-11 my time" from Window Rock, Arizona - a location where Arizona''s no-DST rule may not apply'
    category: cross_timezone
    subcategory: zone_inference_from_location
    description: >-
      The candidate lives in Window Rock, Arizona, in the Navajo Nation, which observes daylight saving time unlike most of
      Arizona. She offers "Tue 3/16 9-11 am my time" for a 90-minute exercise with a Phoenix interviewer. If her clock is
      Phoenix time the window is 9-11 a.m. MST; if it follows daylight time it is 8-10 a.m. MST. The overlap of both readings
      is only 60 minutes, too short for 90, so the agent must confirm her clock instead of inferring "Arizona = no DST".
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [case_interview]
    tags: [arizona, navajo_nation, zone_inference, location_to_zone, us_dst_change]
    requirement_refs: [INT-03, INT-05, AVL-10]
    inputs:
      now: "2027-03-09T09:00:00-07:00"
      recruiter: {id: rec_tyler, name: Tyler Brennan, time_zone: America/Phoenix}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Shandiin Begay
        location: Window Rock, Arizona (Navajo Nation)
        time_zone_raw: my time
        availability_raw: Tue 3/16 9-11 am my time
      interview_plan:
        name: Water Resources Engineer - case exercise
        sessions:
          - {id: S1, title: Case exercise, format: virtual, duration_min: 90, interviewers: [int_hector]}
      interviewers:
        - {id: int_hector, name: Hector Villalobos, time_zone: America/Phoenix, availability_source: calendar, working_hours: {start: "08:00", end: "17:00"}, calendar: []}
      conversation:
        - role: candidate
          channel: email
          text: Tuesday 3/16 I'm free 9-11am my time.
        - role: recruiter
          text: She's in Arizona so same as Hector. Book 9-10:30.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [candidate_clock_dst_or_arizona_time]
      solution_summary: >-
        Ask whether the candidate's clock is on Arizona time (no DST: 9-11 a.m. MST, so 9:00-9:30 a.m. MST starts) or on
        daylight time like the Navajo Nation (9-11 a.m. MDT = 8-10 a.m. MST, so 8:00-8:30 a.m. MST starts). No 90-minute start
        works under both.
      must:
        - Explain that not all of Arizona skips daylight saving time and that the Navajo Nation follows it, so "my time" is uncertain on March 16, 2027.
        - Give both readings in Phoenix time.
        - Ask the recruiter to confirm the candidate's clock before booking.
      must_not:
        - Book 9:00-10:30 a.m. MST on the recruiter's assumption.
        - Claim that every Arizona location is on MST all year.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-16T16:00:00Z", time_zone: America/Phoenix, expected_local: "2027-03-16T09:00", expected_weekday: Tuesday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-16T15:00:00Z", time_zone: America/Denver, expected_local: "2027-03-16T09:00", expected_utc_offset: "-06:00"}
      - {instant: "2027-03-16T15:00:00Z", time_zone: America/Phoenix, expected_local: "2027-03-16T08:00"}

  - id: TZ-049
    title: Exported availability says "1-3 pm ET" but its timestamps carry a stale -05:00 offset
    category: cross_timezone
    subcategory: label_offset_mismatch
    description: >-
      A third-party scheduling export for a New York interviewer labels her window "1-3 pm ET" on Tuesday, March 16, 2027,
      but the machine timestamps carry -05:00 (standard time), which is 2-4 p.m. EDT. The London candidate is free
      17:00-18:30 GMT. Under the label, 60-minute starts 17:00-17:30 GMT work; under the timestamps nothing fits. The agent
      must notice the conflict between zone label and offset and ask, not silently trust either.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [stale_offset, export_mismatch, new_york, london, mislabeled_offset]
    requirement_refs: [AVL-13, AVL-15, INT-05, EC-019]
    inputs:
      now: "2027-03-10T09:00:00-05:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Benedict Asante
        time_zone: Europe/London
        availability:
          - {start: "2027-03-16T17:00:00+00:00", end: "2027-03-16T18:30:00+00:00"}
      interview_plan:
        name: Equity Research Associate - interview
        sessions:
          - {id: S1, title: Research interview, format: virtual, duration_min: 60, interviewers: [int_dana]}
      interviewers:
        - id: int_dana
          name: Dana Kowalski
          time_zone: America/New_York
          availability_source: supplied
          offset_check: false
          supplied_availability_label: Tue 3/16 1-3 pm ET
          supplied_availability:
            - {start: "2027-03-16T13:00:00-05:00", end: "2027-03-16T15:00:00-05:00", source: scheduling-tool export}
      conversation:
        - role: recruiter
          text: Dana's export says 1-3 ET on the 16th. Benedict is free 5-6:30pm London. Book something.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [label_vs_timestamp_offset]
      solution_summary: >-
        The export conflicts: "1-3 pm ET" on March 16, 2027 is 17:00-19:00 UTC (EDT), but the timestamps (-05:00) mean
        18:00-20:00 UTC. If the label is right, 60-minute starts 5:00-5:30 p.m. GMT (1:00-1:30 p.m. EDT) work; if the
        timestamps are right, nothing fits Benedict's window. Ask the recruiter to confirm Dana's window.
      must:
        - Detect that -05:00 is not New York's offset on March 16, 2027 (EDT is -04:00).
        - Explain both interpretations and their consequences for Benedict's 5:00-6:30 p.m. GMT window.
        - Ask the recruiter to confirm Dana's actual window before proposing or booking.
      must_not:
        - Book or propose a time based on only one interpretation.
        - Silently "fix" the offset without telling the recruiter.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-16T17:00:00Z", time_zone: America/New_York, expected_local: "2027-03-16T13:00", expected_weekday: Tuesday, expected_utc_offset: "-04:00"}
      - {instant: "2027-03-16T18:00:00Z", time_zone: America/New_York, expected_local: "2027-03-16T14:00"}
      - {instant: "2027-03-16T17:00:00Z", time_zone: Europe/London, expected_local: "2027-03-16T17:00", expected_utc_offset: "+00:00"}

  - id: TZ-050
    title: Recruiter typed the Lisbon candidate's zone-less times into the form as Eastern time
    category: cross_timezone
    subcategory: availability_in_wrong_zone
    description: >-
      The candidate (in Lisbon) emailed "Thursday 19th I'm free 9:30-11:30" with no zone. The New York recruiter entered it
      in the structured form as 9:30-11:30 a.m. ET. The two sources disagree by five hours, and both readings fit the Madrid
      interviewer (10:30 a.m.-12:30 p.m. CET vs 3:30-5:30 p.m. CET). The agent must reconcile visibly and ask rather than
      trust the structured entry.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [availability_in_recruiter_zone, provenance, lisbon, madrid, source_conflict]
    requirement_refs: [INT-04, INT-06, AVL-15, EC-011]
    inputs:
      now: "2026-11-12T10:00:00-05:00"
      recruiter: {id: rec_brooke, name: Brooke Lansing, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Inês Carvalho
        time_zone: Europe/Lisbon
        availability_raw: Thursday 19th I'm free 9:30-11:30 (no zone stated)
      interview_plan:
        name: Renewable Energy Analyst - interview
        sessions:
          - {id: S1, title: Analyst interview, format: virtual, duration_min: 60, interviewers: [int_alvaro]}
      interviewers:
        - id: int_alvaro
          name: Alvaro Ruiz
          time_zone: Europe/Madrid
          availability_source: supplied
          supplied_availability:
            - {start: "2026-11-19T10:00:00+01:00", end: "2026-11-19T13:00:00+01:00"}
            - {start: "2026-11-19T15:00:00+01:00", end: "2026-11-19T18:00:00+01:00"}
      case_state:
        structured_entry:
          entered_by: rec_brooke
          time_zone: America/New_York
          availability:
            - {start: "2026-11-19T09:30:00-05:00", end: "2026-11-19T11:30:00-05:00"}
      conversation:
        - role: candidate
          channel: email
          text: Thursday 19th I'm free 9:30-11:30. Best, Inês
        - role: recruiter
          text: I put Inês's Thursday availability in the form. Find a slot with Alvaro.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [candidate_zone_for_availability]
      solution_summary: >-
        The email has no zone and the candidate is in Lisbon; the form says ET. Lisbon reading: 9:30-11:30 a.m. WET =
        10:30 a.m.-12:30 p.m. CET (fits Alvaro's morning). ET reading: 9:30-11:30 a.m. EST = 2:30-4:30 p.m. Lisbon =
        3:30-5:30 p.m. CET (fits Alvaro's afternoon). Ask the recruiter to confirm.
      must:
        - Point out the conflict between the candidate's zone-less email (candidate in Lisbon) and the form entry labelled ET.
        - Show both readings with Lisbon, Madrid and New York times.
        - Ask the recruiter to confirm which zone the candidate meant (most likely Lisbon local time).
      must_not:
        - Silently trust the structured ET entry.
        - Propose or book a definitive time before the zone is confirmed.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T09:30:00Z", time_zone: Europe/Lisbon, expected_local: "2026-11-19T09:30", expected_weekday: Thursday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-19T09:30:00Z", time_zone: Europe/Madrid, expected_local: "2026-11-19T10:30", expected_utc_offset: "+01:00"}
      - {instant: "2026-11-19T14:30:00Z", time_zone: America/New_York, expected_local: "2026-11-19T09:30", expected_utc_offset: "-05:00"}
      - {instant: "2026-11-19T14:30:00Z", time_zone: Europe/Madrid, expected_local: "2026-11-19T15:30"}

  - id: TZ-051
    title: Johannesburg candidate offers "7-9 am your time" to a Seattle recruiter for a London interviewer
    category: cross_timezone
    subcategory: availability_in_recipient_zone
    description: >-
      The candidate kindly converts for the recruiter: "I can do 7-9 am your time on Wed Nov 18" (Seattle). That is 15:00-17:00
      UTC = 5:00-7:00 p.m. SAST. The London interviewer works until 5:30 p.m. GMT and is busy 3:00-3:30 p.m. GMT. 45-minute
      starts run 7:30-8:15 a.m. PST (3:30-4:15 p.m. GMT, 5:30-6:15 p.m. SAST). Reading "your time" as the candidate's own zone
      would produce a 7-9 a.m. SAST window that is before London's day.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [your_time, johannesburg, london, seattle, three_zones]
    requirement_refs: [INT-03, AVL-10, SCH-01]
    inputs:
      now: "2026-11-11T09:00:00-08:00"
      recruiter: {id: rec_lucia, name: Lucia Ferreira, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lerato Dlamini
        time_zone: Africa/Johannesburg
        availability:
          - {start: "2026-11-18T15:00:00Z", end: "2026-11-18T17:00:00Z", stated_as: "7-9 am your time (recruiter, Pacific)"}
      interview_plan:
        name: Mining Finance Analyst - interview
        sessions:
          - {id: S1, title: Finance interview, format: virtual, duration_min: 45, interviewers: [int_oliver]}
      interviewers:
        - id: int_oliver
          name: Oliver Hartley
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {start: "09:00", end: "17:30"}
          calendar:
            - {start: "2026-11-18T15:00:00+00:00", end: "2026-11-18T15:30:00+00:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: To make it easy for you, I can do 7-9 am your time on Wed Nov 18.
        - role: recruiter
          text: Lerato's in Joburg. Find a 45-min slot with Oliver in London.
    expected:
      disposition: propose_options
      solution_summary: >-
        Wednesday, November 18, 2026: start 7:30-8:15 a.m. PST = 3:30-4:15 p.m. GMT = 5:30-6:15 p.m. SAST.
      must:
        - Interpret "your time" as the recruiter's Pacific time.
        - Propose only starts from 7:30 to 8:15 a.m. PST, with GMT and SAST equivalents (candidate-facing in SAST).
        - Ask whether to book.
      must_not:
        - Interpret 7-9 a.m. as Johannesburg time.
        - Propose 7:00 a.m. PST (Oliver is busy) or any start after 8:15 a.m. PST.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T15:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-18T07:30", expected_weekday: Wednesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-18T15:30:00Z", time_zone: Africa/Johannesburg, expected_local: "2026-11-18T17:30", expected_utc_offset: "+02:00"}
      - {instant: "2026-11-18T15:30:00Z", time_zone: Europe/London, expected_local: "2026-11-18T15:30", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T00:00:00Z", end: "2026-11-19T00:00:00Z"}
      participants:
        candidate: {time_zone: Africa/Johannesburg, available: [["2026-11-18T15:00:00Z", "2026-11-18T17:00:00Z"]]}
        int_oliver:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, start: "09:00", end: "17:30"}
          busy: [["2026-11-18T15:00:00+00:00", "2026-11-18T15:30:00+00:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_oliver]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-18T07:30:00-08:00"}
      invalid_examples:
        - {S1: "2026-11-18T08:30:00-08:00", note: "Ends 9:15 a.m. PST, past the candidate's window."}
        - {S1: "2026-11-18T07:00:00+02:00", note: Candidate-zone misreading; 5:00 a.m. GMT.}
      valid_start_bounds:
        S1: {earliest: "2026-11-18T07:30:00-08:00", latest: "2026-11-18T08:15:00-08:00"}

  - id: TZ-052
    title: German 24-hour format with day-month date ("Mi., 18.11., 14:00-16:30 Uhr") for a Boston interviewer
    category: cross_timezone
    subcategory: date_and_clock_format
    description: >-
      A Munich candidate writes "Mi., 18.11., 14:00-16:30 Uhr" (Wednesday, November 18, 2-4:30 p.m. CET). The Boston
      interviewer writes "free 8:30 to 10" that day. The agent must parse DD.MM and the 24-hour clock, convert 14:00-16:30
      CET to 8:00-10:30 a.m. EST, and propose 60-minute starts 8:30-9:00 a.m. EST (2:30-3:00 p.m. CET).
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [24_hour_clock, day_month_date, german_language, munich, boston]
    requirement_refs: [INT-03, AVL-10, EC-003]
    inputs:
      now: "2026-11-11T10:00:00-05:00"
      recruiter: {id: rec_brooke, name: Brooke Lansing, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Johanna Weiß
        time_zone: Europe/Berlin
        availability:
          - {start: "2026-11-18T14:00:00+01:00", end: "2026-11-18T16:30:00+01:00"}
      interview_plan:
        name: Battery Systems Engineer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_kevin]}
      interviewers:
        - id: int_kevin
          name: Kevin O'Hara
          time_zone: America/New_York
          availability_source: supplied
          supplied_availability:
            - {start: "2026-11-18T08:30:00-05:00", end: "2026-11-18T10:00:00-05:00"}
      conversation:
        - role: candidate
          channel: email
          text: "Guten Tag, ich kann am Mi., 18.11., 14:00-16:30 Uhr. Viele Grüße, Johanna Weiß"
        - role: interviewer
          channel: teams
          text: I'm free 8:30 to 10 on the 18th.
        - role: recruiter
          text: Can you line these up?
    expected:
      disposition: propose_options
      solution_summary: >-
        Wednesday, November 18, 2026: start 8:30-9:00 a.m. EST = 14:30-15:00 CET.
      must:
        - Parse 18.11. as November 18 and 14:00-16:30 as 2:00-4:30 p.m. Munich time (CET).
        - Propose only starts from 8:30 to 9:00 a.m. EST, shown to the candidate in 24-hour CET (14:30-15:00).
        - Ask whether to book.
      must_not:
        - Treat 18.11 as an invalid or month-first date.
        - Treat Kevin's "8:30 to 10" as p.m.
        - Propose a start after 9:00 a.m. EST (ends after Kevin's 10:00).
