  - id: TZ-033
    title: Adelaide, Darwin and Brisbane are three different clocks in January - "2pm Central" breaks Darwin
    category: cross_timezone
    subcategory: australia_summer_zones
    description: >-
      In January Adelaide is UTC+10:30 (daylight time), Darwin UTC+9:30 (no DST) and Brisbane UTC+10 (no DST); the Perth
      candidate is UTC+8. The recruiter assumes Adelaide and Darwin are both "Central" and suggests 2 p.m. Central. With the
      Adelaide panelist busy until 2:00 p.m. ACDT and the Darwin panelist leaving at 2:30 p.m. ACST, a 60-minute panel can
      start only 03:30-04:00 UTC (11:30 a.m.-12:00 p.m. AWST).
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [adelaide, darwin, brisbane, perth, half_hour_offset, central_label_confusion, four_zones]
    requirement_refs: [AVL-10, CON-11, SCH-01, EC-020]
    inputs:
      now: "2027-01-13T09:00:00+10:30"
      recruiter: {id: rec_jess, name: Jess Papadopoulos, time_zone: Australia/Adelaide}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Liam Oyelaran
        time_zone: Australia/Perth
        availability:
          - {start: "2027-01-20T10:00:00+08:00", end: "2027-01-20T13:00:00+08:00"}
      interview_plan:
        name: Mine Planning Engineer - panel
        sessions:
          - {id: P1, title: Technical panel, format: virtual, duration_min: 60, interviewers: [int_bronwyn, int_jarrah, int_sunita], all_required: true}
      interviewers:
        - id: int_bronwyn
          name: Bronwyn Hale
          time_zone: Australia/Adelaide
          availability_source: calendar
          working_hours: {start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-01-20T09:00:00+10:30", end: "2027-01-20T14:00:00+10:30", status: busy}
        - id: int_jarrah
          name: Jarrah Williams
          time_zone: Australia/Darwin
          availability_source: supplied
          supplied_availability:
            - {start: "2027-01-20T09:00:00+09:30", end: "2027-01-20T14:30:00+09:30"}
        - {id: int_sunita, name: Sunita Rao, time_zone: Australia/Brisbane, availability_source: calendar, working_hours: {start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: >-
            Liam (Perth) is free 10am-1pm his time Wed 20 Jan. Bronwyn's free from 2pm, Jarrah till 2:30. Darwin and
            Adelaide are both Central, so 2pm Central works for both - can you check Sunita too?
    expected:
      disposition: propose_options
      solution_summary: >-
        Wednesday, January 20, 2027: start 11:30 a.m.-12:00 p.m. AWST = 2:00-2:30 p.m. ACDT (Adelaide) = 1:00-1:30 p.m. ACST
        (Darwin) = 1:30-2:00 p.m. AEST (Brisbane).
      must:
        - Explain that in January Adelaide (UTC+10:30) is one hour ahead of Darwin (UTC+9:30), and Brisbane (UTC+10) sits between them.
        - Show that 2:00 p.m. in Darwin would run to 3:00 p.m., past Jarrah's 2:30 p.m. limit.
        - Propose starts only from 11:30 a.m. to 12:00 p.m. AWST, listing each panelist's local time.
        - Ask whether to book.
      must_not:
        - Treat Adelaide and Darwin as the same clock in January.
        - Propose any start that ends after 2:30 p.m. ACST or begins before 2:00 p.m. ACDT.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-20T03:30:00Z", time_zone: Australia/Adelaide, expected_local: "2027-01-20T14:00", expected_weekday: Wednesday, expected_utc_offset: "+10:30"}
      - {instant: "2027-01-20T03:30:00Z", time_zone: Australia/Darwin, expected_local: "2027-01-20T13:00", expected_utc_offset: "+09:30"}
      - {instant: "2027-01-20T03:30:00Z", time_zone: Australia/Brisbane, expected_local: "2027-01-20T13:30", expected_utc_offset: "+10:00"}
      - {instant: "2027-01-20T03:30:00Z", time_zone: Australia/Perth, expected_local: "2027-01-20T11:30", expected_utc_offset: "+08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-20T00:00:00+08:00", end: "2027-01-21T00:00:00+08:00"}
      participants:
        candidate: {time_zone: Australia/Perth, available: [["2027-01-20T10:00:00+08:00", "2027-01-20T13:00:00+08:00"]]}
        int_bronwyn:
          time_zone: Australia/Adelaide
          working_hours: {time_zone: Australia/Adelaide, start: "09:00", end: "17:00"}
          busy: [["2027-01-20T09:00:00+10:30", "2027-01-20T14:00:00+10:30"]]
        int_jarrah: {time_zone: Australia/Darwin, available: [["2027-01-20T09:00:00+09:30", "2027-01-20T14:30:00+09:30"]]}
        int_sunita: {time_zone: Australia/Brisbane, working_hours: {time_zone: Australia/Brisbane, start: "09:00", end: "17:00"}}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_bronwyn, int_jarrah, int_sunita]}
      expect_feasible: true
      valid_examples:
