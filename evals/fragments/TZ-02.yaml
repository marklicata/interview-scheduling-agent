      - {instant: "2026-12-03T02:00:00Z", time_zone: Asia/Urumqi, expected_local: "2026-12-03T08:00", expected_utc_offset: "+06:00"}
      - {instant: "2026-12-03T02:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-03T10:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T00:00:00+08:00", end: "2026-12-04T00:00:00+08:00"}
