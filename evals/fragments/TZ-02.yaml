  - id: TZ-032
    title: Adelaide candidate's Tuesday morning is the Los Angeles interviewer's Monday afternoon
    category: cross_timezone
    subcategory: half_hour_offset_date_line
    description: >-
      In February Adelaide is on ACDT (UTC+10:30), 18.5 hours ahead of Los Angeles. The candidate is free Tuesday,
      February 9, 2027, 7:30-9:00 a.m. Adelaide time - which is Monday, February 8, 1:00-2:30 p.m. PST. The recruiter
      proposes "Tuesday 1:30 pm our time", which is Wednesday morning in Adelaide. Valid 45-minute starts are Monday
      1:30-1:45 p.m. PST (Tuesday 8:00-8:15 a.m. ACDT) because the interviewer is busy until 1:30 p.m.
    difficulty: intermediate
