  - id: TZ-046
    title: Candidate in Urumqi states "Beijing time" - do not reinterpret it through the profile's local zone
    category: cross_timezone
    subcategory: stated_reference_zone_differs_from_profile
    description: >-
      The candidate's profile zone is Asia/Urumqi (UTC+6), but she writes "北京时间 周四 12月3日 10:00-12:00" (Beijing time,
