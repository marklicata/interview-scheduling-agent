  - id: PNL-051
    title: Auckland candidate's Wednesday morning is the Seattle panel's Tuesday afternoon
    category: panels_and_near_fit
    subcategory: date_line_panel
    description: >-
      The candidate in Auckland offers Wednesday, February 24, 9:00 a.m.-noon NZDT. The recruiter in the Pacific
      zone assumes that means Wednesday the 24th locally. It is actually Tuesday, February 23, noon-3:00 p.m.
      PST, and one panelist is busy until 1:00 p.m. Tests date-line conversion for a panel and presenting both
      local dates.
