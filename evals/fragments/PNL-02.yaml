  - id: PNL-053
    title: A panelist declines an already booked panel - swap in an approved substitute without moving the candidate
    category: panels_and_near_fit
    subcategory: post_booking_decline_substitute
    description: >-
      A four-person panel is booked for Wednesday 10:00-11:00 a.m. EDT. Hugo declines the invitation. The plan
      pre-approves Leah or Bogdan as substitutes; only Leah is free for the whole hour. Tests minimal-disruption
      repair (same time, same event, one attendee swapped), proposing the update for confirmation rather than
      cancelling and rebooking, and keeping the decline reason out of candidate-facing content.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [post_booking_change, decline, approved_substitute, update_existing_event, minimal_disruption, new_york]
    requirement_refs: [CHG-01, CRD-06, CON-02, ACT-08, COM-01]
    inputs:
      now: "2027-03-26T09:00:00-04:00"
      recruiter: {id: rec_simone, name: Simone Achterberg, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hiroko Abe
        time_zone: America/New_York
        availability:
          - {start: "2027-03-31T09:00:00-04:00", end: "2027-03-31T12:00:00-04:00"}
      interview_plan:
        name: Senior Data Engineer - pipeline panel
        region: US East
