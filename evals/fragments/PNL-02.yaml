        - {id: int_kelechi, name: Kelechi Nwankwo, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2027-03-31T11:00:00-04:00", end: "2027-03-31T12:00:00-04:00", status: busy}]}
        - {id: int_paloma, name: Paloma Ibarra, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_hugo, name: Hugo Brennan, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2027-03-31T10:00:00-04:00", end: "2027-03-31T11:00:00-04:00", status: busy, subject: Board meeting}]}
        - {id: int_leah, name: Leah Goldstein, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_bogdan, name: Bogdan Petrescu, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2027-03-31T10:00:00-04:00", end: "2027-03-31T10:30:00-04:00", status: busy}]}
      case_state:
        existing_bookings:
          - {event_id: evt_pnl_7781, session: P1, start: "2027-03-31T10:00:00-04:00", end: "2027-03-31T11:00:00-04:00", organizer: recruiting@contoso.example,
             attendees: [candidate, int_ayumi, int_kelechi, int_paloma, int_hugo], responses: {int_hugo: declined, int_ayumi: accepted, int_kelechi: accepted, int_paloma: accepted, candidate: accepted}}
      conversation:
        - role: system
          at: "2027-03-26T08:40:00-04:00"
          text: "Hugo Brennan declined 'Pipeline panel - Hiroko Abe' (Wed Mar 31, 10:00-11:00 EDT). Comment: board meeting moved onto this slot, sorry."
        - role: recruiter
          at: "2027-03-26T09:00:00-04:00"
          text: Hugo declined. Fix it without moving Hiroko if at all possible.
