        - {id: int_feng, name: Feng Liu, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
      conversation:
        - role: assistant_ea
          at: "2027-03-26T09:30:00-07:00"
          channel: teams
          text: Hi Jenna - I've moved Pat's 1:1 with Lee to Wednesday, so Pat is free Tue 3-4 for the panel. - Corinne (EA to Pat)
        - role: recruiter
          at: "2027-03-26T10:00:00-07:00"
          channel: chat
          text: Corinne moved Pat's 1:1 (see above). Can you get the panel set up for Tuesday at 3?
    expected:
