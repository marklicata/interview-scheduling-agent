        int_megan:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
          busy: [["2027-02-23T12:00:00-08:00", "2027-02-23T13:00:00-08:00"]]
        int_victor: {time_zone: America/Los_Angeles, working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}}
        int_samira: {time_zone: America/Los_Angeles, working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}}
