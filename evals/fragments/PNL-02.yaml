      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mira Hoffmann
        email: mira.hoffmann@example.net
        time_zone: Europe/Berlin
        availability:
          - {start: "2027-03-04T13:00:00+01:00", end: "2027-03-04T14:00:00+01:00"}
