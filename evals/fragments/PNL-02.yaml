        int_paloma: {time_zone: America/New_York}
        int_hugo: {time_zone: America/New_York, busy: [["2027-03-31T10:00:00-04:00", "2027-03-31T11:00:00-04:00"]]}
        int_leah: {time_zone: America/New_York}
