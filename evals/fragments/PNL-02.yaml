        name: Aroha Ngata
        time_zone: Pacific/Auckland
        availability:
          - {start: "2027-02-24T09:00:00+13:00", end: "2027-02-24T12:00:00+13:00"}
      interview_plan:
        name: Senior Game Designer - design panel
        region: US West
        team: Proseware Games Seattle
        sessions:
          - {id: P1, title: Design panel, format: virtual, duration_min: 60, interviewers: [int_megan, int_victor, int_samira], all_required: true}
      interviewers:
        - {id: int_megan, name: Megan O'Brien, time_zone: America/Los_Angeles, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"},
           calendar: [{start: "2027-02-23T12:00:00-08:00", end: "2027-02-23T13:00:00-08:00", status: busy}]}
        - {id: int_victor, name: Victor Chang, time_zone: America/Los_Angeles, availability_source: calendar,
