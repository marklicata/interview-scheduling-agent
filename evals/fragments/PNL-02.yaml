    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [date_line, auckland, seattle, different_local_dates, two_zone_panel]
    requirement_refs: [AVL-10, CON-11, COM-02, SCH-01]
    inputs:
      now: "2027-02-16T10:00:00-08:00"
