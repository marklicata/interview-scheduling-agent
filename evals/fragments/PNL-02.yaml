        - Propose updating the existing event evt_pnl_7781 (remove Hugo, add Leah) rather than cancelling and recreating it.
        - Explain that Bogdan is busy 10:00-10:30 a.m. and is not eligible for this hour.
        - Mention that updating the attendee list may send an update notice, and keep Hugo's reason out of anything the candidate sees.
        - Ask for confirmation before making the change.
