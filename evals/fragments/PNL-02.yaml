        Aroha's window is Tuesday, February 23, 2027, 12:00-3:00 p.m. PST. With Megan busy until 1:00 p.m., the
        panel can start between 1:00 and 2:00 p.m. PST on Tuesday, February 23 = 10:00-11:00 a.m. NZDT on
        Wednesday, February 24.
