        Corinne reports Pat is free 3:00-4:00 p.m. PDT on Tuesday, March 30, 2027, but the calendar read at
        10:00 a.m. still shows Pat busy 3:00-3:30 p.m. Keep the slot pending - ask the recruiter to confirm with
        Corinne that the change was saved (or ask the agent to recheck shortly). Once the calendar shows Pat
        free or the recruiter confirms Pat will attend, propose 3:00-4:00 p.m. PDT and ask to book.
      must:
        - Attribute the EA's statement to Corinne and state that the current calendar still shows Pat busy 3:00-3:30 p.m. PDT on Tuesday, March 30, 2027.
        - Explain that the two sources disagree and the slot stays pending until the contradiction is resolved.
        - Give the recruiter a concrete step - confirm with Corinne that the 1:1 change was saved, then ask the agent to recheck.
        - Confirm the candidate and the other three panelists are free 3:00-4:00 p.m. PDT.
