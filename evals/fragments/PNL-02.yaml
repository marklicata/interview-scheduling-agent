        P1: {earliest: "2027-03-04T14:00:00+00:00", latest: "2027-03-04T14:00:00+00:00"}

  - id: PNL-035
    title: Fourth panelist moved her own meeting; recruiter confirms booking - recheck then book once
    category: panels_and_near_fit
    subcategory: agreement_confirmed_booking
    description: >-
      Achieng was busy during the only candidate-compatible hour. She moved her own vendor review, and her
      calendar now shows the hour free. The recruiter explicitly asks the agent to book. Tests that the agent
      rechecks the whole panel, books exactly one Teams event under the explicit confirmation, and makes clear
      it did not move anyone's meeting.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [panel]
    tags: [near_fit_resolved, explicit_confirmation, panel_booking, recheck, nairobi, teams_link]
    requirement_refs: [CRD-05, ACT-01, COM-06, COM-07, AVL-05]
    inputs:
      now: "2027-03-03T09:00:00+03:00"
      recruiter: {id: rec_wanjiku, name: Wanjiku Mwangi, time_zone: Africa/Nairobi}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Brian Otieno
        email: brian.otieno@example.com
        time_zone: Africa/Nairobi
        availability:
          - {start: "2027-03-09T10:00:00+03:00", end: "2027-03-09T12:00:00+03:00"}
      interview_plan:
        name: Mobile Money Product Manager - product panel
        region: East Africa
        team: Fabrikam Payments Kenya
        organizer: recruiting-ke@contoso.example
        sessions:
          - {id: P1, title: Product panel, format: virtual, duration_min: 60, interviewers: [int_achieng, int_musa, int_faith, int_kiprop], all_required: true}
      interviewers:
        - {id: int_achieng, name: Achieng Odhiambo, time_zone: Africa/Nairobi, availability_source: calendar,
           calendar: [{start: "2027-03-09T14:00:00+03:00", end: "2027-03-09T15:00:00+03:00", status: busy, subject: Vendor review (moved by organizer)}]}
        - {id: int_musa, name: Musa Abdi, time_zone: Africa/Nairobi, availability_source: calendar, calendar: []}
        - {id: int_faith, name: Faith Wambui, time_zone: Africa/Nairobi, availability_source: calendar,
           calendar: [{start: "2027-03-09T11:00:00+03:00", end: "2027-03-09T12:00:00+03:00", status: busy}]}
        - {id: int_kiprop, name: Daniel Kiprop, time_zone: Africa/Nairobi, availability_source: calendar, calendar: []}
      case_state:
        prior_proposals:
          - {id: NF-1, kind: conditional, session: P1, start: "2027-03-09T10:00:00+03:00", end: "2027-03-09T11:00:00+03:00", unresolved: int_achieng (busy at the time)}
      conversation:
        - role: agent
          at: "2027-03-01T11:00:00+03:00"
          text: >-
            Conditional option - Tuesday, March 9, 2027, 10:00-11:00 a.m. EAT if Achieng can attend instead of a
            busy commitment. Please ask her and let me know; I'll recheck before booking.
        - role: recruiter
          at: "2027-03-03T09:00:00+03:00"
          text: Achieng moved her vendor review herself - she's free 10-11 on Tuesday now. Please book the panel for 10am.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Recheck shows all five free 10:00-11:00 a.m. EAT on Tuesday, March 9, 2027. Create one Teams panel event
        from recruiting-ke@contoso.example and report invitations as sent, not accepted.
      must:
        - Recheck all participants and confirm Achieng's calendar now shows 10:00-11:00 a.m. free.
        - Create exactly one event for 10:00-11:00 a.m. EAT on Tuesday, March 9, 2027 with Brian and all four panelists, with a Teams link.
        - Report that invitations were sent and responses are pending.
        - Make clear the agent did not move any meeting; Achieng rearranged her own calendar.
      must_not:
        - Book 11:00 a.m. or later (Faith is busy 11:00-12:00).
        - Create duplicate events or modify Achieng's moved vendor review.
        - Claim that attendees have accepted.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: P1 product panel for Brian Otieno, notes: "Tue 2027-03-09 10:00-11:00 EAT; organizer recruiting-ke@contoso.example; Teams link for all five attendees."}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-09T08:00:00+03:00", end: "2027-03-09T18:00:00+03:00"}
      participants:
        candidate: {time_zone: Africa/Nairobi, available: [["2027-03-09T10:00:00+03:00", "2027-03-09T12:00:00+03:00"]]}
        int_achieng: {time_zone: Africa/Nairobi, busy: [["2027-03-09T14:00:00+03:00", "2027-03-09T15:00:00+03:00"]]}
        int_musa: {time_zone: Africa/Nairobi}
        int_faith: {time_zone: Africa/Nairobi, busy: [["2027-03-09T11:00:00+03:00", "2027-03-09T12:00:00+03:00"]]}
