        - {id: int_tamar, name: Tamar Cohen, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_bashir, name: Bashir Ahmadi, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_priti, name: Priti Shah, time_zone: Europe/London, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}, calendar: []}
      conversation:
        - role: recruiter
