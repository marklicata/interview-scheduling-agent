  - id: CHG-010
    title: Recruiter moved an event manually in Outlook - respect it while repairing another session
    category: changes_and_rescheduling
    subcategory: manual_outlook_edit_respected
    description: >-
      The agent's case record says S2 is at 10:30, but a fresh Outlook read shows the recruiter manually moved it
      to 2:00 p.m. yesterday. The recruiter now asks to move S3 "to around 2pm" because of a new interviewer
      conflict. Using the stale record would double-book the candidate at 2:00 p.m.; reverting S2 would undo the
      recruiter's own edit. The agent must reflect the current event, disclose the discrepancy, and propose S3
      only where it fits around the actual schedule.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, bar_raiser]
    tags: [manual_edit, stale_record, reconcile_with_outlook, do_not_revert, single_session_repair]
    requirement_refs: [CHG-03, EC-067, EC-085, CHG-01]
