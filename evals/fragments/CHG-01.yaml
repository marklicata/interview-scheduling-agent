  - id: CHG-018
    title: Declined coding session can only move after system design - plan order makes same-day repair infeasible
    category: changes_and_rescheduling
    subcategory: cascade_order_violation
    description: >-
      The only coding interviewer declined and is free only late in the day, which would put coding after system
      design. The plan requires coding before system design. With the plan's order the same-day repair is
      infeasible; the tempting answer swaps S2 and S3. The agent must report the order conflict, keep the locked
      S1, offer the swapped arrangement only as conditional on an explicit order exception from the plan owner,
      and otherwise ask for another day.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, technical_coding, system_design]
    tags: [cascade, order_constraint, infeasible_same_day, conditional_option, singapore, india]
    requirement_refs: [CHG-01, CON-03, SCH-01, EC-063]
    inputs:
      now: "2026-12-07T10:00:00+08:00"
      recruiter: {id: rec_nur, name: Nur Aisyah, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rahul Verma
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-12-09T10:00:00+05:30", end: "2026-12-09T15:30:00+05:30"}
      interview_plan:
        name: Software Engineer II - Singapore loop
        sessions:
          - {id: S1, title: Problem solving, format: virtual, duration_min: 45, interviewers: [int_hui], order: 1}
          - {id: S2, title: Coding, format: virtual, duration_min: 60, interviewers: [int_daniel], order: 2}
          - {id: S3, title: System design, format: virtual, duration_min: 60, interviewers: [int_priyanka], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_marcus], order: 4}
        rules:
          fixed_order: true
          order_rationale: System design builds on the coding exercise, so coding must come first.
          order_exception_owner: Hiring manager (Marcus Lee)
          break_between_sessions_min: 10
          same_day: true
      interviewers:
        - {id: int_hui, name: Tan Hui Min, time_zone: Asia/Singapore, availability_source: calendar}
        - id: int_daniel
          name: Daniel Goh
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-12-09T12:00:00+08:00", end: "2026-12-09T16:00:00+08:00", status: busy}
        - id: int_priyanka
          name: Priyanka Das
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-12-09T12:00:00+08:00", end: "2026-12-09T14:00:00+08:00", status: busy}
            - {start: "2026-12-09T16:30:00+08:00", end: "2026-12-09T18:00:00+08:00", status: busy}
        - id: int_marcus
          name: Marcus Lee
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-12-09T12:00:00+08:00", end: "2026-12-09T16:00:00+08:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_rv_s1, session: S1, start: "2026-12-09T13:00:00+08:00", end: "2026-12-09T13:45:00+08:00", locked: true, attendees: [{id: candidate, response: accepted}, {id: int_hui, response: accepted}]}
          - {event_id: evt_rv_s2, session: S2, start: "2026-12-09T14:00:00+08:00", end: "2026-12-09T15:00:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_daniel, response: declined}]}
          - {event_id: evt_rv_s3, session: S3, start: "2026-12-09T15:10:00+08:00", end: "2026-12-09T16:10:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_priyanka, response: accepted}]}
          - {event_id: evt_rv_s4, session: S4, start: "2026-12-09T16:20:00+08:00", end: "2026-12-09T17:05:00+08:00", attendees: [{id: candidate, response: accepted}, {id: int_marcus, response: accepted}]}
      conversation:
        - role: recruiter
          text: Daniel declined Rahul's coding round on Wednesday - he's free after 4pm though. Can you rework the afternoon?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        With S1 locked at 13:00-13:45 SGT and coding required before system design, no same-day order works:
        coding can start no earlier than 16:00 SGT, and system design would then have to start at 17:10 or later,
        when Priyanka is busy. If Marcus approves an order exception, a conditional option is S3 14:00-15:00, S2
        16:00-17:00, S4 17:10-17:55 SGT (S3 at 11:30 a.m. IST through S4 ending 3:25 p.m. IST). Otherwise ask for Rahul's
        availability on another day.
      must:
        - State that no same-day repair keeps the required coding-before-system-design order, and explain why with exact times.
        - Keep S1 at 13:00-13:45 SGT unchanged.
        - Present the swapped arrangement only as conditional on an explicit order exception from the hiring manager.
        - Show times in both Singapore and India time.
        - Ask whether to pursue the exception or to request the candidate's availability for another day.
      must_not:
        - Propose the swapped order as a normal valid schedule or book it.
        - Move S1.
        - Shorten sessions or drop the 10-minute breaks to make the order fit.
        - Send or update anything.
      side_effects: {external_writes: none}
      clarifying_question_topics: [order_exception_from_hiring_manager, alternative_day_availability]
    local_time_checks:
      - {instant: "2026-12-09T06:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-09T14:00", expected_weekday: Wednesday, expected_utc_offset: "+08:00"}
      - {instant: "2026-12-09T06:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-09T11:30", expected_utc_offset: "+05:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T12:00:00+08:00", end: "2026-12-09T18:00:00+08:00"}
      participants:
        candidate: {time_zone: Asia/Kolkata, available: [["2026-12-09T10:00:00+05:30", "2026-12-09T15:30:00+05:30"]]}
        int_hui: {time_zone: Asia/Singapore, available: [["2026-12-09T13:00:00+08:00", "2026-12-09T13:45:00+08:00"]]}
        int_daniel: {time_zone: Asia/Singapore, busy: [["2026-12-09T12:00:00+08:00", "2026-12-09T16:00:00+08:00"]]}
        int_priyanka: {time_zone: Asia/Singapore, busy: [["2026-12-09T12:00:00+08:00", "2026-12-09T14:00:00+08:00"], ["2026-12-09T16:30:00+08:00", "2026-12-09T18:00:00+08:00"]]}
        int_marcus: {time_zone: Asia/Singapore, busy: [["2026-12-09T12:00:00+08:00", "2026-12-09T16:00:00+08:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_hui]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_daniel]}
        - {id: S3, duration_min: 60, attendees: [candidate, int_priyanka]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_marcus]}
      constraints:
        order: [S1, S2, S3, S4]
        min_gap_min: 10
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-09T13:00:00+08:00", S2: "2026-12-09T16:00:00+08:00", S3: "2026-12-09T14:00:00+08:00", S4: "2026-12-09T17:10:00+08:00", note: Tempting swap - violates the required coding-before-design order.}
        - {S1: "2026-12-09T13:00:00+08:00", S2: "2026-12-09T16:00:00+08:00", S3: "2026-12-09T17:10:00+08:00", S4: "2026-12-09T18:20:00+08:00", note: Priyanka is busy and S4 is outside the window.}

  - id: CHG-019
    title: '"Shuffle the whole morning" - but the executive session is locked, so only one session may move'
    category: changes_and_rescheduling
    subcategory: locked_session_must_not_move
    description: >-
      The candidate develops a new conflict that hits the last morning session. The recruiter casually asks to
      "shuffle the whole morning, start earlier if needed". The executive session is locked by plan policy once
      accepted. The only valid repair moves the affected session to the single 45-minute gap before the locked
      executive session. Moving the executive session earlier is the tempting wrong answer.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, executive]
    tags: [locked_session, minimal_disruption, broad_instruction_narrowed, portugal, nigeria, exact_fit]
    requirement_refs: [CHG-01, GS-015, EC-044]
    inputs:
      now: "2027-01-07T15:00:00+00:00"
      recruiter: {id: rec_ines, name: Ines Carvalho, time_zone: Europe/Lisbon}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Oluwaseun Adeyemi
        time_zone: Africa/Lagos
        availability:
          - {start: "2027-01-12T09:00:00+01:00", end: "2027-01-12T12:00:00+01:00"}
          - {start: "2027-01-12T13:00:00+01:00", end: "2027-01-12T15:00:00+01:00"}
      interview_plan:
        name: Regional Sales Director - virtual loop
        sessions:
          - {id: S1, title: Executive conversation, format: virtual, duration_min: 60, interviewers: [int_carmen]}
          - {id: S2, title: Sales leadership, format: virtual, duration_min: 45, interviewers: [int_pedro]}
          - {id: S3, title: Finance partner, format: virtual, duration_min: 45, interviewers: [int_rui]}
        rules:
          fixed_order: false
          break_between_sessions_min: 15
          locked_sessions_policy: Executive sessions are locked once accepted and confirmed by the executive's assistant; only the executive's office may move them.
      interviewers:
        - {id: int_carmen, name: Carmen Oliveira, role: Vice President, time_zone: Europe/Lisbon, availability_source: calendar}
        - {id: int_pedro, name: Pedro Antunes, time_zone: Europe/Lisbon, availability_source: calendar}
        - id: int_rui
          name: Rui Matos
          time_zone: Europe/Lisbon
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2027-01-12T12:00:00+00:00", end: "2027-01-12T14:00:00+00:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_oa_s1, session: S1, start: "2027-01-12T09:00:00+00:00", end: "2027-01-12T10:00:00+00:00", locked: true, lock_reason: Executive session accepted; confirmed by EA, attendees: [{id: candidate, response: accepted}, {id: int_carmen, response: accepted}]}
          - {event_id: evt_oa_s2, session: S2, start: "2027-01-12T10:15:00+00:00", end: "2027-01-12T11:00:00+00:00", attendees: [{id: candidate, response: accepted}, {id: int_pedro, response: accepted}]}
          - {event_id: evt_oa_s3, session: S3, start: "2027-01-12T11:15:00+00:00", end: "2027-01-12T12:00:00+00:00", attendees: [{id: candidate, response: accepted}, {id: int_rui, response: accepted}]}
      conversation:
        - role: candidate
          at: "2027-01-07T13:20:00+01:00"
          channel: email
          text: Something has come up 12:00-13:00 my time (Lagos) on Tuesday. Could we adjust? Mornings from 9:00 my time are fine.
        - role: recruiter
          text: Just shuffle Seun's morning so it works - start earlier if you need to.
    expected:
      disposition: propose_options
      solution_summary: >-
        Only S3 is affected (11:15-12:00 WET = 12:15-1:00 p.m. WAT). Move S3 alone to 8:00-8:45 a.m. WET
        (9:00-9:45 a.m. WAT) on Tuesday, January 12, 2027, ahead of the locked 9:00 executive session; S1 and S2
        stay unchanged. Ask to update evt_oa_s3.
      must:
        - Identify that only S3 conflicts with the candidate's new 12:00-13:00 WAT conflict.
