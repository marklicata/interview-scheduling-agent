          - {event_id: evt_cm_s2, session: S2, start: "2026-12-03T10:00:00-07:00", end: "2026-12-03T10:45:00-07:00", attendees: [{id: candidate, response: accepted}, {id: int_tevita, response: accepted}]}
          - {event_id: evt_cm_s3, session: S3, start: "2026-12-03T11:00:00-07:00", end: "2026-12-03T11:45:00-07:00", attendees: [{id: candidate, response: accepted}, {id: int_paolo, response: accepted}]}
      conversation:
