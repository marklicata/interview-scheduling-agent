          case_summary_recorded_at: "2026-11-18T17:00:00+09:00"
          summary: >-
            REQ-3307 Mei Lin (Taipei). S1 with Aiko completed November 20. S2 with Kenji booked as evt_ml_s2 for
            December 1, 14:00-15:00 JST after Haruto's one-off confirmation on November 18. Kenji calendar snapshot
