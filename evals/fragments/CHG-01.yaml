        - Explain that S1 is locked under the executive-session policy and will not be moved, despite the "shuffle everything" instruction.
        - Ask for confirmation to update evt_oa_s3.
      must_not:
        - Move or propose moving the locked executive session.
        - Shift S2 or the whole morning when a one-session repair exists.
        - Propose S3 in the 12:00-13:00 WET window, when Rui is busy.
