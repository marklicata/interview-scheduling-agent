          - {id: S4, title: Bar raiser, format: virtual, duration_min: 45, interviewers: [int_nadia]}
        rules: {fixed_order: false, break_between_sessions_min: 10}
      interviewers:
        - {id: int_aaron, name: Aaron Feldman, time_zone: America/Denver, availability_source: calendar}
        - {id: int_bianca, name: Bianca Costa, time_zone: America/Denver, availability_source: calendar}
        - id: int_jiho
          name: Ji-ho Park
          time_zone: America/Denver
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-01-21T11:00:00-07:00", end: "2027-01-21T12:30:00-07:00", status: busy, subject: Customer call}
            - {start: "2027-01-21T15:30:00-07:00", end: "2027-01-21T17:00:00-07:00", status: busy}
        - {id: int_nadia, name: Nadia Petrenko, time_zone: America/Denver, availability_source: calendar}
      case_state:
        agent_record:
          recorded_at: "2027-01-14T10:00:00-07:00"
          sessions: {S1: "09:30-10:15", S2: "10:30-11:15", S3: "11:30-12:15", S4: "16:00-16:45"}
        existing_bookings:
          - {event_id: evt_an_s1, session: S1, start: "2027-01-21T09:30:00-07:00", end: "2027-01-21T10:15:00-07:00", attendees: [{id: candidate, response: accepted}, {id: int_aaron, response: accepted}]}
          - {event_id: evt_an_s2, session: S2, start: "2027-01-21T14:00:00-07:00", end: "2027-01-21T14:45:00-07:00", last_modified_by: rec_kai, last_modified_at: "2027-01-18T16:12:00-07:00", change_source: manual Outlook edit, attendees: [{id: candidate, response: accepted}, {id: int_bianca, response: accepted}]}
          - {event_id: evt_an_s3, session: S3, start: "2027-01-21T11:30:00-07:00", end: "2027-01-21T12:15:00-07:00", attendees: [{id: candidate, response: accepted}, {id: int_jiho, response: accepted}]}
          - {event_id: evt_an_s4, session: S4, start: "2027-01-21T16:00:00-07:00", end: "2027-01-21T16:45:00-07:00", attendees: [{id: candidate, response: accepted}, {id: int_nadia, response: accepted}]}
      conversation:
        - role: recruiter
          text: Ji-ho has a conflict now during Amara's 11:30. Can you move that one to around 2pm? Rest of the day is fine.
