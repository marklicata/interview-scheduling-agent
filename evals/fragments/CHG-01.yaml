  - id: CHG-024
    title: Candidate marks one session tentative - record it, do not treat as accept or decline
    category: changes_and_rescheduling
    subcategory: candidate_tentative_response
    description: >-
      The candidate accepted session 1 but responded "tentative" to session 2 without a comment. The recruiter
      asks whether to move it or treat it as a yes. The agent should track per-session responses, explain that
      tentative is neither acceptance nor decline, recommend the recruiter ask the candidate, and offer a draft
      without sending anything or moving the event.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [tentative_response, per_session_tracking, sent_not_accepted, no_premature_change, uae]
    requirement_refs: [ACT-07, EC-115, COM-03]
    inputs:
      now: "2026-11-23T11:00:00+04:00"
      recruiter: {id: rec_layla, name: Layla Haddad, time_zone: Asia/Dubai}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mohammed Al-Farsi
        time_zone: Asia/Dubai
      interview_plan:
        name: Operations Manager - virtual loop
        sessions:
          - {id: S1, title: Operations case, format: virtual, duration_min: 60, interviewers: [int_omar]}
          - {id: S2, title: Leadership, format: virtual, duration_min: 60, interviewers: [int_sara]}
      interviewers:
        - {id: int_omar, name: Omar Khalil, time_zone: Asia/Dubai, availability_source: calendar}
        - {id: int_sara, name: Sara Nasser, time_zone: Asia/Dubai, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_maf_s1, session: S1, start: "2026-11-25T10:00:00+04:00", end: "2026-11-25T11:00:00+04:00", attendees: [{id: candidate, response: accepted}, {id: int_omar, response: accepted}]}
          - {event_id: evt_maf_s2, session: S2, start: "2026-11-25T11:30:00+04:00", end: "2026-11-25T12:30:00+04:00", attendees: [{id: candidate, response: tentative, comment: ""}, {id: int_sara, response: accepted}]}
      conversation:
        - role: recruiter
          text: Mohammed marked the second interview as tentative. Should I move it? Or just treat it as a yes?
    expected:
      disposition: acknowledge_and_record
      solution_summary: >-
        Record that S2 (Wednesday, November 25, 2026, 11:30 a.m.-12:30 p.m. GST) is tentative for the candidate
        and S1 is accepted. Tentative is neither acceptance nor decline; nothing should move yet. Suggest the
        recruiter ask Mohammed whether 11:30 works or he needs a different time, and offer a short draft.
      must:
        - Report per-session status - S1 accepted, S2 tentative - and that S2 is not confirmed.
        - Recommend that the recruiter ask the candidate about S2 and offer a short draft message for review.
        - Offer to find alternative S2 times if the candidate asks for a change.
      must_not:
        - Treat tentative as acceptance and report the loop as fully confirmed.
        - Treat tentative as a decline and move or cancel S2.
        - Send any message or update any event.
      side_effects: {external_writes: none}

  - id: CHG-025
    title: '"Push everything 30 minutes" collides with one interviewer - same push works with two sessions swapped'
    category: changes_and_rescheduling
    subcategory: shift_all_with_conflict
    description: >-
      A Brisbane candidate asks to push a Sydney-run loop by 30 minutes because of daycare drop-off. Brisbane has
      no daylight saving, so it is one hour behind Sydney in December. The literal push puts S2 in an interviewer
      conflict. Because the plan has no fixed order, swapping S1 and S2 achieves the same 30-minute later start
      with every interviewer free; the agent should explain the conflict and propose the swap.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [shift_all, conflict_on_shift, resequence, australia, brisbane_no_dst, sydney_dst]
    requirement_refs: [CHG-01, SCH-01, AVL-10]
    inputs:
      now: "2026-12-03T16:00:00+11:00"
      recruiter: {id: rec_olivia, name: Olivia Tran, time_zone: Australia/Sydney}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Liam O'Connor
        time_zone: Australia/Brisbane
        availability:
          - {start: "2026-12-08T09:00:00+10:00", end: "2026-12-08T12:00:00+10:00"}
      interview_plan:
        name: Graduate Data Analyst - virtual loop
        sessions:
          - {id: S1, title: SQL exercise, format: virtual, duration_min: 45, interviewers: [int_georgia]}
          - {id: S2, title: Stakeholder scenario, format: virtual, duration_min: 45, interviewers: [int_hamish]}
          - {id: S3, title: Team lead, format: virtual, duration_min: 45, interviewers: [int_priya]}
        rules: {fixed_order: false, break_between_sessions_min: 15}
      interviewers:
        - {id: int_georgia, name: Georgia Papadopoulos, time_zone: Australia/Sydney, availability_source: calendar, calendar: []}
        - id: int_hamish
          name: Hamish McLeod
          time_zone: Australia/Sydney
          availability_source: calendar
          calendar:
            - {start: "2026-12-08T11:00:00+11:00", end: "2026-12-08T11:30:00+11:00", status: busy}
            - {start: "2026-12-08T12:30:00+11:00", end: "2026-12-08T13:30:00+11:00", status: busy}
        - id: int_priya
          name: Priya Raghavan
          time_zone: Australia/Sydney
          availability_source: calendar
          calendar:
            - {start: "2026-12-08T09:00:00+11:00", end: "2026-12-08T10:00:00+11:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_lo_s1, session: S1, start: "2026-12-08T09:30:00+11:00", end: "2026-12-08T10:15:00+11:00", attendees: [{id: candidate, response: accepted}, {id: int_georgia, response: accepted}]}
          - {event_id: evt_lo_s2, session: S2, start: "2026-12-08T10:30:00+11:00", end: "2026-12-08T11:15:00+11:00", attendees: [{id: candidate, response: accepted}, {id: int_hamish, response: accepted}]}
          - {event_id: evt_lo_s3, session: S3, start: "2026-12-08T11:30:00+11:00", end: "2026-12-08T12:15:00+11:00", attendees: [{id: candidate, response: accepted}, {id: int_priya, response: accepted}]}
      conversation:
        - role: candidate
          at: "2026-12-03T14:10:00+10:00"
          channel: email
          text: >-
            Hi Olivia, would it be possible to push everything back 30 minutes on Tuesday? The 8:30 start (my
            time) is tough with daycare drop-off. I can do 9:00 a.m. to 12:00 noon Brisbane time.
        - role: recruiter
          text: Can we just push Liam's whole Tuesday back 30 min?
    expected:
      disposition: propose_options
      solution_summary: >-
        A straight 30-minute push puts S2 at 11:00-11:45 a.m. AEDT, overlapping Hamish's 11:00-11:30 commitment.
        Instead, on Tuesday, December 8, 2026: S2 10:00-10:45, S1 11:00-11:45, S3 12:00-12:45 AEDT (9:00-9:45,
        10:00-10:45, 11:00-11:45 a.m. AEST). Same 30-minute-later start; S1 and S2 swap. Ask to update all three.
      must:
        - Explain that the literal push conflicts with Hamish at 11:00-11:30 a.m. AEDT.
        - Propose S2 10:00, S1 11:00, S3 12:00 AEDT (9:00, 10:00, 11:00 a.m. AEST), noting the plan allows any order.
        - Show candidate-facing times in Brisbane time and note Brisbane is one hour behind Sydney in December.
        - Present the change as three updates to the existing events and ask for confirmation.
      must_not:
        - Propose the literal push with S2 at 11:00 a.m. AEDT.
        - Propose anything starting before 9:00 a.m. or ending after 12:00 noon Brisbane time.
        - Treat Brisbane and Sydney as the same offset.
        - Update anything without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-07T23:00:00Z", time_zone: Australia/Sydney, expected_local: "2026-12-08T10:00", expected_weekday: Tuesday, expected_utc_offset: "+11:00"}
      - {instant: "2026-12-07T23:00:00Z", time_zone: Australia/Brisbane, expected_local: "2026-12-08T09:00", expected_utc_offset: "+10:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T08:00:00+11:00", end: "2026-12-08T14:00:00+11:00"}
      participants:
        candidate: {time_zone: Australia/Brisbane, available: [["2026-12-08T09:00:00+10:00", "2026-12-08T12:00:00+10:00"]]}
        int_georgia: {time_zone: Australia/Sydney}
        int_hamish: {time_zone: Australia/Sydney, busy: [["2026-12-08T11:00:00+11:00", "2026-12-08T11:30:00+11:00"], ["2026-12-08T12:30:00+11:00", "2026-12-08T13:30:00+11:00"]]}
        int_priya: {time_zone: Australia/Sydney, busy: [["2026-12-08T09:00:00+11:00", "2026-12-08T10:00:00+11:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_georgia]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_hamish]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_priya]}
      constraints:
        min_gap_min: 15
      expect_feasible: true
      valid_examples:
        - {S2: "2026-12-08T10:00:00+11:00", S1: "2026-12-08T11:00:00+11:00", S3: "2026-12-08T12:00:00+11:00"}
      invalid_examples:
        - {S1: "2026-12-08T10:00:00+11:00", S2: "2026-12-08T11:00:00+11:00", S3: "2026-12-08T12:00:00+11:00", note: Literal push - Hamish is busy 11:00-11:30.}
        - {S1: "2026-12-08T09:30:00+11:00", S2: "2026-12-08T10:30:00+11:00", S3: "2026-12-08T11:30:00+11:00", note: "Original times start at 8:30 a.m. Brisbane, before the candidate's 9:00."}
