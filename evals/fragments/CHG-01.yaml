          busy: [["2027-01-21T11:00:00-07:00", "2027-01-21T12:30:00-07:00"], ["2027-01-21T15:30:00-07:00", "2027-01-21T17:00:00-07:00"]]
      sessions:
        - {id: S3, duration_min: 45, attendees: [candidate, int_jiho]}
      expect_feasible: true
      valid_examples:
        - {S3: "2027-01-21T12:30:00-07:00"}
      invalid_examples:
        - {S3: "2027-01-21T14:00:00-07:00", note: Uses the stale record; overlaps the manually moved S2.}
        - {S3: "2027-01-21T11:30:00-07:00", note: Ji-ho's customer call.}
      valid_start_bounds:
        S3: {earliest: "2027-01-21T12:30:00-07:00", latest: "2027-01-21T13:05:00-07:00"}

  - id: CHG-011
    title: Week-later return - move the second interview using retained context and a fresh calendar read
    category: changes_and_rescheduling
    subcategory: week_later_repair_retained_context
    description: >-
      The recruiter returns seven days after booking and asks to move the candidate's second interview. The case
      memory has the plan, people and booking, so no re-intake is needed, but the interviewer calendar snapshot
      from a week ago is stale: the interviewer is now busy on the afternoon the snapshot showed free. The
      one-off approval from last week does not cover a move, so the agent must propose and ask.
