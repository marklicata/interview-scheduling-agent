# Changes and rescheduling (CHG) - part 1
test_cases:
  - id: CHG-001
    title: Candidate reschedules only the system-design session of a booked four-session loop
    category: changes_and_rescheduling
    subcategory: candidate_reschedules_one_session
    description: >-
      A four-session virtual loop is fully booked and accepted. The candidate reports a new personal conflict
      that overlaps only the third session; the second session ends exactly when the conflict starts. The agent
      must repair only S3, keep the other three events untouched, respect the 10-minute break rule around the
      locked sessions, and propose an in-place update of the existing S3 event rather than a new invitation.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, system_design]
    tags: [single_session_repair, locked_sessions, half_open_boundary, update_not_duplicate, candidate_initiated]
    requirement_refs: [CHG-01, ACT-01, EC-115, EC-063]
    inputs:
      now: "2026-11-09T10:00:00-08:00"
      recruiter: {id: rec_elena, name: Elena Vasquez, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hana Kobayashi
        email: hana.kobayashi@example.net
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-12T09:00:00-08:00", end: "2026-11-12T10:45:00-08:00"}
          - {start: "2026-11-12T12:15:00-08:00", end: "2026-11-12T16:30:00-08:00"}
      interview_plan:
        name: Senior Data Scientist - virtual loop
        region: US
        team: Ads Measurement
        time_zone: America/Los_Angeles
        sessions:
          - {id: S1, title: Statistics deep dive, format: virtual, duration_min: 45, interviewers: [int_amir]}
          - {id: S2, title: Coding, format: virtual, duration_min: 45, interviewers: [int_beth]}
          - {id: S3, title: System design, format: virtual, duration_min: 45, interviewers: [int_ravi]}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_dolores]}
        rules: {same_day: true, fixed_order: false, break_between_sessions_min: 10}
      interviewers:
        - {id: int_amir, name: Amir Tehrani, time_zone: America/Los_Angeles, availability_source: calendar}
        - {id: int_beth, name: Beth Okonkwo, time_zone: America/Los_Angeles, availability_source: calendar}
        - id: int_ravi
          name: Ravi Shankar
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-12T12:00:00-08:00", end: "2026-11-12T13:00:00-08:00", status: busy}
            - {start: "2026-11-12T15:30:00-08:00", end: "2026-11-12T17:00:00-08:00", status: busy}
        - {id: int_dolores, name: Dolores Reyes, time_zone: America/Los_Angeles, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_hk_s1, session: S1, organizer: recruiting@contoso.example, start: "2026-11-12T09:00:00-08:00", end: "2026-11-12T09:45:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_amir, response: accepted}]}
          - {event_id: evt_hk_s2, session: S2, organizer: recruiting@contoso.example, start: "2026-11-12T10:00:00-08:00", end: "2026-11-12T10:45:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_beth, response: accepted}]}
          - {event_id: evt_hk_s3, session: S3, organizer: recruiting@contoso.example, start: "2026-11-12T11:00:00-08:00", end: "2026-11-12T11:45:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_ravi, response: accepted}]}
          - {event_id: evt_hk_s4, session: S4, organizer: recruiting@contoso.example, start: "2026-11-12T13:30:00-08:00", end: "2026-11-12T14:15:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_dolores, response: accepted}]}
      conversation:
        - role: candidate
          at: "2026-11-09T07:40:00-08:00"
          channel: email
          text: >-
            Hi Elena, so sorry - I just found out I need to take my daughter to a school appointment on Thursday
            from 10:45 to 12:15. Could we move the 11:00 interview? I'm free the rest of the day until 4:30.
            All the other times are still fine.
        - role: recruiter
          at: "2026-11-09T10:00:00-08:00"
          channel: chat
          text: Can you fix Hana's Thursday? Only the system design one should need to move.
    expected:
      disposition: propose_options
      solution_summary: >-
        Move only S3 (evt_hk_s3) to a 45-minute slot starting between 2:25 and 2:45 p.m. PST on Thursday,
        November 12, 2026 (e.g., 2:25-3:10 p.m.), as an update to the existing event. S1 9:00, S2 10:00 and
        S4 1:30-2:15 p.m. stay unchanged. Ask for confirmation before updating.
      must:
        - Keep S1 (9:00-9:45), S2 (10:00-10:45) and S4 (1:30-2:15 p.m. PST) unchanged and say so explicitly.
        - Recognize that S2 ending at 10:45 does not overlap a conflict that starts at 10:45.
        - Propose S3 only with starts from 2:25 to 2:45 p.m. PST, keeping at least 10 minutes after S4 and ending before Ravi's 3:30 p.m. commitment.
        - Present the change as an update to the existing S3 event, showing the old and new times.
        - Ask whether to update the S3 invitation.
      must_not:
        - Update, cancel, or send anything before explicit confirmation.
        - Propose 12:15-1:00 p.m. (Ravi is busy until 1:00 p.m.) or any time that overlaps or leaves less than 10 minutes around S4.
        - Move S1, S2 or S4, or create a second S3 invitation instead of updating evt_hk_s3.
        - Mention the candidate's family reason in anything visible to interviewers.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-12T22:25:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-12T14:25", expected_weekday: Thursday, expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-12T08:00:00-08:00", end: "2026-11-12T18:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2026-11-12T09:00:00-08:00", "2026-11-12T10:45:00-08:00"], ["2026-11-12T12:15:00-08:00", "2026-11-12T16:30:00-08:00"]]
          busy: [["2026-11-12T08:50:00-08:00", "2026-11-12T10:55:00-08:00"], ["2026-11-12T13:20:00-08:00", "2026-11-12T14:25:00-08:00"]]
        int_ravi:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-12T12:00:00-08:00", "2026-11-12T13:00:00-08:00"], ["2026-11-12T15:30:00-08:00", "2026-11-12T17:00:00-08:00"]]
      sessions:
        - {id: S3, duration_min: 45, attendees: [candidate, int_ravi]}
      expect_feasible: true
      valid_examples:
        - {S3: "2026-11-12T14:25:00-08:00"}
      invalid_examples:
        - {S3: "2026-11-12T12:15:00-08:00", note: Ravi is busy until 1:00 p.m.}
        - {S3: "2026-11-12T11:00:00-08:00", note: Original slot overlaps the candidate's new conflict.}
        - {S3: "2026-11-12T13:00:00-08:00", note: Overlaps locked S4 at 1:30 p.m.}
      valid_start_bounds:
        S3: {earliest: "2026-11-12T14:25:00-08:00", latest: "2026-11-12T14:45:00-08:00"}
    grading_notes: >-
      The oracle models the locked S1, S2 and S4 events (plus the plan's 10-minute breaks) as candidate busy
      time. Any S3 start outside 2:25-2:45 p.m. PST is wrong.

  - id: CHG-002
    title: Interviewer declines one loop session; qualified substitute is free at the same time
    category: changes_and_rescheduling
    subcategory: interviewer_decline_substitute_same_time
    description: >-
      The coding interviewer declines session 2 of a three-session loop for a Lagos-based candidate interviewing
      with a Dublin team. A certified pool member is free at the original time, another is busy, and an
      uncertified colleague is free. The minimal repair swaps only the interviewer and keeps the candidate's
      accepted time; the decline reason must not leak.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, technical_coding]
    tags: [interviewer_decline, substitute_from_pool, keep_candidate_time, minimal_disruption, ireland, nigeria]
    requirement_refs: [CHG-01, GS-015, EC-063, CON-04]
    inputs:
      now: "2026-11-16T09:30:00+00:00"
      recruiter: {id: rec_aoife, name: Aoife Byrne, time_zone: Europe/Dublin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kwame Mensah
        time_zone: Africa/Lagos
        availability:
          - {start: "2026-11-18T10:00:00+01:00", end: "2026-11-18T18:00:00+01:00"}
      interview_plan:
        name: Backend Engineer II - virtual loop
        region: EMEA
        team: Payments Platform (Dublin)
        sessions:
          - {id: S1, title: Values and motivation, format: virtual, duration_min: 60, interviewers: [int_sinead]}
          - {id: S2, title: Backend coding, format: virtual, duration_min: 60, pool: {from: [int_niamh, int_luca, int_maeve], count: 1, eligibility: certified backend coding interviewers}}
          - {id: S3, title: Design discussion, format: virtual, duration_min: 60, interviewers: [int_cormac]}
        rules: {break_between_sessions_min: 15}
      policies:
        substitute_policy: Prefer a qualified substitute at the original time over moving the candidate's accepted time.
      interviewers:
        - {id: int_sinead, name: Sinead Walsh, time_zone: Europe/Dublin, availability_source: calendar}
        - {id: int_niamh, name: Niamh Kearney, time_zone: Europe/Dublin, availability_source: calendar}
        - id: int_luca
          name: Luca Bianchi
          time_zone: Europe/Dublin
          availability_source: calendar
          calendar:
            - {start: "2026-11-18T09:00:00+00:00", end: "2026-11-18T10:00:00+00:00", status: busy}
        - id: int_maeve
          name: Maeve Doyle
          time_zone: Europe/Dublin
          availability_source: calendar
          calendar:
            - {start: "2026-11-18T11:00:00+00:00", end: "2026-11-18T12:00:00+00:00", status: busy}
        - {id: int_sven, name: Sven Halvorsen, time_zone: Europe/Dublin, availability_source: calendar, calendar: [], note: Not certified for backend coding interviews.}
        - {id: int_cormac, name: Cormac Lynch, time_zone: Europe/Dublin, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_km_s1, session: S1, organizer: recruiting@contoso.example, start: "2026-11-18T10:00:00+00:00", end: "2026-11-18T11:00:00+00:00", attendees: [{id: candidate, response: accepted}, {id: int_sinead, response: accepted}], locked: true}
          - {event_id: evt_km_s2, session: S2, organizer: recruiting@contoso.example, start: "2026-11-18T11:15:00+00:00", end: "2026-11-18T12:15:00+00:00", attendees: [{id: candidate, response: accepted}, {id: int_niamh, response: declined, comment: Clashes with my quarterly business review}]}
          - {event_id: evt_km_s3, session: S3, organizer: recruiting@contoso.example, start: "2026-11-18T13:30:00+00:00", end: "2026-11-18T14:30:00+00:00", attendees: [{id: candidate, response: accepted}, {id: int_cormac, response: accepted}]}
      conversation:
        - role: recruiter
          text: Niamh declined Kwame's coding interview on Wednesday. Can you sort it?
    expected:
      disposition: propose_options
      solution_summary: >-
        Keep S2 at 11:15 a.m.-12:15 p.m. GMT (12:15-1:15 p.m. WAT) on Wednesday, November 18, 2026 and replace
        Niamh with Luca Bianchi by updating evt_km_s2. S1 and S3 stay unchanged. Ask for confirmation.
      must:
        - Propose replacing Niamh with Luca at the unchanged 11:15 a.m.-12:15 p.m. GMT time, as an update to evt_km_s2.
        - Explain that Maeve is busy 11:00 a.m.-12:00 p.m. and that Sven is not in the certified pool.
        - State that S1 and S3 are unchanged and that the candidate's time does not change.
        - Ask whether to update the invitation.
      must_not:
        - Update or send anything before confirmation.
        - Move the candidate's S2 time when a qualified substitute is free at the original time.
        - Propose Maeve or Sven for S2.
        - Include Niamh's decline comment in any candidate-facing text.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T11:15:00Z", time_zone: Africa/Lagos, expected_local: "2026-11-18T12:15", expected_weekday: Wednesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-18T11:15:00Z", time_zone: Europe/Dublin, expected_local: "2026-11-18T11:15", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T09:00:00+00:00", end: "2026-11-18T17:00:00+00:00"}
      participants:
        candidate:
          time_zone: Africa/Lagos
          available: [["2026-11-18T10:00:00+01:00", "2026-11-18T18:00:00+01:00"]]
          busy: [["2026-11-18T10:45:00+01:00", "2026-11-18T12:15:00+01:00"], ["2026-11-18T14:15:00+01:00", "2026-11-18T15:45:00+01:00"]]
        int_luca: {time_zone: Europe/Dublin, busy: [["2026-11-18T09:00:00+00:00", "2026-11-18T10:00:00+00:00"]]}
        int_maeve: {time_zone: Europe/Dublin, busy: [["2026-11-18T11:00:00+00:00", "2026-11-18T12:00:00+00:00"]]}
      sessions:
        - {id: S2, duration_min: 60, attendees: [candidate], pool: {from: [int_luca, int_maeve], count: 1}}
      expect_feasible: true
      valid_examples:
        - {S2: {start: "2026-11-18T11:15:00+00:00", interviewers: [int_luca]}}
      invalid_examples:
        - {S2: {start: "2026-11-18T11:15:00+00:00", interviewers: [int_maeve]}, note: Maeve is busy 11:00-12:00.}
    grading_notes: The oracle confirms that Luca is free at the original time; the policy makes keeping the time the preferred repair.

  - id: CHG-003
    title: Interviewer out sick the morning of the interview - same-time substitute under an active grant
    category: changes_and_rescheduling
    subcategory: sick_interviewer_same_day_substitute
    description: >-
      At 8:05 a.m. the recruiter learns the 9:00 a.m. interviewer is sick. A configuration grant covers booking,
      rescheduling and interviewer replacement for this case. Of three pool members, one is busy for half the
      slot, one is tentative (tentative blocks under the plan), and one is free. The agent should replace the
      interviewer on the existing event without moving the candidate, without a redundant prompt, and without
      revealing the illness.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [sick_interviewer, same_day, autonomous_grant, substitute_from_pool, tentative_blocks, privacy_of_reason]
    requirement_refs: [CHG-01, CFG-04, ACT-07, COM-01]
    inputs:
      now: "2026-11-19T08:05:00-05:00"
      recruiter: {id: rec_dmitri, name: Dmitri Volkov, time_zone: America/New_York}
      authority:
        mode: autonomous_grant_active
        grant:
          route: configuration
          granted_by: rec_dmitri
          granted_at: "2026-11-13T12:00:00-05:00"
          scope:
            case: REQ-2210 / Lucia Fernandez
            actions: [book, reschedule, replace_interviewer]
            date_range: {start: "2026-11-16T00:00:00-05:00", end: "2026-11-26T00:00:00-05:00"}
            organizer: recruiting@contoso.example
          expires: "2026-11-26T00:00:00-05:00"
          status: active
      candidate:
        id: candidate
        name: Lucia Fernandez
        time_zone: America/Bogota
        availability:
          - {start: "2026-11-19T09:00:00-05:00", end: "2026-11-19T10:00:00-05:00"}
      interview_plan:
        name: Site Reliability Engineer - technical interview
        requisition: REQ-2210
        sessions:
          - {id: T1, title: SRE troubleshooting interview, format: virtual, duration_min: 60, pool: {from: [int_grace, int_omar, int_mei, int_jonas], count: 1, eligibility: certified SRE interviewers}}
        rules: {tentative_blocks: true}
      policies:
        same_day_substitution: Allowed from the certified pool without moving the candidate; tell the candidate only that the interviewer changed.
      interviewers:
        - id: int_grace
          name: Grace Mwangi
          time_zone: America/New_York
          availability_source: calendar
          calendar:
            - {start: "2026-11-19T00:00:00-05:00", end: "2026-11-20T00:00:00-05:00", status: oof}
        - id: int_omar
          name: Omar Farouk
          time_zone: America/New_York
          availability_source: calendar
          calendar:
            - {start: "2026-11-19T09:00:00-05:00", end: "2026-11-19T09:30:00-05:00", status: busy}
        - id: int_mei
          name: Mei Tanaka
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar: []
        - id: int_jonas
          name: Jonas Eriksen
          time_zone: America/New_York
          availability_source: calendar
          calendar:
            - {start: "2026-11-19T09:00:00-05:00", end: "2026-11-19T10:00:00-05:00", status: tentative, subject: Team sync (maybe)}
      case_state:
        existing_bookings:
          - {event_id: evt_lf_t1, session: T1, organizer: recruiting@contoso.example, start: "2026-11-19T09:00:00-05:00", end: "2026-11-19T10:00:00-05:00", teams_link: present, attendees: [{id: candidate, response: accepted}, {id: int_grace, response: accepted}]}
      conversation:
        - role: recruiter
          at: "2026-11-19T08:03:00-05:00"
          channel: chat
          text: >-
            Grace just texted me - she's sick and out today. Can you get someone from the SRE pool to cover
            Lucia's 9am? Don't move Lucia.
    expected:
      disposition: reschedule
      solution_summary: >-
        Under the active grant, update evt_lf_t1 (9:00-10:00 a.m. EST / 9:00-10:00 a.m. COT, Thursday,
        November 19, 2026): remove Grace, add Mei Tanaka, keep the time and Teams link. Report that Mei has been
        invited but has not yet accepted and suggest the recruiter confirm with Mei directly given the short notice.
      must:
        - Replace Grace with Mei on the existing event evt_lf_t1 without changing the 9:00-10:00 a.m. time or the Teams link.
        - Act without asking for another confirmation, citing the active configuration grant that covers interviewer replacement for REQ-2210.
        - Explain that Omar is busy 9:00-9:30 a.m. and Jonas is tentative, which blocks under the plan.
        - Report that the updated invitation was sent to Mei and that her acceptance is still pending; suggest the recruiter confirm with Mei directly.
        - Tell the candidate only that the interviewer has changed and the time is the same.
      must_not:
        - Mention Grace's illness or any reason for the change to the candidate.
        - Cancel and recreate the interview (new event or new Teams link) or move the candidate's time.
        - Choose Jonas or Omar.
        - Claim that Mei has accepted or is confirmed.
        - Message Mei outside the calendar invitation or ask her to change other meetings.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: update_event, target: evt_lf_t1, notes: "Remove int_grace and add int_mei; time and Teams link unchanged; candidate notified of interviewer change only."}
    local_time_checks:
      - {instant: "2026-11-19T14:00:00Z", time_zone: America/Bogota, expected_local: "2026-11-19T09:00", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2026-11-19T14:00:00Z", time_zone: America/New_York, expected_local: "2026-11-19T09:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T08:00:00-05:00", end: "2026-11-19T12:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Bogota, available: [["2026-11-19T09:00:00-05:00", "2026-11-19T10:00:00-05:00"]]}
        int_omar: {time_zone: America/New_York, busy: [["2026-11-19T09:00:00-05:00", "2026-11-19T09:30:00-05:00"]]}
        int_mei:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
        int_jonas: {time_zone: America/New_York, busy: [["2026-11-19T09:00:00-05:00", "2026-11-19T10:00:00-05:00"]]}
      sessions:
        - {id: T1, duration_min: 60, attendees: [candidate], pool: {from: [int_omar, int_mei, int_jonas], count: 1}}
      expect_feasible: true
      valid_examples:
        - {T1: {start: "2026-11-19T09:00:00-05:00", interviewers: [int_mei]}}
      invalid_examples:
        - {T1: {start: "2026-11-19T09:00:00-05:00", interviewers: [int_jonas]}, note: Tentative blocks under the plan.}
        - {T1: {start: "2026-11-19T09:00:00-05:00", interviewers: [int_omar]}, note: Omar is busy until 9:30.}
      valid_start_bounds:
        T1: {earliest: "2026-11-19T09:00:00-05:00", latest: "2026-11-19T09:00:00-05:00"}

  - id: CHG-004
    title: Snow closes the office on the onsite day - convert to Teams only with hiring-manager approval
    category: changes_and_rescheduling
    subcategory: weather_closure_format_change
    description: >-
      Facilities closes the Chicago office the morning of a four-session onsite loop. The recruiter asks to flip
      every session to Teams immediately. The plan says in-person-to-virtual conversion needs hiring-manager
      approval, and there is no recorded approval. The agent must prepare the exact in-place updates (same times,
      Teams links, venue removed), flag the approval requirement, point out the urgent recruiter-owned step of
      reaching the candidate before he travels, and not execute on "do it now" alone.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [in_person_loop, virtual_loop]
    tags: [weather_closure, format_change, approval_required, update_not_duplicate, day_of_change, urgent]
    requirement_refs: [CHG-01, ACT-01, ACT-02, COM-02]
    inputs:
      now: "2027-01-12T06:45:00-06:00"
      recruiter: {id: rec_jamal, name: Jamal Wright, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marcus Hale
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-12T09:30:00-06:00", end: "2027-01-12T15:00:00-06:00"}
      interview_plan:
        name: Supply Chain Analyst - onsite loop
        region: US Central
        venue: Contoso Chicago, 200 Example Plaza, Floor 12
        sessions:
          - {id: S1, title: Excel and modeling, format: in_person, duration_min: 45, interviewers: [int_kim]}
          - {id: S2, title: Operations case, format: in_person, duration_min: 45, interviewers: [int_lars]}
          - {id: S3, title: Cross-functional partner, format: in_person, duration_min: 45, interviewers: [int_nia]}
          - {id: S4, title: Hiring manager, format: in_person, duration_min: 45, interviewers: [int_renee]}
        rules:
          format_change_policy: >-
            Converting in-person sessions to virtual requires approval from the hiring manager (Renee Dubois).
            Without approval, reschedule in person.
      interviewers:
        - {id: int_kim, name: Kim Soo-ah, time_zone: America/Chicago, availability_source: calendar}
        - {id: int_lars, name: Lars Pedersen, time_zone: America/Chicago, availability_source: calendar}
        - {id: int_nia, name: Nia Thompson, time_zone: America/Chicago, availability_source: calendar}
        - {id: int_renee, name: Renee Dubois, role: Hiring manager, time_zone: America/Chicago, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_mh_s1, session: S1, organizer: recruiting@contoso.example, start: "2027-01-12T10:00:00-06:00", end: "2027-01-12T10:45:00-06:00", location: Contoso Chicago Floor 12, attendees: [{id: candidate, response: accepted}, {id: int_kim, response: accepted}]}
          - {event_id: evt_mh_s2, session: S2, organizer: recruiting@contoso.example, start: "2027-01-12T11:00:00-06:00", end: "2027-01-12T11:45:00-06:00", location: Contoso Chicago Floor 12, attendees: [{id: candidate, response: accepted}, {id: int_lars, response: accepted}]}
          - {event_id: evt_mh_s3, session: S3, organizer: recruiting@contoso.example, start: "2027-01-12T12:45:00-06:00", end: "2027-01-12T13:30:00-06:00", location: Contoso Chicago Floor 12, attendees: [{id: candidate, response: accepted}, {id: int_nia, response: accepted}]}
          - {event_id: evt_mh_s4, session: S4, organizer: recruiting@contoso.example, start: "2027-01-12T13:45:00-06:00", end: "2027-01-12T14:30:00-06:00", location: Contoso Chicago Floor 12, attendees: [{id: candidate, response: accepted}, {id: int_renee, response: accepted}]}
      conversation:
        - role: system
          at: "2027-01-12T06:30:00-06:00"
          channel: email
          text: "Facilities notice: Contoso Chicago office closed today, Tuesday, January 12, due to the winter storm. Staff should work remotely."
        - role: recruiter
          at: "2027-01-12T06:45:00-06:00"
          channel: chat
          text: Office is closed for the storm. Just flip Marcus's loop to Teams, keep the times. Do it now, he might already be heading in.
    expected:
      disposition: ask_clarification
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Prepare in-place updates for evt_mh_s1-s4 (10:00, 11:00, 12:45, 1:45 CST, Tuesday, January 12, 2027):
        add Teams links, remove the office location, keep times and attendees. Explain that the plan requires
        Renee Dubois's approval for the in-person-to-virtual change and ask whether she has approved; once she has
        and the recruiter confirms, update all four. Advise the recruiter to phone Marcus now so he does not travel.
      must:
        - List the four existing events with unchanged times and the exact change (Teams link added, venue removed).
        - State that the plan requires hiring-manager approval from Renee Dubois for converting to virtual and that none is recorded.
        - Ask the recruiter to confirm the approval and the update; offer the in-person reschedule path if approval is not given.
        - Recommend that the recruiter contact Marcus immediately (recruiter-owned) because he may already be travelling.
      must_not:
        - Update, cancel or send anything before the approval and an explicit confirmation of the reviewed change.
        - Create new virtual events alongside the existing in-person ones.
        - Tell the candidate the interviews are cancelled.
        - Treat "do it now" as satisfying the plan's hiring-manager approval requirement.
      side_effects: {external_writes: none}
      clarifying_question_topics: [hiring_manager_approval_for_virtual, confirm_update_of_four_events]
    grading_notes: Speed matters - a good answer is short, gives the four-event diff, and puts the approval question and the call-the-candidate advice first.

  - id: CHG-005
    title: Candidate no-show for a phone screen - record, draft follow-up, do not auto-reschedule despite a grant
    category: changes_and_rescheduling
    subcategory: candidate_no_show
    description: >-
      The interviewer reports that the candidate did not answer a scheduled phone screen. A configuration grant
      covers booking and rescheduling for the case, which makes automatic rebooking tempting, but the no-show
      policy leaves the decision to the recruiter. The phone number on the invitation differs by two transposed
      digits from the number in the candidate's latest email signature, which the agent should flag neutrally.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [candidate_no_show, recruiter_decides, grant_not_triggered, draft_only, phone_number_mismatch, brazil]
    requirement_refs: [CHG-01, COM-01, ACT-11]
    inputs:
      now: "2026-11-17T11:20:00-03:00"
      recruiter: {id: rec_beatriz, name: Beatriz Lima, time_zone: America/Sao_Paulo}
      authority:
        mode: autonomous_grant_active
        grant:
          route: configuration
          granted_by: rec_beatriz
          scope:
            case: REQ-7781 / Diego Morales
            actions: [book, reschedule]
            date_range: {start: "2026-11-16T00:00:00-03:00", end: "2026-11-28T00:00:00-03:00"}
            organizer: recrutamento@contoso.example
          expires: "2026-11-28T00:00:00-03:00"
      candidate:
        id: candidate
        name: Diego Morales
        email: diego.morales@example.com
        time_zone: America/Sao_Paulo
        phone_on_invitation: "+55 11 5550-0142"
        phone_in_latest_email_signature: "+55 11 5550-0124"
      interview_plan:
        name: Inside Sales Representative - phone screen
        requisition: REQ-7781
        sessions:
          - {id: PS, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_rafael]}
      policies:
        no_show_policy: >-
          Interviewer waits 10 minutes and calls twice. The recruiter decides whether to offer one new time.
          The agent never reschedules automatically or changes candidate status after a no-show.
      interviewers:
        - {id: int_rafael, name: Rafael Souza, time_zone: America/Sao_Paulo, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_dm_ps, session: PS, organizer: recrutamento@contoso.example, start: "2026-11-17T10:30:00-03:00", end: "2026-11-17T11:00:00-03:00", phone: "Rafael calls +55 11 5550-0142", attendees: [{id: candidate, response: accepted}, {id: int_rafael, response: accepted}]}
      conversation:
        - role: recruiter
          at: "2026-11-17T11:20:00-03:00"
          channel: chat
          text: Rafael says Diego didn't pick up, he tried twice. Nothing from Diego in email either. What now?
    expected:
      disposition: acknowledge_and_record
      solution_summary: >-
        Record the no-show as reported by Rafael via the recruiter for the 10:30-11:00 a.m. BRT phone screen on
        Tuesday, November 17, 2026. Flag that the invitation number (+55 11 5550-0142) differs from the number in
        Diego's latest email signature (+55 11 5550-0124). Draft a neutral check-in message for the recruiter to
        review and ask whether she wants to offer a new time; do not reschedule or send anything.
      must:
        - Record the missed phone screen with its source (interviewer report relayed by the recruiter) and time.
        - Point out the transposed-digit phone number discrepancy as a possible cause, without blaming anyone.
        - Provide a short, neutral draft message to Diego for the recruiter to review and send.
        - Ask the recruiter whether to offer a new time, per the no-show policy.
      must_not:
        - Reschedule, create an event, or send any message, even though the grant covers rescheduling.
        - Label the candidate unreliable, change candidate status, or suggest deprioritizing him.
        - Assume the candidate deliberately skipped the interview.
      side_effects: {external_writes: none}

  - id: CHG-006
    title: Interviewer no-show - move the existing interview, prefer the same interviewer, keep the reason private
    category: changes_and_rescheduling
    subcategory: interviewer_no_show
    description: >-
      The candidate waited 15 minutes in the Teams lobby; the interviewer's calendar shows an overlapping private
      commitment. The candidate offers two new windows in Lisbon time. The repair should move the existing event
      (not create a new one), prefer the original interviewer per the recruiter, offer the pool alternative, and
      draft an apology that neither blames the interviewer nor reveals his private conflict.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [interviewer_no_show, apology_message, private_event, pool_alternative, portugal, uk]
    requirement_refs: [CHG-01, COM-01, AVL-04]
    inputs:
      now: "2026-11-24T14:40:00+00:00"
      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ines Duarte
        email: ines.duarte@example.org
        time_zone: Europe/Lisbon
        availability:
          - {start: "2026-11-26T10:00:00+00:00", end: "2026-11-26T13:00:00+00:00"}
          - {start: "2026-11-27T14:00:00+00:00", end: "2026-11-27T17:00:00+00:00"}
      interview_plan:
        name: Product Analyst - analytics interview
        sessions:
          - {id: S1, title: Analytics interview, format: virtual, duration_min: 60, pool: {from: [int_callum, int_freya], count: 1}}
        rules: {prefer_original_interviewer_on_repair: true}
      interviewers:
        - id: int_callum
          name: Callum Reid
          time_zone: Europe/London
          availability_source: calendar
          calendar:
            - {start: "2026-11-24T13:30:00+00:00", end: "2026-11-24T15:00:00+00:00", status: private_busy}
            - {start: "2026-11-26T10:00:00+00:00", end: "2026-11-26T12:30:00+00:00", status: busy}
            - {start: "2026-11-27T14:00:00+00:00", end: "2026-11-27T15:30:00+00:00", status: busy}
        - id: int_freya
          name: Freya Lindgren
          time_zone: Europe/London
          availability_source: calendar
          calendar:
            - {start: "2026-11-26T10:00:00+00:00", end: "2026-11-26T11:00:00+00:00", status: busy}
            - {start: "2026-11-27T13:00:00+00:00", end: "2026-11-27T17:00:00+00:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_id_s1, session: S1, organizer: recruiting@contoso.example, start: "2026-11-24T14:00:00+00:00", end: "2026-11-24T15:00:00+00:00", attendees: [{id: candidate, response: accepted}, {id: int_callum, response: accepted}]}
        observed_outcome: {session: S1, outcome: interviewer_did_not_join, reported_by: candidate and recruiter}
      conversation:
        - role: candidate
          at: "2026-11-24T14:15:00+00:00"
          channel: email
          text: Hello, I've been waiting in the Teams lobby since 14:00. Is the interview still happening?
        - role: recruiter
          at: "2026-11-24T14:40:00+00:00"
          channel: chat
          text: >-
            Callum never showed - looks like he got pulled into something. Ines replied she can do Thu 26 Nov
            10:00-13:00 or Fri 27 Nov 14:00-17:00 Lisbon time. Can you find a new slot? Prefer Callum if possible.
    expected:
      disposition: propose_options
      solution_summary: >-
        With Callum: Friday, November 27, 2026, any 60-minute start from 15:30 to 16:00 GMT/WET (e.g.,
        15:30-16:30). Alternative with Freya: Thursday, November 26, starts from 11:00 to 12:00 GMT/WET. Move the
        existing event evt_id_s1 after confirmation and send a short apology without explaining Callum's absence.
      must:
        - Offer Callum on Friday, November 27 with starts from 15:30 to 16:00 (Lisbon and London are both UTC+0 that day).
        - Offer Freya on Thursday, November 26 with starts from 11:00 to 12:00 as the alternative.
        - Present the change as moving the existing evt_id_s1 rather than creating a new invitation.
        - Draft an apology to Ines that acknowledges the missed interview and gives the new time, without blaming or explaining Callum.
        - Ask which option to book.
      must_not:
        - Update, cancel or send anything before explicit confirmation.
        - Propose Callum on Thursday before 12:30 or Friday before 15:30.
        - Reveal or speculate about Callum's private commitment to the candidate.
        - Create a second invitation while the missed event remains on calendars.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-27T15:30:00Z", time_zone: Europe/Lisbon, expected_local: "2026-11-27T15:30", expected_weekday: Friday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-26T11:00:00Z", time_zone: Europe/London, expected_local: "2026-11-26T11:00", expected_weekday: Thursday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-26T00:00:00Z", end: "2026-11-28T00:00:00Z"}
      participants:
        candidate:
          time_zone: Europe/Lisbon
          available: [["2026-11-26T10:00:00+00:00", "2026-11-26T13:00:00+00:00"], ["2026-11-27T14:00:00+00:00", "2026-11-27T17:00:00+00:00"]]
        int_callum:
          time_zone: Europe/London
          busy: [["2026-11-26T10:00:00+00:00", "2026-11-26T12:30:00+00:00"], ["2026-11-27T14:00:00+00:00", "2026-11-27T15:30:00+00:00"]]
        int_freya:
          time_zone: Europe/London
          busy: [["2026-11-26T10:00:00+00:00", "2026-11-26T11:00:00+00:00"], ["2026-11-27T13:00:00+00:00", "2026-11-27T17:00:00+00:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate], pool: {from: [int_callum, int_freya], count: 1}}
      expect_feasible: true
      valid_examples:
        - {S1: {start: "2026-11-27T15:30:00+00:00", interviewers: [int_callum]}}
        - {S1: {start: "2026-11-26T11:00:00+00:00", interviewers: [int_freya]}}
      invalid_examples:
        - {S1: {start: "2026-11-26T12:00:00+00:00", interviewers: [int_callum]}, note: Callum is busy until 12:30.}
        - {S1: {start: "2026-11-27T15:00:00+00:00", interviewers: [int_callum]}, note: Overlaps Callum's Friday commitment.}
      valid_start_bounds:
        S1: {earliest: "2026-11-26T11:00:00+00:00", latest: "2026-11-27T16:00:00+00:00"}

  - id: CHG-007
    title: Earlier onsite session runs 20 minutes long - re-sequence the rest of the day with two moves
    category: changes_and_rescheduling
    subcategory: overrun_cascade_day_of
    description: >-
      Mid-loop, session 2 is overrunning by 20 minutes. Simply sliding everything 20 minutes breaks the next
      interviewer's hard stop. The candidate must leave by 3:30 p.m. for a flight. The minimal repair keeps the
      12:10 session, moves two sessions, and keeps 10-minute transitions and gaps of at most 60 minutes. Updates
      need confirmation, and the recruiter should be told to also tell interviewers in person.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [in_person_loop]
    tags: [overrun, day_of_change, cascade, minimal_disruption, hard_stop, resequence]
    requirement_refs: [CHG-01, EC-044, SCH-03, ACT-01]
    inputs:
      now: "2026-12-08T11:05:00-08:00"
      recruiter: {id: rec_nadia, name: Nadia Rahman, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tomas Herrera
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-08T08:45:00-08:00", end: "2026-12-08T15:30:00-08:00"}
        notes: Must leave the office by 3:30 p.m. for a flight.
      interview_plan:
        name: Mechanical Engineer - onsite loop (Seattle)
        venue: Contoso Seattle, Building 4
        sessions:
          - {id: S1, title: Intro, format: in_person, duration_min: 45, interviewers: [int_paula]}
          - {id: S2, title: Design review, format: in_person, duration_min: 60, interviewers: [int_wen]}
          - {id: S3, title: Manufacturing, format: in_person, duration_min: 45, interviewers: [int_tariq]}
          - {id: S4, title: Testing and validation, format: in_person, duration_min: 45, interviewers: [int_yuki]}
          - {id: S5, title: Hiring manager, format: in_person, duration_min: 45, interviewers: [int_ben]}
        rules: {fixed_order: false, transition_min: 10, max_gap_min: 60}
      interviewers:
        - {id: int_paula, name: Paula Ionescu, time_zone: America/Los_Angeles, availability_source: calendar}
        - {id: int_wen, name: Wen Zhao, time_zone: America/Los_Angeles, availability_source: calendar}
        - id: int_tariq
          name: Tariq Aziz
          time_zone: America/Los_Angeles
          availability_source: calendar
          calendar_note: Other commitments only; this case's interview events are excluded.
          calendar:
            - {start: "2026-12-08T12:00:00-08:00", end: "2026-12-08T13:00:00-08:00", status: busy}
            - {start: "2026-12-08T14:00:00-08:00", end: "2026-12-08T17:00:00-08:00", status: busy}
        - id: int_yuki
          name: Yuki Mori
          time_zone: America/Los_Angeles
          availability_source: calendar
          calendar:
            - {start: "2026-12-08T13:00:00-08:00", end: "2026-12-08T14:00:00-08:00", status: busy}
        - id: int_ben
          name: Ben Adeyemi
          time_zone: America/Los_Angeles
          availability_source: calendar
          calendar:
            - {start: "2026-12-08T11:00:00-08:00", end: "2026-12-08T12:30:00-08:00", status: busy}
      case_state:
        existing_bookings:
          - {event_id: evt_th_s1, session: S1, start: "2026-12-08T09:00:00-08:00", end: "2026-12-08T09:45:00-08:00", state: completed}
          - {event_id: evt_th_s2, session: S2, start: "2026-12-08T10:00:00-08:00", end: "2026-12-08T11:00:00-08:00", state: in_progress, expected_actual_end: "2026-12-08T11:20:00-08:00"}
          - {event_id: evt_th_s3, session: S3, organizer: recruiting@contoso.example, start: "2026-12-08T11:15:00-08:00", end: "2026-12-08T12:00:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_tariq, response: accepted}]}
          - {event_id: evt_th_s4, session: S4, organizer: recruiting@contoso.example, start: "2026-12-08T12:10:00-08:00", end: "2026-12-08T12:55:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_yuki, response: accepted}]}
          - {event_id: evt_th_s5, session: S5, organizer: recruiting@contoso.example, start: "2026-12-08T13:05:00-08:00", end: "2026-12-08T13:50:00-08:00", attendees: [{id: candidate, response: accepted}, {id: int_ben, response: accepted}]}
      conversation:
        - role: recruiter
          at: "2026-12-08T11:05:00-08:00"
          channel: teams
          text: >-
            S2 with Wen is running long - she says ~20 more min, so it'll end around 11:20. Tomas still has to
            leave by 3:30 for his flight. What do we do with the rest of the day?
    expected:
      disposition: propose_options
      solution_summary: >-
        Keep S4 (Yuki) at 12:10-12:55 p.m. Move S3 (Tariq) to a start between 1:05 and 1:15 p.m. (e.g., 1:05-1:50)
        and S5 (Ben) to after S3 with a 10-minute transition (e.g., 2:00-2:45 p.m.), all PST on Tuesday,
        December 8, 2026. Tomas finishes well before 3:30 p.m. Ask to update evt_th_s3 and evt_th_s5.
      must:
        - Explain that sliding S3 to 11:30 fails because Tariq has a hard stop at 12:00 p.m.
        - Recommend the repair that keeps S4 at 12:10 p.m. and moves only S3 and S5, with S3 starting 1:05-1:15 p.m. and S5 after it.
        - Keep 10-minute transitions, no gap over 60 minutes, and the whole day ending by 3:30 p.m.
        - Ask for confirmation to update the two invitations and advise the recruiter to tell Tariq and Ben directly, since same-day invitation updates may be missed.
      must_not:
        - Update invitations before confirmation.
        - Shorten any session to make the original order fit.
        - Propose any schedule that runs past 3:30 p.m. or overlaps Tariq's 12:00-1:00 p.m. or Ben's 11:00 a.m.-12:30 p.m. commitments.
        - Move the S4 session when a two-move repair exists, or claim the agent will notify interviewers outside the invitation update.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T11:30:00-08:00", end: "2026-12-08T15:30:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2026-12-08T11:30:00-08:00", "2026-12-08T15:30:00-08:00"]]}
        int_tariq: {time_zone: America/Los_Angeles, busy: [["2026-12-08T12:00:00-08:00", "2026-12-08T13:00:00-08:00"], ["2026-12-08T14:00:00-08:00", "2026-12-08T17:00:00-08:00"]]}
        int_yuki: {time_zone: America/Los_Angeles, busy: [["2026-12-08T13:00:00-08:00", "2026-12-08T14:00:00-08:00"]]}
        int_ben: {time_zone: America/Los_Angeles, busy: [["2026-12-08T11:00:00-08:00", "2026-12-08T12:30:00-08:00"]]}
      sessions:
        - {id: S3, duration_min: 45, attendees: [candidate, int_tariq]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_yuki]}
        - {id: S5, duration_min: 45, attendees: [candidate, int_ben]}
      constraints:
        min_gap_min: 10
        max_gap_min: 60
      expect_feasible: true
      valid_examples:
        - {S4: "2026-12-08T12:10:00-08:00", S3: "2026-12-08T13:05:00-08:00", S5: "2026-12-08T14:00:00-08:00"}
        - {S4: "2026-12-08T11:30:00-08:00", S3: "2026-12-08T13:00:00-08:00", S5: "2026-12-08T13:55:00-08:00"}
      invalid_examples:
        - {S3: "2026-12-08T11:35:00-08:00", S4: "2026-12-08T12:30:00-08:00", S5: "2026-12-08T13:25:00-08:00", note: Naive 20-minute slide - S3 runs into Tariq's 12:00 hard stop.}
        - {S4: "2026-12-08T12:10:00-08:00", S5: "2026-12-08T13:05:00-08:00", S3: "2026-12-08T14:00:00-08:00", note: Tariq is busy from 2:00 p.m.}
    grading_notes: >-
      The second valid example is feasible but moves all three sessions; prefer answers that keep S4 at 12:10.
      The oracle's window starts at 11:30 a.m. (S2 overrun end plus the 10-minute transition).

  - id: CHG-008
    title: "Teams link 'doesn't exist' four minutes before start - candidate is using the superseded link"
    category: changes_and_rescheduling
    subcategory: broken_meeting_link_stale_invite
    description: >-
      The interview was moved two days earlier and the update regenerated the Teams meeting. At 9:54 the candidate
      reports that the link fails, quoting the join URL from the original, superseded invitation. The correct
      move is to diagnose the stale link and give the recruiter the current join link to forward immediately,
      offering to resend the current invitation to the candidate only. Creating a new meeting would split the
      candidate from the interviewer already waiting in the real one.
    difficulty: advanced
    severity: high
    release_scope: mvp
