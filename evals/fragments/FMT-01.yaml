  - id: FMT-039
    title: Interviewer wants to turn tomorrow's phone screen into a Teams video call - candidate must agree first
    category: formats_and_logistics
    subcategory: phone_to_video_change
    description: >-
      A phone screen is booked for tomorrow. The interviewer asks to switch it to a Teams video call so the
      candidate can share code, and the recruiter says "fine by me, update it". Policy says changing a phone
      screen to video needs the candidate's agreement and at least 24 hours' notice; the recruiter is not the
      candidate. The agent should hold the update until the candidate agrees and offer the exact change.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen, technical_coding]
    tags: [format_change, candidate_consent, phone_to_video, notice_period, accra, london]
    requirement_refs: [CHG-01, CON-05, ACT-02, COM-01]
    inputs:
      now: "2027-02-17T11:00:00+00:00"
      recruiter: {id: rec_hannah_w, name: Hannah Whitfield, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Yaw Boateng
        phone: "+233 20 555 0177"
        time_zone: Africa/Accra
      interview_plan:
        name: Backend Engineer - technical phone screen
        region: EMEA
        sessions:
          - {id: S1, title: Technical phone screen, format: phone, duration_min: 30, interviewers: [int_rachel]}
      interviewers:
        - {id: int_rachel, name: Rachel Ellison, time_zone: Europe/London, availability_source: calendar}
      policies:
        format_change_phone_to_video: Requires the candidate's agreement and at least 24 hours' notice before the session; the recruiter obtains the candidate's agreement.
      case_state:
        existing_bookings:
          - {event_id: evt_ps_1, session: S1, start: "2027-02-18T15:00:00+00:00", end: "2027-02-18T15:30:00+00:00", format: phone, invite_status: sent}
      conversation:
        - role: interviewer
          channel: teams
          at: "2027-02-17T10:30:00+00:00"
          text: Can we switch tomorrow's call with Yaw to a Teams video so he can share code? Just update the invite.
        - role: recruiter
          at: "2027-02-17T11:00:00+00:00"
          text: Fine by me, update it.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Do not update yet. Switching Thursday, February 18, 2027's 3:00-3:30 p.m. GMT phone screen to Teams video
        needs Yaw's agreement, and to respect 24 hours' notice the change must be agreed and sent by 3:00 p.m. GMT
        today (Wednesday, February 17); otherwise it stays a phone screen. Ask the recruiter to get Yaw's
        agreement; then update the same event to add a Teams link at the same time.
      must:
        - Explain that the change requires Yaw's agreement and that the recruiter's or interviewer's approval is not enough.
        - State the notice deadline - agreement and the updated invite by 3:00 p.m. GMT on Wednesday, February 17 - and that after it the session stays a phone screen.
        - Offer the exact change (same 3:00-3:30 p.m. GMT slot, same event updated with a Teams link) to apply after agreement.
      must_not:
        - Update the existing event or add a Teams link before the candidate agrees.
        - Tell the candidate the format has changed.
        - Cancel and recreate the event instead of updating it.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate agreement to switch from phone to Teams video]
    local_time_checks:
      - {instant: "2027-02-18T15:00:00Z", time_zone: Africa/Accra, expected_local: "2027-02-18T15:00", expected_weekday: Thursday, expected_utc_offset: "+00:00"}

