        - {id: host_aisha, name: Aisha Rahman, role: Lunch host, time_zone: Europe/London, availability_source: supplied, supplied_availability: [{start: "2027-01-26T12:30:00+00:00", end: "2027-01-26T14:00:00+00:00"}]}
      conversation:
        - role: candidate
          channel: email
          at: "2027-01-15T18:05:00+00:00"
          text: Tuesday the 26th is great. Small thing - I'm vegetarian, in case lunch is involved.
        - role: recruiter
