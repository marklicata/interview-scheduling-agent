      granularity_min: 5
      search_window: {start: "2027-02-10T09:00:00+11:00", end: "2027-02-10T18:00:00+11:00"}
      participants:
        candidate: {time_zone: Australia/Sydney, available: [["2027-02-10T12:00:00+11:00", "2027-02-10T17:00:00+11:00"]]}
        int_olivia: {time_zone: Australia/Sydney, busy: [["2027-02-10T13:00:00+11:00", "2027-02-10T14:00:00+11:00"]]}
        int_hamish: {time_zone: Australia/Sydney}
        int_mei: {time_zone: Australia/Sydney}
        harbour_room: {time_zone: Australia/Sydney, available: [["2027-02-10T13:00:00+11:00", "2027-02-10T15:00:00+11:00"]]}
      sessions:
        - {id: SETUP, duration_min: 15, attendees: [candidate, harbour_room]}
        - {id: PRES, duration_min: 60, attendees: [candidate, int_olivia, int_hamish, int_mei, harbour_room]}
      constraints:
        order: [SETUP, PRES]
        min_gap_min: 0
        max_gap_min: 0
