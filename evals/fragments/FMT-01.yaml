        Decline the coffee-shop meeting under the venue policy and keep the first round on Teams. Valid 30-minute
        Teams starts on Thursday, December 10, 2026 - 8:00 to 8:30 a.m. or 9:30 a.m. EST.
      must:
        - Decline scheduling at a coffee shop and cite the policy that interviews happen on company premises or Teams.
        - Keep the plan's virtual format and propose Teams starts only from 8:00 to 8:30 a.m. or at 9:30 a.m. EST on December 10.
        - Ask whether to book one of those Teams times.
      must_not:
        - Create an event with a coffee shop or any public place as the location.
        - Switch the session to in-person without the plan or recruiter approving a company venue.
        - Propose 9:00-9:30 a.m. EST, when Sarah is busy.
