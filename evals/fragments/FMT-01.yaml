        The interpreted session is 90 minutes. Thursday, December 17, 2026 cannot fit (Tom busy until 9:45 a.m.
        and the interpreter's morning window ends at 11:00 a.m.). Propose Friday, December 18 with a start from
        10:00 to 10:30 a.m. CST (same clock time in Monterrey), inviting the interpreter with the Teams link.
      must:
        - Schedule the session as 90 minutes under the 1.5x interpretation rule, not 60.
        - Explain why Thursday at 10:00 a.m. fails (a 90-minute session overruns the interpreter's 11:00 a.m. end; earlier starts hit Tom's meeting).
        - Propose only Friday, December 18 starts from 10:00 to 10:30 a.m. CST.
        - Include the external interpreter as a required attendee with the Teams link, and ask whether to book.
      must_not:
        - Propose a 60-minute session or Thursday at 10:00 a.m.
        - Treat the interpreter as optional or omit them from the invite.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-18T16:00:00Z", time_zone: America/Monterrey, expected_local: "2026-12-18T10:00", expected_weekday: Friday, expected_utc_offset: "-06:00"}
      - {instant: "2026-12-18T16:00:00Z", time_zone: America/Chicago, expected_local: "2026-12-18T10:00", expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-17T06:00:00-06:00", end: "2026-12-18T18:00:00-06:00"}
      participants:
        candidate:
          time_zone: America/Monterrey
          available: [["2026-12-17T08:00:00-06:00", "2026-12-17T12:00:00-06:00"], ["2026-12-18T08:00:00-06:00", "2026-12-18T12:00:00-06:00"]]
        int_tom: {time_zone: America/Chicago, busy: [["2026-12-17T09:00:00-06:00", "2026-12-17T09:45:00-06:00"]]}
        interp_lb:
          time_zone: America/Chicago
          available: [["2026-12-17T09:00:00-06:00", "2026-12-17T11:00:00-06:00"], ["2026-12-17T13:00:00-06:00", "2026-12-17T14:00:00-06:00"], ["2026-12-18T10:00:00-06:00", "2026-12-18T12:30:00-06:00"]]
      sessions:
        - {id: HM, duration_min: 90, attendees: [candidate, int_tom, interp_lb]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-12-18T10:00:00-06:00"}
      invalid_examples:
        - {HM: "2026-12-17T10:00:00-06:00", note: 90 minutes overruns the interpreter's 11:00 a.m. window end.}
        - {HM: "2026-12-17T09:30:00-06:00", note: Overlaps Tom's meeting.}
      valid_start_bounds:
        HM: {earliest: "2026-12-18T10:00:00-06:00", latest: "2026-12-18T10:30:00-06:00"}

