          availability_source: calendar
          calendar:
            - {start: "2027-01-20T09:00:00-06:00", end: "2027-01-20T10:30:00-06:00", status: busy}
            - {start: "2027-01-20T14:00:00-06:00", end: "2027-01-20T15:00:00-06:00", status: busy}
        - id: escort_desk
          name: Woodgrove security escort (client-provided)
