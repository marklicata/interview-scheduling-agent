  - id: FMT-016
    title: Overnight long-haul arrival - jet-lag policy bars arrival-day sessions even though the candidate offers
    category: formats_and_logistics
    subcategory: jet_lag_policy
    description: >-
      The candidate lands in London at 6:30 a.m. GMT after an overnight flight from Singapore and offers to come
      straight in that afternoon. Company policy says no sessions on the arrival day and none before 10:00 a.m.
      the next day, and candidate preference does not override it (exceptions need a regional TA lead). The
      agent must schedule from Tuesday 10:00 a.m. onward and explain the exception route without pressuring.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [in_person_loop]
    tags: [jet_lag_policy, long_haul_travel, policy_over_preference, singapore, london, exception_route]
    requirement_refs: [CON-05, SCH-03, SCH-05, AVL-10]
    inputs:
      now: "2027-01-04T10:00:00+08:00"
      recruiter: {id: rec_siti, name: Siti Rahmah, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Arif Hidayat
        time_zone: Asia/Singapore
        onsite_visit:
          time_zone: Europe/London
          flight: {status: booked_by_travel_team, route: SIN-LHR overnight, scheduled_arrival: "2027-01-11T06:30:00+00:00", duration_hours: 14}
          availability:
            - {start: "2027-01-11T13:00:00+00:00", end: "2027-01-11T17:00:00+00:00"}
            - {start: "2027-01-12T09:00:00+00:00", end: "2027-01-12T17:00:00+00:00"}
      interview_plan:
        name: Quant Researcher - London onsite
        region: EMEA
        sessions:
          - {id: S1, title: Research discussion, format: in_person, duration_min: 60, interviewers: [int_eleanor], order: 1}
          - {id: S2, title: Modelling interview, format: in_person, duration_min: 60, interviewers: [int_samuel], order: 2}
        rules:
          break_between_sessions_min: 15
        venue: Contoso London, 10 Example Row, EC2
      interviewers:
        - id: int_eleanor
          name: Eleanor Price
          time_zone: Europe/London
          availability_source: calendar
          calendar:
            - {start: "2027-01-12T10:00:00+00:00", end: "2027-01-12T11:00:00+00:00", status: busy}
        - id: int_samuel
          name: Samuel Adeyinka
          time_zone: Europe/London
          availability_source: calendar
          calendar:
            - {start: "2027-01-12T13:00:00+00:00", end: "2027-01-12T14:00:00+00:00", status: busy}
      policies:
        long_haul_rule: >-
          After an overnight flight longer than 8 hours, schedule no sessions on the arrival day and none before
          10:00 local the following day. Candidate preference does not override this rule; exceptions require
          approval from the regional TA lead recorded in the case.
      conversation:
        - role: candidate
          channel: email
          at: "2027-01-03T21:10:00+08:00"
          text: I land Monday morning - honestly I'm happy to come straight from the airport Monday afternoon and get it done!
        - role: recruiter
          at: "2027-01-04T10:00:00+08:00"
          text: Arif is fine with Monday, let's do Monday 2pm London for both sessions.
    expected:
      disposition: propose_options
      solution_summary: >-
        No sessions on Monday, January 11, 2027. Earliest compliant plan is Tuesday, January 12 (GMT) - S1 with
        Eleanor from 11:00 a.m. (her 10:00-11:00 a.m. is busy) and S2 with Samuel at or after 2:00 p.m.
        (e.g., S1 11:00 a.m.-12:00 p.m., S2 2:00-3:00 p.m. GMT = 10:00-11:00 p.m. SGT for the recruiter).
      must:
        - Decline Monday 2:00 p.m. because the long-haul rule forbids arrival-day sessions, even with the candidate's offer.
        - Propose only Tuesday, January 12 times starting at or after 10:00 a.m. GMT that fit both interviewers, such as 11:00 a.m. and 2:00 p.m.
        - Explain that an exception needs the regional TA lead's recorded approval and that the recruiter owns that request.
        - Show times in London time and the recruiter's Singapore time, and ask whether to book.
      must_not:
        - Propose or book any Monday, January 11 session.
        - Treat the candidate's or recruiter's preference as an approved exception.
        - Propose anything before 10:00 a.m. GMT on Tuesday.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-11T06:30:00Z", time_zone: Europe/London, expected_local: "2027-01-11T06:30", expected_weekday: Monday, expected_utc_offset: "+00:00"}
      - {instant: "2027-01-12T14:00:00Z", time_zone: Asia/Singapore, expected_local: "2027-01-12T22:00", expected_weekday: Tuesday, expected_utc_offset: "+08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-11T08:00:00+00:00", end: "2027-01-12T18:00:00+00:00"}
      participants:
        candidate:
          time_zone: Europe/London
          available: [["2027-01-11T13:00:00+00:00", "2027-01-11T17:00:00+00:00"], ["2027-01-12T09:00:00+00:00", "2027-01-12T17:00:00+00:00"]]
        jetlag_rule: {time_zone: Europe/London, available: [["2027-01-12T10:00:00+00:00", "2027-01-12T18:00:00+00:00"]]}
        int_eleanor: {time_zone: Europe/London, busy: [["2027-01-12T10:00:00+00:00", "2027-01-12T11:00:00+00:00"]]}
        int_samuel: {time_zone: Europe/London, busy: [["2027-01-12T13:00:00+00:00", "2027-01-12T14:00:00+00:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, jetlag_rule, int_eleanor]}
        - {id: S2, duration_min: 60, attendees: [candidate, jetlag_rule, int_samuel]}
      constraints:
        order: [S1, S2]
        min_gap_min: 15
        same_local_day: {time_zone: Europe/London}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-12T11:00:00+00:00", S2: "2027-01-12T14:00:00+00:00"}
      invalid_examples:
        - {S1: "2027-01-11T14:00:00+00:00", S2: "2027-01-11T15:15:00+00:00", note: Arrival day is barred by the long-haul rule.}
        - {S1: "2027-01-12T09:00:00+00:00", S2: "2027-01-12T11:00:00+00:00", note: S1 starts before 10:00 on the day after arrival.}
      valid_start_bounds:
        S1: {earliest: "2027-01-12T11:00:00+00:00"}

  - id: FMT-017
    title: Client-site interview needs a security escort from the lobby 15 minutes early and for the whole session
