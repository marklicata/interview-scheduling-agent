      invalid_examples:
        - {SETUP: "2027-02-10T12:45:00+11:00", PRES: "2027-02-10T13:00:00+11:00", note: "Setup starts before the room reservation; Olivia is busy at 1 p.m."}
        - {SETUP: "2027-02-10T13:00:00+11:00", PRES: "2027-02-10T14:00:00+11:00", note: Setup is not immediately before the presentation.}
      valid_start_bounds:
        PRES: {earliest: "2027-02-10T14:00:00+11:00", latest: "2027-02-10T14:00:00+11:00"}

  - id: FMT-013
    title: Site tour must be last, with a guide from a two-person pool, and finish before the visitor exit time
    category: formats_and_logistics
    subcategory: site_tour_after_loop
    description: >-
      A Hyderabad onsite has three ordered 45-minute interviews followed by a 30-minute campus tour led by
      either of two guides, with 10-30 minute breaks and visitors off campus by 5:30 p.m. Interviewer and
      guide windows force a single morning start and the later guide; the tempting plan uses the first guide
      with a 5-minute break.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [in_person_loop, site_tour]
    tags: [site_tour, guide_pool, ordered_sessions, visitor_hours, hyderabad, breaks]
    requirement_refs: [CON-02, CON-03, CON-04, SCH-01]
    inputs:
      now: "2027-01-14T11:00:00+05:30"
      recruiter: {id: rec_deepa, name: Deepa Krishnan, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sneha Reddy
        time_zone: Asia/Kolkata
        availability:
