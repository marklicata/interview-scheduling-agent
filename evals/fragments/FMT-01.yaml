        arrival is 3:00 p.m. Wednesday. Propose Thursday, November 12, 2026 with a 60-minute start between
        2:00 and 3:00 p.m. PST; for a 2:00 p.m. start the badge must be requested by 1:45 p.m. PST Wednesday.
