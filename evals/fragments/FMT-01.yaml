# Formats and logistics cases (FMT). Phone, virtual (Teams), in-person, hybrid logistics; venues, transitions,
# lead times, equipment, interpreters, and the MVP boundary for rooms, travel purchasing, and holds.
test_cases:
  - id: FMT-001
    title: Phone screen cannot be booked without the candidate's phone number
    category: formats_and_logistics
    subcategory: phone_details_missing
    description: >-
      A 30-minute phone screen has a valid slot, but the candidate never supplied a phone number and the
      plan says the interviewer dials the candidate. The agent should propose the valid times and ask for the
      number (with country code) rather than booking a phone screen with no dial details or silently
      converting it into a Teams meeting.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [phone_details, missing_information, dial_direction, single_session, two_time_zones]
    requirement_refs: [INT-05, COM-02, CON-12, SCH-01]
    inputs:
      now: "2026-11-09T09:00:00-07:00"
      recruiter: {id: rec_lucia, name: Lucía Romero, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tomasz Wójcik
        email: tomasz.wojcik@example.net
        phone: null
        time_zone: America/Denver
        availability:
          - {start: "2026-11-12T09:00:00-07:00", end: "2026-11-12T11:00:00-07:00"}
      interview_plan:
        name: Sales Engineer - recruiter phone screen
        region: US
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_hannah]}
      interviewers:
        - id: int_hannah
          name: Hannah Osei
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-12T10:00:00-06:00", end: "2026-11-12T11:00:00-06:00", status: busy}
      policies:
        phone_screen_logistics: The interviewer calls the candidate at the candidate-provided number, which must appear in the invite. Do not substitute a Teams meeting for a phone-format session.
      conversation:
        - role: candidate
          channel: email
          at: "2026-11-08T19:12:00-07:00"
          text: >-
            Hi Lucía - Thursday the 12th works, anytime 9 to 11 am Mountain. Looking forward to it! Tomasz
        - role: recruiter
          channel: chat
          at: "2026-11-09T09:00:00-07:00"
          text: Can you set up Tomasz's 30 min phone screen with Hannah? His note is above.
    expected:
      disposition: ask_clarification
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Valid starts are 10:00 to 10:30 a.m. MST (11:00 to 11:30 a.m. CST) on Thursday, November 12, 2026.
        Before anything can be booked, the agent needs Tomasz's phone number (with country code) because
        Hannah dials him.
      must:
        - Propose only starts from 10:00 to 10:30 a.m. MST (11:00-11:30 a.m. CST) on Thursday, November 12.
        - Ask for the candidate's phone number, including country code, and say it is needed for the phone screen.
        - Explain that Hannah will call the candidate, per the plan's phone-screen logistics.
        - Say nothing will be booked until the number is supplied and the recruiter confirms a time.
      must_not:
        - Book or send an invitation without a candidate phone number.
        - Convert the phone screen into a Teams meeting to work around the missing number.
        - Invent or guess a phone number.
        - Propose 9:00-10:00 a.m. MST, which overlaps Hannah's 10:00-11:00 a.m. CST busy block.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate phone number with country code]
    local_time_checks:
      - {instant: "2026-11-12T17:00:00Z", time_zone: America/Denver, expected_local: "2026-11-12T10:00", expected_weekday: Thursday, expected_utc_offset: "-07:00"}
      - {instant: "2026-11-12T17:00:00Z", time_zone: America/Chicago, expected_local: "2026-11-12T11:00", expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-12T00:00:00-07:00", end: "2026-11-13T00:00:00-07:00"}
      participants:
        candidate:
          time_zone: America/Denver
          available: [["2026-11-12T09:00:00-07:00", "2026-11-12T11:00:00-07:00"]]
        int_hannah:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-12T10:00:00-06:00", "2026-11-12T11:00:00-06:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_hannah]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-12T10:00:00-07:00"}
      invalid_examples:
        - {S1: "2026-11-12T09:30:00-07:00", note: Overlaps Hannah's busy block (10:00-11:00 CST).}
      valid_start_bounds:
        S1: {earliest: "2026-11-12T10:00:00-07:00", latest: "2026-11-12T10:30:00-07:00"}

  - id: FMT-002
    title: Book an international phone screen with the number in E.164 format (drop the trunk prefix)
    category: formats_and_logistics
    subcategory: international_dialing_format
    description: >-
      A Lagos candidate wrote her mobile as "0803 555 0142" and her signature shows "+234 (0)803 555 0142".
      The recruiter confirmed a slot, and policy requires E.164 numbers in invites. The agent must book with
      +234 803 555 0142 (country code, no trunk zero) and show the time in both London and Lagos.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [international_dialing, e164, trunk_prefix, nigeria, booking_after_confirmation]
    requirement_refs: [COM-02, COM-06, ACT-01, ACT-07]
    inputs:
      now: "2026-11-16T10:00:00+00:00"
      recruiter: {id: rec_amara, name: Amara Nwosu, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Chidinma Eze
        email: chidinma.eze@example.org
        phone_raw: "0803 555 0142"
        time_zone: Africa/Lagos
        availability:
          - {start: "2026-11-18T14:00:00+01:00", end: "2026-11-18T17:00:00+01:00"}
      interview_plan:
        name: Graduate Analyst - phone screen
        region: EMEA
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_fiona]}
      interviewers:
        - id: int_fiona
          name: Fiona MacLeod
          email: fiona.macleod@contoso.example
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-18T13:00:00+00:00", end: "2026-11-18T14:00:00+00:00", status: busy}
      policies:
        phone_number_format: Phone numbers in invites must be in international E.164 form (+, country code, no national trunk prefix).
        dial_direction: Interviewer calls the candidate.
        organizer: recruiting-emea@contoso.example
      conversation:
        - role: candidate
          channel: email
          at: "2026-11-13T16:02:00+01:00"
          text: >-
            Dear Amara, Wednesday afternoon (2-5pm Lagos time) is perfect. You can reach me on 0803 555 0142.
            Kind regards, Chidinma Eze | Mobile +234 (0)803 555 0142
        - role: agent
          at: "2026-11-16T09:50:00+00:00"
          text: >-
            Options for Chidinma's 30-minute phone screen with Fiona on Wednesday, November 18, 2026 -
            (1) 3:00-3:30 p.m. WAT / 2:00-2:30 p.m. GMT, (2) 3:30-4:00 p.m. WAT / 2:30-3:00 p.m. GMT.
            Fiona will call Chidinma. Want me to book one?
        - role: recruiter
          at: "2026-11-16T10:00:00+00:00"
          text: Book option 1 please.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book the phone screen for Wednesday, November 18, 2026, 2:00-2:30 p.m. GMT (3:00-3:30 p.m. WAT) from
        recruiting-emea@contoso.example, with the candidate number written as +234 803 555 0142 and Fiona as the caller.
      must:
        - Create exactly one 30-minute phone-format event at 2:00 p.m. GMT / 3:00 p.m. WAT on November 18.
        - Write the candidate's number as +234 803 555 0142 in the invite, dropping the national trunk 0.
        - State in the invite that Fiona will call Chidinma at that number.
        - Report that invitations were sent, not accepted, and show the time in both GMT and WAT.
      must_not:
        - Write the number as +234 0803 555 0142 or only as 0803 555 0142.
        - Add a Teams link or convert the session to a Teams meeting.
        - Book option 2 or any time other than the confirmed option.
        - Create more than one event.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Phone screen for Chidinma Eze with Fiona MacLeod, notes: "2026-11-18 14:00-14:30 GMT; phone details +234 803 555 0142; Fiona dials."}
    local_time_checks:
      - {instant: "2026-11-18T14:00:00Z", time_zone: Africa/Lagos, expected_local: "2026-11-18T15:00", expected_weekday: Wednesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-18T14:00:00Z", time_zone: Europe/London, expected_local: "2026-11-18T14:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T00:00:00Z", end: "2026-11-19T00:00:00Z"}
      participants:
        candidate:
          time_zone: Africa/Lagos
          available: [["2026-11-18T14:00:00+01:00", "2026-11-18T17:00:00+01:00"]]
        int_fiona:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-18T13:00:00+00:00", "2026-11-18T14:00:00+00:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_fiona]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-18T14:00:00+00:00"}
      invalid_examples:
        - {S1: "2026-11-18T13:30:00+00:00", note: 2:30 p.m. WAT overlaps Fiona's 1:00-2:00 p.m. GMT meeting.}
      valid_start_bounds:
        S1: {earliest: "2026-11-18T14:00:00+00:00", latest: "2026-11-18T15:30:00+00:00"}

  - id: FMT-003
    title: Candidate's employer blocks Teams - keep the Teams meeting and offer the policy's browser and dial-in fallbacks
    category: formats_and_logistics
    subcategory: teams_blocked_fallback
    description: >-
      The candidate cannot use Teams on her employer-managed laptop and asks to do the interview by phone.
      Policy keeps interviews on Teams and lists two fallbacks (browser join from a personal device and
      audio-only dial-in), while changing the format to phone needs hiring-manager approval. The agent must
      propose a valid slot, explain both fallbacks, and not silently change formats or tools.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [teams_blocked, dial_in_fallback, browser_join, format_change_approval, lisbon, paris]
    requirement_refs: [COM-02, CON-05, SCH-03, SCH-01]
    inputs:
      now: "2026-11-18T10:00:00+01:00"
      recruiter: {id: rec_camille, name: Camille Dubois, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Inês Duarte
        time_zone: Europe/Lisbon
        availability:
          - {start: "2026-11-24T15:00:00+00:00", end: "2026-11-24T17:00:00+00:00"}
      interview_plan:
        name: Finance Manager - hiring manager interview
        region: EMEA
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_sophie]}
      interviewers:
        - id: int_sophie
          name: Sophie Laurent
          time_zone: Europe/Paris
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-24T16:00:00+01:00", end: "2026-11-24T17:00:00+01:00", status: busy}
      policies:
        video_platform: Microsoft Teams only for virtual interviews.
        virtual_access_fallbacks:
          - Join the Teams meeting in a web browser from any personal device (no installation required).
          - Join audio-only using the dial-in number and conference ID included in every interview Teams invite.
        format_change_rule: Changing a virtual session to phone format requires hiring manager approval recorded in the case.
      conversation:
        - role: candidate
          channel: email
          at: "2026-11-17T18:20:00+00:00"
          text: >-
            Hello Camille, my employer's laptop blocks Teams and I can't install anything on it. Could we do the
            call by phone instead? Tuesday 24 Nov 3-5pm Lisbon time works for me. Obrigada, Inês
        - role: recruiter
          at: "2026-11-18T10:00:00+01:00"
          text: Can you sort this out and find a time with Sophie?
    expected:
      disposition: propose_options
      solution_summary: >-
        Propose a Teams meeting starting between 4:00 and 4:15 p.m. WET (5:00-5:15 p.m. CET) on Tuesday,
        November 24, 2026, and tell the candidate she can join from a browser on a personal device or dial in
        audio-only with the number in the invite. A true phone-format change needs Sophie's (hiring manager) approval.
      must:
        - Propose only 45-minute starts from 4:00 to 4:15 p.m. WET (5:00-5:15 p.m. CET) on November 24.
        - Keep the session as a Teams meeting and mention both policy fallbacks (browser join on a personal device, audio dial-in).
        - Explain that switching to a phone-format interview needs hiring manager approval and is the recruiter's call to request.
        - Show times in both Lisbon and Paris time and ask whether to book.
      must_not:
        - Silently change the session to phone format or remove the Teams link.
        - Suggest Zoom, WhatsApp, or any other non-Teams platform.
        - Suggest the candidate bypass her employer's IT controls on the managed laptop.
        - Propose 3:00-4:00 p.m. WET, which overlaps Sophie's 4:00-5:00 p.m. CET meeting.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-24T16:00:00Z", time_zone: Europe/Lisbon, expected_local: "2026-11-24T16:00", expected_weekday: Tuesday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-24T16:00:00Z", time_zone: Europe/Paris, expected_local: "2026-11-24T17:00", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-24T00:00:00Z", end: "2026-11-25T00:00:00Z"}
      participants:
        candidate:
          time_zone: Europe/Lisbon
          available: [["2026-11-24T15:00:00+00:00", "2026-11-24T17:00:00+00:00"]]
        int_sophie:
          time_zone: Europe/Paris
          working_hours: {time_zone: Europe/Paris, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          busy: [["2026-11-24T16:00:00+01:00", "2026-11-24T17:00:00+01:00"]]
      sessions:
        - {id: HM, duration_min: 45, attendees: [candidate, int_sophie]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-24T16:00:00+00:00"}
      invalid_examples:
        - {HM: "2026-11-24T15:00:00+00:00", note: Overlaps Sophie's 4:00-5:00 p.m. CET meeting.}
        - {HM: "2026-11-24T16:30:00+00:00", note: Runs past the candidate's 5:00 p.m. Lisbon end and Sophie's 6:00 p.m. CET working-hours end.}
      valid_start_bounds:
        HM: {earliest: "2026-11-24T16:00:00+00:00", latest: "2026-11-24T16:15:00+00:00"}

  - id: FMT-004
    title: Recruiter confirms a Zoom booking under a Teams-only policy at a time the candidate cannot do
    category: formats_and_logistics
    subcategory: non_teams_platform_request
    description: >-
      The candidate asks for Zoom and the recruiter says "generate a Zoom link and book Thursday 10am SGT,
      confirmed". The product only creates Teams meetings and policy forbids other platforms, and 10:00 SGT
      is 7:30 IST, outside the candidate's window. The confirmation covered a Zoom booking, so it does not
      authorize a different Teams booking. The agent must decline the Zoom part, flag the time error, and
      propose valid Teams times.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [zoom_request, teams_only_policy, confirmation_scope, wrong_time_zone_by_recruiter, singapore, india]
    requirement_refs: [ACT-02, CFG-05, COM-02, AVL-10]
    inputs:
      now: "2026-11-16T09:00:00+08:00"
      recruiter: {id: rec_meiling, name: Mei Ling Goh, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rohan Mehta
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-11-19T09:00:00+05:30", end: "2026-11-19T12:00:00+05:30"}
      interview_plan:
        name: Investment Associate - first round
        region: APAC
        sessions:
          - {id: R1, title: First-round interview, format: virtual, duration_min: 45, interviewers: [int_daniel]}
      interviewers:
        - id: int_daniel
          name: Daniel Lim
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-19T12:00:00+08:00", end: "2026-11-19T13:00:00+08:00", status: busy}
      policies:
        video_platform: Microsoft Teams only. Zoom, Webex, and Google Meet are not permitted for interviews; exceptions need IT Security approval outside the scheduling assistant.
      conversation:
        - role: candidate
          channel: email
          at: "2026-11-15T20:41:00+05:30"
          text: >-
            Hi Mei Ling, my firm's network only allows Zoom - could you please send a Zoom link? Thursday 19 Nov,
            9am-12pm IST is good for me. Thanks, Rohan
        - role: recruiter
          at: "2026-11-16T09:00:00+08:00"
          text: Fine, just generate a Zoom link and book it Thursday 10am SGT with Daniel. Confirmed, go ahead.
          confirmation: true
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Do not create Zoom meetings (unsupported and not permitted). 10:00 a.m. SGT is 7:30 a.m. IST, before
        Rohan's window. Valid Teams starts are 1:00-1:45 p.m. SGT (10:30-11:15 a.m. IST) on Thursday,
        November 19, 2026; Rohan can join Teams from a browser on a personal device. Ask before booking.
      must:
        - Say the assistant cannot create or send Zoom links and that policy permits only Teams, with IT Security as the recruiter-owned exception path.
        - Point out that 10:00 a.m. SGT is 7:30 a.m. IST, outside Rohan's 9:00 a.m.-12:00 p.m. IST availability.
        - Propose Teams starts only from 1:00 to 1:45 p.m. SGT (10:30-11:15 a.m. IST) on November 19.
        - Ask for a fresh confirmation before booking a Teams meeting, because the earlier confirmation was for a different action.
      must_not:
        - Create, paste, or describe a Zoom meeting link.
        - Book anything, including a Teams meeting, on the strength of the Zoom confirmation.
        - Book or propose 10:00 a.m. SGT.
        - Propose 11:30 a.m.-12:15 p.m. SGT, which overlaps Daniel's noon meeting.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T02:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-19T07:30", expected_weekday: Thursday, expected_utc_offset: "+05:30"}
      - {instant: "2026-11-19T05:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-11-19T13:00", expected_utc_offset: "+08:00"}
      - {instant: "2026-11-19T05:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-19T10:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T00:00:00+08:00", end: "2026-11-20T00:00:00+08:00"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-11-19T09:00:00+05:30", "2026-11-19T12:00:00+05:30"]]
        int_daniel:
          time_zone: Asia/Singapore
          working_hours: {time_zone: Asia/Singapore, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          busy: [["2026-11-19T12:00:00+08:00", "2026-11-19T13:00:00+08:00"]]
      sessions:
        - {id: R1, duration_min: 45, attendees: [candidate, int_daniel]}
      expect_feasible: true
      valid_examples:
        - {R1: "2026-11-19T13:00:00+08:00"}
      invalid_examples:
        - {R1: "2026-11-19T10:00:00+08:00", note: 7:30 a.m. IST is before the candidate's window.}
        - {R1: "2026-11-19T11:30:00+08:00", note: Overlaps Daniel's 12:00-1:00 p.m. SGT meeting.}
      valid_start_bounds:
        R1: {earliest: "2026-11-19T13:00:00+08:00", latest: "2026-11-19T13:45:00+08:00"}

  - id: FMT-005
    title: Visitor badge needs 24 hours of lead time, so the recruiter's preferred next-morning slot is invalid
    category: formats_and_logistics
    subcategory: badge_lead_time
    description: >-
      An in-person interview requires a visitor badge requested at least 24 hours before the candidate
      arrives (arrival is 15 minutes before the session). No badge has been requested and it is already
      3:00 p.m. Tuesday, so the recruiter's preferred Wednesday 10:00 a.m. slot cannot be supported. The agent
      must compute the lead time, propose Thursday afternoon, and give the badge-request deadline without
      claiming to file the request.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [visitor_badge, lead_time, in_person, venue_supplied, recruiter_owned_action]
    requirement_refs: [CON-05, SCH-03, SCH-05, COM-02]
    inputs:
      now: "2026-11-10T15:00:00-08:00"
      recruiter: {id: rec_noah, name: Noah Feldman, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aroha Ngata
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-11T09:00:00-08:00", end: "2026-11-11T12:00:00-08:00"}
          - {start: "2026-11-12T13:00:00-08:00", end: "2026-11-12T16:00:00-08:00"}
      interview_plan:
        name: Hardware Test Engineer - onsite interview
        region: US
        sessions:
          - {id: S1, title: Onsite technical interview, format: in_person, duration_min: 60, interviewers: [int_diego]}
        venue: Contoso Redmond, Building 25 lobby, 15100 Example Way NE, Redmond, WA (confirmed by the coordinator)
      interviewers:
        - id: int_diego
          name: Diego Morales
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-12T13:00:00-08:00", end: "2026-11-12T14:00:00-08:00", status: busy}
      policies:
        visitor_badge: >-
