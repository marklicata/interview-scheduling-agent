        - {id: PPE, duration_min: 20, attendees: [candidate, ppe_station]}
        - {id: PRAC, duration_min: 90, attendees: [candidate, int_hector]}
      constraints:
        order: [IND, PPE, PRAC]
        min_gap_min: 0
        max_gap_min: 15
      expect_feasible: true
      valid_examples:
