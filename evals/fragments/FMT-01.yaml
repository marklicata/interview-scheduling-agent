        name: Adatum Line Technician - plant work trial (Guadalajara)
        region: LATAM
        sessions:
          - {id: IND, title: Safety induction, format: in_person, duration_min: 30, pool: [trainer_rocio, trainer_luis], pool_count: 1, order: 1}
          - {id: PPE, title: PPE fitting, format: in_person, duration_min: 20, interviewers: [ppe_station], order: 2}
          - {id: PRAC, title: Line practical, format: in_person, duration_min: 90, interviewers: [int_hector], order: 3}
        rules:
          max_gap_between_steps_min: 15
        venue: Adatum Guadalajara plant, Av. Ejemplo 450 - visitor gate 2
      interviewers:
        - {id: trainer_rocio, name: Rocío Vargas, role: Safety trainer, time_zone: America/Mexico_City, availability_source: supplied, supplied_availability: [{start: "2027-02-09T07:00:00-06:00", end: "2027-02-09T08:00:00-06:00"}]}
