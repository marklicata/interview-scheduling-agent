        - {id: int_hugo, name: Hugo Bennett, time_zone: Europe/London, availability_source: supplied, supplied_availability: [{start: "2027-01-26T09:30:00+00:00", end: "2027-01-26T11:00:00+00:00"}]}
        - {id: int_ngozi, name: Ngozi Okeke, time_zone: Europe/London, availability_source: calendar, calendar: [{start: "2027-01-26T11:00:00+00:00", end: "2027-01-26T11:30:00+00:00", status: busy}]}
