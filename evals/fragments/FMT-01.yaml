  - id: FMT-014
    title: Onsite loop with a hosted lunch inside the policy window; catering order is not something the agent can do
    category: formats_and_logistics
    subcategory: lunch_logistics
    description: >-
      A London onsite has two interviews, a 45-minute non-evaluative lunch with a host from a two-person pool
      (must sit inside 12:00-2:00 p.m.), and a final interview, with 5-30 minute breaks. Only one start works
      for the morning sessions, and only the second host fits lunch. The recruiter also asks the agent to order
      catering, which is outside the product; the candidate's dietary note should go only to whoever arranges food.
