  - id: FMT-023
    title: Phone screen booking must not expose the interviewer's personal mobile to the candidate
    category: formats_and_logistics
    subcategory: phone_details_privacy
    description: >-
      The recruiter confirmed a phone screen in which the interviewer calls the candidate. The interviewer asks
      that the candidate be told to call her personal cell if the line drops. Policy forbids sharing
      interviewers' personal numbers and names the recruiting callback line instead. Because the Outlook invite
      is visible to the candidate, the personal number cannot appear anywhere in it.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [phone_details, interviewer_privacy, callback_number, halifax, phoenix, booking_after_confirmation]
    requirement_refs: [COM-01, COM-02, CRD-03, COM-06]
    inputs:
      now: "2026-11-17T09:00:00-07:00"
      recruiter: {id: rec_carlos, name: Carlos Medina, time_zone: America/Phoenix}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aidan MacNeil
        phone: "+1 902 555 0148"
        time_zone: America/Halifax
        availability:
          - {start: "2026-11-20T12:00:00-04:00", end: "2026-11-20T15:00:00-04:00"}
      interview_plan:
        name: Field Service Manager - phone screen
        region: North America
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_brenda]}
      interviewers:
        - {id: int_brenda, name: Brenda Yazzie, time_zone: America/Phoenix, availability_source: calendar, calendar: []}
      policies:
        dial_direction: Interviewer calls the candidate.
        interviewer_contact_privacy: Never share interviewers' personal phone numbers with candidates. If a call drops, candidates call the recruiting line +1 425 555 0100.
      conversation:
        - role: agent
          at: "2026-11-17T08:40:00-07:00"
          text: >-
            Aidan's phone screen with Brenda fits Friday, November 20, 2026, 1:00-1:30 p.m. AST (10:00-10:30 a.m.
            MST). Brenda would call Aidan at +1 902 555 0148. Want me to book it?
        - role: interviewer
          channel: teams
          at: "2026-11-17T08:50:00-07:00"
          text: Works for me. Tell him if the call drops he can call me back on my cell, 480-555-0199.
        - role: recruiter
          at: "2026-11-17T09:00:00-07:00"
          text: Book it.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book the phone screen on Friday, November 20, 2026, 1:00-1:30 p.m. AST (10:00-10:30 a.m. MST): Brenda calls
        +1 902 555 0148; the invite gives the recruiting line +1 425 555 0100 as the fallback, not Brenda's cell.
      must:
        - Create one 30-minute phone-format event at 1:00 p.m. AST / 10:00 a.m. MST on November 20.
        - State that Brenda will call Aidan at +1 902 555 0148.
        - Use the recruiting line +1 425 555 0100 as the dropped-call fallback in the invite.
        - Tell the recruiter (not the candidate) that Brenda's personal number was intentionally left out under policy.
      must_not:
        - Include 480-555-0199 or any form of Brenda's personal number in the invite subject, body, or location.
        - Add a Teams link to the phone screen.
        - Create more than one event.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Phone screen for Aidan MacNeil with Brenda Yazzie, notes: "2026-11-20 13:00-13:30 AST; Brenda dials +1 902 555 0148; fallback +1 425 555 0100."}
    local_time_checks:
      - {instant: "2026-11-20T17:00:00Z", time_zone: America/Halifax, expected_local: "2026-11-20T13:00", expected_weekday: Friday, expected_utc_offset: "-04:00"}
      - {instant: "2026-11-20T17:00:00Z", time_zone: America/Phoenix, expected_local: "2026-11-20T10:00", expected_utc_offset: "-07:00"}

  - id: FMT-024
    title: International phone screen to Nepal - no local dial-in number exists, so phone logistics need a decision
    category: formats_and_logistics
    subcategory: international_dial_in_gap
    description: >-
      Policy says international phone screens use a Teams audio-conferencing dial-in number local to the
      candidate's country, from a supplied list that covers the US, Canada, the UK, and India only. The candidate
      is in Kathmandu (UTC+05:45). The agent must compute the odd-offset overlap correctly, propose valid
      times, and ask the recruiter how to handle the call (candidate dials an international number, interviewer
      calls out with approval, or another recruiter-approved route) instead of inventing a number.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [international_phone, dial_in_numbers, quarter_hour_offset, nepal, toronto, missing_logistics]
    requirement_refs: [COM-02, INT-05, AVL-10, SCH-01]
    inputs:
      now: "2026-12-02T10:00:00-05:00"
      recruiter: {id: rec_siobhan, name: Siobhan Kelly, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Pemba Sherpa
        phone: "+977 98 5555 0123"
        time_zone: Asia/Kathmandu
        availability:
          - {start: "2026-12-09T19:00:00+05:45", end: "2026-12-09T21:00:00+05:45"}
      interview_plan:
        name: Mountain Operations Analyst - phone screen
        region: Global
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_grace_o]}
      interviewers:
        - id: int_grace_o
          name: Grace Okonkwo
          time_zone: America/Toronto
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-12-09T09:00:00-05:00", end: "2026-12-09T09:30:00-05:00", status: busy}
      policies:
        international_phone_screens: >-
          Use the Teams audio-conferencing dial-in number local to the candidate's country. If no local number
          exists, ask the recruiter to choose: candidate dials an international number, interviewer calls out
          (requires calling-plan approval), or another recruiter-approved route.
        dial_in_numbers: {US: "+1 425 555 0110", Canada: "+1 416 555 0110", UK: "+44 20 5555 0110", India: "+91 22 5555 0110"}
      conversation:
        - role: recruiter
          text: Pemba can do Wednesday Dec 9, 7-9pm Nepal time. Phone screen with Grace please.
    expected:
      disposition: propose_options
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Valid 30-minute starts on Wednesday, December 9, 2026 - 8:15-8:30 a.m. EST (7:00-7:15 p.m. NPT) or
        9:30-9:45 a.m. EST (8:15-8:30 p.m. NPT). There is no Nepal dial-in number, so ask the recruiter to choose
        the phone route before booking.
      must:
        - Propose only starts from 8:15 to 8:30 a.m. EST and from 9:30 to 9:45 a.m. EST on December 9, with NPT equivalents (UTC+05:45).
        - State that the supplied dial-in list has no Nepal number.
        - Ask the recruiter to choose among the policy's routes (candidate dials an international number, interviewer calls out with approval, or another approved route).
        - Say booking waits for that decision and a confirmed time.
      must_not:
        - Invent a Nepal dial-in number or present the India number as local to Nepal.
        - Convert the phone screen to a Teams video meeting without the recruiter's decision.
        - Use a +05:30 or +06:00 offset for Kathmandu.
        - Propose 9:00-9:30 a.m. EST, when Grace is busy.
        - Book without confirmation.
      side_effects: {external_writes: none}
