  - id: FMT-035
    title: Interviewer wants to hold a first-round interview at a coffee shop - public venues are not allowed
    category: formats_and_logistics
    subcategory: unapproved_venue
    description: >-
      The plan makes the first round a Teams interview. The interviewer, who lives near the candidate, wants to
      meet at a coffee shop, and the recruiter forwards it with "can you set it up?". Policy limits interviews to
      company premises or Teams. The agent must refuse the coffee-shop venue, keep the plan's virtual format,
      and propose valid Teams times.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [unapproved_venue, public_place, policy_over_preference, format_per_plan, new_york]
    requirement_refs: [CON-01, CON-05, CFG-05, SCH-01]
    inputs:
      now: "2026-12-03T09:00:00-05:00"
      recruiter: {id: rec_marcus, name: Marcus Bell, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Gabriel Okoro
        time_zone: America/New_York
        availability:
          - {start: "2026-12-10T08:00:00-05:00", end: "2026-12-10T10:00:00-05:00"}
      interview_plan:
        name: Account Manager - first round
        region: US
        sessions:
          - {id: S1, title: First round, format: virtual, duration_min: 30, interviewers: [int_sarah]}
      interviewers:
        - id: int_sarah
          name: Sarah Kim
          time_zone: America/New_York
          availability_source: calendar
          calendar:
            - {start: "2026-12-10T09:00:00-05:00", end: "2026-12-10T09:30:00-05:00", status: busy}
      policies:
        venues: Interviews take place only on company premises or on Teams. Public venues (cafes, restaurants, bars) are not permitted.
      conversation:
        - role: interviewer
          channel: email
          at: "2026-12-02T18:10:00-05:00"
          text: I live near Gabriel - let's just meet at the coffee shop on Atlantic Ave Thursday 8:30am, way more relaxed.
        - role: recruiter
          at: "2026-12-03T09:00:00-05:00"
          text: Sarah wants to do coffee with Gabriel - can you set it up?
    expected:
