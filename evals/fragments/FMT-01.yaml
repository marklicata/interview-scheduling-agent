        name: Staff Product Designer - San Francisco onsite
        region: US
        sessions:
          - {id: S1, title: Portfolio, format: in_person, duration_min: 60, interviewers: [int_noah_s]}
          - {id: S2, title: Design critique, format: in_person, duration_min: 60, interviewers: [int_tessa]}
