  - id: FMT-036
    title: Two-site onsite (Redmond then Bellevue) is infeasible once the 40-minute drive-and-check-in buffer is applied
    category: formats_and_logistics
    subcategory: multi_site_travel_infeasible
    description: >-
      The two sessions are at different sites and policy requires 30 minutes of travel plus 10 minutes of check-in
      between them. With the interviewers' supplied windows and the candidate's noon departure, no order works.
      The naive back-to-back plan looks fine. The agent must report infeasibility with the binding constraints
      and recruiter-owned alternatives rather than drop the buffer.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [in_person_loop]
    tags: [multi_site, travel_buffer, infeasible, supplied_availability, redmond, bellevue]
    requirement_refs: [SCH-04, SCH-05, CON-04, CRD-02]
    inputs:
      now: "2027-01-05T10:00:00-08:00"
      recruiter: {id: rec_fatima, name: Fatima Al-Sayed, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Nikhil Rao
        time_zone: America/Los_Angeles
        availability:
          - {start: "2027-01-12T09:00:00-08:00", end: "2027-01-12T12:00:00-08:00"}
      interview_plan:
        name: Hardware PM - two-site onsite
        region: US
        sessions:
          - {id: S1, title: Lab walkthrough interview, format: in_person, duration_min: 60, interviewers: [int_ingrid], venue: Redmond Building 87}
          - {id: S2, title: Partner team interview, format: in_person, duration_min: 60, interviewers: [int_kofi], venue: Bellevue City Center tower}
        rules:
          order: any
          site_change_buffer_min: 40
      interviewers:
        - {id: int_ingrid, name: Ingrid Larsen, time_zone: America/Los_Angeles, availability_source: supplied, supplied_availability: [{start: "2027-01-12T09:00:00-08:00", end: "2027-01-12T10:30:00-08:00"}]}
        - {id: int_kofi, name: Kofi Asante, time_zone: America/Los_Angeles, availability_source: supplied, supplied_availability: [{start: "2027-01-12T10:00:00-08:00", end: "2027-01-12T11:30:00-08:00"}]}
      conversation:
        - role: recruiter
          text: Nikhil has to leave by noon on Tue 1/12. Can we do Ingrid in Redmond at 9 and Kofi in Bellevue at 10?
    expected:
      disposition: report_infeasible
      solution_summary: >-
        No valid schedule on Tuesday, January 12, 2027. Redmond-first needs Bellevue to start by 10:30 a.m. but the
        earliest arrival is 10:40 a.m.; Bellevue-first ends at 11:00 a.m. at the earliest, and Ingrid's window ends
        at 10:30 a.m. Alternatives for the recruiter - ask Kofi to interview in Redmond, ask the plan owner whether
        S2 may be on Teams, or find another day.
      must:
        - State that no schedule fits on January 12 once the 40-minute site-change buffer is applied, in either order.
        - Explain the binding constraints with exact times (Kofi's window ends 11:30 a.m.; Ingrid's ends 10:30 a.m.; noon departure).
        - Offer recruiter-owned alternatives (Kofi in Redmond, a plan-approved Teams option for S2, or another day) without acting on them.
      must_not:
        - Propose 9:00 Redmond then 10:00 Bellevue or any plan with less than 40 minutes between sites.
        - Silently switch a session to Teams.
        - Contact the interviewers or book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-12T08:00:00-08:00", end: "2027-01-12T13:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2027-01-12T09:00:00-08:00", "2027-01-12T12:00:00-08:00"]]}
        int_ingrid: {time_zone: America/Los_Angeles, available: [["2027-01-12T09:00:00-08:00", "2027-01-12T10:30:00-08:00"]]}
        int_kofi: {time_zone: America/Los_Angeles, available: [["2027-01-12T10:00:00-08:00", "2027-01-12T11:30:00-08:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_ingrid]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_kofi]}
      constraints:
        min_gap_min: 40
      expect_feasible: false
      invalid_examples:
        - {S1: "2027-01-12T09:00:00-08:00", S2: "2027-01-12T10:00:00-08:00", note: No travel time between Redmond and Bellevue.}
