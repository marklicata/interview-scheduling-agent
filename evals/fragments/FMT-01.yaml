        - id: ppe_station
          name: PPE fitting station (staffed)
          time_zone: America/Mexico_City
          availability_source: supplied
          supplied_availability:
            - {start: "2027-02-09T08:30:00-06:00", end: "2027-02-09T09:00:00-06:00"}
            - {start: "2027-02-09T10:15:00-06:00", end: "2027-02-09T11:00:00-06:00"}
        - {id: int_hector, name: Héctor Salinas, role: Line supervisor, time_zone: America/Mexico_City, availability_source: supplied, supplied_availability: [{start: "2027-02-09T09:00:00-06:00", end: "2027-02-09T13:00:00-06:00"}]}
      conversation:
        - role: recruiter
          text: Set up María Fernanda's work trial on Tue 9 Feb. Rocío can do the induction first thing at 7.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, February 9, 2027 (CST, Guadalajara) - induction with Luis 9:30-10:00, PPE fitting 10:15-10:35,
        practical with Héctor starting 10:35-10:50 (e.g., 10:35 a.m.-12:05 p.m.). Rocío's 7:00 induction would
        leave more than 15 minutes before any PPE slot.
      must:
        - Keep the order induction, PPE fitting, practical, with no more than 15 minutes between steps.
        - Assign Luis to the induction at 9:30 a.m. and explain why Rocío's 7:00-8:00 a.m. window cannot connect to a PPE slot.
        - Place PPE fitting at 10:15 a.m. and the 90-minute practical starting 10:35-10:50 a.m. within Héctor's window.
