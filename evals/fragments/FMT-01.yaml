          - {id: S2, title: Design exercise, format: in_person, duration_min: 45, interviewers: [int_fatima], order: 2}
          - {id: S3, title: Cross-functional partner, format: in_person, duration_min: 45, interviewers: [int_ravi], order: 3}
          - {id: TOUR, title: Campus tour (not evaluated), format: in_person, duration_min: 30, pool: [guide_vikram, guide_ayesha], pool_count: 1, order: 4}
        rules:
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
          visitor_exit_by_local: "17:30"
      interviewers:
        - {id: int_arvind, name: Arvind Kumar, time_zone: Asia/Kolkata, availability_source: supplied, supplied_availability: [{start: "2027-01-21T13:00:00+05:30", end: "2027-01-21T14:00:00+05:30"}]}
        - {id: int_fatima, name: Fatima Sheikh, time_zone: Asia/Kolkata, availability_source: calendar, calendar: [{start: "2027-01-21T14:00:00+05:30", end: "2027-01-21T14:30:00+05:30", status: busy}]}
        - {id: int_ravi, name: Ravi Teja, time_zone: Asia/Kolkata, availability_source: supplied, supplied_availability: [{start: "2027-01-21T15:00:00+05:30", end: "2027-01-21T16:30:00+05:30"}]}
        - {id: guide_vikram, name: Vikram Rao, role: Campus guide, time_zone: Asia/Kolkata, availability_source: supplied, supplied_availability: [{start: "2027-01-21T16:00:00+05:30", end: "2027-01-21T16:45:00+05:30"}]}
        - {id: guide_ayesha, name: Ayesha Siddiqui, role: Campus guide, time_zone: Asia/Kolkata, availability_source: supplied, supplied_availability: [{start: "2027-01-21T16:45:00+05:30", end: "2027-01-21T17:30:00+05:30"}]}
      conversation:
        - role: recruiter
          text: Please build Sneha's onsite for Thursday 21 Jan with the campus tour at the end - Vikram usually does tours.
    expected:
