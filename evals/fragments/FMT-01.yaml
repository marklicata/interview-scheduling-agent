  - id: FMT-030
    title: Candidate traveling from Phoenix to Denver says "9-12 my time" the week after DST starts
    category: formats_and_logistics
    subcategory: venue_vs_home_time_zone
    description: >-
      The candidate lives in Phoenix (no DST) and will be at a conference in Denver on Tuesday, March 16, 2027,
      two days after Denver moved to daylight time, so the zones are an hour apart. She offers "9-12 my time"
      for an in-person interview at the Denver office. "My time" could mean Phoenix (10:00-1:00 MDT) or local
      Denver time (9:00-12:00 MDT). Interviewer availability does not resolve it, so the agent must ask.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [ambiguous_time_reference, venue_time_zone, phoenix_no_dst, denver, dst_week]
    requirement_refs: [INT-03, INT-05, AVL-10]
    inputs:
      now: "2027-03-08T09:00:00-07:00"
      recruiter: {id: rec_lucia, name: Lucía Romero, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tyler Begay
        time_zone: America/Phoenix
        travel_note: At a conference in Denver on 2027-03-16
      interview_plan:
        name: Civil Engineer - in-person interview
        region: US
        sessions:
          - {id: S1, title: Technical interview, format: in_person, duration_min: 60, interviewers: [int_owen]}
        venue: Contoso Denver, 1600 Example St, Suite 400
      interviewers:
        - id: int_owen
          name: Owen Rasmussen
          time_zone: America/Denver
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar: []
      conversation:
        - role: candidate
          channel: email
          at: "2027-03-07T18:30:00-07:00"
          text: I'll be in Denver for a conference Tuesday 3/16, so I can stop by your office - 9-12 my time works.
        - role: recruiter
          at: "2027-03-08T09:00:00-07:00"
          text: Can you get Tyler in with Owen on the 16th?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Ask whether "9-12 my time" means Phoenix time (10:00 a.m.-1:00 p.m. MDT in Denver) or Denver time
        (9:00 a.m.-12:00 p.m. MDT). Starts from 10:00 to 11:00 a.m. MDT fit either reading if a quick answer is not
        possible; present times in Denver (venue) time.
      must:
        - Point out that on March 16, 2027 Phoenix (MST, UTC-7) and Denver (MDT, UTC-6) differ by one hour.
        - Ask which zone "my time" refers to, giving both interpretations in Denver time.
        - Note that 10:00-11:00 a.m. MDT starts satisfy both interpretations, while still asking before booking.
        - Express the in-person times in Denver (venue) local time.
      must_not:
        - Assume Phoenix and Denver share the same offset on March 16.
        - Book or propose 9:00 a.m. MDT as confirmed without resolving the ambiguity.
        - Book without confirmation.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which time zone the candidate's window refers to]
    local_time_checks:
      - {instant: "2027-03-16T16:00:00Z", time_zone: America/Phoenix, expected_local: "2027-03-16T09:00", expected_weekday: Tuesday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-16T16:00:00Z", time_zone: America/Denver, expected_local: "2027-03-16T10:00", expected_utc_offset: "-06:00"}
      - {local: "2027-03-14T02:30", time_zone: America/Denver, expect: nonexistent}
