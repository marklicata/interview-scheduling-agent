    severity: high
    release_scope: mvp
    interview_types: [work_trial, in_person_loop]
    tags: [work_trial, safety_induction, ppe_fitting, equipment_station, trainer_pool, guadalajara]
    requirement_refs: [CON-02, CON-03, CON-04, SCH-01]
