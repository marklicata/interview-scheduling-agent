      participants:
        candidate: {time_zone: America/Mexico_City, available: [["2027-02-09T07:00:00-06:00", "2027-02-09T15:00:00-06:00"]]}
        trainer_rocio: {time_zone: America/Mexico_City, available: [["2027-02-09T07:00:00-06:00", "2027-02-09T08:00:00-06:00"]]}
