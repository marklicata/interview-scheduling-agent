      - {instant: "2026-12-09T13:15:00Z", time_zone: America/Toronto, expected_local: "2026-12-09T08:15", expected_utc_offset: "-05:00"}
      - {instant: "2026-12-09T14:30:00Z", time_zone: Asia/Kathmandu, expected_local: "2026-12-09T20:15"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T00:00:00-05:00", end: "2026-12-10T00:00:00-05:00"}
      participants:
        candidate: {time_zone: Asia/Kathmandu, available: [["2026-12-09T19:00:00+05:45", "2026-12-09T21:00:00+05:45"]]}
        int_grace_o:
