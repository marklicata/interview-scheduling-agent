      minutes a 45-minute role-play with a professional actor (external, availability supplied by the talent
      agency) observed by the sales manager. The Denver candidate is virtual. Overlapping conflicts make exactly
      one pairing work. Booking and paying the actor through the agency is the recruiter's job; the agent must
      not contact the agency.
