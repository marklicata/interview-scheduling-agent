  - id: STY-028
    title: Same-day hourly phone screen booked under a requisition-level configuration grant with a 90-minute notice rule
    category: interview_styles_and_industries
    subcategory: hourly_same_day_interview
    description: >-
      High-volume warehouse hiring: a candidate applied this morning and can talk today 12:00-3:00 p.m. Policy
      requires at least 90 minutes of notice for same-day interviews, and the second-shift supervisor starts at
      1:00 p.m. with a 2:00-2:15 break. A configuration grant lets the recruiter's agent book phone screens for this
      requisition from the site mailbox this month, so the earliest valid slot should be booked without a redundant
      confirmation prompt.
