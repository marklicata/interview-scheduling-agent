      solution_summary: >-
        Thursday, November 19, 2026 (NZDT): demo lesson in period 1, 8:50-9:45 a.m., with Grant observing; debrief
        with Grant and Leilani 10:00-10:20 a.m. Wednesday period 5 (1:45-2:40 p.m.) clashes with Grant's meeting.
      must:
