      invalid_examples:
        - {TECH: "2026-12-15T09:00:00+04:00", HR: "2026-12-15T11:45:00+04:00", SIM: "2026-12-15T13:00:00+04:00", note: Capt. Eriksen is busy until 10:30.}
        - {TECH: "2026-12-15T10:30:00+04:00", HR: "2026-12-15T12:15:00+04:00", SIM: "2026-12-15T13:00:00+04:00", note: No 15-minute gap before the simulator block.}
      valid_start_bounds:
