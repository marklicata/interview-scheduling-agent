  - id: STY-024
    title: Airline pilot assessment around a training-department simulator slot; backup sim-bay reservation declined
    category: interview_styles_and_industries
    subcategory: pilot_simulator_check
    description: >-
      Direct-entry first officer assessment in Dubai. The training department has already confirmed a simulator
      block (13:00-18:00 including brief and debrief). The agent must plan the technical interview and HR
      interview before it, in that order, with at least 15 minutes between activities, respecting a rest rule
      (no activity before 09:00 after the candidate's overnight arrival). The recruiter also asks the agent to
      reserve the simulator bay for a weather backup the next day - simulator/resource booking and holds are later
      scope, so that part is declined.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [simulation, in_person_loop, hr_round]
    tags: [aviation, simulator_resource_later_scope, supplied_confirmed_slot, rest_rule, ordered_sessions, dubai]
    requirement_refs: [AVL-08, ACT-09, CON-03, CON-04, SCH-01]
    source_inspiration: Airline pilot selection combining technical and HR interviews with a full-flight simulator assessment.
    inputs:
      now: "2026-12-07T10:00:00+04:00"
      recruiter: {id: rec_mariam, name: Mariam Khoury, time_zone: Asia/Dubai}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rodrigo Santos
        time_zone: Asia/Dubai
        travel: {arrival_local: "2026-12-14T22:30", from: Manila}
        availability:
          - {start: "2026-12-15T09:00:00+04:00", end: "2026-12-15T18:00:00+04:00"}
      interview_plan:
        name: First Officer A320 (direct entry) - assessment day
        region: Middle East
        team: Tailspin Airways Flight Operations
        venue: Tailspin Airways Training Centre, Dubai
        sessions:
          - {id: TECH, title: Technical interview, format: in_person, duration_min: 60, interviewers: [int_lars], order: 1}
          - {id: HR, title: HR interview, format: in_person, duration_min: 45, interviewers: [int_noura], order: 2}
          - {id: SIM, title: Simulator assessment (brief, sim, debrief), format: in_person, duration_min: 300, interviewers: [int_hessa], order: 3, confirmed_resource: "SIM-B2-1215, confirmed by Training Department"}
        rules:
          min_gap_between_activities_min: 15
          rest_rule: no assessment activity before 09:00 local after an overnight arrival
          simulator_slots: allocated by the Training Department only
      interviewers:
        - {id: int_lars, name: Capt. Lars Eriksen, time_zone: Asia/Dubai, availability_source: calendar,
           calendar: [{start: "2026-12-15T09:00:00+04:00", end: "2026-12-15T10:30:00+04:00", status: busy}]}
        - {id: int_noura, name: Noura Haddad, role: HR Business Partner, time_zone: Asia/Dubai, availability_source: calendar,
           calendar: [{start: "2026-12-15T11:00:00+04:00", end: "2026-12-15T11:30:00+04:00", status: busy}]}
        - {id: int_hessa, name: Capt. Hessa Al Marzouqi, role: Sim examiner, time_zone: Asia/Dubai, availability_source: supplied,
           supplied_availability: [{start: "2026-12-15T13:00:00+04:00", end: "2026-12-15T18:00:00+04:00"}]}
      conversation:
        - role: recruiter
          text: >-
            Training confirmed SIM-B2-1215 for Rodrigo, 13:00-18:00 on Tue 15 Dec. Please fit the technical and HR
            interviews before it. And can you grab sim bay B2 on the morning of the 16th too, as a weather backup?
    expected:
      disposition: propose_options
      secondary_dispositions: [decline_unsupported]
      solution_summary: >-
        Tuesday, December 15, 2026 (GST): technical interview with Capt. Eriksen starting 10:30-10:45, HR with Noura
        after a 15-minute gap and ending by 12:45 (e.g., 10:30-11:30 technical, 11:45-12:30 HR), then the confirmed
        simulator block 13:00-18:00. The backup simulator reservation and any hold on the 16th must be arranged by
        the recruiter with the Training Department.
      must:
        - Start the technical interview between 10:30 and 10:45 GST and end HR at least 15 minutes before 13:00.
        - Treat SIM-B2-1215 as an already-confirmed fixed block and not re-plan it.
        - Explain that the 09:00 rest rule and Capt. Eriksen's 09:00-10:30 commitment rule out an earlier start.
        - Decline to reserve sim bay B2 or hold time on December 16, explaining it is not supported and the Training Department owns simulator allocation.
        - Ask whether to book the two interviews.
      must_not:
        - Reserve, hold, or request any simulator time.
        - Schedule anything before 09:00 GST on December 15 or overlapping the simulator block.
        - Put the HR interview before the technical interview.
        - Book before confirmation.
      side_effects: {external_writes: none}
