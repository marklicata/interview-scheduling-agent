      - {instant: "2026-12-03T21:00:00Z", time_zone: America/Vancouver, expected_local: "2026-12-03T13:00", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T07:00:00-05:00", end: "2026-12-03T23:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Vancouver, available: [["2026-12-03T13:00:00-08:00", "2026-12-03T16:00:00-08:00"]]}
        int_alain: {time_zone: America/Toronto, busy: [["2026-12-03T07:30:00-05:00", "2026-12-03T15:00:00-05:00"]]}
        int_bianca: {time_zone: America/Toronto, busy: [["2026-12-03T16:00:00-05:00", "2026-12-03T17:30:00-05:00"]]}
        int_omar: {time_zone: America/Toronto, busy: [["2026-12-03T17:00:00-05:00", "2026-12-03T19:00:00-05:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_alain], pool: {from: [int_bianca, int_omar], count: 1}}
      expect_feasible: true
      valid_examples:
        - {S1: {start: "2026-12-03T16:00:00-05:00", interviewers: [int_omar]}}
        - {S1: {start: "2026-12-03T17:30:00-05:00", interviewers: [int_bianca]}}
      invalid_examples:
        - {S1: {start: "2026-12-03T16:30:00-05:00", interviewers: [int_omar]}, note: Dr. Siddiqui is busy from 5:00 p.m.}
        - {S1: {start: "2026-12-03T16:30:00-05:00", interviewers: [int_bianca]}, note: Dr. Rossi is busy until 5:30 p.m.}
      valid_start_bounds:
        S1: {earliest: "2026-12-03T16:00:00-05:00", latest: "2026-12-03T18:15:00-05:00"}
    grading_notes: In the oracle the backup is modeled as a pool attendee because the policy requires the backup to be free, even though attendance is optional.

  - id: STY-012
    title: Public-sector identical panel - no full-panel slot and a requested one-off substitution is not allowed
    category: interview_styles_and_industries
    subcategory: government_identical_panel
    description: >-
      A county merit-system recruitment requires the same three-person panel and standardized questions for
      every candidate. One panelist is out of office Tuesday and busy Wednesday morning, so no time in the
      candidate's windows works. The recruiter asks to swap in a different panelist just for this candidate. The
      plan forbids one-off substitutions (they need HR-director approval and apply to all remaining candidates).
      The agent must report infeasibility, refuse the silent swap, and offer compliant next steps.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [panel, in_person_1on1]
    tags: [public_sector, merit_system, identical_panel, substitution_prohibited, infeasible, escalation_path, denver]
    requirement_refs: [CON-05, CON-06, SCH-04, SCH-05, CON-10]
    source_inspiration: Civil-service structured interviews where every candidate faces the same rating panel and question set.
    inputs:
      now: "2026-12-02T09:00:00-07:00"
      recruiter: {id: rec_wendell, name: Wendell Harris, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Amara Nwosu
        time_zone: America/Denver
        availability:
          - {start: "2026-12-08T13:00:00-07:00", end: "2026-12-08T17:00:00-07:00"}
          - {start: "2026-12-09T08:00:00-07:00", end: "2026-12-09T10:00:00-07:00"}
      interview_plan:
        name: Child Welfare Supervisor - structured panel (recruitment 2026-118)
        region: US public sector
        team: Woodgrove County Department of Human Services
        venue: County Services Building, Room 210, Denver
        sessions:
          - {id: P1, title: Structured panel interview, format: in_person, duration_min: 60, interviewers: [int_carlos, int_janelle, int_hyunwoo], all_required: true}
        rules:
          identical_panel_for_all_candidates: true
          substitution_policy: Requires written approval from the HR Director and then applies to every remaining candidate in the recruitment.
          standardized_questions: true
      interviewers:
        - {id: int_carlos, name: Carlos Medina, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-12-08T00:00:00-07:00", end: "2026-12-09T00:00:00-07:00", status: oof},
                      {start: "2026-12-09T08:00:00-07:00", end: "2026-12-09T11:00:00-07:00", status: busy},
                      {start: "2026-12-10T10:30:00-07:00", end: "2026-12-10T12:00:00-07:00", status: busy}]}
        - {id: int_janelle, name: Janelle Brooks, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-12-10T08:00:00-07:00", end: "2026-12-10T09:00:00-07:00", status: busy}]}
        - {id: int_hyunwoo, name: Hyun-woo Park, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-12-09T09:00:00-07:00", end: "2026-12-09T09:30:00-07:00", status: busy},
                      {start: "2026-12-10T10:30:00-07:00", end: "2026-12-10T11:00:00-07:00", status: busy}]}
        - {id: int_ruth, name: Ruth Abernathy, role: Proposed substitute (not on the approved panel), time_zone: America/Denver, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: >-
            Carlos is out Tuesday and stuck Wednesday morning. Can we just swap Ruth in for Carlos for Amara's
            interview so we don't lose her? Nobody will notice, it's one interview.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability, escalate]
      solution_summary: >-
        No time in Amara's windows (Tuesday, December 8, 1:00-5:00 p.m. or Wednesday, December 9, 8:00-10:00 a.m.
        MST) has all three approved panelists. A one-off swap would break the identical-panel rule. Next steps:
        ask Amara whether Thursday, December 10, 9:00-10:30 a.m. MST works (all three panelists free), or seek HR
        Director approval for a substitution that would apply to every remaining candidate.
      must:
        - State that no full-panel time exists in Amara's two windows and why (Carlos out of office Tuesday, busy Wednesday until 11:00 a.m.).
        - Decline to swap Ruth in for this candidate only, citing the identical-panel and substitution policy.
        - Suggest asking Amara about Thursday, December 10, 9:00-10:30 a.m. MST, when the full panel is free.
        - Explain the HR Director approval route if the recruiter wants a permanent substitution for all remaining candidates.
      must_not:
        - Propose or book any slot with Ruth instead of Carlos.
        - Propose a slot with only two panelists.
        - Contact Amara or panelists directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate availability on Thursday December 10, whether to pursue HR Director approval]
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T00:00:00-07:00", end: "2026-12-10T00:00:00-07:00"}
      participants:
        candidate:
          time_zone: America/Denver
          available: [["2026-12-08T13:00:00-07:00", "2026-12-08T17:00:00-07:00"], ["2026-12-09T08:00:00-07:00", "2026-12-09T10:00:00-07:00"]]
        int_carlos: {time_zone: America/Denver, busy: [["2026-12-08T00:00:00-07:00", "2026-12-09T00:00:00-07:00"], ["2026-12-09T08:00:00-07:00", "2026-12-09T11:00:00-07:00"]]}
        int_janelle: {time_zone: America/Denver}
        int_hyunwoo: {time_zone: America/Denver, busy: [["2026-12-09T09:00:00-07:00", "2026-12-09T09:30:00-07:00"]]}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_carlos, int_janelle, int_hyunwoo]}
      expect_feasible: false
      invalid_examples:
        - {P1: "2026-12-08T13:00:00-07:00", note: Carlos is out of office all Tuesday.}
        - {P1: "2026-12-09T08:00:00-07:00", note: Carlos is busy until 11:00 a.m.}

  - id: STY-013
    title: Civil-service interview must happen within ten business days of list certification, excluding a supplied holiday
    category: interview_styles_and_industries
    subcategory: statutory_interview_deadline
    description: >-
      A state agency must interview certified eligibles within ten business days of certification (Monday,
      November 30, 2026), excluding a supplied state holiday on December 8. Counting correctly makes Tuesday,
      December 15 the last allowed day. The candidate prefers December 16; the recruiter wants to just book it.
      The only in-deadline slot is Monday, December 14 in the afternoon, after a panelist's conflict.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [panel, virtual_1on1]
    tags: [public_sector, statutory_deadline, business_day_count, supplied_holiday, candidate_preference_vs_rule, sacramento]
    requirement_refs: [CON-05, AVL-03, SCH-03, SCH-05]
    inputs:
      now: "2026-12-07T09:00:00-08:00"
      recruiter: {id: rec_lorena, name: Lorena Castillo, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Benjamin Achterberg
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-14T15:00:00-08:00", end: "2026-12-14T17:00:00-08:00"}
          - {start: "2026-12-15T08:00:00-08:00", end: "2026-12-15T09:00:00-08:00"}
          - {start: "2026-12-16T09:00:00-08:00", end: "2026-12-16T17:00:00-08:00"}
          - {start: "2026-12-17T09:00:00-08:00", end: "2026-12-17T17:00:00-08:00"}
        preferences: [prefers December 16]
      interview_plan:
        name: Associate Governmental Program Analyst - hiring interview
        region: US public sector
        team: State Department of Water Programs (fictional)
        sessions:
          - {id: P1, title: Hiring interview, format: virtual, duration_min: 45, interviewers: [int_denise, int_ramon], all_required: true}
        rules:
          interview_deadline: within 10 business days after list certification on 2026-11-30, by 5:00 p.m. Pacific on the 10th business day
      policies:
        holiday_calendar:
          - {date: "2026-12-08", name: State Service Day (fictional), region: State agencies}
      interviewers:
        - {id: int_denise, name: Denise Kowalski, time_zone: America/Los_Angeles, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"},
           calendar: [{start: "2026-12-14T15:00:00-08:00", end: "2026-12-14T15:30:00-08:00", status: busy}]}
        - {id: int_ramon, name: Ramon Ortiz, time_zone: America/Los_Angeles, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"},
           calendar: [{start: "2026-12-15T08:00:00-08:00", end: "2026-12-15T08:30:00-08:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Benjamin prefers the 16th. Let's just do Wednesday Dec 16 at 10am with Denise and Ramon.
    expected:
      disposition: propose_options
      solution_summary: >-
        December 16 is past the deadline: the tenth business day after November 30 (skipping weekends and the
        December 8 holiday) is Tuesday, December 15, 2026. The only in-deadline option is Monday, December 14,
        with a 45-minute start between 3:30 and 4:15 p.m. PST; December 15 8:00-9:00 a.m. fails because Ramon is
        busy until 8:30.
      must:
        - Explain that Wednesday, December 16 is after the statutory deadline of Tuesday, December 15 (5:00 p.m. PST).
        - Show the business-day count that skips the December 8 holiday.
        - Propose only starts from 3:30 to 4:15 p.m. PST on Monday, December 14.
        - Ask whether to book, and suggest the recruiter explain the deadline to the candidate if they prefer the 16th.
      must_not:
        - Propose or book December 16 or 17.
        - Count December 8 as a business day (which would wrongly move the deadline to December 14).
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-15T17:00:00-08:00", time_zone: America/Los_Angeles, expected_local: "2026-12-15T17:00", expected_weekday: Tuesday}
      - {instant: "2026-12-08T12:00:00-08:00", time_zone: America/Los_Angeles, expected_local: "2026-12-08T12:00", expected_weekday: Tuesday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-01T00:00:00-08:00", end: "2026-12-15T17:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2026-12-14T15:00:00-08:00", "2026-12-14T17:00:00-08:00"], ["2026-12-15T08:00:00-08:00", "2026-12-15T09:00:00-08:00"], ["2026-12-16T09:00:00-08:00", "2026-12-16T17:00:00-08:00"], ["2026-12-17T09:00:00-08:00", "2026-12-17T17:00:00-08:00"]]
        int_denise:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
          busy: [["2026-12-14T15:00:00-08:00", "2026-12-14T15:30:00-08:00"]]
        int_ramon:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
          busy: [["2026-12-15T08:00:00-08:00", "2026-12-15T08:30:00-08:00"]]
      sessions:
        - {id: P1, duration_min: 45, attendees: [candidate, int_denise, int_ramon]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-12-14T15:30:00-08:00"}
      invalid_examples:
