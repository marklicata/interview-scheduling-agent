    category: interview_styles_and_industries
    subcategory: academic_campus_visit
    description: >-
      Assistant-professor campus visit in Madison bounded by the candidate's flights (arrive Monday 2:10 p.m.,
      depart Wednesday 5:45 p.m. CST). The job talk must use the department colloquium slot (Tuesday 3:30-4:30)
