        - {TALK: "2027-02-09T15:30:00-06:00", DEMO: "2027-02-10T10:00:00-06:00", DEAN: "2027-02-09T09:00:00-06:00", DINNER: "2027-02-08T18:30:00-06:00", note: Prof. Duarte teaches Monday evening.}
        - {TALK: "2027-02-09T15:30:00-06:00", DEMO: "2027-02-08T10:00:00-06:00", DEAN: "2027-02-09T09:00:00-06:00", DINNER: "2027-02-09T18:30:00-06:00", note: Monday lecture is before the candidate lands.}
