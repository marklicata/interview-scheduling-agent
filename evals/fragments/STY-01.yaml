        sessions:
          - {id: BRIEF, title: Role-play brief, format: virtual, duration_min: 15, pool: {from: [int_ana, int_devon], count: 1}, order: 1}
          - {id: RP, title: Discovery-call role-play, format: virtual, duration_min: 45, interviewers: [int_actor, int_victor], order: 2}
        rules: {gap_between_brief_and_role_play_max_min: 10}
      interviewers:
