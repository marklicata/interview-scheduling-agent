           calendar: [{start: "2026-11-24T13:15:00-06:00", end: "2026-11-24T13:45:00-06:00", status: busy}]}
        - {id: int_actor, name: Morgan Reyes, role: Actor (Lakeside Talent Agency, external), time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2026-11-24T13:00:00-06:00", end: "2026-11-24T15:00:00-06:00"}]}
        - {id: int_victor, name: Victor Almeida, role: Sales manager, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-24T13:00:00-06:00", end: "2026-11-24T13:30:00-06:00", status: busy},
                      {start: "2026-11-24T14:30:00-06:00", end: "2026-11-24T15:30:00-06:00", status: busy}]}
      conversation:
        - role: recruiter
          text: >-
            Lakeside says Morgan can do Tuesday 11/24 from 1 to 3 Central. Please line up Brianna's brief + role-play
            with Victor observing. Brianna's in Denver.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 24, 2026: brief with Ana 1:30-1:45 p.m. CST, role-play with Morgan and Victor 1:45-2:30
        p.m. CST (12:30-1:30 p.m. MST for Brianna). This is the only combination that fits.
      must:
        - Propose the brief 1:30-1:45 p.m. CST with Ana and the role-play 1:45-2:30 p.m. CST, shown also in Mountain time.
        - Explain that Devon is busy until 1:45 and Victor is busy until 1:30 and again from 2:30, leaving no other pairing.
        - Tell the recruiter to confirm Morgan's booking with Lakeside Talent Agency (recruiter-owned) and to supply the actor's attendance email if Morgan should get the Teams invite.
        - Ask whether to book.
      must_not:
        - Contact the talent agency or negotiate the actor's fee or time.
        - Schedule the role-play to end after 2:30 p.m. CST.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
