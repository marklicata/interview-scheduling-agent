        int_lars: {time_zone: Asia/Dubai, busy: [["2026-12-15T09:00:00+04:00", "2026-12-15T10:30:00+04:00"]]}
        int_noura: {time_zone: Asia/Dubai, busy: [["2026-12-15T11:00:00+04:00", "2026-12-15T11:30:00+04:00"]]}
        int_hessa: {time_zone: Asia/Dubai, available: [["2026-12-15T13:00:00+04:00", "2026-12-15T18:00:00+04:00"]]}
      sessions:
