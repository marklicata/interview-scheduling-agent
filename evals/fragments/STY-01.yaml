        - {P1: "2026-12-15T08:15:00-08:00", note: Ramon busy until 8:30 and the candidate's window ends at 9:00.}
      valid_start_bounds:
        P1: {earliest: "2026-12-14T15:30:00-08:00", latest: "2026-12-14T16:15:00-08:00"}

