  - id: STY-011
    title: Fellowship interview with an on-call surgeon requires a free backup surgeon from the pool
    category: interview_styles_and_industries
    subcategory: surgeon_on_call_backup
    description: >-
      The surgeon's calendar shows an OR block (busy) and then a trauma on-call shift marked working_elsewhere.
      Department policy: on-call time may be used for virtual interviews only if a backup surgeon from a named
      pool is free for the whole session and added as an optional attendee in case the surgeon is paged. The
      Vancouver candidate is available 1:00-4:00 p.m. Pacific. Valid starts split into two windows depending on
      which backup is free; treating on-call as busy (no options) or as fully free (no backup) are both wrong.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [healthcare, surgeon, on_call, working_elsewhere, backup_interviewer_pool, toronto, vancouver]
    requirement_refs: [AVL-09, CON-02, CON-05, SCH-01, AVL-10]
    inputs:
      now: "2026-11-26T09:00:00-05:00"
      recruiter: {id: rec_simone, name: Simone Lavoie, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Dr. Priyanka Bose
        time_zone: America/Vancouver
        availability:
          - {start: "2026-12-03T13:00:00-08:00", end: "2026-12-03T16:00:00-08:00"}
      interview_plan:
        name: Trauma Surgery Fellowship - faculty interview
        region: Canada
        team: Woodgrove General Hospital - Department of Surgery
        sessions:
          - {id: S1, title: Faculty interview, format: virtual, duration_min: 45, interviewers: [int_alain], backup_pool: {from: [int_bianca, int_omar], count: 1, attendance: optional, role: covers if Dr. Tremblay is paged}}
        rules:
          or_blocks: never schedule over OR time
          on_call: usable for virtual interviews only when one backup from the pool is free for the full session
      interviewers:
        - id: int_alain
          name: Dr. Alain Tremblay
          time_zone: America/Toronto
          availability_source: calendar
          calendar:
            - {start: "2026-12-03T07:30:00-05:00", end: "2026-12-03T15:00:00-05:00", status: busy, subject: OR block}
            - {start: "2026-12-03T15:00:00-05:00", end: "2026-12-03T23:00:00-05:00", status: working_elsewhere, subject: Trauma call (pager)}
        - {id: int_bianca, name: Dr. Bianca Rossi, time_zone: America/Toronto, availability_source: calendar,
           calendar: [{start: "2026-12-03T16:00:00-05:00", end: "2026-12-03T17:30:00-05:00", status: busy}]}
        - {id: int_omar, name: Dr. Omar Siddiqui, time_zone: America/Toronto, availability_source: calendar,
           calendar: [{start: "2026-12-03T17:00:00-05:00", end: "2026-12-03T19:00:00-05:00", status: busy}]}
      conversation:
        - role: recruiter
          text: >-
            Dr. Bose can only do Thursday Dec 3, 1-4 pm her time (Vancouver). Alain is in the OR until 3 then on
            trauma call. Is there anything that works under the on-call rule?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes. On Thursday, December 3, 2026, valid 45-minute starts are 4:00-4:15 p.m. EST (1:00-1:15 p.m. PST)
        with Dr. Siddiqui as backup, or 5:30-6:15 p.m. EST (2:30-3:15 p.m. PST) with Dr. Rossi as backup.
      must:
        - Offer only starts from 4:00 to 4:15 p.m. EST (backup Dr. Siddiqui) or 5:30 to 6:15 p.m. EST (backup Dr. Rossi), each shown in Pacific time too.
        - Name the backup surgeon for each option and add the backup as an optional attendee in the proposed invitation.
        - Keep the interview virtual (Teams) because on-call time is only usable for virtual sessions.
        - Ask whether to book.
      must_not:
        - Report that no time exists because the on-call shift is not free.
        - Offer 4:30-5:15 p.m. EST, when neither backup is free for the full session.
        - Schedule anything during the OR block or make the session in person.
        - Book before confirmation.
      side_effects: {external_writes: none}
