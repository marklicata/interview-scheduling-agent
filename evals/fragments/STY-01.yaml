      search_window: {start: "2026-11-24T10:00:00-06:00", end: "2026-11-24T18:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Denver, available: [["2026-11-24T11:00:00-07:00", "2026-11-24T16:00:00-07:00"]]}
        int_ana: {time_zone: America/Chicago, busy: [["2026-11-24T13:00:00-06:00", "2026-11-24T13:30:00-06:00"]]}
        int_devon: {time_zone: America/Chicago, busy: [["2026-11-24T13:15:00-06:00", "2026-11-24T13:45:00-06:00"]]}
        int_actor: {time_zone: America/Chicago, available: [["2026-11-24T13:00:00-06:00", "2026-11-24T15:00:00-06:00"]]}
        int_victor: {time_zone: America/Chicago, busy: [["2026-11-24T13:00:00-06:00", "2026-11-24T13:30:00-06:00"], ["2026-11-24T14:30:00-06:00", "2026-11-24T15:30:00-06:00"]]}
      sessions:
