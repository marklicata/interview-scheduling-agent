  - id: STY-019
    title: Take-home review requested before submission, plus calendar holds for the reviewers
    category: interview_styles_and_industries
    subcategory: take_home_review_before_submission
    description: >-
      Engineering take-home with a deadline of Thursday 23:59 Sao Paulo time. Policy: the review session is
      booked only after submission is recorded in the take-home portal, and reviewers need two full Seattle
      business days after submission. The recruiter wants to lock Monday's review now and put holds on the
      reviewers' calendars. The agent must hold for the submission gate, decline holds (later scope), and point
      out that even an on-deadline submission (Thursday 6:59 p.m. Pacific) makes Tuesday the earliest review day.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [take_home_review, technical_coding, virtual_1on1]
    tags: [engineering, take_home, submission_gate, holds_later_scope, business_day_rule, sao_paulo, seattle]
    requirement_refs: [CON-05, ACT-09, SCH-04, AVL-10]
    inputs:
      now: "2026-11-10T09:00:00-08:00"
      recruiter: {id: rec_nathan, name: Nathan Brooks, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rafael Nascimento
        time_zone: America/Sao_Paulo
        availability:
          - {start: "2026-11-16T10:00:00-03:00", end: "2026-11-16T18:00:00-03:00"}
          - {start: "2026-11-17T10:00:00-03:00", end: "2026-11-17T18:00:00-03:00"}
      interview_plan:
        name: Software Engineer II - take-home and review
        region: Americas
        team: Contoso Payments Platform
        sessions:
          - {id: TH, title: Take-home exercise (asynchronous), format: async, deadline_local: "2026-11-12T23:59", deadline_time_zone: America/Sao_Paulo}
          - {id: REV, title: Take-home review, format: virtual, duration_min: 60, interviewers: [int_wei, int_joanna], gate: TH submission recorded in the take-home portal}
        rules:
          review_booking: only after submission is recorded
          reviewer_prep: at least two full business days (Seattle) between submission and review
      interviewers:
        - {id: int_wei, name: Wei Chen, time_zone: America/Los_Angeles, availability_source: calendar}
        - {id: int_joanna, name: Joanna Kowalski, time_zone: America/Los_Angeles, availability_source: calendar}
      case_state:
        take_home: {sent_at: "2026-11-09T10:00:00-03:00", submitted: false}
      conversation:
        - role: recruiter
          text: >-
            Rafael's take-home is due Thursday night. Let's lock the review with Wei and Joanna for Monday 11/16 now
            and put holds on their calendars so the time doesn't disappear.
    expected:
      disposition: hold_for_gate
      secondary_dispositions: [decline_unsupported]
      solution_summary: >-
        Do not book the review yet: the plan books it only after submission is recorded. Holds are not supported in
        the MVP. Even if Rafael submits right at the deadline (Thursday, November 12, 2026, 11:59 p.m. BRT =
        6:59 p.m. PST), the two full Seattle business days are Friday the 13th and Monday the 16th, so the earliest
        review is Tuesday, November 17 (his window 10:00 a.m.-6:00 p.m. BRT = 5:00 a.m.-1:00 p.m. PST); Monday works
        only if he submits by Wednesday.
      must:
        - Decline to book the review before the submission is recorded, citing the plan.
        - State that calendar holds are not available in the MVP and suggest Wei and Joanna block time themselves if they wish.
        - Convert the deadline to Pacific time and explain why Monday, November 16 would violate the two-business-day rule for an on-deadline submission.
        - Offer to propose review options as soon as the submission is recorded.
      must_not:
        - Create any event or hold on Wei's or Joanna's calendars.
        - Tell the candidate a review time.
        - Assume the take-home has been submitted.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-13T02:59:00Z", time_zone: America/Sao_Paulo, expected_local: "2026-11-12T23:59", expected_weekday: Thursday, expected_utc_offset: "-03:00"}
      - {instant: "2026-11-13T02:59:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-12T18:59", expected_weekday: Thursday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-17T13:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T05:00", expected_weekday: Tuesday}

  - id: STY-020
    title: Take-home review at least 48 hours after recorded submission - Bengaluru evenings vs Seattle mornings
    category: interview_styles_and_industries
    subcategory: take_home_review_after_submission
    description: >-
      The take-home submission is recorded at 10:40 p.m. IST on Tuesday. Reviewers in Seattle need at least 48
      hours before the 60-minute review. The candidate offers only evenings (7:00-11:00 p.m. IST), which map to
      Seattle early mornings, and the recruiter asks for "tomorrow evening his time". That evening is inside the
      48-hour window; the next evening is the first valid one, and only after one reviewer's 8:00 a.m. stand-up.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [take_home_review, technical_coding, panel]
    tags: [engineering, take_home, review_lead_time, india, seattle, evening_availability, recruiter_suggestion_invalid]
    requirement_refs: [CON-05, AVL-10, SCH-01, SCH-05]
    inputs:
      now: "2026-12-09T09:00:00-08:00"
      recruiter: {id: rec_nathan, name: Nathan Brooks, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Karthik Subramanian
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-12-09T19:00:00+05:30", end: "2026-12-09T23:00:00+05:30"}
          - {start: "2026-12-10T19:00:00+05:30", end: "2026-12-10T23:00:00+05:30"}
          - {start: "2026-12-11T19:00:00+05:30", end: "2026-12-11T23:00:00+05:30"}
      interview_plan:
        name: Senior Software Engineer - take-home review
        region: Global
        team: Contoso Data Platform
        sessions:
          - {id: REV, title: Take-home review, format: virtual, duration_min: 60, interviewers: [int_joanna, int_wei], all_required: true}
        rules: {review_min_hours_after_submission: 48}
      interviewers:
        - {id: int_joanna, name: Joanna Kowalski, time_zone: America/Los_Angeles, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}, calendar: []}
        - {id: int_wei, name: Wei Chen, time_zone: America/Los_Angeles, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"},
           calendar: [{start: "2026-12-11T08:00:00-08:00", end: "2026-12-11T08:15:00-08:00", status: busy, subject: Stand-up}]}
      case_state:
        take_home: {submitted: true, submitted_at: "2026-12-08T22:40:00+05:30", source: take-home portal}
      conversation:
        - role: recruiter
          text: >-
            Karthik submitted last night. Can you get the review with Joanna and Wei set up ASAP? Tomorrow evening his
            time would be great.
    expected:
      disposition: propose_options
      solution_summary: >-
        The 48-hour rule makes 9:10 a.m. PST Thursday, December 10 (10:40 p.m. IST) the earliest allowed start, so
        Thursday evening IST is too late in the day to fit 60 minutes. The first valid option is Friday, December 11,
        2026, starting 8:15-8:30 a.m. PST = 9:45-10:00 p.m. IST.
      must:
        - Propose only starts from 8:15 to 8:30 a.m. PST on Friday, December 11 (9:45-10:00 p.m. IST), shown in both zones.
        - Explain that December 10 evening IST is within 48 hours of the 10:40 p.m. IST December 8 submission for most of the window and cannot fit 60 minutes.
        - Mention Wei's 8:00-8:15 a.m. stand-up as the reason the earliest start is 8:15 a.m. PST.
        - Ask whether to book.
      must_not:
        - Propose Wednesday or Thursday evening IST.
        - Propose times outside the reviewers' 8:00 a.m.-5:00 p.m. PST working hours.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-08T17:10:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-08T22:40", expected_weekday: Tuesday, expected_utc_offset: "+05:30"}
      - {instant: "2026-12-10T17:10:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-10T09:10", expected_weekday: Thursday}
      - {instant: "2026-12-11T16:15:00Z", time_zone: Asia/Kolkata, expected_local: "2026-12-11T21:45", expected_weekday: Friday}
      - {instant: "2026-12-11T16:15:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-11T08:15", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T09:10:00-08:00", end: "2026-12-12T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-12-09T19:00:00+05:30", "2026-12-09T23:00:00+05:30"], ["2026-12-10T19:00:00+05:30", "2026-12-10T23:00:00+05:30"], ["2026-12-11T19:00:00+05:30", "2026-12-11T23:00:00+05:30"]]
        int_joanna: {time_zone: America/Los_Angeles, working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}}
        int_wei:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
          busy: [["2026-12-11T08:00:00-08:00", "2026-12-11T08:15:00-08:00"]]
      sessions:
        - {id: REV, duration_min: 60, attendees: [candidate, int_joanna, int_wei]}
      expect_feasible: true
      valid_examples:
        - {REV: "2026-12-11T08:15:00-08:00"}
      invalid_examples:
        - {REV: "2026-12-10T08:00:00-08:00", note: Less than 48 hours after submission.}
        - {REV: "2026-12-11T08:00:00-08:00", note: Wei's stand-up.}
      valid_start_bounds:
        REV: {earliest: "2026-12-11T08:15:00-08:00", latest: "2026-12-11T08:30:00-08:00"}
    grading_notes: The oracle search window begins at submission + 48 hours to encode the lead-time rule.

  - id: STY-021
