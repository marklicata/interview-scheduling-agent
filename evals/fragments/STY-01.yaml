  - id: STY-023
    title: Teacher demo lesson must use a real class period from the bell schedule, followed by a debrief
    category: interview_styles_and_industries
    subcategory: teacher_demo_lesson
    description: >-
      Auckland secondary school: the candidate teaches a full 55-minute period to the real Year 10 science class
      while the head of department observes, then debriefs with the head of department and principal within 15
      minutes. The class meets only in specific periods; the candidate (a teacher elsewhere) is free Wednesday
      afternoon and Thursday early morning. Wednesday period 5 clashes with the observer; Thursday period 1 works
      with a 10:00 debrief after the principal's meeting.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [teaching_demo, in_person_loop]
    tags: [education, k12, teaching_demo, bell_schedule, real_class_slot, debrief_after_demo, auckland]
    requirement_refs: [CON-01, CON-03, SCH-01]
    source_inspiration: School teacher hiring where candidates teach a sample lesson to a live class.
    inputs:
      now: "2026-11-11T09:00:00+13:00"
      recruiter: {id: rec_mere, name: Mere Tipene, time_zone: Pacific/Auckland}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aroha Ngata
        time_zone: Pacific/Auckland
        availability:
          - {start: "2026-11-18T13:00:00+13:00", end: "2026-11-18T15:30:00+13:00"}
          - {start: "2026-11-19T08:00:00+13:00", end: "2026-11-19T10:30:00+13:00"}
      interview_plan:
        name: Science Teacher (Years 9-13) - demo lesson
        region: New Zealand
        team: Kauri Bay College
        venue: Kauri Bay College, Science block S4, Auckland
        sessions:
          - {id: DEMO, title: Demo lesson with 10SC2, format: in_person, duration_min: 55, attendees: [class_10sc2], interviewers: [int_grant], order: 1}
          - {id: DEBRIEF, title: Debrief, format: in_person, duration_min: 20, interviewers: [int_grant, int_leilani], order: 2}
        rules:
          bell_schedule: "P1 08:50-09:45, P2 09:50-10:45, interval, P3 11:05-12:00, P4 12:05-13:00, lunch, P5 13:45-14:40"
          demo_must_be_real_class_period: true
          debrief_within_min_after_demo: 15
      interviewers:
        - {id: class_10sc2, name: Year 10 science class 10SC2 timetable, time_zone: Pacific/Auckland, availability_source: supplied,
           supplied_availability: [{start: "2026-11-16T09:50:00+13:00", end: "2026-11-16T10:45:00+13:00"}, {start: "2026-11-18T11:05:00+13:00", end: "2026-11-18T12:00:00+13:00"}, {start: "2026-11-18T13:45:00+13:00", end: "2026-11-18T14:40:00+13:00"}, {start: "2026-11-19T08:50:00+13:00", end: "2026-11-19T09:45:00+13:00"}]}
        - {id: int_grant, name: Grant Mitchell, role: Head of Science, time_zone: Pacific/Auckland, availability_source: calendar,
           calendar: [{start: "2026-11-18T13:30:00+13:00", end: "2026-11-18T15:00:00+13:00", status: busy}]}
        - {id: int_leilani, name: Leilani Fonoti, role: Principal, time_zone: Pacific/Auckland, availability_source: calendar,
           calendar: [{start: "2026-11-19T09:30:00+13:00", end: "2026-11-19T10:00:00+13:00", status: busy}]}
      conversation:
        - role: recruiter
          text: >-
            Aroha can come Wed 18 Nov after 1pm or Thu 19 Nov before 10:30 (she has to get back for her own classes).
            Can you set up her demo lesson with 10SC2 and the debrief?
    expected:
