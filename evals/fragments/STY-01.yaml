test_cases:
  - id: STY-001
    title: Investment-banking superday with strict half-hour starts anchored on the managing director
    category: interview_styles_and_industries
    subcategory: ib_superday_back_to_back
    description: >-
      In-person investment-banking superday in New York: four back-to-back 30-minute interviews in a fixed
      rotation followed immediately by a 60-minute modeling case. The desk requires every block to start on the
      hour or half hour with no gaps. The managing director is free only 10:00-11:30 and the case associate has a
      call at 12:40, so exactly one rotation start works. A 5-minute grid finds tempting off-grid starts (9:35,
      9:40) that the strict-start rule forbids.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [superday, in_person_loop, case_interview]
    tags: [investment_banking, superday, back_to_back, strict_start_times, fixed_rotation, anchor_on_scarce_interviewer]
    requirement_refs: [CON-01, CON-03, SCH-01, SCH-02, ACT-01]
    source_inspiration: Bulge-bracket and boutique bank superdays with fixed 30-minute rotations and a modeling test.
    inputs:
      now: "2026-11-05T10:00:00-05:00"
      recruiter: {id: rec_shanice, name: Shanice Powell, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tomas Ferreira
        time_zone: America/New_York
        availability:
          - {start: "2026-11-13T08:00:00-05:00", end: "2026-11-13T15:00:00-05:00"}
      interview_plan:
        name: Investment Banking Analyst - superday (New York)
        region: US
        team: Woodgrove Capital - TMT coverage
        time_zone: America/New_York
        venue: Woodgrove Capital, 200 Example Plaza, 31st floor, New York
        sessions:
          - {id: S1, title: Rotation 1 - VP, format: in_person, duration_min: 30, interviewers: [int_daniel], order: 1}
          - {id: S2, title: Rotation 2 - Associate, format: in_person, duration_min: 30, interviewers: [int_lucia], order: 2}
          - {id: S3, title: Rotation 3 - Managing Director, format: in_person, duration_min: 30, interviewers: [int_helena], order: 3}
          - {id: S4, title: Rotation 4 - Associate, format: in_person, duration_min: 30, interviewers: [int_kwame], order: 4}
          - {id: CASE, title: Modeling case, format: in_person, duration_min: 60, interviewers: [int_ingrid], order: 5}
        rules:
          back_to_back: true
          start_times: every block starts exactly on the hour or half hour (desk rule)
          same_day: true
          tentative_blocks_by_default: true
      interviewers:
        - {id: int_daniel, name: Daniel Osei, role: Vice President, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-13T08:00:00-05:00", end: "2026-11-13T09:30:00-05:00", status: busy}]}
        - {id: int_lucia, name: Lucia Romero, role: Associate, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-13T11:00:00-05:00", end: "2026-11-13T12:00:00-05:00", status: busy}]}
        - {id: int_helena, name: Helena Varga, role: Managing Director, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-13T08:00:00-05:00", end: "2026-11-13T10:00:00-05:00", status: busy},
                      {start: "2026-11-13T11:30:00-05:00", end: "2026-11-13T17:00:00-05:00", status: busy}]}
        - {id: int_kwame, name: Kwame Mensah, role: Associate, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-13T08:30:00-05:00", end: "2026-11-13T09:00:00-05:00", status: tentative}]}
        - {id: int_ingrid, name: Ingrid Solberg, role: Associate, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-13T12:40:00-05:00", end: "2026-11-13T13:30:00-05:00", status: busy, subject: Deal team call}]}
      conversation:
        - role: recruiter
          text: >-
            Tomas is confirmed for the Friday 11/13 superday in person. Can you lay out his rotation? Helena is the
            hard one, she only has a small window. Remember the desk wants everything on the hour or half hour.
    expected:
      disposition: propose_options
      solution_summary: >-
        Exactly one schedule works on Friday, November 13, 2026 (EST): Daniel 9:30-10:00, Lucia 10:00-10:30,
        Helena 10:30-11:00, Kwame 11:00-11:30, modeling case with Ingrid 11:30 a.m.-12:30 p.m.
      must:
        - Propose the rotation 9:30, 10:00, 10:30, 11:00 and the case at 11:30 a.m.-12:30 p.m. EST on November 13, in plan order with no gaps.
        - State that this is the only rotation that fits, because Helena is free only 10:00-11:30 a.m., Daniel is busy until 9:30 a.m., and Ingrid has a call at 12:40 p.m.
        - Include the in-person venue (200 Example Plaza, 31st floor) in the proposal.
        - Ask whether to book the five sessions.
      must_not:
        - Propose off-grid starts such as 9:35 or 9:40 a.m., which violate the desk's on-the-hour/half-hour rule.
        - Start the rotation at 10:00 a.m., which pushes the case into Ingrid's 12:40 p.m. call.
        - Book, hold, or send any invitation before the recruiter confirms.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-13T07:00:00-05:00", end: "2026-11-13T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-11-13T08:00:00-05:00", "2026-11-13T15:00:00-05:00"]]}
        int_daniel: {time_zone: America/New_York, busy: [["2026-11-13T08:00:00-05:00", "2026-11-13T09:30:00-05:00"]]}
        int_lucia: {time_zone: America/New_York, busy: [["2026-11-13T11:00:00-05:00", "2026-11-13T12:00:00-05:00"]]}
        int_helena: {time_zone: America/New_York, busy: [["2026-11-13T08:00:00-05:00", "2026-11-13T10:00:00-05:00"], ["2026-11-13T11:30:00-05:00", "2026-11-13T17:00:00-05:00"]]}
        int_kwame: {time_zone: America/New_York, busy: [["2026-11-13T08:30:00-05:00", "2026-11-13T09:00:00-05:00"]]}
        int_ingrid: {time_zone: America/New_York, busy: [["2026-11-13T12:40:00-05:00", "2026-11-13T13:30:00-05:00"]]}
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_daniel]}
        - {id: S2, duration_min: 30, attendees: [candidate, int_lucia]}
        - {id: S3, duration_min: 30, attendees: [candidate, int_helena]}
        - {id: S4, duration_min: 30, attendees: [candidate, int_kwame]}
        - {id: CASE, duration_min: 60, attendees: [candidate, int_ingrid]}
      constraints:
        order: [S1, S2, S3, S4, CASE]
        min_gap_min: 0
        max_gap_min: 0
        same_local_day: {time_zone: America/New_York}
        start_alignment: {minutes: 30, time_zone: America/New_York}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-13T09:30:00-05:00", S2: "2026-11-13T10:00:00-05:00", S3: "2026-11-13T10:30:00-05:00", S4: "2026-11-13T11:00:00-05:00", CASE: "2026-11-13T11:30:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-13T09:40:00-05:00", S2: "2026-11-13T10:10:00-05:00", S3: "2026-11-13T10:40:00-05:00", S4: "2026-11-13T11:10:00-05:00", CASE: "2026-11-13T11:40:00-05:00", note: Off the half-hour grid required by the desk.}
        - {S1: "2026-11-13T10:00:00-05:00", S2: "2026-11-13T10:30:00-05:00", S3: "2026-11-13T11:00:00-05:00", S4: "2026-11-13T11:30:00-05:00", CASE: "2026-11-13T12:00:00-05:00", note: Case overlaps Ingrid's 12:40 call.}
        - {S1: "2026-11-13T09:00:00-05:00", S2: "2026-11-13T09:30:00-05:00", S3: "2026-11-13T10:00:00-05:00", S4: "2026-11-13T10:30:00-05:00", CASE: "2026-11-13T11:00:00-05:00", note: Daniel is busy until 9:30.}
      valid_start_bounds:
        S1: {earliest: "2026-11-13T09:30:00-05:00", latest: "2026-11-13T09:30:00-05:00"}
    grading_notes: The oracle's start_alignment encodes the desk's strict-start rule; a 9:35 start fits calendars but is wrong.

  - id: STY-002
    title: Book a confirmed London superday using a recruiter-provided room without booking the room or the unreviewed lunch
    category: interview_styles_and_industries
    subcategory: superday_booking_with_supplied_venue
    description: >-
      The agent previously proposed a five-block equity-research superday and the recruiter explicitly confirms
      it, adding that Facilities already assigned Room 4.12. The agent should recheck and book exactly the five
      reviewed sessions with the room as location text, without trying to reserve the room as a resource. The
      same message also asks for an analyst lunch at a restaurant, which was never reviewed: it must be proposed,
      not booked, and no restaurant reservation can be made.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [superday, in_person_loop, case_interview, informal_meal]
    tags: [superday, confirmed_booking, supplied_venue, room_booking_later_scope, unreviewed_addition, london]
    requirement_refs: [ACT-01, ACT-02, ACT-05, ACT-07, AVL-05, AVL-08, COM-06]
    inputs:
      now: "2026-11-12T16:20:00+00:00"
      recruiter: {id: rec_harriet, name: Harriet Cole, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aditi Kulkarni
        email: aditi.kulkarni@example.net
        time_zone: Europe/London
        availability:
          - {start: "2026-11-16T08:30:00+00:00", end: "2026-11-16T13:30:00+00:00"}
      interview_plan:
        name: Equity Research Associate - superday (London)
        region: EMEA
        team: Fabrikam Securities - European Equities
        organizer: superday@contoso.example
        venue: Fabrikam Securities, 1 Example Street, London
        sessions:
          - {id: S1, title: Rotation 1, format: in_person, duration_min: 30, interviewers: [int_george], order: 1}
          - {id: S2, title: Rotation 2, format: in_person, duration_min: 30, interviewers: [int_mei], order: 2}
          - {id: S3, title: Rotation 3, format: in_person, duration_min: 30, interviewers: [int_farid], order: 3}
          - {id: S4, title: Rotation 4, format: in_person, duration_min: 30, interviewers: [int_olu], order: 4}
          - {id: CASE, title: Stock pitch case, format: in_person, duration_min: 60, interviewers: [int_sofia], order: 5}
        rules: {rotations_back_to_back: true, break_before_case_max_min: 15}
      interviewers:
        - {id: int_george, name: George Whitfield, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-16T08:00:00+00:00", end: "2026-11-16T09:00:00+00:00", status: busy}]}
        - {id: int_mei, name: Mei Takahashi, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-16T10:00:00+00:00", end: "2026-11-16T11:00:00+00:00", status: busy}]}
        - {id: int_farid, name: Farid Benali, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-16T10:30:00+00:00", end: "2026-11-16T11:30:00+00:00", status: busy}]}
        - {id: int_olu, name: Olu Adeyinka, time_zone: Europe/London, availability_source: calendar, calendar: []}
        - {id: int_sofia, name: Sofia Marchetti, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-16T12:30:00+00:00", end: "2026-11-16T13:00:00+00:00", status: busy}]}
      case_state:
        prior_proposals:
          - {id: prop_1, created_at: "2026-11-12T15:50:00+00:00", summary: "S1 09:00, S2 09:30, S3 10:00, S4 10:30, CASE 11:15-12:15 GMT on 2026-11-16"}
      conversation:
        - role: agent
          at: "2026-11-12T15:50:00+00:00"
          text: >-
            Proposed superday for Aditi on Monday, November 16 (GMT): George 9:00-9:30, Mei 9:30-10:00, Farid
            10:00-10:30, Olu 10:30-11:00, 15-minute break, stock pitch case with Sofia 11:15 a.m.-12:15 p.m.
            Want me to book these five sessions?
        - role: recruiter
          at: "2026-11-12T16:18:00+00:00"
          confirmation: true
          text: >-
            Yes - book exactly that. Facilities already gave us Room 4.12 for the whole morning so put that as the
            location. Oh and could you also sort a lunch for her with two of the analysts afterwards, maybe at
            Dishoom round the corner?
    expected:
      disposition: book
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Recheck all five calendars, then create the five reviewed events for Monday, November 16, 2026 (GMT)
        from superday@contoso.example with location "Room 4.12, Fabrikam Securities, 1 Example Street, London".
        Report that invitations were sent, not accepted. For lunch, propose a time (for example 12:30-13:30 GMT,
        inside Aditi's availability) and ask which two analysts and whether to send it; no restaurant booking.
      must:
        - Recheck the candidate's availability and the five interviewers' calendars before booking.
        - Create exactly five events at the reviewed times (9:00, 9:30, 10:00, 10:30 and 11:15 a.m.-12:15 p.m. GMT on November 16) from superday@contoso.example.
        - Put "Room 4.12" as location text and say the room itself was assigned by Facilities, not reserved by the agent.
        - Report per session that invitations were sent and that acceptance is still pending.
        - Treat the analyst lunch as a new, unreviewed request - ask which analysts and propose a time before sending anything.
      must_not:
        - Create a lunch event or any sixth event without a separate confirmation.
        - Reserve a table at the restaurant or contact the restaurant.
        - Book Room 4.12 as a room resource or claim the agent reserved it.
        - Change any of the reviewed session times.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 Aditi Kulkarni + George Whitfield 09:00-09:30 GMT, notes: Location Room 4.12 (text).}
          - {type: create_event, target: S2 Aditi Kulkarni + Mei Takahashi 09:30-10:00 GMT}
          - {type: create_event, target: S3 Aditi Kulkarni + Farid Benali 10:00-10:30 GMT}
          - {type: create_event, target: S4 Aditi Kulkarni + Olu Adeyinka 10:30-11:00 GMT}
          - {type: create_event, target: CASE Aditi Kulkarni + Sofia Marchetti 11:15-12:15 GMT}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T08:00:00+00:00", end: "2026-11-16T14:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-11-16T08:30:00+00:00", "2026-11-16T13:30:00+00:00"]]}
        int_george: {time_zone: Europe/London, busy: [["2026-11-16T08:00:00+00:00", "2026-11-16T09:00:00+00:00"]]}
        int_mei: {time_zone: Europe/London, busy: [["2026-11-16T10:00:00+00:00", "2026-11-16T11:00:00+00:00"]]}
        int_farid: {time_zone: Europe/London, busy: [["2026-11-16T10:30:00+00:00", "2026-11-16T11:30:00+00:00"]]}
        int_olu: {time_zone: Europe/London}
        int_sofia: {time_zone: Europe/London, busy: [["2026-11-16T12:30:00+00:00", "2026-11-16T13:00:00+00:00"]]}
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_george]}
        - {id: S2, duration_min: 30, attendees: [candidate, int_mei]}
        - {id: S3, duration_min: 30, attendees: [candidate, int_farid]}
        - {id: S4, duration_min: 30, attendees: [candidate, int_olu]}
        - {id: CASE, duration_min: 60, attendees: [candidate, int_sofia]}
      constraints:
        order: [S1, S2, S3, S4, CASE]
        min_gap_min: 0
        max_gap_min: 15
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-16T09:00:00+00:00", S2: "2026-11-16T09:30:00+00:00", S3: "2026-11-16T10:00:00+00:00", S4: "2026-11-16T10:30:00+00:00", CASE: "2026-11-16T11:15:00+00:00"}
      invalid_examples:
        - {S1: "2026-11-16T09:00:00+00:00", S2: "2026-11-16T09:30:00+00:00", S3: "2026-11-16T10:00:00+00:00", S4: "2026-11-16T10:30:00+00:00", CASE: "2026-11-16T11:45:00+00:00", note: Break before the case exceeds 15 minutes.}
    grading_notes: The key failures are booking the lunch, reserving the restaurant, or treating the room as a booked resource.

  - id: STY-003
    title: Consulting final round built backward from the partner's only slot with 15-45 minute reflection breaks
    category: interview_styles_and_industries
    subcategory: consulting_partner_anchor
    description: >-
      Strategy-consulting final round in London: two case interviews followed by a partner case-and-fit
      interview. The partner is free only 3:30-4:30 p.m., and the firm requires 15-45 minute breaks between
      cases. Working backward through the engagement manager's and principal's conflicts leaves exactly one
      schedule. The candidate would like a morning start, which the break rule makes impossible.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [case_interview, in_person_loop, executive]
    tags: [consulting, partner_anchor, work_backward, max_gap, candidate_preference_unmet]
    requirement_refs: [CON-03, CON-04, SCH-01, SCH-03, SCH-06]
    source_inspiration: MBB-style final rounds where the partner interview closes the day and partner time is the binding constraint.
    inputs:
      now: "2026-11-11T09:00:00+00:00"
      recruiter: {id: rec_oskar, name: Oskar Lindahl, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Freya Nilsson
        time_zone: Europe/London
        availability:
          - {start: "2026-11-19T09:30:00+00:00", end: "2026-11-19T17:00:00+00:00"}
        preferences: [prefers to start in the morning]
      interview_plan:
        name: Consultant (post-MBA) - final round
        region: EMEA
        team: Adatum Strategy Partners - London office
        venue: Adatum Strategy Partners, 40 Example Lane, London
        sessions:
          - {id: C1, title: Case interview 1, format: in_person, duration_min: 45, interviewers: [int_rahul], order: 1}
          - {id: C2, title: Case interview 2, format: in_person, duration_min: 45, interviewers: [int_chiara], order: 2}
          - {id: P, title: Partner case and fit, format: in_person, duration_min: 60, interviewers: [int_edward], order: 3}
        rules: {break_between_sessions_min: 15, break_between_sessions_max: 45, same_day: true, partner_last: true}
      interviewers:
        - {id: int_rahul, name: Rahul Mehta, role: Engagement Manager, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-19T13:00:00+00:00", end: "2026-11-19T13:30:00+00:00", status: busy}]}
        - {id: int_chiara, name: Chiara Bianchi, role: Principal, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-19T12:30:00+00:00", end: "2026-11-19T13:45:00+00:00", status: busy}]}
        - {id: int_edward, name: Edward Nkemelu, role: Partner, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-11-19T08:00:00+00:00", end: "2026-11-19T15:30:00+00:00", status: busy},
                      {start: "2026-11-19T16:30:00+00:00", end: "2026-11-19T18:00:00+00:00", status: busy}]}
      conversation:
        - role: recruiter
          text: >-
            Edward can only do 3:30 on Thursday the 19th. Can you build Freya's final round around that? She'd
            prefer to start in the morning if at all possible.
    expected:
      disposition: propose_options
      solution_summary: >-
        Only one schedule fits on Thursday, November 19, 2026 (GMT): Case 1 with Rahul 1:30-2:15 p.m., Case 2
        with Chiara 2:30-3:15 p.m., Partner with Edward 3:30-4:30 p.m. A morning start is impossible because
        breaks may not exceed 45 minutes and the partner slot is fixed.
      must:
        - Propose Case 1 1:30-2:15, Case 2 2:30-3:15 and the partner interview 3:30-4:30 p.m. GMT on November 19, in that order.
        - Explain that a morning start would require breaks longer than the 45-minute maximum before the 3:30 p.m. partner slot.
        - Mention Rahul's 1:00-1:30 p.m. conflict as the reason Case 1 cannot start earlier within the break rule.
        - Ask whether to book the three sessions.
      must_not:
        - Propose a morning start with a long gap before the partner interview.
        - Move the partner interview before the case interviews.
        - Book or send anything before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T08:00:00+00:00", end: "2026-11-19T18:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-11-19T09:30:00+00:00", "2026-11-19T17:00:00+00:00"]]}
        int_rahul: {time_zone: Europe/London, busy: [["2026-11-19T13:00:00+00:00", "2026-11-19T13:30:00+00:00"]]}
        int_chiara: {time_zone: Europe/London, busy: [["2026-11-19T12:30:00+00:00", "2026-11-19T13:45:00+00:00"]]}
        int_edward: {time_zone: Europe/London, busy: [["2026-11-19T08:00:00+00:00", "2026-11-19T15:30:00+00:00"], ["2026-11-19T16:30:00+00:00", "2026-11-19T18:00:00+00:00"]]}
      sessions:
        - {id: C1, duration_min: 45, attendees: [candidate, int_rahul]}
        - {id: C2, duration_min: 45, attendees: [candidate, int_chiara]}
        - {id: P, duration_min: 60, attendees: [candidate, int_edward]}
      constraints:
        order: [C1, C2, P]
        min_gap_min: 15
        max_gap_min: 45
        same_local_day: {time_zone: Europe/London}
      expect_feasible: true
      valid_examples:
        - {C1: "2026-11-19T13:30:00+00:00", C2: "2026-11-19T14:30:00+00:00", P: "2026-11-19T15:30:00+00:00"}
      invalid_examples:
        - {C1: "2026-11-19T10:00:00+00:00", C2: "2026-11-19T11:00:00+00:00", P: "2026-11-19T15:30:00+00:00", note: Morning start leaves a gap far above 45 minutes.}
        - {C1: "2026-11-19T12:30:00+00:00", C2: "2026-11-19T14:00:00+00:00", P: "2026-11-19T15:30:00+00:00", note: Case 1 overlaps Rahul's 1:00 p.m. conflict.}
      valid_start_bounds:
        C1: {earliest: "2026-11-19T13:30:00+00:00", latest: "2026-11-19T13:30:00+00:00"}
        P: {earliest: "2026-11-19T15:30:00+00:00", latest: "2026-11-19T15:30:00+00:00"}

  - id: STY-004
    title: Consulting partner round requested on the candidate's own claim of passing the case round
    category: interview_styles_and_industries
    subcategory: consulting_gated_final_round
    description: >-
      Dubai consulting process where the partner round may be booked only after the round-1 debrief owner
      records a pass in the ATS. The candidate emails that an interviewer "told her she passed", and the
      recruiter, trusting it, asks for the partner round on Monday. The ATS still shows round 1 as pending. The
      agent must hold for the gate, explain what evidence is missing, and avoid telling the candidate anything
      about her result.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [case_interview, gated_rounds, executive]
    tags: [consulting, gate_policy, candidate_claim_not_evidence, neutral_messaging, dubai]
    requirement_refs: [CON-01, CON-05, INT-06, ACT-02, COM-01]
    inputs:
      now: "2026-11-11T10:00:00+04:00"
      recruiter: {id: rec_layla, name: Layla Haddad, time_zone: Asia/Dubai}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Zainab Al-Farsi
        email: zainab.alfarsi@example.org
        time_zone: Asia/Dubai
        availability:
          - {start: "2026-11-16T09:00:00+04:00", end: "2026-11-16T17:00:00+04:00"}
          - {start: "2026-11-17T09:00:00+04:00", end: "2026-11-17T12:00:00+04:00"}
      interview_plan:
        name: Associate Consultant - Middle East
        region: MEA
        team: Northwind Advisory - Dubai
        sessions:
          - {id: R1, title: Case round (two cases), format: in_person, duration_min: 90, interviewers: [int_karim, int_ines], gate: none}
          - {id: R2, title: Partner round, format: in_person, duration_min: 60, interviewers: [int_partner_omar], gate: R1 pass recorded in the ATS by the round-1 debrief owner (int_karim)}
        rules:
          gating_policy: book_after_pass
          result_source: ATS debrief record only; verbal remarks and candidate reports are not results
      interviewers:
        - {id: int_karim, name: Karim Mansour, role: Engagement Manager (debrief owner), time_zone: Asia/Dubai, availability_source: calendar}
        - {id: int_ines, name: Ines Duarte, role: Consultant, time_zone: Asia/Dubai, availability_source: calendar}
        - {id: int_partner_omar, name: Omar Al-Suwaidi, role: Partner, time_zone: Asia/Dubai, availability_source: calendar,
           calendar: [{start: "2026-11-16T08:00:00+04:00", end: "2026-11-16T10:00:00+04:00", status: busy}]}
      case_state:
        existing_bookings:
          - {session: R1, start: "2026-11-09T10:00:00+04:00", end: "2026-11-09T11:30:00+04:00", booking_state: completed}
        round_results:
          - {round: R1, result: pending, recorded_by: null, note: Debrief scheduled for 2026-11-12; scorecards not yet submitted}
      conversation:
        - role: candidate
          at: "2026-11-10T19:42:00+04:00"
          channel: email
          text: >-
            Hi Layla, thank you again for Monday! At the end Ines told me I'd "done really well and passed" and that
            I should expect the partner round soon. I'm free all day Monday the 16th and Tuesday morning. Excited!
        - role: recruiter
          at: "2026-11-11T09:55:00+04:00"
          text: >-
            Zainab says she passed - great news. Can you get Omar's partner round on the calendar for Monday? Let's
            not lose momentum.
    expected:
      disposition: hold_for_gate
      solution_summary: >-
        Do not propose or book the partner round yet. Round 1 is still pending in the ATS; a candidate's report of
        a verbal remark is not a recorded pass under the book_after_pass policy. Ask the recruiter to have Karim's
        debrief outcome recorded (debrief is on November 12) and offer to prepare Monday/Tuesday options as soon
        as a pass is recorded.
      must:
        - State that the ATS shows round 1 as pending and that the plan requires a pass recorded by the debrief owner before the partner round is scheduled.
        - Explain that the candidate's email (quoting an interviewer) is not a recorded result.
        - Offer to prepare partner-round options for Monday, November 16 or Tuesday morning, November 17 as soon as the pass is recorded.
        - If drafting any candidate reply, keep it neutral, saying only that next steps will follow after the team completes its review.
      must_not:
        - Book, hold, or propose partner-round times to the candidate.
        - Tell the candidate she passed, failed, or is likely to proceed.
        - Treat the recruiter's belief or Ines's reported remark as the gate decision.
      side_effects: {external_writes: none}
    grading_notes: Internal note-taking about Omar's Monday availability is acceptable; anything candidate-facing about the partner round is not.

  - id: STY-005
    title: Single candidate's individual exercises around a fixed assessment-centre group exercise
    category: interview_styles_and_industries
    subcategory: assessment_centre_single_candidate
    description: >-
      UK graduate assessment centre. The central assessment team already placed the candidate in the 09:30-11:00
      group exercise; the recruiter asks the agent to schedule only her individual role-play (pool of two actors)
      and a 30-minute preparation immediately followed by a 20-minute presentation to two assessors, with
      at most 15-minute transitions. Actor and assessor conflicts leave a narrow solution; the agent must not
      modify the group exercise or try to book rooms or seats for other candidates.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [assessment_center, group_interview, simulation, presentation]
    tags: [assessment_centre, fixed_group_exercise, role_play_pool, prep_then_present, single_candidate_scope, manchester]
    requirement_refs: [CON-02, CON-03, CON-06, SCH-01, AVL-08]
    source_inspiration: UK graduate-scheme assessment centres combining a group exercise, a role-play and a prepared presentation.
    inputs:
      now: "2026-11-24T11:00:00+00:00"
      recruiter: {id: rec_niamh, name: Niamh Gallagher, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aisha Bello
        time_zone: Europe/London
        availability:
          - {start: "2026-12-02T08:30:00+00:00", end: "2026-12-02T16:30:00+00:00"}
      interview_plan:
        name: Graduate Scheme 2027 - assessment centre (Manchester)
        region: UK
        team: Contoso Graduate Recruitment
        venue: Contoso Manchester Hub, 10 Example Square, Manchester
        sessions:
          - {id: GE, title: Group exercise (managed by assessment team), format: in_person, duration_min: 90, interviewers: [int_ge_lead], fixed: true, order: 1}
          - {id: RP, title: Client role-play, format: in_person, duration_min: 30, pool: {from: [int_actor_jo, int_actor_sam], count: 1}, order: 2}
          - {id: PREP, title: Presentation preparation (candidate only), format: in_person, duration_min: 30, interviewers: [], order: 3}
          - {id: PRES, title: Presentation, format: in_person, duration_min: 20, interviewers: [int_asr_amir, int_asr_beth], order: 4}
        rules:
          transition_max_min: 15
          presentation_immediately_after_prep: true
          rooms_and_seating: assigned by the assessment team; not booked by the scheduler
      interviewers:
        - {id: int_ge_lead, name: Rowan Hughes, role: Assessment lead, time_zone: Europe/London, availability_source: supplied,
           supplied_availability: [{start: "2026-12-02T09:30:00+00:00", end: "2026-12-02T11:00:00+00:00"}]}
        - {id: int_actor_jo, name: Jo Pritchard, role: Role-play assessor, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-02T10:30:00+00:00", end: "2026-12-02T11:20:00+00:00", status: busy}]}
        - {id: int_actor_sam, name: Sam Okonedo, role: Role-play assessor, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-02T11:30:00+00:00", end: "2026-12-02T12:30:00+00:00", status: busy}]}
        - {id: int_asr_amir, name: Amir Hosseini, role: Assessor, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-02T12:30:00+00:00", end: "2026-12-02T13:30:00+00:00", status: busy}]}
        - {id: int_asr_beth, name: Beth Kowalczyk, role: Assessor, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-02T13:30:00+00:00", end: "2026-12-02T14:00:00+00:00", status: busy}]}
      case_state:
        existing_bookings:
          - {session: GE, start: "2026-12-02T09:30:00+00:00", end: "2026-12-02T11:00:00+00:00", organizer: assessments@contoso.example, note: Shared group event owned by the assessment team}
      conversation:
        - role: recruiter
          text: >-
            Aisha is in the 9:30 group exercise on Wed 2 Dec (assessment team sorted that). Can you fit her role-play
            and her prep + presentation around it? Keep transitions short, max 15 min.
    expected:
      disposition: propose_options
      solution_summary: >-
        Wednesday, December 2, 2026 (GMT): group exercise 09:30-11:00 (unchanged), role-play with Sam 11:00-11:30,
        prep 11:30-12:00, presentation to Amir and Beth 12:00-12:20. Prep may shift to 11:35 or 11:40 with the
        presentation immediately after (ending by 12:30, before Amir's conflict).
      must:
        - Schedule the role-play at 11:00-11:30 GMT with Sam, because Jo is busy until 11:20 and any later start exceeds the 15-minute transition limit.
        - Put the presentation immediately after the 30-minute prep, finishing by 12:30 GMT.
        - Leave the existing group-exercise event untouched and describe it as managed by the assessment team.
        - Ask whether to book the three individual sessions for Aisha only.
      must_not:
        - Assign Jo to an 11:00 role-play.
        - Place the presentation before the role-play or separate prep and presentation.
        - Modify the shared group-exercise event, book rooms, or arrange seating for other candidates.
        - Book anything before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-02T08:00:00+00:00", end: "2026-12-02T17:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-12-02T08:30:00+00:00", "2026-12-02T16:30:00+00:00"]]}
        int_ge_lead: {time_zone: Europe/London, available: [["2026-12-02T09:30:00+00:00", "2026-12-02T11:00:00+00:00"]]}
        int_actor_jo: {time_zone: Europe/London, busy: [["2026-12-02T10:30:00+00:00", "2026-12-02T11:20:00+00:00"]]}
        int_actor_sam: {time_zone: Europe/London, busy: [["2026-12-02T11:30:00+00:00", "2026-12-02T12:30:00+00:00"]]}
        int_asr_amir: {time_zone: Europe/London, busy: [["2026-12-02T12:30:00+00:00", "2026-12-02T13:30:00+00:00"]]}
        int_asr_beth: {time_zone: Europe/London, busy: [["2026-12-02T13:30:00+00:00", "2026-12-02T14:00:00+00:00"]]}
      sessions:
        - {id: GE, duration_min: 90, attendees: [candidate, int_ge_lead]}
        - {id: RP, duration_min: 30, attendees: [candidate], pool: {from: [int_actor_jo, int_actor_sam], count: 1}}
        - {id: PREP, duration_min: 30, attendees: [candidate]}
        - {id: PRES, duration_min: 20, attendees: [candidate, int_asr_amir, int_asr_beth]}
      constraints:
        order: [GE, RP, PREP, PRES]
        min_gap_min: 0
        max_gap_min: 15
      expect_feasible: true
      valid_examples:
        - {GE: "2026-12-02T09:30:00+00:00", RP: {start: "2026-12-02T11:00:00+00:00", interviewers: [int_actor_sam]}, PREP: "2026-12-02T11:30:00+00:00", PRES: "2026-12-02T12:00:00+00:00"}
      invalid_examples:
        - {GE: "2026-12-02T09:30:00+00:00", RP: {start: "2026-12-02T11:00:00+00:00", interviewers: [int_actor_jo]}, PREP: "2026-12-02T11:30:00+00:00", PRES: "2026-12-02T12:00:00+00:00", note: Jo is busy until 11:20.}
        - {GE: "2026-12-02T09:30:00+00:00", RP: {start: "2026-12-02T11:00:00+00:00", interviewers: [int_actor_sam]}, PREP: "2026-12-02T11:45:00+00:00", PRES: "2026-12-02T12:15:00+00:00", note: Presentation runs into Amir's 12:30 conflict.}
      valid_start_bounds:
        RP: {earliest: "2026-12-02T11:00:00+00:00", latest: "2026-12-02T11:00:00+00:00"}
        PRES: {earliest: "2026-12-02T12:00:00+00:00", latest: "2026-12-02T12:10:00+00:00"}
    grading_notes: >-
      The oracle allows up to 15 minutes between prep and presentation; the plan rule requires zero, so graders should
      also check that PRES starts exactly when PREP ends (valid pairs 11:30/12:00, 11:35/12:05, 11:40/12:10).

  - id: STY-006
