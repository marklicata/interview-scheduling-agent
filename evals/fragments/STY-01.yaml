  - id: STY-007
    title: Job talk request bundled with lecture-theatre, AV technician and catering bookings
    category: interview_styles_and_industries
    subcategory: job_talk_room_request
    description: >-
      A faculty-search coordinator asks the agent to book a lecture theatre, an AV technician and sandwiches for
      a hybrid job talk, and to invite the school mailing list. Room/resource booking, catering and vendor
      outreach are not MVP capabilities. The agent should decline those parts with a recruiter-owned next step,
      while still identifying the only valid talk time (the school's Tuesday/Thursday lunchtime seminar slot on
      the candidate's single visit day) and offering to send the talk invitation once the room is confirmed.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [job_talk, campus_visit, presentation]
    tags: [academia, room_booking_later_scope, catering_out_of_scope, seminar_slot, hybrid_talk, edinburgh]
    requirement_refs: [AVL-08, SCH-07, CFG-01, ACT-01]
    inputs:
      now: "2027-01-11T10:00:00+00:00"
      recruiter: {id: rec_morag, name: Morag Fraser, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Dr. Mateo Quispe
        time_zone: Europe/London
        visit_note: Travelling from Lima; on campus only Thursday 21 January.
        availability:
          - {start: "2027-01-21T09:00:00+00:00", end: "2027-01-21T17:00:00+00:00"}
      interview_plan:
        name: Lecturer in Machine Learning - research talk
        region: UK
        team: Litware University - School of Informatics
        sessions:
          - {id: TALK, title: Research talk (hybrid), format: hybrid, duration_min: 60, attendees: [seminar_slot], host: int_fiona}
        rules:
          talk_slot: School seminar slot, Tuesdays and Thursdays 13:00-14:00 only
          audience: School of Informatics staff list (informatics-staff@contoso.example) plus Teams for remote colleagues
      interviewers:
        - {id: seminar_slot, name: School seminar slot, time_zone: Europe/London, availability_source: supplied,
           supplied_availability: [{start: "2027-01-19T13:00:00+00:00", end: "2027-01-19T14:00:00+00:00"}, {start: "2027-01-21T13:00:00+00:00", end: "2027-01-21T14:00:00+00:00"}]}
        - {id: int_fiona, name: Prof. Fiona MacLeod, role: Host, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2027-01-21T15:00:00+00:00", end: "2027-01-21T16:00:00+00:00", status: busy}]}
      conversation:
        - role: recruiter
          text: >-
            For Mateo's visit on Thursday 21 January: please book the G.07 lecture theatre and an AV tech for his
            talk at 1pm, order sandwiches for 40 from the usual caterer, and send the talk invite to the staff list.
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Decline booking G.07, the AV technician and catering (not supported; the coordinator should book them
        through Estates/the caterer). Confirm the talk fits Thursday, January 21, 2027, 13:00-14:00 GMT (the only
        seminar slot on his visit day) and offer to send the hybrid talk invitation with a Teams link to the staff
        list once the coordinator confirms the room and approves sending.
      must:
        - Say clearly that the agent cannot reserve rooms, AV technicians or catering, and that these remain the coordinator's task.
        - Confirm 13:00-14:00 GMT on Thursday, January 21 as the valid seminar-slot time for the talk.
        - Offer to send the talk invitation (with Teams for remote attendees and G.07 as location text once confirmed) after explicit confirmation.
      must_not:
        - Claim the room, technician or sandwiches were booked or requested.
        - Contact the caterer, Estates or the AV team.
        - Send the invitation to the staff list before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-18T00:00:00+00:00", end: "2027-01-23T00:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2027-01-21T09:00:00+00:00", "2027-01-21T17:00:00+00:00"]]}
        seminar_slot: {time_zone: Europe/London, available: [["2027-01-19T13:00:00+00:00", "2027-01-19T14:00:00+00:00"], ["2027-01-21T13:00:00+00:00", "2027-01-21T14:00:00+00:00"]]}
        int_fiona: {time_zone: Europe/London, busy: [["2027-01-21T15:00:00+00:00", "2027-01-21T16:00:00+00:00"]]}
      sessions:
        - {id: TALK, duration_min: 60, attendees: [candidate, seminar_slot, int_fiona]}
      expect_feasible: true
      valid_examples:
        - {TALK: "2027-01-21T13:00:00+00:00"}
      invalid_examples:
        - {TALK: "2027-01-19T13:00:00+00:00", note: Candidate is not on campus Tuesday.}
      valid_start_bounds:
        TALK: {earliest: "2027-01-21T13:00:00+00:00", latest: "2027-01-21T13:00:00+00:00"}

  - id: STY-008
    title: Virtual chalk talk with four required faculty in Boston for a Berlin candidate; tentative hold blocks the tempting slot
    category: interview_styles_and_industries
    subcategory: chalk_talk_full_panel
    description: >-
      Research-track faculty/postdoc-transition chalk talk held virtually: all four faculty must attend for
      60 minutes. The Berlin candidate accepts 09:00-19:00 CET, so only Boston mornings overlap. After calendar
      conflicts, a complete hour exists only at 10:30 ET; 12:00-13:00 ET looks free if the agent ignores one
      professor's tentative hold, which the department's default policy treats as blocking.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [job_talk, panel, presentation, virtual_1on1]
    tags: [academia, chalk_talk, full_panel, tentative_blocks, berlin, boston, acceptable_hours]
    requirement_refs: [CON-11, AVL-09, AVL-10, SCH-01]
    source_inspiration: Biomedical faculty searches where a chalk talk with the search committee follows the formal seminar.
    inputs:
      now: "2027-01-06T09:00:00-05:00"
      recruiter: {id: rec_colleen, name: Colleen Walsh, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Dr. Lena Hoffmann
        time_zone: Europe/Berlin
        acceptable_hours: {start: "09:00", end: "19:00"}
        availability:
          - {start: "2027-01-14T09:00:00+01:00", end: "2027-01-14T19:00:00+01:00"}
      interview_plan:
        name: Research Assistant Professor (Immunology) - chalk talk
        region: US
        team: Woodgrove Institute - Immunology Program
        sessions:
          - {id: CT, title: Chalk talk with search committee, format: virtual, duration_min: 60, interviewers: [int_samuel, int_ruth, int_arjun, int_meiling], all_required: true, tools: Teams with digital whiteboard}
        rules: {tentative_blocks_by_default: true}
      interviewers:
        - {id: int_samuel, name: Prof. Samuel Adeyemi, time_zone: America/New_York, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"},
           calendar: [{start: "2027-01-14T08:00:00-05:00", end: "2027-01-14T09:00:00-05:00", status: busy}]}
        - {id: int_ruth, name: Prof. Ruth Goldberg, time_zone: America/New_York, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"},
           calendar: [{start: "2027-01-14T09:30:00-05:00", end: "2027-01-14T10:30:00-05:00", status: busy}]}
        - {id: int_arjun, name: Prof. Arjun Pillai, time_zone: America/New_York, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"},
           calendar: [{start: "2027-01-14T11:30:00-05:00", end: "2027-01-14T12:00:00-05:00", status: busy}]}
        - {id: int_meiling, name: Prof. Mei-Ling Zhou, time_zone: America/New_York, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"},
           calendar: [{start: "2027-01-14T12:00:00-05:00", end: "2027-01-14T12:30:00-05:00", status: tentative, subject: "Hold - grant call?"},
                      {start: "2027-01-14T13:00:00-05:00", end: "2027-01-14T14:00:00-05:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Can you find an hour on Thursday Jan 14 for Lena's chalk talk with all four committee members? She's in Berlin.
    expected:
      disposition: propose_options
      solution_summary: >-
        Only one complete hour works on Thursday, January 14, 2027: 10:30-11:30 a.m. EST = 4:30-5:30 p.m. CET.
        12:00-1:00 p.m. EST is blocked by Prof. Zhou's tentative hold under the default policy.
      must:
        - Propose 10:30-11:30 a.m. EST (4:30-5:30 p.m. CET) on Thursday, January 14 as the only full-panel option.
        - Show the time in both Eastern and Berlin time.
        - Explain that 12:00-1:00 p.m. EST is not offered because Prof. Zhou is tentative then, and tentative blocks by default.
        - Include a Teams link with whiteboard note and ask whether to book.
      must_not:
        - Propose 12:00-1:00 p.m. EST as a confirmed option.
        - Propose any time after 1:00 p.m. EST, which is after 7:00 p.m. in Berlin.
        - Reveal more about the tentative event than its status, or book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-14T15:30:00Z", time_zone: America/New_York, expected_local: "2027-01-14T10:30", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2027-01-14T15:30:00Z", time_zone: Europe/Berlin, expected_local: "2027-01-14T16:30", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-14T00:00:00-05:00", end: "2027-01-15T00:00:00-05:00"}
      participants:
        candidate: {time_zone: Europe/Berlin, available: [["2027-01-14T09:00:00+01:00", "2027-01-14T19:00:00+01:00"]]}
        int_samuel: {time_zone: America/New_York, working_hours: {time_zone: America/New_York, start: "08:00", end: "18:00"}, busy: [["2027-01-14T08:00:00-05:00", "2027-01-14T09:00:00-05:00"]]}
        int_ruth: {time_zone: America/New_York, working_hours: {time_zone: America/New_York, start: "08:00", end: "18:00"}, busy: [["2027-01-14T09:30:00-05:00", "2027-01-14T10:30:00-05:00"]]}
        int_arjun: {time_zone: America/New_York, working_hours: {time_zone: America/New_York, start: "08:00", end: "18:00"}, busy: [["2027-01-14T11:30:00-05:00", "2027-01-14T12:00:00-05:00"]]}
        int_meiling: {time_zone: America/New_York, working_hours: {time_zone: America/New_York, start: "08:00", end: "18:00"}, busy: [["2027-01-14T12:00:00-05:00", "2027-01-14T12:30:00-05:00"], ["2027-01-14T13:00:00-05:00", "2027-01-14T14:00:00-05:00"]]}
      sessions:
        - {id: CT, duration_min: 60, attendees: [candidate, int_samuel, int_ruth, int_arjun, int_meiling]}
      expect_feasible: true
      valid_examples:
        - {CT: "2027-01-14T10:30:00-05:00"}
      invalid_examples:
        - {CT: "2027-01-14T12:00:00-05:00", note: Prof. Zhou's tentative hold blocks under the default policy.}
        - {CT: "2027-01-14T09:00:00-05:00", note: Overlaps Prof. Goldberg's 9:30 meeting.}
      valid_start_bounds:
        CT: {earliest: "2027-01-14T10:30:00-05:00", latest: "2027-01-14T10:30:00-05:00"}

  - id: STY-009
    title: Residency-style virtual interview day - offer only the program's fixed dates, choosing the one sane for Honolulu
    category: interview_styles_and_industries
    subcategory: residency_fixed_interview_days
    description: >-
      A residency program runs fixed virtual interview days and never creates custom dates. A Honolulu applicant
      originally picked the December 7 morning session, which is 3:00-7:00 a.m. Hawaii time. The only other
      program day is December 14 in the afternoon Eastern (8:00 a.m.-noon HST) with a single seat left. The
      agent should offer that fixed day, note that a proposal does not reserve the seat, and keep the optional
      pre-interview social optional.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, group_interview, informal_meal]
    tags: [healthcare, residency_interview_day, fixed_program_dates, hawaii, seat_capacity, optional_social]
    requirement_refs: [CON-01, AVL-06, AVL-10, SCH-08]
    source_inspiration: Graduate medical education virtual interview days with fixed program dates and optional pre-interview socials.
    inputs:
      now: "2026-11-20T10:00:00-05:00"
      recruiter: {id: rec_tamara, name: Tamara Rossi, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Keoni Kahale
        time_zone: Pacific/Honolulu
        availability_note: Any weekday in December, 7:00 a.m.-6:00 p.m. Hawaii time.
        availability:
          - {start: "2026-12-07T07:00:00-10:00", end: "2026-12-07T18:00:00-10:00"}
          - {start: "2026-12-14T07:00:00-10:00", end: "2026-12-14T18:00:00-10:00"}
      interview_plan:
        name: Internal Medicine Residency - virtual interview day
        region: US
        team: Woodgrove University Hospital - GME office
        organizer: im-residency@contoso.example
        sessions:
          - {id: DAY, title: Virtual interview day (welcome, three faculty interviews, resident panel), format: virtual, duration_min: 240, attendees: [program_day]}
          - {id: SOCIAL, title: Pre-interview resident social (optional), format: virtual, duration_min: 60, optional: true}
        rules:
          fixed_dates_only: true
          seats_remaining: {"2026-12-07": 3, "2026-12-14": 1}
          optional_social: Evening before each interview day, 7:00-8:00 p.m. Eastern; attendance never required or tracked.
      interviewers:
        - {id: program_day, name: Program interview day, time_zone: America/New_York, availability_source: supplied,
           supplied_availability: [{start: "2026-12-07T08:00:00-05:00", end: "2026-12-07T12:00:00-05:00"}, {start: "2026-12-14T13:00:00-05:00", end: "2026-12-14T17:00:00-05:00"}]}
      conversation:
        - role: candidate
          channel: email
          text: >-
            Hi Ms. Rossi - I picked Dec 7 but just realized that's 3am here in Honolulu (I'm on a sub-I rotation).
            Is there any later option? Sorry for the trouble!
        - role: recruiter
          text: Can you find Keoni a day that works for him? We don't add extra days.
    expected:
      disposition: propose_options
      solution_summary: >-
        Offer the Monday, December 14, 2026 session, 1:00-5:00 p.m. EST = 8:00 a.m.-12:00 p.m. HST. Only one seat
        remains and a proposal does not reserve it. The optional social is Sunday, December 13, 7:00-8:00 p.m. EST =
        2:00-3:00 p.m. HST and is not required.
      must:
        - Offer only the December 14 afternoon session, showing 1:00-5:00 p.m. EST and 8:00 a.m.-12:00 p.m. HST.
        - Explain that December 7 runs 3:00-7:00 a.m. HST, outside his stated hours.
        - Mention that only one seat remains and that it is not held until booked.
        - Describe the December 13 social as optional with times in both zones.
        - Ask whether to move his registration and send the invitation from im-residency@contoso.example.
      must_not:
        - Invent a new interview date or a custom one-on-one day.
        - Present the pre-interview social as required or as part of evaluation.
        - Book or cancel his December 7 registration before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-07T13:00:00Z", time_zone: Pacific/Honolulu, expected_local: "2026-12-07T03:00", expected_weekday: Monday, expected_utc_offset: "-10:00"}
      - {instant: "2026-12-14T18:00:00Z", time_zone: Pacific/Honolulu, expected_local: "2026-12-14T08:00", expected_weekday: Monday}
      - {instant: "2026-12-14T00:00:00Z", time_zone: America/New_York, expected_local: "2026-12-13T19:00", expected_weekday: Sunday}
      - {instant: "2026-12-14T00:00:00Z", time_zone: Pacific/Honolulu, expected_local: "2026-12-13T14:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-07T00:00:00-05:00", end: "2026-12-15T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: Pacific/Honolulu
          available: [["2026-12-07T07:00:00-10:00", "2026-12-07T18:00:00-10:00"], ["2026-12-14T07:00:00-10:00", "2026-12-14T18:00:00-10:00"]]
        program_day: {time_zone: America/New_York, available: [["2026-12-07T08:00:00-05:00", "2026-12-07T12:00:00-05:00"], ["2026-12-14T13:00:00-05:00", "2026-12-14T17:00:00-05:00"]]}
      sessions:
        - {id: DAY, duration_min: 240, attendees: [candidate, program_day]}
      expect_feasible: true
      valid_examples:
        - {DAY: "2026-12-14T13:00:00-05:00"}
      invalid_examples:
        - {DAY: "2026-12-07T08:00:00-05:00", note: 3:00 a.m. in Honolulu.}
      valid_start_bounds:
        DAY: {earliest: "2026-12-14T13:00:00-05:00", latest: "2026-12-14T13:00:00-05:00"}

  - id: STY-010
    title: Nursing interview with a night-shift charge nurse - overnight shift window and handoff blackouts
    category: interview_styles_and_industries
    subcategory: night_shift_interviewer
    description: >-
      Hospital RN hiring where the interviewer is a night charge nurse (19:00-07:30). Unit policy allows
      interviews only during the shift but outside the first hour (handoff and assessments) and the last 30
      minutes (handoff), and never during the nurse's daytime sleep. The candidate can do Tuesday evening or
      Wednesday early morning. The Wednesday 06:00 option belongs to Tuesday's overnight shift, which naive
      same-day working-hours logic misses; 19:00 and 07:00 look convenient but are handoff blackouts.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [healthcare, nursing, night_shift, overnight_working_hours, handoff_blackout, phoenix]
    requirement_refs: [AVL-03, CON-05, SCH-01, SCH-08]
    source_inspiration: Hospital nursing recruitment where night-shift charge nurses interview during quieter overnight hours.
    inputs:
      now: "2026-11-12T13:00:00-07:00"
      recruiter: {id: rec_gloria, name: Gloria Espinoza, time_zone: America/Phoenix}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marisol Vega
        time_zone: America/Phoenix
        availability:
          - {start: "2026-11-17T18:00:00-07:00", end: "2026-11-17T21:00:00-07:00"}
          - {start: "2026-11-18T06:00:00-07:00", end: "2026-11-18T08:00:00-07:00"}
      interview_plan:
        name: RN - Medical/Surgical (nights) - unit interview
        region: US
        team: Tailspin Regional Medical Center - 4 West
        venue: 4 West conference room, Tailspin Regional Medical Center, Phoenix
        sessions:
          - {id: S1, title: Unit interview with night charge nurse, format: in_person, duration_min: 30, interviewers: [int_desmond]}
        rules:
          night_staff_interview_window: during the interviewer's shift, 20:00-07:00 only (no interviews 19:00-20:00 or 07:00-07:30 handoff)
          never_during_interviewer_sleep: true
      interviewers:
        - id: int_desmond
          name: Desmond Clarke
          role: Night charge nurse
          time_zone: America/Phoenix
          availability_source: calendar
          shift: Mon/Tue/Wed nights 19:00-07:30 (shift starting on those evenings)
          calendar:
            - {start: "2026-11-17T20:30:00-07:00", end: "2026-11-17T21:30:00-07:00", status: busy, subject: Med pass rounds}
      conversation:
        - role: recruiter
          text: >-
            Marisol works days at another hospital. She can do Tue 11/17 6-9pm or Wed 11/18 6-8am. Desmond is on
            nights - can you find 30 minutes with him?
    expected:
      disposition: propose_options
      solution_summary: >-
        Valid starts (MST, Arizona does not observe DST): Tuesday, November 17, 2026 at 8:00 p.m. (8:00-8:30), or
        Wednesday, November 18 from 6:00 to 6:30 a.m. (ending by 7:00 a.m. before handoff). Both fall in
        Desmond's Tuesday-night shift.
      must:
        - Offer Tuesday 8:00-8:30 p.m. and Wednesday starts between 6:00 and 6:30 a.m. MST only.
        - Explain that 7:00-8:00 p.m. Tuesday and 7:00 a.m. Wednesday are handoff blackouts under unit policy.
        - Recognize that Wednesday 6:00 a.m. is still within Desmond's Tuesday overnight shift.
        - Include the 4 West conference room as the venue and ask whether to book.
      must_not:
        - Propose 7:00 p.m. Tuesday, 8:30 p.m. Tuesday (med pass), or any start after 6:30 a.m. Wednesday.
        - Propose daytime slots during Desmond's sleep hours.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T12:00:00-07:00", end: "2026-11-18T12:00:00-07:00"}
      participants:
        candidate:
          time_zone: America/Phoenix
          available: [["2026-11-17T18:00:00-07:00", "2026-11-17T21:00:00-07:00"], ["2026-11-18T06:00:00-07:00", "2026-11-18T08:00:00-07:00"]]
        int_desmond:
          time_zone: America/Phoenix
          working_hours: {time_zone: America/Phoenix, days: [Mon, Tue, Wed], start: "20:00", end: "07:00"}
          busy: [["2026-11-17T20:30:00-07:00", "2026-11-17T21:30:00-07:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_desmond]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-17T20:00:00-07:00"}
        - {S1: "2026-11-18T06:15:00-07:00"}
      invalid_examples:
        - {S1: "2026-11-17T19:00:00-07:00", note: Start-of-shift handoff blackout.}
        - {S1: "2026-11-18T06:45:00-07:00", note: Runs into the 07:00 handoff.}
