  - id: LOOP-033
    title: As Appropriate interviewer is free only at 8 a.m., but the AA must be last - report infeasible, do not flip the order
    category: multi_session_loops
    subcategory: aa_last_conflicts_with_only_slot
    description: >-
      The VP's only free hour on the candidate's single day is 8:00-9:00 a.m. Because the AA must follow the four core
      interviews, it cannot start before 11:40 a.m. The recruiter suggests running the AA first. The agent must refuse to
      violate the placement rule, report infeasibility, and give precise recruiter instructions for asking the VP about
      a later slot.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, as_appropriate, executive]
    tags: [four_plus_as_appropriate, as_appropriate_last, infeasible, conditional_handoff, toronto]
    requirement_refs: [CON-03, CON-05, CRD-01, CRD-02, SCH-05]
    inputs:
      now: "2026-12-01T09:00:00-05:00"
      recruiter: {id: rec_marie, name: Marie Tremblay, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Gabriel Lefebvre
        time_zone: America/Toronto
        availability:
          - {start: "2026-12-16T08:00:00-05:00", end: "2026-12-16T16:00:00-05:00"}
        notes: Only date available before his notice period starts.
      interview_plan:
        name: Director of Engineering - virtual loop with AA
        region: Canada
        team: Tailspin Commerce
        time_zone: America/Toronto
        sessions:
          - {id: S1, title: Engineering strategy, format: virtual, duration_min: 45, interviewers: [int_amelie], order: 1}
          - {id: S2, title: People leadership, format: virtual, duration_min: 45, interviewers: [int_bruno], order: 2}
          - {id: S3, title: Delivery, format: virtual, duration_min: 45, interviewers: [int_chantal], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_dominic], order: 4}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_rajiv], order: 5, conditional: true}
        rules:
          order: fixed
          same_day: true
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
          as_appropriate_policy: {placement: "last - the AA interviewer reviews the loop feedback first", booking: book with loop, decision_owner: hiring manager, candidate_label: Final conversation}
      interviewers:
        - {id: int_amelie, name: Amelie Gagnon, time_zone: America/Toronto, availability_source: calendar, calendar: []}
        - {id: int_bruno, name: Bruno Costa, time_zone: America/Toronto, availability_source: calendar, calendar: []}
        - {id: int_chantal, name: Chantal Roy, time_zone: America/Toronto, availability_source: calendar, calendar: []}
        - {id: int_dominic, name: Dominic Osei, role: Hiring manager, time_zone: America/Toronto, availability_source: calendar, calendar: []}
        - {id: int_rajiv, name: Rajiv Malhotra, role: VP (AA), time_zone: America/Toronto, availability_source: calendar,
           calendar: [{start: "2026-12-16T09:00:00-05:00", end: "2026-12-16T18:00:00-05:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Rajiv only has 8-9am on Wed Dec 16, Gabriel's only day. Just put the AA first thing and run the other four after, it's the same people anyway."
    expected:
      disposition: report_infeasible
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        No valid schedule on Wednesday, December 16, 2026: with the AA last, it can start no earlier than 11:40 a.m. EST
        (four 45-minute sessions plus 10-minute breaks from 8:00 a.m.) and no later than 3:15 p.m., while Rajiv is busy
        9:00 a.m.-6:00 p.m. Conditional path: the recruiter asks Rajiv for 45 minutes starting between 11:40 a.m. and
        3:15 p.m. EST that day; alternatively the plan owner approves a placement exception or a different AA interviewer.
      must:
        - Refuse to schedule the AA first and cite the plan's placement rule and its rationale.
        - Explain the earliest (11:40 a.m. EST) and latest (3:15 p.m. EST) possible AA starts and that Rajiv shows busy for that whole span.
        - Give the recruiter precise instructions to ask Rajiv about a 45-minute slot in that range, noting his calendar shows busy, and to report back so the agent can recheck.
        - Mention the plan-owner exception and alternate-AA paths as recruiter-owned options.
      must_not:
        - Propose or book a schedule with the AA before S1-S4.
        - Contact Rajiv or ask him to move meetings.
        - Book or hold anything.
      side_effects: {external_writes: none}
