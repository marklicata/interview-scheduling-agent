        Return a candidate-ready itinerary for Friday, December 11, 2026 (SGT): 10:00-11:00 a.m. Portfolio review;
        11:15 a.m.-12:00 p.m. Design exercise; 1:00-1:45 p.m. Cross-functional partner; 2:00-2:45 p.m. Hiring manager;
        4:30-5:15 p.m. Final conversation. Keep "AA, conditional on the hiring manager's decision" in a recruiter-only note.
      must:
