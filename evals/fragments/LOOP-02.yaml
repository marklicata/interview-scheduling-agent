  - id: LOOP-048
    title: Virtual morning loop, then an in-person As Appropriate after a one-hour commute
    category: multi_session_loops
    subcategory: mixed_mode_aa_with_travel
    description: >-
      The candidate does four virtual interviews from home, then drives to Redmond for an in-person AA with a CVP who is
      onsite only 1:30-2:30 p.m. The plan requires a 60-minute travel block (10-20 minutes after S4, AA 10-20 minutes
      after arrival). The hiring manager's 11:00-11:30 conflict forces S4 to 11:30-11:40, pinning the whole chain.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hybrid_loop, as_appropriate, executive]
    tags: [four_plus_as_appropriate, mixed_mode, travel_buffer, in_person_aa, redmond]
    requirement_refs: [CON-04, CON-12, COM-02, EC-138]
    inputs:
      now: "2026-12-02T09:00:00-08:00"
      recruiter: {id: rec_ethan, name: Ethan Brooks, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ravi Pillai
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-17T08:00:00-08:00", end: "2026-12-17T17:00:00-08:00"}
        notes: Interviews from home in Bellevue in the morning; about 45-60 minutes' drive to Redmond.
      interview_plan:
        name: Principal PM - hybrid loop with in-person AA
        team: Contoso Mixed Reality
        time_zone: America/Los_Angeles
        sessions:
          - {id: S1, title: Product sense, format: virtual, duration_min: 45, interviewers: [int_ayesha], order: 1}
          - {id: S2, title: Technical depth, format: virtual, duration_min: 45, interviewers: [int_brandon], order: 2}
          - {id: S3, title: Execution, format: virtual, duration_min: 45, interviewers: [int_chiamaka], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_devon], order: 4}
          - {id: TRAVEL, title: Travel to Redmond (not an interview), format: other, duration_min: 60, order: 5}
          - {id: AA, title: As Appropriate, format: in_person, venue: "Building 92, room 2150", duration_min: 45, interviewers: [int_lauren], order: 6, conditional: true}
        rules:
          order: fixed
          same_day: true
          break_between_items_min: 10
          max_gap_between_items_min: 20
          as_appropriate_policy: {placement: last, booking: book with loop, decision_owner: hiring manager (Devon Price), candidate_label: Final conversation}
      interviewers:
        - {id: int_ayesha, name: Ayesha Siddiqui, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_brandon, name: Brandon Yazzie, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-17T08:00:00-08:00", end: "2026-12-17T09:15:00-08:00", status: busy}]}
        - {id: int_chiamaka, name: Chiamaka Eze, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_devon, name: Devon Price, role: Hiring manager, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-17T11:00:00-08:00", end: "2026-12-17T11:30:00-08:00", status: busy}]}
        - {id: int_lauren, name: Lauren Whitaker, role: "Corporate Vice President (AA, onsite only)", time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-17T08:00:00-08:00", end: "2026-12-17T13:30:00-08:00", status: busy},
                      {start: "2026-12-17T14:30:00-08:00", end: "2026-12-17T17:00:00-08:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Ravi does the 4 virtual from home Thu 12/17, then drives in for Lauren's AA in person - she's only in B92 1:30-2:30."
    expected:
      disposition: propose_options
      solution_summary: >-
        Example (PST, Thursday, December 17, 2026): S1 8:30-9:15, S2 9:25-10:10, S3 10:30-11:15, S4 11:30 a.m.-12:15 p.m. (Teams),
        travel 12:25-1:25, Final conversation in Building 92 room 2150 at 1:35-2:20 p.m. S4 must start 11:30-11:40 a.m.
      must:
        - Keep S1-S4 virtual with Teams links and the AA in person with the Building 92 venue.
        - Include the 60-minute travel block between S4 and the AA and do not label it an interview.
        - Start S4 between 11:30 and 11:40 a.m. PST and the AA inside Lauren's 1:30-2:30 p.m. window.
        - Ask whether to book; the travel block is guidance for the candidate, not an invitation to interviewers.
      must_not:
        - Make the AA virtual or the morning sessions in person.
        - Schedule the AA with less than the required travel buffer after S4.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-17T07:00:00-08:00", end: "2026-12-17T17:00:00-08:00"}
      participants:
