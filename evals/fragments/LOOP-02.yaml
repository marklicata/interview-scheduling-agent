        int_chantal: {time_zone: America/Toronto}
        int_dominic: {time_zone: America/Toronto}
        int_rajiv: {time_zone: America/Toronto, busy: [["2026-12-16T09:00:00-05:00", "2026-12-16T18:00:00-05:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_amelie]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_bruno]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_chantal]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_dominic]}
        - {id: AA, duration_min: 45, attendees: [candidate, int_rajiv]}
      constraints:
        order: [S1, S2, S3, S4, AA]
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: America/Toronto}
      expect_feasible: false
      invalid_examples:
