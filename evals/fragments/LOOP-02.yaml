            actions: [book, reschedule, cancel]
            date_range: {start: "2026-12-14T00:00:00-06:00", end: "2026-12-19T00:00:00-06:00"}
            organizer: recruiting@contoso.example
          expires: "2026-12-19T00:00:00-06:00"
      candidate:
        id: candidate
        name: Mateus Oliveira
        time_zone: America/Chicago
      interview_plan:
