  - id: LOOP-045
    title: Booking a confirmed four-plus-AA loop partially fails - recover without duplicates
    category: multi_session_loops
    subcategory: partial_booking_failure
    description: >-
      After confirmation, the agent created S1-S3, the S4 create returned HTTP 429 (throttled), and the AA was not
      attempted. A follow-up lookup proved no S4 event exists. The confirmation still covers S4 and the AA. The agent
      should complete exactly the missing events once, report per-session status, and stop with a handoff if it fails again.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [virtual_loop, as_appropriate]
    tags: [four_plus_as_appropriate, partial_failure, idempotency, per_session_status, throttling]
    requirement_refs: [ACT-03, ACT-04, ACT-05, ACT-06, ACT-12]
    inputs:
      now: "2027-01-06T10:03:00-05:00"
      recruiter: {id: rec_kwame, name: Kwame Mensah, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sophie Laurent
        email: sophie.laurent@example.org
        time_zone: America/New_York
      interview_plan:
        name: Senior Site Reliability Engineer - virtual loop with AA
        team: Contoso Reliability
        sessions:
          - {id: S1, title: Troubleshooting, format: virtual, duration_min: 45}
          - {id: S2, title: Coding, format: virtual, duration_min: 45}
          - {id: S3, title: Systems design, format: virtual, duration_min: 45}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, conditional: true}
        rules:
          as_appropriate_policy: {booking: book with the loop, candidate_label: Final conversation}
      conversation:
        - role: agent
          at: "2027-01-06T10:00:00-05:00"
          text: >-
            Ready to book for Wednesday, January 13, 2027 (EST) from recruiting@contoso.example with Teams links: S1
            9:00-9:45, S2 10:00-10:45, S3 11:00-11:45, S4 1:00-1:45 p.m., Final conversation (AA) 2:00-2:45 p.m. Book all five?
        - role: recruiter
          at: "2027-01-06T10:01:00-05:00"
          text: "Yes, book all five."
          confirmation: true
        - role: system
          at: "2027-01-06T10:02:00-05:00"
          text: >-
            create_event S1 -> created evt_s1_6610 (sent). create_event S2 -> created evt_s2_6611 (sent). create_event S3 ->
            created evt_s3_6612 (sent). create_event S4 -> HTTP 429 Too Many Requests, Retry-After 60 s. Lookup by
            transaction id for S4 -> no event found. AA -> not attempted.
    expected:
      disposition: recover_partial
      solution_summary: >-
        S1-S3 exist and were sent. S4 does not exist (verified) and the AA was never attempted, both still covered by the
        10:01 confirmation. After the retry-after window, create S4 once and then the AA, and report each session's status;
        if S4 fails again, stop and hand off rather than looping.
      must:
        - Create only S4 and the AA, each once, after the retry-after period, reusing the confirmed details.
        - Report per-session status (S1-S3 sent; S4 and AA results) and that invitations are sent, not accepted.
        - Stop and give the recruiter a clear next step if S4 fails again, instead of retrying indefinitely.
      must_not:
        - Recreate S1, S2, or S3.
        - Claim the full loop was booked before S4 and the AA succeed.
        - Ask for a new confirmation for the already-confirmed S4 and AA, or extend the action to anything not confirmed.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S4 Hiring manager 1:00-1:45 p.m. EST on 2027-01-13, notes: Single retry after verifying no S4 exists.}
          - {type: create_event, target: AA Final conversation 2:00-2:45 p.m. EST on 2027-01-13, notes: First attempt; candidate-facing title Final conversation.}

