        int_ayesha: {time_zone: America/Los_Angeles}
        int_brandon: {time_zone: America/Los_Angeles, busy: [["2026-12-17T08:00:00-08:00", "2026-12-17T09:15:00-08:00"]]}
        int_chiamaka: {time_zone: America/Los_Angeles}
        int_devon: {time_zone: America/Los_Angeles, busy: [["2026-12-17T11:00:00-08:00", "2026-12-17T11:30:00-08:00"]]}
        int_lauren: {time_zone: America/Los_Angeles, available: [["2026-12-17T13:30:00-08:00", "2026-12-17T14:30:00-08:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_ayesha]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_brandon]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_chiamaka]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_devon]}
        - {id: TRAVEL, duration_min: 60, attendees: [candidate]}
        - {id: AA, duration_min: 45, attendees: [candidate, int_lauren]}
      constraints:
        order: [S1, S2, S3, S4, TRAVEL, AA]
        min_gap_min: 10
        max_gap_min: 20
        same_local_day: {time_zone: America/Los_Angeles}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-17T08:30:00-08:00", S2: "2026-12-17T09:25:00-08:00", S3: "2026-12-17T10:30:00-08:00", S4: "2026-12-17T11:30:00-08:00", TRAVEL: "2026-12-17T12:25:00-08:00", AA: "2026-12-17T13:35:00-08:00"}
      invalid_examples:
        - {S1: "2026-12-17T09:15:00-08:00", S2: "2026-12-17T10:10:00-08:00", S3: "2026-12-17T11:05:00-08:00", S4: "2026-12-17T12:00:00-08:00", TRAVEL: "2026-12-17T12:50:00-08:00", AA: "2026-12-17T13:30:00-08:00", note: AA starts before the travel block ends.}
      valid_start_bounds:
        S4: {earliest: "2026-12-17T11:30:00-08:00", latest: "2026-12-17T11:40:00-08:00"}
    grading_notes: TRAVEL is a candidate-only pseudo-session encoding the commute between the virtual block and the in-person AA.

  - id: LOOP-049
    title: Hiring manager records "AA needed" before the deadline - recheck and book only the same-day As Appropriate
    category: multi_session_loops
    subcategory: book_aa_after_debrief
    description: >-
      Under an "AA only after debrief" policy, the core loop is done, the hiring manager recorded "AA needed" at 2:57 p.m.
      (before the 3:00 p.m. deadline), the agent proposed the AA in the VP's window, and the recruiter confirmed. The agent
      should recheck and create exactly one AA event inside the policy's 3:30-5:00 p.m. window.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [as_appropriate, virtual_1on1]
    tags: [four_plus_as_appropriate, aa_after_debrief, recorded_decision, confirmed_booking, london]
    requirement_refs: [ACT-01, AVL-05, CON-05, COM-06]
    inputs:
      now: "2026-12-10T15:03:00+00:00"
      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rhys Morgan
        email: rhys.morgan@example.com
        time_zone: Europe/London
        availability:
          - {start: "2026-12-10T09:00:00+00:00", end: "2026-12-10T17:30:00+00:00"}
      interview_plan:
        name: Principal Consultant - UK virtual loop with AA
        team: Contoso Consulting Services
        time_zone: Europe/London
        sessions:
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_gwen], conditional: true}
        rules:
          as_appropriate_policy:
            booking: Book only after the hiring manager records "AA needed" following the debrief.
            decision_deadline: 15:00 London time for a same-day AA in the 15:30-17:00 window.
            decision_owner: hiring manager (Declan Byrne)
            candidate_label: Final conversation
      interviewers:
        - {id: int_gwen, name: Gwen Adeyemi, role: Vice President (AA), time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-10T09:00:00+00:00", end: "2026-12-10T15:30:00+00:00", status: busy},
                      {start: "2026-12-10T16:30:00+00:00", end: "2026-12-10T17:30:00+00:00", status: busy}]}
      case_state:
        existing_bookings:
          - {summary: "Core loop S1-S4 completed; S4 ended 14:30 GMT", state: completed}
        round_results:
          - {round: AA decision, result: AA needed, recorded_by: int_declan (hiring manager), recorded_at: "2026-12-10T14:57:00+00:00", source: ATS debrief form}
      conversation:
        - role: agent
          at: "2026-12-10T15:00:00+00:00"
          text: >-
            Declan recorded "AA needed" at 2:57 p.m. Gwen is free 3:30-4:30 p.m. Proposed: Final conversation with Gwen,
            3:30-4:15 p.m. GMT today (Thursday, December 10, 2026), Teams, from recruiting@contoso.example to Rhys and Gwen.
            Book it?
        - role: recruiter
          at: "2026-12-10T15:02:00+00:00"
          text: "Yes please."
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Recheck Gwen's and Rhys's availability (unchanged), then create one Teams invitation, "Final conversation",
        3:30-4:15 p.m. GMT on Thursday, December 10, 2026, from recruiting@contoso.example; report it as sent.
      must:
        - Recheck availability and create exactly one AA event at 3:30-4:15 p.m. GMT with a Teams link.
        - Use "Final conversation" as the candidate-facing title.
        - Report the invitation as sent, not accepted, and note the recorded decision it relied on.
      must_not:
        - Create duplicate AA events or modify the completed core sessions.
        - Mention the debrief or the "AA needed" decision in candidate-facing text.
        - Book outside the 3:30-5:00 p.m. policy window.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: AA Final conversation (Rhys and Gwen) 15:30-16:15 GMT on 2026-12-10, notes: Teams link; organizer recruiting@contoso.example.}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T15:00:00+00:00", end: "2026-12-10T18:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-12-10T09:00:00+00:00", "2026-12-10T17:30:00+00:00"]]}
        aa_window: {time_zone: Europe/London, available: [["2026-12-10T15:30:00+00:00", "2026-12-10T17:00:00+00:00"]]}
        int_gwen: {time_zone: Europe/London, busy: [["2026-12-10T09:00:00+00:00", "2026-12-10T15:30:00+00:00"], ["2026-12-10T16:30:00+00:00", "2026-12-10T17:30:00+00:00"]]}
      sessions:
        - {id: AA, duration_min: 45, attendees: [candidate, int_gwen, aa_window]}
      expect_feasible: true
      valid_examples:
        - {AA: "2026-12-10T15:30:00+00:00"}
      invalid_examples:
        - {AA: "2026-12-10T16:00:00+00:00", note: Runs into Gwen's 4:30 p.m. meeting.}
      valid_start_bounds:
        AA: {earliest: "2026-12-10T15:30:00+00:00", latest: "2026-12-10T15:45:00+00:00"}

