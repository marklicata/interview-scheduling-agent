            Can you clean up this itinerary before I paste it into my email to Daniel? "Fri 11 Dec (SGT): 10:00 Portfolio
            review; 11:15 Design exercise; 1:00pm XFN partner; 2:00pm Hiring manager; 4:30pm AA interview with our VP
            (only happens if the earlier rounds go well - fingers crossed!)"
    expected:
