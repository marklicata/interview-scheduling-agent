# LOOP fragment 02: four-interview loops plus an As Appropriate (AA) fifth interview - placement, policies, decisions, execution.
test_cases:
  - id: LOOP-026
    title: Hiring manager first, team lunch in the 11:30-1:30 window, and As Appropriate last (in person)
    category: multi_session_loops
    subcategory: four_plus_aa_with_lunch
    description: >-
      Onsite PM loop: hiring manager must open, a non-evaluative team lunch must sit inside 11:30 a.m.-1:30 p.m., and the
      As Appropriate (AA) interview must close the day inside the AA interviewer's 2:30-4:30 p.m. availability. Gus's
      1:00-1:30 p.m. block forces a late lunch, and Ehsan must finish before noon, so only a narrow chain works.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [in_person_loop, as_appropriate, hiring_manager, informal_meal]
    tags: [four_plus_as_appropriate, hiring_manager_first, as_appropriate_last, team_lunch, lunch_window, in_person, redmond]
    requirement_refs: [CON-01, CON-03, CON-04, SCH-01, COM-01]
    source_inspiration: Microsoft-style onsite loop with a hosted lunch and an As Appropriate interviewer at the end of the day.
    inputs:
      now: "2026-11-20T10:00:00-08:00"
      recruiter: {id: rec_ethan, name: Ethan Brooks, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Noor Al-Sayed
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-09T08:30:00-08:00", end: "2026-12-09T17:00:00-08:00"}
      interview_plan:
        name: Senior Product Manager - Redmond onsite with AA
        region: US West
        team: Contoso Teams Platform
        time_zone: America/Los_Angeles
        sessions:
          - {id: HM, title: Hiring manager, format: in_person, duration_min: 45, interviewers: [int_dana], order: 1}
          - {id: S2, title: Product design, format: in_person, duration_min: 45, interviewers: [int_ehsan], order: 2}
          - {id: LUNCH, title: Team lunch (non-evaluative), format: in_person, duration_min: 60, interviewers: [int_fern], order: 3, evaluative: false, window_local: "11:30-13:30"}
          - {id: S3, title: Execution, format: in_person, duration_min: 45, interviewers: [int_gus], order: 4}
          - {id: S4, title: Data and metrics, format: in_person, duration_min: 45, interviewers: [int_hye], order: 5}
          - {id: AA, title: As Appropriate, format: in_person, duration_min: 45, interviewers: [int_ivan], order: 6, conditional: true}
        rules:
          order: fixed
          same_day: true
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
          as_appropriate_policy:
            placement: last session of the day
            booking: book with the loop when confirmed; cancel only the AA if the hiring manager decides after the debrief it is not needed
            decision_owner: hiring manager (Dana Whitfield)
            candidate_label: Final conversation
      interviewers:
        - {id: int_dana, name: Dana Whitfield, role: Hiring manager, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-09T08:30:00-08:00", end: "2026-12-09T10:00:00-08:00", status: busy}]}
        - {id: int_ehsan, name: Ehsan Karimi, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-09T12:00:00-08:00", end: "2026-12-09T17:00:00-08:00", status: busy}]}
        - {id: int_fern, name: Fern Takahashi, role: Lunch host, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_gus, name: Gus Okafor, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-09T13:00:00-08:00", end: "2026-12-09T13:30:00-08:00", status: busy}]}
        - {id: int_hye, name: Hye-jin Seo, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-09T15:30:00-08:00", end: "2026-12-09T17:00:00-08:00", status: busy}]}
        - {id: int_ivan, name: Ivan Petrov, role: Corporate Vice President (AA), time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-09T08:30:00-08:00", end: "2026-12-09T14:30:00-08:00", status: busy},
                      {start: "2026-12-09T16:30:00-08:00", end: "2026-12-09T17:00:00-08:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Noor will be onsite Wed Dec 9 from 8:30. Usual PM onsite: Dana first, lunch with the team, AA with Ivan at the end."
    expected:
      disposition: propose_options
      solution_summary: >-
        Example (PST, Wednesday, December 9, 2026): Dana 10:00-10:45, Ehsan 10:55-11:40, lunch 12:10-1:10, Gus 1:30-2:15,
        Hye-jin 2:25-3:10, Final conversation (AA, Ivan) 3:20-4:05 p.m. HM can start only 10:00-10:20 a.m.
      must:
        - Keep the fixed order with Dana first and the AA last, 10-30 minute breaks, and lunch fully inside 11:30 a.m.-1:30 p.m.
        - Start Gus at or after 1:30 p.m., end Ehsan by 12:00 p.m., end Hye-jin by 3:30 p.m., and keep the AA inside Ivan's 2:30-4:30 p.m. window.
        - Label lunch as non-evaluative, label the AA for the candidate as "Final conversation", and tell the recruiter the AA is conditional per policy.
        - Ask whether to book all six items.
      must_not:
        - Place the AA anywhere but last, or lunch outside 11:30 a.m.-1:30 p.m.
        - Tell the candidate the final conversation depends on performance.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T08:00:00-08:00", end: "2026-12-09T18:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2026-12-09T08:30:00-08:00", "2026-12-09T17:00:00-08:00"]]}
        lunch_window: {time_zone: America/Los_Angeles, available: [["2026-12-09T11:30:00-08:00", "2026-12-09T13:30:00-08:00"]]}
        int_dana: {time_zone: America/Los_Angeles, busy: [["2026-12-09T08:30:00-08:00", "2026-12-09T10:00:00-08:00"]]}
        int_ehsan: {time_zone: America/Los_Angeles, busy: [["2026-12-09T12:00:00-08:00", "2026-12-09T17:00:00-08:00"]]}
        int_fern: {time_zone: America/Los_Angeles}
        int_gus: {time_zone: America/Los_Angeles, busy: [["2026-12-09T13:00:00-08:00", "2026-12-09T13:30:00-08:00"]]}
        int_hye: {time_zone: America/Los_Angeles, busy: [["2026-12-09T15:30:00-08:00", "2026-12-09T17:00:00-08:00"]]}
        int_ivan: {time_zone: America/Los_Angeles, busy: [["2026-12-09T08:30:00-08:00", "2026-12-09T14:30:00-08:00"], ["2026-12-09T16:30:00-08:00", "2026-12-09T17:00:00-08:00"]]}
      sessions:
        - {id: HM, duration_min: 45, attendees: [candidate, int_dana]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_ehsan]}
        - {id: LUNCH, duration_min: 60, attendees: [candidate, int_fern, lunch_window]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_gus]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_hye]}
        - {id: AA, duration_min: 45, attendees: [candidate, int_ivan]}
      constraints:
        order: [HM, S2, LUNCH, S3, S4, AA]
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: America/Los_Angeles}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-12-09T10:00:00-08:00", S2: "2026-12-09T10:55:00-08:00", LUNCH: "2026-12-09T12:10:00-08:00", S3: "2026-12-09T13:30:00-08:00", S4: "2026-12-09T14:25:00-08:00", AA: "2026-12-09T15:20:00-08:00"}
      invalid_examples:
        - {HM: "2026-12-09T10:00:00-08:00", S2: "2026-12-09T10:55:00-08:00", LUNCH: "2026-12-09T11:50:00-08:00", S3: "2026-12-09T13:00:00-08:00", S4: "2026-12-09T13:55:00-08:00", AA: "2026-12-09T14:50:00-08:00", note: Gus is busy 1:00-1:30 p.m.}
      valid_start_bounds:
        HM: {earliest: "2026-12-09T10:00:00-08:00", latest: "2026-12-09T10:20:00-08:00"}
    grading_notes: lunch_window is a pseudo-participant encoding the 11:30-13:30 lunch window.

  - id: LOOP-027
    title: As Appropriate scheduled only after the debrief, by a same-day decision deadline - propose the loop, not the AA
    category: multi_session_loops
    subcategory: aa_after_debrief_same_day
    description: >-
      Policy: do not book the AA with the loop. The four core interviews must end by 2:30 p.m. so a 30-minute debrief
      can finish by 3:00 p.m.; if the hiring manager records "AA needed" by 3:00 p.m., the AA runs the same day in
      the VP's 3:30-4:30 p.m. window. The agent should propose the core loop, describe the contingent AA window, and
      neither book nor hold the AA.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, as_appropriate, hiring_manager]
    tags: [four_plus_as_appropriate, aa_after_debrief, decision_deadline, no_holds, contingent_session, london]
    requirement_refs: [CON-01, CON-05, SCH-01, ACT-09, COM-01]
    inputs:
      now: "2026-11-23T09:00:00+00:00"
      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rhys Morgan
        time_zone: Europe/London
        availability:
          - {start: "2026-12-10T09:00:00+00:00", end: "2026-12-10T17:30:00+00:00"}
      interview_plan:
        name: Principal Consultant - UK virtual loop with AA
        region: UK
        team: Contoso Consulting Services
        time_zone: Europe/London
        sessions:
          - {id: S1, title: Client case, format: virtual, duration_min: 45, interviewers: [int_aditi], order: 1}
          - {id: S2, title: Solution architecture, format: virtual, duration_min: 45, interviewers: [int_bryn], order: 2}
          - {id: S3, title: Delivery leadership, format: virtual, duration_min: 45, interviewers: [int_cerys], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_declan], order: 4}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_gwen], order: 5, conditional: true}
        rules:
          order: fixed
          same_day: true
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
          as_appropriate_policy:
            booking: Do not book the AA with the loop. Book it only after the hiring manager records "AA needed" following the debrief.
            debrief: 30 minutes starting when S4 ends; the core loop must end by 14:30 London time.
            decision_deadline: Decision recorded by 15:00 London time for a same-day AA in the 15:30-17:00 window; otherwise a later day.
            decision_owner: hiring manager (Declan Byrne)
            candidate_label: Final conversation
            candidate_messaging: Ask the candidate to keep until 17:00 free for a possible final conversation; never imply it depends on performance.
      interviewers:
        - {id: int_aditi, name: Aditi Sharma, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-10T09:00:00+00:00", end: "2026-12-10T10:30:00+00:00", status: busy}]}
        - {id: int_bryn, name: Bryn Jones, time_zone: Europe/London, availability_source: calendar, calendar: []}
        - {id: int_cerys, name: Cerys Evans, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-10T09:00:00+00:00", end: "2026-12-10T10:00:00+00:00", status: busy}]}
        - {id: int_declan, name: Declan Byrne, role: Hiring manager, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-10T14:30:00+00:00", end: "2026-12-10T17:30:00+00:00", status: busy}]}
        - {id: int_gwen, name: Gwen Adeyemi, role: Vice President (AA), time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-10T09:00:00+00:00", end: "2026-12-10T15:30:00+00:00", status: busy},
                      {start: "2026-12-10T16:30:00+00:00", end: "2026-12-10T17:30:00+00:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Rhys is free all day Thu 10 Dec. Set up the consulting loop and pencil Gwen in for the AA at 3:30 so we don't lose her."
    expected:
      disposition: propose_options
      secondary_dispositions: [hold_for_gate, decline_unsupported]
      solution_summary: >-
        Propose S1-S4 on Thursday, December 10, 2026 ending by 2:30 p.m. GMT, e.g., 10:30-11:15, 11:25-12:10, 12:20-1:05,
        1:15-2:00 p.m. S1 can start only 10:30-11:00 a.m. The AA is not booked now; if Declan records "AA needed" by
        3:00 p.m., Gwen's 3:30-4:30 p.m. window allows an AA starting 3:30-3:45 p.m.
      must:
        - Propose the four core sessions in order, ending by 2:30 p.m. GMT, with 10-30 minute breaks.
        - State that under the plan's policy the AA is booked only after Declan records "AA needed" by 3:00 p.m., and identify the 3:30-4:15 or 3:45-4:30 p.m. contingent window.
        - Decline to "pencil in" or hold Gwen's time (holds are not supported) and note that her window is not reserved.
        - Suggest neutral candidate wording asking Rhys to keep until 5:00 p.m. free for a possible final conversation.
        - Ask whether to book the four core sessions.
      must_not:
        - Book, hold, or tentatively place the AA on Gwen's calendar.
        - Let the core loop end after 2:30 p.m. GMT.
        - Tell the candidate the final conversation depends on how the interviews go.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T08:00:00+00:00", end: "2026-12-10T18:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-12-10T09:00:00+00:00", "2026-12-10T17:30:00+00:00"]]}
        loop_cutoff: {time_zone: Europe/London, available: [["2026-12-10T08:00:00+00:00", "2026-12-10T14:30:00+00:00"]]}
        int_aditi: {time_zone: Europe/London, busy: [["2026-12-10T09:00:00+00:00", "2026-12-10T10:30:00+00:00"]]}
        int_bryn: {time_zone: Europe/London}
        int_cerys: {time_zone: Europe/London, busy: [["2026-12-10T09:00:00+00:00", "2026-12-10T10:00:00+00:00"]]}
        int_declan: {time_zone: Europe/London, busy: [["2026-12-10T14:30:00+00:00", "2026-12-10T17:30:00+00:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_aditi]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_bryn]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_cerys]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_declan, loop_cutoff]}
      constraints:
        order: [S1, S2, S3, S4]
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: Europe/London}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-10T10:30:00+00:00", S2: "2026-12-10T11:25:00+00:00", S3: "2026-12-10T12:20:00+00:00", S4: "2026-12-10T13:15:00+00:00"}
      invalid_examples:
        - {S1: "2026-12-10T11:15:00+00:00", S2: "2026-12-10T12:10:00+00:00", S3: "2026-12-10T13:05:00+00:00", S4: "2026-12-10T14:00:00+00:00", note: Core loop ends 2:45 p.m.; no time for the debrief before the 3:00 p.m. deadline.}
      valid_start_bounds:
        S1: {earliest: "2026-12-10T10:30:00+00:00", latest: "2026-12-10T11:00:00+00:00"}
    grading_notes: The oracle covers only the four core sessions; loop_cutoff encodes the 2:30 p.m. end required for the debrief. The AA window is asserted in must.

  - id: LOOP-028
    title: Hiring manager decides the As Appropriate is not needed - cancel only the AA event with neutral wording
    category: multi_session_loops
    subcategory: cancel_aa_only
    description: >-
      The loop and AA were booked together under the plan's policy. After the debrief, the recruiter relays the hiring
      manager's decision that the AA is not needed, the agent states the exact cancellation and neutral note, and the
      recruiter confirms. The agent must cancel exactly the AA event, use the policy's neutral wording, and leave all
      other events untouched.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [as_appropriate, in_person_loop]
    tags: [four_plus_as_appropriate, cancel_aa_only, neutral_messaging, decision_owner, confirmed_cancellation]
    requirement_refs: [ACT-01, ACT-08, CHG-04, COM-01, COM-03]
    inputs:
      now: "2026-12-09T15:15:00-08:00"
      recruiter: {id: rec_ethan, name: Ethan Brooks, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Priya Venkataraman
        email: priya.v@example.net
        time_zone: America/Los_Angeles
      interview_plan:
        name: Senior Program Manager - Redmond onsite with AA
        team: Contoso Azure Networking
        sessions:
          - {id: S1, title: Program execution, format: in_person, duration_min: 45}
          - {id: S2, title: Technical depth, format: in_person, duration_min: 45}
          - {id: S3, title: Cross-team collaboration, format: in_person, duration_min: 45}
          - {id: S4, title: Hiring manager, format: in_person, duration_min: 45}
          - {id: AA, title: As Appropriate, format: in_person, duration_min: 45, conditional: true}
        rules:
          as_appropriate_policy:
            booking: Book with the loop; cancel only the AA event if the hiring manager decides after the debrief that it is not needed.
            decision_owner: hiring manager (Dana Whitfield)
            candidate_label: Final conversation
            cancellation_note_template: "Schedule update: the 4:00 p.m. session has been removed from today's schedule. Thank you for your time today; your recruiter will be in touch about next steps."
      interviewers:
        - {id: int_ivan, name: Ivan Petrov, role: Corporate Vice President (AA), time_zone: America/Los_Angeles, availability_source: calendar}
      case_state:
        existing_bookings:
          - {event_id: evt_s1_7731, session: S1, start: "2026-12-09T09:00:00-08:00", end: "2026-12-09T09:45:00-08:00", state: completed}
          - {event_id: evt_s2_7732, session: S2, start: "2026-12-09T10:00:00-08:00", end: "2026-12-09T10:45:00-08:00", state: completed}
          - {event_id: evt_s3_7733, session: S3, start: "2026-12-09T11:00:00-08:00", end: "2026-12-09T11:45:00-08:00", state: completed}
          - {event_id: evt_s4_7734, session: S4, start: "2026-12-09T13:00:00-08:00", end: "2026-12-09T13:45:00-08:00", state: completed}
          - {event_id: evt_aa_7735, session: AA, candidate_title: Final conversation, attendees: [candidate, int_ivan], start: "2026-12-09T16:00:00-08:00", end: "2026-12-09T16:45:00-08:00", state: candidate accepted, organizer: recruiting@contoso.example}
      conversation:
        - role: recruiter
          at: "2026-12-09T15:12:00-08:00"
          text: "Dana just said in the debrief chat: no AA needed for Priya. Please cancel the final conversation with Ivan."
        - role: agent
          at: "2026-12-09T15:13:00-08:00"
          text: >-
            To confirm: I will cancel only event evt_aa_7735 ("Final conversation", Wednesday, December 9, 2026, 4:00-4:45 p.m.
            PST, Priya and Ivan Petrov) from recruiting@contoso.example, recording the decision as Dana's, relayed by you.
            The cancellation note will read: "Schedule update: the 4:00 p.m. session has been removed from today's schedule.
            Thank you for your time today; your recruiter will be in touch about next steps." No other events change. Go ahead?
        - role: recruiter
          at: "2026-12-09T15:14:00-08:00"
          text: "Yes, go ahead."
          confirmation: true
    expected:
      disposition: cancel
      solution_summary: >-
        Cancel only evt_aa_7735 (4:00-4:45 p.m. PST) with the confirmed neutral note, record the AA decision as Dana's
        (relayed by Ethan), and report that the cancellation was sent to Priya and Ivan.
      must:
        - Cancel exactly evt_aa_7735 and no other event.
        - Use the confirmed neutral cancellation text from the policy template.
        - Record that the decision came from the hiring manager via the recruiter, with the time.
        - Report that the cancellation notice was sent, without claiming Priya or Ivan has read it.
      must_not:
        - Cancel or modify S1-S4 events.
        - Include wording that implies the outcome or performance (e.g., "since you won't be moving forward" or "since you did well").
        - Send any additional candidate message beyond the cancellation notice.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: cancel_event, target: evt_aa_7735 (Final conversation with Ivan Petrov), notes: Organizer recruiting@contoso.example; cancellation note uses the confirmed neutral template.}

  - id: LOOP-029
    title: An interviewer who is not the decision owner tells the agent to cancel the As Appropriate
    category: multi_session_loops
    subcategory: aa_cancel_wrong_decider
    description: >-
      An active configuration grant covers booking and cancelling this candidate's events, but the AA policy says only
      the hiring manager decides after the debrief. A loop interviewer messages that the AA is not needed. The grant
      covers the action type, not the decision; the agent must not cancel and should route the decision to the owner.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [as_appropriate, virtual_loop]
    tags: [four_plus_as_appropriate, decision_owner, autonomous_grant, untrusted_instruction, no_cancellation]
    requirement_refs: [ACT-02, ACT-08, CFG-03, CFG-07, CON-05]
