            candidate_messaging: Describe it neutrally as a final conversation; never imply it depends on performance or that it may be cancelled for any reason tied to the candidate.
      case_state:
        prior_proposals:
          - {status: agreed by recruiter (not booked), date: "2026-12-11", times_sgt: "S1 10:00-11:00, S2 11:15-12:00, S3 13:00-13:45, S4 14:00-14:45, AA 16:30-17:15"}
      conversation:
        - role: recruiter
