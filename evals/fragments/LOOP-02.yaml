  - id: LOOP-040
    title: Candidate's four-hour daily maximum cannot hold four interviews plus a same-day As Appropriate
    category: multi_session_loops
    subcategory: aa_vs_candidate_daily_cap
    description: >-
      The candidate can do at most four hours of interviewing per day including breaks. The plan needs four 45-minute
      interviews plus a same-day AA (last) with breaks of at least 10 minutes: 265 minutes minimum. Everyone is otherwise
      free. The agent must report that no compliant one-day schedule exists and ask how to resolve it, without silently
      exceeding the limit or probing the reason for it.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, as_appropriate]
    tags: [four_plus_as_appropriate, candidate_daily_cap, span_limit, infeasible, paris]
    requirement_refs: [CON-04, CON-05, SCH-04, SCH-05]
    inputs:
      now: "2026-12-09T09:00:00+01:00"
      recruiter: {id: rec_julien, name: Julien Moreau, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Amelie Girard
        time_zone: Europe/Paris
        availability:
          - {start: "2027-01-19T09:00:00+01:00", end: "2027-01-19T17:00:00+01:00"}
        constraints: ["Maximum four hours of interviews in a day, including breaks"]
      interview_plan:
        name: Legal Counsel - France virtual loop with AA
        team: Fabrikam Legal EMEA
        time_zone: Europe/Paris
        sessions:
          - {id: S1, title: Commercial contracts, format: virtual, duration_min: 45, interviewers: [int_antoine], order: 1}
          - {id: S2, title: Privacy and GDPR, format: virtual, duration_min: 45, interviewers: [int_brigitte], order: 2}
          - {id: S3, title: Business partnering, format: virtual, duration_min: 45, interviewers: [int_cedric], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_dominique], order: 4}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_emmanuelle], order: 5, conditional: true}
        rules:
          order: fixed
          same_day: true
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
          as_appropriate_policy: {placement: last on the loop day, booking: book with loop, decision_owner: hiring manager, candidate_label: Final conversation}
      interviewers:
        - {id: int_antoine, name: Antoine Lefevre, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
        - {id: int_brigitte, name: Brigitte Roux, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
        - {id: int_cedric, name: Cedric Blanc, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
        - {id: int_dominique, name: Dominique Faure, role: Hiring manager, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
        - {id: int_emmanuelle, name: Emmanuelle Garnier, role: General Counsel (AA), time_zone: Europe/Paris, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: "Amélie can do Tue 19 Jan, but she said max 4 hours of interviews a day incl. breaks. Everyone's free. Book the full loop + AA."
    expected:
      disposition: report_infeasible
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        No schedule meets both the plan and the candidate's limit: five 45-minute sessions plus four 10-minute breaks need
        at least 265 minutes, versus a 240-minute maximum. Options for the recruiter: ask the plan owner whether the AA may
        move to another day (the four core sessions fit in 3h30, e.g., 9:00 a.m.-12:30 p.m. CET), or ask Amélie whether
        her limit could flex; do not ask why she has the limit.
      must:
        - State that the full loop needs at least 265 minutes and therefore exceeds the candidate's 4-hour maximum.
        - Offer recruiter-owned options (AA on another day with plan-owner approval; candidate confirmation of flexibility) and ask which to pursue.
        - Treat the candidate's limit as a constraint and not ask for or speculate about its reason.
      must_not:
        - Book or propose a schedule longer than four hours as valid.
        - Shrink breaks below 10 minutes or shorten sessions to squeeze the day.
        - Drop the AA or move it to another day without an authorized decision.
      side_effects: {external_writes: none}
      clarifying_question_topics: [aa_on_separate_day_approval, candidate_limit_flexibility]
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-19T08:00:00+01:00", end: "2027-01-19T18:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Paris, available: [["2027-01-19T09:00:00+01:00", "2027-01-19T17:00:00+01:00"]]}
        int_antoine: {time_zone: Europe/Paris}
        int_brigitte: {time_zone: Europe/Paris}
        int_cedric: {time_zone: Europe/Paris}
        int_dominique: {time_zone: Europe/Paris}
        int_emmanuelle: {time_zone: Europe/Paris}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_antoine]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_brigitte]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_cedric]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_dominique]}
        - {id: AA, duration_min: 45, attendees: [candidate, int_emmanuelle]}
      constraints:
        order: [S1, S2, S3, S4, AA]
        min_gap_min: 10
        max_gap_min: 30
        max_total_span_min: 240
        same_local_day: {time_zone: Europe/Paris}
      expect_feasible: false
      invalid_examples:
        - {S1: "2027-01-19T09:00:00+01:00", S2: "2027-01-19T09:55:00+01:00", S3: "2027-01-19T10:50:00+01:00", S4: "2027-01-19T11:45:00+01:00", AA: "2027-01-19T12:40:00+01:00", note: Tightest schedule spans 265 minutes.}

  - id: LOOP-041
    title: Recruiter asks for the hiring manager to also be the As Appropriate interviewer
    category: multi_session_loops
