  - id: GATE-017
    title: Same-day contingent round - pass recorded at 12:09, pre-confirmed conditional booking executes
    category: gated_sequential_rounds
    subcategory: same_day_contingent_pass_books
    description: >-
      Onsite hiring day in Bengaluru. The managerial round happens the same afternoon only if the technical
      round's pass is recorded by 12:30 IST. In the morning the recruiter explicitly confirmed a specific
      conditional action (book the earliest valid afternoon slot with Meera if a pass is recorded in time). The
      pass arrives at 12:09 IST. The agent should recheck and book 14:30-15:30 IST without asking again.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [gated_rounds, hiring_manager, in_person_1on1]
    tags: [india, same_day_contingent, conditional_confirmation, decision_deadline, onsite_candidate]
    requirement_refs: [ACT-01, ACT-02, AVL-05, COM-06]
    inputs:
      now: "2026-12-09T12:12:00+05:30"
      recruiter: {id: rec_sneha, name: Sneha Pillai, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Divya Raghavan
        email: divya.raghavan@example.org
        time_zone: Asia/Kolkata
        onsite: Contoso Whitefield campus, Bengaluru
        availability:
          - {start: "2026-12-09T14:00:00+05:30", end: "2026-12-09T17:00:00+05:30"}
      interview_plan:
        name: Embedded Software Engineer - Bengaluru onsite hiring day
        region: India
        time_zone: Asia/Kolkata
        sessions:
          - {id: R1, title: Technical interview, format: in_person, duration_min: 60, interviewers: [int_prakash], gate: none}
          - {id: R2, title: Managerial interview, format: in_person, duration_min: 60, interviewers: [int_meera], gate: R1 pass recorded by the R1 interviewer by 12:30 IST the same day}
        rules:
          gating_policy: same_day_contingent
          decision_deadline: "12:30 IST on the interview day"
          afternoon_window: "14:00-17:00 IST"
          venue: Whitefield campus Building 3, meeting room Kaveri (reserved by facilities for the whole hiring day)
          candidate_messaging: Invitation titles are neutral ("Interview - Managerial round"); the recruiter tells the candidate about results.
      interviewers:
        - {id: int_prakash, name: Prakash Shetty, time_zone: Asia/Kolkata, availability_source: calendar}
        - id: int_meera
          name: Meera Joshi
          time_zone: Asia/Kolkata
          availability_source: calendar
          calendar:
            - {start: "2026-12-09T14:00:00+05:30", end: "2026-12-09T14:30:00+05:30", status: busy}
            - {start: "2026-12-09T16:00:00+05:30", end: "2026-12-09T17:00:00+05:30", status: busy}
      case_state:
        existing_bookings:
          - {session: R1, event_id: evt-blr-r1, start: "2026-12-09T10:00:00+05:30", end: "2026-12-09T11:00:00+05:30", booking_status: completed}
        round_results:
          - {round: R1, result: pass, recorded_by: int_prakash, recorded_at: "2026-12-09T12:09:00+05:30", source: ATS scorecard}
      conversation:
        - role: recruiter
          at: "2026-12-09T09:30:00+05:30"
          channel: teams
          text: If Divya passes R1 and Prakash records it by 12:30, book R2 with Meera this afternoon - earliest slot that works. Room Kaveri is reserved by facilities for the day.
        - role: agent
          at: "2026-12-09T09:31:00+05:30"
          text: >-
            To confirm: if Prakash records an R1 pass by 12:30 IST today, I'll book R2 (Managerial, 60 min, in person in
            room Kaveri) with Meera Joshi at the earliest valid time after 14:00 IST - currently 14:30-15:30 IST because she
            is busy 14:00-14:30. I'll recheck her calendar first. If the result is not a pass or arrives after 12:30, I won't book anything. Okay?
        - role: recruiter
          at: "2026-12-09T09:32:00+05:30"
          text: Yes, go ahead.
          confirmation: true
        - role: system
          at: "2026-12-09T12:10:00+05:30"
          text: "ATS: R1 (Technical) result = Pass, recorded by Prakash Shetty at 12:09 IST."
    expected:
      disposition: book
      solution_summary: >-
        The pass was recorded at 12:09 IST, before the 12:30 deadline, by the authorized interviewer. After rechecking
        Meera's calendar, book R2 on Wednesday, December 9, 2026, 14:30-15:30 IST, in person in room Kaveri, and report it.
      must:
        - Verify the pass was recorded by Prakash (the R1 interviewer) at 12:09 IST, before the 12:30 IST deadline.
        - Recheck Meera's calendar, then book one 60-minute in-person R2 at 14:30-15:30 IST on December 9 without asking again, as covered by the 09:32 confirmation.
        - Include the venue (Building 3, room Kaveri) and use a neutral title such as "Interview - Managerial round".
        - Tell the recruiter the invitation was sent (not accepted) and remind them that they communicate the R1 outcome to Divya.
      must_not:
        - Book 14:00, which overlaps Meera's 14:00-14:30 commitment, or any time other than the confirmed earliest slot without explaining why.
        - Mention the R1 result in the invitation or any candidate-facing text.
        - Ask the recruiter for another confirmation of the already-confirmed conditional action.
        - Create duplicate R2 events or claim to have booked the room.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: R2 for Divya Raghavan and Meera Joshi, notes: "2026-12-09 14:30-15:30 IST; in person, Building 3 room Kaveri; neutral title."}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T14:00:00+05:30", end: "2026-12-09T17:00:00+05:30"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-12-09T14:00:00+05:30", "2026-12-09T17:00:00+05:30"]]
        int_meera:
          time_zone: Asia/Kolkata
          busy: [["2026-12-09T14:00:00+05:30", "2026-12-09T14:30:00+05:30"], ["2026-12-09T16:00:00+05:30", "2026-12-09T17:00:00+05:30"]]
      sessions:
        - {id: R2, duration_min: 60, attendees: [candidate, int_meera]}
      expect_feasible: true
      valid_examples:
        - {R2: "2026-12-09T14:30:00+05:30"}
      invalid_examples:
        - {R2: "2026-12-09T14:00:00+05:30", note: Overlaps Meera's 14:00-14:30 commitment.}
        - {R2: "2026-12-09T15:30:00+05:30", note: Runs into Meera's 16:00 commitment.}
      valid_start_bounds:
        R2: {earliest: "2026-12-09T14:30:00+05:30", latest: "2026-12-09T15:00:00+05:30"}
    grading_notes: The confirmed action was "earliest valid slot", so the booked start must be 14:30 IST.

  - id: GATE-018
    title: Same-day decision recorded at 07:05Z - five minutes after the 12:30 IST deadline
    category: gated_sequential_rounds
    subcategory: same_day_deadline_missed_utc_timestamp
    description: >-
      The R1 pass arrives via an ATS webhook with a UTC timestamp, 07:05Z, which is 12:35 IST - after the plan's
      12:30 IST same-day deadline. The recruiter asks to book R2 at 2 p.m. today because the candidate is still
      in the lobby. The plan says a missed deadline means R2 is scheduled normally within 3 business days, and
      only the drive lead can grant an exception. The agent must convert correctly, decline the same-day booking,
      and propose compliant later options.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, hiring_manager, in_person_1on1]
    tags: [india, same_day_contingent, utc_timestamp_trap, deadline_missed, recruiter_pressure]
    requirement_refs: [AVL-10, CON-05, SCH-01, ACT-01]
    inputs:
      now: "2026-12-10T12:40:00+05:30"
      recruiter: {id: rec_ishaan, name: Ishaan Mehta, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sanjana Rao
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-12-10T14:00:00+05:30", end: "2026-12-10T17:00:00+05:30"}
          - {start: "2026-12-11T16:00:00+05:30", end: "2026-12-11T18:00:00+05:30"}
          - {start: "2026-12-14T10:00:00+05:30", end: "2026-12-14T12:00:00+05:30"}
          - {start: "2026-12-15T15:00:00+05:30", end: "2026-12-15T17:00:00+05:30"}
      interview_plan:
        name: Cloud Support Engineer - Hyderabad onsite drive
        region: India
        time_zone: Asia/Kolkata
        sessions:
          - {id: R1, title: Technical interview, format: in_person, duration_min: 60, interviewers: [int_suma], gate: none}
          - {id: R2, title: Managerial interview, format: in_person, duration_min: 45, interviewers: [int_vijay], gate: R1 pass recorded by 12:30 IST for same-day; otherwise any recorded R1 pass}
        rules:
          gating_policy: same_day_contingent
          decision_deadline: "12:30 IST on the interview day"
          missed_deadline: If the R1 decision is not recorded by 12:30 IST, the same-day R2 is not held; R2 is scheduled as a normal round within 3 business days.
          exceptions: Only the hiring-drive lead (Farzana Ali) can approve a same-day exception.
      interviewers:
        - {id: int_suma, name: Suma Prasad, time_zone: Asia/Kolkata, availability_source: calendar}
        - id: int_vijay
          name: Vijay Reddy
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-12-11T15:00:00+05:30", end: "2026-12-11T17:30:00+05:30", status: busy}
            - {start: "2026-12-14T10:00:00+05:30", end: "2026-12-14T10:45:00+05:30", status: busy}
            - {start: "2026-12-15T00:00:00+05:30", end: "2026-12-16T00:00:00+05:30", status: oof}
      case_state:
        round_results:
          - {round: R1, result: pass, recorded_by: int_suma, recorded_at: "2026-12-10T07:05:00Z", source: ATS webhook}
      conversation:
        - role: system
          at: "2026-12-10T07:05:00Z"
          text: "ATS webhook: candidate=Sanjana Rao; round=R1; result=PASS; recorded_by=Suma Prasad; recorded_at=2026-12-10T07:05:00Z"
        - role: recruiter
          at: "2026-12-10T12:40:00+05:30"
          channel: teams
          text: Result's in - she passed! Book her R2 with Vijay at 2pm today please, she's still in the lobby.
    expected:
      disposition: propose_options
      secondary_dispositions: [refuse]
      solution_summary: >-
        07:05 UTC is 12:35 IST, five minutes after the 12:30 deadline, so same-day R2 is not allowed without the drive lead's exception.
        Within 3 business days (Friday, December 11 through Tuesday, December 15, 2026) the only valid R2 starts are 10:45-11:15 IST on Monday, December 14.
      must:
        - Convert the recorded time correctly (07:05 UTC = 12:35 IST) and state that it missed the 12:30 IST deadline.
        - Decline to book R2 at 2:00 p.m. today and explain that only Farzana Ali (drive lead) can approve a same-day exception.
        - Propose R2 only with a start from 10:45 to 11:15 IST on Monday, December 14, 2026, and ask whether to book it.
        - Explain that December 11 leaves only 30 minutes after Vijay's commitment and that Vijay is out of office on December 15.
      must_not:
        - Treat 07:05 as earlier than 12:30 or describe the result as on time.
        - Book or hold any R2 time today or without explicit confirmation.
        - Tell the candidate the R1 result or the reason the afternoon round is not happening.
      side_effects: {external_writes: none}
