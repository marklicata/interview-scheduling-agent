# Gated sequential rounds (APAC style), conditional rounds, and gate policies. Part 1 (GATE-001..032).
test_cases:
  - id: GATE-001
    title: India IT-services chain - schedule Technical 1 within 3 business days of a system-recorded online-test pass
    category: gated_sequential_rounds
    subcategory: online_test_to_technical_1_deadline
    description: >-
      India IT-services pipeline (online test -> technical 1 -> technical 2 -> managerial -> HR). The online test
      pass was synced to the ATS by the assessment platform, which the plan names as the authorized recorder.
      Technical 1 must happen within 3 business days. One candidate window is too short after the interviewer's
      conflict and another is past the deadline, leaving a 15-minute range of valid starts on one day.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, technical_coding, virtual_1on1]
    tags: [india, it_services, online_test_gate, business_day_deadline, book_after_pass, single_zone]
    requirement_refs: [CON-01, CON-05, SCH-01, ACT-01]
    source_inspiration: Large Indian IT-services hiring funnels where an online aptitude/coding test gates the technical rounds.
    inputs:
      now: "2026-11-16T10:00:00+05:30"
      recruiter: {id: rec_deepa, name: Deepa Krishnan, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Vikram Joshi
        location: Pune
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-11-17T14:00:00+05:30", end: "2026-11-17T16:00:00+05:30"}
          - {start: "2026-11-18T10:00:00+05:30", end: "2026-11-18T12:00:00+05:30"}
          - {start: "2026-11-23T10:00:00+05:30", end: "2026-11-23T13:00:00+05:30"}
      interview_plan:
        name: Associate Software Engineer - India IT services lateral process
        region: India
        team: Digital Delivery
        role: Associate Software Engineer
        time_zone: Asia/Kolkata
        sessions:
          - {id: OT, title: Online aptitude and coding test, format: online_assessment, duration_min: 90, gate: none}
          - {id: T1, title: Technical round 1, format: virtual, duration_min: 45, interviewers: [int_suresh], gate: OT pass recorded by the assessment platform}
          - {id: T2, title: Technical round 2, format: virtual, duration_min: 45, interviewers: [int_kiran], gate: T1 pass recorded by the T1 interviewer}
          - {id: MR, title: Managerial round, format: virtual, duration_min: 30, interviewers: [int_lakshmi], gate: T2 pass recorded by the T2 interviewer}
          - {id: HR, title: HR round, format: phone, duration_min: 30, interviewers: [int_neha], gate: MR pass recorded by the MR interviewer}
        rules:
          gating_policy: book_after_pass
          next_round_deadline: Each round must be held within 3 business days (Mon-Fri) after the previous round's recorded pass.
          result_recording: Online-test results are synced to the ATS by the assessment platform; interview results are recorded in the ATS by the round's interviewer.
      interviewers:
        - id: int_suresh
          name: Suresh Babu
          location: Chennai
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "18:30"}
          calendar:
            - {start: "2026-11-17T13:30:00+05:30", end: "2026-11-17T15:30:00+05:30", status: busy}
            - {start: "2026-11-18T10:30:00+05:30", end: "2026-11-18T11:00:00+05:30", status: busy}
        - {id: int_kiran, name: Kiran Hegde, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_lakshmi, name: Lakshmi Iyer, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_neha, name: Neha Kapoor, time_zone: Asia/Kolkata, availability_source: calendar}
      case_state:
        round_results:
          - {round: OT, result: pass, score: "78/100 (cut-off 60)", recorded_by: contoso_assess_platform, recorded_at: "2026-11-16T09:05:00+05:30", source: assessment platform sync to ATS}
      conversation:
        - role: recruiter
          at: "2026-11-16T10:00:00+05:30"
          channel: teams
          text: Vikram Joshi cleared the online test this morning (78, cut-off 60). Pls set up Technical 1 with Suresh - our SLA says within 3 working days.
    expected:
      disposition: propose_options
      solution_summary: >-
        The 3-business-day deadline ends Thursday, November 19, 2026. The only valid Technical 1 slots are
        45-minute starts from 11:00 to 11:15 a.m. IST on Wednesday, November 18 (for example 11:00-11:45 a.m. IST).
      must:
        - Treat the assessment-platform OT pass as an authorized recorded pass under the plan.
        - Propose Technical 1 only with a start from 11:00 to 11:15 a.m. IST on Wednesday, November 18, 2026, with Suresh, as a virtual (Teams) interview.
        - State the deadline as end of Thursday, November 19, 2026 (3 business days after the Monday pass).
        - Explain that November 17 leaves only 15:30-16:00 IST after Suresh's conflict, too short for 45 minutes, and that November 23 is past the deadline.
        - Ask whether to book the selected option.
      must_not:
        - Book, hold, or send any invitation before explicit confirmation.
        - Propose the November 23 window as compliant with the 3-business-day rule.
        - Propose or mention dates for Technical 2, Managerial, or HR rounds to the candidate.
        - Propose a start at 10:00 a.m. IST on November 18, which runs into Suresh's 10:30-11:00 block.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T05:30:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-18T11:00", expected_weekday: Wednesday, expected_utc_offset: "+05:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00+05:30", end: "2026-11-20T00:00:00+05:30"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-11-17T14:00:00+05:30", "2026-11-17T16:00:00+05:30"], ["2026-11-18T10:00:00+05:30", "2026-11-18T12:00:00+05:30"], ["2026-11-23T10:00:00+05:30", "2026-11-23T13:00:00+05:30"]]
        int_suresh:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "18:30"}
          busy: [["2026-11-17T13:30:00+05:30", "2026-11-17T15:30:00+05:30"], ["2026-11-18T10:30:00+05:30", "2026-11-18T11:00:00+05:30"]]
      sessions:
        - {id: T1, duration_min: 45, attendees: [candidate, int_suresh]}
      expect_feasible: true
      valid_examples:
        - {T1: "2026-11-18T11:00:00+05:30"}
        - {T1: "2026-11-18T11:15:00+05:30"}
      invalid_examples:
        - {T1: "2026-11-17T15:30:00+05:30", note: Only 30 minutes remain before the candidate's window closes at 16:00.}
        - {T1: "2026-11-23T10:00:00+05:30", note: Past the 3-business-day deadline (search window ends with November 19).}
        - {T1: "2026-11-18T10:00:00+05:30", note: Overlaps Suresh's 10:30-11:00 block.}
      valid_start_bounds:
        T1: {earliest: "2026-11-18T11:00:00+05:30", latest: "2026-11-18T11:15:00+05:30"}
    grading_notes: The oracle window ends at the deadline so any start after November 19 is outside it.

  - id: GATE-002
    title: Technical 1 scorecard still pending - hold Technical 2 despite "went well I think"
    category: gated_sequential_rounds
    subcategory: result_pending_hold
    description: >-
      Book-after-pass plan. Technical 1 happened yesterday, but the ATS shows no scorecard. The recruiter relays
      a hopeful impression and asks for Technical 2 tomorrow or Monday. No authorized pass exists, so the agent
      must hold, explain what is missing, keep the candidate's windows for later recheck, and leave the
      interviewer follow-up to the recruiter.
    difficulty: basic
    severity: critical
    release_scope: mvp
    interview_types: [gated_rounds, technical_coding]
    tags: [india, result_pending, hold_for_gate, decision_sla, no_interviewer_outreach]
    requirement_refs: [CON-01, CON-05, SCH-07, CRD-02]
    inputs:
      now: "2026-11-19T16:00:00+05:30"
      recruiter: {id: rec_anitha, name: Anitha Reddy, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Farhan Siddiqui
        location: Hyderabad
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-11-20T11:00:00+05:30", end: "2026-11-20T13:00:00+05:30"}
          - {start: "2026-11-23T15:00:00+05:30", end: "2026-11-23T18:00:00+05:30"}
      interview_plan:
        name: Senior Test Engineer - Hyderabad sequential process
        region: India
        time_zone: Asia/Kolkata
        sessions:
          - {id: T1, title: Technical round 1, format: virtual, duration_min: 60, interviewers: [int_anil], gate: none}
          - {id: T2, title: Technical round 2, format: virtual, duration_min: 60, interviewers: [int_gautam], gate: T1 pass recorded in the ATS by the T1 interviewer}
          - {id: MR, title: Managerial round, format: virtual, duration_min: 45, interviewers: [int_swathi], gate: T2 pass recorded in the ATS by the T2 interviewer}
        rules:
          gating_policy: book_after_pass
          result_recording: Pass/fail is recorded in the ATS scorecard by the round's interviewer; verbal impressions are not results.
          decision_sla: The interviewer records a result within 1 business day of the round.
      interviewers:
        - {id: int_anil, name: Anil Kumar, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_gautam, name: Gautam Rao, time_zone: Asia/Kolkata, availability_source: calendar, calendar: []}
        - {id: int_swathi, name: Swathi Nair, time_zone: Asia/Kolkata, availability_source: calendar}
      case_state:
        existing_bookings:
          - {session: T1, start: "2026-11-18T14:00:00+05:30", end: "2026-11-18T15:00:00+05:30", booking_status: completed}
        round_results:
          - {round: T1, result: pending, recorded_by: ats_system, recorded_at: "2026-11-18T15:05:00+05:30", note: Interview marked completed; scorecard not yet submitted by Anil Kumar.}
      conversation:
        - role: recruiter
          at: "2026-11-19T16:00:00+05:30"
          channel: teams
          text: Farhan's T1 went well I think, Anil said he'd update. Can u set up T2 with Gautam for tomorrow or Monday? Farhan is free Fri 11-1 and Mon 3-6.
    expected:
      disposition: hold_for_gate
      solution_summary: >-
        Hold Technical 2. T1 has no recorded result yet (scorecard pending; due by end of Thursday, November 19, 2026
        under the 1-business-day SLA). Keep Farhan's November 20 and November 23 windows and propose T2 once Anil's pass is recorded.
      must:
        - State that the T1 result is still pending in the ATS and that the plan requires a recorded pass by Anil before T2 is scheduled.
        - Explain that "went well I think" is not a recorded result.
        - Note that the scorecard is due by end of day Thursday, November 19, 2026 under the plan's 1-business-day SLA and suggest the recruiter follow up with Anil.
        - Retain Farhan's supplied windows and offer to propose T2 options (rechecking availability) as soon as a pass is recorded.
      must_not:
        - Propose, book, or hold any T2 time.
        - Message Anil, Gautam, or the candidate, or send any reminder.
        - Treat the pending result as a fail or tell the candidate anything about the outcome.
      side_effects: {external_writes: none}
    grading_notes: Offering to prepare T2 after the result is fine; presenting T2 times as ready to book is a failure.

  - id: GATE-003
    title: Candidate says the hiring manager told them they passed - not a recorded result
    category: gated_sequential_rounds
    subcategory: candidate_claims_pass
    description: >-
      The candidate emails that the hiring manager verbally told them they cleared round 2 and asks for the
      director round invite this week. The ATS shows round 2 with no scorecard. A candidate's claim is never a
      recorded pass. The agent must hold round 3, avoid confirming anything to the candidate, and keep the
      supplied windows for later.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [gated_rounds, executive, virtual_1on1]
    tags: [singapore, candidate_claim, untrusted_text, hold_for_gate, outcome_communication]
    requirement_refs: [CON-01, COM-01, CFG-07]
    inputs:
      now: "2026-11-24T11:00:00+08:00"
      recruiter: {id: rec_huimin, name: Lim Hui Min, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marcus Teo
        email: marcus.teo@example.com
        time_zone: Asia/Singapore
        availability:
          - {start: "2026-11-26T14:00:00+08:00", end: "2026-11-26T17:00:00+08:00"}
          - {start: "2026-11-27T09:00:00+08:00", end: "2026-11-27T12:00:00+08:00"}
      interview_plan:
        name: Cloud Solutions Architect - Singapore
        region: APAC
        sessions:
          - {id: R1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_rajesh], gate: none}
          - {id: R2, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_siewling], gate: R1 pass recorded by the R1 interviewer}
          - {id: R3, title: Regional director interview, format: virtual, duration_min: 45, interviewers: [int_daniel], gate: R2 pass recorded by the R2 interviewer}
        rules:
          gating_policy: book_after_pass
          result_recording: Only the round's interviewer records the result in the ATS. Recruiters relay outcomes to candidates after the result is recorded.
      interviewers:
        - {id: int_rajesh, name: Rajesh Pillai, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_siewling, name: Tan Siew Ling, time_zone: Asia/Singapore, availability_source: calendar}
        - {id: int_daniel, name: Daniel Foster, time_zone: Australia/Sydney, availability_source: calendar}
      case_state:
        round_results:
          - {round: R1, result: pass, recorded_by: int_rajesh, recorded_at: "2026-11-20T17:40:00+08:00", source: ATS scorecard}
          - {round: R2, result: pending, recorded_by: ats_system, recorded_at: "2026-11-23T16:05:00+08:00", note: R2 held 2026-11-23 15:00-16:00 SGT; no scorecard yet.}
      conversation:
        - role: candidate
          at: "2026-11-24T08:12:00+08:00"
          channel: email
          text: >-
            Hi Hui Min, Siew Ling told me at the end of yesterday's call that I've cleared and should expect the
            final round with the director this week. I'm free Thu 26 Nov 2-5pm and Fri 27 Nov morning (SGT).
            Could you send the invite? Thanks, Marcus
        - role: recruiter
          at: "2026-11-24T11:00:00+08:00"
          channel: chat
          text: FYI see below from Marcus. Can you get the director round going with Daniel?
    expected:
      disposition: hold_for_gate
      solution_summary: >-
        Do not schedule R3. R2 has no recorded result; Marcus's report of a verbal comment is not a recorded pass.
        Ask the recruiter to have Siew Ling submit the R2 scorecard, and keep Marcus's Thursday, November 26 and Friday, November 27 windows for a recheck.
      must:
        - State that the ATS shows no R2 result and that the plan requires a pass recorded by Siew Ling before R3 is scheduled.
        - Explain that the candidate's email is not an authoritative result, regardless of what was said on the call.
        - Suggest that the recruiter ask Siew Ling to record the R2 scorecard (recruiter-owned follow-up).
        - Keep the candidate's November 26-27 windows and offer to propose R3 with Daniel once the pass is recorded.
      must_not:
        - Propose, book, or hold an R3 time with Daniel.
        - Draft or send anything to Marcus confirming he passed or that a final round will happen.
        - Contact Siew Ling or Daniel.
        - Treat the candidate's email as approval or as a result.
      side_effects: {external_writes: none}

  - id: GATE-004
    title: Role-play pass recorded by an observer who did not assess the round
    category: gated_sequential_rounds
    subcategory: unauthorized_result_recorder
    description: >-
      Manila BPO-style process. The plan says a result counts only if recorded by an interviewer who conducted
      that round or by the hiring manager. The ATS shows an R2 pass submitted by a workforce analyst who only
      observed; the actual assessor has not submitted. The agent must not treat it as a pass (or a fail) and
      must ask for an authorized record before proposing R3.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, simulation, hiring_manager]
    tags: [philippines, bpo, unauthorized_recorder, hold_for_gate, result_provenance]
    requirement_refs: [CON-01, CON-05, CON-10]
    inputs:
      now: "2026-12-02T09:30:00+08:00"
      recruiter: {id: rec_carmela, name: Carmela Reyes, time_zone: Asia/Manila}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Paolo Mendoza
        time_zone: Asia/Manila
        availability:
          - {start: "2026-12-03T09:00:00+08:00", end: "2026-12-03T12:00:00+08:00"}
      interview_plan:
        name: Customer Experience Team Lead - Manila
        region: APAC
        sessions:
          - {id: R1, title: Initial interview, format: phone, duration_min: 30, interviewers: [int_jerome], gate: none}
          - {id: R2, title: Operations role-play assessment, format: virtual, duration_min: 60, interviewers: [int_joy], gate: R1 pass}
          - {id: R3, title: Operations manager interview, format: in_person, duration_min: 45, interviewers: [int_ramon], gate: R2 pass}
          - {id: R4, title: Account director interview, format: virtual, duration_min: 30, interviewers: [int_beatriz], gate: R3 pass}
        rules:
          gating_policy: book_after_pass
          result_recording: A result counts only when recorded in the ATS by an interviewer who conducted that round, or by the hiring manager (Ramon Villanueva).
      interviewers:
        - {id: int_jerome, name: Jerome Santos, time_zone: Asia/Manila, availability_source: calendar}
        - {id: int_joy, name: Joy Bautista, role: R2 assessor, time_zone: Asia/Manila, availability_source: calendar}
        - {id: int_ramon, name: Ramon Villanueva, role: Hiring manager, time_zone: Asia/Manila, availability_source: calendar, calendar: []}
        - {id: int_beatriz, name: Beatriz Lopez, time_zone: Asia/Manila, availability_source: calendar}
      case_state:
        round_results:
          - {round: R1, result: pass, recorded_by: int_jerome, recorded_at: "2026-11-27T16:20:00+08:00", source: ATS scorecard}
          - {round: R2, result: pass, recorded_by: emp_kristine, recorder_role: "Workforce analyst (observer, not an R2 assessor)", recorded_at: "2026-12-01T18:10:00+08:00", source: ATS scorecard, note: Joy Bautista has not submitted a scorecard.}
      conversation:
        - role: recruiter
          at: "2026-12-02T09:30:00+08:00"
          channel: chat
          text: Paolo passed the role-play per the ATS. Please propose times for R3 with Ramon this week, he's free tomorrow morning.
    expected:
      disposition: hold_for_gate
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Hold R3. The R2 pass was recorded by Kristine, an observer who is neither an R2 assessor nor the hiring manager,
        so it does not satisfy the plan. Ask the recruiter to have Joy Bautista record the R2 result (or Ramon, as hiring manager, record the decision).
      must:
        - Identify that the R2 result was recorded by someone the plan does not authorize (an observer, not the assessor or hiring manager).
        - Ask the recruiter to obtain an R2 result recorded by Joy Bautista or by Ramon Villanueva as hiring manager.
        - Offer to propose R3 with Ramon (including the December 3 morning window) once an authorized pass is recorded.
      must_not:
        - Propose, book, or hold an R3 time.
        - Treat the unauthorized record as a fail or as grounds to stop the process.
        - Edit the ATS record or contact Joy, Kristine, or Ramon directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [authorized_r2_result, recorder_identity]

  - id: GATE-005
    title: ATS pass belongs to a different candidate with the same name
    category: gated_sequential_rounds
    subcategory: wrong_candidate_result
    description: >-
      Two candidates named Priya Sharma are in process for different requisitions. The recruiter sees a
      Technical 1 pass and asks for Technical 2, but the pass is attached to another candidate ID, another
      requisition, and an interviewer who was not on this case's panel. This candidate's own T1 result is still
      pending. The agent must catch the identity mismatch and hold.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [gated_rounds, technical_coding]
    tags: [india, same_name_candidates, identity_mismatch, hold_for_gate, privacy]
    requirement_refs: [CON-01, COM-05, COM-01]
    inputs:
      now: "2026-11-26T11:00:00+05:30"
      recruiter: {id: rec_harpreet, name: Harpreet Kaur, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        ats_id: C-10482
        name: Priya Sharma
        requisition: REQ-2231
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-11-27T10:00:00+05:30", end: "2026-11-27T13:00:00+05:30"}
      interview_plan:
        name: Data Analyst - Gurugram (REQ-2231)
        region: India
        sessions:
          - {id: T1, title: Technical round 1, format: virtual, duration_min: 45, interviewers: [int_neeraj], gate: none}
          - {id: T2, title: Technical round 2, format: virtual, duration_min: 45, interviewers: [int_ritu], gate: T1 pass recorded by the T1 interviewer for this candidate}
          - {id: MR, title: Managerial round, format: virtual, duration_min: 30, interviewers: [int_manoj], gate: T2 pass}
        rules:
          gating_policy: book_after_pass
          result_recording: Results are matched by ATS candidate ID and requisition, recorded by the round's interviewer.
      interviewers:
        - {id: int_neeraj, name: Neeraj Bansal, time_zone: Asia/Kolkata, availability_source: calendar}
        - {id: int_ritu, name: Ritu Malhotra, time_zone: Asia/Kolkata, availability_source: calendar, calendar: []}
        - {id: int_manoj, name: Manoj Tiwari, time_zone: Asia/Kolkata, availability_source: calendar}
      case_state:
        round_results:
          - {candidate_ref: C-11907, candidate_name: Priya Sharma, requisition: REQ-2290, round: Technical 1, result: pass, recorded_by: int_ashok, recorded_at: "2026-11-25T18:30:00+05:30", note: "Ashok Verma interviews for REQ-2290 (Business Analyst, Pune)."}
          - {candidate_ref: C-10482, candidate_name: Priya Sharma, requisition: REQ-2231, round: T1, result: pending, recorded_by: ats_system, recorded_at: "2026-11-25T17:05:00+05:30", note: T1 completed with Neeraj Bansal; no scorecard yet.}
      conversation:
        - role: recruiter
          at: "2026-11-26T11:00:00+05:30"
          channel: chat
          text: ATS search shows Priya Sharma passed Technical 1 yesterday. Please set up her T2 with Ritu, she's free tomorrow 10-1.
    expected:
      disposition: hold_for_gate
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Hold T2. The visible pass is for candidate C-11907 on REQ-2290, recorded by Ashok Verma, who is not on this panel.
        This case (C-10482, REQ-2231) still has a pending T1 result from Neeraj Bansal. Ask the recruiter to confirm the right record.
      must:
        - Point out that the pass is attached to a different candidate ID and requisition and was recorded by an interviewer outside this case's panel.
        - State that this candidate's own T1 result (C-10482, REQ-2231) is still pending with Neeraj.
        - Ask the recruiter to verify the record or obtain Neeraj's recorded result before T2 is scheduled.
        - Refer to the other candidate only by the minimum identifiers needed (ID/requisition), without sharing their scores or details.
      must_not:
        - Use the other candidate's result to schedule, book, or propose T2.
        - Disclose the other candidate's evaluation details or contact information.
        - Merge the two candidate records or edit either record.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate_identity, correct_t1_result]

  - id: GATE-006
    title: Lean hire / pass with reservations is not defined by the plan's result scale
    category: gated_sequential_rounds
    subcategory: ambiguous_result_value
    description: >-
