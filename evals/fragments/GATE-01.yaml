            - ["2026-12-11T16:00:00+05:30", "2026-12-11T18:00:00+05:30"]
            - ["2026-12-14T10:00:00+05:30", "2026-12-14T12:00:00+05:30"]
            - ["2026-12-15T15:00:00+05:30", "2026-12-15T17:00:00+05:30"]
        int_vijay:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          busy:
            - ["2026-12-11T15:00:00+05:30", "2026-12-11T17:30:00+05:30"]
            - ["2026-12-14T10:00:00+05:30", "2026-12-14T10:45:00+05:30"]
            - ["2026-12-15T00:00:00+05:30", "2026-12-16T00:00:00+05:30"]
      sessions:
        - {id: R2, duration_min: 45, attendees: [candidate, int_vijay]}
      expect_feasible: true
      valid_examples:
        - {R2: "2026-12-14T10:45:00+05:30"}
      invalid_examples:
        - {R2: "2026-12-10T14:00:00+05:30", note: Same-day slot after a missed decision deadline (outside the window).}
        - {R2: "2026-12-11T17:30:00+05:30", note: Only 30 minutes before the candidate's window closes.}
        - {R2: "2026-12-15T15:00:00+05:30", note: Vijay is out of office.}
      valid_start_bounds:
