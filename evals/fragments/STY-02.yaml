        January 7 is before the hiring plan's January 11, 9:00 a.m. ET start. Earliest compliant option: Monday, January
        11, 2027, 1:00-1:30 p.m. EST (12:00-12:30 p.m. CST); valid starts that day run 1:00-3:30 p.m. EST, and Tuesday,
        January 12, 9:00-9:30 a.m. EST starts also work.
      must:
        - Decline Thursday, January 7, citing the hiring plan's interview start date.
        - Propose the earliest compliant start, Monday, January 11 at 1:00 p.m. EST (12:00 p.m. CST), with other valid starts as alternatives.
        - Show Eastern and Central times.
        - Ask whether to book.
      must_not:
