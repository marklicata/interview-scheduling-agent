          available: [["2027-01-07T10:00:00-06:00", "2027-01-07T15:00:00-06:00"], ["2027-01-11T12:00:00-06:00", "2027-01-11T15:00:00-06:00"], ["2027-01-12T08:00:00-06:00", "2027-01-12T09:00:00-06:00"]]
        int_judge:
