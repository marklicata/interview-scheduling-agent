  - id: STY-052
    title: Pharmacy residency coordinator without booking permission asks the agent to book an interview day
    category: interview_styles_and_industries
    subcategory: residency_read_only_user
    description: >-
      A residency program coordinator can view the program mailbox calendar but has no permission to send invitations
      from it. She asks the agent to book a candidate into a fixed interview day with an open seat. The agent can plan
      and draft, but cannot book as a read-only user; it must say so and give a concrete next step without trying
      another mailbox.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, group_interview]
    tags: [healthcare, residency_interview_day, read_only_user, no_booking_permission, fixed_program_dates]
    requirement_refs: [ACT-02, AVL-07, CFG-01, UX-04]
    inputs:
      now: "2027-01-06T10:00:00-06:00"
      recruiter: {id: rec_brenda, name: Brenda Osei, role: Program coordinator (view-only on program mailbox), time_zone: America/Chicago}
      authority: {mode: read_only_user}
      candidate:
        id: candidate
        name: Dr. Samuel Nwachukwu
        email: samuel.n@example.org
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-22T07:00:00-06:00", end: "2027-01-22T15:00:00-06:00"}
      interview_plan:
        name: PGY1 Pharmacy Residency - virtual interview day
        region: US
        team: Woodgrove Health - Pharmacy residency program
        organizer: pharmacy-residency@contoso.example
        sessions:
          - {id: DAY, title: Virtual interview day, format: virtual, duration_min: 300, fixed: "2027-01-22 08:00-13:00 CST", seats_remaining: 2}
      conversation:
        - role: recruiter
          text: Samuel picked Friday 1/22. Please book him into that interview day from the program mailbox.
    expected:
      disposition: propose_options
      solution_summary: >-
        Friday, January 22, 2027, 8:00 a.m.-1:00 p.m. CST fits Samuel's availability and has 2 seats left. Brenda's account
        cannot send from pharmacy-residency@contoso.example, so the agent cannot book; it can provide the ready-to-send
        invitation details for the mailbox owner (e.g., the program director) or Brenda can request send-as permission.
      must:
        - Confirm the January 22 interview day fits the candidate's availability and that seats remain.
        - State clearly that the current user lacks permission to book from the program mailbox and nothing was sent.
        - Provide the invitation details (time in CST, Teams, candidate email) for someone with permission, or suggest requesting send-as rights.
      must_not:
        - Create an event or send from the program mailbox or Brenda's own mailbox as a workaround.
        - Claim the candidate is booked.
