  - id: STY-045
    title: Riyadh partner works Sunday-Thursday; London candidate's offered Sunday morning is the only fit
    category: interview_styles_and_industries
    subcategory: consulting_different_workweeks
    description: >-
      Strategy-consulting case interview between a partner in Riyadh (workweek Sunday-Thursday, 08:00-17:00 AST) and a
      candidate in London who offered Friday morning, Monday evening, Thursday early morning, and also Sunday morning.
      Friday is the Saudi weekend, Monday evening London is after hours in Riyadh, and Thursday's hour clashes with the
      partner's meeting. Sunday works for both because it is a Riyadh workday and the candidate volunteered it.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [case_interview, virtual_1on1]
    tags: [consulting, different_workweeks, saudi_arabia, london, weekend_mismatch, candidate_offered_weekend]
    requirement_refs: [AVL-03, AVL-10, SCH-01, SCH-08]
    inputs:
      now: "2027-01-12T10:00:00+00:00"
      recruiter: {id: rec_oskar, name: Oskar Lindahl, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hamza Qureshi
        time_zone: Europe/London
        availability:
          - {start: "2027-01-17T10:00:00+00:00", end: "2027-01-17T12:00:00+00:00"}
          - {start: "2027-01-18T17:00:00+00:00", end: "2027-01-18T19:00:00+00:00"}
          - {start: "2027-01-21T08:00:00+00:00", end: "2027-01-21T09:00:00+00:00"}
          - {start: "2027-01-22T09:00:00+00:00", end: "2027-01-22T11:00:00+00:00"}
      interview_plan:
        name: Consultant - Middle East practice - case interview
        region: EMEA
        team: Adatum Strategy Partners - Riyadh
        sessions:
          - {id: CASE, title: Case interview with partner, format: virtual, duration_min: 60, interviewers: [int_faisal]}
      interviewers:
        - {id: int_faisal, name: Faisal Al-Otaibi, role: Partner, time_zone: Asia/Riyadh, availability_source: calendar,
           working_hours: {days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "17:00"},
           calendar: [{start: "2027-01-21T11:00:00+03:00", end: "2027-01-21T11:30:00+03:00", status: busy}]}
      conversation:
        - role: candidate
          channel: email
          text: >-
            I can do Fri 22 Jan 9-11am, Mon 18 Jan 5-7pm, Thu 21 Jan 8-9am (all UK time), and honestly Sunday 17 Jan
            10am-noon is fine too if that helps with Riyadh.
        - role: recruiter
          text: Friday morning is easiest for us here - can you set Hamza up with Faisal then?
    expected:
      disposition: propose_options
      solution_summary: >-
        Friday does not work (Saudi weekend). The only fit is Sunday, January 17, 2027, starting 10:00-11:00 a.m. GMT
        (1:00-2:00 p.m. AST), which the candidate explicitly offered. Monday 5-7 p.m. GMT is 8-10 p.m. in Riyadh, and
        Thursday 8-9 a.m. GMT collides with Faisal's 11:00-11:30 AST meeting.
      must:
        - Explain that Friday is outside Faisal's Sunday-Thursday workweek.
        - Propose Sunday, January 17 starts between 10:00 and 11:00 a.m. GMT (1:00-2:00 p.m. AST), noting the candidate volunteered Sunday.
        - Show London and Riyadh times (three hours apart).
        - Ask whether to book.
      must_not:
        - Propose Friday, January 22 or Monday evening.
        - Assume a Monday-Friday workweek for the Riyadh partner.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
