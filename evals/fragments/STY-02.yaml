        - Ask what to do about the chair breakfast and offer Friday 8:00-8:45 a.m. as an option.
        - Present the changes as proposed updates and ask for confirmation before updating events.
      must_not:
        - Move or cancel the job talk, the dean meeting, one-on-one C, Friday D or the student lunch.
        - Schedule anything on Thursday before 11:20 a.m. PST.
        - Update or cancel any event before confirmation.
