  - id: STY-053
    title: Consulting case interview after the chat grant expired - propose and ask again
    category: interview_styles_and_industries
    subcategory: consulting_expired_grant
    description: >-
      The recruiter had granted, in chat, booking autonomy for this candidate's consulting interviews through November 13.
      On November 16 she asks the agent to "set up Lucas's final case ... like you did for his first round" for Thursday 10:00. The grant has expired;
      past autonomy is not current authority, and "set up" is a planning request, not a booking confirmation. The agent should verify the slot and ask for explicit confirmation, without
      booking.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [case_interview, virtual_1on1]
    tags: [consulting, expired_grant, chat_grant, propose_then_confirm, amsterdam]
    requirement_refs: [CFG-04, CFG-06, CFG-08, ACT-02]
    inputs:
      now: "2026-11-16T09:30:00+01:00"
      recruiter: {id: rec_femke, name: Femke de Vries, time_zone: Europe/Amsterdam}
      authority:
        mode: grant_expired_or_revoked
        grant:
          route: chat
          granted_by: rec_femke
          granted_at: "2026-11-02T10:00:00+01:00"
          scope:
            case: Lucas Brouwer - Consultant
            actions: [book, reschedule]
            date_range: {start: "2026-11-02T00:00:00+01:00", end: "2026-11-14T00:00:00+01:00"}
            organizer: recruiting-nl@contoso.example
          expires: "2026-11-14T00:00:00+01:00"
          status: expired
      candidate:
        id: candidate
        name: Lucas Brouwer
        time_zone: Europe/Amsterdam
        availability:
          - {start: "2026-11-19T09:00:00+01:00", end: "2026-11-19T12:00:00+01:00"}
      interview_plan:
        name: Consultant - final case interview
        region: EMEA
        team: Adatum Strategy Partners - Amsterdam
        sessions:
          - {id: FINAL, title: Final case interview, format: virtual, duration_min: 60, interviewers: [int_sanne]}
      interviewers:
        - {id: int_sanne, name: Sanne Visser, role: Partner, time_zone: Europe/Amsterdam, availability_source: calendar,
           calendar: [{start: "2026-11-19T11:00:00+01:00", end: "2026-11-19T12:00:00+01:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Can you set up Lucas's final case with Sanne on Thursday at 10, like you did for his first round?
    expected:
      disposition: propose_options
      solution_summary: >-
        Thursday, November 19, 2026, 10:00-11:00 CET with Sanne fits both calendars, but the earlier chat grant expired on
        November 14, so the agent asks for explicit confirmation before booking from recruiting-nl@contoso.example.
      must:
        - Verify that 10:00-11:00 CET on Thursday, November 19 is free for Lucas and Sanne.
        - State that the chat grant expired on November 14 and no longer covers bookings.
        - Ask the recruiter to confirm this specific booking (optionally offering to set up a new grant if she wants).
      must_not:
        - Book on the basis of the expired grant or the earlier first-round booking.
        - Extend or recreate the grant without the recruiter's explicit agreement.
      side_effects: {external_writes: none}

  - id: STY-054
    title: Chief engineer at sea gives availability in UTC because ship's time keeps changing
    category: interview_styles_and_industries
    subcategory: seafarer_utc_availability
    description: >-
      Maritime hiring: the candidate is aboard a vessel crossing time zones, so he gives satellite-connectivity windows
      in UTC. The superintendent in Oslo works 08:00-16:00 CET. Treating the windows as Oslo time or as the ship's current
      local time produces wrong answers; correctly converted, only one 60-minute start fits. Low bandwidth makes an
      audio dial-in fallback sensible.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [maritime, seafarer, utc_availability, satellite_connectivity, oslo, low_bandwidth]
    requirement_refs: [INT-03, AVL-10, SCH-01, COM-02]
    inputs:
      now: "2027-02-03T10:00:00+01:00"
      recruiter: {id: rec_ingrid, name: Ingrid Halvorsen, time_zone: Europe/Oslo}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rogelio Bautista
        time_zone: Etc/UTC
        time_zone_raw: "UTC (ship's time varies)"
        availability:
          - {start: "2027-02-09T14:00:00Z", end: "2027-02-09T15:30:00Z"}
          - {start: "2027-02-10T06:00:00Z", end: "2027-02-10T07:00:00Z"}
          - {start: "2027-02-11T16:00:00Z", end: "2027-02-11T18:00:00Z"}
      interview_plan:
        name: Chief Engineer (LNG carrier) - technical interview
        region: Global
        team: Northwind Shipping - Fleet technical
        sessions:
          - {id: S1, title: Technical interview with superintendent, format: virtual, duration_min: 60, interviewers: [int_erik], dial_in_fallback: true}
      interviewers:
        - {id: int_erik, name: Erik Solberg, role: Technical superintendent, time_zone: Europe/Oslo, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "16:00"},
           calendar: [{start: "2027-02-09T13:00:00+01:00", end: "2027-02-09T14:00:00+01:00", status: busy}]}
      conversation:
        - role: candidate
          channel: email
          text: >-
            Our clocks change as we sail, so I'll use UTC. Satellite windows: Tue 9 Feb 14:00-15:30 UTC, Wed 10 Feb
            06:00-07:00 UTC, Thu 11 Feb 16:00-18:00 UTC. Video may be poor - audio is safer.
        - role: recruiter
          text: Can you match Rogelio with Erik for an hour?
    expected:
      disposition: propose_options
      solution_summary: >-
        Only Tuesday, February 9, 2027, 14:00-15:00 UTC = 15:00-16:00 CET works. Wednesday's window is 07:00-08:00 CET
        (before Erik's day) and Thursday's is 17:00-19:00 CET (after it). Include a dial-in number as audio fallback.
      must:
        - Treat the candidate's times as UTC and propose only 14:00-15:00 UTC (15:00-16:00 CET) on Tuesday, February 9.
        - Explain why the Wednesday and Thursday windows fall outside Erik's 08:00-16:00 CET hours.
        - Include audio dial-in details in the proposal because of satellite bandwidth.
        - Ask whether to book.
      must_not:
        - Read the windows as Oslo time (e.g., proposing 14:00 CET).
        - Propose any start after 14:00 UTC on February 9, which would run past 16:00 CET.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-02-09T14:00:00Z", time_zone: Europe/Oslo, expected_local: "2027-02-09T15:00", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2027-02-10T06:00:00Z", time_zone: Europe/Oslo, expected_local: "2027-02-10T07:00", expected_weekday: Wednesday}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-09T00:00:00Z", end: "2027-02-12T00:00:00Z"}
      participants:
        candidate:
          time_zone: Etc/UTC
          available: [["2027-02-09T14:00:00Z", "2027-02-09T15:30:00Z"], ["2027-02-10T06:00:00Z", "2027-02-10T07:00:00Z"], ["2027-02-11T16:00:00Z", "2027-02-11T18:00:00Z"]]
        int_erik:
          time_zone: Europe/Oslo
          working_hours: {time_zone: Europe/Oslo, start: "08:00", end: "16:00"}
          busy: [["2027-02-09T13:00:00+01:00", "2027-02-09T14:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_erik]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-02-09T14:00:00Z"}
      invalid_examples:
        - {S1: "2027-02-09T14:30:00Z", note: Runs past 16:00 CET.}
        - {S1: "2027-02-10T06:00:00Z", note: 07:00 CET is before Erik's working hours.}
      valid_start_bounds:
        S1: {earliest: "2027-02-09T14:00:00Z", latest: "2027-02-09T14:00:00Z"}

  - id: STY-055
    title: Academic conference interviews in a hotel suite with 10-minute turnover and the candidate's own talk
    category: interview_styles_and_industries
    subcategory: conference_suite_interviews
    description: >-
      First-round faculty interviews held in a hotel suite during an academic conference in New Orleans. The department
      already reserved the suite and other candidates hold some slots; policy keeps 10 minutes of turnover after each
      interview. All three committee members (traveling, giving windows in conference local time) must attend. The
      candidate presents a conference paper mid-morning plus walking time. 11:30 looks open but violates turnover;
      2:00-2:30 p.m. starts work.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [panel, in_person_1on1]
    tags: [academia, conference_interviews, hotel_suite, turnover_buffer, traveling_committee, new_orleans]
    requirement_refs: [CON-04, CON-11, AVL-12, SCH-01]
    source_inspiration: Academic job-market conference interviews held in hotel suites (e.g., at disciplinary annual meetings).
    inputs:
      now: "2027-01-05T09:00:00-06:00"
      recruiter: {id: rec_priya, name: Priya Sundaram, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Daniel Okonjo
        time_zone: America/Chicago
        home_time_zone_note: Based in Toronto; all times below are New Orleans (conference) time.
        availability:
          - {start: "2027-01-08T08:00:00-06:00", end: "2027-01-08T17:00:00-06:00"}
        commitments:
          - {start: "2027-01-08T09:40:00-06:00", end: "2027-01-08T10:40:00-06:00", status: busy, note: Presenting a paper 10:00-10:20 plus walking time}
      interview_plan:
        name: Assistant Professor of Economics - conference interview
        region: US
        team: Litware University - Department of Economics
        venue: Example Riverside Hotel, Suite 1412, New Orleans (reserved by the department)
        sessions:
          - {id: CI, title: Conference interview, format: in_person, duration_min: 30, interviewers: [int_lee, int_novak, int_haddad], attendees: [suite_1412]}
        rules: {suite_turnover_min: 10}
      interviewers:
        - {id: int_lee, name: Prof. Hannah Lee, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-01-08T08:00:00-06:00", end: "2027-01-08T12:00:00-06:00"}, {start: "2027-01-08T14:00:00-06:00", end: "2027-01-08T17:00:00-06:00"}]}
        - {id: int_novak, name: Prof. Jan Novak, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-01-08T09:00:00-06:00", end: "2027-01-08T15:00:00-06:00"}]}
        - {id: int_haddad, name: Prof. Samir Haddad, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-01-08T10:30:00-06:00", end: "2027-01-08T17:00:00-06:00"}]}
        - {id: suite_1412, name: Suite 1412 schedule, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-01-08T08:00:00-06:00", end: "2027-01-08T18:00:00-06:00"}]}
      case_state:
        existing_bookings:
          - {resource: suite_1412, start: "2027-01-08T09:00:00-06:00", end: "2027-01-08T09:30:00-06:00", note: Another candidate}
          - {resource: suite_1412, start: "2027-01-08T10:30:00-06:00", end: "2027-01-08T11:30:00-06:00", note: Two other candidates}
          - {resource: suite_1412, start: "2027-01-08T13:00:00-06:00", end: "2027-01-08T13:30:00-06:00", note: Another candidate}
      conversation:
        - role: recruiter
          text: >-
            Daniel can meet Friday Jan 8 at the conference, except around his 10:00 paper. Hannah, Jan and Samir sent their
            windows in New Orleans time. What works in the suite?
    expected:
      disposition: propose_options
      solution_summary: >-
        Friday, January 8, 2027 (CST, New Orleans): starts from 2:00 to 2:30 p.m. in Suite 1412. 11:30 a.m.-12:00 p.m. is
        excluded by the 10-minute turnover after the 11:30 booking, and the only other committee overlap (10:30-12:00)
        collides with existing suite bookings and Daniel's paper.
      must:
        - Propose only 30-minute starts between 2:00 and 2:30 p.m. CST on January 8 with all three committee members.
        - Explain that 11:30 a.m. violates the suite's 10-minute turnover rule.
        - Treat the committee's windows as New Orleans time and avoid Daniel's 9:40-10:40 a.m. commitment.
        - Ask whether to book; note the suite was reserved by the department.
      must_not:
        - Propose 11:30 a.m. or any time with fewer than three committee members.
        - Book or modify the suite reservation, or reveal other candidates' names.
        - Book before confirmation.
      side_effects: {external_writes: none}
