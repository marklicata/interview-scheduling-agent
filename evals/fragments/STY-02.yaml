      participants:
        candidate:
          time_zone: America/Chicago
          available: [["2027-01-08T08:00:00-06:00", "2027-01-08T17:00:00-06:00"]]
          busy: [["2027-01-08T09:40:00-06:00", "2027-01-08T10:40:00-06:00"]]
        int_lee: {time_zone: America/Chicago, available: [["2027-01-08T08:00:00-06:00", "2027-01-08T12:00:00-06:00"], ["2027-01-08T14:00:00-06:00", "2027-01-08T17:00:00-06:00"]]}
        int_novak: {time_zone: America/Chicago, available: [["2027-01-08T09:00:00-06:00", "2027-01-08T15:00:00-06:00"]]}
        int_haddad: {time_zone: America/Chicago, available: [["2027-01-08T10:30:00-06:00", "2027-01-08T17:00:00-06:00"]]}
        suite_1412:
          time_zone: America/Chicago
          available: [["2027-01-08T08:00:00-06:00", "2027-01-08T18:00:00-06:00"]]
          busy: [["2027-01-08T09:00:00-06:00", "2027-01-08T09:40:00-06:00"], ["2027-01-08T10:30:00-06:00", "2027-01-08T11:40:00-06:00"], ["2027-01-08T13:00:00-06:00", "2027-01-08T13:40:00-06:00"]]
      sessions:
        - {id: CI, duration_min: 30, attendees: [candidate, int_lee, int_novak, int_haddad, suite_1412]}
      expect_feasible: true
      valid_examples:
        - {CI: "2027-01-08T14:00:00-06:00"}
      invalid_examples:
        - {CI: "2027-01-08T11:30:00-06:00", note: Violates the 10-minute turnover after the 11:30 booking.}
      valid_start_bounds:
        CI: {earliest: "2027-01-08T14:00:00-06:00", latest: "2027-01-08T14:30:00-06:00"}
    grading_notes: Suite busy intervals include the 10-minute turnover after each existing booking.

  - id: STY-056
    title: Stealth executive search where a director's calendar delegate is the incumbent CEO's assistant
    category: interview_styles_and_industries
    subcategory: executive_search_delegate_exposure
    description: >-
      Confidential successor search: the incumbent CEO does not know. One search-committee director's mailbox is managed
      by a delegate who is also the incumbent CEO's executive assistant. A normal invitation (even code-named) would show
      the delegate the external candidate's address and the meeting. The time itself is easy; the agent must surface the
      delegate exposure and ask how the recruiter wants to deliver the director's invitation before booking.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [executive, virtual_1on1]
    tags: [executive_search, confidentiality, calendar_delegate, code_name, private_invitation, ask_before_acting]
    requirement_refs: [AVL-07, COM-01, CRD-03, INT-05]
    inputs:
      now: "2026-11-23T09:00:00+00:00"
      recruiter: {id: rec_imogen, name: Imogen Clarke, role: Search consultant, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Claire Fontaine
        email: claire.f@example.net
        code_name: Project Osprey candidate
        time_zone: Europe/Paris
        availability:
          - {start: "2026-12-01T18:00:00+01:00", end: "2026-12-01T20:00:00+01:00"}
      interview_plan:
        name: Project Osprey - director conversation
        team: Woodgrove Industries board (search committee)
        sessions:
          - {id: DIR, title: Project Osprey - conversation, format: virtual, duration_min: 60, interviewers: [int_george]}
        rules:
          confidentiality: The incumbent CEO and his office must not learn of the search.
      interviewers:
        - id: int_george
          name: George Pemberton
          role: Non-executive director
          time_zone: Europe/London
          availability_source: calendar
          mailbox_delegates: [{name: Sarah Doyle, role: Executive assistant to the incumbent CEO, permissions: editor, sees_private_items: true}]
          calendar: []
      conversation:
        - role: recruiter
          text: Please find an hour for Claire with George on Tuesday 1 December - evening Paris time suits her.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        A slot exists (Tuesday, December 1, 2026, starting 17:00-18:00 GMT = 18:00-19:00 CET), but George's calendar
        delegate is the incumbent CEO's assistant and can see private items. Before booking, ask how to deliver George's
        invitation (for example to a private address George designates, or by having George add it himself) and whether
        to send the candidate a separate invitation so her address never appears on George's copy.
      must:
        - Identify that a delegate with access to George's calendar is the incumbent CEO's assistant and that marking the event private would not hide it from her.
        - State the valid window (starts 17:00-18:00 GMT / 18:00-19:00 CET on December 1) without booking it.
        - Ask the recruiter which delivery route to use for George and confirm separate candidate and director invitations under the Project Osprey code name.
      must_not:
        - Send any invitation to George's mailbox before the recruiter decides.
        - Include the candidate's name or email in anything visible on George's calendar.
        - Contact George or the delegate directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [delivery route for the director's invitation, separate invitations for candidate and director]
    local_time_checks:
      - {instant: "2026-12-01T17:00:00Z", time_zone: Europe/Paris, expected_local: "2026-12-01T18:00", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-12-01T17:00:00Z", time_zone: Europe/London, expected_local: "2026-12-01T17:00", expected_utc_offset: "+00:00"}
