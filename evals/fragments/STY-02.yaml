    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-04T00:00:00-08:00", end: "2027-03-06T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Vancouver
          available: [["2027-03-04T11:20:00-08:00", "2027-03-04T20:00:00-08:00"], ["2027-03-05T08:00:00-08:00", "2027-03-05T14:00:00-08:00"]]
          busy: [["2027-03-04T12:30:00-08:00", "2027-03-04T13:30:00-08:00"], ["2027-03-04T14:00:00-08:00", "2027-03-04T14:30:00-08:00"], ["2027-03-04T15:00:00-08:00", "2027-03-04T15:30:00-08:00"], ["2027-03-05T09:00:00-08:00", "2027-03-05T09:30:00-08:00"], ["2027-03-05T12:00:00-08:00", "2027-03-05T13:00:00-08:00"]]
        int_amelie: {time_zone: America/Vancouver, available: [["2027-03-04T15:30:00-08:00", "2027-03-04T17:00:00-08:00"], ["2027-03-05T10:00:00-08:00", "2027-03-05T11:00:00-08:00"]]}
        int_bjorn: {time_zone: America/Vancouver, available: [["2027-03-05T09:30:00-08:00", "2027-03-05T10:30:00-08:00"]]}
        int_carmen: {time_zone: America/Vancouver, available: [["2027-03-04T16:00:00-08:00", "2027-03-04T17:00:00-08:00"], ["2027-03-05T10:30:00-08:00", "2027-03-05T12:00:00-08:00"]]}
      sessions:
        - {id: A, duration_min: 30, attendees: [candidate, int_amelie]}
        - {id: B, duration_min: 30, attendees: [candidate, int_bjorn]}
        - {id: LAB, duration_min: 60, attendees: [candidate, int_carmen]}
      expect_feasible: true
      valid_examples:
        - {A: "2027-03-04T15:30:00-08:00", LAB: "2027-03-04T16:00:00-08:00", B: "2027-03-05T09:30:00-08:00"}
        - {B: "2027-03-05T09:30:00-08:00", A: "2027-03-05T10:00:00-08:00", LAB: "2027-03-05T10:30:00-08:00"}
      invalid_examples:
        - {A: "2027-03-04T09:30:00-08:00", LAB: "2027-03-04T16:00:00-08:00", B: "2027-03-05T09:30:00-08:00", note: Original time; candidate has not landed.}
        - {A: "2027-03-04T15:30:00-08:00", LAB: "2027-03-05T11:30:00-08:00", B: "2027-03-05T09:30:00-08:00", note: Lab tour overlaps the student lunch.}

  - id: STY-041
    title: Nonprofit executive-director search with volunteer board members' emailed windows the week Sydney leaves daylight time
    category: interview_styles_and_industries
    subcategory: nonprofit_board_volunteers
    description: >-
      A nonprofit's volunteer search committee has no shared calendars; each member emailed one bounded window. The
      chair is in Los Angeles (PDT), the treasurer in London (BST since March 28), a member in Sydney (back on
      standard time, UTC+10, since April 4), and the candidate in Denver (MDT). Correct offsets yield exactly one
      60-minute start; using Sydney's old daylight offset or Pacific standard time makes it look impossible.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [executive, panel, virtual_loop]
    tags: [nonprofit, volunteer_board, supplied_availability, dst_transition_week, sydney, london, los_angeles, denver]
    requirement_refs: [AVL-12, AVL-13, AVL-10, CON-11, SCH-01]
    inputs:
      now: "2027-03-30T10:00:00-05:00"
      recruiter: {id: rec_marcus, name: Marcus Bell, role: Search consultant, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rosa Delacroix
        time_zone: America/Denver
        availability:
          - {start: "2027-04-05T12:00:00-06:00", end: "2027-04-05T17:00:00-06:00"}
      interview_plan:
        name: Executive Director - search committee interview
        region: Global
        team: Litware Literacy Foundation (nonprofit) board search committee
        sessions:
          - {id: SC, title: Search committee interview, format: virtual, duration_min: 60, interviewers: [int_teresa, int_graham, int_anika], all_required: true}
      interviewers:
        - {id: int_teresa, name: Teresa Whitman, role: Board chair (volunteer), time_zone: America/Los_Angeles, availability_source: supplied,
           supplied_availability: [{start: "2027-04-05T13:00:00-07:00", end: "2027-04-05T15:00:00-07:00"}]}
        - {id: int_graham, name: Graham Pierce, role: Treasurer (volunteer), time_zone: Europe/London, availability_source: supplied,
           supplied_availability: [{start: "2027-04-05T20:00:00+01:00", end: "2027-04-05T23:00:00+01:00"}]}
        - {id: int_anika, name: Anika Sharma, role: Board member (volunteer), time_zone: Australia/Sydney, availability_source: supplied,
           supplied_availability: [{start: "2027-04-06T06:30:00+10:00", end: "2027-04-06T07:30:00+10:00"}]}
      conversation:
        - role: recruiter
          text: >-
            Committee replies: Teresa "Mon Apr 5, 1-3pm Pacific"; Graham "Monday 5 April, 8-11pm UK time"; Anika
            "Tuesday 6 April, 6:30-7:30am Sydney - we'll have just come off daylight saving". Rosa is free Monday Apr 5,
            noon-5 Mountain. Is there an hour that works for everyone?
    expected:
      disposition: propose_options
      solution_summary: >-
        Exactly one hour works: Monday, April 5, 2027, 20:30-21:30 UTC = 1:30-2:30 p.m. PDT (Teresa), 9:30-10:30 p.m.
        BST (Graham), 6:30-7:30 a.m. AEST on Tuesday, April 6 (Anika), and 2:30-3:30 p.m. MDT (Rosa).
      must:
        - Propose only 1:30-2:30 p.m. PDT on April 5 and show it in all four local times, including Tuesday's date in Sydney.
        - Use UTC+10 for Sydney (standard time after April 4), UTC+1 for London and UTC-7 for Los Angeles.
        - Treat each volunteer's emailed window as bounded supplied availability without asking for calendars.
        - Ask whether to send the invitation.
      must_not:
        - Report no overlap because of Sydney's daylight offset (UTC+11) or Pacific standard time.
        - Propose any start other than 20:30 UTC.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-04-05T20:30:00Z", time_zone: America/Los_Angeles, expected_local: "2027-04-05T13:30", expected_weekday: Monday, expected_utc_offset: "-07:00"}
      - {instant: "2027-04-05T20:30:00Z", time_zone: Europe/London, expected_local: "2027-04-05T21:30", expected_utc_offset: "+01:00"}
      - {instant: "2027-04-05T20:30:00Z", time_zone: Australia/Sydney, expected_local: "2027-04-06T06:30", expected_weekday: Tuesday, expected_utc_offset: "+10:00"}
      - {instant: "2027-04-05T20:30:00Z", time_zone: America/Denver, expected_local: "2027-04-05T14:30", expected_utc_offset: "-06:00"}
      - {local: "2027-04-04T02:30", time_zone: Australia/Sydney, expect: ambiguous}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-04-05T12:00:00Z", end: "2027-04-06T06:00:00Z"}
      participants:
        candidate: {time_zone: America/Denver, available: [["2027-04-05T12:00:00-06:00", "2027-04-05T17:00:00-06:00"]]}
        int_teresa: {time_zone: America/Los_Angeles, available: [["2027-04-05T13:00:00-07:00", "2027-04-05T15:00:00-07:00"]]}
        int_graham: {time_zone: Europe/London, available: [["2027-04-05T20:00:00+01:00", "2027-04-05T23:00:00+01:00"]]}
        int_anika: {time_zone: Australia/Sydney, available: [["2027-04-06T06:30:00+10:00", "2027-04-06T07:30:00+10:00"]]}
      sessions:
        - {id: SC, duration_min: 60, attendees: [candidate, int_teresa, int_graham, int_anika]}
      expect_feasible: true
      valid_examples:
        - {SC: "2027-04-05T13:30:00-07:00"}
      invalid_examples:
        - {SC: "2027-04-05T13:00:00-07:00", note: Starts before Anika's window opens at 06:30 AEST (20:30 UTC).}
      valid_start_bounds:
        SC: {earliest: "2027-04-05T13:30:00-07:00", latest: "2027-04-05T13:30:00-07:00"}

  - id: STY-042
    title: District-manager candidate visits two stores outside the lunch rush with drive time between stops
    category: interview_styles_and_industries
    subcategory: retail_store_visits_with_travel
    description: >-
      Retail district-manager final in Dallas: a 45-minute interview with the regional VP at the regional office,
      then two 60-minute store walks with the regional director and each store manager, in that order. Policy bans
      store walks during the 11:30-1:30 lunch rush and requires 40-60 minutes of drive time between stops. The
      recruiter wants the stores in the morning, but Store 147's delivery window makes that impossible; the
      feasible plan runs the VP interview late morning and both stores in the afternoon.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [site_tour, in_person_loop, executive]
    tags: [retail, store_visit, travel_time, peak_hours_blackout, ordered_sessions, dallas, preference_unmet]
    requirement_refs: [CON-03, CON-04, SCH-01, SCH-03]
    inputs:
      now: "2027-01-12T09:00:00-06:00"
      recruiter: {id: rec_latoya, name: LaToya Simmons, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Victor Nakamura
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-20T08:00:00-06:00", end: "2027-01-20T17:00:00-06:00"}
      interview_plan:
        name: District Manager (North Texas) - final
        region: US
        team: Tailspin Outfitters - South Central region
        sessions:
          - {id: VP, title: Interview with Regional VP, format: in_person, duration_min: 45, interviewers: [int_vp], venue: Regional office, 10 Example Parkway, Dallas, order: 1}
          - {id: STORE1, title: Store walk - Store 112, format: in_person, duration_min: 60, interviewers: [int_rd, int_sm_a], venue: Store 112, order: 2}
          - {id: STORE2, title: Store walk - Store 147, format: in_person, duration_min: 60, interviewers: [int_rd, int_sm_b], venue: Store 147, order: 3}
        rules:
          store_walks: not during 11:30-13:30 lunch rush
          drive_time_between_stops_min: 40
          max_gap_min: 60
      interviewers:
        - {id: int_vp, name: Simone Achebe, role: Regional VP, time_zone: America/Chicago, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"},
           calendar: [{start: "2027-01-20T13:00:00-06:00", end: "2027-01-20T15:00:00-06:00", status: busy}]}
        - {id: int_rd, name: Marcus Okoro, role: Regional Director, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2027-01-20T08:00:00-06:00", end: "2027-01-20T09:00:00-06:00", status: busy}]}
        - {id: int_sm_a, name: Paige Sullivan, role: Store 112 manager, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-01-20T08:00:00-06:00", end: "2027-01-20T11:30:00-06:00"}, {start: "2027-01-20T13:30:00-06:00", end: "2027-01-20T17:00:00-06:00"}]}
        - {id: int_sm_b, name: Hector Ruiz, role: Store 147 manager, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-01-20T08:00:00-06:00", end: "2027-01-20T09:00:00-06:00"}, {start: "2027-01-20T11:00:00-06:00", end: "2027-01-20T11:30:00-06:00"}, {start: "2027-01-20T13:30:00-06:00", end: "2027-01-20T17:00:00-06:00"}]}
      conversation:
        - role: recruiter
          text: >-
            Victor's final is Wed 1/20: Simone first at the regional office, then Store 112 and Store 147 with Marcus.
            Can we do the stores in the morning before the lunch rush?
    expected:
      disposition: propose_options
      solution_summary: >-
        Morning store walks do not fit (Store 147 is only open to visits 8:00-9:00 and 11:00-11:30 in the morning
        because of its delivery). Example for Wednesday, January 20, 2027 (CST): Simone 11:45 a.m.-12:30 p.m., Store
        112 1:30-2:30 p.m., Store 147 3:10-4:10 p.m. Store 112 can start between 1:30 and 2:00 p.m.
      must:
        - Explain why morning store walks are impossible (Store 147's availability and the 40-minute drive buffer).
