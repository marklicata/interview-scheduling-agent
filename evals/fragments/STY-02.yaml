          busy: [["2027-01-11T09:00:00-05:00", "2027-01-11T13:00:00-05:00"], ["2027-01-12T10:00:00-05:00", "2027-01-12T17:00:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_judge]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-11T13:00:00-05:00"}
        - {S1: "2027-01-12T09:15:00-05:00"}
