      - {instant: "2027-01-18T17:00:00Z", time_zone: Asia/Riyadh, expected_local: "2027-01-18T20:00", expected_weekday: Monday}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-17T00:00:00Z", end: "2027-01-23T00:00:00Z"}
      participants:
        candidate:
          time_zone: Europe/London
          available: [["2027-01-17T10:00:00+00:00", "2027-01-17T12:00:00+00:00"], ["2027-01-18T17:00:00+00:00", "2027-01-18T19:00:00+00:00"], ["2027-01-21T08:00:00+00:00", "2027-01-21T09:00:00+00:00"], ["2027-01-22T09:00:00+00:00", "2027-01-22T11:00:00+00:00"]]
        int_faisal:
          time_zone: Asia/Riyadh
          working_hours: {time_zone: Asia/Riyadh, days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "17:00"}
          busy: [["2027-01-21T11:00:00+03:00", "2027-01-21T11:30:00+03:00"]]
