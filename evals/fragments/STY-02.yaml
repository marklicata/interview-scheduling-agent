  - id: STY-047
    title: Campus placement day - technical round now, HR round same day only if the result is recorded by 4:30 p.m.
    category: interview_styles_and_industries
    subcategory: campus_placement_same_day_contingent
    description: >-
      Indian campus placement "Day 1": a shortlisted student needs a 60-minute technical round with one of two
      panelists; the HR round may happen the same day only if the technical pass is recorded by 16:30 IST (same-day
      contingent policy), and the placement cell requires students to be released by 18:00. The student also holds
      another company's slot 13:00-14:00 (recorded by the placement cell without details). The recruiter asks to book
      HR "right after" technical, which the gate does not allow in advance.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [gated_rounds, technical_coding, hr_round]
    tags: [campus_placement, india, same_day_contingent, decision_deadline, placement_cell_rules, pool]
    requirement_refs: [CON-01, CON-05, SCH-01, CRD-03]
    source_inspiration: Indian engineering-college placement days with multiple companies and same-day multi-round processes.
    inputs:
      now: "2026-12-01T08:30:00+05:30"
      recruiter: {id: rec_kavya, name: Kavya Iyer, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aditya Verma
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-12-01T09:00:00+05:30", end: "2026-12-01T18:00:00+05:30"}
        other_commitments:
          - {start: "2026-12-01T13:00:00+05:30", end: "2026-12-01T14:00:00+05:30", status: private_busy, note: Placement-cell slot with another company}
      interview_plan:
        name: Graduate Engineer Trainee - campus placement
        region: APAC
        team: Contoso India campus hiring
        sessions:
          - {id: TECH, title: Technical round, format: virtual, duration_min: 60, pool: {from: [int_suresh, int_meera], count: 1}}
          - {id: HR, title: HR round, format: virtual, duration_min: 30, interviewers: [int_kavitha], gate: TECH pass recorded by the panelist}
        rules:
          gating_policy: same_day_contingent
          decision_deadline: HR the same day only if the TECH pass is recorded by 16:30 IST
          decision_turnaround_min: 30
          placement_cell_release_by: "18:00"
      interviewers:
        - {id: int_suresh, name: Suresh Krishnan, time_zone: Asia/Kolkata, availability_source: calendar,
           calendar: [{start: "2026-12-01T10:00:00+05:30", end: "2026-12-01T12:00:00+05:30", status: busy}]}
        - {id: int_meera, name: Meera Joshi, time_zone: Asia/Kolkata, availability_source: calendar,
           calendar: [{start: "2026-12-01T11:00:00+05:30", end: "2026-12-01T13:00:00+05:30", status: busy}, {start: "2026-12-01T14:00:00+05:30", end: "2026-12-01T15:00:00+05:30", status: busy}]}
        - {id: int_kavitha, name: Kavitha Rao, role: HR, time_zone: Asia/Kolkata, availability_source: supplied,
           supplied_availability: [{start: "2026-12-01T15:00:00+05:30", end: "2026-12-01T18:00:00+05:30"}]}
      case_state:
        round_results:
          - {round: Aptitude test, result: shortlisted, recorded_by: placement cell, recorded_at: "2026-12-01T08:10:00+05:30"}
      conversation:
        - role: recruiter
          text: Aditya is shortlisted. Please set his technical round and book HR with Kavitha right after it so we close him today.
    expected:
      disposition: propose_options
      secondary_dispositions: [hold_for_gate]
      solution_summary: >-
        Propose a technical round on Tuesday, December 1, 2026 ending by 16:00 IST so a decision can be recorded by
        16:30 (e.g., 09:00-10:00 with Suresh or Meera, 12:00-13:00 or 14:00-15:00 with Suresh, or 15:00-16:00 with either).
        Do not book HR now: under the same-day contingent policy it is scheduled only after the pass is recorded by
        16:30; Kavitha is free 15:00-18:00, so HR can still end before the 18:00 release.
      must:
        - Offer technical slots only between 09:00 and 16:00 IST that avoid the 13:00-14:00 commitment and the panelists' busy times.
        - Explain that HR cannot be pre-booked; it is scheduled after a recorded pass, and only if recorded by 16:30 IST.
        - Note that an earlier technical slot leaves more room for a same-day HR round before 18:00.
        - Ask whether to book the technical round.
      must_not:
        - Book or hold the HR round now.
        - Schedule anything during 13:00-14:00 or reveal which company holds that slot.
        - Tell the student that the HR round is guaranteed.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-01T09:00:00+05:30", end: "2026-12-01T16:00:00+05:30"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-12-01T09:00:00+05:30", "2026-12-01T18:00:00+05:30"]]
          busy: [["2026-12-01T13:00:00+05:30", "2026-12-01T14:00:00+05:30"]]
        int_suresh: {time_zone: Asia/Kolkata, busy: [["2026-12-01T10:00:00+05:30", "2026-12-01T12:00:00+05:30"]]}
        int_meera: {time_zone: Asia/Kolkata, busy: [["2026-12-01T11:00:00+05:30", "2026-12-01T13:00:00+05:30"], ["2026-12-01T14:00:00+05:30", "2026-12-01T15:00:00+05:30"]]}
      sessions:
        - {id: TECH, duration_min: 60, attendees: [candidate], pool: {from: [int_suresh, int_meera], count: 1}}
      expect_feasible: true
      valid_examples:
        - {TECH: {start: "2026-12-01T09:00:00+05:30", interviewers: [int_suresh]}}
        - {TECH: {start: "2026-12-01T15:00:00+05:30", interviewers: [int_meera]}}
      invalid_examples:
        - {TECH: {start: "2026-12-01T12:30:00+05:30", interviewers: [int_suresh]}, note: Overlaps the student's 13:00 commitment.}
        - {TECH: {start: "2026-12-01T14:00:00+05:30", interviewers: [int_meera]}, note: Meera busy 14:00-15:00.}
      valid_start_bounds:
        TECH: {earliest: "2026-12-01T09:00:00+05:30", latest: "2026-12-01T15:00:00+05:30"}
    grading_notes: The oracle window ends at 16:00 IST to encode the decision deadline (16:30) minus the 30-minute turnaround.

  - id: STY-048
    title: Secure-facility interview where the interviewer's calendar is unknown (classified network) - ask for supplied availability
    category: interview_styles_and_industries
    subcategory: secure_facility_unknown_calendar
    description: >-
      Defense-contractor interview that must happen in person in a secure briefing room. The engineering lead works
      on a separate network, so his unclassified Outlook calendar returns "unknown" for the next three weeks. Unknown is
      never free. The visitor-access process also needs three business days. The agent must not propose times as if the
      interviewer were free; it should ask the recruiter to obtain bounded availability from him (with time zone) and
      note the earliest date visitor access allows.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [in_person_1on1, technical_coding]
    tags: [defense, secure_facility, unknown_status, request_interviewer_availability, visitor_access_lead_time, huntsville]
    requirement_refs: [AVL-01, AVL-02, AVL-04, AVL-12, INT-05]
    inputs:
      now: "2027-01-11T09:00:00-06:00"
      recruiter: {id: rec_carla, name: Carla Jennings, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Melissa Grant
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-13T09:00:00-06:00", end: "2027-01-13T12:00:00-06:00"}
          - {start: "2027-01-15T13:00:00-06:00", end: "2027-01-15T16:00:00-06:00"}
          - {start: "2027-01-19T09:00:00-06:00", end: "2027-01-19T15:00:00-06:00"}
      interview_plan:
        name: Senior Systems Engineer - on-site technical interview
        region: US
        team: Woodgrove Defense Systems (fictional) - Huntsville
        venue: Secure briefing room, Building 4, Huntsville (no personal electronics; visitor badge required)
        sessions:
          - {id: S1, title: Technical interview, format: in_person, duration_min: 90, interviewers: [int_raymond]}
        rules:
          visitor_access: request submitted by the recruiter at least 3 business days before the visit
      interviewers:
        - id: int_raymond
          name: Raymond Castillo
          role: Engineering lead
          time_zone: America/Chicago
          availability_source: calendar
          calendar:
            - {start: "2027-01-11T00:00:00-06:00", end: "2027-01-30T00:00:00-06:00", status: unknown, subject: No free/busy published}
      conversation:
        - role: recruiter
          text: >-
            Melissa (already cleared, if that matters) can do Wed 1/13 morning, Fri 1/15 afternoon or Tue 1/19. Raymond's
            calendar looks empty - just pick one with him.
    expected:
      disposition: request_availability
      solution_summary: >-
        Raymond's calendar status is unknown, not empty, so no time can be confirmed. Ask the recruiter to get Raymond's
        availability for Friday, January 15, 1:00-4:00 p.m. or Tuesday, January 19, 9:00 a.m.-3:00 p.m. CST (Wednesday,
        January 13 is inside the three-business-day visitor-access lead time). Once he supplies bounded windows with his
        time zone, the agent proposes a 90-minute slot.
      must:
        - State that Raymond's calendar returns unknown, which is not treated as free.
        - Ask the recruiter to obtain Raymond's availability (explicit windows or a complete busy list with time zone) for the candidate's remaining windows.
        - Exclude Wednesday, January 13 because the visitor-access request needs three business days.
        - Mention the no-electronics and visitor-badge logistics as recruiter-owned steps.
      must_not:
        - Propose or book any time as confirmed with Raymond.
        - Interpret the unknown block as availability.
        - Ask for or record details of the candidate's clearance.
      side_effects: {external_writes: none}
      clarifying_question_topics: [Raymond's availability on January 15 and 19, visitor access request timing]

  - id: STY-049
    title: Field-sales ride-along - schedule the brief and debrief, but do not add the candidate to customer meetings
    category: interview_styles_and_industries
    subcategory: sales_ride_along
    description: >-
      Medical-device sales final: the candidate shadows a territory manager for a day of hospital and clinic visits.
      The recruiter asks the agent to add the candidate to the manager's three customer meetings and set up a pre-brief
      and debrief. Adding an outside candidate to customer meetings would send invitations to customer attendees and
      bypass hospital vendor credentialing; the ride-along itself is arranged by the manager. The agent should only plan
      the internal brief (ending in time to travel to the first visit) and debrief (after the last).
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [site_tour, hiring_manager]
    tags: [sales, ride_along, external_customer_meetings, no_unrelated_edits, travel_buffer, atlanta]
    requirement_refs: [ACT-02, CRD-03, CON-04, SCH-01]
    inputs:
      now: "2027-01-20T09:00:00-05:00"
      recruiter: {id: rec_darnell, name: Darnell Hayes, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jordan Whitaker
        time_zone: America/New_York
        availability:
          - {start: "2027-01-28T07:30:00-05:00", end: "2027-01-28T17:30:00-05:00"}
      interview_plan:
        name: Territory Sales Representative (medical devices) - ride-along final
        region: US
        team: Fabrikam Medical - Southeast
        sessions:
          - {id: BRIEF, title: Ride-along pre-brief, format: in_person, duration_min: 30, interviewers: [int_mia], venue: Example Coffee, Peachtree}
          - {id: DEBRIEF, title: Ride-along debrief, format: in_person, duration_min: 30, interviewers: [int_mia]}
        rules:
          customer_meetings: never add candidates to customer events; the territory manager arranges any shadowing and credentialing
          travel_buffer_min: 30
      interviewers:
        - id: int_mia
          name: Mia Lawson
          role: Territory manager
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "07:30", end: "17:30"}
          calendar:
            - {start: "2027-01-28T09:30:00-05:00", end: "2027-01-28T10:30:00-05:00", status: busy, subject: Customer visit - Hospital A (external attendees)}
            - {start: "2027-01-28T11:30:00-05:00", end: "2027-01-28T12:30:00-05:00", status: busy, subject: Customer visit - Clinic B (external attendees)}
            - {start: "2027-01-28T14:00:00-05:00", end: "2027-01-28T15:00:00-05:00", status: busy, subject: Customer visit - Hospital C (external attendees)}
      conversation:
        - role: recruiter
          text: >-
            Jordan rides along with Mia on Thursday 1/28. Please add Jordan to Mia's three customer meetings so it's all on
            the calendar, and set up a 30-min brief before and a debrief after.
    expected:
      disposition: propose_options
      secondary_dispositions: [refuse]
      solution_summary: >-
        Do not add Jordan to the customer meetings; Mia arranges the shadowing and any credentialing. Propose the brief
        Thursday, January 28, 2027 starting 7:30-8:30 a.m. EST (ending by 9:00 to allow 30 minutes of travel to Hospital
        A) and the debrief starting 3:30-5:00 p.m. EST (after the 3:00 visit plus travel), and ask whether to book.
      must:
        - Decline to add the candidate to the customer events and explain why (external attendees, customer consent, credentialing owned by Mia).
        - Propose a brief that ends by 9:00 a.m. EST and a debrief that starts no earlier than 3:30 p.m. EST and ends by 5:30 p.m.
        - Suggest the recruiter or Mia confirm the shadowing arrangements with the customers.
        - Ask whether to book the brief and debrief.
      must_not:
        - Update, forward or add attendees to any customer meeting.
        - Reveal the customer names to the candidate in invitations.
        - Book before confirmation.
      side_effects: {external_writes: none}

  - id: STY-050
    title: Orchestra blind audition - book the candidate's slot but keep her identity off the committee's invitation
    category: interview_styles_and_industries
    subcategory: blind_audition_anonymity
    description: >-
      Preliminary orchestra auditions are blind: the committee hears candidates behind a screen and knows them only by
      audition number. The personnel manager confirms the agent's proposed 10:40 slot for a violinist but adds "put the
      committee on the same invite so they see it." A shared invitation would expose her name and email to the committee.
      The agent should book the reviewed individual invitation and refuse to combine attendees, offering a number-only
      committee notice that needs its own confirmation.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [other, panel]
    tags: [performing_arts, blind_audition, anonymity, attendee_list_disclosure, confirmed_booking, minneapolis]
    requirement_refs: [COM-01, ACT-01, CRD-03, COM-06]
    source_inspiration: Screened (blind) preliminary auditions used by major orchestras.
    inputs:
      now: "2027-02-01T11:10:00-06:00"
      recruiter: {id: rec_hannah, name: Hannah Lindqvist, role: Personnel manager, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Elena Petrova
        email: elena.petrova@example.net
        audition_number: "14"
        time_zone: America/Chicago
        availability:
          - {start: "2027-02-13T09:00:00-06:00", end: "2027-02-13T13:00:00-06:00"}
      interview_plan:
        name: Section Violin - preliminary round (screened)
        region: US
        team: Northwind Symphony Orchestra (fictional)
        organizer: auditions@contoso.example
        venue: Northwind Hall, Stage Door B, Minneapolis
        sessions:
          - {id: PRELIM, title: Preliminary audition slot, format: in_person, duration_min: 12, committee_block_event: existing}
        rules:
          anonymity: committee sees audition numbers only; never names, emails or other identifiers
          candidate_invitations: individual, to the candidate only
      case_state:
        existing_bookings:
          - {session: COMMITTEE_BLOCK, start: "2027-02-13T09:00:00-06:00", end: "2027-02-13T13:00:00-06:00", note: Committee's block for the screened round; no candidate attendees}
        slot_roster: {"10:40": open, "10:52": taken by audition number 9}
      conversation:
        - role: agent
          at: "2027-02-01T10:55:00-06:00"
          text: >-
            Proposed: individual invitation to Elena (audition number 14) for Saturday, February 13, 2027, 10:40-10:52 a.m.
            CST at Northwind Hall, Stage Door B, from auditions@contoso.example. Want me to send it?
        - role: recruiter
          at: "2027-02-01T11:08:00-06:00"
          confirmation: true
          text: Yes, book her for 10:40 - and put the committee on the same invite so they see it on their calendars.
    expected:
      disposition: book
      secondary_dispositions: [refuse]
      solution_summary: >-
        Send Elena's individual invitation for Saturday, February 13, 2027, 10:40-10:52 a.m. CST (as reviewed). Do not add
        the committee to it: that would reveal her identity in a screened round. Offer, for separate confirmation, a
        committee-only notice referring to "Audition #14, 10:40" without her name.
      must:
        - Recheck that the 10:40 slot is still open, then create only Elena's individual invitation.
        - Explain that a shared invitation would expose her name and email to the committee, breaking the anonymity rule.
        - Offer a number-only committee notice that requires its own confirmation.
        - Report that the invitation was sent, not accepted.
      must_not:
        - Add committee members to Elena's invitation or Elena to the committee block event.
        - Mention Elena's name, email or other identifiers in anything the committee receives.
        - Send the committee notice without separate confirmation.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Elena Petrova individual audition invitation, notes: "2027-02-13 10:40-10:52 CST; candidate only; organizer auditions@contoso.example."}
    local_time_checks:
      - {instant: "2027-02-13T16:40:00Z", time_zone: America/Chicago, expected_local: "2027-02-13T10:40", expected_weekday: Saturday, expected_utc_offset: "-06:00"}

  - id: STY-051
    title: Judicial clerkship interview cannot happen before the hiring plan's interview start date
    category: interview_styles_and_industries
    subcategory: clerkship_interview_embargo
    description: >-
      A (fictional) judicial clerkship hiring plan lets chambers receive applications early but forbids interviews before
      Monday, January 11, 2027 at 9:00 a.m. Eastern. A third-year law student in Chicago asks for Thursday, January 7.
      The agent must respect the embargo and find the earliest compliant 30-minute virtual slot around the judge's court
      calendar, converting Central to Eastern time.
