        - {CASE: "2027-01-21T08:00:00+00:00", note: Overlaps Faisal's 11:00 AST meeting.}
      valid_start_bounds:
        CASE: {earliest: "2027-01-17T10:00:00+00:00", latest: "2027-01-17T11:00:00+00:00"}

  - id: STY-046
    title: Newsroom timed edit test with a live proctor, then an editor interview at least 18 hours later
    category: interview_styles_and_industries
    subcategory: journalism_timed_test_then_interview
    description: >-
      Digital newsroom hiring: a two-hour live-proctored edit test must fall within the London proctor's hours, and the
      45-minute interview with the section editor must be at least 18 hours after the test ends (editors read the copy
      first) and within three days. The Lagos candidate offered three windows. The recruiter's idea - test Tuesday
      afternoon, interview Wednesday morning - meets the 18-hour rule but collides with the editor's conference.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [simulation, virtual_1on1]
    tags: [media, journalism, timed_test, proctored_exercise, min_gap_hours, lagos, london]
    requirement_refs: [CON-03, CON-04, AVL-10, SCH-01]
    inputs:
      now: "2027-01-12T10:00:00+00:00"
      recruiter: {id: rec_fiona, name: Fiona Barrett, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Chidinma Okeke
        time_zone: Africa/Lagos
        availability:
          - {start: "2027-01-19T13:00:00+01:00", end: "2027-01-19T18:00:00+01:00"}
          - {start: "2027-01-20T09:00:00+01:00", end: "2027-01-20T12:00:00+01:00"}
          - {start: "2027-01-21T14:00:00+01:00", end: "2027-01-21T17:00:00+01:00"}
      interview_plan:
        name: Sub-editor, Africa desk - edit test and interview
        region: EMEA
        team: Litware News - Africa desk
        sessions:
          - {id: EDIT, title: Live-proctored edit test (Teams), format: virtual, duration_min: 120, interviewers: [int_proctor], order: 1}
          - {id: FOLLOW, title: Interview with section editor, format: virtual, duration_min: 45, interviewers: [int_editor], order: 2}
        rules: {min_hours_between_test_end_and_interview: 18, max_days_between: 3}
      interviewers:
        - {id: int_proctor, name: Callum Reid, role: Test proctor, time_zone: Europe/London, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"},
           calendar: [{start: "2027-01-19T12:00:00+00:00", end: "2027-01-19T13:00:00+00:00", status: busy}]}
        - {id: int_editor, name: Amara Osei-Bonsu, role: Section editor, time_zone: Europe/London, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"},
           calendar: [{start: "2027-01-20T09:00:00+00:00", end: "2027-01-20T11:00:00+00:00", status: busy, subject: Editorial conference},
                      {start: "2027-01-21T13:00:00+00:00", end: "2027-01-21T14:00:00+00:00", status: busy}]}
      conversation:
        - role: recruiter
          text: >-
            Chidinma is in Lagos. Can we do the edit test Tuesday afternoon and the interview with Amara Wednesday
            morning, while it's fresh?
    expected:
      disposition: propose_options
      solution_summary: >-
        Edit test Tuesday, January 19, 2027 starting 1:00-3:00 p.m. GMT (2:00-4:00 p.m. WAT), or Wednesday 9:00 a.m. GMT;
        the editor interview cannot be Wednesday morning (editorial conference), so it goes Thursday, January 21,
        starting 2:00-3:15 p.m. GMT (3:00-4:15 p.m. WAT). Example: test Tuesday 1:00-3:00 p.m. GMT, interview Thursday
        2:00-2:45 p.m. GMT.
      must:
