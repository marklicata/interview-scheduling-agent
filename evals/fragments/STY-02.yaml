  - id: STY-043
    title: Manufacturing plant visit - safety induction before the floor tour, avoiding the shift change
    category: interview_styles_and_industries
    subcategory: plant_safety_induction_order
    description: >-
      Production-engineer final at a plant in Wroclaw: a 30-minute safety induction with the EHS officer must
      precede the 60-minute production-floor tour (within 60 minutes), the tour may not overlap the 14:00-14:30
      shift change, and the hiring-manager interview follows the tour within 60 minutes. EHS is free only two
      short windows, and the supervisor has a late-morning meeting, so the morning fails and the afternoon
      sequence is tightly constrained.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [site_tour, in_person_loop, hiring_manager]
    tags: [manufacturing, safety_induction_prerequisite, shift_change_blackout, ordered_sessions, wroclaw, poland]
    requirement_refs: [CON-03, CON-05, SCH-01, SCH-05]
    inputs:
      now: "2027-01-18T09:00:00+01:00"
      recruiter: {id: rec_agnieszka, name: Agnieszka Wojcik, time_zone: Europe/Warsaw}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Piotr Zielinski
        time_zone: Europe/Warsaw
        availability:
          - {start: "2027-01-26T10:00:00+01:00", end: "2027-01-26T17:00:00+01:00"}
      interview_plan:
        name: Production Engineer - plant visit
        region: Poland
        team: Fabrikam Components - Wroclaw plant
        venue: Fabrikam Components, ul. Przykladowa 5, Wroclaw (gate B; bring photo ID)
        sessions:
          - {id: SAFETY, title: Safety induction, format: in_person, duration_min: 30, interviewers: [int_ehs], order: 1}
          - {id: FLOOR, title: Production floor tour, format: in_person, duration_min: 60, interviewers: [int_prod], order: 2}
          - {id: HM, title: Hiring manager interview, format: in_person, duration_min: 60, interviewers: [int_hm], order: 3}
        rules:
          floor_access: only after the safety induction on the same visit
          shift_changes: "06:00-06:30, 14:00-14:30, 22:00-22:30 (no floor tours)"
          max_gap_min: 60
          ppe: provided at gate B
      interviewers:
        - {id: int_ehs, name: Marta Kaczmarek, role: EHS officer, time_zone: Europe/Warsaw, availability_source: supplied,
           supplied_availability: [{start: "2027-01-26T10:00:00+01:00", end: "2027-01-26T11:00:00+01:00"}, {start: "2027-01-26T13:00:00+01:00", end: "2027-01-26T14:00:00+01:00"}]}
        - {id: int_prod, name: Tomasz Lewandowski, role: Production supervisor, time_zone: Europe/Warsaw, availability_source: calendar,
           calendar: [{start: "2027-01-26T11:00:00+01:00", end: "2027-01-26T12:15:00+01:00", status: busy}]}
        - {id: int_hm, name: Ewa Nowicka, role: Engineering manager, time_zone: Europe/Warsaw, availability_source: calendar,
           calendar: [{start: "2027-01-26T15:30:00+01:00", end: "2027-01-26T16:00:00+01:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Piotr can visit Tuesday 26 January from 10:00. Please plan induction, floor tour and Ewa's interview.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, January 26, 2027 (CET): safety induction between 13:00 and 13:30 start, floor tour starting 14:30-15:00
        (after the shift change and within 60 minutes of the induction), and Ewa's interview 16:00-17:00. Example:
        induction 13:30-14:00, floor 14:30-15:30, interview 16:00-17:00.
      must:
        - Put the safety induction before the floor tour and the tour before Ewa's interview.
        - Start the floor tour between 14:30 and 15:00 CET so it avoids the 14:00-14:30 shift change.
        - Schedule Ewa's interview 16:00-17:00 CET (after her 15:30-16:00 conflict).
        - Explain why a morning start fails (the supervisor's 11:00-12:15 meeting leaves no tour slot within 60 minutes of the morning induction).
        - Include gate B and photo-ID instructions, and ask whether to book.
      must_not:
        - Schedule the floor tour before the induction or during 14:00-14:30.
        - Leave more than 60 minutes between consecutive activities.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-26T08:00:00+01:00", end: "2027-01-26T18:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Warsaw, available: [["2027-01-26T10:00:00+01:00", "2027-01-26T17:00:00+01:00"]]}
        int_ehs: {time_zone: Europe/Warsaw, available: [["2027-01-26T10:00:00+01:00", "2027-01-26T11:00:00+01:00"], ["2027-01-26T13:00:00+01:00", "2027-01-26T14:00:00+01:00"]]}
        int_prod: {time_zone: Europe/Warsaw, busy: [["2027-01-26T11:00:00+01:00", "2027-01-26T12:15:00+01:00"], ["2027-01-26T14:00:00+01:00", "2027-01-26T14:30:00+01:00"]]}
        int_hm: {time_zone: Europe/Warsaw, busy: [["2027-01-26T15:30:00+01:00", "2027-01-26T16:00:00+01:00"]]}
      sessions:
        - {id: SAFETY, duration_min: 30, attendees: [candidate, int_ehs]}
        - {id: FLOOR, duration_min: 60, attendees: [candidate, int_prod]}
        - {id: HM, duration_min: 60, attendees: [candidate, int_hm]}
      constraints:
        order: [SAFETY, FLOOR, HM]
        min_gap_min: 0
        max_gap_min: 60
      expect_feasible: true
      valid_examples:
        - {SAFETY: "2027-01-26T13:30:00+01:00", FLOOR: "2027-01-26T14:30:00+01:00", HM: "2027-01-26T16:00:00+01:00"}
      invalid_examples:
        - {SAFETY: "2027-01-26T13:00:00+01:00", FLOOR: "2027-01-26T13:30:00+01:00", HM: "2027-01-26T15:00:00+01:00", note: Floor tour overlaps the shift change and HM overlaps Ewa's conflict.}
        - {SAFETY: "2027-01-26T10:00:00+01:00", FLOOR: "2027-01-26T12:00:00+01:00", HM: "2027-01-26T13:00:00+01:00", note: 90 minutes between induction and tour.}
      valid_start_bounds:
        FLOOR: {earliest: "2027-01-26T14:30:00+01:00", latest: "2027-01-26T15:00:00+01:00"}
        HM: {earliest: "2027-01-26T16:00:00+01:00", latest: "2027-01-26T16:00:00+01:00"}
    grading_notes: The shift change is encoded as busy time for the supervisor because the floor tour cannot run then.

  - id: STY-044
    title: Audit-firm busy season - partner interviews only in the Friday 4-5 p.m. window even when the calendar looks free
    category: interview_styles_and_industries
    subcategory: busy_season_partner_window
    description: >-
      Accounting firm busy-season policy (January 15-March 15): audit partners interview only on Fridays between
      4:00 and 5:00 p.m. The partner's calendar shows Tuesday lunch free and the recruiter suggests it, but policy
      forbids it. The first Friday is partly taken by a client call, leaving only 30 minutes; the following Friday
      works for a 45-minute interview.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [hiring_manager, in_person_1on1]
    tags: [accounting, busy_season, policy_window, calendar_free_but_policy_blocked, toronto]
    requirement_refs: [CON-05, SCH-08, SCH-05]
    inputs:
      now: "2027-02-10T09:00:00-05:00"
      recruiter: {id: rec_amrita, name: Amrita Sandhu, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Owen MacPherson
        time_zone: America/Toronto
        availability:
          - {start: "2027-02-16T12:00:00-05:00", end: "2027-02-16T13:00:00-05:00"}
          - {start: "2027-02-19T15:30:00-05:00", end: "2027-02-19T17:30:00-05:00"}
          - {start: "2027-02-26T16:00:00-05:00", end: "2027-02-26T17:30:00-05:00"}
      interview_plan:
        name: Audit Manager (experienced hire) - partner interview
        region: Canada
        team: Northwind & Co. LLP (fictional) - Toronto audit practice
        venue: Northwind & Co., 77 Example Street West, Toronto
        sessions:
          - {id: P, title: Partner interview, format: in_person, duration_min: 45, interviewers: [int_harjit]}
      policies:
        busy_season: {from: "2027-01-15", to: "2027-03-15", partner_interview_window: Fridays 16:00-17:00 local only}
      interviewers:
        - {id: int_harjit, name: Harjit Gill, role: Audit partner, time_zone: America/Toronto, availability_source: calendar,
           calendar: [{start: "2027-02-19T16:00:00-05:00", end: "2027-02-19T16:30:00-05:00", status: busy, subject: Client call}]}
      conversation:
        - role: recruiter
          text: Harjit's calendar is wide open Tuesday 2/16 at lunch and Owen can do 12-1. Can we just put it there?
    expected:
      disposition: propose_options
      solution_summary: >-
        Not Tuesday: busy-season policy limits partner interviews to Fridays 4:00-5:00 p.m. Friday, February 19 has only
        4:30-5:00 p.m. free (client call 4:00-4:30). The valid option is Friday, February 26, 2027, starting between
        4:00 and 4:15 p.m. EST.
      must:
        - Explain that the busy-season policy overrides the free-looking Tuesday calendar.
        - Explain that February 19 leaves only 30 minutes in the window.
        - Propose a 45-minute start between 4:00 and 4:15 p.m. EST on Friday, February 26.
        - Ask whether to book.
      must_not:
        - Propose Tuesday, February 16 at lunch.
        - Propose any time outside the Friday 4:00-5:00 p.m. window.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-15T00:00:00-05:00", end: "2027-02-27T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/Toronto
          available: [["2027-02-16T12:00:00-05:00", "2027-02-16T13:00:00-05:00"], ["2027-02-19T15:30:00-05:00", "2027-02-19T17:30:00-05:00"], ["2027-02-26T16:00:00-05:00", "2027-02-26T17:30:00-05:00"]]
        int_harjit:
          time_zone: America/Toronto
          working_hours: {time_zone: America/Toronto, days: [Fri], start: "16:00", end: "17:00"}
          busy: [["2027-02-19T16:00:00-05:00", "2027-02-19T16:30:00-05:00"]]
      sessions:
        - {id: P, duration_min: 45, attendees: [candidate, int_harjit]}
      expect_feasible: true
      valid_examples:
        - {P: "2027-02-26T16:00:00-05:00"}
      invalid_examples:
        - {P: "2027-02-16T12:00:00-05:00", note: Busy-season policy forbids Tuesday partner interviews.}
        - {P: "2027-02-19T16:30:00-05:00", note: Runs past the 5:00 p.m. window end.}
      valid_start_bounds:
        P: {earliest: "2027-02-26T16:00:00-05:00", latest: "2027-02-26T16:15:00-05:00"}
