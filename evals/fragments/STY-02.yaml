          - {id: B, title: One-on-one with Prof. Bjorn Halvorsen, format: in_person, duration_min: 30, interviewers: [int_bjorn]}
          - {id: LAB, title: Lab tour with lab manager, format: in_person, duration_min: 60, interviewers: [int_carmen]}
      interviewers:
        - {id: int_amelie, name: Prof. Amelie Fournier, time_zone: America/Vancouver, availability_source: supplied,
           supplied_availability: [{start: "2027-03-04T15:30:00-08:00", end: "2027-03-04T17:00:00-08:00"}, {start: "2027-03-05T10:00:00-08:00", end: "2027-03-05T11:00:00-08:00"}]}
        - {id: int_bjorn, name: Prof. Bjorn Halvorsen, time_zone: America/Vancouver, availability_source: supplied,
           supplied_availability: [{start: "2027-03-05T09:30:00-08:00", end: "2027-03-05T10:30:00-08:00"}]}
        - {id: int_carmen, name: Carmen Ibarra, role: Lab manager, time_zone: America/Vancouver, availability_source: supplied,
           supplied_availability: [{start: "2027-03-04T16:00:00-08:00", end: "2027-03-04T17:00:00-08:00"}, {start: "2027-03-05T10:30:00-08:00", end: "2027-03-05T12:00:00-08:00"}]}
        - {id: int_chair, name: Prof. Liam Ostrowski, role: Department chair, time_zone: America/Vancouver, availability_source: supplied,
           supplied_availability: [{start: "2027-03-05T08:00:00-08:00", end: "2027-03-05T08:45:00-08:00"}]}
      case_state:
        existing_bookings:
          - {session: BREAKFAST, start: "2027-03-04T08:00:00-08:00", end: "2027-03-04T09:00:00-08:00", note: Breakfast with chair - affected}
          - {session: A, start: "2027-03-04T09:30:00-08:00", end: "2027-03-04T10:00:00-08:00", note: affected}
          - {session: B, start: "2027-03-04T10:00:00-08:00", end: "2027-03-04T10:30:00-08:00", note: affected}
          - {session: LAB, start: "2027-03-04T10:45:00-08:00", end: "2027-03-04T11:45:00-08:00", note: affected}
          - {session: TALK, start: "2027-03-04T12:30:00-08:00", end: "2027-03-04T13:30:00-08:00", note: Department seminar, announced - do not move}
          - {session: DEAN, start: "2027-03-04T14:00:00-08:00", end: "2027-03-04T14:30:00-08:00", note: unaffected}
          - {session: C, start: "2027-03-04T15:00:00-08:00", end: "2027-03-04T15:30:00-08:00", note: unaffected}
          - {session: D, start: "2027-03-05T09:00:00-08:00", end: "2027-03-05T09:30:00-08:00", note: unaffected}
          - {session: STUDENT_LUNCH, start: "2027-03-05T12:00:00-08:00", end: "2027-03-05T13:00:00-08:00", note: unaffected}
      conversation:
        - role: recruiter
          text: >-
            Ifeoma's flight tonight was cancelled - she's rebooked to land YVR Thursday 10:20am, on campus by 11:20.
            Can you fix tomorrow? The seminar is announced so it can't move. Amelie, Bjorn and Carmen sent me their
            free times (attached above).
    expected:
      disposition: propose_options
      solution_summary: >-
        Keep the job talk (Thursday, March 4, 2027, 12:30-1:30 p.m. PST), dean, one-on-one C, Friday D and student
        lunch unchanged. Move only the affected sessions, e.g. Amelie Thursday 3:30-4:00 p.m., lab tour Thursday
