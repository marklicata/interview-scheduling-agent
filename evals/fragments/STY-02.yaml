    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [legal, judicial_clerkship, hiring_plan_embargo, earliest_allowed_date, chicago, new_york]
    requirement_refs: [CON-05, AVL-10, SCH-01, SCH-05]
    inputs:
      now: "2027-01-04T09:00:00-05:00"
      recruiter: {id: rec_judith, name: Judith Feld, role: Chambers coordinator, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marcus Ellery
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-07T10:00:00-06:00", end: "2027-01-07T15:00:00-06:00"}
          - {start: "2027-01-11T12:00:00-06:00", end: "2027-01-11T15:00:00-06:00"}
          - {start: "2027-01-12T08:00:00-06:00", end: "2027-01-12T09:00:00-06:00"}
      interview_plan:
        name: Term Law Clerk 2028-2029 - chambers interview
        region: US
        team: Chambers of Judge Eleanor Whitfield (fictional court)
        sessions:
          - {id: S1, title: Interview with the judge, format: virtual, duration_min: 30, interviewers: [int_judge]}
        rules:
          hiring_plan: no interviews before 2027-01-11 09:00 Eastern (applications may be reviewed earlier)
      interviewers:
        - {id: int_judge, name: Judge Eleanor Whitfield, time_zone: America/New_York, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"},
           calendar: [{start: "2027-01-11T09:00:00-05:00", end: "2027-01-11T13:00:00-05:00", status: busy, subject: Court},
                      {start: "2027-01-12T10:00:00-05:00", end: "2027-01-12T17:00:00-05:00", status: busy, subject: Court}]}
      conversation:
        - role: candidate
          channel: email
          text: Thank you for the invitation! Would Thursday, January 7 work? I'm free 10-3 Central. Otherwise Mon 1/11 noon-3 or Tue 1/12 8-9 Central.
        - role: recruiter
          text: Can you find Marcus a slot with the judge? Earliest possible.
    expected:
      disposition: propose_options
