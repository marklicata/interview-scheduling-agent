test_cases:
  - id: STY-029
    title: Internship interview around a Seoul student's exam timetable with a Seattle interviewer across the date line
    category: interview_styles_and_industries
    subcategory: internship_exam_schedule
    description: >-
      A Seoul university student offers 08:00-22:00 KST on December 14-17 but has finals on December 15 and 17
      and asks for no interview within three hours before an exam. The interviewer in Seattle works 8:00-5:00
      PST, which maps to 01:00-10:00 KST the next day. Monday-morning KST is Sunday afternoon in Seattle, Tuesday
      is blocked by the exam buffer, Wednesday collides with an interviewer meeting, leaving Thursday morning KST.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [internship, student_exam_schedule, date_line, seoul, seattle, candidate_buffer_rule]
    requirement_refs: [AVL-10, INT-03, SCH-01, SCH-08]
    inputs:
      now: "2026-12-07T10:00:00-08:00"
      recruiter: {id: rec_ashley, name: Ashley Turner, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Seo-yeon Kim
        time_zone: Asia/Seoul
        availability:
          - {start: "2026-12-14T08:00:00+09:00", end: "2026-12-14T22:00:00+09:00"}
          - {start: "2026-12-15T08:00:00+09:00", end: "2026-12-15T22:00:00+09:00"}
          - {start: "2026-12-16T08:00:00+09:00", end: "2026-12-16T22:00:00+09:00"}
          - {start: "2026-12-17T08:00:00+09:00", end: "2026-12-17T22:00:00+09:00"}
        exams:
          - {start: "2026-12-15T10:00:00+09:00", end: "2026-12-15T12:00:00+09:00", name: Final exam}
          - {start: "2026-12-17T14:00:00+09:00", end: "2026-12-17T17:00:00+09:00", name: Final exam}
        constraints: [no interview during an exam or in the 3 hours before an exam starts]
      interview_plan:
        name: Software Engineering Intern (Summer 2027) - technical interview
        region: Global
        team: Contoso University Recruiting
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 45, interviewers: [int_ethan]}
      interviewers:
        - {id: int_ethan, name: Ethan Morales, time_zone: America/Los_Angeles, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"},
           calendar: [{start: "2026-12-15T15:30:00-08:00", end: "2026-12-15T16:30:00-08:00", status: busy}]}
      conversation:
        - role: candidate
          channel: email
          text: >-
            My finals are Dec 15 10:00-12:00 and Dec 17 14:00-17:00 (Korea time). Please avoid the 3 hours before each
            exam. Otherwise I'm free 8am-10pm KST from Dec 14 to 17. Thank you!
        - role: recruiter
          text: Can you find 45 minutes with Ethan for Seo-yeon in her window?
    expected:
      disposition: propose_options
      solution_summary: >-
        Only Thursday, December 17, 2026, 8:00-9:15 a.m. KST starts work (Wednesday, December 16, 3:00-4:15 p.m. PST).
        December 14 morning KST is Sunday in Seattle; December 15 morning KST is inside the exam buffer; December 16
        morning KST (Tuesday afternoon PST) is broken up by Ethan's 3:30-4:30 p.m. meeting; KST evenings are the
        middle of the night in Seattle.
      must:
        - Propose only 45-minute starts from 8:00 to 9:15 a.m. KST on December 17 (3:00-4:15 p.m. PST on December 16), each with both dates.
        - Explain the date-line shift (KST morning is the previous afternoon in Seattle).
        - Explain the exam-buffer and weekend reasons for excluding December 14 and 15 KST.
        - Ask whether to book.
      must_not:
        - Propose December 14 08:00-10:00 KST (Sunday in Seattle).
        - Propose any time within three hours before either exam.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-16T23:00:00Z", time_zone: Asia/Seoul, expected_local: "2026-12-17T08:00", expected_weekday: Thursday, expected_utc_offset: "+09:00"}
      - {instant: "2026-12-16T23:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-16T15:00", expected_weekday: Wednesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-12-13T23:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-13T15:00", expected_weekday: Sunday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-14T00:00:00+09:00", end: "2026-12-18T00:00:00+09:00"}
      participants:
        candidate:
          time_zone: Asia/Seoul
          available: [["2026-12-14T08:00:00+09:00", "2026-12-14T22:00:00+09:00"], ["2026-12-15T08:00:00+09:00", "2026-12-15T22:00:00+09:00"], ["2026-12-16T08:00:00+09:00", "2026-12-16T22:00:00+09:00"], ["2026-12-17T08:00:00+09:00", "2026-12-17T22:00:00+09:00"]]
          busy: [["2026-12-15T07:00:00+09:00", "2026-12-15T12:00:00+09:00"], ["2026-12-17T11:00:00+09:00", "2026-12-17T17:00:00+09:00"]]
        int_ethan:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
          busy: [["2026-12-15T15:30:00-08:00", "2026-12-15T16:30:00-08:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_ethan]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-17T08:00:00+09:00"}
      invalid_examples:
        - {S1: "2026-12-14T08:00:00+09:00", note: Sunday afternoon in Seattle.}
        - {S1: "2026-12-16T08:00:00+09:00", note: Overlaps Ethan's 3:30 p.m. PST meeting.}
      valid_start_bounds:
        S1: {earliest: "2026-12-17T08:00:00+09:00", latest: "2026-12-17T09:15:00+09:00"}

  - id: STY-030
    title: One-way asynchronous video interview has no live slot - compute the completion deadline instead
    category: interview_styles_and_industries
    subcategory: async_video_interview
    description: >-
      The recruiter asks to "schedule" a one-way video interview with two reviewers on Friday. One-way video
      interviews have no live meeting: the candidate records answers before a deadline and reviewers watch later.
      The platform policy gives candidates until 23:59 local time on the fifth calendar day after the invitation,
      counted in the candidate's local date. Sent today from Seattle, that is already Thursday in Manila, so the
      deadline is Tuesday 23:59 PHT. Sending the platform invitation is outside the agent's capabilities.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [other]
    tags: [async_video_interview, no_live_session, deadline_computation, manila, platform_invite_not_supported]
    requirement_refs: [CON-12, AVL-10, CFG-01, SCH-07]
    inputs:
      now: "2026-11-04T14:00:00-08:00"
      recruiter: {id: rec_carmen, name: Carmen Ruiz, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Maria Clara Dizon
        time_zone: Asia/Manila
      interview_plan:
        name: Customer Support Specialist - one-way video interview
        region: APAC
        team: Contoso Support Operations
        sessions:
          - {id: OWV, title: One-way video interview (5 recorded questions), format: async, reviewers: [int_leo, int_mira]}
        rules:
          completion_deadline: 23:59 in the candidate's local time on the 5th calendar day after the invitation is sent, counting from the candidate's local date
          invitations_sent_by: recruiter through the video-interview platform
      interviewers:
        - {id: int_leo, name: Leo Fischer, time_zone: America/Los_Angeles, availability_source: none}
        - {id: int_mira, name: Mira Patel, time_zone: America/Los_Angeles, availability_source: none}
      conversation:
        - role: recruiter
          text: Please schedule Maria Clara's one-way video interview with Leo and Mira on Friday. I'll send the link today.
    expected:
      disposition: acknowledge_and_record
      secondary_dispositions: [decline_unsupported]
      solution_summary: >-
        No live meeting is needed: Leo and Mira review the recording asynchronously. If the platform invitation goes
        out today (Wednesday, November 4, 2026, 2:00 p.m. PST = Thursday, November 5, 6:00 a.m. PHT), the deadline is
        Tuesday, November 10, 11:59 p.m. PHT = Tuesday, November 10, 7:59 a.m. PST. The recruiter sends the platform
        invite; the agent can record the deadline and draft the candidate note.
      must:
        - Explain that a one-way video interview has no live Friday session to book with Leo and Mira.
        - Compute the deadline as Tuesday, November 10, 11:59 p.m. PHT and also show 7:59 a.m. PST that day.
        - Note that the candidate's local date is already November 5 when the invite is sent, which drives the count.
        - Say the platform invitation must be sent by the recruiter, and offer a draft candidate message stating the deadline in her time zone.
      must_not:
        - Create an Outlook meeting for Friday with the candidate and reviewers.
        - Claim to have sent the video-platform invitation.
        - Compute the deadline from the recruiter's date (November 9).
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-04T22:00:00Z", time_zone: Asia/Manila, expected_local: "2026-11-05T06:00", expected_weekday: Thursday, expected_utc_offset: "+08:00"}
      - {instant: "2026-11-10T15:59:00Z", time_zone: Asia/Manila, expected_local: "2026-11-10T23:59", expected_weekday: Tuesday}
      - {instant: "2026-11-10T15:59:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-10T07:59", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}

  - id: STY-031
    title: Japanese new-graduate group interview - send the student an individual invitation, never add them to the shared slot
    category: interview_styles_and_industries
    subcategory: japan_new_grad_group_interview
    description: >-
      Japanese new-graduate (shinsotsu) hiring uses group interviews of up to six students. HR pre-created the
      interviewer-side slot events; policy says each student receives an individual invitation and is never added
      to the shared event, because Outlook attendee lists would expose other students' names and addresses. The
      recruiter confirms, in Japanese, the agent's proposal to register the student into the March 9, 14:00 slot.
      The agent should recheck capacity and the student's seminar constraint, then create only her individual
      invitation.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [group_interview]
    tags: [japan, new_graduate_hiring, group_interview, candidate_privacy, individual_invitation, japanese_language, confirmed_booking]
    requirement_refs: [ACT-01, ACT-05, COM-01, COM-06, CRD-03]
    source_inspiration: Japanese shinsotsu ikkatsu saiyo practice of group interviews (shudan mensetsu) for graduating students.
    inputs:
      now: "2027-03-02T10:05:00+09:00"
      recruiter: {id: rec_sato, name: Yuki Sato, time_zone: Asia/Tokyo}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Haruka Mori
        email: haruka.mori@example.jp
        time_zone: Asia/Tokyo
        availability:
          - {start: "2027-03-09T13:00:00+09:00", end: "2027-03-09T17:00:00+09:00"}
        constraints: [university seminar every Thursday afternoon]
      interview_plan:
        name: 2028 New Graduate (sogo-shoku) - first group interview
        region: Japan
        team: Contoso Japan New Graduate Recruiting
        organizer: shinsotsu@contoso.example
        venue: Contoso Japan, Example Tower 21F, Otemachi, Tokyo
        sessions:
          - {id: GI, title: Group interview (shudan mensetsu), format: in_person, duration_min: 60, interviewers: [int_tanaka, int_ito], capacity: 6}
        rules:
          student_invitations: individual invitation per student; never add students to the shared interviewer slot event
          shared_slot_event: pre-created by HR with interviewers only
      interviewers:
        - {id: int_tanaka, name: Kenji Tanaka, time_zone: Asia/Tokyo, availability_source: calendar}
        - {id: int_ito, name: Aiko Ito, time_zone: Asia/Tokyo, availability_source: calendar}
      case_state:
        existing_bookings:
          - {session: GI-slot-0309-1400, start: "2027-03-09T14:00:00+09:00", end: "2027-03-09T15:00:00+09:00", organizer: shinsotsu@contoso.example, registered_students: 4, capacity: 6}
        prior_proposals:
          - {id: prop_gi, created_at: "2027-03-02T09:40:00+09:00", summary: Register Haruka Mori for the 2027-03-09 14:00-15:00 JST group interview slot (individual invitation)}
      conversation:
        - role: candidate
          channel: email
          at: "2027-03-01T21:10:00+09:00"
          text: 森です。3月9日(火)の14時の回を希望いたします。木曜午後はゼミのため参加できません。よろしくお願いいたします。
        - role: agent
          at: "2027-03-02T09:40:00+09:00"
          text: >-
            森 遥さんを3月9日(火) 14:00-15:00 (JST) の集団面接枠に登録し、本人宛ての個別招待を
            shinsotsu@contoso.example から送付します（共有の面接官用予定には追加しません）。現在4名登録、定員6名です。送付してよろしいですか？
        - role: recruiter
          at: "2027-03-02T10:04:00+09:00"
          confirmation: true
          text: はい、その枠で確定してください。
    expected:
      disposition: book
      solution_summary: >-
        Recheck that the Tuesday, March 9, 2027 14:00-15:00 JST slot still has capacity (4 of 6) and that the time is
        inside Haruka's availability, then send one individual invitation to haruka.mori@example.jp from
        shinsotsu@contoso.example with the Otemachi venue. Do not modify the shared interviewer event. Report the
        result in Japanese: invitation sent, not yet accepted; slot now at 5 of 6.
      must:
        - Recheck capacity and availability before sending.
        - Create exactly one individual invitation for Haruka for 14:00-15:00 JST on Tuesday, March 9, 2027 from shinsotsu@contoso.example with the venue.
        - Leave the shared interviewer slot event unchanged.
        - Reply to the recruiter in Japanese, stating the invitation was sent (not accepted).
      must_not:
        - Add Haruka to the shared slot event or put other students on her invitation.
        - Mention other registered students' names in any message.
        - Send invitations to the interviewers again or create duplicate events.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Individual invitation for Haruka Mori, notes: "2027-03-09 14:00-15:00 JST; organizer shinsotsu@contoso.example; candidate only."}
    local_time_checks:
      - {instant: "2027-03-09T05:00:00Z", time_zone: Asia/Tokyo, expected_local: "2027-03-09T14:00", expected_weekday: Tuesday, expected_utc_offset: "+09:00"}

  - id: STY-032
    title: Startup founder coffee chat in a Nairobi cafe before 11 a.m. next week
    category: interview_styles_and_industries
    subcategory: founder_coffee_chat
    description: >-
      Early-stage startup: the founder wants an informal 45-minute in-person coffee chat with a candidate who is
      free only before 11:00 a.m. next week. The founder's mornings are mostly taken and she is away Friday. Only a
      Wednesday start between 10:00 and 10:15 fits. The cafe is a public venue: the agent includes it as location
      text but does not reserve a table or contact the cafe.
    difficulty: basic
    severity: low
    release_scope: mvp
    interview_types: [informal_meal, hiring_manager, in_person_1on1]
    tags: [startup, founder, coffee_chat, informal_format, public_venue, nairobi]
    requirement_refs: [CON-12, SCH-01, SCH-02]
    inputs:
      now: "2026-11-11T16:00:00+03:00"
      recruiter: {id: rec_njeri, name: Njeri Wambui, time_zone: Africa/Nairobi}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Brian Otieno
        time_zone: Africa/Nairobi
        availability:
          - {start: "2026-11-16T08:00:00+03:00", end: "2026-11-16T11:00:00+03:00"}
          - {start: "2026-11-17T08:00:00+03:00", end: "2026-11-17T11:00:00+03:00"}
          - {start: "2026-11-18T08:00:00+03:00", end: "2026-11-18T11:00:00+03:00"}
          - {start: "2026-11-19T08:00:00+03:00", end: "2026-11-19T11:00:00+03:00"}
          - {start: "2026-11-20T08:00:00+03:00", end: "2026-11-20T11:00:00+03:00"}
      interview_plan:
        name: Founding Engineer - founder coffee chat
        region: Kenya
        team: Litware Labs (seed-stage startup)
        venue: Example Coffee House, Kilimani, Nairobi (public cafe)
        sessions:
          - {id: CC, title: Coffee chat with founder, format: in_person, duration_min: 45, interviewers: [int_wanjiru]}
      interviewers:
        - id: int_wanjiru
          name: Wanjiru Kamau
          role: Founder and CEO
          time_zone: Africa/Nairobi
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"}
          calendar:
            - {start: "2026-11-16T08:00:00+03:00", end: "2026-11-16T10:30:00+03:00", status: busy}
            - {start: "2026-11-17T08:00:00+03:00", end: "2026-11-17T12:00:00+03:00", status: busy}
            - {start: "2026-11-18T08:30:00+03:00", end: "2026-11-18T10:00:00+03:00", status: busy}
            - {start: "2026-11-19T08:00:00+03:00", end: "2026-11-19T11:00:00+03:00", status: private_busy}
            - {start: "2026-11-20T00:00:00+03:00", end: "2026-11-21T00:00:00+03:00", status: oof}
      conversation:
        - role: recruiter
          text: >-
            Wanjiru wants a relaxed coffee with Brian at Example Coffee House next week. He's only free before 11am
            any weekday. What works?
    expected:
      disposition: propose_options
      solution_summary: Wednesday, November 18, 2026, starting between 10:00 and 10:15 a.m. EAT (45 minutes) at Example Coffee House, Kilimani.
      must:
        - Propose only Wednesday, November 18 starts from 10:00 to 10:15 a.m. EAT.
        - Use the cafe as location text and treat it as an in-person informal chat.
        - Ask whether to send the invitation.
      must_not:
        - Reserve a table, contact the cafe, or arrange payment.
        - Propose Monday 10:30 (only 30 minutes before Brian's 11:00 limit) or any Friday time (founder out of office).
        - Reveal anything about the founder's private Thursday event.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T00:00:00+03:00", end: "2026-11-21T00:00:00+03:00"}
      participants:
        candidate:
          time_zone: Africa/Nairobi
          available: [["2026-11-16T08:00:00+03:00", "2026-11-16T11:00:00+03:00"], ["2026-11-17T08:00:00+03:00", "2026-11-17T11:00:00+03:00"], ["2026-11-18T08:00:00+03:00", "2026-11-18T11:00:00+03:00"], ["2026-11-19T08:00:00+03:00", "2026-11-19T11:00:00+03:00"], ["2026-11-20T08:00:00+03:00", "2026-11-20T11:00:00+03:00"]]
        int_wanjiru:
          time_zone: Africa/Nairobi
          working_hours: {time_zone: Africa/Nairobi, start: "08:00", end: "18:00"}
          busy: [["2026-11-16T08:00:00+03:00", "2026-11-16T10:30:00+03:00"], ["2026-11-17T08:00:00+03:00", "2026-11-17T12:00:00+03:00"], ["2026-11-18T08:30:00+03:00", "2026-11-18T10:00:00+03:00"], ["2026-11-19T08:00:00+03:00", "2026-11-19T11:00:00+03:00"], ["2026-11-20T00:00:00+03:00", "2026-11-21T00:00:00+03:00"]]
      sessions:
        - {id: CC, duration_min: 45, attendees: [candidate, int_wanjiru]}
      expect_feasible: true
      valid_examples:
        - {CC: "2026-11-18T10:00:00+03:00"}
      invalid_examples:
        - {CC: "2026-11-16T10:30:00+03:00", note: Ends after Brian's 11:00 limit.}
        - {CC: "2026-11-20T09:00:00+03:00", note: Founder out of office.}
      valid_start_bounds:
        CC: {earliest: "2026-11-18T10:00:00+03:00", latest: "2026-11-18T10:15:00+03:00"}

  - id: STY-033
    title: Career-fair on-campus interview must use the career center's half-hour slot grid between a student's classes
    category: interview_styles_and_industries
    subcategory: career_fair_on_campus_grid
    description: >-
      Day-after-career-fair interviews in Monterrey: the university career center assigns the room and requires
      30-minute interviews starting on the hour or half hour. Two company representatives share the grid and some
      slots are taken. The student is free only between classes (10:00-11:30). Starts like 10:45 fit everyone's
      free time but break the grid rule; valid answers are 10:30 with Lucia or 11:00 with either representative.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [campus_recruiting, career_fair, slot_grid, start_alignment, student_class_schedule, monterrey, pool]
    requirement_refs: [CON-02, CON-05, SCH-01, SCH-02]
    inputs:
      now: "2027-02-24T17:00:00-06:00"
      recruiter: {id: rec_fernanda, name: Fernanda Treviño, time_zone: America/Monterrey}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Emiliano Salazar
        time_zone: America/Monterrey
        availability:
          - {start: "2027-02-25T10:00:00-06:00", end: "2027-02-25T11:30:00-06:00"}
      interview_plan:
        name: Supply Chain Analyst (new graduate) - on-campus interview
        region: Mexico
        team: Fabrikam Mexico campus recruiting
        venue: Career Center, Sala 3 (assigned by the university)
        sessions:
          - {id: S1, title: On-campus interview, format: in_person, duration_min: 30, pool: {from: [int_lucia, int_andres], count: 1}}
        rules: {slot_grid: "30-minute slots starting on :00 or :30, 09:00-13:00", room: assigned by the career center}
      interviewers:
        - {id: int_lucia, name: Lucia Garza, time_zone: America/Monterrey, availability_source: supplied,
           supplied_availability: [{start: "2027-02-25T09:00:00-06:00", end: "2027-02-25T13:00:00-06:00"}]}
        - {id: int_andres, name: Andres Villarreal, time_zone: America/Monterrey, availability_source: supplied,
           supplied_availability: [{start: "2027-02-25T09:00:00-06:00", end: "2027-02-25T13:00:00-06:00"}]}
      case_state:
        existing_bookings:
          - {interviewer: int_lucia, start: "2027-02-25T09:00:00-06:00", end: "2027-02-25T10:30:00-06:00", note: Other students}
          - {interviewer: int_andres, start: "2027-02-25T09:30:00-06:00", end: "2027-02-25T11:00:00-06:00", note: Other students}
      conversation:
        - role: recruiter
          text: >-
            Emiliano stopped by the booth and is free tomorrow between classes, 10 to 11:30. Can we fit him on the grid
            with Lucia or Andres?
    expected:
      disposition: propose_options
      solution_summary: >-
        Thursday, February 25, 2027 (CST, Monterrey): 10:30-11:00 with Lucia, or 11:00-11:30 with Lucia or Andres, in
        Sala 3. Off-grid starts such as 10:45 are not allowed.
      must:
