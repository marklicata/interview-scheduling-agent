        - Tell Ben that pool membership changes must go through the pool owner.
        - Ask whether to book.
      must_not:
        - Assign Priscila to the bar-raiser session.
        - Modify pool membership or certification records.
        - Propose 1:00 p.m. CST with any certified bar raiser.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-16T08:00:00-06:00", end: "2026-12-16T18:00:00-06:00"}
      participants:
