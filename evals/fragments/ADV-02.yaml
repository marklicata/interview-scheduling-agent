      interview_plan:
        name: Senior Product Manager - bar raiser
        sessions:
          - {id: BR, title: Bar raiser interview, format: virtual, duration_min: 60, pool: {from: [int_ade, int_bryn], count: 1, qualification: certified bar raiser}}
