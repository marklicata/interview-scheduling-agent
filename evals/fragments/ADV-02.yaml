        int_ade: {time_zone: America/Chicago, busy: [["2026-12-16T13:00:00-06:00", "2026-12-16T15:00:00-06:00"]]}
        int_bryn: {time_zone: America/Chicago, busy: [["2026-12-16T13:00:00-06:00", "2026-12-16T14:00:00-06:00"]]}
        int_priscila: {time_zone: America/Chicago, available: [["2026-12-16T13:00:00-06:00", "2026-12-16T17:00:00-06:00"]]}
