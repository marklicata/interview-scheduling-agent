  - id: NLP-018
    title: UK candidate writes 03/04/2027 - day-first and month-first readings must be clarified
    category: availability_interpretation
    subcategory: numeric_date_locale
    description: >-
      A London candidate writes "03/04/2027". Day-first gives Saturday, April 3, 2027 (London on BST); month-first
      gives Thursday, March 4, 2027 (GMT). The US recruiter will naturally read March 4. The Saturday hint is a
      reason to confirm, not a resolution. Tests numeric date locale ambiguity across a DST boundary.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [numeric_date_format, locale_ambiguity, uk_candidate, dst_boundary]
    requirement_refs: [INT-03, INT-05, EC-003]
    inputs:
      now: "2027-02-15T10:00:00-05:00"
      recruiter: {id: rec_diane, name: Diane Kessler, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Imogen Clarke, time_zone: Europe/London}
      interview_plan:
        name: Audit Senior - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_gregory]}
      interviewers:
        - id: int_gregory
          name: Gregory Hale
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar: []
      conversation:
        - role: candidate
          at: "2027-02-15T13:05:00+00:00"
          channel: email
          text: |-
            Dear Diane,
            I'm free on 03/04/2027 from 10:00 to 12:00 (UK time).
            Best wishes,
            Imogen
        - role: recruiter
          at: "2027-02-15T10:00:00-05:00"
          channel: chat
          text: Imogen's free March 4th, 10-12 UK. Please book with Gregory.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        "03/04/2027" could be Thursday, March 4, 2027 (10:00-12:00 GMT) or Saturday, April 3, 2027 (10:00-12:00 BST).
        The candidate is UK-based, so day-first is likely but April 3 is a Saturday; ask which date she means before
        proposing or booking. The recruiter's "March 4th" is her own reading, not the candidate's confirmation.
      must:
        - Name both readings with weekdays, Thursday, March 4, 2027 and Saturday, April 3, 2027.
        - Note that the recruiter's paraphrase does not resolve the candidate's format.
        - Mention that London is on GMT on March 4 but BST on April 3, so the conversion differs.
        - Ask one focused question about the date.
      must_not:
        - Book or propose March 4 as settled.
        - Silently assume US month-first format.
        - Treat the recruiter's "please book" as confirmation of a reviewed action.
      side_effects: {external_writes: none}
      clarifying_question_topics: [date_format_march_4_or_april_3]
    local_time_checks:
      - {instant: "2027-03-04T10:00:00Z", time_zone: Europe/London, expected_local: "2027-03-04T10:00", expected_weekday: Thursday, expected_utc_offset: "+00:00"}
      - {instant: "2027-04-03T09:00:00Z", time_zone: Europe/London, expected_local: "2027-04-03T10:00", expected_weekday: Saturday, expected_utc_offset: "+01:00"}

