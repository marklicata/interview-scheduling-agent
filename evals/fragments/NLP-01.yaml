# NLP-01: relative dates and time-of-day expressions (availability_interpretation)
test_cases:
  - id: NLP-001
    title: '"Next Tuesday" written on a Sunday is ambiguous - ask which Tuesday'
    category: availability_interpretation
    subcategory: relative_weekday_ambiguous
    description: >-
      The candidate wrote "next Tuesday" on Sunday, November 8; the recruiter forwards it on Monday. It can mean
      Tuesday, November 10 or Tuesday, November 17. The org policy says to ask when a relative weekday is
      ambiguous. The agent must anchor on the candidate's send time (not on now) and ask one focused question.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [relative_date, next_weekday, send_time_anchor, smallest_question]
    requirement_refs: [INT-03, INT-05, EC-001]
    inputs:
      now: "2026-11-09T08:30:00-05:00"
      recruiter: {id: rec_tomas, name: Tomás Herrera, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Keisha Wallace, email: keisha.wallace@example.net, time_zone: America/New_York}
      interview_plan:
        name: Account Coordinator - recruiter phone screen
        region: US
        sessions:
          - {id: S1, title: Recruiter phone screen, format: phone, duration_min: 30, interviewers: [int_rahul]}
      interviewers:
        - id: int_rahul
          name: Rahul Mehta
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-10T11:00:00-05:00", end: "2026-11-10T12:00:00-05:00", status: busy}
            - {start: "2026-11-17T10:00:00-05:00", end: "2026-11-17T10:30:00-05:00", status: busy}
      policies:
        relative_dates: >-
          If "next <weekday>" could refer to either of two dates given the message's send time, ask before
          proposing. Resolve relative dates from the speaker's send time and zone, never from when the agent reads them.
      conversation:
        - role: candidate
          at: "2026-11-08T19:42:00-05:00"
          channel: email
          text: |-
            Hi Tomás,

            Thanks so much for reaching out! Next Tuesday works best for me - anytime between 10 and 2.

            Best,
            Keisha
        - role: recruiter
          at: "2026-11-09T08:30:00-05:00"
          channel: chat
          text: Keisha replied last night (forwarded above). Can you set up her phone screen with Rahul for next Tuesday?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Keisha wrote "next Tuesday" on Sunday, November 8, 2026 at 7:42 p.m. ET, so it may mean Tuesday, November 10
        or Tuesday, November 17. Ask which date she means; keep her 10:00 a.m.-2:00 p.m. ET window attached to the
        answer. The agent may preview that Rahul fits on either date, but must not propose one as settled.
      must:
        - Name both concrete candidate dates, Tuesday, November 10, 2026 and Tuesday, November 17, 2026.
        - Explain that the ambiguity comes from the candidate's Sunday send time, not from the recruiter's Monday message.
        - Ask a single focused question (which Tuesday) that the recruiter can relay to the candidate.
        - Keep the stated 10:00 a.m.-2:00 p.m. ET window and 30-minute duration as known facts.
      must_not:
        - Book, hold, or send anything.
        - Silently choose November 10 or November 17.
        - Re-ask for the time window, time zone, or duration, which are already known.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which_tuesday_nov_10_or_nov_17]
    local_time_checks:
      - {instant: "2026-11-09T00:42:00Z", time_zone: America/New_York, expected_local: "2026-11-08T19:42", expected_weekday: Sunday, expected_utc_offset: "-05:00"}
    grading_notes: Proposing concrete slots on only one of the two Tuesdays without asking is a failure.

  - id: NLP-002
    title: '"Next Tuesday" written on a Monday resolved by org policy to the following calendar week'
    category: availability_interpretation
    subcategory: relative_weekday_policy_resolution
    description: >-
      The candidate wrote "next Tuesday" on Monday, November 9. The org policy defines "next <weekday>" as that
      weekday in the following Monday-Sunday week, so it is Tuesday, November 17, not tomorrow. The interviewer is
      wide open tomorrow (tempting) but partly busy on the 17th. Tests applying a configured interpretation,
      stating it, and converting Central to Pacific.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [relative_date, next_weekday, org_policy, cross_timezone, stated_assumption]
    requirement_refs: [INT-03, AVL-10, SCH-01]
    inputs:
      now: "2026-11-09T10:00:00-08:00"
      recruiter: {id: rec_hannah, name: Hannah Lee, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Oluwaseun Adeyemi, time_zone: America/Chicago}
      interview_plan:
        name: Senior Data Analyst - technical interview
        sessions:
          - {id: S1, title: SQL and analytics interview, format: virtual, duration_min: 45, interviewers: [int_lucia]}
      interviewers:
        - id: int_lucia
          name: Lucía Ferreira
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T11:00:00-08:00", end: "2026-11-17T12:30:00-08:00", status: busy}
      policies:
        relative_dates:
          next_weekday: >-
            "Next <weekday>" means that weekday in the following Monday-Sunday calendar week. State the resolved
            date everywhere it is used and in any candidate-facing text.
      conversation:
        - role: candidate
          at: "2026-11-09T07:15:00-06:00"
          channel: email
          text: |-
            Hello Hannah,
            Next Tuesday I'm free from 1 to 4 pm. Looking forward to it!
            - Seun
        - role: recruiter
          at: "2026-11-09T10:00:00-08:00"
          channel: chat
          text: Seun can do next Tuesday afternoon. Please find a slot with Lucía.
    expected:
      disposition: propose_options
      solution_summary: >-
        Under the policy, "next Tuesday" sent Monday, November 9 is Tuesday, November 17, 2026. The window 1:00-4:00
        p.m. CST is 11:00 a.m.-2:00 p.m. PST; Lucía is busy until 12:30 p.m. PST, so the 45-minute interview can start
        from 2:30 to 3:15 p.m. CST (12:30-1:15 p.m. PST).
      must:
        - Resolve "next Tuesday" to Tuesday, November 17, 2026 and say so explicitly, citing the org policy.
        - Propose only starts from 2:30 to 3:15 p.m. CST (12:30-1:15 p.m. PST) on November 17.
        - Show each option in both Central and Pacific time.
        - Ask whether to book the chosen option.
      must_not:
        - Propose anything on Tuesday, November 10, even though Lucía is free all day.
        - Propose starts before 12:30 p.m. PST on November 17, which overlap Lucía's meeting.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T20:30:00Z", time_zone: America/Chicago, expected_local: "2026-11-17T14:30", expected_weekday: Tuesday, expected_utc_offset: "-06:00"}
      - {instant: "2026-11-17T20:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T12:30", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00-06:00", end: "2026-11-18T00:00:00-06:00"}
      participants:
        candidate:
          time_zone: America/Chicago
          available: [["2026-11-17T13:00:00-06:00", "2026-11-17T16:00:00-06:00"]]
        int_lucia:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-17T11:00:00-08:00", "2026-11-17T12:30:00-08:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_lucia]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-17T14:30:00-06:00"}
      invalid_examples:
        - {S1: "2026-11-10T13:00:00-06:00", note: 'Reads "next Tuesday" as tomorrow, contrary to policy.'}
        - {S1: "2026-11-17T14:00:00-06:00", note: 12:00 p.m. PST overlaps Lucía's meeting.}
      valid_start_bounds:
        S1: {earliest: "2026-11-17T14:30:00-06:00", latest: "2026-11-17T15:15:00-06:00"}

  - id: NLP-003
    title: '"This Friday after 1, done by 4" from an Arizona candidate'
    category: availability_interpretation
    subcategory: this_weekday
    description: >-
      Sent on Wednesday, November 4, "this Friday" is Friday, November 6. The candidate is in Arizona (no DST, one
      hour ahead of Pacific in November) and must be finished by 4:00 p.m. local. Only one hour of interviewer time
      overlaps. Basic relative-date resolution plus a must-end-by bound.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [relative_date, this_weekday, end_by, arizona_no_dst]
    requirement_refs: [INT-03, SCH-01, EC-009]
    inputs:
      now: "2026-11-04T15:00:00-08:00"
      recruiter: {id: rec_aaliyah, name: Aaliyah Johnson, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Bao Nguyen, time_zone: America/Phoenix}
      interview_plan:
        name: Support Engineer - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_grace]}
      interviewers:
        - id: int_grace
          name: Grace Mwangi
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-06T12:00:00-08:00", end: "2026-11-06T13:30:00-08:00", status: busy}
            - {start: "2026-11-06T14:30:00-08:00", end: "2026-11-06T15:00:00-08:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-04T13:05:00-07:00"
          channel: email
          text: Hi Aaliyah - this Friday after 1 pm works for me. I need to be done by 4. Thanks! Bao
        - role: recruiter
          at: "2026-11-04T15:00:00-08:00"
          channel: chat
          text: Bao's free this Friday afternoon. Can you find a time with Grace?
    expected:
      disposition: propose_options
      solution_summary: >-
        "This Friday" is Friday, November 6, 2026. 1:00-4:00 p.m. MST (Arizona) is 12:00-3:00 p.m. PST. Grace is
        free 1:30-2:30 p.m. PST, so the 30-minute screen can start from 1:30 to 2:00 p.m. PST (2:30-3:00 p.m. MST).
      must:
        - Resolve "this Friday" to Friday, November 6, 2026.
        - Propose only starts from 2:30 to 3:00 p.m. Arizona time (1:30-2:00 p.m. PST).
        - Note Arizona does not observe DST, so it is one hour ahead of Pacific on that date.
        - Ask whether to book.
      must_not:
        - Propose Friday, November 13.
        - Propose any slot that ends after 4:00 p.m. Arizona time or overlaps Grace's busy blocks.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-06T21:30:00Z", time_zone: America/Phoenix, expected_local: "2026-11-06T14:30", expected_weekday: Friday, expected_utc_offset: "-07:00"}
      - {instant: "2026-11-06T21:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-06T13:30", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-06T00:00:00-07:00", end: "2026-11-14T00:00:00-07:00"}
      participants:
        candidate:
          time_zone: America/Phoenix
          available: [["2026-11-06T13:00:00-07:00", "2026-11-06T16:00:00-07:00"]]
        int_grace:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-06T12:00:00-08:00", "2026-11-06T13:30:00-08:00"], ["2026-11-06T14:30:00-08:00", "2026-11-06T15:00:00-08:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_grace]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-06T14:30:00-07:00"}
      invalid_examples:
        - {S1: "2026-11-13T14:30:00-07:00", note: Next week's Friday.}
        - {S1: "2026-11-06T13:00:00-07:00", note: 12:00 p.m. PST is inside Grace's busy block.}
      valid_start_bounds:
        S1: {earliest: "2026-11-06T14:30:00-07:00", latest: "2026-11-06T15:00:00-07:00"}

  - id: NLP-004
    title: '"Towards the end of next week, after 2pm UK time" from a London candidate'
    category: availability_interpretation
    subcategory: vague_week_segment
    description: >-
      "Towards the end of next week" sent on Wednesday, November 4 is best read as Thursday, November 12 and Friday, November 13,
      with a hard finish-by-6 bound. The New York interviewer is free all Wednesday (tempting) and out on Thursday,
      so only Friday fits. Tests a stated, reasonable interpretation of a vague span plus UK-to-Eastern conversion.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [vague_relative_date, end_of_week, stated_assumption, cross_timezone, end_by]
    requirement_refs: [INT-03, AVL-10, SCH-01]
    inputs:
      now: "2026-11-04T11:00:00-05:00"
      recruiter: {id: rec_rebecca, name: Rebecca Stein, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Harriet Cole, time_zone: Europe/London}
      interview_plan:
        name: Marketing Manager - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_marcus]}
      interviewers:
        - id: int_marcus
          name: Marcus Webb
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-12T09:00:00-05:00", end: "2026-11-12T17:00:00-05:00", status: oof}
            - {start: "2026-11-13T09:00:00-05:00", end: "2026-11-13T10:30:00-05:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-04T15:20:00+00:00"
          channel: email
          text: |-
            Hi Rebecca,
            Thanks for the update. Towards the end of next week would suit me best - any time after 2pm UK time; I need to finish by 6.
            Kind regards,
            Harriet
        - role: recruiter
          at: "2026-11-04T11:00:00-05:00"
          channel: chat
          text: Harriet wants end of next week. Please find time with Marcus.
    expected:
      disposition: propose_options
      solution_summary: >-
        Read "towards the end of next week" as Thursday, November 12 and Friday, November 13, 2026, 2:00-6:00 p.m. GMT (9:00 a.m.-1:00
        p.m. EST), and say so. Marcus is out Thursday and busy until 10:30 a.m. EST Friday, so the hour can start from
        3:30 to 5:00 p.m. GMT (10:30 a.m.-12:00 p.m. EST) on Friday, November 13.
      must:
        - State the interpretation (Thursday, November 12 and Friday, November 13) and invite correction if the candidate meant otherwise.
        - Propose only Friday, November 13 starts from 3:30 to 5:00 p.m. GMT (10:30 a.m.-12:00 p.m. EST).
        - Keep every option ending by 6:00 p.m. UK time.
        - Ask whether to book.
      must_not:
        - Propose Wednesday, November 11, which is not the end of the week, even though Marcus is free.
        - Propose a start after 5:00 p.m. GMT, which would run past 6:00 p.m.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-13T15:30:00Z", time_zone: Europe/London, expected_local: "2026-11-13T15:30", expected_weekday: Friday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-13T15:30:00Z", time_zone: America/New_York, expected_local: "2026-11-13T10:30", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-11T00:00:00Z", end: "2026-11-14T00:00:00Z"}
      participants:
        candidate:
          time_zone: Europe/London
          available: [["2026-11-12T14:00:00+00:00", "2026-11-12T18:00:00+00:00"], ["2026-11-13T14:00:00+00:00", "2026-11-13T18:00:00+00:00"]]
        int_marcus:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-12T09:00:00-05:00", "2026-11-12T17:00:00-05:00"], ["2026-11-13T09:00:00-05:00", "2026-11-13T10:30:00-05:00"]]
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_marcus]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-13T15:30:00+00:00"}
      invalid_examples:
        - {HM: "2026-11-11T15:00:00+00:00", note: Wednesday is not the end of the week.}
        - {HM: "2026-11-13T17:30:00+00:00", note: Runs past the 6 p.m. finish.}
      valid_start_bounds:
        HM: {earliest: "2026-11-13T15:30:00+00:00", latest: "2026-11-13T17:00:00+00:00"}

  - id: NLP-005
    title: '"Any morning except Wednesday" mapped through the org part-of-day definitions'
    category: availability_interpretation
    subcategory: part_of_day_with_exclusion
    description: >-
      A Warsaw candidate offers "any morning next week except Wednesday". The org defines morning as 09:00-12:00 in
      the candidate's local time. The London interviewer is free all Wednesday (excluded) and has only one fitting
      morning hour elsewhere. Tests weekday exclusion, configured part-of-day mapping, and CET-to-GMT conversion.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [part_of_day, weekday_exclusion, org_definitions, cross_timezone]
    requirement_refs: [INT-03, SCH-01, AVL-10]
    inputs:
      now: "2026-11-05T10:00:00+01:00"
      recruiter: {id: rec_agnieszka, name: Agnieszka Wróbel, time_zone: Europe/Warsaw}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Tomasz Kowalski, time_zone: Europe/Warsaw}
      interview_plan:
        name: Backend Engineer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_hugh]}
      interviewers:
        - id: int_hugh
          name: Hugh Thornton
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar:
            - {start: "2026-11-09T09:00:00+00:00", end: "2026-11-09T11:00:00+00:00", status: busy}
            - {start: "2026-11-10T09:30:00+00:00", end: "2026-11-10T10:30:00+00:00", status: busy}
            - {start: "2026-11-12T10:00:00+00:00", end: "2026-11-12T11:00:00+00:00", status: busy}
            - {start: "2026-11-13T09:00:00+00:00", end: "2026-11-13T17:30:00+00:00", status: oof}
      policies:
        part_of_day_defaults:
          basis: candidate local time unless the candidate defines the term differently
          morning: "09:00-12:00"
          afternoon: "12:00-17:00"
          evening: "17:00-20:00"
      conversation:
        - role: candidate
          at: "2026-11-05T09:10:00+01:00"
          channel: email
          text: Hi Agnieszka, next week any morning except Wednesday is good for me. Best, Tomasz
        - role: recruiter
          at: "2026-11-05T10:00:00+01:00"
          channel: chat
          text: Please schedule Tomasz with Hugh next week.
    expected:
      disposition: propose_options
      solution_summary: >-
        Mornings on Monday, Tuesday, Thursday and Friday of the week of November 9 (not Wednesday), 09:00-12:00 CET = 08:00-11:00
        GMT; Hugh starts at 09:00 GMT. The only fitting hour is Thursday, November 12, 10:00-11:00 CET (09:00-10:00 GMT).
      must:
        - Propose exactly Thursday, November 12, 2026, 10:00-11:00 CET (09:00-10:00 GMT).
        - Explain that Monday and Tuesday mornings conflict with Hugh, Friday he is out of office, and Wednesday was excluded by the candidate.
        - Show both CET and GMT.
        - Ask whether to book.
      must_not:
        - Propose any time on Wednesday, November 11.
        - Propose afternoon times, which the candidate did not offer.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-12T09:00:00Z", time_zone: Europe/Warsaw, expected_local: "2026-11-12T10:00", expected_weekday: Thursday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-12T09:00:00Z", time_zone: Europe/London, expected_local: "2026-11-12T09:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-09T00:00:00+01:00", end: "2026-11-14T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/Warsaw
          available:
            - ["2026-11-09T09:00:00+01:00", "2026-11-09T12:00:00+01:00"]
            - ["2026-11-10T09:00:00+01:00", "2026-11-10T12:00:00+01:00"]
            - ["2026-11-12T09:00:00+01:00", "2026-11-12T12:00:00+01:00"]
            - ["2026-11-13T09:00:00+01:00", "2026-11-13T12:00:00+01:00"]
        int_hugh:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          busy:
            - ["2026-11-09T09:00:00+00:00", "2026-11-09T11:00:00+00:00"]
            - ["2026-11-10T09:30:00+00:00", "2026-11-10T10:30:00+00:00"]
            - ["2026-11-12T10:00:00+00:00", "2026-11-12T11:00:00+00:00"]
            - ["2026-11-13T09:00:00+00:00", "2026-11-13T17:30:00+00:00"]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_hugh]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-12T10:00:00+01:00"}
      invalid_examples:
        - {S1: "2026-11-11T10:00:00+01:00", note: Wednesday was excluded by the candidate.}
