        Tuesday, November 10, 2026, 2:00-6:00 p.m. JST (must end by 18:00) = 4:00-8:00 p.m. AEDT. Chloe works until 5:30
        p.m. AEDT, so the hour can start from 2:00 to 2:30 p.m. JST (4:00-4:30 p.m. AEDT).
      must:
        - Parse 11月10日（火） as Tuesday, November 10, 2026 and 午後2時以降 as from 2:00 p.m. JST.
        - Propose only starts from 2:00 to 2:30 p.m. JST (4:00-4:30 p.m. AEDT).
        - Present times to the Japanese-speaking recruiter clearly in JST and AEDT.
        - Ask whether to book.
      must_not:
        - Read 午後2時 as 2:00 a.m.
        - Treat 2:00 p.m. as Sydney time.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-10T05:00:00Z", time_zone: Asia/Tokyo, expected_local: "2026-11-10T14:00", expected_weekday: Tuesday, expected_utc_offset: "+09:00"}
      - {instant: "2026-11-10T05:00:00Z", time_zone: Australia/Sydney, expected_local: "2026-11-10T16:00", expected_utc_offset: "+11:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00+09:00", end: "2026-11-11T00:00:00+09:00"}
      participants:
        candidate:
          time_zone: Asia/Tokyo
          available: [["2026-11-10T14:00:00+09:00", "2026-11-10T18:00:00+09:00"]]
        int_chloe:
          time_zone: Australia/Sydney
          working_hours: {time_zone: Australia/Sydney, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_chloe]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-10T14:00:00+09:00"}
      invalid_examples:
        - {S1: "2026-11-10T02:00:00+09:00", note: a.m. misreading.}
        - {S1: "2026-11-10T12:00:00+09:00", note: '2 p.m. read as Sydney time; before the candidate is free.'}
      valid_start_bounds:
        S1: {earliest: "2026-11-10T14:00:00+09:00", latest: "2026-11-10T14:30:00+09:00"}

  - id: NLP-023
    title: Chinese "下周二下午三点以后" sent on a Monday means Tuesday of next week, not tomorrow
    category: availability_interpretation
    subcategory: chinese_language
    description: >-
      Sent Monday, November 9 in Shanghai, 下周二 (Tuesday of next week) is November 17; tomorrow would be 明天 or 这周二.
      下午三点以后 is after 3 p.m., and 六点前结束 means finish before 6. The Berlin interviewer is seven hours behind and
      free all of Tuesday the 10th (tempting). Tests Chinese week-relative expressions and China/Berlin conversion.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [chinese, non_english, relative_week, end_by, shanghai, berlin]
    requirement_refs: [INT-03, AVL-10]
    inputs:
      now: "2026-11-09T10:00:00+08:00"
      recruiter: {id: rec_chenjing, name: Chen Jing, time_zone: Asia/Shanghai}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Liu Yang, time_zone: Asia/Shanghai}
      interview_plan:
        name: Embedded Software Engineer - technical round
        sessions:
          - {id: S1, title: Technical round, format: virtual, duration_min: 45, interviewers: [int_jonas]}
      interviewers:
        - id: int_jonas
          name: Jonas Weber
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T10:00:00+01:00", end: "2026-11-17T10:30:00+01:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-09T09:20:00+08:00"
          channel: email
          text: |-
            陈老师您好，
            下周二下午三点以后我都可以，六点前结束就行。
            谢谢！
            刘洋
        - role: recruiter
          at: "2026-11-09T10:00:00+08:00"
          channel: chat
          text: Liu Yang's availability is below. Please schedule the technical round with Jonas.
    expected:
      disposition: propose_options
      solution_summary: >-
        下周二 sent Monday, November 9 is Tuesday, November 17, 2026. 3:00-6:00 p.m. China Standard Time (UTC+8) =
        8:00-11:00 a.m. CET. Jonas starts at 9:00 and is busy 10:00-10:30 CET, so the round can start from 4:00 to 4:15
        p.m. China time (9:00-9:15 a.m. CET).
      must:
        - Resolve 下周二 to Tuesday, November 17, 2026.
        - Propose only starts from 4:00 to 4:15 p.m. China time (9:00-9:15 a.m. CET) on November 17.
        - Label China time unambiguously (e.g., UTC+8 or Beijing time), not the bare abbreviation "CST".
        - Ask whether to book.
      must_not:
        - Propose Tuesday, November 10.
        - Propose a slot ending after 6:00 p.m. China time.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T08:00:00Z", time_zone: Asia/Shanghai, expected_local: "2026-11-17T16:00", expected_weekday: Tuesday, expected_utc_offset: "+08:00"}
      - {instant: "2026-11-17T08:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-17T09:00", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00+08:00", end: "2026-11-18T00:00:00+08:00"}
      participants:
        candidate:
          time_zone: Asia/Shanghai
          available: [["2026-11-17T15:00:00+08:00", "2026-11-17T18:00:00+08:00"]]
        int_jonas:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-17T10:00:00+01:00", "2026-11-17T10:30:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_jonas]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-17T16:00:00+08:00"}
      invalid_examples:
        - {S1: "2026-11-10T16:00:00+08:00", note: 'This week''s Tuesday, not 下周二.'}
        - {S1: "2026-11-17T17:30:00+08:00", note: Ends after 6 p.m. and overlaps Jonas's meeting.}
      valid_start_bounds:
        S1: {earliest: "2026-11-17T16:00:00+08:00", latest: "2026-11-17T16:15:00+08:00"}

  - id: NLP-024
    title: Spanish "el martes 10 de noviembre por la mañana ... el jueves 12 a partir de las 16h"
    category: availability_interpretation
    subcategory: spanish_language
    description: >-
      A Bogotá candidate writes in Spanish: Tuesday 10 November 8:30-12:00, or Thursday 12 from 16h to 18h; Wednesday
      impossible. The Mexico City interviewer is one hour behind Bogotá. Tuesday conflicts, Wednesday is excluded
      (and free), so only Thursday fits. Tests Spanish day-month order, 24-hour "16h", and an explicit exclusion.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [spanish, non_english, day_month_order, exclusion, bogota, mexico_city]
    requirement_refs: [INT-03, AVL-10]
    inputs:
      now: "2026-11-05T12:00:00-06:00"
      recruiter: {id: rec_carlos, name: Carlos Medina, time_zone: America/Mexico_City}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Valentina Gómez, time_zone: America/Bogota}
      interview_plan:
        name: UX Researcher - interview
        sessions:
          - {id: S1, title: Research methods interview, format: virtual, duration_min: 60, interviewers: [int_andres]}
      interviewers:
        - id: int_andres
          name: Andrés Villalobos
          time_zone: America/Mexico_City
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-10T09:00:00-06:00", end: "2026-11-10T11:00:00-06:00", status: busy}
            - {start: "2026-11-12T15:00:00-06:00", end: "2026-11-12T15:30:00-06:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-05T11:40:00-05:00"
          channel: email
          text: |-
            Hola Carlos:
            Puedo el martes 10 de noviembre por la mañana, de 8:30 a 12:00, o el jueves 12 a partir de las 16h hasta las 18h. El miércoles me es imposible.
            Saludos,
            Valentina
        - role: recruiter
          at: "2026-11-05T12:00:00-06:00"
          channel: chat
          text: Valentina sent her availability in Spanish. Please find an hour with Andrés.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 10, 8:30-12:00 Bogotá time is 7:30-11:00 Mexico City time, fully blocked for Andrés (starts at
        9:00, busy 9:00-11:00). Thursday, November 12, 16:00-18:00 Bogotá = 15:00-17:00 Mexico City; Andrés is busy until
        15:30, so the hour can start from 4:30 to 5:00 p.m. Bogotá time (3:30-4:00 p.m. Mexico City time).
      must:
        - Parse "martes 10 de noviembre" as Tuesday, November 10 and "jueves 12" as Thursday, November 12, 2026.
        - Propose only Thursday starts from 4:30 to 5:00 p.m. Bogotá time (3:30-4:00 p.m. Mexico City time).
        - Explain briefly why Tuesday morning does not fit.
        - Ask whether to book.
      must_not:
        - Propose anything on Wednesday, November 11 ("el miércoles me es imposible").
        - Treat 16h-18h as Mexico City time.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-12T21:30:00Z", time_zone: America/Bogota, expected_local: "2026-11-12T16:30", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2026-11-12T21:30:00Z", time_zone: America/Mexico_City, expected_local: "2026-11-12T15:30", expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00-05:00", end: "2026-11-13T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/Bogota
          available: [["2026-11-10T08:30:00-05:00", "2026-11-10T12:00:00-05:00"], ["2026-11-12T16:00:00-05:00", "2026-11-12T18:00:00-05:00"]]
        int_andres:
          time_zone: America/Mexico_City
          working_hours: {time_zone: America/Mexico_City, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          busy: [["2026-11-10T09:00:00-06:00", "2026-11-10T11:00:00-06:00"], ["2026-11-12T15:00:00-06:00", "2026-11-12T15:30:00-06:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_andres]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-12T16:30:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-11T11:00:00-05:00", note: Wednesday is excluded.}
        - {S1: "2026-11-12T16:30:00-06:00", note: '16h-18h read as Mexico City time; ends 6:30 p.m. Bogotá.'}
      valid_start_bounds:
        S1: {earliest: "2026-11-12T16:30:00-05:00", latest: "2026-11-12T17:00:00-05:00"}

  - id: NLP-025
    title: German "Di., 10.11. ab 14 Uhr bis 17 Uhr" - day-first date and 24-hour Berlin time
    category: availability_interpretation
    subcategory: german_language
    description: >-
      A Berlin candidate writes "Di., 10.11. ab 14 Uhr bis 17 Uhr" (Tuesday, November 10, 2:00-5:00 p.m. CET) and
      "Mi., 11.11. leider nicht". The New York recruiter might read 10.11 month-first or 14 Uhr as Eastern time. The
      interviewer in New York is busy until 9:45 a.m. EST. Tests German abbreviations, DD.MM. and 24-hour times.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [german, non_english, day_first_date, twenty_four_hour, berlin, new_york]
    requirement_refs: [INT-03, AVL-10, EC-003]
    inputs:
      now: "2026-11-05T09:00:00-05:00"
      recruiter: {id: rec_ashley, name: Ashley Brooks, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Lena Hoffmann, time_zone: Europe/Berlin}
      interview_plan:
        name: Group Controller - interview
        sessions:
          - {id: S1, title: Finance interview, format: virtual, duration_min: 60, interviewers: [int_michael]}
      interviewers:
        - id: int_michael
          name: Michael Torres
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-10T09:00:00-05:00", end: "2026-11-10T09:45:00-05:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-05T14:10:00+01:00"
          channel: email
          text: |-
            Sehr geehrte Frau Brooks,
            Di., 10.11. ab 14 Uhr bis 17 Uhr passt mir gut. Mi., 11.11. leider nicht.
            Mit freundlichen Grüßen
            Lena Hoffmann
        - role: recruiter
          at: "2026-11-05T09:00:00-05:00"
          channel: chat
          text: Lena replied in German - looks like 10/11 from 2pm? Please set up an hour with Michael.
    expected:
