        hour can start from 9:45 to 10:00 a.m. EST (15:45-16:00 CET).
      must:
        - Parse "Di., 10.11." as Tuesday, November 10 (day-first) and "14 Uhr" as 2:00 p.m. Berlin time.
        - Propose only starts from 9:45 to 10:00 a.m. EST (15:45-16:00 CET) on November 10.
        - Correct the recruiter's "from 2pm" by giving the Eastern equivalent.
        - Ask whether to book.
      must_not:
        - Read 10.11 as October 11.
        - Propose 2:00 p.m. EST (20:00 CET).
        - Propose Wednesday, November 11.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-10T14:45:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-10T15:45", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-10T14:45:00Z", time_zone: America/New_York, expected_local: "2026-11-10T09:45", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00+01:00", end: "2026-11-12T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/Berlin
          available: [["2026-11-10T14:00:00+01:00", "2026-11-10T17:00:00+01:00"]]
        int_michael:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-10T09:00:00-05:00", "2026-11-10T09:45:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_michael]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-10T15:45:00+01:00"}
      invalid_examples:
        - {S1: "2026-11-10T14:00:00-05:00", note: 14 Uhr read as Eastern time.}
        - {S1: "2026-11-11T15:00:00+01:00", note: Wednesday excluded.}
      valid_start_bounds:
        S1: {earliest: "2026-11-10T15:45:00+01:00", latest: "2026-11-10T16:00:00+01:00"}
