  - id: NLP-008
    title: '"Noon-ish" under a configured approximation tolerance, with an off-grid 12:10 boundary'
    category: availability_interpretation
    subcategory: approximate_time
    description: >-
      The candidate offers "noon-ish my time" on Tuesday. Org policy defines approximate times as a start within
      15 minutes either side. The Berlin interviewer (same UTC+1 offset as Lagos in November) is busy until 12:10,
      so only 12:10-12:15 starts fit. Tests fuzzy-time policy and exact, non-quarter-hour boundaries.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [approximate_time, fuzzy_tolerance_policy, exact_boundary, lagos, berlin]
    requirement_refs: [INT-03, SCH-01, EC-024]
    inputs:
      now: "2026-11-05T10:00:00+01:00"
      recruiter: {id: rec_chioma, name: Chioma Nwosu, time_zone: Africa/Lagos}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Amara Okonkwo, time_zone: Africa/Lagos}
      interview_plan:
        name: Finance Associate - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_jan]}
      interviewers:
        - id: int_jan
          name: Jan Richter
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-10T11:30:00+01:00", end: "2026-11-10T12:10:00+01:00", status: busy}
      policies:
        approximate_times: >-
          Treat "X-ish", "around X" or "about X" as a start within 15 minutes either side of X in the speaker's zone,
          and flag the approximation to the recruiter. Starts need not align to quarter hours.
      conversation:
        - role: candidate
          at: "2026-11-05T09:30:00+01:00"
          channel: email
          text: Hello Chioma, Tuesday I could do noon-ish my time. Thanks, Amara
        - role: recruiter
          at: "2026-11-05T10:00:00+01:00"
          channel: chat
          text: Amara's free around noon Tuesday. Can you line her up with Jan?
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 10, 2026: "noon-ish" allows starts from 11:45 a.m. to 12:15 p.m. WAT. Jan is busy until 12:10
        p.m. CET (also UTC+1), so the screen can start from 12:10 to 12:15 p.m. WAT/CET.
      must:
        - Apply the 15-minute approximation policy and say the time was approximate.
        - Propose only starts from 12:10 to 12:15 p.m. WAT on Tuesday, November 10 (same clock time in Berlin).
        - Ask whether to book.
      must_not:
        - Propose 12:00 p.m., which overlaps Jan's meeting.
        - Propose starts after 12:15 p.m. or before 11:45 a.m. as if they matched "noon-ish".
        - Claim that no time fits because a quarter-hour start is unavailable.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-10T11:10:00Z", time_zone: Africa/Lagos, expected_local: "2026-11-10T12:10", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-10T11:10:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-10T12:10", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00+01:00", end: "2026-11-11T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Africa/Lagos
          available: [["2026-11-10T11:45:00+01:00", "2026-11-10T12:45:00+01:00"]]
        int_jan:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-10T11:30:00+01:00", "2026-11-10T12:10:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_jan]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-10T12:10:00+01:00"}
      invalid_examples:
        - {S1: "2026-11-10T12:00:00+01:00", note: Jan busy until 12:10.}
        - {S1: "2026-11-10T12:30:00+01:00", note: Outside the 15-minute tolerance.}
      valid_start_bounds:
        S1: {earliest: "2026-11-10T12:10:00+01:00", latest: "2026-11-10T12:15:00+01:00"}

