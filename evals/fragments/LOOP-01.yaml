        - {id: int_paula, name: Paula Jensen, role: Hiring manager, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-12-01T10:00:00-06:00", end: "2026-12-01T11:00:00-06:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Fwd from Karl below. Tariq is free Tue 12/1 10-3 CT. Please put the loop together."
        - role: interviewer
