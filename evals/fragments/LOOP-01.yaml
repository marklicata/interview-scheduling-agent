        int_dee: {time_zone: America/Los_Angeles, busy: [["2026-11-24T08:45:00-08:00", "2026-11-24T11:30:00-08:00"], ["2026-11-24T13:00:00-08:00", "2026-11-24T14:00:00-08:00"]]}
      sessions:
