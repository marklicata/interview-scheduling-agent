           calendar: [{start: "2026-12-15T08:00:00+01:00", end: "2026-12-15T18:00:00+01:00", status: oof}]}
        - {id: int_ines, name: Ines Moreau, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
        - {id: int_jules, name: Jules Petit, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
