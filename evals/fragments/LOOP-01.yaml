  - id: LOOP-013
    title: Mandatory 30-minute break after two hours of continuous interviewing leaves exactly one valid schedule
    category: multi_session_loops
    subcategory: mandatory_break_after_two_hours
    description: >-
      Four 60-minute sessions in fixed order with 0-15 minute gaps. A wellbeing policy requires a 30-60 minute break
      after two hours of continuous interviewing, i.e., between sessions 2 and 3. The candidate asked to "get it over
      with" back-to-back from 8:30 to 12:30. Combined with Kalani's morning block and Marek's 12:30 meeting, the only
      valid schedule starts at 8:00 a.m. The break is modeled as a candidate-only pseudo-session.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, technical_coding]
    tags: [four_person_loop, mandatory_break, candidate_wellbeing, fixed_order, unique_solution, phoenix]
    requirement_refs: [CON-04, CON-05, SCH-01, EC-149]
    inputs:
      now: "2026-11-19T09:00:00-07:00"
      recruiter: {id: rec_kai, name: Kai Nakamura, time_zone: America/Phoenix}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ellie Thompson
        time_zone: America/Phoenix
        availability:
          - {start: "2026-12-02T08:00:00-07:00", end: "2026-12-02T13:30:00-07:00"}
        preferences: ["Would rather do all four back to back 8:30-12:30 and get it over with"]
      interview_plan:
        name: Clinical Data Engineer - virtual loop
        region: US Mountain (Arizona)
        team: Proseware Health Data
        time_zone: America/Phoenix
        sessions:
          - {id: S1, title: Data modeling, format: virtual, duration_min: 60, interviewers: [int_ifeoma], order: 1}
          - {id: S2, title: Pipelines and SQL, format: virtual, duration_min: 60, interviewers: [int_jorge], order: 2}
          - {id: S3, title: Healthcare data compliance, format: virtual, duration_min: 60, interviewers: [int_kalani], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 60, interviewers: [int_marek], order: 4}
        rules:
          order: fixed
          same_day: true
          gap_between_sessions_min: 0
          max_gap_between_sessions_min: 15
          mandatory_break: After 120 minutes of interviewing without a break, the candidate gets a 30-60 minute break before the next session. Not waivable by preference.
      interviewers:
        - {id: int_ifeoma, name: Ifeoma Chukwu, time_zone: America/Phoenix, availability_source: calendar, calendar: []}
        - {id: int_jorge, name: Jorge Salazar, time_zone: America/Phoenix, availability_source: calendar, calendar: []}
        - {id: int_kalani, name: Kalani Akana, time_zone: America/Phoenix, availability_source: calendar,
           calendar: [{start: "2026-12-02T08:00:00-07:00", end: "2026-12-02T10:30:00-07:00", status: busy}]}
        - {id: int_marek, name: Marek Dvorak, role: Hiring manager, time_zone: America/Phoenix, availability_source: calendar,
           calendar: [{start: "2026-12-02T12:30:00-07:00", end: "2026-12-02T13:30:00-07:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Ellie wants to do all 4 back to back 8:30-12:30 on Wed Dec 2 and be done. Can you book that shape?"
    expected:
      disposition: propose_options
      solution_summary: >-
        The only valid schedule on Wednesday, December 2, 2026 (MST): S1 8:00-9:00, S2 9:00-10:00, break 10:00-10:30,
        S3 10:30-11:30, S4 11:30 a.m.-12:30 p.m. The requested 8:30-12:30 back-to-back shape skips the mandatory break.
      must:
        - Explain that the plan's mandatory break (30-60 minutes after two hours) cannot be waived by the candidate's preference.
        - Propose S1 at 8:00 a.m. MST with a 30-minute break between S2 and S3, and say this is the only schedule that satisfies all constraints.
        - Explain the drivers (Kalani busy until 10:30 a.m., Marek busy from 12:30 p.m., gaps capped at 15 minutes).
        - Ask whether to book the four sessions.
      must_not:
        - Propose or book the back-to-back 8:30 a.m.-12:30 p.m. schedule.
        - Book anything before confirmation (the recruiter asked to book a shape, not a reviewed schedule).
        - Drop the break or shorten a session.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-02T07:00:00-07:00", end: "2026-12-02T15:00:00-07:00"}
      participants:
        candidate: {time_zone: America/Phoenix, available: [["2026-12-02T08:00:00-07:00", "2026-12-02T13:30:00-07:00"]]}
        int_ifeoma: {time_zone: America/Phoenix}
        int_jorge: {time_zone: America/Phoenix}
        int_kalani: {time_zone: America/Phoenix, busy: [["2026-12-02T08:00:00-07:00", "2026-12-02T10:30:00-07:00"]]}
        int_marek: {time_zone: America/Phoenix, busy: [["2026-12-02T12:30:00-07:00", "2026-12-02T13:30:00-07:00"]]}
      sessions:
