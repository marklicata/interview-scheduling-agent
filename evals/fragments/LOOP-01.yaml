        - {id: S2, duration_min: 60, attendees: [candidate, int_jorge]}
        - {id: BRK, duration_min: 30, attendees: [candidate]}
        - {id: S3, duration_min: 60, attendees: [candidate, int_kalani]}
        - {id: S4, duration_min: 60, attendees: [candidate, int_marek]}
      constraints:
        order: [S1, S2, BRK, S3, S4]
        min_gap_min: 0
        max_gap_min: 15
        same_local_day: {time_zone: America/Phoenix}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-02T08:00:00-07:00", S2: "2026-12-02T09:00:00-07:00", BRK: "2026-12-02T10:00:00-07:00", S3: "2026-12-02T10:30:00-07:00", S4: "2026-12-02T11:30:00-07:00"}
      invalid_examples:
        - {S1: "2026-12-02T08:30:00-07:00", S2: "2026-12-02T09:30:00-07:00", S3: "2026-12-02T10:30:00-07:00", S4: "2026-12-02T11:30:00-07:00", BRK: "2026-12-02T12:30:00-07:00", note: Back-to-back request; no break between S2 and S3.}
      valid_start_bounds:
        S1: {earliest: "2026-12-02T08:00:00-07:00", latest: "2026-12-02T08:00:00-07:00"}
    grading_notes: BRK is a candidate-only pseudo-session; with 0-15 minute gaps around it, the S2-to-S3 break is 30-60 minutes.

