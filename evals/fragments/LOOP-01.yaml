  - id: LOOP-015
    title: Interviewer-side 15-minute feedback buffers change which sessions fit
    category: multi_session_loops
    subcategory: interviewer_feedback_buffer
    description: >-
      The team requires each interviewer to have 15 free minutes immediately after their session to submit feedback
      (the candidate does not wait for it). A session that ends exactly when the interviewer's next meeting starts is
      therefore invalid even though the raw calendar fits. Candidate breaks are 5-20 minutes.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop, technical_coding]
    tags: [four_person_loop, interviewer_buffer, feedback_time, exact_boundary, any_order]
    requirement_refs: [CON-04, SCH-01, SCH-03]
    inputs:
      now: "2026-11-13T09:00:00-08:00"
      recruiter: {id: rec_owen, name: Owen Fitzgerald, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Zainab Bello
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-24T09:00:00-08:00", end: "2026-11-24T14:00:00-08:00"}
      interview_plan:
        name: Gameplay Engineer - virtual loop
        region: US West
        team: Litware Games
        time_zone: America/Los_Angeles
        sessions:
          - {id: S1, title: Gameplay coding, format: virtual, duration_min: 45, interviewers: [int_ali]}
          - {id: S2, title: Engine systems, format: virtual, duration_min: 45, interviewers: [int_brooke]}
          - {id: S3, title: Math for games, format: virtual, duration_min: 45, interviewers: [int_cyrus]}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_dee]}
        rules:
          order: any
          same_day: true
          break_between_sessions_min: 5
          max_gap_between_sessions_min: 20
          interviewer_feedback_buffer_min: 15
          buffer_note: Each interviewer must be free for 15 minutes right after their own session; the buffer is not added to the candidate's day.
      interviewers:
        - {id: int_ali, name: Ali Rezaei, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-24T10:00:00-08:00", end: "2026-11-24T11:00:00-08:00", status: busy},
                      {start: "2026-11-24T12:00:00-08:00", end: "2026-11-24T14:00:00-08:00", status: busy}]}
        - {id: int_brooke, name: Brooke Sullivan, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-24T09:00:00-08:00", end: "2026-11-24T10:30:00-08:00", status: busy}]}
        - {id: int_cyrus, name: Cyrus Farahani, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-24T11:45:00-08:00", end: "2026-11-24T14:00:00-08:00", status: busy}]}
        - {id: int_dee, name: Dee Okonjo, role: Hiring manager, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-24T09:00:00-08:00", end: "2026-11-24T11:30:00-08:00", status: busy},
                      {start: "2026-11-24T13:15:00-08:00", end: "2026-11-24T14:00:00-08:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Zainab: Tue Nov 24, 9am-2pm PT. Remember the gameplay team wants 15 min after each interview for feedback."
    expected:
      disposition: propose_options
      solution_summary: >-
        Example: Ali 9:00-9:45 (free until 10:00 for feedback), Cyrus 9:50-10:35, Brooke 10:40-11:25, Dee 11:30 a.m.-12:15 p.m.
        PST on Tuesday, November 24, 2026, with 5-minute candidate breaks.
      must:
        - Leave each interviewer 15 free minutes after their session (e.g., Ali's session must end by 9:45 a.m. or by 11:45 a.m. PST).
        - Keep candidate breaks between 5 and 20 minutes; do not add the feedback buffer to the candidate's breaks.
        - Ask whether to book.
      must_not:
        - Schedule Ali 9:15-10:00, Cyrus 11:00-11:45, or Dee 12:30-1:15 p.m. PST, which end exactly at the interviewer's next meeting.
        - Book without confirmation.
