        - {id: S2, duration_min: 45, attendees: [candidate, int_brooke]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_cyrus]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_dee]}
      constraints:
        min_gap_min: 5
        max_gap_min: 20
        same_local_day: {time_zone: America/Los_Angeles}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-24T09:00:00-08:00", S3: "2026-11-24T09:50:00-08:00", S2: "2026-11-24T10:40:00-08:00", S4: "2026-11-24T11:30:00-08:00"}
      invalid_examples:
        - {S1: "2026-11-24T09:15:00-08:00", S3: "2026-11-24T10:05:00-08:00", S2: "2026-11-24T10:55:00-08:00", S4: "2026-11-24T11:45:00-08:00", note: Ali ends at 10:00 exactly when his meeting starts; no feedback buffer.}
    grading_notes: Oracle busy blocks start 15 minutes before each real meeting to encode the post-session feedback buffer.

