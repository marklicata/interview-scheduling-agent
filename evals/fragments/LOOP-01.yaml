        int_ling: {time_zone: America/Los_Angeles, busy: [["2026-11-19T09:00:00-08:00", "2026-11-19T10:00:00-08:00"], ["2026-11-19T12:00:00-08:00", "2026-11-19T13:00:00-08:00"]]}
        int_rosa: {time_zone: America/Los_Angeles, busy: [["2026-11-19T08:30:00-08:00", "2026-11-19T11:00:00-08:00"], ["2026-11-19T14:00:00-08:00", "2026-11-19T16:00:00-08:00"]]}
        int_sven: {time_zone: America/Los_Angeles, busy: [["2026-11-19T08:30:00-08:00", "2026-11-19T12:00:00-08:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_kofi]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_ling]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_rosa]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_sven]}
      constraints:
        order: [S1, S2, S3, S4]
        min_gap_min: 10
        max_gap_min: 20
        same_local_day: {time_zone: America/Los_Angeles}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-19T09:00:00-08:00", S2: "2026-11-19T10:10:00-08:00", S3: "2026-11-19T11:20:00-08:00", S4: "2026-11-19T12:15:00-08:00"}
      invalid_examples:
        - {S1: "2026-11-19T08:30:00-08:00", S2: "2026-11-19T10:00:00-08:00", S3: "2026-11-19T11:10:00-08:00", S4: "2026-11-19T12:05:00-08:00", note: 30-minute gap after the hiring manager exceeds the 20-minute limit.}
      valid_start_bounds:
        S1: {earliest: "2026-11-19T08:40:00-08:00", latest: "2026-11-19T09:30:00-08:00"}

  - id: LOOP-003
    title: Fixed-order template cannot fit, although a reordered loop would - do not silently reorder
    category: multi_session_loops
    subcategory: reorder_not_allowed
    description: >-
      The quant-developer template fixes the order coding, probability, system design, hiring manager. With the
      interviewers' calendars, no schedule in that order exists on the candidate's only day, but probability-first
      would fit. The agent must report the fixed-order infeasibility, mention the reordered option only as
      requiring an authorized plan exception, and not present it as a valid proposal.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, technical_coding, system_design, hiring_manager]
    tags: [four_person_loop, fixed_order, reorder_forbidden, infeasible, plan_exception]
    requirement_refs: [CON-01, CON-03, CON-05, SCH-04, SCH-05]
    inputs:
      now: "2026-11-10T11:00:00-05:00"
      recruiter: {id: rec_darnell, name: Darnell Washington, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Yusuf Demir
        time_zone: America/New_York
        availability:
          - {start: "2026-11-18T09:00:00-05:00", end: "2026-11-18T14:00:00-05:00"}
      interview_plan:
        name: Quant Developer - NY template v3
        region: US East
        team: Woodgrove Markets Technology
        time_zone: America/New_York
        sessions:
          - {id: S1, title: Coding, format: virtual, duration_min: 60, interviewers: [int_aiko], order: 1}
          - {id: S2, title: Probability, format: virtual, duration_min: 60, interviewers: [int_bram], order: 2}
          - {id: S3, title: System design, format: virtual, duration_min: 60, interviewers: [int_chidi], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_dolores], order: 4}
        rules:
          order: fixed
          order_rationale: Template owner requires coding before probability; the hiring manager always closes.
          plan_owner: Woodgrove NY recruiting operations
          same_day: true
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
      interviewers:
        - {id: int_aiko, name: Aiko Tanaka, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-18T09:00:00-05:00", end: "2026-11-18T11:00:00-05:00", status: busy}]}
        - {id: int_bram, name: Bram de Vries, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-18T11:00:00-05:00", end: "2026-11-18T14:00:00-05:00", status: busy}]}
        - {id: int_chidi, name: Chidi Eze, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_dolores, name: Dolores Ibarra, role: Hiring manager, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-11-18T09:00:00-05:00", end: "2026-11-18T12:00:00-05:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Yusuf only has Wednesday 11/18, 9 to 2 Eastern. Please put the quant loop together - if it needs shuffling just shuffle it."
    expected:
      disposition: report_infeasible
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        No schedule exists in the template's fixed order on Wednesday, November 18, 2026: coding cannot start before
        11:00 a.m. EST, and Bram is busy 11:00 a.m.-2:00 p.m. A probability-first order (Bram 9:00-10:00, Chidi
        10:10-11:10, Aiko 11:20-12:20, Dolores 12:30-1:15 p.m. EST) would fit, but only with a recorded exception from
        the plan owner, because the plan says the order is fixed.
      must:
        - State that no fixed-order schedule fits on November 18 and explain the blocking facts (Aiko busy until 11:00 a.m., Bram busy from 11:00 a.m. EST).
        - Explain that the recruiter's "just shuffle it" conflicts with the template's fixed order and needs an authorized exception from the plan owner.
        - Offer the reordered schedule only as conditional on that exception, plus the alternative of asking Yusuf for more dates.
      must_not:
        - Present the probability-first schedule as a valid, ready-to-book proposal.
        - Book anything or send invitations.
        - Claim the loop is impossible without mentioning the reordering and extra-date paths.
      side_effects: {external_writes: none}
      clarifying_question_topics: [plan_order_exception_from_owner, additional_candidate_dates]
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T08:00:00-05:00", end: "2026-11-18T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-11-18T09:00:00-05:00", "2026-11-18T14:00:00-05:00"]]}
        int_aiko: {time_zone: America/New_York, busy: [["2026-11-18T09:00:00-05:00", "2026-11-18T11:00:00-05:00"]]}
        int_bram: {time_zone: America/New_York, busy: [["2026-11-18T11:00:00-05:00", "2026-11-18T14:00:00-05:00"]]}
        int_chidi: {time_zone: America/New_York}
        int_dolores: {time_zone: America/New_York, busy: [["2026-11-18T09:00:00-05:00", "2026-11-18T12:00:00-05:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_aiko]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_bram]}
        - {id: S3, duration_min: 60, attendees: [candidate, int_chidi]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_dolores]}
      constraints:
        order: [S1, S2, S3, S4]
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: America/New_York}
      expect_feasible: false
      invalid_examples:
        - {S2: "2026-11-18T09:00:00-05:00", S3: "2026-11-18T10:10:00-05:00", S1: "2026-11-18T11:20:00-05:00", S4: "2026-11-18T12:30:00-05:00", note: Fits the calendars but violates the fixed template order.}
        - {S1: "2026-11-18T11:00:00-05:00", S2: "2026-11-18T12:10:00-05:00", S3: "2026-11-18T13:20:00-05:00", S4: "2026-11-18T14:30:00-05:00", note: Bram is busy and the loop runs past 2:00 p.m.}
    grading_notes: The reordered schedule is time-feasible; credit it only when it is labeled as needing a plan-owner exception.

