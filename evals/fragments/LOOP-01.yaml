      interviewers:
        - {id: int_karl, name: Karl Becker, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2026-12-01T10:00:00-06:00", end: "2026-12-01T15:00:00-06:00"}]}
        - {id: int_mei, name: Mei Tanaka, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-12-01T10:00:00-06:00", end: "2026-12-01T13:00:00-06:00", status: busy}]}
        - {id: int_nadim, name: Nadim Haddad, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-12-01T12:00:00-06:00", end: "2026-12-01T15:00:00-06:00", status: busy}]}
        - {id: int_olu, name: Olu Adebayo, time_zone: America/Chicago, availability_source: calendar,
