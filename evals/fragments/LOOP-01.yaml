# LOOP fragment 01: four-interview loop fundamentals (ordering, pools, distinctness, caps, shadows, breaks, envelope).
test_cases:
  - id: LOOP-001
    title: Four-interview virtual loop in any order with 10-30 minute breaks (Chicago)
    category: multi_session_loops
    subcategory: four_person_any_order
    description: >-
      Baseline four-person virtual loop. Each interviewer has one or two busy blocks, the plan allows any order,
      requires one local day, and bounds breaks to 10-30 minutes. Only a few interleavings work, so the agent must
      actually search orders rather than list the plan order, then stop at a proposal under confirm-each-action.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, hiring_manager]
    tags: [four_person_loop, any_order, break_bounds, same_day, propose_then_confirm]
    requirement_refs: [CON-01, CON-03, CON-04, SCH-01, SCH-02, ACT-01]
    inputs:
      now: "2026-11-05T10:00:00-06:00"
      recruiter: {id: rec_lucia, name: Lucia Ramirez, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Imani Brooks
        time_zone: America/Chicago
        availability:
          - {start: "2026-11-17T12:00:00-06:00", end: "2026-11-17T17:00:00-06:00"}
      interview_plan:
        name: Data Analyst II - virtual loop
        region: US Central
        team: Northwind Supply Chain Analytics
        time_zone: America/Chicago
        sessions:
          - {id: S1, title: SQL deep dive, format: virtual, duration_min: 45, interviewers: [int_ade]}
          - {id: S2, title: Statistics, format: virtual, duration_min: 45, interviewers: [int_bora]}
          - {id: S3, title: Stakeholder scenario, format: virtual, duration_min: 45, interviewers: [int_cara]}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_dev]}
        rules: {order: any, same_day: true, break_between_sessions_min: 10, max_gap_between_sessions_min: 30}
      interviewers:
        - {id: int_ade, name: Adebayo Okonkwo, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-17T12:00:00-06:00", end: "2026-11-17T13:00:00-06:00", status: busy},
                      {start: "2026-11-17T15:30:00-06:00", end: "2026-11-17T17:00:00-06:00", status: busy}]}
        - {id: int_bora, name: Bora Kim, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-17T13:00:00-06:00", end: "2026-11-17T14:30:00-06:00", status: busy}]}
        - {id: int_cara, name: Cara Lindgren, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-17T14:00:00-06:00", end: "2026-11-17T15:00:00-06:00", status: busy}]}
        - {id: int_dev, name: Devendra Rao, role: Hiring manager, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-17T12:00:00-06:00", end: "2026-11-17T14:00:00-06:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Imani can do Tuesday Nov 17 from noon to 5 Central. Can you build her four-interview loop?"
    expected:
      disposition: propose_options
      solution_summary: >-
        Example: Statistics (Bora) 12:00-12:45, SQL (Ade) 1:00-1:45, Hiring manager (Devendra) 2:00-2:45, Stakeholder
        scenario (Cara) 3:00-3:45 p.m. CST on Tuesday, November 17, 2026. Plan order is not required.
      must:
        - Propose complete four-session schedules on Tuesday, November 17 between 12:00 and 5:00 p.m. CST with every break between 10 and 30 minutes.
        - Place Devendra's hiring-manager session at or after 2:00 p.m. CST and Ade's SQL session within 1:00-3:30 p.m. CST.
        - Offer up to three genuinely different schedules if they exist and ask whether to book one.
      must_not:
        - Book, hold, or send invitations before explicit confirmation.
        - Present the plan's listed order (SQL first at noon) as valid; Ade is busy 12:00-1:00 p.m.
        - Schedule Cara from 2:00 to 3:00 p.m. CST, when she is busy.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T08:00:00-06:00", end: "2026-11-17T18:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2026-11-17T12:00:00-06:00", "2026-11-17T17:00:00-06:00"]]}
        int_ade: {time_zone: America/Chicago, busy: [["2026-11-17T12:00:00-06:00", "2026-11-17T13:00:00-06:00"], ["2026-11-17T15:30:00-06:00", "2026-11-17T17:00:00-06:00"]]}
        int_bora: {time_zone: America/Chicago, busy: [["2026-11-17T13:00:00-06:00", "2026-11-17T14:30:00-06:00"]]}
        int_cara: {time_zone: America/Chicago, busy: [["2026-11-17T14:00:00-06:00", "2026-11-17T15:00:00-06:00"]]}
        int_dev: {time_zone: America/Chicago, busy: [["2026-11-17T12:00:00-06:00", "2026-11-17T14:00:00-06:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_ade]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_bora]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_cara]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_dev]}
      constraints:
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: America/Chicago}
        distinct_interviewers: true
      expect_feasible: true
      valid_examples:
        - {S2: "2026-11-17T12:00:00-06:00", S1: "2026-11-17T13:00:00-06:00", S4: "2026-11-17T14:00:00-06:00", S3: "2026-11-17T15:00:00-06:00"}
      invalid_examples:
        - {S2: "2026-11-17T12:00:00-06:00", S4: "2026-11-17T13:00:00-06:00", S1: "2026-11-17T14:00:00-06:00", S3: "2026-11-17T15:00:00-06:00", note: Devendra is busy until 2:00 p.m.}
        - {S1: "2026-11-17T12:00:00-06:00", S2: "2026-11-17T12:55:00-06:00", S3: "2026-11-17T13:50:00-06:00", S4: "2026-11-17T14:45:00-06:00", note: Plan order from noon; Ade and Bora are busy.}

  - id: LOOP-002
    title: In-person four-interview loop with fixed order and hiring manager first
    category: multi_session_loops
    subcategory: four_person_fixed_order
    description: >-
      Onsite mechanical-engineering loop whose template fixes the order (hiring manager first, then technical deep
      dive, lab practical, peer). Breaks must be 10-20 minutes for walking between rooms in one building. The hiring
      manager is free only until 10:30, which bounds the whole chain; the agent should find the narrow start range.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [in_person_loop, hiring_manager, technical_coding]
    tags: [four_person_loop, fixed_order, hiring_manager_first, in_person, start_range]
    requirement_refs: [CON-01, CON-03, SCH-01, COM-02]
    inputs:
      now: "2026-11-09T09:00:00-08:00"
      recruiter: {id: rec_hannah, name: Hannah Kowalski, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mateo Fernandez
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-19T08:30:00-08:00", end: "2026-11-19T16:00:00-08:00"}
      interview_plan:
        name: Mechanical Engineer II - onsite loop
        region: US West
        team: Fabrikam Devices, Redmond Building 7
        time_zone: America/Los_Angeles
        sessions:
          - {id: S1, title: Hiring manager, format: in_person, duration_min: 60, interviewers: [int_kofi], order: 1}
          - {id: S2, title: Technical deep dive, format: in_person, duration_min: 60, interviewers: [int_ling], order: 2}
          - {id: S3, title: Lab practical, format: in_person, duration_min: 45, interviewers: [int_rosa], order: 3}
          - {id: S4, title: Peer interview, format: in_person, duration_min: 45, interviewers: [int_sven], order: 4}
        rules: {order: fixed, same_day: true, break_between_sessions_min: 10, max_gap_between_sessions_min: 20, venue: "Building 7, rooms 7-210 and lab 7-118"}
      interviewers:
        - {id: int_kofi, name: Kofi Asante, role: Hiring manager, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-19T10:30:00-08:00", end: "2026-11-19T12:00:00-08:00", status: busy},
                      {start: "2026-11-19T13:00:00-08:00", end: "2026-11-19T16:00:00-08:00", status: busy}]}
        - {id: int_ling, name: Ling Zhao, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-19T09:00:00-08:00", end: "2026-11-19T10:00:00-08:00", status: busy},
                      {start: "2026-11-19T12:00:00-08:00", end: "2026-11-19T13:00:00-08:00", status: busy}]}
        - {id: int_rosa, name: Rosa Delgado, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-19T08:30:00-08:00", end: "2026-11-19T11:00:00-08:00", status: busy},
                      {start: "2026-11-19T14:00:00-08:00", end: "2026-11-19T16:00:00-08:00", status: busy}]}
        - {id: int_sven, name: Sven Halvorsen, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-11-19T08:30:00-08:00", end: "2026-11-19T12:00:00-08:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Mateo is local and free Thursday the 19th from 8:30 to 4. Standard onsite order please, Kofi first."
    expected:
      disposition: propose_options
      solution_summary: >-
        Example: Kofi 9:00-10:00, Ling 10:10-11:10, Rosa 11:20-12:05, Sven 12:15-1:00 p.m. PST on Thursday, November 19,
        2026, Building 7. Kofi's session can start only from 8:40 to 9:30 a.m. PST.
      must:
        - Keep the order hiring manager, technical deep dive, lab practical, peer, with 10-20 minute breaks.
        - Start the hiring-manager session no earlier than 8:40 and no later than 9:30 a.m. PST.
        - Include the in-person venue details (Building 7 rooms) rather than Teams links.
        - Ask whether to book the chosen option.
      must_not:
        - Reorder the sessions to make more starts fit.
        - Start Kofi at 8:30 a.m.; Ling would then have to wait past the 20-minute break limit because she is busy 9:00-10:00.
        - Book or send invitations without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T08:00:00-08:00", end: "2026-11-19T17:00:00-08:00"}
