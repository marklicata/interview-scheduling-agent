  - id: LOOP-076
    title: Resume a loop case a week later - revalidate the plan's pool and calendars before re-proposing
    category: multi_session_loops
    subcategory: week_later_resume
    description: >-
      A week ago the agent proposed a loop for Astrid; nothing was booked. The recruiter returns and asks to pick it up.
      Since then the plan was revised (Oskar removed from the system-design pool) and an interviewer gained a conflict.
      The agent should resume without re-intake, flag what changed, revalidate, and propose an updated loop - noting that
      the candidate's availability is ten days old.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, system_design]
    tags: [four_person_loop, case_continuity, stale_proposal, pool_revision, revalidation, stockholm]
    requirement_refs: [UX-05, UX-06, CON-07, LRN-01, EC-114]
    inputs:
      now: "2027-01-11T09:00:00+01:00"
      recruiter: {id: rec_elin, name: Elin Johansson, time_zone: Europe/Stockholm}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Astrid Berg
        time_zone: Europe/Stockholm
        availability:
          - {start: "2027-01-21T09:00:00+01:00", end: "2027-01-21T15:00:00+01:00"}
        availability_provided_at: "2027-01-01T10:00:00+01:00"
      interview_plan:
        name: Backend Engineer - Nordics virtual loop (revision 2, updated 2027-01-08)
        team: Fabrikam Nordics Payments
        time_zone: Europe/Stockholm
        sessions:
          - {id: S1, title: Coding, format: virtual, duration_min: 45, interviewers: [int_anders], order: 1}
          - {id: S2, title: APIs, format: virtual, duration_min: 45, interviewers: [int_britt], order: 2}
          - {id: S3, title: System design, format: virtual, duration_min: 45, pool: {from: [int_sigrid, int_tove], count: 1}, order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_erik], order: 4}
        rules: {order: fixed, same_day: true, break_between_sessions_min: 10, max_gap_between_sessions_min: 30}
        revision_note: "2027-01-08: Oskar Lund removed from the system-design pool (no longer certified)."
      interviewers:
        - {id: int_anders, name: Anders Holm, time_zone: Europe/Stockholm, availability_source: calendar, calendar: []}
        - {id: int_britt, name: Britt Svensson, time_zone: Europe/Stockholm, availability_source: calendar,
           calendar: [{start: "2027-01-21T10:00:00+01:00", end: "2027-01-21T11:00:00+01:00", status: busy}]}
        - {id: int_oskar, name: Oskar Lund, time_zone: Europe/Stockholm, availability_source: calendar, calendar: []}
        - {id: int_sigrid, name: Sigrid Dahl, time_zone: Europe/Stockholm, availability_source: calendar,
           calendar: [{start: "2027-01-21T09:00:00+01:00", end: "2027-01-21T12:00:00+01:00", status: busy}]}
        - {id: int_tove, name: Tove Lindgren, time_zone: Europe/Stockholm, availability_source: calendar,
           calendar: [{start: "2027-01-21T12:30:00+01:00", end: "2027-01-21T15:00:00+01:00", status: busy}]}
        - {id: int_erik, name: Erik Lund, role: Hiring manager, time_zone: Europe/Stockholm, availability_source: calendar,
           calendar: [{start: "2027-01-21T09:00:00+01:00", end: "2027-01-21T10:00:00+01:00", status: busy}]}
      case_state:
        memory: {last_session: "2027-01-04", note: Proposal shown; recruiter said she would come back after checking with the hiring manager.}
        prior_proposals:
          - {id: option_1, proposed_at: "2027-01-04T15:00:00+01:00", times_cet: "S1 Anders 09:00-09:45, S2 Britt 10:00-10:45, S3 Oskar 11:00-11:45, S4 Erik 12:00-12:45", status: not booked}
      conversation:
        - role: recruiter
          text: "Back on Astrid's loop from last week - can we go with what you had?"
    expected:
      disposition: propose_options
      solution_summary: >-
        Option 1 is no longer valid: Britt now has a 10:00-11:00 a.m. conflict and Oskar left the system-design pool on
        January 8. Updated example (CET, Thursday, January 21, 2027): Anders 10:05-10:50, Britt 11:00-11:45, Sigrid
        12:00-12:45, Erik 12:55-1:40 p.m. Ask the recruiter to confirm Astrid's January 1 availability is still current.
      must:
        - Resume from the stored case (plan, candidate, prior option) without asking for intake again.
        - Explain the two changes that invalidate option 1 (Britt's new conflict; Oskar no longer in the pool under plan revision 2).
        - Propose an updated schedule using Sigrid or Tove for system design, and note the candidate availability dates from January 1.
        - Ask whether to book the updated option.
      must_not:
        - Book or re-present option 1 as still valid.
        - Assign Oskar to system design.
        - Book without confirmation.
      side_effects: {external_writes: none}
