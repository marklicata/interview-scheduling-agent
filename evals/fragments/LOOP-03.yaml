# LOOP fragment 03: further loop variants - lunch gaps, max-gap infeasibility, calendar statuses, repairs, geography, authority, robustness.
test_cases:
  - id: LOOP-051
    title: Only valid loops need a 90-120 minute lunch break although the candidate asked for short breaks
    category: multi_session_loops
    subcategory: long_lunch_gap_required
    description: >-
      Two interviewers are free only in the morning and two only after 1:30-2:00 p.m. The plan allows breaks of 0-30
      minutes plus one candidate lunch break of 60-120 minutes between sessions 2 and 3. The candidate asked for breaks
      no longer than 30 minutes, which is impossible; every valid schedule has a 90-120 minute lunch gap. The lunch break
      is modeled as a candidate-only pseudo-session.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop, case_interview, hiring_manager]
    tags: [four_person_loop, long_lunch_gap, candidate_preference_tradeoff, fixed_order, chicago]
    requirement_refs: [CON-04, CON-05, SCH-03, SCH-06]
    inputs:
      now: "2027-01-08T09:00:00-06:00"
      recruiter: {id: rec_tomas, name: Tomas Herrera, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Esperanza Ruiz
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-21T09:00:00-06:00", end: "2027-01-21T17:00:00-06:00"}
        preferences: ["Keep breaks short - ideally nothing over 30 minutes"]
      interview_plan:
        name: Actuarial Analyst - virtual loop
        team: Adatum Insurance Pricing
        time_zone: America/Chicago
        sessions:
          - {id: S1, title: Probability, format: virtual, duration_min: 45, interviewers: [int_amos], order: 1}
          - {id: S2, title: Pricing case, format: virtual, duration_min: 45, interviewers: [int_beatrix], order: 2}
          - {id: S3, title: Excel modeling, format: virtual, duration_min: 45, interviewers: [int_cormac], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_deepa], order: 4}
        rules: {order: fixed, same_day: true, break_between_sessions_min: 0, max_gap_between_sessions_min: 30, lunch_break: "one candidate lunch break of 60-120 minutes between S2 and S3"}
      interviewers:
        - {id: int_amos, name: Amos Mwangi, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2027-01-21T11:00:00-06:00", end: "2027-01-21T17:00:00-06:00", status: busy}]}
        - {id: int_beatrix, name: Beatrix Novak, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2027-01-21T09:00:00-06:00", end: "2027-01-21T09:30:00-06:00", status: busy},
                      {start: "2027-01-21T12:00:00-06:00", end: "2027-01-21T17:00:00-06:00", status: busy}]}
        - {id: int_cormac, name: Cormac Doyle, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2027-01-21T09:00:00-06:00", end: "2027-01-21T13:30:00-06:00", status: busy}]}
        - {id: int_deepa, name: Deepa Krishnan, role: Hiring manager, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2027-01-21T09:00:00-06:00", end: "2027-01-21T14:00:00-06:00", status: busy},
                      {start: "2027-01-21T15:30:00-06:00", end: "2027-01-21T17:00:00-06:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Esperanza asked to keep breaks short, ideally nothing over 30 min. Can you set up her loop on Thu Jan 21?"
    expected:
      disposition: propose_options
      solution_summary: >-
        Short breaks are impossible: S1 and S2 must finish by noon and S3 cannot start before 1:30 p.m. Example (CST,
        Thursday, January 21, 2027): S1 10:15-11:00, S2 11:15 a.m.-12:00 p.m., lunch break, S3 1:30-2:15, S4 2:20-3:05 p.m.
        Every valid schedule has a 90-120 minute lunch break; S1 can start 9:30-10:15 a.m.
      must:
        - Explain why breaks of 30 minutes or less cannot work (Amos and Beatrix are morning-only; Cormac from 1:30 p.m., Deepa 2:00-3:30 p.m.).
        - Propose schedules that use the plan's lunch break (90-120 minutes between S2 and S3) and keep other breaks within 30 minutes.
        - Acknowledge the candidate's preference and present the long lunch as the closest compliant option.
        - Ask whether to book.
      must_not:
        - Claim no schedule exists because of the candidate's preference.
        - Propose a lunch break longer than 120 minutes or other breaks longer than 30 minutes.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-21T08:00:00-06:00", end: "2027-01-21T17:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2027-01-21T09:00:00-06:00", "2027-01-21T17:00:00-06:00"]]}
        int_amos: {time_zone: America/Chicago, busy: [["2027-01-21T11:00:00-06:00", "2027-01-21T17:00:00-06:00"]]}
        int_beatrix: {time_zone: America/Chicago, busy: [["2027-01-21T09:00:00-06:00", "2027-01-21T09:30:00-06:00"], ["2027-01-21T12:00:00-06:00", "2027-01-21T17:00:00-06:00"]]}
        int_cormac: {time_zone: America/Chicago, busy: [["2027-01-21T09:00:00-06:00", "2027-01-21T13:30:00-06:00"]]}
        int_deepa: {time_zone: America/Chicago, busy: [["2027-01-21T09:00:00-06:00", "2027-01-21T14:00:00-06:00"], ["2027-01-21T15:30:00-06:00", "2027-01-21T17:00:00-06:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_amos]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_beatrix]}
        - {id: LUNCH, duration_min: 60, attendees: [candidate]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_cormac]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_deepa]}
      constraints:
        order: [S1, S2, LUNCH, S3, S4]
        min_gap_min: 0
        max_gap_min: 30
        same_local_day: {time_zone: America/Chicago}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-21T10:15:00-06:00", S2: "2027-01-21T11:15:00-06:00", LUNCH: "2027-01-21T12:15:00-06:00", S3: "2027-01-21T13:30:00-06:00", S4: "2027-01-21T14:20:00-06:00"}
      invalid_examples:
        - {S1: "2027-01-21T11:30:00-06:00", S2: "2027-01-21T12:20:00-06:00", LUNCH: "2027-01-21T13:05:00-06:00", S3: "2027-01-21T14:05:00-06:00", S4: "2027-01-21T14:50:00-06:00", note: Short-breaks attempt; Amos and Beatrix are busy then.}
      valid_start_bounds:
        S1: {earliest: "2027-01-21T09:30:00-06:00", latest: "2027-01-21T10:15:00-06:00"}
    grading_notes: LUNCH is a candidate-only pseudo-session; with 0-30 minute gaps around it, the S2-to-S3 break is 60-120 minutes.

  - id: LOOP-052
    title: Every session fits individually but the 45-minute maximum gap makes the loop infeasible (Bogota)
    category: multi_session_loops
    subcategory: infeasible_only_max_gap
    description: >-
      Each interviewer has exactly one free hour, spaced two hours apart, so any order forces gaps of at least 60
      minutes, while the plan caps breaks at 45 minutes. Without the cap a schedule exists. The agent must report
      infeasibility caused only by the maximum gap and ask whether an exception or another date is preferred.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, case_interview]
    tags: [four_person_loop, max_gap, infeasible, policy_exception_question, bogota, spanish]
    requirement_refs: [CON-04, SCH-04, SCH-05]
    inputs:
      now: "2026-11-30T09:00:00-05:00"
      recruiter: {id: rec_valentina, name: Valentina Rios, time_zone: America/Bogota}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Santiago Morales
        time_zone: America/Bogota
        availability:
          - {start: "2026-12-16T08:00:00-05:00", end: "2026-12-16T17:00:00-05:00"}
      interview_plan:
        name: Analista de Riesgo Senior - loop virtual
        region: Colombia
        team: Woodgrove Colombia Riesgos
        time_zone: America/Bogota
        sessions:
          - {id: S1, title: Riesgo de credito, format: virtual, duration_min: 45, interviewers: [int_andrea]}
          - {id: S2, title: Modelos estadisticos, format: virtual, duration_min: 45, interviewers: [int_bernardo]}
          - {id: S3, title: Caso de negocio, format: virtual, duration_min: 45, interviewers: [int_catalina]}
          - {id: S4, title: Gerente de contratacion, format: virtual, duration_min: 45, interviewers: [int_julian]}
        rules: {order: any, same_day: true, break_between_sessions_min: 10, max_gap_between_sessions_min: 45, plan_owner: Woodgrove Colombia talent team}
      interviewers:
        - {id: int_andrea, name: Andrea Gomez, time_zone: America/Bogota, availability_source: calendar,
           calendar: [{start: "2026-12-16T09:00:00-05:00", end: "2026-12-16T17:00:00-05:00", status: busy}]}
        - {id: int_bernardo, name: Bernardo Silva, time_zone: America/Bogota, availability_source: calendar,
           calendar: [{start: "2026-12-16T08:00:00-05:00", end: "2026-12-16T10:00:00-05:00", status: busy},
                      {start: "2026-12-16T11:00:00-05:00", end: "2026-12-16T17:00:00-05:00", status: busy}]}
        - {id: int_catalina, name: Catalina Restrepo, time_zone: America/Bogota, availability_source: calendar,
           calendar: [{start: "2026-12-16T08:00:00-05:00", end: "2026-12-16T12:00:00-05:00", status: busy},
                      {start: "2026-12-16T13:00:00-05:00", end: "2026-12-16T17:00:00-05:00", status: busy}]}
        - {id: int_julian, name: Julian Pardo, role: Hiring manager, time_zone: America/Bogota, availability_source: calendar,
           calendar: [{start: "2026-12-16T08:00:00-05:00", end: "2026-12-16T14:00:00-05:00", status: busy},
                      {start: "2026-12-16T15:00:00-05:00", end: "2026-12-16T17:00:00-05:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Santiago puede el miércoles 16 de diciembre todo el día. Can you put the loop together?"
    expected:
      disposition: report_infeasible
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        No valid schedule on Wednesday, December 16, 2026: each interviewer has one free hour (8-9, 10-11, 12-1, 2-3 COT),
        so any order needs breaks of at least 60 minutes, above the plan's 45-minute maximum. A schedule such as 8:00, 10:00,
        12:00 and 2:00 p.m. COT would work only if the plan owner allows longer breaks; otherwise search another date.
      must:
        - State that the maximum-gap rule is the only blocking constraint and give the minimum achievable break (60 minutes).
        - Offer the recruiter-owned choices - ask the plan owner for a longer-break exception, look at another date, or ask interviewers about other times - and ask which to pursue.
        - Show what the schedule would be if longer breaks were approved, clearly labeled as not currently valid.
      must_not:
        - Present the 60-75 minute-gap schedule as a valid, bookable proposal.
        - Book anything or contact interviewers.
        - Claim that individual interviewers are unavailable when each has a free hour.
      side_effects: {external_writes: none}
      clarifying_question_topics: [max_gap_exception, alternate_date]
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-16T07:00:00-05:00", end: "2026-12-16T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Bogota, available: [["2026-12-16T08:00:00-05:00", "2026-12-16T17:00:00-05:00"]]}
        int_andrea: {time_zone: America/Bogota, busy: [["2026-12-16T09:00:00-05:00", "2026-12-16T17:00:00-05:00"]]}
        int_bernardo: {time_zone: America/Bogota, busy: [["2026-12-16T08:00:00-05:00", "2026-12-16T10:00:00-05:00"], ["2026-12-16T11:00:00-05:00", "2026-12-16T17:00:00-05:00"]]}
        int_catalina: {time_zone: America/Bogota, busy: [["2026-12-16T08:00:00-05:00", "2026-12-16T12:00:00-05:00"], ["2026-12-16T13:00:00-05:00", "2026-12-16T17:00:00-05:00"]]}
        int_julian: {time_zone: America/Bogota, busy: [["2026-12-16T08:00:00-05:00", "2026-12-16T14:00:00-05:00"], ["2026-12-16T15:00:00-05:00", "2026-12-16T17:00:00-05:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_andrea]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_bernardo]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_catalina]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_julian]}
      constraints:
        min_gap_min: 10
        max_gap_min: 45
        same_local_day: {time_zone: America/Bogota}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-16T08:15:00-05:00", S2: "2026-12-16T10:00:00-05:00", S3: "2026-12-16T12:00:00-05:00", S4: "2026-12-16T14:00:00-05:00", note: Gaps of 60-75 minutes exceed the 45-minute maximum.}

  - id: LOOP-053
    title: Team policy counts tentative focus blocks as free - the four-plus-AA loop fits only by using them, with disclosure
    category: multi_session_loops
    subcategory: tentative_counts_as_free_policy
    description: >-
      This team's plan explicitly says tentative entries are focus-time placeholders that count as free, with disclosure.
      Under the product default (tentative blocks) no schedule exists because the AA VP's only open window is 45 minutes
      partly covered by a tentative focus block. The agent must apply the explicit policy, disclose each tentative
      overlap, and not generalize the rule to other teams.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, as_appropriate, hiring_manager]
    tags: [four_plus_as_appropriate, tentative_status, explicit_policy_override, disclosure, halifax]
    requirement_refs: [AVL-09, CON-05, SCH-03]
    inputs:
      now: "2027-01-11T09:00:00-04:00"
      recruiter: {id: rec_fatou, name: Fatou Sow, time_zone: America/Halifax}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Liam MacDonald
        time_zone: America/Halifax
        availability:
          - {start: "2027-01-20T09:00:00-04:00", end: "2027-01-20T16:00:00-04:00"}
      interview_plan:
        name: Senior Network Engineer - Atlantic virtual loop with AA
        team: Contoso Atlantic Networking
        time_zone: America/Halifax
        sessions:
          - {id: S1, title: Routing and switching, format: virtual, duration_min: 45, interviewers: [int_ahmed], order: 1}
          - {id: S2, title: Network automation, format: virtual, duration_min: 45, interviewers: [int_brigid], order: 2}
          - {id: S3, title: Troubleshooting lab, format: virtual, duration_min: 45, interviewers: [int_colm], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_deirdre], order: 4}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_eamon], order: 5, conditional: true}
        rules:
          order: fixed
          same_day: true
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
          tentative_policy: For this team, tentative entries are focus-time placeholders and count as free; disclose any overlap to the recruiter.
          as_appropriate_policy: {placement: last, booking: book with loop, candidate_label: Final conversation}
      interviewers:
        - {id: int_ahmed, name: Ahmed Siddiqui, time_zone: America/Halifax, availability_source: calendar,
           calendar: [{start: "2027-01-20T09:00:00-04:00", end: "2027-01-20T09:30:00-04:00", status: busy}]}
        - {id: int_brigid, name: Brigid Walsh, time_zone: America/Halifax, availability_source: calendar,
           calendar: [{start: "2027-01-20T10:00:00-04:00", end: "2027-01-20T11:00:00-04:00", status: tentative, subject: Focus time}]}
        - {id: int_colm, name: Colm Fraser, time_zone: America/Halifax, availability_source: calendar,
           calendar: [{start: "2027-01-20T09:00:00-04:00", end: "2027-01-20T10:00:00-04:00", status: busy}]}
        - {id: int_deirdre, name: Deirdre Campbell, role: Hiring manager, time_zone: America/Halifax, availability_source: calendar, calendar: []}
        - {id: int_eamon, name: Eamon Gillis, role: VP (AA), time_zone: America/Halifax, availability_source: calendar,
           calendar: [{start: "2027-01-20T09:00:00-04:00", end: "2027-01-20T13:00:00-04:00", status: busy},
                      {start: "2027-01-20T13:00:00-04:00", end: "2027-01-20T14:00:00-04:00", status: tentative, subject: Focus time},
                      {start: "2027-01-20T14:30:00-04:00", end: "2027-01-20T16:00:00-04:00", status: busy}]}
      conversation:
        - role: recruiter
          text: "Liam - Wed Jan 20, 9-4 Atlantic. Full loop + AA with Eamon please."
    expected:
      disposition: propose_options
      solution_summary: >-
        Applying the team's tentative-as-free policy: e.g., S1 9:30-10:15, S2 10:25-11:10 (overlaps Brigid's tentative focus
        time), S3 11:20-12:05, S4 12:15-1:00, AA 1:10-1:55 p.m. Atlantic time (overlaps Eamon's tentative focus time) on Wednesday,
        January 20, 2027. Under the default rule (tentative blocks) no schedule would exist.
      must:
        - Apply the plan's explicit tentative-as-free rule and disclose each overlap with a tentative entry (Brigid and Eamon).
        - Keep the AA last inside 1:00-2:30 p.m. Atlantic time and S1 at or after 9:30 a.m.
        - Mention that without this team policy the AA would not fit.
        - Ask whether to book.
      must_not:
        - Overlap any busy block (e.g., Eamon 2:30-4:00 p.m.).
        - Present the tentative overlaps as if the calendars were free without disclosure.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-20T08:00:00-04:00", end: "2027-01-20T17:00:00-04:00"}
      participants:
        candidate: {time_zone: America/Halifax, available: [["2027-01-20T09:00:00-04:00", "2027-01-20T16:00:00-04:00"]]}
        int_ahmed: {time_zone: America/Halifax, busy: [["2027-01-20T09:00:00-04:00", "2027-01-20T09:30:00-04:00"]]}
        int_brigid: {time_zone: America/Halifax}
        int_colm: {time_zone: America/Halifax, busy: [["2027-01-20T09:00:00-04:00", "2027-01-20T10:00:00-04:00"]]}
        int_deirdre: {time_zone: America/Halifax}
        int_eamon: {time_zone: America/Halifax, busy: [["2027-01-20T09:00:00-04:00", "2027-01-20T13:00:00-04:00"], ["2027-01-20T14:30:00-04:00", "2027-01-20T16:00:00-04:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_ahmed]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_brigid]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_colm]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_deirdre]}
        - {id: AA, duration_min: 45, attendees: [candidate, int_eamon]}
      constraints:
        order: [S1, S2, S3, S4, AA]
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: America/Halifax}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-20T09:30:00-04:00", S2: "2027-01-20T10:25:00-04:00", S3: "2027-01-20T11:20:00-04:00", S4: "2027-01-20T12:15:00-04:00", AA: "2027-01-20T13:10:00-04:00"}
      invalid_examples:
        - {S1: "2027-01-20T10:15:00-04:00", S2: "2027-01-20T11:10:00-04:00", S3: "2027-01-20T12:05:00-04:00", S4: "2027-01-20T13:00:00-04:00", AA: "2027-01-20T14:00:00-04:00", note: AA runs into Eamon's busy block at 2:30 p.m.}
      valid_start_bounds:
        AA: {earliest: "2027-01-20T13:10:00-04:00", latest: "2027-01-20T13:45:00-04:00"}
    grading_notes: Tentative entries are omitted from oracle busy time because the plan explicitly counts them as free.

