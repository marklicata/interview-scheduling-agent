  - id: LOOP-056
    title: Interview plan contains contradictory ordering rules - ask which governs before scheduling
    category: multi_session_loops
    subcategory: contradictory_order_rules
    description: >-
      The Seattle onsite template says Coding 1 must be the first interview (calibration) and, separately, that the
      hiring manager always opens the loop. Both cannot be first. The agent must surface the contradiction and ask the
      recruiter or plan owner which rule applies, rather than silently picking one.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [in_person_loop, technical_coding, hiring_manager]
    tags: [four_person_loop, contradictory_constraints, plan_validation, clarification]
    requirement_refs: [CON-03, CON-10, INT-05]
    inputs:
      now: "2026-11-30T10:00:00-08:00"
      recruiter: {id: rec_hannah, name: Hannah Kowalski, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Arjun Bose
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-14T09:00:00-08:00", end: "2026-12-14T15:00:00-08:00"}
      interview_plan:
        name: Software Engineer - Seattle onsite template v4
        team: Contoso Cloud Games
        time_zone: America/Los_Angeles
        sessions:
          - {id: S1, title: Coding 1, format: in_person, duration_min: 60}
          - {id: S2, title: Coding 2, format: in_person, duration_min: 60}
          - {id: S3, title: System design, format: in_person, duration_min: 60}
          - {id: S4, title: Hiring manager, format: in_person, duration_min: 45}
        rules:
          - "Coding 1 must be the first interview of the day (calibration requirement, section 2.1)."
          - "The hiring manager always opens the loop (HM-first policy, section 4.3)."
          - "System design must follow Coding 2."
          - "Breaks 10-20 minutes; same day."
        plan_owner: Contoso Seattle recruiting operations
      conversation:
        - role: recruiter
          text: "Arjun's free Mon 12/14 9-3. Use the v4 template and send me options."
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Point out that sections 2.1 and 4.3 both require a different session to be first, so the template is contradictory.
        Ask the recruiter (or plan owner) which rule governs for this loop; offer to build options as soon as that is settled.
      must:
        - Quote or precisely reference the two conflicting rules (Coding 1 first vs hiring manager first).
        - Ask which rule applies or whether the plan owner has a corrected template.
        - Keep the other rules (System design after Coding 2, 10-20 minute breaks, same day) for later scheduling.
      must_not:
        - Silently choose one of the conflicting rules and present options as compliant with the template.
        - Book anything.
        - Ignore the ordering rules entirely.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which_first_session_rule_applies]

