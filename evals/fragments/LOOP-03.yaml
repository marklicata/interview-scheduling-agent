          - {id: S4, title: Hiring manager, format: virtual, duration_min: 60, interviewers: [int_ding]}
        rules: {order: any, break_between_sessions_min: 10, max_gap_between_sessions_same_day_min: 30, split_across_days: "allowed only if a single day does not work; single day preferred"}
      interviewers:
