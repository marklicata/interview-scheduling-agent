  - id: LOOP-061
    title: DST mismatch week - London As Appropriate fits only because New York and London are four hours apart
    category: multi_session_loops
    subcategory: aa_dst_mismatch_week
    description: >-
      On Tuesday, March 23, 2027 New York is on daylight time and London is not, so they are four hours apart. The London
      AA interviewer works until 5:30 p.m. GMT = 1:30 p.m. EDT. After a 9:30 a.m. EDT constraint on S2, the AA cannot start
      before 12:15 p.m. EDT. With the usual five-hour difference the loop would look impossible; with the real
      difference, the AA fits 12:15-12:45 p.m. EDT.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, as_appropriate]
    tags: [four_plus_as_appropriate, dst_mismatch, fixed_offset_trap, new_york, london]
    requirement_refs: [AVL-10, SCH-01, SCH-04]
    inputs:
      now: "2027-03-15T09:00:00-04:00"
      recruiter: {id: rec_priyanka, name: Priyanka Shah, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ethan Goldberg
        time_zone: America/New_York
        availability:
          - {start: "2027-03-23T08:30:00-04:00", end: "2027-03-23T17:00:00-04:00"}
      interview_plan:
        name: Quantitative Researcher - virtual loop with AA
        team: Woodgrove Systematic Strategies
        time_zone: America/New_York
        sessions:
          - {id: S1, title: Probability, format: virtual, duration_min: 45, interviewers: [int_alicia], order: 1}
          - {id: S2, title: Statistics, format: virtual, duration_min: 45, interviewers: [int_benjamin], order: 2}
          - {id: S3, title: Research case, format: virtual, duration_min: 45, interviewers: [int_chiara], order: 3}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_darius], order: 4}
          - {id: AA, title: As Appropriate, format: virtual, duration_min: 45, interviewers: [int_imogen], order: 5, conditional: true}
        rules:
          order: fixed
          same_day: true
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
          as_appropriate_policy: {placement: last, booking: book with loop, candidate_label: Final conversation}
      interviewers:
        - {id: int_alicia, working_hours: {start: "08:30", end: "17:00"}, name: Alicia Grant, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_benjamin, name: Benjamin Reyes, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2027-03-23T08:00:00-04:00", end: "2027-03-23T09:30:00-04:00", status: busy}]}
        - {id: int_chiara, name: Chiara Russo, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_darius, name: Darius Freeman, role: Hiring manager, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_imogen, name: Imogen Hartley, role: "Managing Director, London (AA)", time_zone: Europe/London, availability_source: calendar,
           working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}, calendar: []}
      conversation:
        - role: recruiter
          text: "Ethan, Tue 3/23, 8:30-5 ET. AA with Imogen in London - she stops at 5:30 her time, so I think we're stuck by 12:30 ET?"
    expected:
      disposition: propose_options
      solution_summary: >-
        Not stuck: that week London is only four hours ahead, so 5:30 p.m. GMT = 1:30 p.m. EDT. Example (EDT, Tuesday,
        March 23, 2027): S1 8:30-9:15, S2 9:30-10:15, S3 10:25-11:10, S4 11:20 a.m.-12:05 p.m., AA 12:15-1:00 p.m. EDT
        (4:15-5:00 p.m. GMT). AA can start 12:15-12:45 p.m. EDT; S1 8:30-9:05 a.m.
      must:
        - Correct the recruiter's assumption, explaining that US daylight time started March 14 and UK summer time starts March 28, so the difference is four hours.
