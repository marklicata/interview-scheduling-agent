        int_george: {time_zone: Europe/London}
        int_hannah: {time_zone: Europe/London, busy: [["2027-01-13T11:00:00+00:00", "2027-01-13T12:00:00+00:00"]]}
        int_isla: {time_zone: Europe/London}
        int_jack: {time_zone: Europe/London, busy: [["2027-01-13T10:00:00+00:00", "2027-01-13T11:00:00+00:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_george]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_hannah]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_isla]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_jack]}
      constraints:
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: Europe/London}
      expect_feasible: true
      valid_examples:
        - {S2: "2027-01-13T10:00:00+00:00", S4: "2027-01-13T11:00:00+00:00", S1: "2027-01-13T11:55:00+00:00", S3: "2027-01-13T12:50:00+00:00"}
      invalid_examples:
        - {S1: "2027-01-13T10:00:00+00:00", S2: "2027-01-13T11:00:00+00:00", S3: "2027-01-13T12:00:00+00:00", S4: "2027-01-13T13:00:00+00:00", note: "Candidate's listed times; Hannah is busy 11:00-12:00."}

  - id: LOOP-078
