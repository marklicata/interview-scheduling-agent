  - id: LOOP-059
    title: Saudi team works Sunday-Thursday - a Friday loop is impossible, propose Sunday
    category: multi_session_loops
    subcategory: non_western_workweek
    description: >-
      A London recruiter assumes Friday works for a Riyadh loop because the candidate prefers it. The Riyadh interviewers'
      working week is Sunday-Thursday, so Friday is outside everyone's working hours. The candidate's backup is Sunday,
      which is a normal working day there. Times should be shown in Riyadh time (UTC+3) and London time.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [in_person_loop, hiring_manager]
    tags: [four_person_loop, workweek_sunday_thursday, riyadh, london_recruiter, working_hours]
    requirement_refs: [AVL-03, AVL-10, SCH-01]
    inputs:
      now: "2026-11-27T09:00:00+00:00"
      recruiter: {id: rec_charlotte, name: Charlotte Evans, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Faisal Al-Qahtani
        time_zone: Asia/Riyadh
        availability:
          - {start: "2026-12-04T10:00:00+03:00", end: "2026-12-04T16:00:00+03:00"}
          - {start: "2026-12-06T10:00:00+03:00", end: "2026-12-06T16:00:00+03:00"}
        preferences: [Prefers Friday]
      interview_plan:
        name: Project Engineer - Riyadh onsite loop
        team: Northwind Saudi Infrastructure
        time_zone: Asia/Riyadh
        sessions:
          - {id: S1, title: Technical design, format: in_person, duration_min: 45, interviewers: [int_abdullah]}
          - {id: S2, title: Project controls, format: in_person, duration_min: 45, interviewers: [int_bader]}
          - {id: S3, title: HSE scenario, format: in_person, duration_min: 45, interviewers: [int_dana]}
          - {id: S4, title: Hiring manager, format: in_person, duration_min: 45, interviewers: [int_majed]}
        rules: {order: any, same_day: true, break_between_sessions_min: 10, max_gap_between_sessions_min: 30, venue: "Northwind Riyadh office, King Fahd Road"}
      interviewers:
        - {id: int_abdullah, name: Abdullah Al-Harbi, time_zone: Asia/Riyadh, availability_source: calendar,
           working_hours: {days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"},
           calendar: [{start: "2026-12-06T10:00:00+03:00", end: "2026-12-06T11:00:00+03:00", status: busy}]}
        - {id: int_bader, name: Bader Al-Otaibi, time_zone: Asia/Riyadh, availability_source: calendar,
           working_hours: {days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"},
           calendar: [{start: "2026-12-06T13:00:00+03:00", end: "2026-12-06T16:00:00+03:00", status: busy}]}
        - {id: int_dana, name: Dana Al-Shehri, time_zone: Asia/Riyadh, availability_source: calendar,
           working_hours: {days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"}, calendar: []}
        - {id: int_majed, name: Majed Al-Ghamdi, role: Hiring manager, time_zone: Asia/Riyadh, availability_source: calendar,
           working_hours: {days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: "Faisal says Friday 4 Dec works best for him, Sunday 6 Dec is his backup. Can you set up the onsite on Friday?"
    expected:
      disposition: propose_options
      solution_summary: >-
        Friday, December 4 is outside the Riyadh team's Sunday-Thursday working week. Propose Sunday, December 6, 2026, e.g.,
        Bader 10:00-10:45, Dana 10:55-11:40, Abdullah 11:50 a.m.-12:35 p.m., Majed 12:45-1:30 p.m. Riyadh time (7:00-10:30 a.m. GMT).
      must:
        - Explain that the interviewers' working week is Sunday-Thursday, so Friday has no valid schedule.
        - Propose Sunday, December 6 with Abdullah not before 11:00 a.m. and Bader ending by 1:00 p.m. Riyadh time.
        - Show times in Riyadh time (UTC+3) for the candidate and London time for the recruiter, with the venue.
        - Ask whether to book.
      must_not:
        - Propose a Friday schedule or treat Sunday as a non-working day.
        - Use the label "AST" without clarifying it means Arabia Standard Time (UTC+3).
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-06T07:00:00Z", time_zone: Asia/Riyadh, expected_local: "2026-12-06T10:00", expected_weekday: Sunday, expected_utc_offset: "+03:00"}
      - {instant: "2026-12-06T07:00:00Z", time_zone: Europe/London, expected_local: "2026-12-06T07:00", expected_utc_offset: "+00:00"}
      - {instant: "2026-12-04T07:00:00Z", time_zone: Asia/Riyadh, expected_weekday: Friday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-04T00:00:00+03:00", end: "2026-12-07T00:00:00+03:00"}
      participants:
        candidate: {time_zone: Asia/Riyadh, available: [["2026-12-04T10:00:00+03:00", "2026-12-04T16:00:00+03:00"], ["2026-12-06T10:00:00+03:00", "2026-12-06T16:00:00+03:00"]]}
        int_abdullah:
          time_zone: Asia/Riyadh
          working_hours: {time_zone: Asia/Riyadh, days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"}
          busy: [["2026-12-06T10:00:00+03:00", "2026-12-06T11:00:00+03:00"]]
        int_bader:
          time_zone: Asia/Riyadh
          working_hours: {time_zone: Asia/Riyadh, days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"}
          busy: [["2026-12-06T13:00:00+03:00", "2026-12-06T16:00:00+03:00"]]
        int_dana: {time_zone: Asia/Riyadh, working_hours: {time_zone: Asia/Riyadh, days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"}}
        int_majed: {time_zone: Asia/Riyadh, working_hours: {time_zone: Asia/Riyadh, days: [Sun, Mon, Tue, Wed, Thu], start: "08:00", end: "16:00"}}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_abdullah]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_bader]}
        - {id: S3, duration_min: 45, attendees: [candidate, int_dana]}
        - {id: S4, duration_min: 45, attendees: [candidate, int_majed]}
      constraints:
        min_gap_min: 10
        max_gap_min: 30
        same_local_day: {time_zone: Asia/Riyadh}
      expect_feasible: true
      valid_examples:
        - {S2: "2026-12-06T10:00:00+03:00", S3: "2026-12-06T10:55:00+03:00", S1: "2026-12-06T11:50:00+03:00", S4: "2026-12-06T12:45:00+03:00"}
      invalid_examples:
        - {S1: "2026-12-04T10:00:00+03:00", S2: "2026-12-04T10:55:00+03:00", S3: "2026-12-04T11:50:00+03:00", S4: "2026-12-04T12:45:00+03:00", note: Friday is outside the Sunday-Thursday working week.}

