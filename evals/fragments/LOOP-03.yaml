           calendar: [{start: "2027-01-28T09:00:00+08:00", end: "2027-01-28T10:00:00+08:00", status: busy}]}
        - {id: int_bo, name: Bo-Wei Tsai, time_zone: Asia/Taipei, availability_source: calendar,
           calendar: [{start: "2027-01-28T13:00:00+08:00", end: "2027-01-28T14:00:00+08:00", status: busy}]}
        - {id: int_chen, name: Chen Yu-Ting, time_zone: Asia/Taipei, availability_source: calendar, calendar: []}
        - {id: int_ding, name: Ding Wei, role: Hiring manager, time_zone: Asia/Taipei, availability_source: calendar,
           calendar: [{start: "2027-01-28T16:00:00+08:00", end: "2027-01-28T17:00:00+08:00", status: busy}]}
      conversation:
        - role: recruiter
