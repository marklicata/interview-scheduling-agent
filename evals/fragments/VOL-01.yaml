        cand_bao: {time_zone: America/New_York, available: [["2026-11-16T09:00:00-05:00", "2026-11-16T10:00:00-05:00"], ["2026-11-16T10:30:00-05:00", "2026-11-16T11:00:00-05:00"]]}
        cand_chidi: {time_zone: America/New_York, available: [["2026-11-16T09:00:00-05:00", "2026-11-16T09:30:00-05:00"]]}
        int_leah:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}
          busy: [["2026-11-16T10:00:00-05:00", "2026-11-16T10:30:00-05:00"]]
      sessions:
        - {id: PS_AMY, duration_min: 30, attendees: [cand_amy, int_leah]}
        - {id: PS_BAO, duration_min: 30, attendees: [cand_bao, int_leah]}
        - {id: PS_CHIDI, duration_min: 30, attendees: [cand_chidi, int_leah]}
      expect_feasible: true
      valid_examples:
        - {PS_CHIDI: "2026-11-16T09:00:00-05:00", PS_AMY: "2026-11-16T09:30:00-05:00", PS_BAO: "2026-11-16T10:30:00-05:00"}
      invalid_examples:
        - {PS_AMY: "2026-11-16T09:00:00-05:00", PS_BAO: "2026-11-16T10:30:00-05:00", PS_CHIDI: "2026-11-16T09:00:00-05:00", note: Amy and Chidi collide; first-come pass strands Chidi.}

  - id: VOL-010
    title: Configuration grant names three candidates - book those screens, but only propose the newly added fourth
    category: high_volume_and_multi_candidate
    subcategory: grant_scoped_to_named_candidates
    description: >-
      A configuration grant lets the agent book phone screens for three named candidates on a requisition this week. The
      recruiter now sends four candidates, including one just added to the requisition. The agent should book the three
      covered screens without a redundant prompt, in non-overlapping slots with the shared interviewer, and only propose
      the fourth (not covered by the grant), asking for confirmation.
