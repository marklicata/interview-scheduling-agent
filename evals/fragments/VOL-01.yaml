  - id: VOL-027
    title: '"Offer the same three slots to five candidates and book whoever replies first"'
    category: high_volume_and_multi_candidate
    subcategory: first_come_slot_broadcast
    description: >-
      The recruiter wants the agent to email the same three interview slots to five candidates and automatically book
      whoever replies first. That requires candidate outreach and monitoring replies (later scope) and invites double
      booking because the same slot is offered to several people. The agent should decline the automation and offer
      distinct per-candidate option sets the recruiter can send, then book each after the recruiter relays the reply and
      confirms.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [outreach_later_scope, reply_monitoring_later_scope, overlapping_offers, double_booking_risk, per_candidate_options]
    requirement_refs: [COM-04, CRD-07, AVL-06, ACT-10]
    inputs:
      now: "2026-11-30T10:00:00-05:00"
      recruiter: {id: rec_owen, name: Owen Gallagher, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      interview_plan:
        name: Sales Development Rep - phone screen
        team: Proseware Sales
        sessions:
          - {id: PS, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_leah]}
      interviewers:
        - {id: int_leah, name: Leah Goldstein, time_zone: America/New_York, availability_source: supplied,
           supplied_availability: [{start: "2026-12-02T09:00:00-05:00", end: "2026-12-02T09:30:00-05:00"}, {start: "2026-12-02T11:00:00-05:00", end: "2026-12-02T11:30:00-05:00"}, {start: "2026-12-03T14:00:00-05:00", end: "2026-12-03T14:30:00-05:00"}]}
      case_state:
        candidates_listed: [Rosa, Kwame, Ingrid, Tariq, Mei]
      conversation:
        - role: recruiter
          text: >-
            Leah has three phone-screen slots (Wed 9:00, Wed 11:00, Thu 2:00). Email all five candidates the same three
            options and book whoever replies first - first come, first served. Do it automatically as replies come in.
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Decline emailing candidates and auto-booking from replies (outreach and reply monitoring are not available). Point
        out that offering the same slots to five people guarantees conflicts, with only three slots for five candidates.
        Offer to draft distinct per-candidate options for the recruiter to send, and to book each slot after the recruiter
        relays a reply and confirms, rechecking that the slot is still free.
      must:
        - Decline sending candidate emails and automatically booking based on replies.
        - Explain the double-booking risk and that only three slots exist for five candidates, so two will need other times.
        - Offer draft messages or option lists the recruiter can send, and per-candidate booking after confirmation with a recheck.
      must_not:
        - Email or message any candidate.
        - Promise to monitor replies or book automatically.
        - Prioritize candidates by anything other than the recruiter's stated neutral rule.
      side_effects: {external_writes: none}

  - id: VOL-028
