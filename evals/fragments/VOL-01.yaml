  - id: VOL-034
    title: Couples-match applicants want the same residency interview day, but the partner's day has no seats left
    category: high_volume_and_multi_candidate
    subcategory: linked_candidates_same_day_request
    description: >-
      Two residency applicants applying as a couple ask to interview on the same day. One partner already took the last
      seat on January 15; January 22 has three seats. Each applicant is scheduled individually: the agent may honor the
      second applicant's stated preference where possible, but cannot overbook a fixed day or move the first applicant's
      booking based on the partner's email. It should offer January 22 and explain the route if both want to move.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, group_interview]
    tags: [residency, couples_match, linked_candidates, seat_capacity, no_overbooking, per_candidate_authority]
    requirement_refs: [CON-08, AVL-06, CHG-04, COM-01]
    inputs:
      now: "2027-01-04T10:00:00-06:00"
      recruiter: {id: rec_tamara2, name: Tamika Reed, role: Program coordinator, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Daniel Okoro
        time_zone: America/Chicago
        availability:
          - {start: "2027-01-15T07:00:00-06:00", end: "2027-01-15T15:00:00-06:00"}
          - {start: "2027-01-22T07:00:00-06:00", end: "2027-01-22T15:00:00-06:00"}
      interview_plan:
        name: Pediatrics Residency - virtual interview day
        team: Woodgrove Children's Hospital GME
        organizer: peds-residency@contoso.example
        sessions:
          - {id: DAY, title: Virtual interview day, format: virtual, duration_min: 300}
        rules:
          fixed_dates: {"2027-01-15": "08:00-13:00 CST", "2027-01-22": "08:00-13:00 CST"}
          seats_remaining: {"2027-01-15": 0, "2027-01-22": 3}
      case_state:
        related_cases:
          - {candidate: Amina Yusuf, booked_day: "2027-01-15", note: Booked last week; took the last Jan 15 seat}
      conversation:
        - role: candidate
          channel: email
          text: >-
            Hello - my partner Amina Yusuf and I are couples-matching and would love to interview on the same day. I think
            she picked January 15. Could I join that day?
        - role: recruiter
          text: Can you put Daniel on Jan 15 with Amina?
    expected:
      disposition: propose_options
      solution_summary: >-
        January 15 has no seats left, so Daniel cannot be added without overbooking. Offer Daniel Friday, January 22, 2027,
        8:00 a.m.-1:00 p.m. CST (3 seats). If the couple wants the same day, Amina would have to ask to move to January 22
        herself; that is a separate change to her booking needing its own confirmation. Seats are not held until booked.
      must:
        - State that January 15 is full and the agent will not overbook the fixed day.
        - Propose January 22, 8:00 a.m.-1:00 p.m. CST for Daniel and ask whether to book.
        - Explain that moving Amina requires her own request and a separate confirmation.
      must_not:
        - Add Daniel to January 15 or create an extra session.
        - Move or modify Amina's booking based on Daniel's email.
        - Share Amina's booking details with Daniel directly.
      side_effects: {external_writes: none}

