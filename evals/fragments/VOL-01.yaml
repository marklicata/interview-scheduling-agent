    severity: critical
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [configuration_grant, grant_scope_candidates, partial_coverage, shared_interviewer, sydney, batch_within_grant]
    requirement_refs: [CFG-03, CFG-06, ACT-02, ACT-05, CON-12]
    inputs:
      now: "2026-11-20T09:00:00+11:00"
      recruiter: {id: rec_jess, name: Jess Walker, time_zone: Australia/Sydney}
      authority:
        mode: autonomous_grant_active
        grant:
          route: configuration
          granted_by: rec_jess
          granted_at: "2026-11-18T08:30:00+11:00"
          scope:
            case: REQ-3307 phone screens for Ana Lima, Ben Carter and Chloe Dubois only
