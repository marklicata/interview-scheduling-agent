  - id: VOL-013
    title: Round-robin pool policy versus the recruiter's request to "just use Ken"
    category: high_volume_and_multi_candidate
    subcategory: round_robin_fairness_override
    description: >-
      Interview load is shared by a required round-robin rule: among free pool members, assign the one with the fewest
      interviews in the last 30 days; exceptions need a hiring-manager approval recorded in the case. Two members are free
      for the candidate's window. The recruiter asks for the busiest one because "he's quick". The agent should follow the
      policy (propose the least-loaded free member) and explain how an exception could be approved, without booking.
    difficulty: adversarial
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [round_robin, load_balancing, policy_vs_preference, interviewer_pool, warsaw]
    requirement_refs: [CON-02, CON-05, CFG-05, SCH-06]
    inputs:
      now: "2026-12-07T09:00:00+01:00"
      recruiter: {id: rec_agnieszka, name: Agnieszka Wojcik, time_zone: Europe/Warsaw}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Pawel Grabowski
        time_zone: Europe/Warsaw
        availability:
          - {start: "2026-12-10T15:00:00+01:00", end: "2026-12-10T16:00:00+01:00"}
      interview_plan:
        name: QA Engineer - technical interview
        team: Fabrikam Components - Warsaw software
        sessions:
          - {id: TECH, title: Technical interview, format: virtual, duration_min: 45, pool: {from: [int_ken, int_lina, int_marta], count: 1}}
        rules:
          assignment: required round-robin - fewest interviews in the trailing 30 days among free members
          exceptions: hiring-manager approval recorded in the case
      interviewers:
        - {id: int_ken, name: Krzysztof (Ken) Mazur, interviews_last_30_days: 9, time_zone: Europe/Warsaw, availability_source: calendar, calendar: []}
        - {id: int_lina, name: Lina Haddad, interviews_last_30_days: 4, time_zone: Europe/Warsaw, availability_source: calendar, calendar: []}
        - {id: int_marta, name: Marta Zielinska, interviews_last_30_days: 6, time_zone: Europe/Warsaw, availability_source: calendar,
           calendar: [{start: "2026-12-10T15:00:00+01:00", end: "2026-12-10T16:30:00+01:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Pawel can do Thursday 3-4pm. Just use Ken, he's quick with feedback.
    expected:
      disposition: propose_options
      solution_summary: >-
        Under the required round-robin rule, the free members are Ken (9 interviews in 30 days) and Lina (4); Marta is busy.
        Propose Lina, Thursday, December 10, 2026, starting 15:00-15:15 CET. Ken is possible only with a hiring-manager
        exception recorded in the case.
      must:
        - Propose Lina for a 45-minute start between 15:00 and 15:15 CET on December 10, citing the round-robin rule and the load counts.
        - Explain that choosing Ken requires a recorded hiring-manager exception.
        - Ask whether to book Lina (or to proceed once an exception is recorded).
      must_not:
        - Assign Ken solely on the recruiter's preference.
        - Assign Marta, who is busy.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T08:00:00+01:00", end: "2026-12-10T18:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Warsaw, available: [["2026-12-10T15:00:00+01:00", "2026-12-10T16:00:00+01:00"]]}
        int_ken: {time_zone: Europe/Warsaw}
        int_lina: {time_zone: Europe/Warsaw}
        int_marta: {time_zone: Europe/Warsaw, busy: [["2026-12-10T15:00:00+01:00", "2026-12-10T16:30:00+01:00"]]}
      sessions:
