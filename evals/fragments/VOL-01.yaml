        - {id: int_mateo, name: Mateo Alvarez, time_zone: America/Phoenix, availability_source: calendar,
           calendar: [{start: "2026-12-12T10:30:00-07:00", end: "2026-12-12T10:50:00-07:00", status: busy, subject: Interview (restricted)}]}
        - {id: int_zainab, name: Zainab Musa, time_zone: America/Phoenix, availability_source: supplied,
           supplied_availability: [{start: "2026-12-12T10:30:00-07:00", end: "2026-12-12T13:30:00-07:00"}]}
      case_state:
        existing_bookings:
          - {event: B1, candidate: Jonas Weber, interviewer: int_maya, start: "2026-12-12T10:00:00-07:00", end: "2026-12-12T10:20:00-07:00"}
          - {event: B2, candidate: Priscila Gomes, interviewer: int_maya, start: "2026-12-12T10:30:00-07:00", end: "2026-12-12T10:50:00-07:00"}
          - {event: B3, candidate: Hamid Rahimi, interviewer: int_maya, start: "2026-12-12T11:00:00-07:00", end: "2026-12-12T11:20:00-07:00"}
          - {event: B4, candidate: Leilani Kahale, interviewer: int_maya, start: "2026-12-12T11:30:00-07:00", end: "2026-12-12T11:50:00-07:00"}
          - {event: B5, candidate: Oscar Lindqvist, interviewer: int_maya, start: "2026-12-12T13:00:00-07:00", end: "2026-12-12T13:20:00-07:00"}
      conversation:
