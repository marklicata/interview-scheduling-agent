      interviews and caps her at three per day. Two candidates each need 45 minutes on the same afternoon with overlapping
      windows. Only one order works: the first candidate at 14:00-14:15 and the second at 15:00-15:15 starts. The agent
      proposes both as separate per-candidate proposals, each needing confirmation.
