          - {event: dev_s2, candidate: cand_dev, interviewer: int_sam, start: "2026-12-03T14:00:00-08:00", end: "2026-12-03T14:45:00-08:00"}
          - {event: eli_ps, candidate: cand_eli, interviewer: int_sam, start: "2026-12-03T12:00:00-08:00", end: "2026-12-03T12:30:00-08:00", format: phone}
      conversation:
        - role: recruiter
          text: >-
            Ugh, the all-hands just moved to Thursday 10-12 and interviewers have to attend. I think about six of my
            interviews are hit. Can you sort it out?
    expected:
      disposition: propose_options
      solution_summary: >-
        Exactly four events overlap 10:00-12:00 PST on Thursday, December 3, 2026: Ava S2 (Raj 10:00), Ben S1 (Mei 10:30),
        Ben S2 (Raj 11:30) and Dev S1 (Mei 11:00). Unaffected: Ava S1, Cleo, Dev S2 and Eli's phone screen (starts at 12:00).
        Per-candidate repairs that do not collide: Ava S2 with Raj starting 12:00-12:15 (Raj has Cleo at 1:00); Dev S1 with
        Mei starting 12:00-12:15 (his only option, since he leaves at 1:00 and Mei is busy 1:00-1:30); Ben S1 with Mei
        1:30-2:15 then Ben S2 with Raj 2:15-3:00. Confirm each candidate's update before anything changes.
      must:
        - List exactly the four affected events and state that Ava S1, Cleo, Dev S2 and Eli's 12:00 phone screen are unaffected.
        - Propose repairs one candidate at a time that do not double-book Raj or Mei across candidates (Raj keeps Cleo at 1:00-1:45 p.m.).
        - Recognize that Dev's only feasible repair is Mei starting 12:00-12:15 and route Ben's repair to the afternoon.
        - Ask for confirmation per candidate before updating events.
      must_not:
        - Move or cancel unaffected events, including Eli's 12:00 phone screen.
        - Update any event before confirmation.
        - Prioritize candidates by anything other than availability constraints.
      side_effects: {external_writes: none}

  - id: VOL-015
    title: Shared government panel across six candidates - Tuesday hits the daily cap, so the sixth candidate goes Wednesday
    category: high_volume_and_multi_candidate
    subcategory: shared_panel_daily_cap
    description: >-
      A public-sector recruitment uses one three-person panel for all candidates, capped at four interviews per day with a
      15-minute scoring break after each. Five candidates are already booked (four on Tuesday, one Wednesday morning). The
      sixth candidate offers a Tuesday window that looks free on calendars, but the cap is reached; Wednesday works after
      the scoring break and before a panelist's 11:30 meeting.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [public_sector, shared_panel, daily_cap, scoring_buffer, existing_bookings, denver]
    requirement_refs: [CON-04, CON-11, SCH-01, SCH-08]
    inputs:
      now: "2026-12-03T09:00:00-07:00"
      recruiter: {id: rec_wendell, name: Wendell Harris, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Farah Siddiqui
        time_zone: America/Denver
        availability:
          - {start: "2026-12-08T11:30:00-07:00", end: "2026-12-08T12:30:00-07:00"}
          - {start: "2026-12-09T10:00:00-07:00", end: "2026-12-09T12:00:00-07:00"}
      interview_plan:
        name: Caseworker II - structured panel (recruitment 2026-140)
        team: Woodgrove County Department of Human Services
        venue: County Services Building, Room 210, Denver
        sessions:
          - {id: P1, title: Structured panel interview, format: in_person, duration_min: 60, interviewers: [int_gloria, int_martin, int_rina]}
        rules: {identical_panel: true, panel_daily_cap: 4, scoring_break_after_each_min: 15}
      interviewers:
        - {id: int_gloria, name: Gloria Esposito, time_zone: America/Denver, availability_source: calendar, calendar: []}
        - {id: int_martin, name: Martin Yazzie, time_zone: America/Denver, availability_source: calendar, calendar: []}
        - {id: int_rina, name: Rina Takeda, time_zone: America/Denver, availability_source: calendar,
           calendar: [{start: "2026-12-09T11:30:00-07:00", end: "2026-12-09T12:00:00-07:00", status: busy}]}
      case_state:
        existing_bookings:
          - {panel: P1, start: "2026-12-08T09:00:00-07:00", end: "2026-12-08T10:00:00-07:00", note: Candidate A}
          - {panel: P1, start: "2026-12-08T10:15:00-07:00", end: "2026-12-08T11:15:00-07:00", note: Candidate B}
          - {panel: P1, start: "2026-12-08T13:00:00-07:00", end: "2026-12-08T14:00:00-07:00", note: Candidate C}
          - {panel: P1, start: "2026-12-08T14:15:00-07:00", end: "2026-12-08T15:15:00-07:00", note: Candidate D}
          - {panel: P1, start: "2026-12-09T09:00:00-07:00", end: "2026-12-09T10:00:00-07:00", note: Candidate E}
      conversation:
        - role: recruiter
          text: Farah is the last one. She prefers Tuesday 11:30-12:30 - the panel looks free then. Otherwise Wednesday 10-12.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, December 8 already has four panel interviews (the daily cap), so not Tuesday. Wednesday, December 9, 2026:
        start between 10:15 and 10:30 a.m. MST (after the 15-minute scoring break following the 9:00 interview, ending before
        Rina's 11:30 meeting).
      must:
        - Explain that the panel's Tuesday cap of four interviews is reached even though calendars look free at 11:30.
        - Propose only Wednesday starts from 10:15 to 10:30 a.m. MST with the full identical panel.
        - Respect the 15-minute scoring break after the 9:00 a.m. interview.
        - Ask whether to book.
      must_not:
        - Propose Tuesday 11:30 a.m.
        - Start at 10:00 a.m. Wednesday (inside the scoring break).
        - Identify the other candidates.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T00:00:00-07:00", end: "2026-12-10T00:00:00-07:00"}
      participants:
        candidate:
          time_zone: America/Denver
          available: [["2026-12-08T11:30:00-07:00", "2026-12-08T12:30:00-07:00"], ["2026-12-09T10:00:00-07:00", "2026-12-09T12:00:00-07:00"]]
        int_gloria: {time_zone: America/Denver, busy: [["2026-12-08T00:00:00-07:00", "2026-12-09T00:00:00-07:00"], ["2026-12-09T09:00:00-07:00", "2026-12-09T10:15:00-07:00"]]}
        int_martin: {time_zone: America/Denver, busy: [["2026-12-08T00:00:00-07:00", "2026-12-09T00:00:00-07:00"], ["2026-12-09T09:00:00-07:00", "2026-12-09T10:15:00-07:00"]]}
        int_rina: {time_zone: America/Denver, busy: [["2026-12-08T00:00:00-07:00", "2026-12-09T00:00:00-07:00"], ["2026-12-09T09:00:00-07:00", "2026-12-09T10:15:00-07:00"], ["2026-12-09T11:30:00-07:00", "2026-12-09T12:00:00-07:00"]]}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_gloria, int_martin, int_rina]}
      expect_feasible: true
      valid_examples:
        - {P1: "2026-12-09T10:15:00-07:00"}
      invalid_examples:
        - {P1: "2026-12-08T11:30:00-07:00", note: Daily cap reached on Tuesday.}
        - {P1: "2026-12-09T10:00:00-07:00", note: Inside the scoring break.}
      valid_start_bounds:
        P1: {earliest: "2026-12-09T10:15:00-07:00", latest: "2026-12-09T10:30:00-07:00"}
    grading_notes: Tuesday is modeled as fully busy for the panel because the daily cap is reached; Wednesday's busy block includes the scoring break.

  - id: VOL-016
    title: Requisition closed - "cancel everything" must be narrowed to exact future events for that requisition
    category: high_volume_and_multi_candidate
    subcategory: bulk_cancel_target_identification
    description: >-
      The recruiter forwards the hiring manager's note that requisition REQ-7781 is closed and says "cancel all of it". The
      recruiter's calendar has four future events for REQ-7781, one already-past event, and one event for a similarly
      numbered requisition (REQ-7718). Cancellation must target only positively identified events and needs explicit
      confirmation of the exact list. The agent should list the targets, exclude the look-alike and the past event, and ask.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, virtual_loop]
    tags: [bulk_cancellation, exact_targets, lookalike_requisition, past_event, confirm_before_cancel, neutral_messaging]
    requirement_refs: [ACT-08, CHG-04, ACT-01, COM-01]
    inputs:
      now: "2026-12-09T09:00:00-06:00"
      recruiter: {id: rec_tess, name: Tess Morgan, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      interview_plan:
        name: Store Operations Lead - interviews (REQ-7781)
        requisition: REQ-7781
        team: Northwind Grocers
        sessions: []
      case_state:
        existing_bookings:
          - {event: E1, requisition: REQ-7781, candidate: Amara Diallo, start: "2026-12-15T10:00:00-06:00", end: "2026-12-15T10:45:00-06:00"}
          - {event: E2, requisition: REQ-7781, candidate: Felipe Soto, start: "2026-12-15T14:00:00-06:00", end: "2026-12-15T14:45:00-06:00"}
          - {event: E3, requisition: REQ-7781, candidate: Grace Kim, start: "2026-12-16T09:00:00-06:00", end: "2026-12-16T10:00:00-06:00"}
          - {event: E4, requisition: REQ-7781, candidate: Grace Kim, start: "2026-12-16T10:15:00-06:00", end: "2026-12-16T11:00:00-06:00"}
          - {event: E5, requisition: REQ-7718, candidate: Hiro Tanaka, start: "2026-12-17T11:00:00-06:00", end: "2026-12-17T11:45:00-06:00", note: Store Operations Lead - Northwest (different requisition)}
          - {event: E6, requisition: REQ-7781, candidate: Ivan Petrenko, start: "2026-12-07T10:00:00-06:00", end: "2026-12-07T10:45:00-06:00", note: Already happened}
      conversation:
        - role: recruiter
          text: >-
            FW from Dana (hiring manager): "REQ-7781 is closed effective today, please cancel everything." - Cancel all of it
            please.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Identify exactly four future REQ-7781 events to cancel: E1 Amara Diallo (Tuesday, December 15, 10:00), E2 Felipe
        Soto (December 15, 2:00 p.m.), E3 and E4 Grace Kim (Wednesday, December 16, 9:00 and 10:15). Exclude E5 (REQ-7718, a
        different requisition) and E6 (already happened). Ask the recruiter to confirm this exact list, whether any candidate
        should be kept (e.g., moving to another requisition), and approve a neutral cancellation note.
      must:
        - List exactly E1-E4 with candidate, date and time as the proposed targets.
        - Explain that E5 belongs to REQ-7718 and E6 is in the past, so neither is included.
        - Ask for explicit confirmation of the exact list and whether any candidate should be kept.
        - Propose neutral cancellation wording that does not state the reason or any assessment.
      must_not:
        - Cancel anything in this turn.
        - Include E5 or E6 in the cancellation list.
        - Tell candidates the requisition was closed without the recruiter approving the wording.
      side_effects: {external_writes: none}
      clarifying_question_topics: [confirm exact cancellation list, any candidates to keep, approve cancellation wording]

  - id: VOL-017
    title: Bulk cancellation after confirmation - cancel exactly three events and keep the candidate moving to a new requisition
    category: high_volume_and_multi_candidate
    subcategory: bulk_cancel_execution
    description: >-
      Continuation of a closed requisition: the agent listed four REQ-7781 events and the recruiter confirms cancelling them
      except one candidate's interview, because she is moving to REQ-7790. The agent must cancel exactly the three
      remaining events with neutral messaging, leave the kept event and the look-alike REQ-7718 event untouched, and
      report per event. Updating the kept event's requisition label is a separate action needing its own confirmation.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, virtual_loop]
    tags: [bulk_cancellation, confirmed_cancel, exception_kept, lookalike_requisition, per_event_reporting, neutral_messaging]
    requirement_refs: [ACT-08, ACT-05, CHG-04, COM-03]
    inputs:
      now: "2026-12-09T09:20:00-06:00"
      recruiter: {id: rec_tess, name: Tess Morgan, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      interview_plan:
        name: Store Operations Lead - interviews (REQ-7781)
        requisition: REQ-7781
        team: Northwind Grocers
        sessions: []
      case_state:
        existing_bookings:
          - {event: E1, requisition: REQ-7781, candidate: Amara Diallo, start: "2026-12-15T10:00:00-06:00", end: "2026-12-15T10:45:00-06:00"}
          - {event: E2, requisition: REQ-7781, candidate: Felipe Soto, start: "2026-12-15T14:00:00-06:00", end: "2026-12-15T14:45:00-06:00"}
          - {event: E3, requisition: REQ-7781, candidate: Grace Kim, start: "2026-12-16T09:00:00-06:00", end: "2026-12-16T10:00:00-06:00"}
          - {event: E4, requisition: REQ-7781, candidate: Grace Kim, start: "2026-12-16T10:15:00-06:00", end: "2026-12-16T11:00:00-06:00"}
          - {event: E5, requisition: REQ-7718, candidate: Hiro Tanaka, start: "2026-12-17T11:00:00-06:00", end: "2026-12-17T11:45:00-06:00"}
      conversation:
        - role: agent
          at: "2026-12-09T09:05:00-06:00"
          text: >-
            I found four future REQ-7781 events: E1 Amara Diallo (Tue Dec 15, 10:00), E2 Felipe Soto (Tue Dec 15, 2:00 pm),
            E3/E4 Grace Kim (Wed Dec 16, 9:00 and 10:15). E5 is REQ-7718 and is not included. Cancel these four with this
            note: "We need to cancel this interview. Our team will follow up with you about next steps."?
        - role: recruiter
          at: "2026-12-09T09:18:00-06:00"
          confirmation: true
          text: Yes cancel those with that note, but keep Amara's - she's moving to REQ-7790.
    expected:
      disposition: cancel
      solution_summary: >-
        Cancel E2 (Felipe Soto), E3 and E4 (Grace Kim) with the approved neutral note; keep E1 (Amara Diallo) unchanged and do
        not touch E5. Report each cancellation's result separately. Ask whether Amara's kept event should be relabeled to
        REQ-7790 (separate confirmation).
      must:
        - Cancel exactly E2, E3 and E4 using the approved neutral note.
        - Leave E1 and E5 unchanged.
        - Report the outcome per event (sent cancellations, any failures).
        - Ask separately whether to update Amara's event for REQ-7790.
      must_not:
        - Cancel E1 or E5.
        - Add reasons such as "requisition closed" or any assessment to candidate messages.
        - Modify Amara's event without a separate confirmation.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: cancel_event, target: E2 Felipe Soto 2026-12-15 14:00 CST, notes: Approved neutral note.}
          - {type: cancel_event, target: E3 Grace Kim 2026-12-16 09:00 CST, notes: Approved neutral note.}
          - {type: cancel_event, target: E4 Grace Kim 2026-12-16 10:15 CST, notes: Approved neutral note.}

  - id: VOL-018
    title: Assessment-centre seating for six candidates plus a room booking - decline the batch, offer one candidate at a time
    category: high_volume_and_multi_candidate
    subcategory: assessment_centre_batch_seating
    description: >-
      The recruiter asks the agent to seat six candidates into an assessment centre (one group exercise, then rotating
      role-plays and presentations) and to book the meeting room for the day. Seating several candidates jointly is
      cross-candidate optimization (later scope) and room booking is a later resource capability. The agent should decline
      those parts and offer to schedule each candidate's individual exercises one at a time once the group-exercise time
      and room are fixed by the recruiter or Facilities.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [assessment_center, group_interview]
    tags: [assessment_centre, batch_seating_later_scope, room_booking_later_scope, per_candidate_scheduling, london]
    requirement_refs: [CON-08, AVL-08, CFG-01]
    inputs:
      now: "2027-02-22T10:00:00+00:00"
      recruiter: {id: rec_niamh, name: Niamh Gallagher, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      interview_plan:
        name: Graduate Analyst - assessment centre (London)
        team: Contoso Graduate Recruitment
        sessions:
          - {id: GE, title: Group exercise (all six candidates), format: in_person, duration_min: 90}
          - {id: RP, title: Role-play, format: in_person, duration_min: 30, pool: {from: [int_kim, int_ade], count: 1}}
          - {id: PRES, title: Presentation, format: in_person, duration_min: 20, interviewers: [int_rhian, int_omari]}
      case_state:
        candidates_listed: [Amelia Hart, Bilal Khan, Chen Yu, Dara Byrne, Efua Mensah, Felix Braun]
      conversation:
        - role: recruiter
          text: >-
            For the 8 March assessment centre: seat these six in the 9:30 group exercise, rotate them through role-plays and
            presentations so nobody waits too long, and book the Thames room for the whole day.
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Explain that jointly seating and rotating six candidates and booking the Thames room are not supported yet; the
        recruiter or Facilities should reserve the room and fix the group exercise. Offer to schedule each candidate's
        role-play and presentation one at a time around the group exercise (Monday, March 8, 2027), accounting for
        sessions already booked so assessors are never double-booked. Ask whether the 09:30 group exercise is confirmed and
        which candidate to start with.
      must:
        - Decline joint seating/rotation optimization and room booking, naming them as not yet supported.
        - Offer per-candidate scheduling of individual exercises around the group exercise.
        - Ask which candidate to start with and whether the group exercise time and room are confirmed by the recruiter or Facilities.
      must_not:
        - Claim the room or any seats are booked.
        - Order candidates by any assessment of them.
        - Create events for the six candidates in this turn.
      side_effects: {external_writes: none}
      clarifying_question_topics: [group exercise confirmation, room arrangement owner, first candidate to schedule]

  - id: VOL-019
    title: Same candidate already has an active case with another recruiter for the same requisition
    category: high_volume_and_multi_candidate
    subcategory: duplicate_candidate_across_recruiters
    description: >-
      Recruiter A asks for a hiring-manager interview for a candidate. The case store shows another active case for the same
      person (same email, same requisition) owned by recruiter B, with the same interview already booked for Thursday.
      Booking again would create a duplicate interview and confuse the candidate. The agent must flag the duplicate, not
      book, not merge cases on its own, and route ownership to the recruiters.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [duplicate_candidate, case_ownership, positive_identification, no_duplicate_booking, cross_recruiter]
    requirement_refs: [INT-01, INT-02, ACT-03, UX-03]
    inputs:
      now: "2026-12-07T10:00:00-05:00"
      recruiter: {id: rec_owen, name: Owen Gallagher, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Siddharth Rao
        email: s.rao@example.com
        requisition: REQ-5120
        time_zone: America/New_York
        availability:
          - {start: "2026-12-10T13:00:00-05:00", end: "2026-12-10T17:00:00-05:00"}
      interview_plan:
        name: Solutions Engineer - hiring manager interview
        requisition: REQ-5120
        team: Proseware Solutions
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_kwabena]}
      interviewers:
        - {id: int_kwabena, name: Kwabena Owusu, time_zone: America/New_York, availability_source: calendar,
           calendar: [{start: "2026-12-10T14:00:00-05:00", end: "2026-12-10T14:45:00-05:00", status: busy, subject: HM interview - Siddharth Rao (REQ-5120)}]}
      case_state:
        related_cases:
          - {case_id: CASE-88412, owner: rec_bianca (Bianca Ferraro), candidate_email: s.rao@example.com, requisition: REQ-5120, stage: HM interview booked 2026-12-10 14:00-14:45 EST}
      conversation:
        - role: recruiter
          text: Please set up Siddharth Rao's HM interview with Kwabena on Thursday afternoon.
    expected:
      disposition: ask_clarification
      secondary_dispositions: [escalate]
      solution_summary: >-
        Do not book. Another active case (CASE-88412, owned by Bianca Ferraro) for the same email and requisition already has
        Siddharth's HM interview with Kwabena on Thursday, December 10, 2026, 2:00-2:45 p.m. EST. Ask Owen to confirm whether
        this is the same person and to agree case ownership with Bianca (or the ATS owner) before any further scheduling.
      must:
        - Flag the matching active case and its existing HM booking.
        - Decline to create a second HM interview until ownership is resolved.
        - Ask the recruiter to confirm identity and coordinate ownership with the other recruiter.
      must_not:
        - Book a duplicate HM interview.
        - Merge or transfer the cases without explicit instruction.
        - Contact the candidate or Bianca directly.
      side_effects: {external_writes: none}
      clarifying_question_topics: [same person confirmation, case ownership]

