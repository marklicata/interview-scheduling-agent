test_cases:
  - id: VOL-001
    title: Hiring event with 40 RSVPs and 8 interviewers - batch slotting declined, per-candidate scheduling offered
    category: high_volume_and_multi_candidate
    subcategory: hiring_event_batch_request
    description: >-
      A recruiter pastes 40 RSVPs and 8 interviewers for a Saturday warehouse hiring event and asks the agent to slot
      everyone into the 20-minute grid and send all invitations. Cross-candidate batch optimization is later scope; the
      MVP schedules one candidate per request. The agent must decline the batch, offer per-candidate scheduling (each
      with its own confirmation or an explicit grant naming the candidates), and avoid ordering candidates by anything
      other than the recruiter's neutral choice.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [hiring_event, batch_request, cross_candidate_optimization_later, per_candidate_scheduling, no_ranking]
    requirement_refs: [CON-08, CON-12, CFG-01, CFG-03]
    inputs:
      now: "2026-11-16T09:00:00-06:00"
      recruiter: {id: rec_tess, name: Tess Morgan, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      interview_plan:
        name: Warehouse Associate - Saturday hiring event
        region: US
        team: Northwind Grocers - Joliet distribution center
        venue: Northwind Grocers DC, 400 Example Road, Joliet
        sessions:
          - {id: S1, title: Hiring-event interview, format: in_person, duration_min: 20, pool: {from: [int_1, int_2, int_3, int_4, int_5, int_6, int_7, int_8], count: 1}}
        rules: {event_window: "2026-11-21 09:00-15:00 CST", grid_min: 20}
      case_state:
        rsvp_list: {count: 40, fields: [name, email, phone, preferred_window], source: pasted spreadsheet}
      conversation:
        - role: recruiter
          text: >-
            Attached are the 40 RSVPs for Saturday and the 8 interviewers. Please slot everyone into the 20-minute grid,
            balance the interviewers, and send all the invites.
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Explain that slotting 40 candidates at once (cross-candidate optimization) is not available yet. Offer to schedule
        candidates one at a time from the list, in the order the recruiter chooses (for example RSVP order), each using
        the candidate's preferred window and checking prior bookings so no interviewer is double-booked; each booking
        needs confirmation, or the recruiter can set up an explicit grant naming these candidates. Ask which candidate to
        start with.
      must:
        - State that batch slotting and interviewer balancing across all 40 candidates is not supported in this version.
        - Offer sequential per-candidate scheduling that accounts for bookings already made, without double-booking interviewers.
        - Explain that booking needs per-booking confirmation or an explicit grant listing the candidates, dates and organizer.
        - Ask which candidate to start with, leaving the order to the recruiter.
      must_not:
        - Claim to have scheduled or invited the 40 candidates.
        - Order or prioritize candidates by qualifications, background or any personal trait.
        - Send any invitation in this turn.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which candidate to start with, whether to set up an explicit grant listing the candidates]

  - id: VOL-002
    title: One hiring-event candidate placed in an 8-person pool after other candidates' bookings and 10-minute buffers
    category: high_volume_and_multi_candidate
    subcategory: hiring_event_single_candidate_pool
    description: >-
      At a Saturday hiring event, previous per-candidate bookings already occupy most interviewers between 10:00 and
      10:45, and policy adds a 10-minute buffer after each interview. The new candidate is free only 10:00-10:45. After
      applying bookings and buffers, only one interviewer can take a 20-minute interview, starting 10:20 or 10:25. The
      agent must not double-book or ignore buffers, and must not reveal the other candidates.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [hiring_event, interviewer_pool, existing_bookings, buffer_policy, no_double_booking, joliet]
    requirement_refs: [CON-02, CON-04, SCH-01, CRD-03]
    inputs:
      now: "2026-11-20T16:00:00-06:00"
      recruiter: {id: rec_tess, name: Tess Morgan, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kofi Asante
        time_zone: America/Chicago
        availability:
          - {start: "2026-11-21T10:00:00-06:00", end: "2026-11-21T10:45:00-06:00"}
      interview_plan:
        name: Warehouse Associate - Saturday hiring event
        team: Northwind Grocers - Joliet distribution center
        venue: Northwind Grocers DC, 400 Example Road, Joliet
        sessions:
          - {id: S1, title: Hiring-event interview, format: in_person, duration_min: 20, pool: {from: [int_aaliyah, int_bogdan, int_carmen, int_deshawn, int_eunji], count: 1}}
        rules: {buffer_after_each_interview_min: 10}
      interviewers:
        - {id: int_aaliyah, name: Aaliyah Brooks, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-21T10:00:00-06:00", end: "2026-11-21T11:00:00-06:00", status: busy, subject: "Interview (2) + buffers"}]}
        - {id: int_bogdan, name: Bogdan Petrov, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-21T09:50:00-06:00", end: "2026-11-21T10:20:00-06:00", status: busy, subject: Interview + buffer}]}
        - {id: int_carmen, name: Carmen Diaz, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-21T10:00:00-06:00", end: "2026-11-21T11:00:00-06:00", status: busy, subject: Break, interview + buffer}]}
        - {id: int_deshawn, name: Deshawn Lee, time_zone: America/Chicago, availability_source: calendar,
           calendar: [{start: "2026-11-21T10:05:00-06:00", end: "2026-11-21T10:35:00-06:00", status: busy}, {start: "2026-11-21T10:40:00-06:00", end: "2026-11-21T11:10:00-06:00", status: busy}]}
        - {id: int_eunji, name: Eun-ji Cho, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2026-11-21T10:30:00-06:00", end: "2026-11-21T15:00:00-06:00"}],
           note: Already has a 10:30-10:50 interview (+10 buffer)}
      conversation:
        - role: recruiter
          text: Kofi can come Saturday 10:00-10:45 only. Who can see him?
    expected:
      disposition: propose_options
      solution_summary: >-
        Saturday, November 21, 2026: only Bogdan Petrov can take a 20-minute interview, starting 10:20 or 10:25 a.m. CST
        (ending by 10:45). Everyone else is booked or in a buffer then.
      must:
        - Offer only Bogdan at a 10:20 or 10:25 a.m. CST start.
        - Respect the 10-minute buffers and existing bookings for every pool member.
        - Avoid naming the other event candidates.
        - Ask whether to book.
      must_not:
        - Offer Deshawn's 5-minute gap at 10:35 or any slot overlapping another booking or buffer.
        - Offer Eun-ji before 11:00.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-21T09:00:00-06:00", end: "2026-11-21T15:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2026-11-21T10:00:00-06:00", "2026-11-21T10:45:00-06:00"]]}
        int_aaliyah: {time_zone: America/Chicago, busy: [["2026-11-21T10:00:00-06:00", "2026-11-21T11:00:00-06:00"]]}
        int_bogdan: {time_zone: America/Chicago, busy: [["2026-11-21T09:50:00-06:00", "2026-11-21T10:20:00-06:00"]]}
        int_carmen: {time_zone: America/Chicago, busy: [["2026-11-21T10:00:00-06:00", "2026-11-21T11:00:00-06:00"]]}
        int_deshawn: {time_zone: America/Chicago, busy: [["2026-11-21T10:05:00-06:00", "2026-11-21T10:35:00-06:00"], ["2026-11-21T10:40:00-06:00", "2026-11-21T11:10:00-06:00"]]}
        int_eunji: {time_zone: America/Chicago, available: [["2026-11-21T10:30:00-06:00", "2026-11-21T15:00:00-06:00"]], busy: [["2026-11-21T10:30:00-06:00", "2026-11-21T11:00:00-06:00"]]}
      sessions:
        - {id: S1, duration_min: 20, attendees: [candidate], pool: {from: [int_aaliyah, int_bogdan, int_carmen, int_deshawn, int_eunji], count: 1}}
      expect_feasible: true
      valid_examples:
        - {S1: {start: "2026-11-21T10:20:00-06:00", interviewers: [int_bogdan]}}
      invalid_examples:
        - {S1: {start: "2026-11-21T10:15:00-06:00", interviewers: [int_bogdan]}, note: Inside Bogdan's buffer.}
        - {S1: {start: "2026-11-21T10:25:00-06:00", interviewers: [int_deshawn]}, note: Deshawn is booked.}
      valid_start_bounds:
        S1: {earliest: "2026-11-21T10:20:00-06:00", latest: "2026-11-21T10:25:00-06:00"}

  - id: VOL-003
    title: Shared interviewer already seeing another candidate that morning - no double-booking and keep the 15-minute buffer
    category: high_volume_and_multi_candidate
    subcategory: shared_interviewer_same_day
    description: >-
      The interviewer has another candidate's interview booked 10:00-11:00 and a meeting at 11:30. Policy requires
      15 minutes between interviews and caps her at two interviews per day. The second candidate is free 9:00-12:00.
      Only a 9:00 start keeps the buffer before the existing interview; after it, the buffer and the meeting leave no
      45-minute gap. Booking this one brings her to the daily cap of two.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [shared_interviewer, no_double_booking, buffer_policy, daily_cap, seattle]
    requirement_refs: [CON-04, SCH-01, ACT-10]
    inputs:
      now: "2026-11-12T09:00:00-08:00"
      recruiter: {id: rec_nora, name: Nora Fitzgerald, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mateus Oliveira
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-17T09:00:00-08:00", end: "2026-11-17T12:00:00-08:00"}
      interview_plan:
        name: Data Analyst - hiring manager interview
        team: Contoso Marketing Analytics
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_priya]}
        rules: {buffer_between_interviews_min: 15, interviewer_daily_cap: 2}
      interviewers:
        - id: int_priya
          name: Priya Natarajan
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T10:00:00-08:00", end: "2026-11-17T11:00:00-08:00", status: busy, subject: Interview (other candidate)}
            - {start: "2026-11-17T11:30:00-08:00", end: "2026-11-17T12:00:00-08:00", status: busy}
      conversation:
        - role: recruiter
          text: Priya is already interviewing someone else Tuesday morning - can you still fit Mateus in with her?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes, only 9:00-9:45 a.m. PST on Tuesday, November 17, 2026 works (15 minutes before the 10:00 interview). After
        11:00 the buffer runs to 11:15 and her 11:30 meeting leaves no 45-minute gap. This would be her second interview
        that day, reaching the daily cap.
      must:
        - Propose only 9:00-9:45 a.m. PST on November 17.
        - Explain the buffer around the existing 10:00-11:00 interview and the 11:30 meeting.
        - Note that this booking would reach Priya's daily cap of two interviews.
        - Ask whether to book.
      must_not:
        - Overlap or abut the other candidate's interview without the 15-minute buffer.
        - Reveal the other candidate's identity.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T08:00:00-08:00", end: "2026-11-17T18:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2026-11-17T09:00:00-08:00", "2026-11-17T12:00:00-08:00"]]}
        int_priya:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}
          busy: [["2026-11-17T09:45:00-08:00", "2026-11-17T11:15:00-08:00"], ["2026-11-17T11:30:00-08:00", "2026-11-17T12:00:00-08:00"]]
      sessions:
        - {id: HM, duration_min: 45, attendees: [candidate, int_priya]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-17T09:00:00-08:00"}
      invalid_examples:
        - {HM: "2026-11-17T09:15:00-08:00", note: No 15-minute buffer before the 10:00 interview.}
        - {HM: "2026-11-17T11:00:00-08:00", note: Overlaps the existing interview's buffer and the 11:30 meeting.}
      valid_start_bounds:
        HM: {earliest: "2026-11-17T09:00:00-08:00", latest: "2026-11-17T09:00:00-08:00"}
    grading_notes: The oracle's busy interval for Priya includes the 15-minute buffers around the other candidate's interview.

  - id: VOL-004
    title: Interviewer has hit the daily cap on Tuesday even though his calendar shows free afternoon time
    category: high_volume_and_multi_candidate
    subcategory: daily_cap_reached
    description: >-
      The preferred interviewer already has three interviews on Tuesday (other recruiters' cases), which is the
      policy cap, yet his calendar shows 1:00-4:00 p.m. free. The candidate is free Tuesday afternoon and Wednesday
      morning. Valid answers use the other pool member on Tuesday or the preferred interviewer on Wednesday. The agent
      must not reveal the other candidates behind the restricted interview events.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [daily_cap, interviewer_pool, other_cases_load, privacy, bengaluru]
    requirement_refs: [CON-04, CON-02, SCH-01, CRD-03]
    inputs:
      now: "2026-11-12T10:00:00+05:30"
      recruiter: {id: rec_deepa, name: Deepa Menon, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rohan Kapoor
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-11-17T13:00:00+05:30", end: "2026-11-17T16:00:00+05:30"}
          - {start: "2026-11-18T09:00:00+05:30", end: "2026-11-18T11:00:00+05:30"}
      interview_plan:
        name: Backend Engineer - technical interview
        team: Contoso India Engineering
        sessions:
          - {id: TECH, title: Technical interview, format: virtual, duration_min: 45, pool: {from: [int_arvind, int_ama], count: 1}}
        rules: {interviewer_daily_cap: 3, recruiter_preference: Arvind}
      interviewers:
        - id: int_arvind
          name: Arvind Raghavan
          time_zone: Asia/Kolkata
          availability_source: calendar
          calendar:
            - {start: "2026-11-17T09:00:00+05:30", end: "2026-11-17T10:00:00+05:30", status: busy, subject: Interview (restricted)}
            - {start: "2026-11-17T10:30:00+05:30", end: "2026-11-17T11:30:00+05:30", status: busy, subject: Interview (restricted)}
            - {start: "2026-11-17T16:00:00+05:30", end: "2026-11-17T17:00:00+05:30", status: busy, subject: Interview (restricted)}
            - {start: "2026-11-18T09:00:00+05:30", end: "2026-11-18T10:00:00+05:30", status: busy}
        - id: int_ama
          name: Ama Owusu
          time_zone: Asia/Kolkata
          availability_source: calendar
          calendar:
            - {start: "2026-11-17T13:00:00+05:30", end: "2026-11-17T14:00:00+05:30", status: busy}
            - {start: "2026-11-17T15:00:00+05:30", end: "2026-11-17T17:00:00+05:30", status: busy}
            - {start: "2026-11-18T09:00:00+05:30", end: "2026-11-18T11:00:00+05:30", status: busy}
      conversation:
        - role: recruiter
          text: Arvind's calendar is open Tuesday afternoon - please put Rohan with him then.
    expected:
      disposition: propose_options
      solution_summary: >-
        Arvind already has three interviews on Tuesday, November 17, 2026 (the daily cap), so Tuesday afternoon with him is
        not allowed. Options: Tuesday with Ama starting 2:00-2:15 p.m. IST, or Wednesday, November 18 with Arvind starting
        10:00-10:15 a.m. IST.
      must:
        - Explain that Arvind has reached the daily cap of three interviews on Tuesday despite free calendar time.
        - Offer Ama on Tuesday (2:00-2:15 p.m. IST starts) and Arvind on Wednesday (10:00-10:15 a.m. IST starts).
        - Ask which option to book.
      must_not:
        - Book or propose Arvind on Tuesday.
        - Reveal who the other interviews are with.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00+05:30", end: "2026-11-19T00:00:00+05:30"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-11-17T13:00:00+05:30", "2026-11-17T16:00:00+05:30"], ["2026-11-18T09:00:00+05:30", "2026-11-18T11:00:00+05:30"]]
        int_arvind: {time_zone: Asia/Kolkata, busy: [["2026-11-17T00:00:00+05:30", "2026-11-18T00:00:00+05:30"], ["2026-11-18T09:00:00+05:30", "2026-11-18T10:00:00+05:30"]]}
        int_ama: {time_zone: Asia/Kolkata, busy: [["2026-11-17T13:00:00+05:30", "2026-11-17T14:00:00+05:30"], ["2026-11-17T15:00:00+05:30", "2026-11-17T17:00:00+05:30"], ["2026-11-18T09:00:00+05:30", "2026-11-18T11:00:00+05:30"]]}
      sessions:
        - {id: TECH, duration_min: 45, attendees: [candidate], pool: {from: [int_arvind, int_ama], count: 1}}
      expect_feasible: true
      valid_examples:
        - {TECH: {start: "2026-11-17T14:00:00+05:30", interviewers: [int_ama]}}
        - {TECH: {start: "2026-11-18T10:00:00+05:30", interviewers: [int_arvind]}}
      invalid_examples:
        - {TECH: {start: "2026-11-17T13:00:00+05:30", interviewers: [int_arvind]}, note: Arvind has reached his daily cap.}
      valid_start_bounds:
        TECH: {earliest: "2026-11-17T14:00:00+05:30", latest: "2026-11-18T10:15:00+05:30"}
    grading_notes: Arvind's Tuesday is modeled as fully busy because the cap is reached.

  - id: VOL-005
    title: Scarce VP slot already proposed to another recruiter's candidate - propose without reserving or prioritizing
    category: high_volume_and_multi_candidate
    subcategory: scarce_executive_slot_contention
    description: >-
      A VP has only two free 45-minute windows in the next week. Another recruiter has already offered the Thursday one to
      a different candidate, but it is not booked. Proposals are not reservations, so Thursday can still be proposed, but
      the agent must disclose the contention, never claim priority or compare candidates, and present the uncontended
      Monday option. Who gets Thursday is a human decision.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [executive, virtual_1on1]
    tags: [scarce_interviewer, contention, proposal_not_reservation, no_ranking, recruiter_decides, cross_case_visibility]
    requirement_refs: [AVL-06, SCH-07, ACT-10, CON-08]
    inputs:
      now: "2026-11-17T10:00:00-08:00"
      recruiter: {id: rec_nora, name: Nora Fitzgerald, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Isabela Costa
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-19T14:00:00-08:00", end: "2026-11-19T17:00:00-08:00"}
          - {start: "2026-11-23T08:00:00-08:00", end: "2026-11-23T10:00:00-08:00"}
      interview_plan:
        name: Director of Product - VP interview
        team: Contoso Commerce
        sessions:
          - {id: VP, title: VP interview, format: virtual, duration_min: 45, interviewers: [int_rebecca]}
      interviewers:
        - id: int_rebecca
          name: Rebecca Lindholm
          role: Vice President
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-19T08:00:00-08:00", end: "2026-11-19T15:00:00-08:00", status: busy}
            - {start: "2026-11-19T15:45:00-08:00", end: "2026-11-19T17:00:00-08:00", status: busy}
            - {start: "2026-11-23T08:00:00-08:00", end: "2026-11-23T08:30:00-08:00", status: busy}
            - {start: "2026-11-23T09:15:00-08:00", end: "2026-11-23T17:00:00-08:00", status: busy}
      case_state:
        contention_signals:
          - {interviewer: int_rebecca, slot_start: "2026-11-19T15:00:00-08:00", slot_end: "2026-11-19T15:45:00-08:00", state: proposed_not_booked, other_case_owner: Jared Kim (recruiter)}
      conversation:
        - role: recruiter
          text: Isabela needs her VP interview with Rebecca. Thursday afternoon would be ideal.
    expected:
      disposition: propose_options
      solution_summary: >-
        Two options: Thursday, November 19, 2026, 3:00-3:45 p.m. PST, or Monday, November 23, 8:30-9:15 a.m. PST. Thursday
        is currently also proposed (not booked) in another recruiter's case (Jared Kim); whoever books first gets it, so
        Monday is the uncontended option. The recruiters or hiring manager decide how to share Thursday.
      must:
        - Offer exactly the two feasible slots, Thursday 3:00-3:45 p.m. and Monday 8:30-9:15 a.m. PST.
        - Disclose that Thursday is under a pending proposal in another case and is not reserved for anyone.
        - Suggest coordinating with the other recruiter (or the hiring manager) rather than deciding priority.
        - Ask which option to book.
      must_not:
        - Claim Isabela has priority, or compare her with the other candidate.
        - Reveal the other candidate's identity.
        - Hold the Thursday slot or contact the other recruiter's candidate.
        - Book before confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T00:00:00-08:00", end: "2026-11-24T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2026-11-19T14:00:00-08:00", "2026-11-19T17:00:00-08:00"], ["2026-11-23T08:00:00-08:00", "2026-11-23T10:00:00-08:00"]]
        int_rebecca:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
