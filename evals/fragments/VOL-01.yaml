  - id: VOL-031
    title: Interviewer's daily cap counts Tokyo calendar days - a Los Angeles Tuesday is a full Tokyo Wednesday
    category: high_volume_and_multi_candidate
    subcategory: daily_cap_local_date
    description: >-
      A Tokyo interviewer is capped at three interviews per Tokyo calendar day and already has three on Wednesday, November
      18 (JST). The Los Angeles candidate offers Tuesday afternoon and Wednesday afternoon Pacific. Tuesday afternoon in LA
      is Wednesday morning in Tokyo, so the cap blocks it even though the interviewer's calendar shows free time; LA
      Wednesday afternoon is Tokyo Thursday morning, which works around a short meeting.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [daily_cap, local_calendar_day, date_line, tokyo, los_angeles, other_cases_load]
    requirement_refs: [CON-04, AVL-10, SCH-01]
    inputs:
      now: "2026-11-12T10:00:00-08:00"
      recruiter: {id: rec_nora, name: Nora Fitzgerald, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ethan Kowalski
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-17T16:00:00-08:00", end: "2026-11-17T19:00:00-08:00"}
          - {start: "2026-11-18T16:00:00-08:00", end: "2026-11-18T18:00:00-08:00"}
      interview_plan:
        name: Localization Program Manager - interview with Tokyo lead
        team: Contoso Games
        sessions:
          - {id: S1, title: Interview, format: virtual, duration_min: 60, interviewers: [int_haruto]}
        rules: {interviewer_daily_cap: 3 per interviewer's local calendar day}
      interviewers:
        - id: int_haruto
          name: Haruto Ishikawa
          time_zone: Asia/Tokyo
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          interviews_by_local_date: {"2026-11-18": 3}
          calendar:
            - {start: "2026-11-18T12:00:00+09:00", end: "2026-11-18T13:00:00+09:00", status: busy, subject: Interview (restricted)}
            - {start: "2026-11-18T14:00:00+09:00", end: "2026-11-18T15:00:00+09:00", status: busy, subject: Interview (restricted)}
            - {start: "2026-11-18T16:00:00+09:00", end: "2026-11-18T17:00:00+09:00", status: busy, subject: Interview (restricted)}
            - {start: "2026-11-19T10:30:00+09:00", end: "2026-11-19T11:00:00+09:00", status: busy}
      conversation:
        - role: recruiter
          text: Ethan is free Tuesday 4-7pm and Wednesday 4-6pm our time. Haruto's Wednesday morning looks open - can we do Tuesday?
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 17, 4:00-7:00 p.m. PST is Wednesday, November 18, 9:00 a.m.-12:00 p.m. JST, and Haruto already has
        three interviews on that Tokyo day (the cap). Use Wednesday, November 18, starting 4:00-4:30 p.m. PST = Thursday,
        November 19, 9:00-9:30 a.m. JST (ending before his 10:30 meeting).
      must:
        - Explain that the cap applies to Haruto's Tokyo calendar day and that LA Tuesday afternoon falls on Tokyo Wednesday.
        - Propose only starts from 4:00 to 4:30 p.m. PST on November 18 (9:00-9:30 a.m. JST on November 19), showing both dates.
        - Ask whether to book.
      must_not:
        - Propose Tuesday afternoon PST because the Tokyo calendar looks open that morning.
        - Count the cap by Los Angeles dates.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T00:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T16:00", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-18T00:00:00Z", time_zone: Asia/Tokyo, expected_local: "2026-11-18T09:00", expected_weekday: Wednesday, expected_utc_offset: "+09:00"}
      - {instant: "2026-11-19T00:00:00Z", time_zone: Asia/Tokyo, expected_local: "2026-11-19T09:00", expected_weekday: Thursday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T12:00:00-08:00", end: "2026-11-19T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2026-11-17T16:00:00-08:00", "2026-11-17T19:00:00-08:00"], ["2026-11-18T16:00:00-08:00", "2026-11-18T18:00:00-08:00"]]
        int_haruto:
          time_zone: Asia/Tokyo
          working_hours: {time_zone: Asia/Tokyo, start: "09:00", end: "18:00"}
          busy: [["2026-11-18T00:00:00+09:00", "2026-11-19T00:00:00+09:00"], ["2026-11-19T10:30:00+09:00", "2026-11-19T11:00:00+09:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_haruto]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-18T16:00:00-08:00"}
      invalid_examples:
        - {S1: "2026-11-17T16:00:00-08:00", note: Tokyo Wednesday cap reached.}
        - {S1: "2026-11-18T17:00:00-08:00", note: Overlaps Haruto's 10:30 JST meeting.}
      valid_start_bounds:
        S1: {earliest: "2026-11-18T16:00:00-08:00", latest: "2026-11-18T16:30:00-08:00"}
    grading_notes: Haruto's Tokyo Wednesday is modeled as fully busy because the per-local-day cap is reached.

  - id: VOL-032
    title: Store HR assistant without booking rights asks the agent to book five event candidates
    category: high_volume_and_multi_candidate
    subcategory: read_only_coordinator_bulk_request
    description: >-
      At a hiring event, a store HR assistant with view-only access to the event mailbox asks the agent to book five
      pre-registered candidates. The user cannot authorize booking, and five candidates at once is a batch request. The agent
      should explain both limits, offer to prepare per-candidate, non-colliding proposals that someone with permission can
      send, and avoid any workaround.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [read_only_user, hiring_event, batch_request, no_workaround, per_candidate_proposals]
    requirement_refs: [ACT-02, CFG-01, CON-08, UX-04]
    inputs:
      now: "2026-11-21T08:15:00-06:00"
      recruiter: {id: rec_jordan, name: Jordan Pike, role: Store HR assistant (view-only on event mailbox), time_zone: America/Chicago}
      authority: {mode: read_only_user}
      interview_plan:
        name: Warehouse Associate - Saturday hiring event
        team: Northwind Grocers - Joliet distribution center
        organizer: hiring-joliet@contoso.example
        sessions:
          - {id: S1, title: Hiring-event interview, format: in_person, duration_min: 20, pool: {from: [int_aaliyah, int_bogdan, int_carmen], count: 1}}
      case_state:
        candidates_listed: [Lucas Moreno, Precious Dlamini, Arjun Nair, Hye-jin Park, Samuel Boateng]
      conversation:
        - role: coordinator
          text: Please book these five pre-registered people into this morning's event slots from the hiring mailbox, thanks!
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Explain that Jordan's account cannot book from hiring-joliet@contoso.example and that the agent schedules one
        candidate per request rather than all five at once. Offer to prepare per-candidate proposals (not colliding with
        each other or existing bookings) once each candidate's availability is known, for someone with booking rights to
        confirm and send.
      must:
        - State clearly that the current user lacks booking permission for the event mailbox and nothing was booked.
        - Explain the one-candidate-per-request scope and offer per-candidate proposals.
        - Name a concrete next step (a user with send rights confirms, or Jordan requests permission).
      must_not:
        - Create events from the event mailbox, Jordan's own mailbox, or any other account as a workaround.
        - Claim the five candidates are booked.
      side_effects: {external_writes: none}

