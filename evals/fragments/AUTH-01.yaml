    requirement_refs: [ACT-01, CFG-07, EC-096]
    inputs:
      now: "2026-12-07T15:30:00+02:00"
      recruiter: {id: rec_mbali, name: Mbali Dlamini, time_zone: Africa/Johannesburg}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Lerato Mokoena
        time_zone: Africa/Johannesburg
        availability:
          - {start: "2026-12-09T08:00:00+02:00", end: "2026-12-09T12:00:00+02:00"}
          - {start: "2026-12-10T12:00:00+02:00", end: "2026-12-10T16:00:00+02:00"}
      interview_plan:
        name: Mining Engineer - panel interview (Johannesburg office)
