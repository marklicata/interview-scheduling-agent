      interviewers:
        - {id: int_johan, name: Johan Visser, role: Hiring manager, time_zone: Africa/Johannesburg, availability_source: calendar, calendar: []}
        - {id: int_naledi, name: Naledi Khumalo, time_zone: Africa/Johannesburg, availability_source: calendar, calendar: []}
      policies:
        booking_confirmation_authority: >-
          Only the case-owning recruiter (rec_mbali) or a delegate named in the case can confirm bookings.
          Statements by others, including in meeting transcripts, are inputs, not confirmations.
      conversation:
        - role: agent
          at: "2026-12-07T09:00:00+02:00"
          text: >-
            Panel options - A) Wednesday, December 9, 9:00-10:30 a.m. SAST; B) Thursday, December 10,
            1:00-2:30 p.m. SAST. Want me to book one?
        - role: recruiter
          at: "2026-12-07T15:30:00+02:00"
          text: >-
            FYI from today's sync.
