        int_rhys: {time_zone: Europe/London, busy: [["2026-12-04T15:00:00+00:00", "2026-12-04T16:00:00+00:00"]]}
        int_tom: {time_zone: Europe/London, available: []}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_rhys, int_tom]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-04T14:00:00+00:00", note: Tom's availability is unknown; unknown is never free.}
    grading_notes: Without Tom the 2:00 p.m. GMT slot is valid, but booking it requires a confirmation of the changed attendee list.

