  - id: TZ-901
    title: US/Europe daylight-saving mismatch week makes New York and London four hours apart
    category: cross_timezone
    subcategory: dst_mismatch_window
    description: >-
      On Monday, March 22, 2027, New York has moved to daylight time but London has not, so the usual
      five-hour difference is temporarily four hours. A naive fixed offset finds no overlap; the correct
      calculation finds exactly one hour.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [dst_mismatch, new_york, london, fixed_offset_trap, exemplar]
    requirement_refs: [AVL-10, AVL-12, SCH-01]
    inputs:
      now: "2027-03-15T09:00:00-04:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Grace Liu
        time_zone: America/New_York
        availability:
          - {start: "2027-03-22T09:00:00-04:00", end: "2027-03-22T10:00:00-04:00"}
      interview_plan:
        name: Risk Analyst - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_oliver]}
      interviewers:
        - id: int_oliver
          name: Oliver Grant
          time_zone: Europe/London
          availability_source: supplied
          supplied_availability:
            - {start: "2027-03-22T13:00:00+00:00", end: "2027-03-22T14:00:00+00:00"}
      conversation:
        - role: recruiter
          text: Oliver says he's free 1-2 pm London time on Monday, March 22. Grace can do 9-10 am New York time that day. Does that work?
    expected:
      disposition: propose_options
      solution_summary: Yes. 1:00-2:00 p.m. GMT is 9:00-10:00 a.m. EDT on Monday, March 22, 2027.
      must:
        - Confirm the exact one-hour overlap, 9:00-10:00 a.m. EDT = 1:00-2:00 p.m. GMT.
        - Explain that New York and London are four hours apart that week because their daylight-saving changes differ.
        - Ask whether to book it.
      must_not:
        - Say there is no overlap because of an assumed five-hour difference.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-22T13:00:00Z", time_zone: America/New_York, expected_local: "2027-03-22T09:00", expected_weekday: Monday, expected_utc_offset: "-04:00"}
