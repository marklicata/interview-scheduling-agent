  - id: INF-010
    title: Distinct-interviewer rule with only one certified interviewer for two sessions
    category: infeasible_and_limits
    subcategory: distinct_interviewer_shortage
    description: >-
      Two coding sessions each require a Rust-certified interviewer and must be run by different people, but only
      one certified interviewer exists. Time is plentiful. The agent must explain the qualified-interviewer shortage
      rather than reuse the same person or use an uncertified colleague.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_loop]
    tags: [distinct_interviewers, qualified_pool_shortage, france, plan_owner_decision]
    requirement_refs: [CON-02, GS-007, EC-039]
    inputs:
