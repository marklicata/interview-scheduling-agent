      - {instant: "2027-03-29T12:00:00Z", time_zone: America/New_York, expected_local: "2027-03-29T08:00", expected_utc_offset: "-04:00"}
      - {instant: "2027-03-22T13:00:00Z", time_zone: America/New_York, expected_local: "2027-03-22T09:00", expected_weekday: Monday}
      - {local: "2027-03-28T01:30", time_zone: Europe/London, expect: nonexistent}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-29T00:00:00Z", end: "2027-03-30T00:00:00Z"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2027-03-29T13:00:00+01:00", "2027-03-29T14:00:00+01:00"]]}
        int_ruth:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_ruth]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2027-03-29T13:00:00+01:00", note: This is 8:00 a.m. EDT - before Ruth's working hours.}

