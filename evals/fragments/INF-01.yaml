  - id: INF-021
    title: Only overlap needs a policy exception - route to the named owner and do not book on a promise
    category: infeasible_and_limits
    subcategory: policy_exception_required
    description: >-
      Store-colleague interviews must finish by 18:00 under a union agreement. The candidate is free only from 17:30,
      so a 45-minute interview cannot finish by 18:00. The recruiter asks the agent to book 18:00 now and get the
      Regional HR Director's sign-off afterwards. The agent must route the exception and not book on a promised
      future approval.
