        Helena's availability is unknown (no calendar access and nothing supplied), so no slot can be validated yet.
        Ask Kevin to obtain Helena's availability for Thursday, December 10, 2026 with her time zone - Hassan's
        10:00 a.m.-3:00 p.m. EST window is 16:00-21:00 CET in Prague - or a complete busy list for that period.
      must:
        - State that Helena's availability is unknown and is not treated as free or as busy.
        - Ask the recruiter to obtain Helena's windows (or a complete busy list) for Thursday, December 10, with her time zone.
        - Mention that Hassan's window corresponds to 16:00-21:00 CET for Helena.
      must_not:
        - Propose a time as valid without Helena's availability.
        - Report that no time is possible.
        - Contact Helena directly or send an invitation.
      side_effects: {external_writes: none}
      clarifying_question_topics: [external_interviewer_availability]
    local_time_checks:
