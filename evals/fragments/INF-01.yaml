# Infeasible and limits cases (INF-001..INF-026): proven infeasibility, missing info vs inaccessible data,
# contradictory constraints, policy limits, and concrete next steps.
test_cases:
  - id: INF-001
    title: No overlap at all between a Lagos candidate and a Johannesburg interviewer
    category: infeasible_and_limits
    subcategory: no_overlap
    description: >-
      The candidate offers afternoons in Lagos (UTC+1); the interviewer supplied complete morning availability in
      Johannesburg (UTC+2). After conversion the windows do not touch on either day. The agent must prove there is
      no overlap, explain why with both zones, and give recruiter-owned next steps instead of inventing a slot.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [no_overlap, supplied_availability, nigeria, south_africa, next_steps]
    requirement_refs: [SCH-05, SCH-04, AVL-12, GS-003]
    inputs:
      now: "2026-11-12T09:00:00+01:00"
      recruiter: {id: rec_chiamaka, name: Chiamaka Eze, time_zone: Africa/Lagos}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tunde Bakare
        time_zone: Africa/Lagos
        availability:
          - {start: "2026-11-17T14:00:00+01:00", end: "2026-11-17T16:00:00+01:00"}
          - {start: "2026-11-18T14:00:00+01:00", end: "2026-11-18T16:00:00+01:00"}
      interview_plan:
        name: Fabrikam Regional Sales Lead - sales interview
        sessions:
          - {id: S1, title: Sales interview, format: virtual, duration_min: 45, interviewers: [int_lerato]}
      interviewers:
        - id: int_lerato
          name: Lerato Mokoena
          time_zone: Africa/Johannesburg
          availability_source: supplied
          supplied_availability:
            - {start: "2026-11-17T09:00:00+02:00", end: "2026-11-17T12:00:00+02:00"}
            - {start: "2026-11-18T09:00:00+02:00", end: "2026-11-18T12:00:00+02:00"}
          supplied_scope: Complete availability for November 17-18; she is unavailable at all other times those days.
      conversation:
        - role: recruiter
          text: Tunde is free Tue/Wed 2-4pm Lagos time. Lerato sent 9-12 Joburg time both days. Can you match them?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        No overlap. Lerato's 9:00 a.m.-12:00 p.m. SAST equals 8:00-11:00 a.m. WAT, while Tunde is free 2:00-4:00 p.m.
        WAT (3:00-5:00 p.m. SAST) on Tuesday, November 17 and Wednesday, November 18, 2026. Next steps - ask Tunde for
        a morning window between 8:00 and 11:00 a.m. WAT, or have the recruiter ask Lerato for afternoon time.
      must:
        - State that no 45-minute slot exists on November 17 or 18 and show both windows in WAT and SAST.
        - Explain the one-hour offset between Lagos and Johannesburg.
        - Offer concrete next steps - ask Tunde for 8:00-11:00 a.m. WAT availability, or the recruiter asks Lerato for 3:00-5:00 p.m. SAST.
      must_not:
        - Propose or book any time, e.g. 2:00 p.m. WAT, that is outside Lerato's supplied windows.
        - Treat Lerato's supplied hours as Lagos time.
        - Contact Lerato or the candidate directly.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T13:00:00Z", time_zone: Africa/Lagos, expected_local: "2026-11-17T14:00", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-17T13:00:00Z", time_zone: Africa/Johannesburg, expected_local: "2026-11-17T15:00", expected_utc_offset: "+02:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00+01:00", end: "2026-11-19T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Africa/Lagos
          available: [["2026-11-17T14:00:00+01:00", "2026-11-17T16:00:00+01:00"], ["2026-11-18T14:00:00+01:00", "2026-11-18T16:00:00+01:00"]]
        int_lerato:
          time_zone: Africa/Johannesburg
          available: [["2026-11-17T09:00:00+02:00", "2026-11-17T12:00:00+02:00"], ["2026-11-18T09:00:00+02:00", "2026-11-18T12:00:00+02:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_lerato]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-11-17T14:00:00+01:00", note: Lerato's supplied window ended at 11:00 WAT.}
        - {S1: "2026-11-17T10:00:00+01:00", note: Inside Lerato's window but outside Tunde's.}

  - id: INF-002
    title: Overlap of 40 minutes cannot hold a 45-minute interview
    category: infeasible_and_limits
    subcategory: overlap_shorter_than_duration
    description: >-
      A Chicago candidate is free from 3:20 p.m. CST and a New York interviewer works until 5:00 p.m. EST (4:00 p.m.
      CST), leaving a 40-minute overlap for a 45-minute interview. Tempting wrong answers are to start at 3:20 and run
      five minutes past working hours, or to shorten the interview silently.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [overlap_too_short, working_hours, no_silent_shortening, two_time_zones]
    requirement_refs: [SCH-05, SCH-01, INV-02]
    inputs:
      now: "2026-11-16T10:00:00-05:00"
      recruiter: {id: rec_dmitri, name: Dmitri Volkov, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Keisha Reynolds
        time_zone: America/Chicago
        availability:
          - {start: "2026-11-18T15:20:00-06:00", end: "2026-11-18T17:00:00-06:00"}
      interview_plan:
        name: Woodgrove Compliance Analyst - interview
        sessions:
          - {id: S1, title: Compliance interview, format: virtual, duration_min: 45, interviewers: [int_hector]}
      interviewers:
        - id: int_hector
          name: Hector Morales
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar: []
      conversation:
        - role: recruiter
          text: Keisha can only do Wednesday from 3:20 her time (Chicago). Hector's afternoon is clear. Can we squeeze it in?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        Not on Wednesday, November 18, 2026 - the overlap is 3:20-4:00 p.m. CST (4:20-5:00 p.m. EST), only 40 minutes
        for a 45-minute interview. Next steps - Keisha starting by 3:15 p.m. CST, Hector explicitly agreeing to run to
        5:05 p.m. EST, or another day.
      must:
        - State the overlap as 3:20-4:00 p.m. CST (4:20-5:00 p.m. EST), 40 minutes, versus a 45-minute requirement.
        - Offer next steps - an earlier start from Keisha, an explicit after-hours agreement from Hector via the recruiter, or other days.
        - Keep the plan's 45-minute duration unless an authorized plan change is made.
      must_not:
        - Propose 3:20-4:05 p.m. CST as if valid.
        - Shorten the interview to 40 minutes without an authorized plan change.
        - Book anything.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T21:20:00Z", time_zone: America/Chicago, expected_local: "2026-11-18T15:20", expected_weekday: Wednesday, expected_utc_offset: "-06:00"}
      - {instant: "2026-11-18T21:20:00Z", time_zone: America/New_York, expected_local: "2026-11-18T16:20", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T00:00:00-06:00", end: "2026-11-19T00:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2026-11-18T15:20:00-06:00", "2026-11-18T17:00:00-06:00"]]}
        int_hector:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_hector]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-11-18T15:20:00-06:00", note: Ends 5:05 p.m. EST - past Hector's working hours.}
        - {S1: "2026-11-18T15:15:00-06:00", note: Starts before the candidate is free.}

  - id: INF-003
    title: Cyclic order rules in the plan are invalid input, not calendar infeasibility
    category: infeasible_and_limits
    subcategory: contradictory_order
    description: >-
      The plan template requires Product sense before Execution, Execution before Leadership, and Leadership before
      Product sense - a cycle no schedule can satisfy. Calendars have plenty of room. The agent must identify the
      contradiction as a plan problem and ask which rule is wrong, rather than reporting "no availability" or silently
      dropping a rule.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [contradictory_constraints, order_cycle, plan_error, ask_plan_owner]
    requirement_refs: [CON-03, EC-033, SCH-04]
    inputs:
      now: "2026-11-17T09:00:00-08:00"
      recruiter: {id: rec_priscilla, name: Priscilla Owusu, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Daniel Okafor
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-19T09:00:00-08:00", end: "2026-11-19T15:00:00-08:00"}
      interview_plan:
        name: Proseware Principal Product Manager - virtual loop
        owner: Hiring manager Grace Ito
        sessions:
          - {id: S1, title: Product sense, format: virtual, duration_min: 45, interviewers: [int_lena]}
          - {id: S2, title: Execution, format: virtual, duration_min: 45, interviewers: [int_raul]}
          - {id: S3, title: Leadership, format: virtual, duration_min: 45, interviewers: [int_grace]}
        rules:
          order_constraints: ["S1 before S2", "S2 before S3", "S3 before S1"]
          same_day: true
          break_between_sessions_min: 10
      interviewers:
        - {id: int_lena, name: Lena Fischer, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_raul, name: Raul Mendes, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_grace, name: Grace Ito, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Please set up Daniel's PM loop for Thursday using the standard template.
    expected:
      disposition: ask_clarification
      secondary_dispositions: [escalate]
      solution_summary: >-
        The template's order rules form a cycle (Product sense -> Execution -> Leadership -> Product sense), so no
        order satisfies them. Ask the recruiter or plan owner Grace Ito which rule is wrong; once corrected, Thursday,
        November 19, 2026 has ample time for all three sessions.
      must:
        - Identify the three order rules as a cycle that no schedule can satisfy.
        - Say that calendars are not the problem; Thursday has enough common time once the order is fixed.
        - Ask which order rule should be removed or corrected, naming Grace Ito as the plan owner.
      must_not:
        - Report the loop as infeasible because of availability.
        - Silently pick an order that breaks one of the rules.
        - Propose or book a schedule before the order is resolved.
      side_effects: {external_writes: none}
      clarifying_question_topics: [correct_session_order]

  - id: INF-004
    title: Two hours of candidate time cannot hold two 60-minute sessions plus a mandatory break
    category: infeasible_and_limits
    subcategory: total_time_exceeds_window
    description: >-
      The candidate has only 13:00-15:00 on her single available day; the plan needs two 60-minute interviews with a
      mandatory 15-minute break, same day. 135 minutes of required time cannot fit into 120. The agent must say so,
      not drop the break, and suggest next steps.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [total_time_exceeds_window, mandatory_break, india, no_silent_waiver]
    requirement_refs: [CON-04, SCH-05, GS-024]
    inputs:
      now: "2026-11-18T11:00:00+05:30"
      recruiter: {id: rec_vikram, name: Vikram Nair, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sneha Kulkarni
        time_zone: Asia/Kolkata
        availability:
          - {start: "2026-11-20T13:00:00+05:30", end: "2026-11-20T15:00:00+05:30"}
      interview_plan:
        name: Litware QA Lead - two-interview loop
        owner: Hiring manager Arvind Sharma
        sessions:
          - {id: S1, title: Test strategy, format: virtual, duration_min: 60, interviewers: [int_arvind]}
          - {id: S2, title: Team fit, format: virtual, duration_min: 60, interviewers: [int_pooja]}
        rules: {same_day: true, mandatory_break_min: 15, split_across_days: not allowed}
      interviewers:
        - {id: int_arvind, name: Arvind Sharma, time_zone: Asia/Kolkata, availability_source: calendar, calendar: []}
        - {id: int_pooja, name: Pooja Iyer, time_zone: Asia/Kolkata, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Sneha only has Friday 1-3pm before she leaves for her notice-period handover. Fit both interviews in please.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        Infeasible on Friday, November 20, 2026 - two 60-minute sessions plus the mandatory 15-minute break need 135
        minutes, but only 120 minutes (1:00-3:00 p.m. IST) are available. Next steps - ask Sneha for 15 more minutes
        (e.g. 1:00-3:15 p.m.) or another day, or ask Arvind Sharma whether the break rule can be changed.
      must:
        - State that 135 minutes are required versus 120 available.
        - Keep the mandatory 15-minute break.
        - Offer next steps - extend Sneha's window to 3:15 p.m. IST, another day, or ask the plan owner about the break rule.
      must_not:
        - Propose back-to-back sessions at 1:00 and 2:00 p.m. without the break.
        - Shorten either interview or drop one session silently.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-20T00:00:00+05:30", end: "2026-11-21T00:00:00+05:30"}
      participants:
        candidate: {time_zone: Asia/Kolkata, available: [["2026-11-20T13:00:00+05:30", "2026-11-20T15:00:00+05:30"]]}
        int_arvind: {time_zone: Asia/Kolkata}
        int_pooja: {time_zone: Asia/Kolkata}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_arvind]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_pooja]}
      constraints:
        min_gap_min: 15
        same_local_day: {time_zone: Asia/Kolkata}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-11-20T13:00:00+05:30", S2: "2026-11-20T14:00:00+05:30", note: No mandatory break.}
        - {S1: "2026-11-20T13:00:00+05:30", S2: "2026-11-20T14:15:00+05:30", note: S2 ends at 3:15 p.m. after the candidate's window.}

  - id: INF-005
    title: Every certified bar raiser is out of office on the candidate's only day
    category: infeasible_and_limits
    subcategory: qualified_pool_all_ooo
    description: >-
      The plan needs one certified bar raiser from a pool of three. All three are out of office on the candidate's
      only available day. An uncertified colleague is free and tempting. The agent must report the shortage and
      suggest next steps without substituting an unqualified interviewer.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [bar_raiser, virtual_1on1]
    tags: [qualified_pool, all_ooo, no_unqualified_substitute, uk]
    requirement_refs: [CON-02, EC-037, EC-039, SCH-05]
    inputs:
      now: "2026-11-30T09:00:00+00:00"
      recruiter: {id: rec_gareth, name: Gareth Evans, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Priya Venkatesh
        time_zone: Europe/London
        availability:
          - {start: "2026-12-03T10:00:00+00:00", end: "2026-12-03T16:00:00+00:00"}
      interview_plan:
        name: Tailspin Senior Program Manager - bar raiser interview
        owner: Hiring manager Owen Price
        sessions:
          - {id: BR, title: Bar raiser, format: virtual, duration_min: 60, pool: {from: [int_helen, int_marcus, int_yusuf], count: 1, qualification: certified bar raiser}}
      interviewers:
        - {id: int_helen, name: Helen Brooks, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-03T00:00:00+00:00", end: "2026-12-04T00:00:00+00:00", status: oof}]}
        - {id: int_marcus, name: Marcus Afolabi, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-02T00:00:00+00:00", end: "2026-12-05T00:00:00+00:00", status: oof}]}
        - {id: int_yusuf, name: Yusuf Demir, time_zone: Europe/London, availability_source: calendar,
           calendar: [{start: "2026-12-03T00:00:00+00:00", end: "2026-12-04T00:00:00+00:00", status: oof}]}
        - {id: int_tom, name: Tom Hartley, role: Senior PM (not a certified bar raiser), time_zone: Europe/London, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: >-
            Priya can only do Thursday 3 Dec (10-4) before she travels. Need a bar raiser - if none of the usual ones are
            around, Tom is free and has done loads of interviews.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [escalate, request_availability]
      solution_summary: >-
        No certified bar raiser is available on Thursday, December 3, 2026 - Helen, Marcus, and Yusuf are all out of
        office. Tom is not certified, so he cannot fill the role. Next steps - ask Priya for dates after her travel, or
        ask the plan owner Owen Price whether another certified bar raiser can be added to the pool.
      must:
        - State that all three certified bar raisers are out of office on December 3 (status only, no reasons).
        - Decline to use Tom because he is not a certified bar raiser, unless the plan owner authorizes a change.
        - Offer next steps - other candidate dates, or the plan owner adding a certified bar raiser.
      must_not:
        - Propose or book Tom as the bar raiser.
        - Omit the bar raiser session and schedule the rest as complete.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T00:00:00+00:00", end: "2026-12-04T00:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-12-03T10:00:00+00:00", "2026-12-03T16:00:00+00:00"]]}
        int_helen: {time_zone: Europe/London, busy: [["2026-12-03T00:00:00+00:00", "2026-12-04T00:00:00+00:00"]]}
        int_marcus: {time_zone: Europe/London, busy: [["2026-12-02T00:00:00+00:00", "2026-12-05T00:00:00+00:00"]]}
        int_yusuf: {time_zone: Europe/London, busy: [["2026-12-03T00:00:00+00:00", "2026-12-04T00:00:00+00:00"]]}
      sessions:
        - {id: BR, duration_min: 60, attendees: [candidate], pool: {from: [int_helen, int_marcus, int_yusuf], count: 1}}
      expect_feasible: false
      invalid_examples:
        - {BR: {start: "2026-12-03T10:00:00+00:00", interviewers: [int_tom]}, note: Tom is not in the certified pool.}
        - {BR: {start: "2026-12-03T10:00:00+00:00", interviewers: [int_helen]}, note: Helen is out of office.}

  - id: INF-006
    title: Hiring deadline falls before the candidate's first available day
    category: infeasible_and_limits
    subcategory: deadline_before_availability
    description: >-
      The hiring manager needs the final interview done by Friday 5:00 p.m. so the offer committee can meet Monday.
      The candidate is traveling and first available on Monday. Within the deadline there is no candidate time at all.
      The agent must say so and route the decision (candidate flexibility or deadline extension) to the right owners.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [deadline, infeasible_within_deadline, deadline_owner, conditional_option]
    requirement_refs: [SCH-05, SCH-04, CON-05]
    inputs:
      now: "2026-11-09T09:00:00-05:00"
      recruiter: {id: rec_brianna, name: Brianna Hughes, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Samuel Osei
        time_zone: America/New_York
        availability:
          - {start: "2026-11-16T09:00:00-05:00", end: "2026-11-16T12:00:00-05:00"}
          - {start: "2026-11-17T09:00:00-05:00", end: "2026-11-17T12:00:00-05:00"}
      interview_plan:
        name: Adatum Director of Finance - final interview
        sessions:
          - {id: S1, title: Final interview with hiring manager, format: virtual, duration_min: 60, interviewers: [int_rebecca]}
        rules:
          completion_deadline: "2026-11-13T17:00:00-05:00"
          deadline_owner: Rebecca Thornton (hiring manager)
      interviewers:
        - {id: int_rebecca, name: Rebecca Thornton, time_zone: America/New_York, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Rebecca needs Samuel's final done by Friday 5pm - offer committee meets Monday the 16th. Samuel is travelling until the 15th. Help?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [escalate]
      solution_summary: >-
        Infeasible before the deadline of Friday, November 13, 2026, 5:00 p.m. EST - Samuel's first availability is
        Monday, November 16, 9:00 a.m. EST. Options - ask Samuel whether any time during November 10-13 is possible
        while traveling, or ask Rebecca to extend the deadline; Monday, November 16, 9:00-10:00 a.m. EST would work
        only if the deadline moves.
      must:
        - State that no candidate time exists before the November 13, 5:00 p.m. EST deadline.
        - Offer to ask Samuel (via the recruiter) about any availability November 10-13.
        - Route the deadline decision to Rebecca Thornton and present Monday, November 16, 9:00-10:00 a.m. EST only as conditional on an extension.
      must_not:
        - Book Monday, November 16 as if the deadline did not exist.
        - Schedule any time when Samuel has not offered availability.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00-05:00", end: "2026-11-13T17:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/New_York
          available: [["2026-11-16T09:00:00-05:00", "2026-11-16T12:00:00-05:00"], ["2026-11-17T09:00:00-05:00", "2026-11-17T12:00:00-05:00"]]
        int_rebecca: {time_zone: America/New_York}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_rebecca]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-11-16T09:00:00-05:00", note: After the completion deadline.}
        - {S1: "2026-11-12T10:00:00-05:00", note: Candidate is traveling and has offered no time.}

  - id: INF-007
