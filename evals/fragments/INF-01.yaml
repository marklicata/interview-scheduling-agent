  - id: INF-023
    title: Last week's 1 p.m. London = 9 a.m. New York pattern disappears after UK clocks change
    category: infeasible_and_limits
    subcategory: dst_shifted_overlap_disappears
    description: >-
      On Monday, March 22, 2027, 1:00 p.m. London was 9:00 a.m. New York (US already on daylight time, UK not yet).
      The recruiter reuses that pattern for Monday, March 29, after the UK switched to BST. Now 1:00 p.m. BST is
      8:00 a.m. EDT, before the interviewer's working hours, and the candidate's only window no longer overlaps.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [dst_transition, overlap_disappears, london, new_york, fixed_offset_trap]
    requirement_refs: [AVL-10, EC-019, SCH-05]
    inputs:
      now: "2027-03-24T09:00:00-04:00"
      recruiter: {id: rec_tiana, name: Tiana Brooks, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Felix Adeyemi
        time_zone: Europe/London
        availability:
          - {start: "2027-03-29T13:00:00+01:00", end: "2027-03-29T14:00:00+01:00"}
      interview_plan:
        name: Adatum Credit Risk Analyst - technical interview
        sessions:
          - {id: S1, title: Credit risk interview, format: virtual, duration_min: 60, interviewers: [int_ruth]}
      interviewers:
        - id: int_ruth
          name: Ruth Feldman
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar: []
      case_state:
        prior_reference: "Grace Liu interview on 2027-03-22 at 13:00 GMT = 09:00 EDT (different candidate, same interviewer pattern)"
      conversation:
        - role: recruiter
          text: Same as we did last Monday - 1pm London is 9am NY. Felix can do 1-2pm London on Monday the 29th, so put him with Ruth then.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        Not on Monday, March 29, 2027 - the UK moved to BST on March 28, so 1:00-2:00 p.m. BST is 8:00-9:00 a.m. EDT,
        before Ruth's 9:00 a.m. start. Last week the gap was four hours; now it is five. Next steps - ask Felix for
        2:00-3:00 p.m. BST (9:00-10:00 a.m. EDT) or later, or the recruiter asks Ruth whether she explicitly agrees to
        an 8:00 a.m. EDT start.
      must:
        - Convert 1:00-2:00 p.m. BST on March 29 to 8:00-9:00 a.m. EDT and explain the UK clock change on March 28.
        - Contrast with March 22, when 1:00 p.m. GMT was 9:00 a.m. EDT.
        - Offer next steps - a 2:00 p.m. BST or later window from Felix, or Ruth's explicit opt-in to 8:00 a.m. EDT via the recruiter.
      must_not:
        - Propose or book 1:00 p.m. London on March 29 as 9:00 a.m. New York.
        - Apply a fixed four-hour offset.
        - Book anything.
      side_effects: {external_writes: none}
    local_time_checks:
