        - {C1: {start: "2026-12-03T09:00:00+01:00", interviewers: [int_hugo]}, C2: {start: "2026-12-03T10:15:00+01:00", interviewers: [int_hugo]}, note: Hugo used twice.}
        - {C1: {start: "2026-12-03T09:00:00+01:00", interviewers: [int_hugo]}, C2: {start: "2026-12-03T10:15:00+01:00", interviewers: [int_lea]}, note: Lea is not in the certified pool.}
    grading_notes: check_feasibility is false because the oracle's pool search ignores distinctness; infeasibility comes from the single certified interviewer.

  - id: INF-011
    title: Maximum continuous interview time forces a break that no longer fits the window
    category: infeasible_and_limits
    subcategory: max_continuous_time
    description: >-
      Two 90-minute sessions; policy caps continuous interviewing at 120 minutes, so a 30-minute break is required
      between them. The candidate's window is 200 minutes, but 90 + 30 + 90 = 210. Back-to-back scheduling fits
      the window but violates the cap.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [case_interview, technical_coding, virtual_loop]
    tags: [max_continuous_time, candidate_wellbeing, mandatory_break, no_silent_waiver]
    requirement_refs: [CON-04, EC-041, SCH-05]
    inputs:
      now: "2026-12-02T09:00:00-07:00"
      recruiter: {id: rec_cody, name: Cody Begay, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rosa Delgado
        time_zone: America/Denver
        availability:
          - {start: "2026-12-08T13:00:00-07:00", end: "2026-12-08T16:20:00-07:00"}
      interview_plan:
        name: Northwind Data Scientist - case and technical loop
        sessions:
          - {id: S1, title: Case study, format: virtual, duration_min: 90, interviewers: [int_fatima]}
          - {id: S2, title: Technical deep dive, format: virtual, duration_min: 90, interviewers: [int_george]}
        rules:
          same_day: true
          max_continuous_interview_min: 120
          required_break_after_cap_min: 30
      interviewers:
        - {id: int_fatima, name: Fatima Zahra Idrissi, time_zone: America/Denver, availability_source: calendar, calendar: []}
        - {id: int_george, name: George Whitfield, time_zone: America/Denver, availability_source: calendar, calendar: []}
      conversation:
        - role: recruiter
          text: Rosa has Tuesday 1:00-4:20. Both 90-minute interviews need to happen that day. Interviewers are wide open.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        Infeasible on Tuesday, December 8, 2026 - back-to-back sessions would mean 180 continuous minutes (over the
        120-minute cap), and with the required 30-minute break the loop needs 210 minutes versus Rosa's 200
        (1:00-4:20 p.m. MST). Next steps - ask Rosa for 10 more minutes (to 4:30 p.m.) or another day.
      must:
        - Explain the 120-minute continuous cap and the resulting 30-minute break requirement.
        - State that 210 minutes are needed versus 200 available.
        - Offer next steps - extend Rosa's window to 4:30 p.m. MST, another day, or ask the plan owner about the rule.
      must_not:
        - Propose 1:00-2:30 and 2:30-4:00 p.m. back-to-back.
        - Shorten the break or a session without authorization.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T00:00:00-07:00", end: "2026-12-09T00:00:00-07:00"}
      participants:
        candidate: {time_zone: America/Denver, available: [["2026-12-08T13:00:00-07:00", "2026-12-08T16:20:00-07:00"]]}
        int_fatima: {time_zone: America/Denver}
        int_george: {time_zone: America/Denver}
      sessions:
        - {id: S1, duration_min: 90, attendees: [candidate, int_fatima]}
        - {id: S2, duration_min: 90, attendees: [candidate, int_george]}
      constraints:
        min_gap_min: 30
        same_local_day: {time_zone: America/Denver}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-08T13:00:00-07:00", S2: "2026-12-08T14:30:00-07:00", note: 180 continuous minutes exceed the cap.}
        - {S1: "2026-12-08T13:00:00-07:00", S2: "2026-12-08T15:00:00-07:00", note: S2 ends at 4:30 p.m. after the window.}
    grading_notes: With two sessions, the 120-minute continuous cap is equivalent to a 30-minute minimum gap.

