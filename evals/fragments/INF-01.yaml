      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Antoine Mercier
        time_zone: Europe/Paris
        availability:
          - {start: "2026-12-03T09:00:00+01:00", end: "2026-12-03T17:00:00+01:00"}
      interview_plan:
        name: Litware Embedded Rust Engineer - coding loop
        owner: Engineering manager Sophie Martin
        sessions:
          - {id: C1, title: Coding 1, format: virtual, duration_min: 60, pool: {from: [int_hugo], count: 1, qualification: Rust certified}}
          - {id: C2, title: Coding 2, format: virtual, duration_min: 60, pool: {from: [int_hugo], count: 1, qualification: Rust certified}}
        rules: {distinct_interviewers: true, same_day: true, break_between_sessions_min: 15}
      interviewers:
        - {id: int_hugo, name: Hugo Lefevre, certification: Rust certified, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
        - {id: int_lea, name: Lea Garnier, certification: none, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
      conversation:
