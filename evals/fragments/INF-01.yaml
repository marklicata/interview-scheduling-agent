        name: Contoso Retail Customer Assistant - store interview
        sessions:
          - {id: S1, title: Store interview, format: in_person, duration_min: 45, interviewers: [int_dylan], venue: "Contoso Leeds store, Example Street 22 - ask at the service desk"}
      interviewers:
        - id: int_dylan
