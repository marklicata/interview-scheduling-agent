          text: Antoine is free all Thursday. Can you set up both coding rounds? Hugo is the Rust person; Lea could help out.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [escalate]
      solution_summary: >-
        Infeasible as specified - both coding sessions need different Rust-certified interviewers, but Hugo is the only
        one. Ask Sophie Martin (plan owner) to add a second certified interviewer or change the plan; Hugo alone could
        run one session on Thursday, December 3, 2026.
      must:
        - Explain that the distinct-interviewer rule needs two certified people and only Hugo is certified.
        - Say that time is not the constraint.
        - Route the decision to Sophie Martin - add a certified interviewer or approve a plan change.
      must_not:
        - Assign Hugo to both sessions.
        - Assign Lea, who is not Rust certified, without an authorized plan change.
        - Schedule only one session and present the loop as complete.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T08:00:00+01:00", end: "2026-12-03T18:00:00+01:00"}
