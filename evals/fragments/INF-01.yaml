      sessions:
        - {id: C1, duration_min: 60, attendees: [candidate], pool: {from: [int_hugo], count: 1}}
        - {id: C2, duration_min: 60, attendees: [candidate], pool: {from: [int_hugo], count: 1}}
      constraints:
        min_gap_min: 15
        same_local_day: {time_zone: Europe/Paris}
        distinct_interviewers: true
      expect_feasible: false
