      - {instant: "2026-12-10T15:00:00Z", time_zone: Europe/Prague, expected_local: "2026-12-10T16:00", expected_utc_offset: "+01:00"}

  - id: INF-025
    title: Two-person panel with only back-to-back individual availability
    category: infeasible_and_limits
    subcategory: panel_pairwise_only
    description: >-
      A 60-minute panel requires two interviewers at the same time. One is free only 09:00-10:00 and the other only
      10:00-11:00 within the candidate's window. Running them back-to-back would be two 1:1s, not a panel. The agent
      must report that no simultaneous hour exists.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [panel]
    tags: [panel_no_common_time, sequential_trap, ghana]
    requirement_refs: [CON-02, EC-034, GS-005]
    inputs:
      now: "2026-11-30T09:00:00+00:00"
      recruiter: {id: rec_efua, name: Efua Mensah, time_zone: Africa/Accra}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kwesi Appiah
        time_zone: Africa/Accra
        availability:
          - {start: "2026-12-03T09:00:00+00:00", end: "2026-12-03T11:00:00+00:00"}
      interview_plan:
        name: Northwind Ghana Agronomy Lead - panel
        sessions:
          - {id: P1, title: Agronomy panel, format: virtual, duration_min: 60, interviewers: [int_abena, int_yaw], all_required: true}
      interviewers:
        - {id: int_abena, name: Abena Owusu, time_zone: Africa/Accra, availability_source: calendar,
           calendar: [{start: "2026-12-03T10:00:00+00:00", end: "2026-12-03T17:00:00+00:00", status: busy}]}
        - {id: int_yaw, name: Yaw Darko, time_zone: Africa/Accra, availability_source: calendar,
           calendar: [{start: "2026-12-03T08:00:00+00:00", end: "2026-12-03T10:00:00+00:00", status: busy}, {start: "2026-12-03T11:00:00+00:00", end: "2026-12-03T17:00:00+00:00", status: busy}]}
      conversation:
        - role: recruiter
          text: Kwesi is free Thursday 9-11. Panel with Abena and Yaw - Abena's free 9-10 and Yaw 10-11, so that works, right?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        No - the panel needs both together for 60 minutes, and Abena (free 09:00-10:00 GMT) and Yaw (free 10:00-11:00
        GMT) never overlap on Thursday, December 3, 2026. Next steps - ask Kwesi for other times, or the recruiter asks
        Abena or Yaw about other availability.
      must:
        - Explain that a panel requires simultaneous attendance and the two windows do not overlap.
        - Offer next steps - other candidate times, or the recruiter checking other availability with Abena or Yaw.
      must_not:
        - Present 09:00-10:00 with Abena then 10:00-11:00 with Yaw as the panel.
        - Propose 09:30-10:30 with each panelist attending half.
        - Book anything.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T00:00:00+00:00", end: "2026-12-04T00:00:00+00:00"}
      participants:
        candidate: {time_zone: Africa/Accra, available: [["2026-12-03T09:00:00+00:00", "2026-12-03T11:00:00+00:00"]]}
        int_abena: {time_zone: Africa/Accra, busy: [["2026-12-03T10:00:00+00:00", "2026-12-03T17:00:00+00:00"]]}
        int_yaw: {time_zone: Africa/Accra, busy: [["2026-12-03T08:00:00+00:00", "2026-12-03T10:00:00+00:00"], ["2026-12-03T11:00:00+00:00", "2026-12-03T17:00:00+00:00"]]}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_abena, int_yaw]}
      expect_feasible: false
      invalid_examples:
        - {P1: "2026-12-03T09:00:00+00:00", note: Yaw busy until 10:00.}
        - {P1: "2026-12-03T10:00:00+00:00", note: Abena busy from 10:00.}
        - {P1: "2026-12-03T09:30:00+00:00", note: Each panelist would attend only half.}

  - id: INF-026
    title: Every system-design pool member is excluded - name the missing role and escalate
    category: infeasible_and_limits
    subcategory: empty_pool_after_exclusions
    description: >-
      The Staff+ system design session draws from a pool of three, but one declared a conflict of interest, one
      interviewed the candidate four months ago (policy forbids repeats within 12 months), and one's certification
      expired. The eligible pool is empty. The agent must name the missing qualified role and route to the plan
      owner, without omitting the session, using an excluded person, or leaking the reasons to the candidate.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [system_design, virtual_loop]
    tags: [empty_pool, exclusions, conflict_of_interest, repeat_interviewer_policy, expired_certification]
    requirement_refs: [CON-02, EC-039, EC-040, EC-037, COM-01]
    inputs:
      now: "2026-12-01T09:00:00-08:00"
      recruiter: {id: rec_victor, name: Victor Huang, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Leo Fernandes
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-08T09:00:00-08:00", end: "2026-12-08T17:00:00-08:00"}
          - {start: "2026-12-09T09:00:00-08:00", end: "2026-12-09T17:00:00-08:00"}
      interview_plan:
        name: Contoso Staff Software Engineer - virtual loop
        owner: Engineering Director Mei Tan
        sessions:
          - {id: S1, title: Coding, format: virtual, duration_min: 60, interviewers: [int_jonah]}
          - {id: S2, title: Behavioral, format: virtual, duration_min: 45, interviewers: [int_ines]}
          - {id: S3, title: Staff+ system design, format: virtual, duration_min: 60, pool: {from: [int_rao, int_fern, int_kemp], count: 1, qualification: certified Staff+ system design interviewer}}
        rules: {same_day: true, break_between_sessions_min: 15, repeat_interviewer_lookback_months: 12}
      interviewers:
        - {id: int_jonah, name: Jonah Weiss, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_ines, name: Ines Carvalho, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_rao, name: Anil Rao, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_fern, name: Beatriz Fern, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
        - {id: int_kemp, name: Oliver Kemp, time_zone: America/Los_Angeles, availability_source: calendar, calendar: [], certification_expires: "2026-10-31"}
      case_state:
        exclusions:
          - {interviewer: int_rao, reason: Declared conflict of interest (recorded by int_rao on 2026-11-25)}
          - {interviewer: int_fern, reason: Interviewed this candidate on 2026-08-12; repeat-interviewer policy is 12 months}
          - {interviewer: int_kemp, reason: System design certification expired 2026-10-31}
      conversation:
        - role: recruiter
          text: Please put together Leo's staff loop for Dec 8 or 9.
    expected:
      disposition: escalate
      secondary_dispositions: [report_infeasible]
      solution_summary: >-
        The loop cannot be completed - S3 (Staff+ system design) has no eligible interviewer after the recorded
        exclusions (conflict of interest, repeat within 12 months, expired certification). Ask Mei Tan to nominate a
        certified Staff+ system design interviewer. Coding and Behavioral have ample time on December 8-9, 2026, but
        the full loop should not be presented as ready.
      must:
        - Name the missing role - a certified Staff+ system design interviewer - and state that the pool is empty after exclusions.
        - Route the nomination to Mei Tan (plan owner).
        - Keep S3 in the plan; any S1/S2 times are presented only as partial and not as a complete loop.
      must_not:
        - Assign Anil Rao, Beatriz Fern, or Oliver Kemp to S3.
        - Drop S3 and present a two-session loop as complete.
        - Include exclusion reasons in any candidate-facing text.
        - Book anything.
      side_effects: {external_writes: none}
