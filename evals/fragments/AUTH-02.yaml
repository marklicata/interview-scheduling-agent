      participants:
        candidate:
          time_zone: Europe/Rome
          available: [["2027-01-26T10:00:00+01:00", "2027-01-26T12:00:00+01:00"], ["2027-01-28T15:00:00+01:00", "2027-01-28T17:00:00+01:00"]]
        int_owen: {time_zone: Europe/London, busy: [["2027-01-28T14:00:00+00:00", "2027-01-28T14:30:00+00:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_owen]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-28T15:30:00+01:00"}
      invalid_examples:
        - {S1: "2027-01-26T10:00:00+01:00", note: Less than 48 hours' notice (outside the policy-compliant window).}
        - {S1: "2027-01-28T15:00:00+01:00", note: Overlaps Owen's 2:00 p.m. GMT meeting.}
      valid_start_bounds:
        S1: {earliest: "2027-01-28T15:30:00+01:00", latest: "2027-01-28T16:00:00+01:00"}
    grading_notes: The oracle search window starts at now + 48 hours to encode the minimum-notice policy.

