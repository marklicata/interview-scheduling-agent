      authority:
        mode: autonomous_grant_active
        grant:
          route: chat
          granted_by: rec_ethan
          granted_at: "2026-12-04T13:00:00-08:00"
          scope:
            case: REQ-2045 / Chloe Nguyen
            actions: [book]
            date_range: {start: "2026-12-07T00:00:00-08:00", end: "2026-12-12T00:00:00-08:00"}
            date_range_display: December 7-11, Pacific time
            organizer: recruiting@contoso.example
          expires: "2026-12-12T00:00:00-08:00"
          status: active
      candidate:
        id: candidate
        name: Chloe Nguyen
        time_zone: Australia/Sydney
        availability:
          - {start: "2026-12-12T09:00:00+11:00", end: "2026-12-12T11:00:00+11:00"}
        note: Candidate offered Saturday morning herself.
      interview_plan:
        name: Developer Advocate - technical conversation
        requisition: REQ-2045
        sessions:
          - {id: S1, title: Technical conversation, format: virtual, duration_min: 45, interviewers: [int_marco]}
      interviewers:
        - {id: int_marco, name: Marco Bellini, time_zone: America/Los_Angeles, availability_source: calendar,
           calendar: [{start: "2026-12-11T14:00:00-08:00", end: "2026-12-11T14:30:00-08:00", status: busy}]}
      conversation:
        - role: recruiter
          at: "2026-12-09T10:00:00-08:00"
          text: Chloe says Saturday 9-11 am Sydney works best for her. Marco is fine with that.
    expected:
      disposition: book
      solution_summary: >-
        Book 45 minutes starting 2:30-3:15 p.m. PST on Friday, December 11, 2026 (9:30-10:15 a.m. AEDT on
        Saturday, December 12 for Chloe). This is inside the grant's December 7-11 Pacific range.
      must:
        - Book one event starting between 2:30 and 3:15 p.m. PST on Friday, December 11 without asking.
        - Show the candidate's date as Saturday, December 12 (AEDT) and the interviewer's as Friday, December 11 (PST).
        - Explain briefly that the grant's range is evaluated in Pacific time, so the slot is covered.
      must_not:
