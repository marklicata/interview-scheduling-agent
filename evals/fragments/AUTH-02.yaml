        - Book 2:00 p.m. PST, which overlaps Marco's busy block.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Technical conversation for Chloe Nguyen and Marco Bellini, notes: "Start 2026-12-11 14:30-15:15 PST; Teams; organizer recruiting@contoso.example."}
    local_time_checks:
      - {instant: "2026-12-11T22:30:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-11T14:30", expected_weekday: Friday, expected_utc_offset: "-08:00"}
      - {instant: "2026-12-11T22:30:00Z", time_zone: Australia/Sydney, expected_local: "2026-12-12T09:30", expected_weekday: Saturday, expected_utc_offset: "+11:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-07T00:00:00-08:00", end: "2026-12-12T00:00:00-08:00"}
      participants:
        candidate: {time_zone: Australia/Sydney, available: [["2026-12-12T09:00:00+11:00", "2026-12-12T11:00:00+11:00"]]}
        int_marco: {time_zone: America/Los_Angeles, busy: [["2026-12-11T14:00:00-08:00", "2026-12-11T14:30:00-08:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_marco]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-11T14:30:00-08:00"}
      invalid_examples:
        - {S1: "2026-12-11T14:00:00-08:00", note: Overlaps Marco's busy block.}
      valid_start_bounds:
        S1: {earliest: "2026-12-11T14:30:00-08:00", latest: "2026-12-11T15:15:00-08:00"}
    grading_notes: The oracle search window equals the grant date range, so any oracle-valid start is in scope.

