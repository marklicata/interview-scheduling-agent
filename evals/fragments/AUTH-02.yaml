        - Give the recruiter a precise conditional option and what to ask Desmond.
        - Say the agent will recheck and then book under the grant once Desmond's calendar is clear.
      must_not:
        - Update, move, or cancel the recurring 1:1 or any of its occurrences.
        - Book over Desmond's busy block.
        - Message Desmond or the other 1:1 attendee.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-29T00:00:00-08:00", end: "2027-01-30T00:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2027-01-29T09:00:00-08:00", "2027-01-29T11:00:00-08:00"]]}
        int_desmond: {time_zone: America/Denver, busy: [["2027-01-29T10:00:00-07:00", "2027-01-29T12:00:00-07:00"]]}
      sessions:
