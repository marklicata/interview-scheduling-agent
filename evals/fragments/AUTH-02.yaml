          at: "2027-01-25T10:00:00+00:00"
          text: Chiara can do Tuesday 10-12 or Thursday 3-5 (Rome time). Owen's interviewing her.
    expected:
      disposition: book
      solution_summary: >-
        Skip Tuesday (less than 48 hours' notice). Book Thursday, January 28, 2027 starting 3:30-4:00 p.m. CET
        (2:30-3:00 p.m. GMT) under the grant, and explain the notice rule.
