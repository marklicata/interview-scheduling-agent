      invalid_examples:
        - {S1: "2027-02-03T10:00:00+09:00", S2: "2027-02-03T11:15:00+09:00", S3: "2027-02-03T13:00:00+09:00", note: Original S2 - candidate now unavailable.}
        - {S1: "2027-02-03T10:00:00+09:00", S2: "2027-02-03T12:10:00+09:00", S3: "2027-02-03T13:00:00+09:00", note: Only 5 minutes before S3.}
