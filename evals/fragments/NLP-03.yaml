    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [locale_workweek, israel, sunday_thursday_week, berlin, abbreviation_avoidance]
    requirement_refs: [INT-03, AVL-10]
    inputs:
