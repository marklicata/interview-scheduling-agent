      candidate: {id: candidate, name: Noa Ben-David, location: Jerusalem, time_zone: Asia/Jerusalem}
      interview_plan:
        name: Security Researcher - interview
        sessions:
          - {id: S1, title: Security interview, format: virtual, duration_min: 60, interviewers: [int_katrin]}
      interviewers:
        - id: int_katrin
          name: Katrin Vogel
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-09T09:00:00+01:00", end: "2026-11-09T12:00:00+01:00", status: busy}
            - {start: "2026-11-10T09:00:00+01:00", end: "2026-11-10T12:00:00+01:00", status: busy}
            - {start: "2026-11-11T09:00:00+01:00", end: "2026-11-11T12:00:00+01:00", status: busy}
            - {start: "2026-11-12T09:00:00+01:00", end: "2026-11-12T11:00:00+01:00", status: busy}
      conversation:
