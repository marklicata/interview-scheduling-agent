        - {id: int_paul_i, name: Paul Iversen, time_zone: America/Chicago, availability_source: calendar, calendar: []}
      policies:
        min_notice_hours: 24
      conversation:
        - role: recruiter
          at: "2026-11-04T15:00:00-06:00"
