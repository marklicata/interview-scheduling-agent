        - role: candidate
          at: "2026-11-06T07:30:00-06:00"
          channel: email
          text: Friday afternoon works for me!
        - role: recruiter
          at: "2026-11-06T08:00:00-06:00"
          channel: chat
          text: Greta says Friday afternoon. Can you set it up?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        The reply was sent on Friday, November 6. This afternoon is within the 24-hour minimum notice, so it cannot be
        scheduled; Greta may instead mean Friday, November 13. Ask whether she means next Friday, November 13 (and which
        afternoon hours, Central time).
