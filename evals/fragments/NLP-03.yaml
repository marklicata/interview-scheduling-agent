# NLP-03: thread structure, memory, robustness and edge semantics (availability_interpretation)
test_cases:
  - id: NLP-051
    title: Overlapping windows plus an embedded exception in one message
    category: availability_interpretation
    subcategory: overlap_and_exception
    description: >-
      The candidate writes "Tue I'm free 9-12 and also 10:30-1. Except 11:15-11:45, I have a call." The windows must be
      merged (9:00-1:00) and the exception subtracted, leaving 9:00-11:15 and 11:45-1:00 PST. The Denver interviewer
      is busy until 11:00 a.m. PST, so only 11:45-12:00 starts fit for an hour. Tests normalization without widening
      or duplicating windows.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [overlapping_windows, union, exception_subtraction, cross_timezone]
    requirement_refs: [INT-03, EC-004, EC-005]
    inputs:
      now: "2026-11-06T09:00:00-08:00"
      recruiter: {id: rec_kayla, name: Kayla Morris, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Ming Zhao, time_zone: America/Los_Angeles}
      interview_plan:
        name: Machine Learning Engineer - coding interview
        sessions:
          - {id: S1, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_sasha]}
      interviewers:
        - id: int_sasha
          name: Sasha Ivanova
          time_zone: America/Denver
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-10T10:00:00-07:00", end: "2026-11-10T12:00:00-07:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-06T08:20:00-08:00"
          channel: email
          text: Tue I'm free 9-12 and also 10:30-1. Except 11:15-11:45, I have a call.
        - role: recruiter
          at: "2026-11-06T09:00:00-08:00"
          channel: chat
          text: Ming's Tuesday is below. One hour with Sasha please.
    expected:
      disposition: propose_options
      solution_summary: >-
        Normalized Tuesday, November 10, 2026 availability is 9:00-11:15 a.m. and 11:45 a.m.-1:00 p.m. PST. Sasha is busy
        until 12:00 p.m. MST (11:00 a.m. PST), so the hour can start from 11:45 a.m. to 12:00 p.m. PST (12:45-1:00 p.m. MST).
      must:
        - Merge 9-12 and 10:30-1 into one 9:00 a.m.-1:00 p.m. window and subtract 11:15-11:45.
        - Propose only starts from 11:45 a.m. to 12:00 p.m. PST (12:45-1:00 p.m. MST).
        - Ask whether to book.
      must_not:
        - Propose 11:00 a.m. PST, which overlaps the candidate's call.
        - Propose a start after 12:00 p.m. PST, which would end after 1:00 p.m.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-10T19:45:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-10T11:45", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-10T19:45:00Z", time_zone: America/Denver, expected_local: "2026-11-10T12:45", expected_utc_offset: "-07:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00-08:00", end: "2026-11-11T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2026-11-10T09:00:00-08:00", "2026-11-10T12:00:00-08:00"], ["2026-11-10T10:30:00-08:00", "2026-11-10T13:00:00-08:00"]]
          busy: [["2026-11-10T11:15:00-08:00", "2026-11-10T11:45:00-08:00"]]
        int_sasha:
          time_zone: America/Denver
          working_hours: {time_zone: America/Denver, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-10T10:00:00-07:00", "2026-11-10T12:00:00-07:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_sasha]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-10T11:45:00-08:00"}
      invalid_examples:
        - {S1: "2026-11-10T11:00:00-08:00", note: Overlaps the candidate's call.}
        - {S1: "2026-11-10T12:15:00-08:00", note: Ends after 1 p.m.}
      valid_start_bounds:
        S1: {earliest: "2026-11-10T11:45:00-08:00", latest: "2026-11-10T12:00:00-08:00"}

  - id: NLP-052
    title: Message says Tuesday is fully booked and also offers Tuesday 2-4 - use Thursday, ask about Tuesday
    category: availability_interpretation
    subcategory: internal_contradiction
    description: >-
      Within one email the candidate says "I'm completely booked on Tuesday with client workshops" and later "Tuesday
      2-4 or Thursday 10-12 would be ideal". The Tuesday statements contradict each other; Thursday is clean. The
      interviewer is free on both. The agent should propose the unambiguous Thursday window and flag the Tuesday
      contradiction for the recruiter.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [internal_contradiction, partial_clarification, conservative_interpretation]
    requirement_refs: [INT-03, INT-05, AVL-15]
    inputs:
      now: "2026-11-09T09:00:00-06:00"
      recruiter: {id: rec_trevor, name: Trevor Hughes, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Anika Patel, time_zone: America/Chicago}
      interview_plan:
        name: Management Consultant - case interview
        sessions:
          - {id: S1, title: Case interview, format: virtual, duration_min: 45, interviewers: [int_ben]}
      interviewers:
        - id: int_ben
          name: Ben Okoro
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-12T10:00:00-06:00", end: "2026-11-12T10:30:00-06:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-09T07:50:00-06:00"
          channel: email
          text: |-
            Hi Trevor,
            This week is hectic - I'm completely booked on Tuesday with client workshops, and Wednesday I'm traveling.
            For the interview, Tuesday 2-4 or Thursday 10-12 would be ideal.
            Best, Anika
        - role: recruiter
          at: "2026-11-09T09:00:00-06:00"
          channel: chat
          text: Anika's case interview with Ben - can you find a slot?
    expected:
      disposition: propose_options
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Thursday, November 12, 2026, 10:00 a.m.-12:00 p.m. CST is unambiguous; Ben is busy until 10:30, so the case
        interview can start from 10:30 to 11:15 a.m. CST. Tuesday 2-4 conflicts with "completely booked on Tuesday", so
        flag it and suggest confirming with Anika before using it.
      must:
        - Point out the contradiction between "completely booked on Tuesday" and "Tuesday 2-4".
        - Propose Thursday, November 12 starts from 10:30 to 11:15 a.m. CST.
        - Ask whether to book the Thursday option.
      must_not:
        - Propose Tuesday, November 10 as firm availability.
        - Propose Wednesday, when the candidate is traveling.
        - Book without confirmation.
      side_effects: {external_writes: none}
      clarifying_question_topics: [tuesday_contradiction]
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00-06:00", end: "2026-11-13T00:00:00-06:00"}
      participants:
        candidate:
          time_zone: America/Chicago
          available: [["2026-11-12T10:00:00-06:00", "2026-11-12T12:00:00-06:00"]]
        int_ben:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-12T10:00:00-06:00", "2026-11-12T10:30:00-06:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_ben]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-12T10:30:00-06:00"}
      invalid_examples:
        - {S1: "2026-11-10T14:00:00-06:00", note: Contradicted Tuesday window.}
        - {S1: "2026-11-12T11:30:00-06:00", note: Ends after noon.}
      valid_start_bounds:
        S1: {earliest: "2026-11-12T10:30:00-06:00", latest: "2026-11-12T11:15:00-06:00"}

  - id: NLP-053
    title: Long rambling email with one committed window buried among distractor times
    category: availability_interpretation
    subcategory: buried_window
    description: >-
      A long, chatty email mentions a past interview at 8 a.m., the candidate's manager's Tuesday 2-4 meeting, a
      child's Wednesday recital at 6, a hypothetical Friday, and finally "realistically, the only window I can truly
      commit to is Thursday the 19th between 11:15 and 12:30 Eastern." Only that window is availability. Tests
      extracting the committed window and attributing other times correctly.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [long_email, distractor_times, speaker_attribution, buried_window]
    requirement_refs: [INT-03]
    inputs:
      now: "2026-11-13T09:00:00-06:00"
      recruiter: {id: rec_shauna, name: Shauna Bell, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Margaret O'Sullivan, time_zone: America/New_York}
      interview_plan:
        name: HR Business Partner - interview
        sessions:
          - {id: S1, title: HRBP interview, format: virtual, duration_min: 45, interviewers: [int_kenneth]}
      interviewers:
        - id: int_kenneth
          name: Kenneth Obi
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-19T10:00:00-06:00", end: "2026-11-19T10:30:00-06:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-12T22:40:00-05:00"
          channel: email
          text: |-
            Hi Shauna,

            Thank you so much for the note, and apologies for the essay! The last time I interviewed (years ago) it was at
            8 a.m. and I was a wreck, so I've learned to avoid early starts if I can. Next week is a bit of a juggling act:
            my manager has our quarterly review on Tuesday from 2 to 4, which I can't miss, and Wednesday my daughter has
            her recital at 6, so I'm leaving early that day. Friday could hypothetically work, except I'm on a flight most
            of the day, so let's not count on it.

            Realistically, the only window I can truly commit to is Thursday the 19th between 11:15 and 12:30 Eastern.
            I know that's tight - I hope it works on your end!

            Warmly,
            Peggy
        - role: recruiter
          at: "2026-11-13T09:00:00-06:00"
          channel: chat
          text: Peggy sent a novel. Can you figure out when she's actually free and set up Kenneth?
    expected:
      disposition: propose_options
      solution_summary: >-
        The only committed window is Thursday, November 19, 2026, 11:15 a.m.-12:30 p.m. EST (10:15-11:30 a.m. CST). Kenneth
        is busy until 10:30 a.m. CST, so the 45-minute interview can start from 11:30 to 11:45 a.m. EST (10:30-10:45 a.m.
        CST).
      must:
        - Extract the committed Thursday, November 19 window and ignore the other times as availability.
        - Attribute the Tuesday 2-4 time to the candidate's manager's meeting, not to candidate availability.
        - Propose only starts from 11:30 to 11:45 a.m. EST (10:30-10:45 a.m. CST).
        - Ask whether to book.
      must_not:
        - Propose Tuesday 2-4, Wednesday evening, Friday, or 8 a.m.
        - Mention the daughter's recital or other personal details to the interviewer.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T16:30:00Z", time_zone: America/New_York, expected_local: "2026-11-19T11:30", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2026-11-19T16:30:00Z", time_zone: America/Chicago, expected_local: "2026-11-19T10:30", expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T00:00:00-05:00", end: "2026-11-21T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/New_York
          available: [["2026-11-19T11:15:00-05:00", "2026-11-19T12:30:00-05:00"]]
        int_kenneth:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-19T10:00:00-06:00", "2026-11-19T10:30:00-06:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_kenneth]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-19T11:30:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-17T14:00:00-05:00", note: The manager's meeting time.}
        - {S1: "2026-11-19T11:15:00-05:00", note: Kenneth busy until 10:30 a.m. CST.}
      valid_start_bounds:
        S1: {earliest: "2026-11-19T11:30:00-05:00", latest: "2026-11-19T11:45:00-05:00"}

  - id: NLP-054
    title: Recruiter paraphrase "Tuesday afternoon" conflicts with the pasted original "after 3:30 Central"
    category: availability_interpretation
    subcategory: paraphrase_vs_original
    description: >-
      A Pacific recruiter summarizes the candidate as "free Tuesday afternoon" but pastes the original: "Tuesday works
      after 3:30 my time (Central) - I have to log off at 5:30." The original is authoritative. 12:00-1:30 p.m. PST looks
      like "afternoon" but is before 3:30 Central. Tests original-over-paraphrase precedence.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [paraphrase_conflict, original_wins, provenance, cross_timezone]
    requirement_refs: [INT-04, INT-06]
    inputs:
      now: "2026-11-12T10:00:00-08:00"
      recruiter: {id: rec_carly, name: Carly Jensen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Ana Lucía Paredes, time_zone: America/Chicago}
      interview_plan:
        name: Procurement Manager - interview
        sessions:
          - {id: S1, title: Procurement interview, format: virtual, duration_min: 60, interviewers: [int_kai]}
      interviewers:
        - id: int_kai
          name: Kai Nakamura
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T13:30:00-08:00", end: "2026-11-17T14:00:00-08:00", status: busy}
      conversation:
        - role: recruiter
          at: "2026-11-12T10:00:00-08:00"
          channel: chat
          text: |-
            Ana said she's free Tuesday afternoon - please set up the 60-min with Kai. Her email:
            > Tuesday works after 3:30 my time (Central) - I have to log off at 5:30.
    expected:
      disposition: propose_options
      solution_summary: >-
        The original says Tuesday, November 17, 2026, 3:30-5:30 p.m. CST (1:30-3:30 p.m. PST). Kai is busy 1:30-2:00 p.m.
        PST, so the hour can start from 4:00 to 4:30 p.m. CST (2:00-2:30 p.m. PST). The paraphrase "Tuesday afternoon" is
        broader than the original.
      must:
        - Use the pasted original text over the recruiter's paraphrase and say so.
        - Propose only starts from 4:00 to 4:30 p.m. CST (2:00-2:30 p.m. PST) on Tuesday, November 17.
        - Ask whether to book.
      must_not:
        - Propose early-afternoon Pacific times (e.g., 12:00 p.m. PST) that are before 3:30 p.m. Central.
        - Propose a slot ending after 5:30 p.m. Central.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T22:00:00Z", time_zone: America/Chicago, expected_local: "2026-11-17T16:00", expected_weekday: Tuesday, expected_utc_offset: "-06:00"}
      - {instant: "2026-11-17T22:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T14:00", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00-06:00", end: "2026-11-18T00:00:00-06:00"}
      participants:
        candidate:
          time_zone: America/Chicago
          available: [["2026-11-17T15:30:00-06:00", "2026-11-17T17:30:00-06:00"]]
        int_kai:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-17T13:30:00-08:00", "2026-11-17T14:00:00-08:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_kai]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-17T16:00:00-06:00"}
      invalid_examples:
        - {S1: "2026-11-17T12:00:00-08:00", note: 'Afternoon for the recruiter, but 2 p.m. Central.'}
        - {S1: "2026-11-17T16:45:00-06:00", note: Ends after 5:30 p.m. Central.}
      valid_start_bounds:
        S1: {earliest: "2026-11-17T16:00:00-06:00", latest: "2026-11-17T16:30:00-06:00"}

  - id: NLP-055
    title: '"Tomorrow morning" sent at 12:20 a.m. Tokyo time - which morning?'
    category: availability_interpretation
    subcategory: relative_date_after_midnight
    description: >-
      Sent Wednesday, November 11 at 12:20 a.m. JST (still Tuesday afternoon in London), "Tomorrow morning I'm free 9-11"
      may mean the coming Wednesday morning (people often treat after-midnight as still "tonight") or Thursday,
      November 12. Unlike a message at 11:58 p.m., this is genuinely ambiguous, so the agent should ask.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [relative_date, tomorrow, after_midnight, genuine_ambiguity, tokyo, london]
    requirement_refs: [INT-03, INT-05]
    inputs:
      now: "2026-11-10T16:00:00+00:00"
      recruiter: {id: rec_harriet, name: Harriet Wells, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Sakura Ito, time_zone: Asia/Tokyo}
      interview_plan:
        name: Investor Relations Associate - interview
        sessions:
          - {id: S1, title: IR interview, format: virtual, duration_min: 45, interviewers: [int_george]}
      interviewers:
        - {id: int_george, name: George Fraser, time_zone: Europe/London, availability_source: calendar, calendar: []}
      conversation:
        - role: candidate
          at: "2026-11-11T00:20:00+09:00"
          channel: email
          text: Sorry for the late reply! Tomorrow morning I'm free 9-11 (Tokyo time).
        - role: recruiter
          at: "2026-11-10T16:00:00+00:00"
          channel: chat
          text: Sakura says tomorrow morning. Can you book her with George?
    expected:
      disposition: ask_clarification
      solution_summary: >-
        The message was sent at 12:20 a.m. JST on Wednesday, November 11, 2026. "Tomorrow morning" could mean Wednesday,
        November 11, 9:00-11:00 JST (00:00-02:00 GMT) or Thursday, November 12, 9:00-11:00 JST (Wednesday 00:00-02:00 GMT).
        Ask which day she means; note that either way it is midnight-2 a.m. for George in London, so his availability
        also needs checking.
      must:
        - Name both possible dates, Wednesday, November 11 and Thursday, November 12 (Tokyo time).
        - Explain that the after-midnight send time makes "tomorrow" ambiguous.
        - Note that 9-11 a.m. JST is 00:00-02:00 GMT, outside George's normal day.
      must_not:
        - Silently choose one date.
        - Book or propose a slot in the middle of George's night as if it were acceptable.
        - Treat "can you book" as confirmation.
      side_effects: {external_writes: none}
      clarifying_question_topics: [which_morning]
    local_time_checks:
      - {instant: "2026-11-10T15:20:00Z", time_zone: Asia/Tokyo, expected_local: "2026-11-11T00:20", expected_weekday: Wednesday, expected_utc_offset: "+09:00"}
      - {instant: "2026-11-11T00:00:00Z", time_zone: Asia/Tokyo, expected_local: "2026-11-11T09:00", expected_weekday: Wednesday}
      - {instant: "2026-11-11T00:00:00Z", time_zone: Europe/London, expected_local: "2026-11-11T00:00", expected_weekday: Wednesday}

  - id: NLP-056
    title: '"Any work day next week" from an Israeli candidate means Sunday-Thursday'
    category: availability_interpretation
    subcategory: locale_workweek
