  - id: NLP-079
    title: '"Mornings are much better, but I can make Tuesday afternoon work" - preference, not a hard limit'
    category: availability_interpretation
    subcategory: soft_preference
    description: >-
      The candidate prefers mornings Monday-Wednesday and offers Tuesday afternoon as a fallback. The interviewer has no
      free morning hour but is free Tuesday 2:00-3:00 p.m. and Wednesday afternoon (not offered). Treating the preference
      as a hard constraint would wrongly report infeasible. Tests soft preference vs availability (EC-013).
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [soft_preference, fallback_window, false_infeasible_trap]
    requirement_refs: [INT-03, EC-013, CON-05]
    inputs:
      now: "2026-11-12T10:00:00-05:00"
      recruiter: {id: rec_rosa_b, name: Rosa Bianco, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Lucy Carter, time_zone: America/New_York}
      interview_plan:
        name: Learning Experience Designer - interview
        sessions:
          - {id: S1, title: Design interview, format: virtual, duration_min: 60, interviewers: [int_harold]}
      interviewers:
        - id: int_harold
          name: Harold Nwachukwu
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-16T09:00:00-05:00", end: "2026-11-16T12:00:00-05:00", status: busy}
            - {start: "2026-11-17T09:00:00-05:00", end: "2026-11-17T14:00:00-05:00", status: busy}
            - {start: "2026-11-17T15:00:00-05:00", end: "2026-11-17T17:00:00-05:00", status: busy}
            - {start: "2026-11-18T09:00:00-05:00", end: "2026-11-18T12:00:00-05:00", status: busy}
      policies:
        part_of_day_defaults:
          basis: candidate local time unless the candidate defines the term differently
          morning: "09:00-12:00"
          afternoon: "12:00-17:00"
      conversation:
        - role: candidate
          at: "2026-11-12T09:15:00-05:00"
          channel: email
          text: >-
            Hi Rosa, next Monday to Wednesday, mornings are much better for me, but I can make an afternoon work on
            Tuesday if needed.
        - role: recruiter
          at: "2026-11-12T10:00:00-05:00"
          channel: chat
          text: Lucy wants mornings. Find an hour with Harold.
    expected:
      disposition: propose_options
      solution_summary: >-
        Mornings (9:00 a.m.-12:00 p.m. EST) on November 16, 17 and 18 (Monday to Wednesday) are all blocked for Harold. The fallback
        Tuesday afternoon fits once: Tuesday, November 17, 2026, 2:00-3:00 p.m. EST. Propose it, noting it is the
        candidate's less-preferred option and that no morning slot exists.
      must:
        - Treat mornings as a preference and Tuesday afternoon as acceptable availability.
        - Propose exactly Tuesday, November 17, 2:00-3:00 p.m. EST and explain no morning slot fits.
        - Ask whether to book.
      must_not:
        - Report that nothing fits because no morning is free.
        - Propose Monday or Wednesday afternoons, which were not offered.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T00:00:00-05:00", end: "2026-11-19T00:00:00-05:00"}
      participants:
        candidate:
          time_zone: America/New_York
          available:
            - ["2026-11-16T09:00:00-05:00", "2026-11-16T12:00:00-05:00"]
            - ["2026-11-17T09:00:00-05:00", "2026-11-17T17:00:00-05:00"]
            - ["2026-11-18T09:00:00-05:00", "2026-11-18T12:00:00-05:00"]
        int_harold:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy:
            - ["2026-11-16T09:00:00-05:00", "2026-11-16T12:00:00-05:00"]
            - ["2026-11-17T09:00:00-05:00", "2026-11-17T14:00:00-05:00"]
            - ["2026-11-17T15:00:00-05:00", "2026-11-17T17:00:00-05:00"]
            - ["2026-11-18T09:00:00-05:00", "2026-11-18T12:00:00-05:00"]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_harold]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-17T14:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-18T13:00:00-05:00", note: Wednesday afternoon was not offered.}
      valid_start_bounds:
        S1: {earliest: "2026-11-17T14:00:00-05:00", latest: "2026-11-17T14:00:00-05:00"}

  - id: NLP-080
    title: '"3-5 pm your time" written to an India-based coordinator, relayed by a Pacific recruiter'
    category: availability_interpretation
    subcategory: your_time_addressee_not_requester
    description: >-
      A Singapore candidate replies to the coordinator in Hyderabad, "Friday 3-5 pm your time works." A Los Angeles
      recruiter then asks the agent to book. "Your time" refers to the addressee (India time), not the candidate's
      Singapore time and not the recruiter's Pacific time. The Bengaluru interviewer is free at 3 p.m. Singapore time
      (12:30 IST, tempting) and busy at 3:00 IST. Tests addressee resolution in a multi-party thread.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [your_time, addressee_zone, multi_party_thread, singapore, india, half_hour_offset]
    requirement_refs: [INT-03, INT-06, AVL-10]
    inputs:
      now: "2026-11-12T09:00:00-08:00"
      recruiter: {id: rec_scott, name: Scott Delaney, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Wei Jie Ong, time_zone: Asia/Singapore}
      interview_plan:
        name: Payments Product Manager - interview
        sessions:
          - {id: S1, title: Product interview, format: virtual, duration_min: 60, interviewers: [int_arvind]}
      interviewers:
        - id: int_arvind
          name: Arvind Subramanian
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "18:30"}
          calendar:
            - {start: "2026-11-13T15:00:00+05:30", end: "2026-11-13T15:30:00+05:30", status: busy}
      conversation:
        - role: coordinator
          at: "2026-11-10T11:00:00+05:30"
          channel: email
          text: >-
            Hi Wei Jie, I'm Priyanka, coordinating your interview with Arvind from our Hyderabad office. Could you share
            some times on Friday?
        - role: candidate
          at: "2026-11-11T10:00:00+08:00"
          channel: email
          text: |-
            To: Priyanka Menon
            Hi Priyanka, Friday 3-5 pm your time works for me. Thanks, Wei Jie
        - role: recruiter
          at: "2026-11-12T09:00:00-08:00"
          channel: chat
          text: Wei Jie said Friday 3-5. Can you get Arvind booked?
    expected:
      disposition: propose_options
      solution_summary: >-
        "Your time" is Priyanka's India time: Friday, November 13, 2026, 3:00-5:00 p.m. IST (5:30-7:30 p.m. SGT). Arvind is
        busy until 3:30 p.m. IST, so the hour can start from 3:30 to 4:00 p.m. IST (6:00-6:30 p.m. SGT; Friday 2:00-2:30
        a.m. PST).
      must:
        - Resolve "your time" to the addressee Priyanka's Asia/Kolkata time.
        - Propose only starts from 3:30 to 4:00 p.m. IST (6:00-6:30 p.m. SGT) on Friday, November 13.
        - Show the candidate-facing time in Singapore time.
        - Ask whether to book.
      must_not:
        - Read the window as 3-5 p.m. Singapore time (12:30-2:30 p.m. IST).
        - Read the window as 3-5 p.m. Pacific time.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-13T10:00:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-13T15:30", expected_weekday: Friday, expected_utc_offset: "+05:30"}
      - {instant: "2026-11-13T10:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-11-13T18:00", expected_utc_offset: "+08:00"}
      - {instant: "2026-11-13T10:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-13T02:00", expected_weekday: Friday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-13T00:00:00+05:30", end: "2026-11-14T00:00:00+05:30"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-11-13T15:00:00+05:30", "2026-11-13T17:00:00+05:30"]]
        int_arvind:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "18:30"}
          busy: [["2026-11-13T15:00:00+05:30", "2026-11-13T15:30:00+05:30"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_arvind]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-13T15:30:00+05:30"}
      invalid_examples:
        - {S1: "2026-11-13T12:30:00+05:30", note: 3 p.m. Singapore time; the candidate meant Priyanka's time.}
        - {S1: "2026-11-13T15:00:00+05:30", note: Arvind busy.}
      valid_start_bounds:
        S1: {earliest: "2026-11-13T15:30:00+05:30", latest: "2026-11-13T16:00:00+05:30"}
