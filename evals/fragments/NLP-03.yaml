  - id: NLP-068
    title: '"Same time next week" spans a US/UK daylight-saving mismatch - which clock?'
    category: availability_interpretation
    subcategory: same_time_next_week_dst
    description: >-
      Round 1 was Tuesday, March 9, 2027, 10:00 a.m. PST = 6:00 p.m. GMT. The London candidate says "same time next week"
      for round 2. On Tuesday, March 16 the US is on PDT but the UK is still on GMT, so "same time" is either 10:00 a.m. PDT
      (5:00 p.m. GMT) or 6:00 p.m. GMT (11:00 a.m. PDT). The agent must surface both and ask.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [same_time_next_week, dst_mismatch, relative_reference, london, los_angeles]
    requirement_refs: [INT-03, INT-05, EC-019]
    inputs:
      now: "2027-03-10T09:00:00-08:00"
      recruiter: {id: rec_wesley, name: Wesley Grant, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Freddie Ashworth, time_zone: Europe/London}
      interview_plan:
        name: Game Economy Designer - round 2
        sessions:
          - {id: R2, title: Round 2 interview, format: virtual, duration_min: 60, interviewers: [int_sunita]}
      interviewers:
        - {id: int_sunita, name: Sunita Rao, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
      case_state:
        existing_bookings:
          - {session: R1, start: "2027-03-09T10:00:00-08:00", end: "2027-03-09T11:00:00-08:00", booking_state: completed}
      conversation:
        - role: candidate
          at: "2027-03-09T19:30:00+00:00"
          channel: email
          text: Thanks for today! Same time next week works for round 2.
        - role: recruiter
          at: "2027-03-10T09:00:00-08:00"
          channel: chat
          text: Freddie wants the same time next week. Book round 2 with Sunita.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Round 1 was Tuesday, March 9, 2027, 10:00 a.m. PST = 6:00 p.m. GMT. On Tuesday, March 16 the US is on daylight time
        but London is not, so "same time" is either 6:00 p.m. GMT (11:00 a.m. PDT) or 10:00 a.m. PDT (5:00 p.m. GMT). Ask
        which; the candidate most likely means his own 6:00 p.m., but it must be confirmed.
      must:
        - Present both concrete options for Tuesday, March 16, 2027 with both zones.
        - Explain that the US changed clocks on March 14 while the UK changes on March 28.
        - Ask a single focused question.
      must_not:
        - Silently pick 10:00 a.m. PDT or 6:00 p.m. GMT.
        - Assume the usual eight-hour London-Pacific difference.
        - Book without confirmation.
      side_effects: {external_writes: none}
      clarifying_question_topics: [same_time_in_which_zone]
    local_time_checks:
      - {instant: "2027-03-09T18:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-09T10:00", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2027-03-16T17:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-16T10:00", expected_weekday: Tuesday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-16T18:00:00Z", time_zone: Europe/London, expected_local: "2027-03-16T18:00", expected_utc_offset: "+00:00"}
      - {local: "2027-03-14T02:30", time_zone: America/Los_Angeles, expect: nonexistent}

