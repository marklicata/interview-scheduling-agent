        int_raj:
          time_zone: Asia/Singapore
          busy: [["2026-12-09T13:00:00+08:00", "2026-12-09T14:10:00+08:00"], ["2026-12-09T15:20:00+08:00", "2026-12-09T16:30:00+08:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_raj]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-09T14:10:00+08:00"}
        - {S1: "2026-12-09T14:20:00+08:00"}
      invalid_examples:
        - {S1: "2026-12-09T14:00:00+08:00", note: No buffer after the 13:00 meeting.}
        - {S1: "2026-12-09T14:30:00+08:00", note: No buffer before the 15:30 meeting.}
      valid_start_bounds:
