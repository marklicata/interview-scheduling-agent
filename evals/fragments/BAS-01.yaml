        name: Pieter van der Merwe
        time_zone: Africa/Johannesburg
        availability:
          - {start: "2026-12-03T13:00:00+02:00", end: "2026-12-03T15:00:00+02:00"}
      interview_plan:
        name: Woodgrove Management Consultant - case interview
        sessions:
          - {id: S1, title: Case interview, format: virtual, duration_text: "1.5 hours", interviewers: [int_sipho]}
      interviewers:
        - id: int_sipho
          name: Sipho Dlamini
          time_zone: Africa/Johannesburg
          availability_source: calendar
          calendar:
            - {start: "2026-12-03T13:00:00+02:00", end: "2026-12-03T13:15:00+02:00", status: busy}
      conversation:
        - role: recruiter
          text: Pieter has Thursday 1-3pm. The case interview with Sipho is 1.5 hours. Does it fit?
    expected:
      disposition: propose_options
      solution_summary: Yes - a 90-minute case interview starting between 13:15 and 13:30 SAST on Thursday, December 3, 2026 (e.g. 13:15-14:45).
      must:
        - Treat "1.5 hours" as 90 minutes.
        - Propose only starts from 13:15 to 13:30 SAST on Thursday, December 3.
        - Ask whether to book.
      must_not:
        - Treat the duration as 1 hour 50 minutes, 1 hour 5 minutes, or 60 minutes.
        - Propose 13:00 (Sipho busy) or any start after 13:30 (ends after 15:00).
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T08:00:00+02:00", end: "2026-12-03T18:00:00+02:00"}
      participants:
        candidate: {time_zone: Africa/Johannesburg, available: [["2026-12-03T13:00:00+02:00", "2026-12-03T15:00:00+02:00"]]}
        int_sipho: {time_zone: Africa/Johannesburg, busy: [["2026-12-03T13:00:00+02:00", "2026-12-03T13:15:00+02:00"]]}
      sessions:
        - {id: S1, duration_min: 90, attendees: [candidate, int_sipho]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-03T13:15:00+02:00"}
        - {S1: "2026-12-03T13:30:00+02:00"}
      invalid_examples:
        - {S1: "2026-12-03T13:45:00+02:00", note: Ends 15:15 - past the candidate's limit.}
        - {S1: "2026-12-03T13:00:00+02:00", note: Sipho busy until 13:15.}
      valid_start_bounds:
        S1: {earliest: "2026-12-03T13:15:00+02:00", latest: "2026-12-03T13:30:00+02:00"}

