          working_hours: {time_zone: Asia/Kolkata, start: "09:30", end: "18:00"}
          busy: [["2026-11-23T11:00:00+05:30", "2026-11-23T13:00:00+05:30"]]
        int_sanjay:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, start: "09:30", end: "18:00"}
          busy: [["2026-11-23T10:00:00+05:30", "2026-11-23T11:00:00+05:30"], ["2026-11-24T10:00:00+05:30", "2026-11-24T11:00:00+05:30"]]
      sessions:
