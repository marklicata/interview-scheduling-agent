        int_colin:
          time_zone: America/Halifax
          working_hours: {time_zone: America/Halifax, days: [Mon, Tue, Wed, Thu, Fri], start: "08:30", end: "16:30"}
          busy: [["2026-12-03T13:00:00-04:00", "2026-12-03T14:00:00-04:00"]]
