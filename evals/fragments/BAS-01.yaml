        time_zone: America/Detroit
        availability:
          - {start: "2026-12-15T06:30:00-05:00", end: "2026-12-15T08:30:00-05:00"}
      interview_plan:
        name: Northwind Warehouse Shift Lead - onsite interview
        sessions:
          - {id: S1, title: Shift lead interview, format: in_person, duration_min: 45, interviewers: [int_gary], venue: "Northwind Distribution Center, 1200 Example Parkway, Building C - Dock 4 visitor entrance"}
      interviewers:
        - id: int_gary
          name: Gary Kowalski
          role: Shift supervisor
