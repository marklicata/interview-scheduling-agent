          - {start: "2026-12-08T09:00:00-04:00", end: "2026-12-08T12:00:00-04:00"}
      interview_plan:
        name: Tailspin Aircraft Maintenance Planner - interview
        sessions:
          - {id: S1, title: Planner interview, format: virtual, duration_min: 60, interviewers: [int_colin]}
      interviewers:
        - id: int_colin
          name: Colin Fraser
          time_zone: America/Halifax
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:30", end: "16:30"}
          calendar:
            - {start: "2026-12-03T13:00:00-04:00", end: "2026-12-03T14:00:00-04:00", status: busy}
      conversation:
        - role: recruiter
          text: Chidi gave me Thu 1-4 this week and Tue 9-12 next week. Show me what works this week and what works next week, separately please.
