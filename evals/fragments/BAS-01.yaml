    category: basic_scheduling
    subcategory: duration_in_hours
    description: >-
      The plan and the recruiter state the case interview as "1.5 hours". The agent must convert this to 90 minutes
      (not 1 hour 50 minutes or 1 hour 5 minutes) and find the narrow range of starts that fit inside a two-hour
      window after a 15-minute conflict.
