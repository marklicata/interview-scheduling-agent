      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-23T10:00:00+05:30", S2: "2026-11-23T11:15:00+05:30"}
        - {S1: "2026-11-24T10:00:00+05:30", S2: "2026-11-24T11:15:00+05:30"}
        - {S1: "2026-11-24T10:00:00+05:30", S2: "2026-11-23T11:00:00+05:30", note: Valid split-day fallback only.}
      invalid_examples:
        - {S1: "2026-11-23T10:00:00+05:30", S2: "2026-11-23T11:00:00+05:30", note: No 15-minute break.}
        - {S1: "2026-11-23T11:15:00+05:30", S2: "2026-11-23T10:00:00+05:30", note: Meera busy 11-1 Monday; Sanjay busy 10-11.}
