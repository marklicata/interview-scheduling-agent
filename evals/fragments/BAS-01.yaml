# Basic scheduling cases (BAS-001..BAS-040): happy paths, simple variants, option counts, exact boundaries.
test_cases:
  - id: BAS-001
    title: Single 30-minute phone screen where only one of two candidate windows survives
    category: basic_scheduling
    subcategory: single_phone_screen_same_zone
    description: >-
      Nairobi candidate offers two windows on consecutive days for a recruiter phone screen. The interviewer's
      calendar removes Friday entirely and most of Thursday, leaving a 15-minute range of valid starts. Tests that
      a single phone screen is treated as a first-class one-session request with phone logistics, that the whole
      30 minutes must fit, and that the agent proposes before booking.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [single_session, same_time_zone, phone_logistics, propose_then_confirm, kenya]
    requirement_refs: [CON-12, SCH-01, ACT-01, EC-137]
    inputs:
      now: "2026-11-09T09:00:00+03:00"
      recruiter: {id: rec_wanjiru, name: Wanjiru Kamau, time_zone: Africa/Nairobi}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Amina Hassan
        phone: "+254 700 555 014"
        time_zone: Africa/Nairobi
        availability:
          - {start: "2026-11-12T14:00:00+03:00", end: "2026-11-12T16:00:00+03:00"}
          - {start: "2026-11-13T09:00:00+03:00", end: "2026-11-13T10:00:00+03:00"}
      interview_plan:
        name: Litware Customer Support Team Lead - recruiter phone screen
        region: East Africa
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_otieno]}
      interviewers:
        - id: int_otieno
          name: Otieno Ochieng
          time_zone: Africa/Nairobi
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-12T14:00:00+03:00", end: "2026-11-12T15:15:00+03:00", status: busy}
            - {start: "2026-11-13T08:30:00+03:00", end: "2026-11-13T10:00:00+03:00", status: busy}
      conversation:
        - role: recruiter
          at: "2026-11-09T08:58:00+03:00"
          channel: chat
          text: >-
            Amina can do Thursday 2-4pm or Friday 9-10am, Nairobi time. Can you find a slot for her 30 min phone
            screen with Otieno? He'll call her on her mobile.
    expected:
      disposition: propose_options
      solution_summary: >-
        Only Thursday, November 12, 2026 works - any 30-minute start from 3:15 to 3:30 p.m. EAT (for example
        3:15-3:45 p.m.). Friday 9-10 a.m. is fully covered by Otieno's busy block.
      must:
        - Propose only starts from 3:15 to 3:30 p.m. EAT on Thursday, November 12; the full 30 minutes must end by 4:00 p.m.
        - Explain that Friday, November 13 has no fit because Otieno is busy 8:30-10:00 a.m.
        - Present the session as a phone screen in which Otieno calls Amina at the number she supplied.
        - Ask whether to book the selected option.
      must_not:
        - Book, hold, or send anything before explicit recruiter confirmation.
        - Propose any start before 3:15 p.m. on Thursday, which would overlap Otieno's busy block.
        - Propose 3:45 p.m. or later, which would run past the candidate's 4:00 p.m. limit.
        - Add a Teams link as the primary joining method or turn the screen into a loop.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-12T12:15:00Z", time_zone: Africa/Nairobi, expected_local: "2026-11-12T15:15", expected_weekday: Thursday, expected_utc_offset: "+03:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-12T00:00:00+03:00", end: "2026-11-14T00:00:00+03:00"}
      participants:
        candidate:
          time_zone: Africa/Nairobi
          available: [["2026-11-12T14:00:00+03:00", "2026-11-12T16:00:00+03:00"], ["2026-11-13T09:00:00+03:00", "2026-11-13T10:00:00+03:00"]]
        int_otieno:
          time_zone: Africa/Nairobi
          working_hours: {time_zone: Africa/Nairobi, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy: [["2026-11-12T14:00:00+03:00", "2026-11-12T15:15:00+03:00"], ["2026-11-13T08:30:00+03:00", "2026-11-13T10:00:00+03:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_otieno]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-12T15:15:00+03:00"}
        - {S1: "2026-11-12T15:30:00+03:00"}
      invalid_examples:
        - {S1: "2026-11-12T15:00:00+03:00", note: Overlaps Otieno's busy block until 3:15 p.m.}
        - {S1: "2026-11-13T09:00:00+03:00", note: Otieno is busy all of Friday's window.}
        - {S1: "2026-11-12T15:45:00+03:00", note: Runs past the candidate's 4:00 p.m. limit.}
      valid_start_bounds:
        S1: {earliest: "2026-11-12T15:15:00+03:00", latest: "2026-11-12T15:30:00+03:00"}

  - id: BAS-002
    title: 45-minute virtual 1:1 between a London candidate and a Warsaw interviewer
    category: basic_scheduling
    subcategory: single_virtual_two_zones
    description: >-
      A 45-minute Teams interview between a candidate in London and an interviewer in Warsaw, one hour apart in
      November. The interviewer's 11:30 a.m. CET meeting removes the first half of the candidate's window. Tests a
      simple virtual 1:1 with correct dual-zone presentation and Teams as the joining method.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [single_session, two_time_zones, teams, uk, poland]
    requirement_refs: [CON-12, SCH-01, AVL-10, COM-02, ACT-01]
    inputs:
      now: "2026-11-12T10:00:00+00:00"
      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tomasz Wisniewski
        time_zone: Europe/London
        availability:
          - {start: "2026-11-17T10:00:00+00:00", end: "2026-11-17T12:00:00+00:00"}
      interview_plan:
        name: Fabrikam Data Analyst - technical interview
        region: EMEA
        sessions:
          - {id: S1, title: SQL and analytics interview, format: virtual, duration_min: 45, interviewers: [int_agnieszka]}
      interviewers:
        - id: int_agnieszka
          name: Agnieszka Lewandowska
          time_zone: Europe/Warsaw
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T11:30:00+01:00", end: "2026-11-17T12:00:00+01:00", status: busy}
      conversation:
        - role: recruiter
          text: Tomasz is free 10-12 London time on Tuesday 17 November. Can you line up the 45 min Teams interview with Agnieszka?
    expected:
      disposition: propose_options
      solution_summary: >-
        Any 45-minute start from 11:00 to 11:15 a.m. GMT (12:00-12:15 p.m. CET) on Tuesday, November 17, 2026,
        e.g. 11:00-11:45 a.m. GMT / 12:00-12:45 p.m. CET, as a Teams meeting.
      must:
        - Propose only starts from 11:00 to 11:15 a.m. GMT (12:00-12:15 p.m. CET) on Tuesday, November 17.
        - Show each option in both Europe/London and Europe/Warsaw local time.
        - Describe the session as a virtual Teams interview.
        - Ask whether to book.
      must_not:
        - Propose 10:00-11:00 a.m. GMT starts, which overlap Agnieszka's 11:30 a.m.-12:00 p.m. CET meeting.
        - Treat the two cities as being in the same time zone.
        - Book or send an invitation without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T11:00:00Z", time_zone: Europe/London, expected_local: "2026-11-17T11:00", expected_weekday: Tuesday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-17T11:00:00Z", time_zone: Europe/Warsaw, expected_local: "2026-11-17T12:00", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00Z", end: "2026-11-18T00:00:00Z"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2026-11-17T10:00:00+00:00", "2026-11-17T12:00:00+00:00"]]}
        int_agnieszka:
          time_zone: Europe/Warsaw
          working_hours: {time_zone: Europe/Warsaw, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-17T11:30:00+01:00", "2026-11-17T12:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_agnieszka]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-17T11:00:00+00:00"}
      invalid_examples:
        - {S1: "2026-11-17T10:00:00+00:00", note: Overlaps the 11:30 CET meeting (10:30 GMT).}
        - {S1: "2026-11-17T11:30:00+00:00", note: Ends after the candidate's noon limit.}
      valid_start_bounds:
        S1: {earliest: "2026-11-17T11:00:00+00:00", latest: "2026-11-17T11:15:00+00:00"}

  - id: BAS-003
    title: 60-minute in-person 1:1 at a supplied office venue
    category: basic_scheduling
    subcategory: single_in_person_with_venue
    description: >-
      Munich in-person interview with a supplied office address. The time problem is simple (one busy block), but
      the proposal must carry the venue, must not invent a Teams link as the meeting mode, and must not claim a
      meeting room is reserved because room booking is not an MVP capability.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [in_person_1on1]
    tags: [single_session, in_person, venue_details, no_room_booking, germany]
    requirement_refs: [CON-12, SCH-01, COM-02, EC-104]
    inputs:
      now: "2026-11-11T09:00:00+01:00"
      recruiter: {id: rec_lukas, name: Lukas Brandt, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Selin Aydin
        time_zone: Europe/Berlin
        availability:
          - {start: "2026-11-18T13:00:00+01:00", end: "2026-11-18T17:00:00+01:00"}
      interview_plan:
        name: Fabrikam Mechanical Design Engineer - onsite interview
        region: DACH
        sessions:
          - id: S1
            title: Engineering interview
            format: in_person
            duration_min: 60
            interviewers: [int_greta]
            venue: "Fabrikam Munich office, Musterstrasse 12, 80331 Muenchen - reception on the 3rd floor"
      interviewers:
        - id: int_greta
          name: Greta Hoffmann
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-18T13:00:00+01:00", end: "2026-11-18T14:30:00+01:00", status: busy}
      policies:
        room_booking: not supported in MVP; the recruiter reserves rooms separately
      conversation:
        - role: recruiter
          text: Selin can come to the Munich office next Wednesday afternoon (1-5pm). Please find an hour with Greta.
    expected:
      disposition: propose_options
      solution_summary: >-
        Any 60-minute start from 2:30 to 4:00 p.m. CET on Wednesday, November 18, 2026 at the Fabrikam Munich office
        (Musterstrasse 12, reception 3rd floor); for example 2:30-3:30 p.m. Room reservation remains with the recruiter.
      must:
        - Propose only starts from 2:30 to 4:00 p.m. CET on Wednesday, November 18.
        - Include the supplied venue address and reception instructions in the proposal.
        - State that no meeting room has been reserved and that room booking is handled by the recruiter.
        - Ask whether to book the invitation.
      must_not:
        - Propose any start before 2:30 p.m., which overlaps Greta's busy block.
        - Present the interview as a Teams meeting or silently change it to virtual.
        - Claim a room is reserved or attempt to book a room resource.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T00:00:00+01:00", end: "2026-11-19T00:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Berlin, available: [["2026-11-18T13:00:00+01:00", "2026-11-18T17:00:00+01:00"]]}
        int_greta:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-18T13:00:00+01:00", "2026-11-18T14:30:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_greta]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-18T14:30:00+01:00"}
        - {S1: "2026-11-18T16:00:00+01:00"}
      invalid_examples:
        - {S1: "2026-11-18T14:00:00+01:00", note: Greta is busy until 2:30 p.m.}
        - {S1: "2026-11-18T16:15:00+01:00", note: Ends after both the candidate window and Greta's working hours.}
      valid_start_bounds:
        S1: {earliest: "2026-11-18T14:30:00+01:00", latest: "2026-11-18T16:00:00+01:00"}

  - id: BAS-004
    title: Many valid slots - return at most three distinct, well-spread options
    category: basic_scheduling
    subcategory: option_count_many
    description: >-
      Candidate and interviewer share most of two working days, so dozens of valid 60-minute starts exist. The agent
      must return up to three distinct options (not a dump of every 5-minute start and not three near-identical
      adjacent starts), each fully valid.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [option_count, up_to_three_options, distinct_options, presentation]
    requirement_refs: [SCH-02, SCH-01, COM-02]
    inputs:
      now: "2026-11-12T08:00:00-06:00"
      recruiter: {id: rec_marcus, name: Marcus Bell, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Leilani Kahale
        time_zone: America/Chicago
        availability:
          - {start: "2026-11-17T09:00:00-06:00", end: "2026-11-17T17:00:00-06:00"}
          - {start: "2026-11-18T09:00:00-06:00", end: "2026-11-18T17:00:00-06:00"}
      interview_plan:
        name: Northwind Operations Manager - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_sofia]}
      interviewers:
        - id: int_sofia
          name: Sofia Restrepo
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-17T12:00:00-06:00", end: "2026-11-17T13:00:00-06:00", status: busy}
            - {start: "2026-11-18T09:00:00-06:00", end: "2026-11-18T10:00:00-06:00", status: busy}
      conversation:
        - role: recruiter
          text: Leilani is wide open Tue and Wed next week. Give me some options for her HM chat with Sofia.
    expected:
      disposition: propose_options
      solution_summary: >-
        Three distinct options, e.g. Tuesday, November 17 at 9:00-10:00 a.m. CST, Tuesday, November 17 at
        2:00-3:00 p.m. CST, and Wednesday, November 18 at 10:30-11:30 a.m. CST. Any 60-minute start avoiding
        Sofia's Tuesday 12-1 p.m. and Wednesday 9-10 a.m. blocks and ending by 5:00 p.m. is valid.
      must:
        - Return no more than three options, each a complete 60-minute slot.
        - Make the options materially distinct (different days or clearly different times of day), not adjacent 5-minute variants.
        - Ensure every option avoids Tuesday 12:00-1:00 p.m. and Wednesday 9:00-10:00 a.m. CST and ends by 5:00 p.m.
        - Ask which option to book.
      must_not:
        - List every possible start time.
        - Offer three options that start within a few minutes of each other.
        - Book anything without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00-06:00", end: "2026-11-19T00:00:00-06:00"}
      participants:
        candidate:
          time_zone: America/Chicago
          available: [["2026-11-17T09:00:00-06:00", "2026-11-17T17:00:00-06:00"], ["2026-11-18T09:00:00-06:00", "2026-11-18T17:00:00-06:00"]]
        int_sofia:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-17T12:00:00-06:00", "2026-11-17T13:00:00-06:00"], ["2026-11-18T09:00:00-06:00", "2026-11-18T10:00:00-06:00"]]
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_sofia]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-17T09:00:00-06:00"}
        - {HM: "2026-11-17T14:00:00-06:00"}
        - {HM: "2026-11-18T10:30:00-06:00"}
      invalid_examples:
        - {HM: "2026-11-17T11:30:00-06:00", note: Overlaps Sofia's noon block.}
        - {HM: "2026-11-18T09:30:00-06:00", note: Overlaps Sofia's Wednesday 9-10 block.}
        - {HM: "2026-11-18T16:30:00-06:00", note: Ends after 5 p.m.}
      valid_start_bounds:
        HM: {earliest: "2026-11-17T09:00:00-06:00", latest: "2026-11-18T16:00:00-06:00"}
    grading_notes: Any three valid, distinct options pass; the specific examples are illustrative.

  - id: BAS-005
    title: Exactly one valid slot exists - present it alone even though three were requested
    category: basic_scheduling
    subcategory: option_count_single
    description: >-
      The recruiter asks for three options, but the interviewer's two meetings leave exactly one 60-minute fit
      inside the candidate's window. The agent must present the single option, say it is the only one, and not
      invent alternatives that violate a constraint.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [option_count, single_option, no_invented_alternatives, canada]
    requirement_refs: [SCH-02, SCH-01, INV-02]
    inputs:
      now: "2026-11-16T09:00:00-05:00"
      recruiter: {id: rec_noor, name: Noor Rahman, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Etienne Gagnon
        time_zone: America/Toronto
        availability:
          - {start: "2026-11-19T13:00:00-05:00", end: "2026-11-19T15:00:00-05:00"}
      interview_plan:
        name: Adatum Backend Developer - coding interview
        sessions:
          - {id: S1, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_kwame]}
      interviewers:
        - id: int_kwame
          name: Kwame Asante
          time_zone: America/Toronto
          availability_source: calendar
          calendar:
            - {start: "2026-11-19T13:00:00-05:00", end: "2026-11-19T13:30:00-05:00", status: busy}
            - {start: "2026-11-19T14:30:00-05:00", end: "2026-11-19T16:00:00-05:00", status: busy}
      conversation:
        - role: recruiter
          text: Etienne is free Thursday 1-3 pm Eastern. Send me 3 options for the coding interview with Kwame so he can pick.
    expected:
      disposition: propose_options
      solution_summary: Only one option exists - Thursday, November 19, 2026, 1:30-2:30 p.m. EST.
      must:
        - Present exactly one option, 1:30-2:30 p.m. EST on Thursday, November 19.
        - State clearly that it is the only time that fits Etienne's window and Kwame's calendar.
        - Optionally offer next steps (ask Etienne for more availability) if the recruiter wants alternatives.
        - Ask whether to book it.
      must_not:
        - Invent a second or third option such as 1:00 p.m. or 2:00 p.m. that overlaps Kwame's meetings.
        - Shorten the interview to create extra options.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T08:00:00-05:00", end: "2026-11-19T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Toronto, available: [["2026-11-19T13:00:00-05:00", "2026-11-19T15:00:00-05:00"]]}
        int_kwame:
          time_zone: America/Toronto
          busy: [["2026-11-19T13:00:00-05:00", "2026-11-19T13:30:00-05:00"], ["2026-11-19T14:30:00-05:00", "2026-11-19T16:00:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_kwame]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-19T13:30:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-19T13:00:00-05:00", note: Overlaps Kwame's 1:00-1:30 meeting.}
        - {S1: "2026-11-19T14:00:00-05:00", note: Overlaps Kwame's 2:30 meeting.}
      valid_start_bounds:
        S1: {earliest: "2026-11-19T13:30:00-05:00", latest: "2026-11-19T13:30:00-05:00"}

  - id: BAS-006
    title: Candidate prefers mornings - rank morning options first without excluding afternoons
    category: basic_scheduling
    subcategory: soft_preference_mornings
    description: >-
      The candidate is available all day but says mornings are best and afternoons are possible. Valid morning and
      afternoon slots both exist. The agent should treat mornings as a soft preference: rank morning options first,
      keep afternoons as valid fallbacks, and not invent a hard morning-only rule.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [soft_preference, ranking, mornings_preferred, preference_vs_constraint]
    requirement_refs: [SCH-06, CON-05, EC-013]
    inputs:
      now: "2026-11-16T10:00:00-07:00"
      recruiter: {id: rec_alana, name: Alana Whitehorse, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mateo Fernandez
        time_zone: America/Denver
        availability:
          - {start: "2026-11-18T08:00:00-07:00", end: "2026-11-18T17:00:00-07:00"}
        preferences: ["Mornings are best for me, but afternoons work if needed."]
      interview_plan:
        name: Proseware UX Researcher - research interview
        sessions:
