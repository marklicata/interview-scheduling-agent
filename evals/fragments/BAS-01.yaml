    subcategory: this_week_vs_next_week
    description: >-
      The recruiter wants to see what works this week and next week separately. Thursday this week has a one-hour
      range of starts after the interviewer's meeting; next Tuesday has a two-hour range. Tests correct week grouping
      and labeling with absolute dates.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
