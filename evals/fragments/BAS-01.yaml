  - id: BAS-019
    title: Interviewer free all week and candidate says any time - choose sensible working-hour options
    category: basic_scheduling
    subcategory: wide_open_calendars
    description: >-
      The interviewer's calendar is empty all next week and the candidate says "any time". The agent must not treat
      this as 24/7 availability; options should fall within the interviewer's working hours on weekdays and be
      spread out, and the agent should note the assumption about the candidate's hours.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [wide_open, sensible_hours, any_time_candidate, colombia, option_count]
    requirement_refs: [SCH-02, AVL-03, EC-007]
    inputs:
      now: "2026-11-25T09:00:00-05:00"
      recruiter: {id: rec_andres, name: Andres Villamizar, time_zone: America/Bogota}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Valentina Herrera
        time_zone: America/Bogota
        availability_text: "I'm flexible, any time next week works for me."
      interview_plan:
        name: Fabrikam Supply Chain Analyst - interview
        sessions:
          - {id: S1, title: Supply chain interview, format: virtual, duration_min: 60, interviewers: [int_juliana]}
      interviewers:
        - id: int_juliana
          name: Juliana Ospina
          time_zone: America/Bogota
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar: []
      conversation:
        - role: candidate
          channel: email
          text: I'm flexible, any time next week works for me!
        - role: recruiter
          text: Valentina says any time next week. Juliana's calendar is empty. Give me a few options.
    expected:
      disposition: propose_options
      solution_summary: >-
        Up to three spread-out weekday options within 08:00-17:00 COT during November 30-December 4, 2026, e.g.
        Monday, November 30 at 09:00-10:00, Wednesday, December 2 at 14:00-15:00, Friday, December 4 at 10:00-11:00
        COT, noting the assumption that "any time" means normal daytime hours.
      must:
        - Offer no more than three options, all on weekdays between 08:00 and 17:00 Bogota time.
        - Spread the options across different days or times of day.
        - Note that "any time" was interpreted as normal business hours and invite the recruiter to correct it.
        - Ask which option to book.
      must_not:
        - Propose early-morning, late-evening, or weekend times outside Juliana's working hours.
        - Dump a long list of every open hour.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-30T00:00:00-05:00", end: "2026-12-05T00:00:00-05:00"}
      participants:
        candidate: {time_zone: America/Bogota}
        int_juliana:
          time_zone: America/Bogota
          working_hours: {time_zone: America/Bogota, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_juliana]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-30T09:00:00-05:00"}
        - {S1: "2026-12-02T14:00:00-05:00"}
        - {S1: "2026-12-04T10:00:00-05:00"}
      invalid_examples:
        - {S1: "2026-11-30T06:00:00-05:00", note: Before Juliana's working hours.}
        - {S1: "2026-12-01T16:30:00-05:00", note: Runs past 17:00.}
      valid_start_bounds:
        S1: {earliest: "2026-11-30T08:00:00-05:00", latest: "2026-12-04T16:00:00-05:00"}

