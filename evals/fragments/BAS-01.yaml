  - id: BAS-030
    title: Ten-minute buffer policy around existing meetings narrows the valid starts
    category: basic_scheduling
    subcategory: buffer_policy
    description: >-
      Contrast with BAS-009. The policy requires a 10-minute buffer before and after an interviewer's existing
      meetings. Without the buffer, starts from 14:00 to 14:30 would fit; with it, only 14:10 to 14:20 are valid.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [buffer_policy, policy_constraint, singapore]
    requirement_refs: [CON-04, EC-025, SCH-01]
    inputs:
      now: "2026-12-03T09:00:00+08:00"
      recruiter: {id: rec_farah, name: Farah Ismail, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Daniel Lim
        time_zone: Asia/Singapore
        availability:
          - {start: "2026-12-09T14:00:00+08:00", end: "2026-12-09T16:00:00+08:00"}
      interview_plan:
        name: Woodgrove Treasury Analyst - interview
        sessions:
          - {id: S1, title: Treasury interview, format: virtual, duration_min: 60, interviewers: [int_raj]}
      interviewers:
        - id: int_raj
          name: Raj Kumar
          time_zone: Asia/Singapore
          availability_source: calendar
          calendar:
            - {start: "2026-12-09T13:00:00+08:00", end: "2026-12-09T14:00:00+08:00", status: busy}
            - {start: "2026-12-09T15:30:00+08:00", end: "2026-12-09T16:30:00+08:00", status: busy}
      policies:
        interviewer_buffer_min: 10
        buffer_rule: Leave at least 10 minutes between an interview and any of the interviewer's existing meetings, before and after.
      conversation:
        - role: recruiter
          text: Daniel is free Wednesday 2-4pm SGT. Need an hour with Raj.
    expected:
      disposition: propose_options
      solution_summary: Any start from 14:10 to 14:20 SGT on Wednesday, December 9, 2026 (e.g. 14:10-15:10), honoring the 10-minute buffer policy.
      must:
        - Propose only starts from 14:10 to 14:20 SGT on Wednesday, December 9.
        - Explain that the 10-minute buffer policy removes 14:00 and starts after 14:20.
        - Ask whether to book.
      must_not:
        - Propose 14:00, immediately after Raj's meeting.
        - Propose 14:30, which ends exactly when Raj's next meeting starts.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
