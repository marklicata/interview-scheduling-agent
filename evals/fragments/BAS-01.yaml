  - id: BAS-013
    title: Two sessions - prefer finishing on one day over an equally valid split
    category: basic_scheduling
    subcategory: fewer_days_preferred
    description: >-
      Two 60-minute interviews with a 15-minute minimum break. Valid schedules exist on a single day (Monday or
      Tuesday) and also split across both days. The candidate asked to finish on one day, so the agent should rank
      single-day options first and only offer a split as a disclosed fallback.
