        - id: int_sanjay
          name: Sanjay Gupta
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:30", end: "18:00"}
          calendar:
            - {start: "2026-11-23T10:00:00+05:30", end: "2026-11-23T11:00:00+05:30", status: busy}
            - {start: "2026-11-24T10:00:00+05:30", end: "2026-11-24T11:00:00+05:30", status: busy}
      conversation:
        - role: recruiter
          text: Rohan can do Mon or Tue mornings 10-1 and would rather do both interviews in one go. What works?
    expected:
      disposition: propose_options
      solution_summary: >-
        Single-day options first, e.g. Monday, November 23, 2026 - Technical with Meera 10:00-11:00 a.m. IST, then
        HM with Sanjay 11:15 a.m.-12:15 p.m. IST; or the same pattern on Tuesday, November 24. A split across both
        days is valid but should only be a fallback.
      must:
        - Rank at least one single-day schedule (Monday or Tuesday) above any split-day schedule.
        - Keep a break of at least 15 minutes between the two interviews and keep each within 10:00 a.m.-1:00 p.m. IST.
        - Keep Meera out of Monday 11:00 a.m.-1:00 p.m. and Sanjay out of 10:00-11:00 a.m. on both days.
