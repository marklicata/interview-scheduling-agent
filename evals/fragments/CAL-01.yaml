      - {instant: "2027-01-21T04:00:00Z", time_zone: Asia/Manila, expected_local: "2027-01-21T12:00", expected_utc_offset: "+08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-21T09:00:00+09:00", end: "2027-01-21T18:00:00+09:00"}
      participants:
        candidate: {time_zone: Asia/Manila, available: [["2027-01-21T12:00:00+08:00", "2027-01-21T15:00:00+08:00"]]}
        int_seojun:
