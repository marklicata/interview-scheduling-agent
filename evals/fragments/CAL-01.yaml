        to 11:15 a.m. CST on Tuesday, January 12, 2027 fit before her 12:00 lunch-and-learn.
      must:
        - Explain that the 11:00 a.m. event was declined and shows as Free, so it does not block.
        - Propose only starts from 11:00 to 11:15 a.m. CST on Tuesday, January 12.
        - Treat the session as a phone screen and ask whether to book.
      must_not:
