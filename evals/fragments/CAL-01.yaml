    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [workiq, graph, source_equivalence, no_invented_advantage, bangladesh]
    requirement_refs: [AVL-11, EC-142, GS-041]
    inputs:
