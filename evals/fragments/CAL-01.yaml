      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sander Holm
        time_zone: Europe/Oslo
        availability:
          - {start: "2027-01-08T13:00:00+01:00", end: "2027-01-08T15:00:00+01:00"}
          - {start: "2027-01-19T13:00:00+01:00", end: "2027-01-19T15:00:00+01:00"}
      interview_plan:
        name: Energy Systems Engineer - system design
        sessions:
          - {id: SD, title: System design, format: virtual, duration_min: 60, interviewers: [int_erik]}
      interviewers:
        - id: int_erik
          name: Erik Nilsen
          time_zone: Europe/Oslo
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "16:00"}
          calendar_source: {free_busy_published_through: "2027-01-15T23:59:00+01:00", beyond_horizon: unknown}
          calendar:
            - {start: "2027-01-08T13:00:00+01:00", end: "2027-01-08T13:30:00+01:00", status: busy}
            - {start: "2027-01-19T00:00:00+01:00", end: "2027-01-20T00:00:00+01:00", status: unknown}
      conversation:
        - role: recruiter
          text: Sander can do Fri Jan 8 or Tue Jan 19, 1-3pm. Which works with Erik? Sander slightly prefers the 19th.
    expected:
      disposition: propose_options
      solution_summary: >-
        Friday, January 8, 2027: starts from 1:30 to 2:00 p.m. CET. Tuesday, January 19 cannot be evaluated - Erik's
        free/busy is published only through January 15, so that date is unknown. If the 19th is preferred, the
        recruiter can get Erik's availability for 1:00-3:00 p.m. CET that day.
      must:
        - Propose starts from 1:30 to 2:00 p.m. CET on Friday, January 8.
        - State that January 19 is beyond Erik's published free/busy range and is unknown, not free and not unavailable.
