        int_sneha:
          time_zone: Asia/Kolkata
          working_hours: {time_zone: Asia/Kolkata, start: "09:00", end: "18:00"}
          busy: [["2027-01-13T10:00:00+05:30", "2027-01-13T11:00:00+05:30"], ["2027-01-13T10:30:00+05:30", "2027-01-13T11:30:00+05:30"], ["2027-01-13T11:30:00+05:30", "2027-01-13T12:00:00+05:30"]]
      sessions:
