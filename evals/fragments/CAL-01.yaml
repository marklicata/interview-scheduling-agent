        One option: Thursday, January 21, 2027, 12:00-1:00 p.m. PHT (1:00-2:00 p.m. KST). 2:00-3:30 p.m. KST is blocked by
        Seo-jun's stated personal appointment, leaving too little time afterward. Coverage note: only the work
        calendar plus his stated block were checked.
      must:
