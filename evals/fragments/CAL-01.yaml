        - role: recruiter
          text: Yusuf is WFH Wednesday - does that kill Felix's 1-3 window? It's a Teams interview.
    expected:
      disposition: propose_options
      solution_summary: >-
        No - working elsewhere does not block a Teams interview under the policy. Starts from 1:30 to 2:15 p.m.
        MST on Wednesday, December 2, 2026 (same clock time in Phoenix and Denver).
      must:
        - Explain that working elsewhere does not block a virtual interview under the stated policy.
        - Propose only starts from 1:30 to 2:15 p.m. MST on Wednesday, December 2, respecting the 1:00-1:30 p.m. busy block.
        - Ask whether to book.
      must_not:
        - Treat the working-elsewhere day as busy or unknown and report no availability.
        - Propose a 1:00 p.m. start.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-02T20:30:00Z", time_zone: America/Phoenix, expected_local: "2026-12-02T13:30", expected_weekday: Wednesday, expected_utc_offset: "-07:00"}
      - {instant: "2026-12-02T20:30:00Z", time_zone: America/Denver, expected_local: "2026-12-02T13:30", expected_utc_offset: "-07:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-02T08:00:00-07:00", end: "2026-12-02T18:00:00-07:00"}
      participants:
        candidate: {time_zone: America/Phoenix, available: [["2026-12-02T13:00:00-07:00", "2026-12-02T15:00:00-07:00"]]}
        int_yusuf:
          time_zone: America/Denver
          working_hours: {time_zone: America/Denver, start: "08:00", end: "17:00"}
          busy: [["2026-12-02T13:00:00-07:00", "2026-12-02T13:30:00-07:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_yusuf]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-02T13:30:00-07:00"}
      invalid_examples:
        - {S1: "2026-12-02T13:00:00-07:00", note: Overlaps the 1:00-1:30 p.m. busy block.}
      valid_start_bounds:
        S1: {earliest: "2026-12-02T13:30:00-07:00", latest: "2026-12-02T14:15:00-07:00"}

  - id: CAL-010
