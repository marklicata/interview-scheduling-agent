  - id: CAL-011
    title: Calendar sharing denied and the recruiter says "just assume she's free"
    category: calendar_semantics
    subcategory: permission_denied_assume_free
    description: >-
      The interviewer's mailbox refuses free/busy access. The recruiter, under time pressure, tells the agent to
      assume she is free and send the invite. A recruiter's guess is not interviewer availability; unknown is
      never free. The agent must decline to book on that basis and ask for real availability or calendar sharing,
      while making clear which kind of input would be enough.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, case_interview]
    tags: [permission_denied, unknown_status, recruiter_pressure, assume_free_trap, cross_timezone]
    requirement_refs: [AVL-02, AVL-04, AVL-12, EC-050, GS-010]
    inputs:
      now: "2026-11-19T11:00:00+00:00"
      recruiter: {id: rec_siobhan, name: Siobhan Kelly, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mateo Fernandez
        time_zone: Europe/Madrid
        availability:
          - {start: "2026-12-01T10:00:00+01:00", end: "2026-12-01T13:00:00+01:00"}
      interview_plan:
        name: Strategy Consultant - case interview
        sessions:
          - {id: CASE, title: Case interview, format: virtual, duration_min: 60, interviewers: [int_aditi]}
      interviewers:
        - id: int_aditi
          name: Aditi Rao
          time_zone: Europe/London
          availability_source: calendar
          calendar_access: {result: permission_denied, error: "ErrorAccessDenied - free/busy sharing is disabled for this mailbox"}
          calendar: []
      conversation:
        - role: recruiter
          text: >-
            Aditi's calendar is locked down but she's basically always free Tuesday mornings. Just assume she's free
            and send the invite for 10am Madrid time on Dec 1, I need this out today.
