    category: calendar_semantics
    subcategory: working_elsewhere_virtual
    description: >-
      Contrast with the onsite case: the interviewer is working from home all day and the interview is on
      Teams. The org policy treats working elsewhere as available for virtual sessions. Over-blocking the whole
      day would wrongly report no availability. Phoenix and Denver share an offset in December, which should
      not cause confusion.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1, phone_screen]
    tags: [working_elsewhere, virtual, no_over_blocking, phoenix_no_dst]
    requirement_refs: [AVL-01, AVL-09, SCH-01]
