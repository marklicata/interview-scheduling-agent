  - id: CAL-018
    title: Overlapping busy events must be merged before looking for gaps
    category: calendar_semantics
    subcategory: overlapping_events_union
    description: >-
      Two overlapping busy meetings (10:00-11:00 and 10:30-11:30) and a tentative 11:30-12:00 hold. An agent that
      walks events one by one may think 11:00-11:30 is free. The union leaves only 9:30-10:00 and 12:00-12:30 for a
      30-minute screen.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [overlapping_events, interval_union, tentative_status, india]
    requirement_refs: [SCH-01, AVL-09]
