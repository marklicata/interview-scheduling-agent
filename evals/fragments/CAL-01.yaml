  - id: CAL-037
    title: Calendar API returns UTC; the interviewer is in Kathmandu (UTC+5:45), the candidate in India (UTC+5:30)
    category: calendar_semantics
    subcategory: utc_events_quarter_hour_zone
    description: >-
      Event times come back from the API in UTC. The interviewer works 10:00-17:00 Nepal time and has a meeting
      04:15-05:15Z. The candidate in India is 15 minutes behind Nepal. Treating Nepal as India time or rounding
      the 15-minute difference shifts every boundary. Valid 45-minute starts are 10:45-11:15 IST (11:00-11:30 NPT).
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [utc_source, quarter_hour_offset, nepal, india, exact_boundary]
    requirement_refs: [AVL-10, SCH-08, EC-016]
    inputs:
      now: "2027-02-25T10:00:00+05:30"
      recruiter: {id: rec_ritu, name: Ritu Agarwal, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aditya Verma
        time_zone: Asia/Kolkata
        availability:
          - {start: "2027-03-03T09:30:00+05:30", end: "2027-03-03T12:00:00+05:30"}
      interview_plan:
        name: Mobile QA Lead - functional interview
        sessions:
          - {id: QA, title: QA leadership interview, format: virtual, duration_min: 45, interviewers: [int_bikash]}
      interviewers:
        - id: int_bikash
          name: Bikash Shrestha
          time_zone: Asia/Kathmandu
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "10:00", end: "17:00"}
          calendar:
            - {start: "2027-03-03T04:15:00Z", end: "2027-03-03T05:15:00Z", status: busy}
      conversation:
        - role: recruiter
          text: Aditya is free Wed 3 March 9:30-12 IST. Bikash is in Kathmandu. What can we do?
    expected:
      disposition: propose_options
      solution_summary: >-
        Starts from 10:45 to 11:15 a.m. IST (11:00-11:30 a.m. NPT) on Wednesday, March 3, 2027. Bikash's day starts
        at 10:00 NPT (9:45 IST) and his meeting runs 10:00-11:00 NPT (9:45-10:45 IST).
      must:
        - Convert the UTC event to 10:00-11:00 a.m. Nepal time (9:45-10:45 a.m. India time).
        - Propose only starts from 10:45 to 11:15 a.m. IST (11:00-11:30 a.m. NPT) on Wednesday, March 3.
        - Show both India and Nepal times and ask whether to book.
      must_not:
        - Treat Nepal as UTC+5:30 or round the 15-minute offset difference.
        - Propose 9:30 or 10:30 a.m. IST starts.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-03T05:15:00Z", time_zone: Asia/Kathmandu, expected_local: "2027-03-03T11:00", expected_weekday: Wednesday, expected_utc_offset: "+05:45"}
      - {instant: "2027-03-03T05:15:00Z", time_zone: Asia/Kolkata, expected_local: "2027-03-03T10:45", expected_utc_offset: "+05:30"}
      - {instant: "2027-03-03T04:15:00Z", time_zone: Asia/Kathmandu, expected_local: "2027-03-03T10:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-03T09:00:00+05:30", end: "2027-03-03T13:00:00+05:30"}
      participants:
        candidate: {time_zone: Asia/Kolkata, available: [["2027-03-03T09:30:00+05:30", "2027-03-03T12:00:00+05:30"]]}
        int_bikash:
          time_zone: Asia/Kathmandu
          working_hours: {time_zone: Asia/Kathmandu, start: "10:00", end: "17:00"}
          busy: [["2027-03-03T04:15:00Z", "2027-03-03T05:15:00Z"]]
      sessions:
        - {id: QA, duration_min: 45, attendees: [candidate, int_bikash]}
      expect_feasible: true
      valid_examples:
        - {QA: "2027-03-03T10:45:00+05:30"}
        - {QA: "2027-03-03T11:15:00+05:30"}
      invalid_examples:
        - {QA: "2027-03-03T10:30:00+05:30", note: "Overlaps the meeting, which ends 10:45 IST."}
      valid_start_bounds:
        QA: {earliest: "2027-03-03T10:45:00+05:30", latest: "2027-03-03T11:15:00+05:30"}

  - id: CAL-038
    title: The only slot is the recruiter's own manual hold for this same candidate
    category: calendar_semantics
    subcategory: own_case_manual_hold
    description: >-
      Two weeks ago the recruiter placed a manual tentative hold on the interviewer's calendar for this candidate's
      final interview. That hold is the only fitting hour. A hold for this same case is not a competing commitment,
      but the agent must verify it really belongs to this case, must not silently delete it (holds are outside the
      MVP's actions), and must warn that booking will leave the hold in place unless the recruiter removes it.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [manual_hold, own_case, tentative_status, no_unrequested_edits, brisbane]
    requirement_refs: [AVL-09, ACT-01, SCH-03]
    inputs:
      now: "2027-03-08T09:00:00+10:00"
      recruiter: {id: rec_hamish, name: Hamish Reid, time_zone: Australia/Brisbane}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ayesha Khan
        time_zone: Australia/Brisbane
        availability:
          - {start: "2027-03-12T13:00:00+10:00", end: "2027-03-12T15:00:00+10:00"}
      interview_plan:
        name: Operations Manager - final interview
        requisition: REQ-5520
        sessions:
          - {id: FINAL, title: Final interview, format: virtual, duration_min: 60, interviewers: [int_ruby]}
      interviewers:
        - id: int_ruby
          name: Ruby Chen
          time_zone: Australia/Brisbane
          availability_source: calendar
          calendar:
            - {start: "2027-03-12T13:00:00+10:00", end: "2027-03-12T14:00:00+10:00", status: tentative, subject: "HOLD - Ayesha Khan final (REQ-5520)", organizer: rec_hamish, created_at: "2027-02-24T10:00:00+10:00"}
            - {start: "2027-03-12T14:00:00+10:00", end: "2027-03-12T15:00:00+10:00", status: busy}
      conversation:
        - role: recruiter
          text: Ayesha can do Friday 1-3pm. Ruby's pretty booked - anything?
    expected:
      disposition: propose_options
      solution_summary: >-
        Friday, March 12, 2027, 1:00-2:00 p.m. AEST is the only fit; it is covered by Hamish's own hold for Ayesha's
        final interview (REQ-5520), so it is not a competing commitment. Ask whether to book; the manual hold will
        remain unless Hamish removes it or explicitly asks the agent to cancel that exact event.
      must:
        - Identify that the 1:00-2:00 p.m. tentative event is the recruiter's own hold for this candidate and requisition, based on organizer and subject.
        - Propose 1:00-2:00 p.m. AEST on Friday, March 12 and ask whether to book.
        - Point out that booking creates a new invitation and the manual hold will remain on Ruby's calendar unless the recruiter removes it or explicitly asks to cancel that exact event.
      must_not:
        - Delete or modify the hold without an explicit instruction.
        - Propose 2:00 p.m., when Ruby is busy.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-12T08:00:00+10:00", end: "2027-03-12T17:00:00+10:00"}
      participants:
        candidate: {time_zone: Australia/Brisbane, available: [["2027-03-12T13:00:00+10:00", "2027-03-12T15:00:00+10:00"]]}
        int_ruby: {time_zone: Australia/Brisbane, busy: [["2027-03-12T14:00:00+10:00", "2027-03-12T15:00:00+10:00"]]}
      sessions:
        - {id: FINAL, duration_min: 60, attendees: [candidate, int_ruby]}
      expect_feasible: true
      valid_examples:
        - {FINAL: "2027-03-12T13:00:00+10:00"}
      invalid_examples:
        - {FINAL: "2027-03-12T13:30:00+10:00", note: Overlaps Ruby's 2:00 p.m. meeting.}
      valid_start_bounds:
        FINAL: {earliest: "2027-03-12T13:00:00+10:00", latest: "2027-03-12T13:00:00+10:00"}
    grading_notes: >-
      The oracle omits the hold because it is this case's own placeholder. Accept answers that ask the recruiter to
      confirm the hold is theirs before proposing, as long as they do not delete it unprompted.

  - id: CAL-039
    title: Teams presence "Away" is not calendar availability for next week
    category: calendar_semantics
    subcategory: presence_not_availability
    description: >-
      The recruiter infers from the interviewer's current Teams presence (Away/Offline all morning) that she cannot
      interview next Monday. Presence describes the current moment, not future calendar availability. The agent
      should use the calendar and propose the valid London/Stockholm options.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [presence_signal, wrong_source, sweden, uk]
    requirement_refs: [AVL-01, AVL-11, SCH-01]
    inputs:
      now: "2027-03-08T11:00:00+00:00"
      recruiter: {id: rec_olu, name: Olumide Adebayo, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Harriet Cole
        time_zone: Europe/London
        availability:
          - {start: "2027-03-15T09:00:00+00:00", end: "2027-03-15T11:00:00+00:00"}
      interview_plan:
        name: Sustainability Analyst - team interview
        sessions:
          - {id: S1, title: Team interview, format: virtual, duration_min: 60, interviewers: [int_freya]}
      interviewers:
        - id: int_freya
          name: Freya Nilsson
          time_zone: Europe/Stockholm
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          presence_now: {status: Away, observed_at: "2027-03-08T11:00:00+00:00"}
          calendar:
            - {start: "2027-03-15T09:00:00+01:00", end: "2027-03-15T10:00:00+01:00", status: busy}
      conversation:
        - role: recruiter
          text: Freya's Teams has said Away all morning, so I guess she's not around for Monday the 15th? Harriet can do 9-11 UK time.
    expected:
      disposition: propose_options
      solution_summary: >-
        Presence today says nothing about next Monday. Freya's calendar allows starts from 9:00 to 10:00 a.m. GMT
        (10:00-11:00 a.m. CET) on Monday, March 15, 2027.
      must:
        - Explain that Teams presence reflects the current moment and is not used for future availability.
        - Propose only starts from 9:00 to 10:00 a.m. GMT (10:00-11:00 a.m. CET) on Monday, March 15.
        - Ask whether to book.
      must_not:
        - Treat Away/Offline presence as unavailability for March 15.
        - Ask the recruiter to check Freya's presence or "whereabouts" before proposing, as if presence were an availability source.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-15T09:00:00Z", time_zone: Europe/London, expected_local: "2027-03-15T09:00", expected_weekday: Monday, expected_utc_offset: "+00:00"}
      - {instant: "2027-03-15T09:00:00Z", time_zone: Europe/Stockholm, expected_local: "2027-03-15T10:00", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-15T07:00:00+00:00", end: "2027-03-15T17:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/London, available: [["2027-03-15T09:00:00+00:00", "2027-03-15T11:00:00+00:00"]]}
        int_freya:
          time_zone: Europe/Stockholm
          working_hours: {time_zone: Europe/Stockholm, start: "08:00", end: "17:00"}
          busy: [["2027-03-15T09:00:00+01:00", "2027-03-15T10:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_freya]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-03-15T09:00:00+00:00"}
      valid_start_bounds:
        S1: {earliest: "2027-03-15T09:00:00+00:00", latest: "2027-03-15T10:00:00+00:00"}

  - id: CAL-040
    title: Recruiter reports the tentative conflict was declined - recheck confirms, then book
    category: calendar_semantics
    subcategory: recheck_after_tentative_resolved
    description: >-
      Earlier the agent handed off a conditional option because the interviewer was tentative at the only fitting
      hour. The recruiter now reports the interviewer declined that meeting and confirms booking. The agent must
      recheck the calendar (it now shows the declined event as Free), then book exactly the confirmed slot with a
      Teams link, and report that invitations were sent, not accepted.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, system_design]
    tags: [tentative_resolved, recheck_before_booking, book_after_confirmation, japan, korea]
    requirement_refs: [CRD-04, CRD-05, AVL-05, ACT-01]
    inputs:
      now: "2027-03-11T10:00:00+09:00"
      recruiter: {id: rec_yuki, name: Yuki Watanabe, time_zone: Asia/Tokyo, organizer_mailbox: recruiting-jp@contoso.example}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kim Min-seo
        email: minseo.kim@example.net
        time_zone: Asia/Seoul
        availability:
          - {start: "2027-03-16T14:00:00+09:00", end: "2027-03-16T15:00:00+09:00"}
      interview_plan:
        name: Cloud Architect - system design
        sessions:
          - {id: SD, title: System design, format: virtual, duration_min: 60, interviewers: [int_daichi]}
        rules: {tentative_policy: blocks}
      interviewers:
        - id: int_daichi
          name: Daichi Ono
          time_zone: Asia/Tokyo
          availability_source: calendar
          calendar_fetched_at: "2027-03-11T10:00:00+09:00"
          calendar:
            - {start: "2027-03-16T14:00:00+09:00", end: "2027-03-16T15:00:00+09:00", status: free, response: declined, subject: Partner sync}
      conversation:
        - role: agent
          at: "2027-03-10T16:00:00+09:00"
          text: >-
            Conditional option - Tuesday, March 16, 2:00-3:00 p.m. JST/KST. Daichi is tentative then. Please ask
            Daichi whether he can take the interview at that time and let me know.
        - role: recruiter
          at: "2027-03-11T10:00:00+09:00"
          text: Daichi declined that meeting and says 2pm Tuesday is fine. Go ahead and book Min-seo with him.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Recheck shows the 2:00-3:00 p.m. event declined (Free). Book the system design interview for Tuesday, March 16,
        2027, 2:00-3:00 p.m. JST (same clock time in Seoul) from recruiting-jp@contoso.example with a Teams link, and report
        the invitations as sent, not accepted.
      must:
        - Recheck Daichi's calendar before booking and note that the earlier tentative event is now declined and shows as Free.
        - Create exactly one 60-minute Teams interview at 2:00-3:00 p.m. JST on Tuesday, March 16 for Min-seo and Daichi.
        - Report that invitations were sent and that acceptance is still pending.
      must_not:
        - Book any other time or create duplicate events.
        - Claim that Daichi or the candidate has accepted.
        - Skip the recheck because the recruiter already reported the change.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: System design for Kim Min-seo and Daichi Ono, notes: "Tuesday, March 16, 2027 14:00-15:00 JST; Teams link; organizer recruiting-jp@contoso.example."}
    local_time_checks:
      - {instant: "2027-03-16T05:00:00Z", time_zone: Asia/Tokyo, expected_local: "2027-03-16T14:00", expected_weekday: Tuesday, expected_utc_offset: "+09:00"}
      - {instant: "2027-03-16T05:00:00Z", time_zone: Asia/Seoul, expected_local: "2027-03-16T14:00", expected_utc_offset: "+09:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-16T09:00:00+09:00", end: "2027-03-16T18:00:00+09:00"}
      participants:
        candidate: {time_zone: Asia/Seoul, available: [["2027-03-16T14:00:00+09:00", "2027-03-16T15:00:00+09:00"]]}
        int_daichi: {time_zone: Asia/Tokyo}
      sessions:
        - {id: SD, duration_min: 60, attendees: [candidate, int_daichi]}
      expect_feasible: true
      valid_examples:
        - {SD: "2027-03-16T14:00:00+09:00"}
      valid_start_bounds:
        SD: {earliest: "2027-03-16T14:00:00+09:00", latest: "2027-03-16T14:00:00+09:00"}
