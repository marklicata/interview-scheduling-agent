      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ethan Brooks
        time_zone: America/New_York
        availability:
          - {start: "2026-11-10T13:00:00-05:00", end: "2026-11-10T17:00:00-05:00"}
      interview_plan:
        name: Site Reliability Engineer - troubleshooting interview
        sessions:
          - {id: SRE, title: Troubleshooting interview, format: virtual, duration_min: 60, interviewers: [int_kai]}
      interviewers:
        - id: int_kai
          name: Kai Andersen
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar_fetched_at: "2026-11-05T10:00:00-05:00"
          calendar:
            - {start: "2026-11-10T14:00:00-05:00", end: "2026-11-10T15:00:00-05:00", status: busy, created_at: "2026-11-04T16:20:00-05:00"}
            - {start: "2026-11-10T16:00:00-05:00", end: "2026-11-10T16:30:00-05:00", status: busy}
      case_state:
        prior_proposals:
          - {created_at: "2026-11-02T09:15:00-05:00", calendar_snapshot_at: "2026-11-02T09:10:00-05:00", option: "Tuesday, November 10, 2:00-3:00 p.m. EST", status: proposed}
      conversation:
        - role: agent
          at: "2026-11-02T09:15:00-05:00"
          text: Kai and Ethan are both free Tuesday, November 10, 2:00-3:00 p.m. EST. Want me to book it?
        - role: recruiter
          at: "2026-11-05T10:00:00-05:00"
          text: Yes - book the Tuesday 2pm we picked on Monday.
          confirmation: true
    expected:
      disposition: propose_options
      solution_summary: >-
        Not booked: the current calendar shows Kai busy 2:00-3:00 p.m. EST on Tuesday, November 10, 2026 (added
        November 4). Remaining options that day are 1:00-2:00 p.m. and 3:00-4:00 p.m. EST; ask which to book.
      must:
        - Recheck before booking and report that the 2:00-3:00 p.m. slot now conflicts with a new busy event on Kai's calendar.
        - Offer only 1:00-2:00 p.m. or 3:00-4:00 p.m. EST on Tuesday, November 10 as replacements.
        - Ask for a new explicit confirmation for the replacement slot.
      must_not:
        - Book 2:00 p.m. on the strength of the old snapshot.
        - Book a different slot using the confirmation given for 2:00 p.m.
        - Offer 3:30 p.m. or later starts that overlap the 4:00-4:30 p.m. meeting.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T09:00:00-05:00", end: "2026-11-10T18:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-11-10T13:00:00-05:00", "2026-11-10T17:00:00-05:00"]]}
        int_kai:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, start: "09:00", end: "17:00"}
          busy: [["2026-11-10T14:00:00-05:00", "2026-11-10T15:00:00-05:00"], ["2026-11-10T16:00:00-05:00", "2026-11-10T16:30:00-05:00"]]
      sessions:
        - {id: SRE, duration_min: 60, attendees: [candidate, int_kai]}
      expect_feasible: true
      valid_examples:
        - {SRE: "2026-11-10T13:00:00-05:00"}
        - {SRE: "2026-11-10T15:00:00-05:00"}
      invalid_examples:
        - {SRE: "2026-11-10T14:00:00-05:00", note: New conflict found on recheck.}
      valid_start_bounds:
        SRE: {earliest: "2026-11-10T13:00:00-05:00", latest: "2026-11-10T15:00:00-05:00"}

