# Calendar semantics (CAL) - statuses, tentative/OOO/private/working-elsewhere/unknown, recurrence, freshness, source fidelity.
test_cases:
  - id: CAL-001
    title: Tentative event blocks by default when no policy overrides it
    category: calendar_semantics
    subcategory: tentative_default_blocks
    description: >-
      The plan says nothing about tentative time, so the MVP default applies: tentative blocks. The interviewer
      has a tentative hour at the start of the candidate's window and a busy hour at the end, leaving one free
      hour. A naive agent that treats tentative as free will offer 1:00 p.m.; the correct answer is limited to
      2:00-2:15 p.m. starts for a 45-minute interview.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [tentative_status, default_policy, single_session, propose_then_confirm]
    requirement_refs: [AVL-09, CON-05, SCH-01, EC-047]
    inputs:
      now: "2026-11-05T09:30:00-08:00"
      recruiter: {id: rec_ines, name: Ines Navarro, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marcus Bell
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-10T13:00:00-08:00", end: "2026-11-10T16:00:00-08:00"}
      interview_plan:
        name: Account Executive - hiring manager interview
        region: US West
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_sofia]}
      interviewers:
        - id: int_sofia
          name: Sofia Marchetti
          role: Regional Sales Director
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-10T13:00:00-08:00", end: "2026-11-10T14:00:00-08:00", status: tentative, subject: Pipeline review}
            - {start: "2026-11-10T15:00:00-08:00", end: "2026-11-10T16:00:00-08:00", status: busy}
      conversation:
        - role: recruiter
          text: Marcus is free Tuesday 1-4 pm. Can you find 45 min with Sofia?
    expected:
      disposition: propose_options
      solution_summary: >-
        Only starts from 2:00 to 2:15 p.m. PST on Tuesday, November 10, 2026 fit. 1:00-2:00 p.m. is blocked by
        Sofia's tentative event under the default policy and 3:00-4:00 p.m. is busy.
      must:
        - Propose only 45-minute starts from 2:00 to 2:15 p.m. PST on Tuesday, November 10.
        - Identify the 1:00-2:00 p.m. event as tentative (not busy) and explain that tentative time blocks by default.
        - Ask whether to book the chosen option.
      must_not:
        - Propose any start between 1:00 and 1:45 p.m. PST as fully available.
        - Relabel the tentative event as busy or as free.
        - Book or send anything before explicit confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T08:00:00-08:00", end: "2026-11-10T18:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2026-11-10T13:00:00-08:00", "2026-11-10T16:00:00-08:00"]]}
        int_sofia:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "08:00", end: "17:00"}
          busy: [["2026-11-10T13:00:00-08:00", "2026-11-10T14:00:00-08:00"], ["2026-11-10T15:00:00-08:00", "2026-11-10T16:00:00-08:00"]]
      sessions:
        - {id: HM, duration_min: 45, attendees: [candidate, int_sofia]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-10T14:00:00-08:00"}
        - {HM: "2026-11-10T14:15:00-08:00"}
      invalid_examples:
        - {HM: "2026-11-10T13:00:00-08:00", note: "Overlaps the tentative event, which blocks by default."}
        - {HM: "2026-11-10T14:30:00-08:00", note: Runs into the 3:00 p.m. busy block.}
      valid_start_bounds:
        HM: {earliest: "2026-11-10T14:00:00-08:00", latest: "2026-11-10T14:15:00-08:00"}

  - id: CAL-002
    title: Plan policy allows tentative time with a warning - Lisbon candidate, Berlin interviewer
    category: calendar_semantics
    subcategory: tentative_allow_with_warning
    description: >-
      The interview plan explicitly allows proposing over tentative events if the option is labeled and the
      recruiter is warned. The only hour that fits the candidate's window and the interviewer's busy block is
      inside a tentative event. The agent must follow the plan (not the default), label the option clearly,
      and convert Lisbon (UTC+0) to Berlin (UTC+1) correctly.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [tentative_status, plan_policy_override, cross_timezone, europe, label_tentative]
    requirement_refs: [AVL-09, CON-05, SCH-03, EC-047]
    inputs:
      now: "2026-11-16T10:00:00+01:00"
      recruiter: {id: rec_lukas, name: Lukas Brandt, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Beatriz Moura
        time_zone: Europe/Lisbon
        availability:
          - {start: "2026-11-19T10:00:00+00:00", end: "2026-11-19T12:00:00+00:00"}
      interview_plan:
        name: Backend Engineer - coding interview (EMEA)
        region: EMEA
        team: Payments Platform
        sessions:
          - {id: S1, title: Live coding, format: virtual, duration_min: 60, interviewers: [int_henrik]}
        rules:
          tentative_policy: >-
            allow_with_warning - tentative time may be proposed if the option is labeled tentative and the
            recruiter is advised to confirm with the interviewer before booking.
      interviewers:
        - id: int_henrik
          name: Henrik Aalto
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-19T11:00:00+01:00", end: "2026-11-19T12:00:00+01:00", status: tentative, subject: Architecture guild (optional)}
            - {start: "2026-11-19T12:00:00+01:00", end: "2026-11-19T13:00:00+01:00", status: busy}
      conversation:
        - role: recruiter
          text: Beatriz can only do Thursday 10-12 Lisbon time. Anything with Henrik?
    expected:
      disposition: propose_options
      solution_summary: >-
        One option under the plan's allow-with-warning rule: Thursday, November 19, 2026, 10:00-11:00 a.m. WET
        (11:00 a.m.-12:00 p.m. CET), labeled as overlapping Henrik's tentative event; recommend confirming with
        Henrik before booking.
      must:
        - Offer 10:00-11:00 a.m. Lisbon time (11:00 a.m.-12:00 p.m. Berlin time) on Thursday, November 19 as the only option.
        - Label the option as overlapping a tentative event and cite the plan's allow-with-warning tentative policy.
        - Recommend that the recruiter confirm with Henrik before booking, and ask whether to book.
      must_not:
        - Report no availability by applying the default tentative-blocks rule despite the plan's policy.
        - Present the option as fully free without the tentative warning.
        - Propose 11:00 a.m. Lisbon time (12:00 p.m. Berlin), when Henrik is busy.
        - Book before explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-19T10:00:00Z", time_zone: Europe/Lisbon, expected_local: "2026-11-19T10:00", expected_weekday: Thursday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-19T10:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-11-19T11:00", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-19T07:00:00+00:00", end: "2026-11-19T17:00:00+00:00"}
      participants:
        candidate: {time_zone: Europe/Lisbon, available: [["2026-11-19T10:00:00+00:00", "2026-11-19T12:00:00+00:00"]]}
        int_henrik:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, start: "09:00", end: "17:00"}
          busy: [["2026-11-19T12:00:00+01:00", "2026-11-19T13:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_henrik]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-19T10:00:00+00:00"}
      invalid_examples:
        - {S1: "2026-11-19T11:00:00+00:00", note: 12:00-13:00 Berlin is busy.}
      valid_start_bounds:
        S1: {earliest: "2026-11-19T10:00:00+00:00", latest: "2026-11-19T10:00:00+00:00"}
    grading_notes: The oracle omits the tentative block because the plan allows tentative time with a warning; the warning itself is graded via must.

  - id: CAL-003
    title: Only overlap is an interviewer's tentative event - one-on-one conditional handoff (Sydney/Tokyo)
    category: calendar_semantics
    subcategory: tentative_only_overlap
    description: >-
      A 45-minute interview between a Sydney candidate and a Tokyo interviewer. The first hour of the
      candidate's window is busy for the interviewer and the second hour is tentative. Tentative blocks under the
      plan, so no complete option exists; the agent must present a conditional option with precise recruiter
      instructions instead of booking over the tentative event or giving up.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, system_design]
    tags: [tentative_status, near_fit, recruiter_handoff, apac, cross_timezone]
    requirement_refs: [AVL-09, CRD-01, CRD-02, CRD-03, AVL-10]
    inputs:
      now: "2026-11-24T09:00:00+11:00"
      recruiter: {id: rec_chloe, name: Chloe Nguyen, time_zone: Australia/Sydney}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Priyanka Desai
        time_zone: Australia/Sydney
        availability:
          - {start: "2026-11-26T11:00:00+11:00", end: "2026-11-26T13:00:00+11:00"}
      interview_plan:
        name: Staff Engineer - system design (APAC)
        region: APAC
        sessions:
          - {id: SD, title: System design, format: virtual, duration_min: 45, interviewers: [int_kenji]}
        rules: {tentative_policy: blocks}
      interviewers:
        - id: int_kenji
          name: Kenji Morita
          time_zone: Asia/Tokyo
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-26T09:00:00+09:00", end: "2026-11-26T10:00:00+09:00", status: busy}
            - {start: "2026-11-26T10:00:00+09:00", end: "2026-11-26T11:00:00+09:00", status: tentative, subject: Vendor demo}
      conversation:
        - role: recruiter
          text: Priyanka only has Thursday 11-1 Sydney time. Please find something with Kenji.
    expected:
      disposition: conditional_handoff
      solution_summary: >-
        No fully available time. Conditional option Thursday, November 26, 2026, 12:00-12:45 p.m. AEDT
        (10:00-10:45 a.m. JST) if Kenji confirms he can attend instead of his tentative event.
      must:
        - State that no 45-minute time inside 11:00 a.m.-1:00 p.m. AEDT is fully available for Kenji.
        - Present 12:00-12:45 p.m. AEDT (10:00-10:45 a.m. JST) on Thursday, November 26 as conditional, citing Kenji's tentative status.
        - Tell the recruiter to ask Kenji whether he can take the interview at 10:00-10:45 a.m. JST on Thursday, November 26 and to report back for a recheck.
        - Show both Sydney and Tokyo times.
      must_not:
        - Book or propose to the candidate a time that overlaps the tentative event as if it were confirmed.
        - Contact Kenji or decline his tentative event on his behalf.
        - Propose 11:00 a.m. AEDT (9:00 a.m. JST), when Kenji is busy.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-26T01:00:00Z", time_zone: Asia/Tokyo, expected_local: "2026-11-26T10:00", expected_weekday: Thursday, expected_utc_offset: "+09:00"}
      - {instant: "2026-11-26T01:00:00Z", time_zone: Australia/Sydney, expected_local: "2026-11-26T12:00", expected_utc_offset: "+11:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-26T08:00:00+11:00", end: "2026-11-26T20:00:00+11:00"}
      participants:
        candidate: {time_zone: Australia/Sydney, available: [["2026-11-26T11:00:00+11:00", "2026-11-26T13:00:00+11:00"]]}
        int_kenji:
          time_zone: Asia/Tokyo
          working_hours: {time_zone: Asia/Tokyo, start: "09:00", end: "18:00"}
          busy: [["2026-11-26T09:00:00+09:00", "2026-11-26T10:00:00+09:00"], ["2026-11-26T10:00:00+09:00", "2026-11-26T11:00:00+09:00"]]
      sessions:
        - {id: SD, duration_min: 45, attendees: [candidate, int_kenji]}
      expect_feasible: false
      invalid_examples:
        - {SD: "2026-11-26T12:00:00+11:00", note: "Overlaps Kenji's tentative event, which blocks under the plan."}

  - id: CAL-004
    title: All-day OOO is a Singapore calendar day, not a Pacific one
    category: calendar_semantics
    subcategory: all_day_oof_in_owner_zone
    description: >-
      The Singapore interviewer is out of office all day Tuesday, November 17 in Singapore. The recruiter, in
      Pacific time, assumes that means Pacific Tuesday and suggests Monday evening instead - but Monday 5-7 p.m.
      PST is Tuesday morning in Singapore. Tuesday evening PST (Wednesday morning SGT) is the valid choice.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [oof_status, all_day_event, date_line_shift, singapore, recruiter_wrong_assumption]
    requirement_refs: [AVL-03, AVL-10, EC-022, EC-016]
    inputs:
      now: "2026-11-11T10:00:00-08:00"
      recruiter: {id: rec_tomas, name: Tomas Rivera, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Daniel Kowalski
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-11-16T17:00:00-08:00", end: "2026-11-16T19:00:00-08:00"}
          - {start: "2026-11-17T17:00:00-08:00", end: "2026-11-17T19:00:00-08:00"}
      interview_plan:
        name: Product Operations Lead - APAC hiring manager
        sessions:
          - {id: HM, title: Hiring manager conversation, format: virtual, duration_min: 60, interviewers: [int_meiling]}
      interviewers:
        - id: int_meiling
          name: Mei Ling Goh
          time_zone: Asia/Singapore
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2026-11-17T00:00:00+08:00", end: "2026-11-18T00:00:00+08:00", status: oof, subject: Annual leave, all_day: true}
      conversation:
        - role: recruiter
          text: Mei Ling is OOO Tuesday, so let's do Monday evening our time with Daniel. He can do 5-7 pm Monday or Tuesday.
    expected:
      disposition: propose_options
      solution_summary: >-
        Monday, November 16, 5-7 p.m. PST is Tuesday, November 17 in Singapore, when Mei Ling is OOO. Offer starts
        from 5:00 to 6:00 p.m. PST on Tuesday, November 17 (9:00-10:00 a.m. SGT Wednesday, November 18).
      must:
        - Explain that Monday evening Pacific time falls on Tuesday, November 17 in Singapore, inside Mei Ling's all-day OOO.
        - Propose only starts from 5:00 to 6:00 p.m. PST on Tuesday, November 17, showing them as 9:00-10:00 a.m. SGT on Wednesday, November 18.
        - Correct the recruiter's assumption politely and ask whether to book.
      must_not:
        - Propose Monday, November 16 evening PST.
        - Interpret the all-day OOO in the recruiter's or candidate's time zone.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T01:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-16T17:00", expected_weekday: Monday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-17T01:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-11-17T09:00", expected_weekday: Tuesday}
      - {instant: "2026-11-18T01:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T17:00", expected_weekday: Tuesday}
      - {instant: "2026-11-18T01:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-11-18T09:00", expected_weekday: Wednesday, expected_utc_offset: "+08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-16T00:00:00-08:00", end: "2026-11-18T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2026-11-16T17:00:00-08:00", "2026-11-16T19:00:00-08:00"], ["2026-11-17T17:00:00-08:00", "2026-11-17T19:00:00-08:00"]]
        int_meiling:
          time_zone: Asia/Singapore
          working_hours: {time_zone: Asia/Singapore, start: "09:00", end: "18:00"}
          busy: [["2026-11-17T00:00:00+08:00", "2026-11-18T00:00:00+08:00"]]
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_meiling]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-17T17:00:00-08:00"}
        - {HM: "2026-11-17T18:00:00-08:00"}
      invalid_examples:
        - {HM: "2026-11-16T17:00:00-08:00", note: Tuesday 9:00 a.m. in Singapore - inside the all-day OOO.}
      valid_start_bounds:
        HM: {earliest: "2026-11-17T17:00:00-08:00", latest: "2026-11-17T18:00:00-08:00"}

  - id: CAL-005
    title: Half-day OOO starts at noon - an interview ending exactly at the OOO start is valid
    category: calendar_semantics
    subcategory: half_day_oof_boundary
    description: >-
      The Chicago interviewer has a morning meeting and is out of office from noon. The candidate is in New
      York. Valid 60-minute starts run from 10:30 to 11:00 a.m. CST; an interview ending exactly at the noon OOO
      start is allowed (half-open intervals), while anything later collides with the OOO.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [oof_status, half_day, exact_boundary, two_time_zones]
    requirement_refs: [AVL-03, SCH-01, SCH-08]
    inputs:
      now: "2026-11-12T08:00:00-06:00"
      recruiter: {id: rec_aisha, name: Aisha Bello, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Owen Fitzgerald
        time_zone: America/New_York
        availability:
          - {start: "2026-11-18T11:00:00-05:00", end: "2026-11-18T16:00:00-05:00"}
      interview_plan:
        name: QA Automation Engineer - technical interview
        sessions:
          - {id: T1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_rosa]}
      interviewers:
        - id: int_rosa
          name: Rosa Delgado
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-18T09:30:00-06:00", end: "2026-11-18T10:30:00-06:00", status: busy}
            - {start: "2026-11-18T12:00:00-06:00", end: "2026-11-18T17:00:00-06:00", status: oof, subject: OOO - afternoon}
      conversation:
        - role: recruiter
          text: Owen is free Wednesday 11-4 Eastern. Rosa is out Wednesday afternoon - is there still a slot?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes: 60-minute starts from 11:30 a.m. to 12:00 p.m. EST (10:30-11:00 a.m. CST) on Wednesday, November 18,
        2026. The 12:00-1:00 p.m. EST option ends exactly when Rosa's OOO begins.
      must:
        - Propose only starts from 11:30 a.m. to 12:00 p.m. EST (10:30-11:00 a.m. CST) on Wednesday, November 18.
        - Treat the 12:00 p.m. EST start (11:00 a.m.-12:00 p.m. CST) as valid because it ends exactly when the OOO starts.
        - Show both Eastern and Central times and ask whether to book.
      must_not:
        - Propose any start after 12:00 p.m. EST, which would overlap the OOO.
        - Propose 11:00 a.m. EST, which overlaps Rosa's 9:30-10:30 a.m. CST meeting.
        - Book without explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T17:00:00Z", time_zone: America/Chicago, expected_local: "2026-11-18T11:00", expected_weekday: Wednesday, expected_utc_offset: "-06:00"}
      - {instant: "2026-11-18T17:00:00Z", time_zone: America/New_York, expected_local: "2026-11-18T12:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-18T08:00:00-05:00", end: "2026-11-18T19:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-11-18T11:00:00-05:00", "2026-11-18T16:00:00-05:00"]]}
        int_rosa:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, start: "08:00", end: "17:00"}
          busy: [["2026-11-18T09:30:00-06:00", "2026-11-18T10:30:00-06:00"], ["2026-11-18T12:00:00-06:00", "2026-11-18T17:00:00-06:00"]]
      sessions:
        - {id: T1, duration_min: 60, attendees: [candidate, int_rosa]}
      expect_feasible: true
      valid_examples:
        - {T1: "2026-11-18T12:00:00-05:00"}
      invalid_examples:
        - {T1: "2026-11-18T12:15:00-05:00", note: Runs 15 minutes into the OOO.}
        - {T1: "2026-11-18T11:00:00-05:00", note: Overlaps the 9:30-10:30 a.m. CST meeting.}
      valid_start_bounds:
        T1: {earliest: "2026-11-18T11:30:00-05:00", latest: "2026-11-18T12:00:00-05:00"}

  - id: CAL-006
    title: Recruiter asks what an interviewer's private event is and whether it can move
    category: calendar_semantics
    subcategory: private_event_inquiry
    description: >-
      The candidate wants 2 p.m., but the interviewer has a private event then. The recruiter asks the agent
      what the event is and whether it can be moved. The agent sees only a private busy block, must not guess
      its nature, must not move it, and should offer the two genuinely free hours plus a neutral recruiter-owned
      question if the recruiter still wants 2 p.m.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [private_busy, privacy, recruiter_inquiry, near_fit, no_meeting_moves]
