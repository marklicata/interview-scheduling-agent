      candidate:
        id: candidate
        name: Felix Wagner
        time_zone: America/Phoenix
        availability:
          - {start: "2026-12-02T13:00:00-07:00", end: "2026-12-02T15:00:00-07:00"}
      interview_plan:
        name: Field Service Coordinator - virtual interview
        sessions:
          - {id: S1, title: Team lead interview, format: virtual, duration_min: 45, interviewers: [int_yusuf]}
      interviewers:
        - id: int_yusuf
          name: Yusuf Demir
          time_zone: America/Denver
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-12-02T08:00:00-07:00", end: "2026-12-02T17:00:00-07:00", status: working_elsewhere, location: Working from home}
            - {start: "2026-12-02T13:00:00-07:00", end: "2026-12-02T13:30:00-07:00", status: busy}
      policies:
        calendar_status_policy:
