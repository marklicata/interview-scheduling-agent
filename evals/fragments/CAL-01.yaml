  - id: CAL-019
    title: Coarse 30-minute free/busy bins hide when a meeting really ends
    category: calendar_semantics
    subcategory: coarse_granularity_uncertainty
    description: >-
      The interviewer's cross-premises mailbox returns only a merged 30-minute availability view. The 10:00 bin is
      busy, so a 45-minute interview inside the candidate's 10:00-11:00 window cannot be shown to fit. The recruiter
      says the 10:00 meeting "usually ends at 10:10" and asks to book 10:15. The agent must not book across the
      uncertainty; it needs date-specific evidence of when the meeting ends.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [coarse_granularity, availability_view, lossy_source, do_not_round, paris]
    requirement_refs: [AVL-04, AVL-09, SCH-08, EC-027]
    inputs:
      now: "2027-01-14T09:00:00+01:00"
      recruiter: {id: rec_camille, name: Camille Laurent, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mathieu Girard
        time_zone: Europe/Paris
        availability:
          - {start: "2027-01-19T10:00:00+01:00", end: "2027-01-19T11:00:00+01:00"}
      interview_plan:
        name: Category Manager - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 45, interviewers: [int_thomas]}
      interviewers:
        - id: int_thomas
          name: Thomas Moreau
          time_zone: Europe/Paris
          availability_source: calendar
          calendar_source:
            kind: cross_premises_free_busy
            detail_level: merged availability view only (no item start/end times)
            availability_view_interval_min: 30
            view_start: "2027-01-19T09:00:00+01:00"
            availability_view: "222002"
            legend: "0 free, 1 tentative, 2 busy, 3 oof, 4 working elsewhere"
      conversation:
        - role: recruiter
          text: >-
            Thomas told me a while back his 10am thing usually ends around 10:10. Mathieu only has 10-11 on Tuesday
            the 19th. Just book 10:15-11:00.
    expected:
      disposition: request_availability
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Visible data shows Thomas busy somewhere in 10:00-10:30 and free 10:30-11:00 on Tuesday, January 19, 2027 -
        only 30 confirmed minutes inside the candidate's window. A 45-minute interview (10:15-11:00 a.m. CET) is
        possible only if Thomas confirms his 10:00 meeting ends by 10:15 that day; ask the recruiter to get that
        date-specific confirmation (or an exact end time) before anything is proposed or booked.
      must:
        - Explain that the source reports 30-minute merged bins and the 10:00-10:30 bin is busy, so the true end of the meeting is not visible.
        - State that only 10:30-11:00 a.m. CET is confirmed free, which is too short for 45 minutes.
        - Ask the recruiter for a date-specific confirmation from Thomas that he is free from 10:15 (or the exact end time of his meeting) on Tuesday, January 19.
        - Present 10:15-11:00 a.m. CET only as conditional on that confirmation.
      must_not:
        - Book 10:15-11:00 or 10:10-10:55 based on "usually ends around 10:10".
        - Treat a busy 30-minute bin as free for part of the bin without evidence.
        - Declare the interview impossible without noting the coverage limit.
      side_effects: {external_writes: none}
      clarifying_question_topics: [exact end of Thomas's 10:00 meeting on January 19]
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-19T09:00:00+01:00", end: "2027-01-19T12:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Paris, available: [["2027-01-19T10:00:00+01:00", "2027-01-19T11:00:00+01:00"]]}
        int_thomas:
          time_zone: Europe/Paris
          busy: [["2027-01-19T09:00:00+01:00", "2027-01-19T10:30:00+01:00"], ["2027-01-19T11:30:00+01:00", "2027-01-19T12:00:00+01:00"]]
      sessions:
        - {id: HM, duration_min: 45, attendees: [candidate, int_thomas]}
      expect_feasible: false
      invalid_examples:
        - {HM: "2027-01-19T10:15:00+01:00", note: Overlaps the busy 10:00-10:30 bin; the real end time is unknown.}
    grading_notes: The oracle models only what the coarse source proves; the conditional option depends on new evidence.

  - id: CAL-020
    title: Recruiter confirms a slot picked three days ago; the fresh check shows a new conflict
    category: calendar_semantics
    subcategory: stale_snapshot_recheck
    description: >-
      On Monday the agent found Tuesday 2 p.m. using a calendar snapshot. On Thursday the recruiter confirms
      that slot. A recheck before booking (required) shows the interviewer accepted a new meeting at 2 p.m. The
      confirmation covered the old slot, not a different one, so the agent must not book anything and should
      propose the remaining valid options.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [stale_data, recheck_before_booking, confirmation_scope, new_conflict]
    requirement_refs: [AVL-05, AVL-06, EC-076, ACT-01]
    inputs:
      now: "2026-11-05T10:00:00-05:00"
