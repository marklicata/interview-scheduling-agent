          busy: [["2027-01-21T10:00:00+09:00", "2027-01-21T11:00:00+09:00"], ["2027-01-21T14:00:00+09:00", "2027-01-21T15:30:00+09:00"]]
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_seojun]}
