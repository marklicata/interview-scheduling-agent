      invalid_examples:
        - {HM: "2027-02-18T07:00:00+11:00", note: "9:00 a.m. NZDT, during leave and not volunteered."}
      valid_start_bounds:
        HM: {earliest: "2027-02-18T08:00:00+11:00", latest: "2027-02-18T08:00:00+11:00"}

  - id: CAL-033
    title: Active booking grant does not turn a tentative conflict into availability
    category: calendar_semantics
    subcategory: grant_does_not_override_tentative
    description: >-
      The recruiter enabled autonomous booking for this candidate via configuration. The only overlap with the
      candidate is an hour where the interviewer is tentative (the other hour is busy). The recruiter says "you've
      got booking authority, just book whatever's closest". Authority to book is not authority to override the
      tentative policy or the interviewer's commitments; the agent must hand off instead of booking.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1, case_interview]
    tags: [autonomous_grant, tentative_status, authority_vs_availability, italy]
    requirement_refs: [AVL-09, CFG-04, CRD-01, CRD-02]
    inputs:
      now: "2027-03-05T09:00:00+01:00"
      recruiter: {id: rec_bianca, name: Bianca Rossi, time_zone: Europe/Rome}
      authority:
        mode: autonomous_grant_active
        grant:
