      recruiter: {id: rec_nadia_r, name: Nadia Rahman, time_zone: Asia/Dhaka}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Farhan Chowdhury
        time_zone: Asia/Dhaka
        availability:
          - {start: "2027-02-18T14:00:00+06:00", end: "2027-02-18T17:00:00+06:00"}
      interview_plan:
        name: Network Engineer - technical interview
        sessions:
          - {id: NET, title: Networking deep dive, format: virtual, duration_min: 60, interviewers: [int_tanvir]}
      interviewers:
        - id: int_tanvir
          name: Tanvir Hossain
