        Decline to delete Nadia's hold. Valid options: Tuesday, January 26, 2027, 10:00-11:00 a.m. SAST; Wednesday,
        January 27, 1:00-2:00 p.m. or 3:00-4:00 p.m. SAST. If 9:00 a.m. Tuesday is essential, the recruiter can
        coordinate directly with Nadia.
