  - id: CAL-034
    title: Decode a raw availabilityView string with tentative, busy, and working-elsewhere codes
    category: calendar_semantics
    subcategory: availability_view_decoding
    description: >-
      Only the raw getSchedule availabilityView string is available for the interviewer: 30-minute bins from 9:00
      a.m. EST coded 0 free, 1 tentative, 2 busy, 3 OOO, 4 working elsewhere. The agent must decode it correctly,
      keep tentative distinct (and blocking by default), let working elsewhere stand for a virtual interview under
      policy, and find the only 60-minute starts (11:30 a.m.-12:00 p.m.).
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [availability_view, raw_source, tentative_status, working_elsewhere, decoding]
    requirement_refs: [AVL-09, AVL-11, SCH-01]
    inputs:
      now: "2027-03-02T09:00:00-05:00"
      recruiter: {id: rec_kevin, name: Kevin OBrien, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Nadia Petrova
        time_zone: America/New_York
        availability:
          - {start: "2027-03-08T09:30:00-05:00", end: "2027-03-08T13:00:00-05:00"}
      interview_plan:
        name: Data Engineer - SQL and pipelines interview
        sessions:
          - {id: DE, title: SQL and pipelines, format: virtual, duration_min: 60, interviewers: [int_tamar]}
      interviewers:
        - id: int_tamar
          name: Tamar Cohen
          time_zone: America/New_York
          availability_source: calendar
          calendar_source:
            api: getSchedule
            view_start: "2027-03-08T09:00:00-05:00"
            availability_view_interval_min: 30
            availability_view: "0012240000"
            legend: "0 free, 1 tentative, 2 busy, 3 oof, 4 working elsewhere"
      policies:
        calendar_status_policy: {tentative: blocks, working_elsewhere: available for virtual sessions}
      conversation:
        - role: recruiter
          text: Nadia is free Monday Mar 8 from 9:30 to 1 Eastern. Tamar's free/busy came back as a code string - what fits for an hour?
    expected:
      disposition: propose_options
      solution_summary: >-
        Decoded for Monday, March 8, 2027 (EST): 9:00-10:00 free, 10:00-10:30 tentative, 10:30-11:30 busy, 11:30-12:00
        working elsewhere, 12:00-2:00 free. Valid 60-minute starts are 11:30 a.m. to 12:00 p.m. EST.
      must:
        - Decode the bins correctly, including 10:00-10:30 a.m. as tentative and 11:30 a.m.-12:00 p.m. as working elsewhere.
        - Propose only starts from 11:30 a.m. to 12:00 p.m. EST on Monday, March 8.
        - Explain that the tentative bin blocks by policy and that working elsewhere does not block a virtual interview under policy.
        - Ask whether to book.
      must_not:
        - Treat code 1 as free or as busy without saying it is tentative.
        - Propose 9:30 a.m. (overlaps the tentative bin) or any start between 10:00 and 11:25 a.m.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-08T09:00:00-05:00", end: "2027-03-08T14:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2027-03-08T09:30:00-05:00", "2027-03-08T13:00:00-05:00"]]}
        int_tamar: {time_zone: America/New_York, busy: [["2027-03-08T10:00:00-05:00", "2027-03-08T11:30:00-05:00"]]}
      sessions:
        - {id: DE, duration_min: 60, attendees: [candidate, int_tamar]}
      expect_feasible: true
      valid_examples:
        - {DE: "2027-03-08T11:30:00-05:00"}
        - {DE: "2027-03-08T12:00:00-05:00"}
      invalid_examples:
        - {DE: "2027-03-08T09:30:00-05:00", note: Runs into the tentative 10:00 bin.}
      valid_start_bounds:
        DE: {earliest: "2027-03-08T11:30:00-05:00", latest: "2027-03-08T12:00:00-05:00"}

  - id: CAL-035
    title: Rescheduling 30 minutes later - the interview's own event is not a conflict
    category: calendar_semantics
    subcategory: self_conflict_on_reschedule
    description: >-
      The candidate asks to move an already-booked interview 30 minutes later. The interviewer's calendar shows
      the existing interview (the same event) at 10:00-11:00 and another meeting at 11:30. The new 10:30-11:30
      time overlaps only the event being moved. The agent must exclude that event from conflict checking,
      propose updating it in place, and ask for confirmation.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [reschedule, self_conflict, existing_booking, update_in_place, halifax]
    requirement_refs: [CHG-01, AVL-05, ACT-01]
    inputs:
      now: "2027-03-04T09:00:00-04:00"
      recruiter: {id: rec_brendan, name: Brendan MacLeod, time_zone: America/Halifax}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Noah Park
        time_zone: America/Halifax
        availability:
          - {start: "2027-03-09T10:30:00-04:00", end: "2027-03-09T12:00:00-04:00"}
      interview_plan:
        name: Backend Developer - technical interview
        sessions:
          - {id: TECH, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_aiden]}
      interviewers:
        - id: int_aiden
          name: Aiden Boucher
          time_zone: America/Halifax
          availability_source: calendar
          calendar:
            - {start: "2027-03-09T10:00:00-04:00", end: "2027-03-09T11:00:00-04:00", status: busy, event_id: evt-7731, subject: "Interview - Noah Park - Technical"}
            - {start: "2027-03-09T11:30:00-04:00", end: "2027-03-09T12:00:00-04:00", status: busy}
      case_state:
        existing_bookings:
          - {session: TECH, event_id: evt-7731, start: "2027-03-09T10:00:00-04:00", end: "2027-03-09T11:00:00-04:00", organizer: recruiting@contoso.example, attendees: [candidate, int_aiden]}
      conversation:
        - role: candidate
          channel: email
          text: Could we push Tuesday's technical interview back 30 minutes? I can do anything between 10:30 and noon.
        - role: recruiter
          text: Can we move Noah's technical to 10:30?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes: move the existing interview (evt-7731) to 10:30-11:30 a.m. AST on Tuesday, March 9, 2027. The 10:00-11:00
        block on Aiden's calendar is this same interview; 11:30 a.m. is the real limit. Ask to confirm the update.
      must:
        - Recognize that the 10:00-11:00 a.m. busy block is the interview being rescheduled (evt-7731) and not a conflict.
        - Propose 10:30-11:30 a.m. AST on Tuesday, March 9 as the only valid new time.
        - Propose updating the existing event rather than creating a new one, and ask for confirmation before changing it.
      must_not:
        - Report that 10:30 conflicts with Aiden's calendar.
        - Create a second interview event or cancel the original before confirmation.
        - Propose any start after 10:30 a.m., which would overlap the 11:30 meeting.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-09T09:00:00-04:00", end: "2027-03-09T13:00:00-04:00"}
      participants:
        candidate: {time_zone: America/Halifax, available: [["2027-03-09T10:30:00-04:00", "2027-03-09T12:00:00-04:00"]]}
        int_aiden: {time_zone: America/Halifax, busy: [["2027-03-09T11:30:00-04:00", "2027-03-09T12:00:00-04:00"]]}
      sessions:
        - {id: TECH, duration_min: 60, attendees: [candidate, int_aiden]}
      expect_feasible: true
      valid_examples:
        - {TECH: "2027-03-09T10:30:00-04:00"}
      invalid_examples:
        - {TECH: "2027-03-09T11:00:00-04:00", note: Overlaps the 11:30 meeting.}
      valid_start_bounds:
        TECH: {earliest: "2027-03-09T10:30:00-04:00", latest: "2027-03-09T10:30:00-04:00"}

