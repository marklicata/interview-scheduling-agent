          working_hours: {time_zone: America/Mexico_City, start: "09:00", end: "18:00"}
          busy: [["2027-01-12T12:00:00-06:00", "2027-01-12T13:00:00-06:00"]]
      sessions:
        - {id: PS, duration_min: 45, attendees: [candidate, int_lucia]}
      expect_feasible: true
      valid_examples:
