          name: Sneha Kulkarni
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2027-01-13T10:00:00+05:30", end: "2027-01-13T11:00:00+05:30", status: busy}
            - {start: "2027-01-13T10:30:00+05:30", end: "2027-01-13T11:30:00+05:30", status: busy}
            - {start: "2027-01-13T11:30:00+05:30", end: "2027-01-13T12:00:00+05:30", status: tentative}
      conversation:
        - role: recruiter
          text: 30 min phone screen for Kavitha with Sneha on Wednesday morning please.
    expected:
      disposition: propose_options
      solution_summary: >-
        Two options on Wednesday, January 13, 2027: 9:30-10:00 a.m. IST or 12:00-12:30 p.m. IST. 10:00 a.m.-12:00 p.m.
        is covered by two overlapping meetings and a tentative hold.
      must:
        - Propose only 9:30-10:00 a.m. and 12:00-12:30 p.m. IST on Wednesday, January 13.
        - Ask which option to book.
      must_not:
        - Offer 11:00-11:30 a.m., which is inside the second overlapping meeting.
        - Offer 11:30 a.m., which is tentative and blocks by default.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
