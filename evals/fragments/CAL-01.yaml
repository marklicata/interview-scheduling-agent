      recruiter: {id: rec_noor, name: Noor Al-Sayed, time_zone: Asia/Dubai}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Omar Farouk
        time_zone: Asia/Dubai
        availability:
          - {start: "2026-12-08T09:30:00+04:00", end: "2026-12-08T12:00:00+04:00"}
      interview_plan:
        name: Supply Chain Analyst - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_farid]}
      interviewers:
        - id: int_farid
          name: Farid Rahimi
          time_zone: Asia/Dubai
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          recurring_series:
            - {subject: Ops weekly review, pattern: "weekly on Tuesday 10:00-11:00 Asia/Dubai", cancelled_occurrences: ["2026-12-08"]}
          calendar:
            - {start: "2026-12-08T11:30:00+04:00", end: "2026-12-08T12:30:00+04:00", status: busy}
      conversation:
        - role: recruiter
          text: Omar can do Tuesday Dec 8, 9:30 to noon. Farid has his ops review Tuesdays at 10 though - anything left?
    expected:
      disposition: propose_options
      solution_summary: >-
        Yes. The December 8 occurrence of the ops review was cancelled, so 60-minute starts from 9:30 to 10:30 a.m.
        GST on Tuesday, December 8, 2026 are available (the 11:30 a.m. meeting still blocks later starts).
      must:
        - Explain that the December 8 occurrence of the weekly review is cancelled and does not block.
        - Propose only starts from 9:30 to 10:30 a.m. GST on Tuesday, December 8.
        - Ask whether to book.
      must_not:
        - Block 10:00-11:00 a.m. from the series pattern and report no availability.
        - Propose any start after 10:30 a.m., which would overlap the 11:30 meeting.
        - Book before explicit confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-08T08:00:00+04:00", end: "2026-12-08T17:00:00+04:00"}
      participants:
