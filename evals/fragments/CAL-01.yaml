  - id: CAL-031
    title: Calendar looks empty in the evening, but that is outside the interviewer's working hours
    category: calendar_semantics
    subcategory: free_outside_working_hours
    description: >-
      The Paris interviewer's schedule shows no events after 6 p.m., and the recruiter reads "totally free". The
      same response carries working hours of 09:00-18:00 Paris time. The Pacific candidate's 10 a.m.-12 p.m. window
      is 7-9 p.m. in Paris. Empty calendar time outside working hours is not availability; the agent must
      present a conditional path (interviewer opt-in) and an alternative ask to the candidate, not book.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [working_hours, free_is_not_available, cross_timezone, near_fit, france]
    requirement_refs: [AVL-10, CRD-01, CRD-02, EC-124]
    inputs:
      now: "2027-01-20T09:00:00-08:00"
      recruiter: {id: rec_lucas, name: Lucas Martin, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aiden Murphy
        time_zone: America/Los_Angeles
        availability:
          - {start: "2027-01-26T10:00:00-08:00", end: "2027-01-26T12:00:00-08:00"}
      interview_plan:
        name: Machine Learning Engineer - modeling interview
        sessions:
          - {id: ML, title: Modeling interview, format: virtual, duration_min: 60, interviewers: [int_claire]}
      interviewers:
        - id: int_claire
          name: Claire Dubois
          time_zone: Europe/Paris
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00", source: mailbox settings returned with the schedule}
          calendar:
            - {start: "2027-01-26T09:00:00+01:00", end: "2027-01-26T10:00:00+01:00", status: busy}
      conversation:
        - role: recruiter
          text: Claire's calendar is totally free Tuesday evening her time. Aiden can do 10-12 Pacific. Book it.
    expected:
      disposition: conditional_handoff
      solution_summary: >-
        No option within Claire's working hours: 10:00 a.m.-12:00 p.m. PST on Tuesday, January 26, 2027 is 7:00-9:00
        p.m. CET, after her 6:00 p.m. end. Conditional option 10:00-11:00 a.m. PST (7:00-8:00 p.m. CET) only if Claire
        agrees; alternatively ask Aiden for 8:00-9:00 a.m. PST (5:00-6:00 p.m. CET), which is within her hours.
      must:
        - Explain that an empty calendar outside working hours does not mean Claire is available, citing her 09:00-18:00 Paris working hours.
        - Convert the candidate window to 7:00-9:00 p.m. CET on Tuesday, January 26.
        - Present 10:00-11:00 a.m. PST (7:00-8:00 p.m. CET) only as conditional on Claire's agreement and tell the recruiter what to ask her.
        - Suggest asking the candidate whether 8:00-9:00 a.m. PST (5:00-6:00 p.m. CET) is possible.
      must_not:
        - Book any time outside Claire's working hours without her explicit agreement.
        - Describe the evening as available because no events are present.
        - Contact Claire or the candidate directly.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-26T18:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-01-26T10:00", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2027-01-26T18:00:00Z", time_zone: Europe/Paris, expected_local: "2027-01-26T19:00", expected_utc_offset: "+01:00"}
      - {instant: "2027-01-26T16:00:00Z", time_zone: Europe/Paris, expected_local: "2027-01-26T17:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-26T00:00:00-08:00", end: "2027-01-27T00:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2027-01-26T10:00:00-08:00", "2027-01-26T12:00:00-08:00"]]}
        int_claire:
          time_zone: Europe/Paris
          working_hours: {time_zone: Europe/Paris, start: "09:00", end: "18:00"}
          busy: [["2027-01-26T09:00:00+01:00", "2027-01-26T10:00:00+01:00"]]
      sessions:
        - {id: ML, duration_min: 60, attendees: [candidate, int_claire]}
      expect_feasible: false
      invalid_examples:
        - {ML: "2027-01-26T10:00:00-08:00", note: "7:00 p.m. in Paris, outside working hours."}

  - id: CAL-032
    title: Interviewer on leave volunteers one specific slot - explicit confirmation supersedes OOO for that slot only
    category: calendar_semantics
    subcategory: oof_explicit_volunteer
    description: >-
      The Auckland interviewer is OOO all week but tells the recruiter in Teams that she can join for 45 minutes
      on Thursday at 10 a.m. NZ time. That attributable, specific confirmation supersedes the OOO for that slot
      only. The Sydney candidate's window starts two hours earlier in Sydney clock terms. The agent must not widen
      the exception to other times or days.
