      solution_summary: >-
        Yes: Thursday, February 18, 2027, 10:00-10:45 a.m. NZDT = 8:00-8:45 a.m. AEDT. Kate's explicit message
        supersedes her OOO for that 45-minute slot only; record the exception and ask whether to book.
