  - id: CAL-023
    title: All-day busy office holiday blocks the day; an all-day Free FYI event does not
    category: calendar_semantics
    subcategory: all_day_holiday_vs_fyi
    description: >-
      The Ho Chi Minh City interviewer has an all-day busy "office closed" holiday on Monday and an all-day Free
      "offsite week (FYI)" banner on Tuesday. The candidate is in Shanghai, one hour ahead. Monday is blocked in
      the interviewer's own day; Tuesday is usable apart from a morning standup. Abbreviations are avoided
      because "CST" would be ambiguous for China.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [all_day_event, holiday, free_status, vietnam, china, avoid_ambiguous_abbreviation]
    requirement_refs: [AVL-03, AVL-10, EC-022, EC-023]
    inputs:
      now: "2027-02-22T09:00:00+08:00"
      recruiter: {id: rec_wei, name: Wei Zhang, time_zone: Asia/Shanghai}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Chen Jiahui
        time_zone: Asia/Shanghai
        availability:
          - {start: "2027-03-01T10:00:00+08:00", end: "2027-03-01T12:00:00+08:00"}
          - {start: "2027-03-02T10:00:00+08:00", end: "2027-03-02T12:00:00+08:00"}
      interview_plan:
        name: Embedded Software Engineer - technical interview
        sessions:
          - {id: TECH, title: Embedded systems interview, format: virtual, duration_min: 60, interviewers: [int_linh]}
      interviewers:
        - id: int_linh
          name: Nguyen Thi Linh
          time_zone: Asia/Ho_Chi_Minh
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:30", end: "17:30"}
          calendar:
            - {start: "2027-03-01T00:00:00+07:00", end: "2027-03-02T00:00:00+07:00", status: busy, all_day: true, subject: Office closed - regional holiday}
            - {start: "2027-03-02T00:00:00+07:00", end: "2027-03-03T00:00:00+07:00", status: free, all_day: true, subject: Team offsite week (FYI)}
            - {start: "2027-03-02T09:00:00+07:00", end: "2027-03-02T09:30:00+07:00", status: busy, subject: Standup}
      policies:
        holiday_calendar:
          - {date: "2027-03-01", name: Regional office holiday (fictional), region: Ho Chi Minh City office}
      conversation:
        - role: recruiter
          text: Jiahui can do Mon Mar 1 or Tue Mar 2, 10-12 Beijing time. Linh's calendar has all-day stuff both days - is either day possible?
    expected:
      disposition: propose_options
      solution_summary: >-
        Monday, March 1, 2027 is an office holiday for Linh (all-day busy). Tuesday, March 2 works: 60-minute starts
        from 10:30 to 11:00 a.m. Beijing time (9:30-10:00 a.m. Ho Chi Minh City time); the all-day FYI banner is Free
        and does not block.
      must:
        - Treat Monday, March 1 as unavailable because of the all-day busy holiday in Linh's own time zone.
        - Treat the Tuesday all-day FYI event as non-blocking because it is marked Free.
        - Propose only starts from 10:30 to 11:00 a.m. Beijing time (9:30-10:00 a.m. Ho Chi Minh City time) on Tuesday, March 2.
        - Label times with explicit city names or UTC offsets rather than the ambiguous abbreviation CST.
      must_not:
        - Propose any Monday, March 1 time.
        - Block all of Tuesday because of the Free all-day banner.
        - Propose 10:00 a.m. Beijing time on Tuesday, which overlaps Linh's 9:00-9:30 a.m. standup.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-02T02:30:00Z", time_zone: Asia/Ho_Chi_Minh, expected_local: "2027-03-02T09:30", expected_weekday: Tuesday, expected_utc_offset: "+07:00"}
      - {instant: "2027-03-02T02:30:00Z", time_zone: Asia/Shanghai, expected_local: "2027-03-02T10:30", expected_utc_offset: "+08:00"}
      - {instant: "2027-03-01T02:00:00Z", time_zone: Asia/Ho_Chi_Minh, expected_local: "2027-03-01T09:00", expected_weekday: Monday}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-01T08:00:00+08:00", end: "2027-03-02T19:00:00+08:00"}
      participants:
        candidate:
          time_zone: Asia/Shanghai
          available: [["2027-03-01T10:00:00+08:00", "2027-03-01T12:00:00+08:00"], ["2027-03-02T10:00:00+08:00", "2027-03-02T12:00:00+08:00"]]
        int_linh:
          time_zone: Asia/Ho_Chi_Minh
          working_hours: {time_zone: Asia/Ho_Chi_Minh, start: "08:30", end: "17:30"}
          busy: [["2027-03-01T00:00:00+07:00", "2027-03-02T00:00:00+07:00"], ["2027-03-02T09:00:00+07:00", "2027-03-02T09:30:00+07:00"]]
      sessions:
        - {id: TECH, duration_min: 60, attendees: [candidate, int_linh]}
      expect_feasible: true
      valid_examples:
        - {TECH: "2027-03-02T10:30:00+08:00"}
      invalid_examples:
        - {TECH: "2027-03-01T10:00:00+08:00", note: Office holiday for the interviewer.}
        - {TECH: "2027-03-02T10:00:00+08:00", note: Overlaps the standup.}
      valid_start_bounds:
        TECH: {earliest: "2027-03-02T10:30:00+08:00", latest: "2027-03-02T11:00:00+08:00"}

  - id: CAL-024
    title: Recruiter points at the executive assistant's calendar instead of the executive's
    category: calendar_semantics
    subcategory: delegate_vs_principal_calendar
    description: >-
      The VP's executive assistant manages his calendar, and the recruiter tells the agent to "use Hana's
      calendar". Hana's own calendar is wide open, but the interview attendee is the VP; his calendar shows a
      busy block and a private block. The agent must check the principal's calendar (which delegate access makes
      visible), not the delegate's own availability, and keep the private block private.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [executive, virtual_1on1]
    tags: [delegate_access, principal_calendar, executive_assistant, private_busy, wrong_mailbox_trap]
    requirement_refs: [AVL-07, AVL-01, EC-046]
    inputs:
      now: "2027-01-28T09:00:00-06:00"
      recruiter: {id: rec_rachel, name: Rachel Adeyemi, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Victoria Lin
        time_zone: America/Chicago
        availability:
          - {start: "2027-02-04T13:00:00-06:00", end: "2027-02-04T16:00:00-06:00"}
      interview_plan:
        name: Director of Engineering - VP interview
        sessions:
          - {id: VP, title: VP conversation, format: virtual, duration_min: 45, interviewers: [int_marco]}
      interviewers:
        - id: int_marco
          name: Marco Bianchi
          role: VP Engineering
          time_zone: America/Chicago
          availability_source: calendar
          delegate: {name: Hana Suzuki, role: Executive assistant, access: editor on Marco's calendar}
          calendar:
            - {start: "2027-02-04T13:00:00-06:00", end: "2027-02-04T14:30:00-06:00", status: busy}
            - {start: "2027-02-04T15:30:00-06:00", end: "2027-02-04T16:00:00-06:00", status: private_busy}
      other_calendars:
        - owner: Hana Suzuki (executive assistant)
          time_zone: America/Chicago
          calendar: []
          note: Hana's own mailbox - no events on February 4 afternoon
      conversation:
        - role: recruiter
          text: Use Hana's calendar, she runs Marco's schedule. She's wide open Thursday afternoon so book Victoria with Marco at 1pm.
    expected:
      disposition: propose_options
      solution_summary: >-
        Hana's own calendar is not Marco's availability. Marco's calendar (visible via delegate access) shows him
        busy 1:00-2:30 p.m. and privately busy 3:30-4:00 p.m. CST on Thursday, February 4, 2027, so 45-minute starts
        from 2:30 to 2:45 p.m. CST are the only options. Ask whether to book.
      must:
        - Explain that availability must come from Marco's calendar, not Hana's personal calendar.
        - Propose only starts from 2:30 to 2:45 p.m. CST on Thursday, February 4.
        - Describe the 3:30-4:00 p.m. block only as a private commitment.
        - Ask whether to book (the recruiter's 1:00 p.m. instruction was based on the wrong calendar).
      must_not:
        - Book 1:00 p.m. or treat Hana's empty calendar as Marco's availability.
        - Reveal details of Marco's private event.
        - Add Hana as an interview attendee unless asked.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-04T09:00:00-06:00", end: "2027-02-04T17:00:00-06:00"}
      participants:
        candidate: {time_zone: America/Chicago, available: [["2027-02-04T13:00:00-06:00", "2027-02-04T16:00:00-06:00"]]}
        int_marco:
          time_zone: America/Chicago
          busy: [["2027-02-04T13:00:00-06:00", "2027-02-04T14:30:00-06:00"], ["2027-02-04T15:30:00-06:00", "2027-02-04T16:00:00-06:00"]]
      sessions:
        - {id: VP, duration_min: 45, attendees: [candidate, int_marco]}
      expect_feasible: true
      valid_examples:
        - {VP: "2027-02-04T14:30:00-06:00"}
      invalid_examples:
        - {VP: "2027-02-04T13:00:00-06:00", note: Marco is busy; Hana's calendar is irrelevant.}
        - {VP: "2027-02-04T15:00:00-06:00", note: Runs into the private block.}
      valid_start_bounds:
        VP: {earliest: "2027-02-04T14:30:00-06:00", latest: "2027-02-04T14:45:00-06:00"}

  - id: CAL-025
    title: Legacy merged view shows "free" but the source says one onsite panelist is working elsewhere
    category: calendar_semantics
    subcategory: merged_view_hides_working_elsewhere
    description: >-
      An in-person two-interviewer panel in Munich. The recruiting team's legacy availability grid shows both
      panelists free; the underlying Graph schedule items show one panelist as working elsewhere with location
      Hamburg office. The merged view lost the distinction. The agent must use the richer source, not infer
      onsite presence, and hand the presence question to the recruiter.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel, in_person_loop]
    tags: [working_elsewhere, source_fidelity, merged_view, onsite_presence, germany]
    requirement_refs: [AVL-09, AVL-11, EC-048, EC-141, CON-11]
    inputs:
      now: "2027-02-02T09:00:00+01:00"
      recruiter: {id: rec_jonas, name: Jonas Becker, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Selin Arslan
        time_zone: Europe/Berlin
        availability:
          - {start: "2027-02-09T10:00:00+01:00", end: "2027-02-09T12:00:00+01:00"}
      interview_plan:
        name: Automotive Software Architect - onsite panel
        sessions:
          - {id: PANEL, title: Architecture panel, format: in_person, duration_min: 60, interviewers: [int_lea, int_leo], all_required: true, location: Contoso Munich office}
      interviewers:
        - {id: int_lea, name: Lea Fischer, time_zone: Europe/Berlin, availability_source: calendar, calendar: []}
        - id: int_leo
          name: Leo Schulz
          time_zone: Europe/Berlin
          availability_source: calendar
          calendar:
            - {start: "2027-02-09T08:00:00+01:00", end: "2027-02-09T18:00:00+01:00", status: working_elsewhere, location: Hamburg office}
      source_observations:
        legacy_grid: {Lea: free 10:00-12:00, Leo: free 10:00-12:00, statuses_supported: [free, busy]}
        graph_get_schedule: {Lea: free, Leo: "workingElsewhere 08:00-18:00 (location Hamburg office)"}
      conversation:
        - role: recruiter
          text: Our grid shows Lea and Leo both free Tuesday 10-12. Set up Selin's onsite panel in Munich at 10.
    expected:
      disposition: conditional_handoff
      solution_summary: >-
        Not confirmable as an onsite panel. The legacy grid collapses Leo's working-elsewhere status into free; the
        source shows him working elsewhere (Hamburg office) all day Tuesday, February 9, 2027. Conditional option
        10:00-11:00 a.m. CET (or 11:00 a.m.-12:00 p.m.) if the recruiter confirms Leo will be in Munich.
      must:
        - Explain that the legacy grid shows Leo as free but the underlying calendar status is working elsewhere (Hamburg office).
        - State that working elsewhere does not establish onsite presence in Munich.
        - Present Tuesday, February 9, 10:00-11:00 a.m. CET as conditional and tell the recruiter to ask Leo whether he will be in the Munich office then.
        - Note the grid's lost distinction as a workflow/interpretation limitation, not a calendar API limitation.
      must_not:
        - Book the onsite panel or present it as confirmed.
        - Switch Leo to remote attendance without the recruiter's decision.
        - Claim the calendar API cannot report working-elsewhere or tentative statuses.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-09T08:00:00+01:00", end: "2027-02-09T18:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Berlin, available: [["2027-02-09T10:00:00+01:00", "2027-02-09T12:00:00+01:00"]]}
        int_lea: {time_zone: Europe/Berlin}
        int_leo: {time_zone: Europe/Berlin, busy: [["2027-02-09T08:00:00+01:00", "2027-02-09T18:00:00+01:00"]]}
      sessions:
        - {id: PANEL, duration_min: 60, attendees: [candidate, int_lea, int_leo]}
      expect_feasible: false
      invalid_examples:
        - {PANEL: "2027-02-09T10:00:00+01:00", note: Leo's onsite presence is not established.}
    grading_notes: The oracle models confirmed onsite availability; working elsewhere is modeled as not established for an in-person session.

  - id: CAL-026
    title: Old tool showed busy; Graph returns tentative - do not blame the API for a binary view
    category: calendar_semantics
    subcategory: legacy_binary_display_vs_graph_tentative
    description: >-
      The recruiter believes Microsoft Graph only returns busy/free, so the old tool's "busy" for the
      interviewer's only matching hour must be final. The current source returns that hour as tentative. The
      agent must correct the misconception, preserve the tentative status, apply the default policy (tentative
      blocks), and hand the recruiter a precise question for the interviewer.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [graph_tentative, source_fidelity, binary_view_myth, near_fit, recruiter_handoff]
    requirement_refs: [AVL-09, AVL-11, EC-123, EC-141, GS-040]
    inputs:
      now: "2027-02-05T10:00:00-08:00"
      recruiter: {id: rec_maria, name: Maria Gonzalez, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jordan Blake
        time_zone: America/Los_Angeles
        availability:
          - {start: "2027-02-10T15:00:00-08:00", end: "2027-02-10T16:00:00-08:00"}
      interview_plan:
        name: Engineering Manager - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_ahmed]}
        rules: {tentative_policy: blocks}
      interviewers:
        - id: int_ahmed
          name: Ahmed Siddiqui
          time_zone: America/Los_Angeles
          availability_source: calendar
          calendar:
            - {start: "2027-02-10T15:00:00-08:00", end: "2027-02-10T16:00:00-08:00", status: tentative}
      source_observations:
        legacy_tool: {display: busy, statuses_supported: [busy, free]}
        graph_get_schedule: {scheduleItems: "status tentative 15:00-16:00", availabilityView_code: "1"}
      conversation:
        - role: recruiter
          text: >-
            Since Graph only gives busy/free we can't tell if Ahmed's 3pm Wednesday is soft, right? The old tool shows
            him busy, so I guess Jordan's out of luck.
    expected:
      disposition: conditional_handoff
      solution_summary: >-
        Graph does report tentative; the old tool collapsed it to busy. Ahmed is tentative 3:00-4:00 p.m. PST on
        Wednesday, February 10, 2027 - blocked by default, but a conditional option if Ahmed confirms he can take
        the interview then. Ask the recruiter to check with him.
      must:
        - State that the calendar source reports Ahmed's 3:00-4:00 p.m. block as tentative, and that the busy display came from the old tool's binary presentation.
        - Explain that tentative blocks under the plan, so the hour is conditional rather than available.
        - Tell the recruiter to ask Ahmed whether he can do 3:00-4:00 p.m. PST on Wednesday, February 10 and report back.
      must_not:
        - Claim Microsoft Graph or the calendar API only returns busy/free.
        - Treat the tentative hour as fully available or book it.
        - Tell the recruiter there is no possible option without mentioning the conditional path.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-02-10T08:00:00-08:00", end: "2027-02-10T18:00:00-08:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2027-02-10T15:00:00-08:00", "2027-02-10T16:00:00-08:00"]]}
        int_ahmed: {time_zone: America/Los_Angeles, busy: [["2027-02-10T15:00:00-08:00", "2027-02-10T16:00:00-08:00"]]}
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_ahmed]}
      expect_feasible: false
      invalid_examples:
        - {HM: "2027-02-10T15:00:00-08:00", note: Tentative blocks under the plan.}

  - id: CAL-027
    title: WorkIQ and direct Graph return identical statuses - no invented advantage
    category: calendar_semantics
    subcategory: workiq_graph_equivalence
    description: >-
      The recruiter believes WorkIQ is "smarter" and will reveal that the interviewer's 3 p.m. is flexible. Both
      sources, queried under the same permissions, return the same busy block. The agent must report the
      equivalence honestly, keep the same scheduling conclusion, and offer the real options. Bangladesh uses a
      Sunday-Thursday work week and no ambiguous abbreviation should be used.
