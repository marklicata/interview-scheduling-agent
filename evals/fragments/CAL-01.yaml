        int_farid:
          time_zone: Asia/Dubai
          working_hours: {time_zone: Asia/Dubai, start: "08:00", end: "17:00"}
          busy: [["2026-12-08T11:30:00+04:00", "2026-12-08T12:30:00+04:00"]]
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_farid]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-12-08T10:00:00+04:00"}
      invalid_examples:
        - {HM: "2026-12-08T10:45:00+04:00", note: Overlaps the 11:30 meeting.}
      valid_start_bounds:
        HM: {earliest: "2026-12-08T09:30:00+04:00", latest: "2026-12-08T10:30:00+04:00"}

