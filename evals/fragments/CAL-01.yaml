  - id: CAL-028
    title: Free/busy is only published through mid-January - later dates are unknown, not free
    category: calendar_semantics
    subcategory: publication_horizon_unknown
    description: >-
      The interviewer's mailbox publishes free/busy only through January 15, 2027. The candidate offers January 8
      and January 19. The agent must use real data for January 8 and treat January 19 as unknown (neither free nor
      impossible), proposing January 8 and explaining how to evaluate the 19th.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, system_design]
    tags: [unknown_status, coverage_horizon, partial_coverage, norway]
    requirement_refs: [AVL-01, AVL-02, AVL-04, EC-056]
    inputs:
      now: "2026-12-01T09:00:00+01:00"
