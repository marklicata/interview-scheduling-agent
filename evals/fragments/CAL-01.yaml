        - id: int_kate
          name: Kate Whitaker
          time_zone: Pacific/Auckland
          availability_source: mixed
          calendar:
            - {start: "2027-02-15T00:00:00+13:00", end: "2027-02-20T00:00:00+13:00", status: oof, subject: Annual leave}
          supplied_availability:
            - {start: "2027-02-18T10:00:00+13:00", end: "2027-02-18T10:45:00+13:00", source: Kate via Teams, scope: this interview only}
      conversation:
        - role: interviewer
          channel: teams
          at: "2027-02-10T08:40:00+13:00"
