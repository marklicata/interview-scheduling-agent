      candidate:
        id: candidate
        name: Kavitha Subramanian
        time_zone: Asia/Kolkata
        availability:
          - {start: "2027-01-13T09:30:00+05:30", end: "2027-01-13T12:30:00+05:30"}
      interview_plan:
        name: Payroll Analyst - recruiter screen
        sessions:
          - {id: PS, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_sneha]}
      interviewers:
