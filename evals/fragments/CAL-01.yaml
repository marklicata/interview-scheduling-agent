  - id: CAL-013
    title: Deleted occurrence of a weekly meeting does not block its usual slot
    category: calendar_semantics
    subcategory: recurrence_deleted_occurrence
    description: >-
      The interviewer has a weekly Tuesday 10:00-11:00 review, but this Tuesday's occurrence was cancelled.
      Blocking from the series pattern instead of the expanded occurrences would leave no 60-minute gap in the
      candidate's window and produce a false "no availability". The correct answer uses the actual instances.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, hiring_manager]
    tags: [recurrence, deleted_occurrence, series_master_trap, dubai]
    requirement_refs: [AVL-03, EC-053, SCH-04]
    inputs:
