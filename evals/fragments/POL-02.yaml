          granted_by: rec_maya
          granted_at: "2026-11-27T16:00:00-08:00"
          scope:
            case: REQ-6120 / Inés Duarte
            actions: [book]
            date_range: {start: "2026-12-01T00:00:00-08:00", end: "2026-12-05T00:00:00-08:00"}
            organizer: recruiting@contoso.example
          expires: "2026-12-05T00:00:00-08:00"
      candidate:
        id: candidate
        name: Inés Duarte
        email: ines.duarte@example.net
        time_zone: America/Los_Angeles
        availability:
          - {start: "2026-12-01T13:00:00-08:00", end: "2026-12-01T16:00:00-08:00"}
          - {start: "2026-12-02T10:00:00-08:00", end: "2026-12-02T12:00:00-08:00"}
      interview_plan:
        name: Software Engineer II - coding interview
        requisition: REQ-6120
        sessions:
          - {id: S1, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_bilal]}
      interviewers:
