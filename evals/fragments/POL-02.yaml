      - {instant: "2026-11-27T15:00:00Z", time_zone: Europe/Dublin, expected_local: "2026-11-27T15:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-27T00:00:00-05:00", end: "2026-12-02T00:00:00-05:00"}
      participants:
