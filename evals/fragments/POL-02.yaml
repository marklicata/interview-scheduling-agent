          - {start: "2026-12-01T15:00:00+00:00", end: "2026-12-01T16:00:00+00:00"}
      interview_plan:
        name: Payments Product Manager - interview
        sessions:
          - {id: S1, title: Product interview, format: virtual, duration_min: 60, interviewers: [int_wendell]}
