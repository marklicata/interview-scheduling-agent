        Bilal already has three interviews on Tuesday, December 1 (cap 3), and the calendar note cannot lift the
        cap. Under the active grant, book Wednesday, December 2, 2026, 10:00-11:00 a.m. PST from
        recruiting@contoso.example with a Teams link, and report it.
