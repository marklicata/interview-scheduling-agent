          calendar:
            - {start: "2026-12-01T09:00:00-05:00", end: "2026-12-01T12:00:00-05:00", status: busy}
      policies:
        holiday_calendar:
          - {date: "2026-11-26", name: Contoso US company holiday, region: US}
          - {date: "2026-11-27", name: Contoso US company holiday (day after), region: US}
        holiday_scheduling: Requires the affected interviewer's explicit consent, recorded by the recruiter.
        holiday_consent_register:
          - {interviewer: int_wendell, date: "2026-11-27", window_local: "10:00-12:00 America/New_York", recorded_by: rec_priscilla, source: Wendell's email of November 18}
      conversation:
        - role: recruiter
          text: Wendell agreed to do Siobhán on the 27th even though it's a holiday - I logged it. What works?
    expected:
