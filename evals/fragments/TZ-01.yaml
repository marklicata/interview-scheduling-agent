  - id: TZ-024
    title: Confirmed booking proposed before the US change and held after it uses the correct EDT offset
    category: cross_timezone
    subcategory: confirmed_booking_across_dst
    description: >-
      On Friday, March 12, 2027 (Montreal on EST) the agent proposed Wednesday, March 17, 10:00-11:00 a.m. EDT
      (3:00-4:00 p.m. CET) for a Montreal candidate and a Paris interviewer. The recruiter explicitly confirms. The agent
      must revalidate and create exactly one event at 14:00-15:00 UTC with a Teams link - not at 15:00 UTC, which is what
      a stale EST offset would produce.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [confirmed_booking, us_dst_change, montreal, paris, offset_correctness, teams]
    requirement_refs: [ACT-01, ACT-03, AVL-05, COM-02, COM-06]
    inputs:
      now: "2027-03-12T11:00:00-05:00"
      recruiter: {id: rec_noor, name: Noor Rahimi, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Elodie Tremblay
        email: elodie.tremblay@example.net
        time_zone: America/Toronto
        availability:
          - {start: "2027-03-17T09:00:00-04:00", end: "2027-03-17T12:00:00-04:00"}
      interview_plan:
        name: Localization Program Manager - interview with Paris lead
        sessions:
          - {id: S1, title: Localization lead interview, format: virtual, duration_min: 60, interviewers: [int_bastien]}
      interviewers:
        - id: int_bastien
          name: Bastien Roux
          time_zone: Europe/Paris
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2027-03-17T16:30:00+01:00", end: "2027-03-17T17:30:00+01:00", status: busy}
      conversation:
        - role: agent
          at: "2027-03-12T10:30:00-05:00"
          text: >-
            Option 1 - Wed Mar 17, 10:00-11:00 a.m. EDT (3:00-4:00 p.m. CET) with Bastien Roux, Teams, organizer
            recruiting@contoso.example. Want me to book it?
        - role: recruiter
          at: "2027-03-12T11:00:00-05:00"
          confirmation: true
          text: Yes, book option 1.
    expected:
      disposition: book
      solution_summary: >-
        Recheck availability, then create one Teams interview for Wednesday, March 17, 2027, 10:00-11:00 a.m. EDT
        (14:00-15:00 UTC; 3:00-4:00 p.m. CET) from recruiting@contoso.example to Elodie and Bastien.
      must:
        - Revalidate both participants' availability before booking.
        - Create exactly one event starting at 14:00 UTC (10:00 a.m. EDT, 3:00 p.m. CET) and ending at 15:00 UTC.
        - Include a Teams link and send from recruiting@contoso.example.
        - Report the booked time in both America/Toronto and Europe/Paris and say invitations were sent, not accepted.
      must_not:
        - Create the event at 15:00 UTC (a stale 10:00 a.m. EST reading, which is 4:00 p.m. CET).
        - Create duplicate events or change the confirmed time without asking.
        - Book a different option than the one confirmed.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 for Elodie Tremblay and Bastien Roux, notes: "2027-03-17 14:00-15:00 UTC; Teams link; organizer recruiting@contoso.example."}
    local_time_checks:
      - {instant: "2027-03-17T14:00:00Z", time_zone: America/Toronto, expected_local: "2027-03-17T10:00", expected_weekday: Wednesday, expected_utc_offset: "-04:00"}
      - {instant: "2027-03-17T14:00:00Z", time_zone: Europe/Paris, expected_local: "2027-03-17T15:00", expected_utc_offset: "+01:00"}
      - {instant: "2027-03-12T16:00:00Z", time_zone: America/Toronto, expected_local: "2027-03-12T11:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-17T00:00:00-04:00", end: "2027-03-18T00:00:00-04:00"}
      participants:
        candidate: {time_zone: America/Toronto, available: [["2027-03-17T09:00:00-04:00", "2027-03-17T12:00:00-04:00"]]}
        int_bastien:
          time_zone: Europe/Paris
          working_hours: {time_zone: Europe/Paris, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          busy: [["2027-03-17T16:30:00+01:00", "2027-03-17T17:30:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_bastien]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-03-17T10:00:00-04:00"}
      invalid_examples:
        - {S1: "2027-03-17T11:00:00-04:00", note: "Stale-offset drift; overlaps Bastien's 4:30 p.m. CET block."}
      valid_start_bounds:
        S1: {earliest: "2027-03-17T09:00:00-04:00", latest: "2027-03-17T10:30:00-04:00"}

  - id: TZ-025
    title: A "1 to 4 a.m." window on spring-forward night is only two real hours, too short for a 150-minute simulation
    category: cross_timezone
    subcategory: elapsed_time_across_gap
    description: >-
      An airport ground-operations candidate in New York offers "1 to 4 a.m." on Sunday, March 14, 2027 or the same hours
      on Sunday, March 21. On March 14 clocks jump from 2:00 to 3:00 a.m., so 1:00 a.m. EST to 4:00 a.m. EDT is 120
      elapsed minutes. A 150-minute live simulation with a Phoenix night supervisor fits only on March 21, starting 1:00-1:30
      a.m. EDT (10:00-10:30 p.m. MST Saturday).
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [simulation, work_trial]
    tags: [spring_forward_gap, elapsed_duration, night_shift, phoenix, new_york]
    requirement_refs: [AVL-10, SCH-01, EC-017, EC-021]
    inputs:
      now: "2027-03-08T10:00:00-05:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: DeShawn Whitaker
        time_zone: America/New_York
        availability:
          - {start: "2027-03-14T01:00:00-05:00", end: "2027-03-14T04:00:00-04:00"}
          - {start: "2027-03-21T01:00:00-04:00", end: "2027-03-21T04:00:00-04:00"}
      interview_plan:
        name: Ramp Operations Lead - live operations simulation
        sessions:
          - {id: SIM, title: Live disruption simulation, format: virtual, duration_min: 150, interviewers: [int_raquel]}
      interviewers:
        - id: int_raquel
          name: Raquel Jimenez
          time_zone: America/Phoenix
          availability_source: supplied
          supplied_availability:
            - {start: "2027-03-13T21:00:00-07:00", end: "2027-03-14T02:00:00-07:00"}
            - {start: "2027-03-20T21:00:00-07:00", end: "2027-03-21T02:00:00-07:00"}
      conversation:
        - role: candidate
          channel: email
          text: Between shifts I'm free 1 to 4 a.m. Sunday the 14th, or the same hours Sunday the 21st.
        - role: recruiter
          text: That's a 3-hour window, plenty for the 2.5-hour sim. Put him with Raquel on the 14th.
    expected:
      disposition: propose_options
      solution_summary: >-
        March 14 has only 2 elapsed hours (1:00 a.m. EST to 4:00 a.m. EDT = 06:00-08:00 UTC), too short for 150 minutes.
        Sunday, March 21, 2027 works: start 1:00-1:30 a.m. EDT = 10:00-10:30 p.m. MST Saturday, March 20.
      must:
        - Explain that on March 14, 2027 the 1:00-4:00 a.m. window is only 120 minutes long because 2:00 a.m. EST jumps to 3:00 a.m. EDT.
        - Propose March 21 starts from 1:00 to 1:30 a.m. EDT, showing Raquel's Saturday-evening MST time and date.
        - Ask whether to book.
      must_not:
        - Propose any 150-minute session on March 14.
        - Describe the March 14 window as three hours.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {local: "2027-03-14T02:30", time_zone: America/New_York, expect: nonexistent}
      - {instant: "2027-03-14T06:00:00Z", time_zone: America/New_York, expected_local: "2027-03-14T01:00", expected_weekday: Sunday, expected_utc_offset: "-05:00"}
      - {instant: "2027-03-14T08:00:00Z", time_zone: America/New_York, expected_local: "2027-03-14T04:00", expected_utc_offset: "-04:00"}
      - {instant: "2027-03-21T05:00:00Z", time_zone: America/Phoenix, expected_local: "2027-03-20T22:00", expected_weekday: Saturday, expected_utc_offset: "-07:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-13T00:00:00Z", end: "2027-03-22T00:00:00Z"}
      participants:
        candidate:
          time_zone: America/New_York
          available: [["2027-03-14T01:00:00-05:00", "2027-03-14T04:00:00-04:00"], ["2027-03-21T01:00:00-04:00", "2027-03-21T04:00:00-04:00"]]
        int_raquel:
          time_zone: America/Phoenix
          available: [["2027-03-13T21:00:00-07:00", "2027-03-14T02:00:00-07:00"], ["2027-03-20T21:00:00-07:00", "2027-03-21T02:00:00-07:00"]]
      sessions:
        - {id: SIM, duration_min: 150, attendees: [candidate, int_raquel]}
      expect_feasible: true
      valid_examples:
        - {SIM: "2027-03-21T01:00:00-04:00"}
      invalid_examples:
        - {SIM: "2027-03-14T01:00:00-05:00", note: "Ends 5:30 a.m. EDT; the candidate's window ends at 4:00 a.m. EDT."}
      valid_start_bounds:
        SIM: {earliest: "2027-03-21T01:00:00-04:00", latest: "2027-03-21T01:30:00-04:00"}

  - id: TZ-026
    title: Phoenix candidate writes "MT", the external interviewer has no availability, and the deadline is close
    category: cross_timezone
    subcategory: label_plus_unknown_plus_deadline
    description: >-
      A Phoenix candidate offers "Tue 3/16 9-11 am MT" and "Wed 3/17 1-3 pm MT". After March 14, 2027 Arizona time (UTC-7)
      and Denver's Mountain Daylight Time (UTC-6) differ by an hour. The required client interviewer is external (Denver),
      with no calendar access and no supplied availability. The interview must finish by Thursday, March 18, 5:00 p.m. MDT.
      The agent must separate three issues: the time-label ambiguity, the missing external availability (unknown is never
      free), and the deadline risk.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [arizona_no_dst, mountain_time_label, external_interviewer, unknown_availability, deadline_risk]
    requirement_refs: [INT-05, AVL-02, SCH-05, EC-106, EC-002]
    inputs:
      now: "2027-03-15T09:00:00-07:00"
      recruiter: {id: rec_tyler, name: Tyler Brennan, time_zone: America/Phoenix}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Celeste Yazzie-Moran
        time_zone: America/Phoenix
        time_zone_raw: MT
        availability_raw: Tue 3/16 9-11 am MT; Wed 3/17 1-3 pm MT
      interview_plan:
        name: Implementation Consultant - client interview
        sessions:
          - {id: S1, title: Client interview, format: virtual, duration_min: 60, interviewers: [ext_gareth]}
        rules: {complete_by: "2027-03-18T17:00:00-06:00", deadline_reason: client decision meeting}
      interviewers:
        - {id: ext_gareth, name: Gareth Olsen (client, external), time_zone: America/Denver, availability_source: none}
      conversation:
        - role: candidate
          channel: email
          text: I can do Tue 3/16 9-11am MT or Wed 3/17 1-3pm MT.
        - role: recruiter
          text: Celeste is in Phoenix. Gareth is the client in Denver - we don't see his calendar. Get this done before Thursday's deadline.
    expected:
      disposition: request_availability
      secondary_dispositions: [ask_clarification]
      clarifying_question_topics: [candidate_time_label_arizona_or_denver, external_interviewer_availability]
      solution_summary: >-
        Ask the recruiter to obtain Gareth's availability (or a complete blocked-time list with time zone) for March 16-18,
        and to confirm whether the candidate's "MT" means Arizona time. If Arizona time, her windows are Tue 10:00 a.m.-12:00
        p.m. MDT and Wed 2:00-4:00 p.m. MDT; if Denver time, Tue 8:00-10:00 a.m. and Wed 12:00-2:00 p.m. Arizona time.
        Flag that the deadline is Thursday, March 18, 5:00 p.m. MDT (4:00 p.m. Arizona).
      must:
        - Explain that Arizona and Denver differ by one hour after March 14, 2027 and give both readings of the candidate's windows.
        - State that Gareth's availability is unknown and cannot be treated as free.
        - Ask the recruiter to collect Gareth's availability with an explicit time zone.
        - Flag the Thursday, March 18, 5:00 p.m. MDT deadline and the limited remaining windows.
      must_not:
        - Propose or book a time with Gareth as if he were free.
        - Contact Gareth directly.
        - Silently assume "MT" means Denver time.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-16T16:00:00Z", time_zone: America/Phoenix, expected_local: "2027-03-16T09:00", expected_weekday: Tuesday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-16T16:00:00Z", time_zone: America/Denver, expected_local: "2027-03-16T10:00", expected_utc_offset: "-06:00"}
      - {instant: "2027-03-18T23:00:00Z", time_zone: America/Phoenix, expected_local: "2027-03-18T16:00", expected_weekday: Thursday}
