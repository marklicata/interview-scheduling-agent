  - id: TZ-011
    title: Two-round process with a Sao Paulo candidate straddles the US spring-forward
    category: cross_timezone
    subcategory: no_dst_region_multi_day
    description: >-
      Brazil has no DST, so Sao Paulo is 2 hours ahead of New York on March 11, 2027 and 1 hour ahead on March 16. The
      recruiter wants both rounds "at 11 am New York - that's 1 pm for her". That holds on March 11 but on March 16
      11:00 a.m. EDT is noon in Sao Paulo, before the candidate's 1:00 p.m. start; the second round fits only at
      12:00 p.m. EDT.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hiring_manager, case_interview]
    tags: [brazil_no_dst, sao_paulo, new_york, multi_day, us_dst_change]
    requirement_refs: [AVL-10, SCH-01, EC-019]
    inputs:
      now: "2027-03-03T10:00:00-05:00"
      recruiter: {id: rec_brooke, name: Brooke Lansing, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Larissa Monteiro
        time_zone: America/Sao_Paulo
        availability:
          - {start: "2027-03-11T13:00:00-03:00", end: "2027-03-11T15:00:00-03:00"}
          - {start: "2027-03-16T13:00:00-03:00", end: "2027-03-16T15:00:00-03:00"}
      interview_plan:
        name: Strategy Manager, LATAM - two rounds
        sessions:
          - {id: S1, title: Hiring manager conversation, format: virtual, duration_min: 60, interviewers: [int_gordon], order: 1}
          - {id: S2, title: Case discussion, format: virtual, duration_min: 60, interviewers: [int_paloma], order: 2}
      interviewers:
        - id: int_gordon
          name: Gordon Ashby
          time_zone: America/New_York
          availability_source: supplied
          supplied_availability:
            - {start: "2027-03-11T10:00:00-05:00", end: "2027-03-11T13:00:00-05:00"}
        - id: int_paloma
          name: Paloma Ibarra
          time_zone: America/New_York
          availability_source: supplied
          supplied_availability:
            - {start: "2027-03-16T10:00:00-04:00", end: "2027-03-16T13:00:00-04:00"}
      conversation:
        - role: recruiter
          text: >-
            Larissa is free 1-3pm her time on Thu 3/11 and Tue 3/16. Gordon (3/11) and Paloma (3/16) are both free 10-1
            our time. Do both at 11am New York - that's 1pm for her.
    expected:
      disposition: propose_options
      solution_summary: >-
        Round 1: Thursday, March 11, 2027, start 11:00 a.m.-12:00 p.m. EST (1:00-2:00 p.m. BRT). Round 2: Tuesday,
        March 16, only 12:00-1:00 p.m. EDT = 1:00-2:00 p.m. BRT.
      must:
        - Propose round 1 starting between 11:00 a.m. and 12:00 p.m. EST on March 11 (1:00-2:00 p.m. Sao Paulo).
        - Propose round 2 only at 12:00-1:00 p.m. EDT on March 16 (1:00-2:00 p.m. Sao Paulo).
        - Explain that the US moves to daylight time on March 14 while Brazil does not, so the gap drops from 2 hours to 1.
        - Ask whether to book both rounds.
      must_not:
        - Propose 11:00 a.m. EDT on March 16 (noon in Sao Paulo, before the candidate is available).
        - Claim Sao Paulo changes its clocks.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-11T16:00:00Z", time_zone: America/New_York, expected_local: "2027-03-11T11:00", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2027-03-11T16:00:00Z", time_zone: America/Sao_Paulo, expected_local: "2027-03-11T13:00", expected_utc_offset: "-03:00"}
      - {instant: "2027-03-16T16:00:00Z", time_zone: America/New_York, expected_local: "2027-03-16T12:00", expected_weekday: Tuesday, expected_utc_offset: "-04:00"}
