  - id: TZ-015
    title: Two-day Warsaw assessment for a Toronto candidate - day 2 no longer fits after Europe springs forward
    category: cross_timezone
    subcategory: multi_day_loop_straddles_dst
    description: >-
      Day 1 (Thursday, March 25, 2027) and day 2 (Monday, March 29) each need two 90-minute sessions with a 15-minute
      break (195 minutes). Toronto is on EDT both days, but Warsaw moves to CEST on March 28, so the candidate's
      8:00 a.m.-12:00 p.m. EDT window overlaps Warsaw's 9-17 working day by 240 minutes on day 1 and only 180 minutes
      on day 2. The recruiter wants "the same schedule both days". The complete plan is infeasible; day 1 is fine and
      day 2 needs a recruiter-owned decision.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [assessment_center, virtual_loop]
    tags: [eu_dst_change, multi_day_loop, warsaw, toronto, infeasible_with_options]
    requirement_refs: [AVL-10, SCH-04, SCH-05, CON-04, EC-019, EC-032]
    inputs:
      now: "2027-03-15T09:00:00-04:00"
      recruiter: {id: rec_noor, name: Noor Rahimi, time_zone: America/Toronto}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mathieu Gagnon-Leblanc
        time_zone: America/Toronto
        availability:
          - {start: "2027-03-25T08:00:00-04:00", end: "2027-03-25T12:00:00-04:00"}
          - {start: "2027-03-29T08:00:00-04:00", end: "2027-03-29T12:00:00-04:00"}
      interview_plan:
        name: Quant Developer - two-day virtual assessment
        sessions:
          - {id: S1, title: Day 1 - market microstructure, format: virtual, duration_min: 90, interviewers: [int_agnieszka], order: 1}
          - {id: S2, title: Day 1 - coding, format: virtual, duration_min: 90, interviewers: [int_piotr], order: 2}
          - {id: S3, title: Day 2 - system design, format: virtual, duration_min: 90, interviewers: [int_zofia], order: 3}
          - {id: S4, title: Day 2 - risk case, format: virtual, duration_min: 90, interviewers: [int_tomasz], order: 4}
        rules: {break_between_sessions_min: 15, same_day_pairs: [[S1, S2], [S3, S4]], shorter_breaks_allowed: false}
      interviewers:
        - {id: int_agnieszka, name: Agnieszka Nowak, time_zone: Europe/Warsaw, availability_source: supplied, working_hours: {start: "09:00", end: "17:00"},
           supplied_availability: [{start: "2027-03-25T09:00:00+01:00", end: "2027-03-25T17:00:00+01:00"}]}
        - {id: int_piotr, name: Piotr Zielinski, time_zone: Europe/Warsaw, availability_source: supplied, working_hours: {start: "09:00", end: "17:00"},
           supplied_availability: [{start: "2027-03-25T09:00:00+01:00", end: "2027-03-25T17:00:00+01:00"}]}
        - {id: int_zofia, name: Zofia Wrobel, time_zone: Europe/Warsaw, availability_source: supplied, working_hours: {start: "09:00", end: "17:00"},
           supplied_availability: [{start: "2027-03-29T09:00:00+02:00", end: "2027-03-29T17:00:00+02:00"}]}
        - {id: int_tomasz, name: Tomasz Kaczmarek, time_zone: Europe/Warsaw, availability_source: supplied, working_hours: {start: "09:00", end: "17:00"},
           supplied_availability: [{start: "2027-03-29T09:00:00+02:00", end: "2027-03-29T17:00:00+02:00"}]}
      conversation:
        - role: recruiter
          text: >-
            Mathieu can do 8am-noon Eastern on Thu 3/25 and Mon 3/29. Use the same schedule both days - 8:00-9:30 and
            9:45-11:15 our time. Warsaw folks all work 9-5 their time.
    expected:
      disposition: report_infeasible
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Day 1 (March 25) works, e.g. 8:00-9:30 and 9:45-11:15 a.m. EDT = 1:00-2:30 and 2:45-4:15 p.m. CET. Day 2 cannot
        fit both sessions with a 15-minute break: after March 28, 8:00 a.m.-12:00 p.m. EDT overlaps Warsaw's day only
        from 8:00 to 11:00 a.m. EDT (2:00-5:00 p.m. CEST), 180 minutes for 195 needed. Copying day 1's times would end
        S4 at 5:15 p.m. CEST.
      must:
        - State that the full two-day plan cannot be scheduled as specified and explain the March 28 European clock change.
        - Give the valid day 1 schedule with both EDT and CET times.
        - Show that day 2's usable window is 8:00-11:00 a.m. EDT (2:00-5:00 p.m. CEST), 15 minutes short.
        - Offer recruiter-owned options with exact asks, such as asking Tomasz to finish at 5:15 p.m. CEST on March 29, asking the candidate about a 7:45 a.m. EDT start, or moving S4 to another day if the plan allows.
        - Not propose shortening the 15-minute break, since the plan forbids it.
      must_not:
        - Propose day 2 at 8:00-9:30 and 9:45-11:15 a.m. EDT as valid.
        - Contact interviewers or the candidate, or book anything.
        - Treat Warsaw as 5 hours ahead of Toronto on March 29.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-25T12:00:00Z", time_zone: America/Toronto, expected_local: "2027-03-25T08:00", expected_weekday: Thursday, expected_utc_offset: "-04:00"}
      - {instant: "2027-03-25T12:00:00Z", time_zone: Europe/Warsaw, expected_local: "2027-03-25T13:00", expected_utc_offset: "+01:00"}
      - {instant: "2027-03-29T15:00:00Z", time_zone: Europe/Warsaw, expected_local: "2027-03-29T17:00", expected_weekday: Monday, expected_utc_offset: "+02:00"}
      - {instant: "2027-03-29T15:00:00Z", time_zone: America/Toronto, expected_local: "2027-03-29T11:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-25T00:00:00-04:00", end: "2027-03-30T00:00:00-04:00"}
      participants:
        candidate:
          time_zone: America/Toronto
          available: [["2027-03-25T08:00:00-04:00", "2027-03-25T12:00:00-04:00"], ["2027-03-29T08:00:00-04:00", "2027-03-29T12:00:00-04:00"]]
        int_agnieszka: {time_zone: Europe/Warsaw, available: [["2027-03-25T09:00:00+01:00", "2027-03-25T17:00:00+01:00"]]}
        int_piotr: {time_zone: Europe/Warsaw, available: [["2027-03-25T09:00:00+01:00", "2027-03-25T17:00:00+01:00"]]}
        int_zofia: {time_zone: Europe/Warsaw, available: [["2027-03-29T09:00:00+02:00", "2027-03-29T17:00:00+02:00"]]}
        int_tomasz: {time_zone: Europe/Warsaw, available: [["2027-03-29T09:00:00+02:00", "2027-03-29T17:00:00+02:00"]]}
      sessions:
        - {id: S1, duration_min: 90, attendees: [candidate, int_agnieszka]}
        - {id: S2, duration_min: 90, attendees: [candidate, int_piotr]}
        - {id: S3, duration_min: 90, attendees: [candidate, int_zofia]}
        - {id: S4, duration_min: 90, attendees: [candidate, int_tomasz]}
      constraints:
        order: [S1, S2, S3, S4]
        min_gap_min: 15
      expect_feasible: false
      invalid_examples:
        - {S1: "2027-03-25T08:00:00-04:00", S2: "2027-03-25T09:45:00-04:00", S3: "2027-03-29T08:00:00-04:00", S4: "2027-03-29T09:45:00-04:00", note: "S4 ends 5:15 p.m. CEST."}
        - {S1: "2027-03-25T08:00:00-04:00", S2: "2027-03-25T09:45:00-04:00", S3: "2027-03-29T08:00:00-04:00", S4: "2027-03-29T09:35:00-04:00", note: Break shortened to 5 minutes.}

  - id: TZ-016
    title: One interviewer's rota is fixed in UTC, the other's in UK local time - they diverge on Mar 30
    category: cross_timezone
    subcategory: utc_vs_local_recurrence
    description: >-
      Priya's interview rota is "Tuesdays 14:00-16:00 UTC" (set in a global tool); Callum's is "Tuesdays 2-4 pm UK
      time". They coincide while the UK is on GMT (March 23, 2027) but on March 30 (BST) Callum's window is
      13:00-15:00 UTC. For a 60-minute panel with a New York candidate free 9:30-11:30 a.m. EDT, the only start is
      10:00 a.m. EDT. Treating both rotas the same would allow 10:30 a.m., which runs past Callum's window.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel, virtual_1on1]
    tags: [utc_defined_availability, recurring_window, london, bst, panel]
    requirement_refs: [AVL-12, AVL-13, AVL-10, SCH-01]
    inputs:
      now: "2027-03-24T09:00:00-04:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Yasmin Farouk
        time_zone: America/New_York
        availability:
          - {start: "2027-03-30T09:30:00-04:00", end: "2027-03-30T11:30:00-04:00"}
      interview_plan:
        name: Security Engineer - two-person panel
        sessions:
          - {id: P1, title: Threat modeling panel, format: virtual, duration_min: 60, interviewers: [int_priya, int_callum], all_required: true}
      interviewers:
        - id: int_priya
          name: Priya Raman
          time_zone: Europe/London
          availability_source: supplied
          supplied_availability_rule: Every Tuesday 14:00-16:00 UTC (rota tool, defined in UTC)
          supplied_availability:
            - {start: "2027-03-30T14:00:00Z", end: "2027-03-30T16:00:00Z"}
        - id: int_callum
          name: Callum Fraser
          time_zone: Europe/London
          availability_source: supplied
          supplied_availability_rule: Every Tuesday 2-4 pm UK local time
          supplied_availability:
            - {start: "2027-03-30T14:00:00+01:00", end: "2027-03-30T16:00:00+01:00"}
      conversation:
        - role: recruiter
          text: >-
            Both London interviewers do Tuesdays 2-4 their side - same as last week when it was 10-12 for us. Yasmin is
            free 9:30-11:30 on Tue 3/30. Pick something for the panel.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, March 30, 2027: only 10:00-11:00 a.m. EDT = 3:00-4:00 p.m. BST (14:00-15:00 UTC). Priya's UTC rota is
        3:00-5:00 p.m. BST that day; Callum's local rota is 2:00-4:00 p.m. BST (9:00-11:00 a.m. EDT).
      must:
        - Distinguish Priya's UTC-defined window (14:00-16:00 UTC = 3:00-5:00 p.m. BST) from Callum's UK-local window (2:00-4:00 p.m. BST = 13:00-15:00 UTC).
        - Propose only 10:00-11:00 a.m. EDT (3:00-4:00 p.m. BST).
        - Correct the recruiter's assumption that both windows are still 10-12 New York time.
        - Ask whether to book.
      must_not:
        - Propose 10:30 a.m. EDT or later (ends after Callum's 4:00 p.m. BST end).
        - Propose 9:30 a.m. EDT (before Priya's window).
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-23T14:00:00Z", time_zone: Europe/London, expected_local: "2027-03-23T14:00", expected_utc_offset: "+00:00"}
      - {instant: "2027-03-30T14:00:00Z", time_zone: Europe/London, expected_local: "2027-03-30T15:00", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2027-03-30T14:00:00Z", time_zone: America/New_York, expected_local: "2027-03-30T10:00", expected_utc_offset: "-04:00"}
      - {instant: "2027-03-30T13:00:00Z", time_zone: America/New_York, expected_local: "2027-03-30T09:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-30T00:00:00Z", end: "2027-03-31T00:00:00Z"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2027-03-30T09:30:00-04:00", "2027-03-30T11:30:00-04:00"]]}
        int_priya: {time_zone: Europe/London, available: [["2027-03-30T14:00:00Z", "2027-03-30T16:00:00Z"]]}
        int_callum: {time_zone: Europe/London, available: [["2027-03-30T14:00:00+01:00", "2027-03-30T16:00:00+01:00"]]}
      sessions:
        - {id: P1, duration_min: 60, attendees: [candidate, int_priya, int_callum]}
      expect_feasible: true
      valid_examples:
        - {P1: "2027-03-30T10:00:00-04:00"}
      invalid_examples:
        - {P1: "2027-03-30T10:30:00-04:00", note: "Ends 4:30 p.m. BST, after Callum's window."}
        - {P1: "2027-03-30T09:30:00-04:00", note: "Starts before Priya's 14:00 UTC rota."}
      valid_start_bounds:
        P1: {earliest: "2027-03-30T10:00:00-04:00", latest: "2027-03-30T10:00:00-04:00"}

  - id: TZ-017
    title: Rescheduling to "the same time next Thursday" across the US clock change with a London interviewer
    category: cross_timezone
    subcategory: reschedule_across_dst
    description: >-
      A Seattle candidate's interview is booked for Thursday, March 11, 2027 at 8:00 a.m. PST (4:00 p.m. GMT). She asks to
      move it to "the same time next Thursday". On March 18 8:00 a.m. PDT is 3:00 p.m. GMT, when the London interviewer
      is busy until 3:45 p.m. The agent must not assume "same time" keeps the same UTC instant or the same London time,
      must find the valid 8:45-9:00 a.m. PDT starts, and must not modify the existing booking without confirmation.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [reschedule, us_dst_change, london, same_time_ambiguity, existing_booking]
    requirement_refs: [AVL-10, CHG-02, ACT-01, EC-019]
    inputs:
      now: "2027-03-09T10:00:00-08:00"
      recruiter: {id: rec_dana, name: Dana Whitfield, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Hana Yoshida-Clarke
        time_zone: America/Los_Angeles
        availability:
          - {start: "2027-03-18T08:00:00-07:00", end: "2027-03-18T10:00:00-07:00"}
      interview_plan:
        name: UX Researcher - research methods interview
        sessions:
          - {id: S1, title: Research methods interview, format: virtual, duration_min: 60, interviewers: [int_fiona]}
      interviewers:
        - id: int_fiona
          name: Fiona MacLeod
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar:
            - {start: "2027-03-18T15:00:00+00:00", end: "2027-03-18T15:45:00+00:00", status: busy}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_hana_s1, start: "2027-03-11T08:00:00-08:00", end: "2027-03-11T09:00:00-08:00", organizer: recruiting@contoso.example}
      conversation:
        - role: candidate
          channel: email
          text: Something came up Thursday - could we do the same time next Thursday instead? Mornings before 10 work.
        - role: recruiter
          text: Can you move Hana's interview with Fiona to the same time next Thursday?
    expected:
      disposition: propose_options
      solution_summary: >-
        "Same time" for Hana (8:00 a.m. PDT, March 18) is 3:00 p.m. GMT, when Fiona is busy. Valid 60-minute starts on
        Thursday, March 18, 2027 are 8:45-9:00 a.m. PDT (3:45-4:00 p.m. GMT); 9:00 a.m. PDT keeps Fiona's original 4:00 p.m.
        GMT. Ask before updating the existing event.
      must:
        - Explain that after March 14 Seattle is 7 hours behind London (not 8), so 8:00 a.m. PDT on March 18 is 3:00 p.m. GMT.
        - Propose starts only from 8:45 to 9:00 a.m. PDT on March 18, with GMT equivalents.
        - Note that 9:00 a.m. PDT is the same London time as the original booking (4:00 p.m. GMT).
        - Ask for confirmation before updating evt_hana_s1, and say the original stays in place until then.
      must_not:
        - Update, cancel, or re-send the existing event before confirmation.
        - Propose 8:00 a.m. PDT on March 18 (overlaps Fiona's busy block).
        - Create a second event instead of rescheduling the existing one.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-11T16:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-11T08:00", expected_weekday: Thursday, expected_utc_offset: "-08:00"}
      - {instant: "2027-03-18T15:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-18T08:00", expected_weekday: Thursday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-18T16:00:00Z", time_zone: Europe/London, expected_local: "2027-03-18T16:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-18T00:00:00-07:00", end: "2027-03-19T00:00:00-07:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2027-03-18T08:00:00-07:00", "2027-03-18T10:00:00-07:00"]]}
        int_fiona:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          busy: [["2027-03-18T15:00:00+00:00", "2027-03-18T15:45:00+00:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_fiona]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-03-18T09:00:00-07:00"}
      invalid_examples:
        - {S1: "2027-03-18T08:00:00-07:00", note: "3:00 p.m. GMT, during Fiona's busy block."}
        - {S1: "2027-03-18T09:30:00-07:00", note: "Ends 10:30 a.m. PDT, after the candidate's window."}
      valid_start_bounds:
        S1: {earliest: "2027-03-18T08:45:00-07:00", latest: "2027-03-18T09:00:00-07:00"}

  - id: TZ-018
    title: Israel starts DST on a Friday, before Europe and after the US, with a Sunday-Thursday workweek
    category: cross_timezone
    subcategory: israel_dst_and_workweek
    description: >-
      Israel moves to IDT (UTC+3) on Friday, March 26, 2027. A New York candidate offers 9-11 a.m. EDT on Thursday
      March 25, Friday March 26 and Sunday March 28. The Tel Aviv office works Sunday-Thursday (supplied policy). On
      Thursday Israel is 6 hours ahead (the recruiter assumes 7); on Sunday it is 7. With the interviewer's 4-5 p.m.
      Thursday meeting and 5 p.m. end, exactly two starts exist: 9:00 a.m. EDT Thursday and 9:00 a.m. EDT Sunday.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [israel_dst, sunday_thursday_workweek, workweek_policy, new_york, tel_aviv]
    requirement_refs: [AVL-10, AVL-03, SCH-01, EC-019, EC-026]
    inputs:
      now: "2027-03-18T10:00:00-04:00"
      recruiter: {id: rec_brooke, name: Brooke Lansing, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Elliot Brandt
        time_zone: America/New_York
        availability:
          - {start: "2027-03-25T09:00:00-04:00", end: "2027-03-25T11:00:00-04:00"}
          - {start: "2027-03-26T09:00:00-04:00", end: "2027-03-26T11:00:00-04:00"}
          - {start: "2027-03-28T09:00:00-04:00", end: "2027-03-28T11:00:00-04:00"}
      interview_plan:
        name: Computer Vision Engineer - coding interview
        sessions:
          - {id: S1, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_liora]}
      policies:
        workweeks:
          - {who: Tel Aviv office, days: [Sun, Mon, Tue, Wed, Thu], hours: "09:00-17:00 local", source: office policy supplied by HR}
      interviewers:
        - id: int_liora
          name: Liora Ben-David
          time_zone: Asia/Jerusalem
          availability_source: calendar
          working_hours: {days: [Sun, Mon, Tue, Wed, Thu], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-03-25T16:00:00+02:00", end: "2027-03-25T17:00:00+02:00", status: busy}
      conversation:
        - role: recruiter
          text: >-
            Israel is 7 hours ahead, so Thursday 9am for Elliot is 4pm for Liora and she's busy - Thursday's out, right?
            He also offered Friday and Sunday mornings. Which works?
    expected:
      disposition: propose_options
      solution_summary: >-
        Two options: Thursday, March 25, 2027, 9:00-10:00 a.m. EDT = 3:00-4:00 p.m. IST (UTC+2); or Sunday, March 28,
        9:00-10:00 a.m. EDT = 4:00-5:00 p.m. IDT (UTC+3). Friday is outside the Tel Aviv workweek.
      must:
        - Explain that Israel is 6 hours ahead of New York on March 25 and 7 hours ahead from March 26, 2027.
        - Offer Thursday 9:00 a.m. EDT (3:00 p.m. Israel) and Sunday 9:00 a.m. EDT (4:00 p.m. Israel) as the only starts.
        - Exclude Friday, March 26 because of the supplied Sunday-Thursday workweek, citing the policy input.
        - Ask whether to book one option.
      must_not:
        - Say Thursday is impossible.
        - Offer Friday, March 26 or Thursday at 9:30 a.m. EDT or later (overlaps Liora's meeting).
        - Offer Sunday after 9:00 a.m. EDT (runs past 5:00 p.m. IDT).
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-25T13:00:00Z", time_zone: Asia/Jerusalem, expected_local: "2027-03-25T15:00", expected_weekday: Thursday, expected_utc_offset: "+02:00"}
