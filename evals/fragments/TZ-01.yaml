  - id: TZ-023
    title: Hybrid panel in Dubai with a part-time London panelist - last week's 3:30 pm slot no longer fits
    category: cross_timezone
    subcategory: hybrid_dst_shift
    description: >-
      The candidate and a Dubai interviewer meet in person at the Dubai office; a London panelist joins via Teams and
      works only 9:00 a.m.-1:30 p.m. UK time. Dubai has no DST (UTC+4). When the previous candidate interviewed on
      Friday, March 19, 2027 London was on GMT and 3:30-5:00 p.m. Dubai fit. On Monday, March 29 London is on BST, so
      the panelist's day ends at 4:30 p.m. Dubai and only a 3:00 p.m. start works for the 90-minute panel.
