      - {instant: "2027-03-19T11:30:00Z", time_zone: Europe/London, expected_local: "2027-03-19T11:30", expected_utc_offset: "+00:00"}
      - {instant: "2027-03-29T11:00:00Z", time_zone: Asia/Dubai, expected_local: "2027-03-29T15:00", expected_weekday: Monday, expected_utc_offset: "+04:00"}
