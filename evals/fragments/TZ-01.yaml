# Cross-timezone cases, part 1: DST transitions, mismatch weeks, gaps and folds.
# All conversions computed with Python zoneinfo.
test_cases:
  - id: TZ-001
    title: US/EU mismatch week makes an 8 a.m. Pacific screen fit Berlin hours on Mar 16 but not Mar 30
    category: cross_timezone
    subcategory: dst_mismatch_window
    description: >-
      Los Angeles has moved to PDT on March 14, 2027 but Berlin stays on CET until March 28, so for two weeks
      the gap is 8 hours instead of 9. The candidate can only talk 8:00-9:00 a.m. Pacific before work. That
      fits the Berlin interviewer's 9-17 day on Tuesday, March 16 (4:00-5:00 p.m. CET) but not on Tuesday,
      March 30 (5:00-6:00 p.m. CEST). A fixed 9-hour assumption wrongly rejects March 16; a fixed 8-hour
      assumption wrongly accepts March 30.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [phone_screen, hiring_manager]
    tags: [dst_mismatch, los_angeles, berlin, fixed_offset_trap, working_hours_boundary]
    requirement_refs: [AVL-10, SCH-01, EC-019]
    inputs:
      now: "2027-03-08T10:00:00-08:00"
      recruiter: {id: rec_dana, name: Dana Whitfield, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marisol Duarte
        time_zone: America/Los_Angeles
        availability:
          - {start: "2027-03-16T08:00:00-07:00", end: "2027-03-16T09:00:00-07:00"}
          - {start: "2027-03-30T08:00:00-07:00", end: "2027-03-30T09:00:00-07:00"}
      interview_plan:
        name: Field Applications Engineer - hiring manager phone screen
        region: EMEA hiring team, US candidate
        sessions:
          - {id: S1, title: Hiring manager phone screen, format: phone, duration_min: 30, interviewers: [int_jonas]}
      interviewers:
        - id: int_jonas
          name: Jonas Becker
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar: []
      conversation:
        - role: recruiter
          text: >-
            Marisol can only do 8-9am our time (Pacific) on Tue 3/16 or Tue 3/30 before her shift. Jonas is in
            Berlin and won't take calls after 5pm his time. Berlin is 9 hours ahead so I doubt either works?
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, March 16, 2027 works: any 30-minute start from 8:00 to 8:30 a.m. PDT (4:00-4:30 p.m. CET).
        Tuesday, March 30 does not work because 8:00 a.m. PDT is 5:00 p.m. CEST, the end of Jonas's day.
      must:
        - Propose only March 16 starts from 8:00 to 8:30 a.m. PDT, shown as 4:00-4:30 p.m. CET for Jonas.
        - Explain that Berlin is 8 hours ahead of Los Angeles from March 14 to March 27, 2027, and 9 hours ahead again from March 28.
        - State that March 30 does not fit because 8:00-9:00 a.m. PDT is 5:00-6:00 p.m. CEST.
        - Correct the recruiter's fixed 9-hour assumption politely.
        - Ask whether to book the chosen March 16 option.
      must_not:
        - Say neither date works because of a fixed 9-hour difference.
        - Propose any March 30 time.
        - Book or send anything before explicit confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-16T15:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-16T08:00", expected_weekday: Tuesday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-16T15:00:00Z", time_zone: Europe/Berlin, expected_local: "2027-03-16T16:00", expected_utc_offset: "+01:00"}
      - {instant: "2027-03-30T15:00:00Z", time_zone: Europe/Berlin, expected_local: "2027-03-30T17:00", expected_weekday: Tuesday, expected_utc_offset: "+02:00"}
      - {instant: "2027-03-09T16:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-09T08:00", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-16T00:00:00-07:00", end: "2027-03-31T00:00:00-07:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          available: [["2027-03-16T08:00:00-07:00", "2027-03-16T09:00:00-07:00"], ["2027-03-30T08:00:00-07:00", "2027-03-30T09:00:00-07:00"]]
        int_jonas:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_jonas]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-03-16T08:00:00-07:00"}
        - {S1: "2027-03-16T08:30:00-07:00"}
      invalid_examples:
        - {S1: "2027-03-30T08:00:00-07:00", note: 5:00 p.m. CEST is outside Jonas's working hours.}
        - {S1: "2027-03-16T08:35:00-07:00", note: Ends 5:05 p.m. CET.}
      valid_start_bounds:
        S1: {earliest: "2027-03-16T08:00:00-07:00", latest: "2027-03-16T08:30:00-07:00"}

  - id: TZ-002
    title: Autumn 2027 mismatch week breaks the team's usual "4 pm London = 11 am Eastern" shortcut
    category: cross_timezone
    subcategory: dst_mismatch_window_autumn
    description: >-
      The UK returns to GMT on October 31, 2027 but New York stays on EDT until November 7, so on Tuesday,
      November 2, 2027 London is only 4 hours ahead. The recruiter asks for "our usual 4 pm London / 11 am
      Eastern slot", which is internally inconsistent that week. The agent must surface the contradiction,
      pick the interpretation that fits both people, and still ask before booking.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [dst_mismatch, autumn_transition, london, new_york, inconsistent_request]
    requirement_refs: [AVL-10, SCH-01, ACT-01, EC-019]
    inputs:
      now: "2027-10-27T10:00:00+01:00"
      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Devon Castellanos
        time_zone: America/New_York
        availability:
          - {start: "2027-11-02T10:30:00-04:00", end: "2027-11-02T12:00:00-04:00"}
      interview_plan:
        name: Credit Risk Associate - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 45, interviewers: [int_rupert]}
      interviewers:
        - id: int_rupert
          name: Rupert Achterberg
          time_zone: Europe/London
          availability_source: supplied
          supplied_availability:
            - {start: "2027-11-02T15:00:00+00:00", end: "2027-11-02T17:00:00+00:00"}
      conversation:
        - role: candidate
          channel: email
          text: Tuesday Nov 2 I'm free 10:30 to noon Eastern.
        - role: recruiter
          text: >-
            Rupert's free 3-5pm on Tue 2 Nov. Book our usual 4pm London / 11am Eastern slot for Devon please.
    expected:
      disposition: propose_options
      solution_summary: >-
        On Tuesday, November 2, 2027, 4:00 p.m. GMT is 12:00 p.m. EDT (outside Devon's window), while 11:00 a.m.
        EDT is 3:00 p.m. GMT. Valid 45-minute starts are 11:00-11:15 a.m. EDT (3:00-3:15 p.m. GMT).
      must:
        - Point out that 4 pm London and 11 am Eastern are different instants that week (London is 4 hours ahead until November 7, 2027).
        - Propose a start from 11:00 to 11:15 a.m. EDT, shown as 3:00-3:15 p.m. GMT.
        - Explain that 4:00-4:45 p.m. GMT is 12:00-12:45 p.m. EDT and runs past the candidate's noon limit.
        - Ask the recruiter to confirm the corrected time before booking.
      must_not:
        - Book 4:00 p.m. GMT or create any event before the recruiter confirms the corrected slot.
        - Describe London as 5 hours ahead of New York on November 2, 2027.
        - Silently pick one half of the inconsistent request without telling the recruiter.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-11-02T15:00:00Z", time_zone: America/New_York, expected_local: "2027-11-02T11:00", expected_weekday: Tuesday, expected_utc_offset: "-04:00"}
      - {instant: "2027-11-02T15:00:00Z", time_zone: Europe/London, expected_local: "2027-11-02T15:00", expected_utc_offset: "+00:00"}
      - {instant: "2027-11-02T16:00:00Z", time_zone: America/New_York, expected_local: "2027-11-02T12:00"}
      - {instant: "2027-11-09T16:00:00Z", time_zone: America/New_York, expected_local: "2027-11-09T11:00", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-11-02T00:00:00Z", end: "2027-11-03T00:00:00Z"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2027-11-02T10:30:00-04:00", "2027-11-02T12:00:00-04:00"]]}
        int_rupert: {time_zone: Europe/London, available: [["2027-11-02T15:00:00+00:00", "2027-11-02T17:00:00+00:00"]]}
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_rupert]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-11-02T11:00:00-04:00"}
      invalid_examples:
        - {S1: "2027-11-02T16:00:00+00:00", note: 4 pm GMT is noon EDT; the session ends after the candidate's window.}
        - {S1: "2027-11-02T10:30:00-04:00", note: 2:30 p.m. GMT is before Rupert's window.}
      valid_start_bounds:
        S1: {earliest: "2027-11-02T11:00:00-04:00", latest: "2027-11-02T11:15:00-04:00"}

  - id: TZ-003
    title: Three-zone panel (Kolkata, New York, London) fits on Mar 22 but not on the preferred Mar 29
    category: cross_timezone
    subcategory: three_zone_panel_dst_shift
    description: >-
      A 90-minute panel needs a Bengaluru candidate (no DST), a New York interviewer (EDT from Mar 14) and a
      London interviewer (BST from Mar 28). With the candidate's 8:30-10:30 p.m. IST window, the London
      interviewer's 5 p.m. end moves one hour earlier in UTC on March 28, shrinking the common window from
      2 hours to 1 hour. Only March 22 fits; March 29 needs a recruiter-owned ask.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [panel, virtual_loop]
    tags: [three_zone_panel, india, new_york, london, eu_dst_change, conditional_option]
    requirement_refs: [AVL-10, CON-11, SCH-01, SCH-05, CRD-01]
    inputs:
      now: "2027-03-15T09:00:00-04:00"
      recruiter: {id: rec_omar, name: Omar Haddad, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Aditi Kulkarni
        time_zone: Asia/Kolkata
        availability:
          - {start: "2027-03-22T20:30:00+05:30", end: "2027-03-22T22:30:00+05:30"}
          - {start: "2027-03-29T20:30:00+05:30", end: "2027-03-29T22:30:00+05:30"}
      interview_plan:
        name: Senior Data Scientist - panel
        sessions:
          - {id: P1, title: Modeling panel, format: virtual, duration_min: 90, interviewers: [int_marcus, int_eleanor], all_required: true}
      interviewers:
        - {id: int_marcus, name: Marcus Bell, time_zone: America/New_York, availability_source: calendar, working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}, calendar: []}
        - {id: int_eleanor, name: Eleanor Pryce, time_zone: Europe/London, availability_source: calendar, working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: >-
            Aditi can do 8:30-10:30pm IST on Mon 3/22 or Mon 3/29. Marcus and Eleanor both prefer the 29th. Can
            you set up the 90-min panel then?
    expected:
      disposition: propose_options
      secondary_dispositions: [conditional_handoff]
      solution_summary: >-
        Monday, March 22, 2027: start between 8:30 and 9:00 p.m. IST (11:00-11:30 a.m. EDT, 3:00-3:30 p.m. GMT).
        March 29 does not fit: after the UK change, Eleanor's 5:00 p.m. BST end is 9:30 p.m. IST, leaving only 60
        minutes. Conditional option for March 29: 8:30-10:00 p.m. IST (11:00 a.m.-12:30 p.m. EDT, 4:00-5:30 p.m. BST)
        only if Eleanor agrees to stay until 5:30 p.m. BST.
      must:
        - Propose March 22 starts only from 8:30 to 9:00 p.m. IST, with EDT and GMT equivalents.
        - Explain that March 29 fails because London moves to BST on March 28, so 5:00 p.m. London becomes 9:30 p.m. IST.
        - Present the March 29 option only as conditional on Eleanor agreeing to 4:00-5:30 p.m. BST, and tell the recruiter exactly what to ask her.
        - Ask whether to book the March 22 option.
      must_not:
        - Propose March 29 as a normal valid option.
        - Contact Eleanor or book anything.
        - Use a 5-hour London-Kolkata difference for March 29 (it is 4.5 hours).
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-22T15:00:00Z", time_zone: Asia/Kolkata, expected_local: "2027-03-22T20:30", expected_weekday: Monday, expected_utc_offset: "+05:30"}
      - {instant: "2027-03-22T15:00:00Z", time_zone: America/New_York, expected_local: "2027-03-22T11:00", expected_utc_offset: "-04:00"}
      - {instant: "2027-03-22T15:00:00Z", time_zone: Europe/London, expected_local: "2027-03-22T15:00", expected_utc_offset: "+00:00"}
      - {instant: "2027-03-29T16:00:00Z", time_zone: Europe/London, expected_local: "2027-03-29T17:00", expected_utc_offset: "+01:00"}
      - {instant: "2027-03-29T16:00:00Z", time_zone: Asia/Kolkata, expected_local: "2027-03-29T21:30"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-22T00:00:00Z", end: "2027-03-30T00:00:00Z"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2027-03-22T20:30:00+05:30", "2027-03-22T22:30:00+05:30"], ["2027-03-29T20:30:00+05:30", "2027-03-29T22:30:00+05:30"]]
        int_marcus:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
        int_eleanor:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
      sessions:
        - {id: P1, duration_min: 90, attendees: [candidate, int_marcus, int_eleanor]}
      expect_feasible: true
      valid_examples:
        - {P1: "2027-03-22T20:30:00+05:30"}
      invalid_examples:
        - {P1: "2027-03-29T20:30:00+05:30", note: "Ends 5:30 p.m. BST, after Eleanor's working hours."}
        - {P1: "2027-03-22T21:05:00+05:30", note: Ends after the candidate's 10:30 p.m. IST limit.}
      valid_start_bounds:
        P1: {earliest: "2027-03-22T20:30:00+05:30", latest: "2027-03-22T21:00:00+05:30"}

  - id: TZ-004
    title: Candidate proposes 2:30 a.m. Eastern on spring-forward night, a time that does not exist
    category: cross_timezone
    subcategory: nonexistent_local_time
    description: >-
      A night-shift NOC candidate in New York offers "2:30 to 3:30 am" on Sunday, March 14, 2027. Clocks jump from
      2:00 a.m. EST to 3:00 a.m. EDT, so 2:30 a.m. never occurs. The Manila interviewer works a Sunday shift. The
      agent must not silently move the time (Python-style normalization yields 3:30 a.m. EDT; a naive offset yields
      1:30 a.m. EST); it must explain and ask, offering unambiguous alternatives.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [phone_screen, technical_coding]
    tags: [spring_forward_gap, nonexistent_time, night_shift, manila, new_york]
    requirement_refs: [INT-05, EC-017, GS-008]
    inputs:
      now: "2027-03-10T13:00:00+08:00"
      recruiter: {id: rec_bea, name: Bea Villanueva, time_zone: Asia/Manila}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Terrence Okoye
        time_zone: America/New_York
        availability_raw: Sunday March 14, 2:30-3:30 a.m. ET (after night shift ends at 2)
      interview_plan:
        name: NOC Technician II - technical phone screen
        sessions:
          - {id: S1, title: Technical phone screen, format: phone, duration_min: 60, interviewers: [int_ramon]}
      interviewers:
        - id: int_ramon
          name: Ramon Dizon
          time_zone: Asia/Manila
          availability_source: supplied
          supplied_availability:
            - {start: "2027-03-14T13:00:00+08:00", end: "2027-03-14T18:00:00+08:00"}
      conversation:
        - role: candidate
          channel: email
          text: >-
            My night shift ends at 2 on Sunday the 14th, so I can do the phone screen 2:30 to 3:30 am my time (ET).
        - role: recruiter
          text: Ramon is on the Sunday day shift in Manila 1-6pm. Please set up Terrence's screen.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [nonexistent_local_time, intended_start_after_clock_change]
      solution_summary: >-
        2:30 a.m. on Sunday, March 14, 2027 does not exist in New York (2:00 a.m. EST jumps to 3:00 a.m. EDT). Ask the
        candidate which real time he means, e.g. 3:00-4:00 a.m. EDT (3:00-4:00 p.m. PHT Sunday) or 3:30-4:30 a.m. EDT
        (3:30-4:30 p.m. PHT). Both fit Ramon's 1:00-6:00 p.m. PHT window.
      must:
        - State that 2:30 a.m. ET on Sunday, March 14, 2027 does not exist because clocks spring forward from 2:00 a.m. EST to 3:00 a.m. EDT.
        - Note that a shift ending "at 2" means the clock already reads 3:00 a.m. EDT at that moment.
        - Offer unambiguous alternatives with offsets, such as 3:00-4:00 a.m. EDT (UTC-4) = 3:00-4:00 p.m. PHT Sunday.
        - Ask the recruiter to confirm the intended time with the candidate before anything is booked.
      must_not:
        - Silently schedule 3:30 a.m. EDT or 1:30 a.m. EST as if it were 2:30 a.m.
        - Claim that 2:30 a.m. ET exists on March 14, 2027.
        - Book or send any invitation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {local: "2027-03-14T02:30", time_zone: America/New_York, expect: nonexistent}
      - {local: "2027-03-14T03:30", time_zone: America/New_York, expect: valid}
      - {instant: "2027-03-14T07:00:00Z", time_zone: America/New_York, expected_local: "2027-03-14T03:00", expected_weekday: Sunday, expected_utc_offset: "-04:00"}
      - {instant: "2027-03-14T07:00:00Z", time_zone: Asia/Manila, expected_local: "2027-03-14T15:00", expected_utc_offset: "+08:00"}
      - {instant: "2027-03-14T06:30:00Z", time_zone: America/New_York, expected_local: "2027-03-14T01:30", expected_utc_offset: "-05:00"}
    grading_notes: Any answer that proposes a concrete booking time without the candidate's confirmation fails.

  - id: TZ-005
    title: Sydney candidate offers 2:30 a.m. on fall-back night, which happens twice
    category: cross_timezone
    subcategory: ambiguous_local_time_fold
    description: >-
      An airline operations-control candidate in Sydney finishes an overnight shift and offers a 30-minute call at
      "2:30 a.m. Sunday 4 April". Sydney falls back from 3:00 a.m. AEDT to 2:00 a.m. AEST that night, so 2:30 a.m.
      occurs twice, one hour apart. Both readings fit the Los Angeles interviewer's Saturday window, which makes the
      wrong silent choice tempting. The agent must ask which occurrence is meant.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [fall_back_fold, ambiguous_time, sydney, los_angeles, shift_worker]
    requirement_refs: [INT-05, EC-018]
    inputs:
      now: "2027-03-29T09:00:00-07:00"
      recruiter: {id: rec_lucia, name: Lucia Ferreira, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Callum Nguyen
        time_zone: Australia/Sydney
        availability_raw: Sunday 4 April, 2:30 a.m. Sydney time, 30 minutes
      interview_plan:
        name: Operations Controller - recruiter phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_gabriela]}
      interviewers:
        - id: int_gabriela
          name: Gabriela Montoya
          time_zone: America/Los_Angeles
          availability_source: supplied
          supplied_availability:
            - {start: "2027-04-03T08:00:00-07:00", end: "2027-04-03T11:00:00-07:00"}
      conversation:
        - role: candidate
          channel: email
          text: >-
            My night shift finishes at 2am Sunday 4 April, I could do a quick call at 2:30am Sydney time before I
            drive home.
        - role: recruiter
          text: Gabriela runs the Saturday ops shift 8-11am Pacific on April 3. Can you set this up?
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [which_occurrence_of_repeated_hour]
      solution_summary: >-
        2:30 a.m. on Sunday, April 4, 2027 occurs twice in Sydney. The first (AEDT, UTC+11) is 8:30 a.m. PDT Saturday,
        April 3; the second (AEST, UTC+10) is 9:30 a.m. PDT. Both fit Gabriela's window, so ask the candidate which one
        (or offer an unambiguous time such as 3:30 a.m. AEST = 10:30 a.m. PDT).
      must:
        - Explain that Sydney clocks go back from 3:00 a.m. AEDT to 2:00 a.m. AEST on April 4, 2027, so 2:30 a.m. happens twice.
        - Give both readings with offsets and the Los Angeles equivalent (8:30 a.m. PDT or 9:30 a.m. PDT on Saturday, April 3).
        - Note that "my shift finishes at 2am" is itself ambiguous that night.
        - Ask for the intended occurrence (or an explicit UTC offset) before proposing a final time.
      must_not:
        - Silently choose the first or second occurrence.
        - Book or send any invitation.
        - Describe the candidate's local date as Saturday.
      side_effects: {external_writes: none}
    local_time_checks:
      - {local: "2027-04-04T02:30", time_zone: Australia/Sydney, expect: ambiguous}
      - {local: "2027-04-04T03:30", time_zone: Australia/Sydney, expect: valid}
      - {instant: "2027-04-03T15:30:00Z", time_zone: Australia/Sydney, expected_local: "2027-04-04T02:30", expected_weekday: Sunday, expected_utc_offset: "+11:00"}
      - {instant: "2027-04-03T16:30:00Z", time_zone: Australia/Sydney, expected_local: "2027-04-04T02:30", expected_utc_offset: "+10:00"}
