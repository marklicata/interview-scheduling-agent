        - {S1: "2027-03-28T09:00:00-04:00"}
      invalid_examples:
        - {S1: "2027-03-26T09:00:00-04:00", note: Friday is outside the Tel Aviv workweek.}
        - {S1: "2027-03-25T09:30:00-04:00", note: "Overlaps Liora's 4:00 p.m. meeting."}
        - {S1: "2027-03-28T10:00:00-04:00", note: "Ends 6:00 p.m. IDT."}
