      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2027-03-09T19:00:00+05:30", "2027-03-09T21:00:00+05:30"], ["2027-03-16T19:00:00+05:30", "2027-03-16T21:00:00+05:30"]]
        int_brenda: {time_zone: America/Chicago, available: [["2027-03-09T08:00:00-06:00", "2027-03-09T09:30:00-06:00"]]}
        int_luis: {time_zone: America/Chicago, available: [["2027-03-16T08:00:00-05:00", "2027-03-16T09:30:00-05:00"]]}
