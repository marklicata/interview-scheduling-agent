        Thursday, March 25 cannot fit 90 minutes: Wanjiru's 4:00 p.m. EAT end is 2:00 p.m. CET. Tuesday, March 30, 2027:
        start 1:00-1:30 p.m. CEST (12:00-12:30 p.m. WAT Lagos, 2:00-2:30 p.m. EAT Nairobi, 1:00-1:30 p.m. SAST).
