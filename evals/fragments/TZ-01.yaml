             attendance: {int_khalid: in_person, int_imogen: teams, candidate: in_person}}
      policies:
        workweeks:
          - {who: Dubai office, days: [Mon, Tue, Wed, Thu, Fri], hours: "09:00-18:00 local", source: office policy supplied by HR}
      interviewers:
        - id: int_khalid
          name: Khalid Rahman
          time_zone: Asia/Dubai
          availability_source: supplied
          supplied_availability:
            - {start: "2027-03-29T15:00:00+04:00", end: "2027-03-29T18:00:00+04:00"}
        - id: int_imogen
          name: Imogen Clarke
          time_zone: Europe/London
