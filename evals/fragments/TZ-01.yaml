      recruiter: {id: rec_marta, name: Marta Wisniewska, time_zone: Europe/Warsaw}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Kacper Domanski
        time_zone: Europe/Warsaw
        availability:
          - {start: "2027-03-25T13:00:00+01:00", end: "2027-03-25T16:00:00+01:00"}
          - {start: "2027-03-30T13:00:00+02:00", end: "2027-03-30T16:00:00+02:00"}
      interview_plan:
        name: Payments Product Lead (Africa) - panel
        sessions:
          - {id: P1, title: Market panel, format: virtual, duration_min: 90, interviewers: [int_chidi, int_wanjiru, int_thandiwe], all_required: true}
      interviewers:
        - {id: int_chidi, name: Chidi Okafor, time_zone: Africa/Lagos, availability_source: calendar, working_hours: {start: "08:00", end: "17:00"}, calendar: []}
        - {id: int_wanjiru, name: Wanjiru Kamau, time_zone: Africa/Nairobi, availability_source: calendar, working_hours: {start: "08:00", end: "16:00"}, calendar: []}
        - {id: int_thandiwe, name: Thandiwe Mokoena, time_zone: Africa/Johannesburg, availability_source: calendar, working_hours: {start: "08:00", end: "17:00"}, calendar: []}
      conversation:
        - role: recruiter
          text: >-
            Kacper is free 1-4pm Warsaw on Thu 25 Mar or Tue 30 Mar. Thursday at 1pm Warsaw please; if not, Tuesday same
            time - Lagos is on the same clock as Warsaw anyway.
    expected:
      disposition: propose_options
