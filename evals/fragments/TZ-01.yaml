      - {instant: "2027-03-30T11:00:00Z", time_zone: Africa/Lagos, expected_local: "2027-03-30T12:00", expected_utc_offset: "+01:00"}
      - {instant: "2027-03-30T11:00:00Z", time_zone: Africa/Johannesburg, expected_local: "2027-03-30T13:00"}
      - {instant: "2027-03-30T11:00:00Z", time_zone: Africa/Nairobi, expected_local: "2027-03-30T14:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-25T00:00:00Z", end: "2027-03-31T00:00:00Z"}
      participants:
        candidate:
          time_zone: Europe/Warsaw
          available: [["2027-03-25T13:00:00+01:00", "2027-03-25T16:00:00+01:00"], ["2027-03-30T13:00:00+02:00", "2027-03-30T16:00:00+02:00"]]
        int_chidi: {time_zone: Africa/Lagos, working_hours: {time_zone: Africa/Lagos, start: "08:00", end: "17:00"}}
        int_wanjiru: {time_zone: Africa/Nairobi, working_hours: {time_zone: Africa/Nairobi, start: "08:00", end: "16:00"}}
        int_thandiwe: {time_zone: Africa/Johannesburg, working_hours: {time_zone: Africa/Johannesburg, start: "08:00", end: "17:00"}}
