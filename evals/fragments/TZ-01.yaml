  - id: TZ-022
    title: Explicit UTC offset resolves a repeated 2:15 a.m. in Auckland - no clarification needed
    category: cross_timezone
    subcategory: fold_resolved_by_offset
    description: >-
      A security-operations candidate in Auckland offers "Sun 4 Apr, 2:15-3:15 am NZST (UTC+12), after the clocks go
      back". 2:15 a.m. occurs twice that night, but the stated UTC+12 offset picks the second occurrence (14:15 UTC on
      Saturday, April 3). The London interviewer works a Saturday shift. The agent should use the offset, not ask a
      redundant question, and still show both local dates.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [fall_back_fold, explicit_offset, auckland, london, avoid_overclarification, weekend_shift]
    requirement_refs: [INT-05, EC-018, EC-016]
    inputs:
      now: "2027-03-29T10:00:00+01:00"
      recruiter: {id: rec_harriet, name: Harriet Osei, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mere Paewai
        time_zone: Pacific/Auckland
        availability:
          - {start: "2027-04-04T02:15:00+12:00", end: "2027-04-04T03:15:00+12:00"}
      interview_plan:
        name: SOC Analyst (24x7) - shift lead interview
        sessions:
          - {id: S1, title: Shift lead interview, format: virtual, duration_min: 45, interviewers: [int_dominic]}
      interviewers:
        - id: int_dominic
          name: Dominic Asante
          time_zone: Europe/London
          availability_source: supplied
          supplied_availability:
            - {start: "2027-04-03T14:00:00+01:00", end: "2027-04-03T17:00:00+01:00"}
      conversation:
        - role: candidate
          channel: email
          text: >-
            I'm on nights, so Sunday 4 April 2:15-3:15am NZST (UTC+12) - i.e. after the clocks go back - is ideal.
        - role: recruiter
          text: Dominic is on the Saturday 3 April day shift, 2-5pm UK. Can you find a slot?
    expected:
      disposition: propose_options
      solution_summary: >-
        Start between 2:15 and 2:30 a.m. NZST (UTC+12) on Sunday, April 4, 2027 = 3:15-3:30 p.m. BST on Saturday, April 3.
      must:
        - Use the stated UTC+12 offset to resolve the repeated hour, without asking which 2:15 a.m. is meant.
        - Propose starts from 2:15 to 2:30 a.m. NZST Sunday = 3:15-3:30 p.m. BST Saturday, showing both dates.
        - Ask whether to book.
      must_not:
        - Use the first occurrence (2:15 a.m. NZDT, UTC+13 = 2:15 p.m. BST).
        - Ask an unnecessary clarification about the repeated hour.
        - Book before confirmation.
      side_effects: {external_writes: none}
