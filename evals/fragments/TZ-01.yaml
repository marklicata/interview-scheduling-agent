    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-11T00:00:00-05:00", end: "2027-03-17T00:00:00-04:00"}
      participants:
        candidate:
          time_zone: America/Sao_Paulo
          available: [["2027-03-11T13:00:00-03:00", "2027-03-11T15:00:00-03:00"], ["2027-03-16T13:00:00-03:00", "2027-03-16T15:00:00-03:00"]]
        int_gordon: {time_zone: America/New_York, available: [["2027-03-11T10:00:00-05:00", "2027-03-11T13:00:00-05:00"]]}
        int_paloma: {time_zone: America/New_York, available: [["2027-03-16T10:00:00-04:00", "2027-03-16T13:00:00-04:00"]]}
      sessions:
