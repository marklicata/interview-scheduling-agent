      invalid_examples:
        - {S1: "2027-03-11T11:00:00-05:00", S2: "2027-03-16T11:00:00-04:00", note: "S2 at noon BRT is before the candidate's window."}
      valid_start_bounds:
        S1: {earliest: "2027-03-11T11:00:00-05:00", latest: "2027-03-11T12:00:00-05:00"}
        S2: {earliest: "2027-03-16T12:00:00-04:00", latest: "2027-03-16T12:00:00-04:00"}

  - id: TZ-012
    title: Santiago candidate sees three different New York offsets in one month
    category: cross_timezone
    subcategory: southern_dst_end_americas
    description: >-
      Santiago is UTC-3 until April 4, 2027 and UTC-4 afterwards; New York is UTC-5 until March 14 and UTC-4 after.
      So Santiago-New York is 2 hours on March 10, 1 hour on March 17 and 0 hours on April 7. The recruiter wants a
      fixed "10 a.m. Santiago every Wednesday", which is 8:00 a.m. EST on March 10 - before the interviewer's day. The
      only Santiago time that works all three Wednesdays is 11:00 a.m., and its New York time differs each week.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [executive, virtual_loop]
    tags: [chile_dst, santiago, new_york, recurring_slot, three_offsets]
    requirement_refs: [AVL-10, SCH-01, EC-019]
    inputs:
      now: "2027-03-02T10:00:00-05:00"
      recruiter: {id: rec_simone, name: Simone Achebe, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ignacio Fuentealba
        time_zone: America/Santiago
        availability:
          - {start: "2027-03-10T09:00:00-03:00", end: "2027-03-10T12:00:00-03:00"}
          - {start: "2027-03-17T09:00:00-03:00", end: "2027-03-17T12:00:00-03:00"}
          - {start: "2027-04-07T09:00:00-04:00", end: "2027-04-07T12:00:00-04:00"}
      interview_plan:
        name: VP Finance, Southern Cone - executive series
        sessions:
          - {id: S1, title: CFO conversation, format: virtual, duration_min: 60, interviewers: [int_cfo], order: 1}
          - {id: S2, title: Controller conversation, format: virtual, duration_min: 60, interviewers: [int_ctrl], order: 2}
          - {id: S3, title: CEO conversation, format: virtual, duration_min: 60, interviewers: [int_ceo], order: 3}
      interviewers:
        - {id: int_cfo, name: Harold Vance, time_zone: America/New_York, availability_source: supplied, working_hours: {start: "09:00", end: "17:00"},
           supplied_availability: [{start: "2027-03-10T09:00:00-05:00", end: "2027-03-10T17:00:00-05:00"}]}
        - {id: int_ctrl, name: Mei Tanaka-Ross, time_zone: America/New_York, availability_source: supplied, working_hours: {start: "09:00", end: "17:00"},
           supplied_availability: [{start: "2027-03-17T09:00:00-04:00", end: "2027-03-17T17:00:00-04:00"}]}
        - {id: int_ceo, name: Patrice Lamarre, time_zone: America/New_York, availability_source: supplied, working_hours: {start: "09:00", end: "17:00"},
           supplied_availability: [{start: "2027-04-07T09:00:00-04:00", end: "2027-04-07T17:00:00-04:00"}]}
      conversation:
        - role: recruiter
          text: >-
            Ignacio is free 9-12 Santiago time on Wed 3/10, Wed 3/17 and Wed 4/7 for the CFO, Controller and CEO
            conversations. Let's lock 10am Santiago every week so it's easy for him to remember.
    expected:
      disposition: propose_options
      solution_summary: >-
        10:00 a.m. Santiago fails on March 10 (8:00 a.m. EST). 11:00 a.m. Santiago works every week: March 10 = 9:00 a.m.
        EST, March 17 = 10:00 a.m. EDT, April 7 = 11:00 a.m. EDT.
      must:
        - Explain that 10:00 a.m. Santiago on March 10 is 8:00 a.m. EST, before Harold's 9:00 a.m. start.
        - Propose 11:00 a.m. Santiago for all three as the consistent candidate-side time, with New York times 9:00 a.m. EST, 10:00 a.m. EDT and 11:00 a.m. EDT respectively.
        - Explain the three offsets (US change March 14; Chile change April 4, 2027).
        - Ask whether to book all three.
      must_not:
        - Present one fixed New York time for all three Wednesdays.
        - Propose 10:00 a.m. Santiago on March 10.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-10T14:00:00Z", time_zone: America/Santiago, expected_local: "2027-03-10T11:00", expected_weekday: Wednesday, expected_utc_offset: "-03:00"}
      - {instant: "2027-03-10T14:00:00Z", time_zone: America/New_York, expected_local: "2027-03-10T09:00", expected_utc_offset: "-05:00"}
      - {instant: "2027-03-17T14:00:00Z", time_zone: America/New_York, expected_local: "2027-03-17T10:00", expected_utc_offset: "-04:00"}
      - {instant: "2027-04-07T15:00:00Z", time_zone: America/Santiago, expected_local: "2027-04-07T11:00", expected_weekday: Wednesday, expected_utc_offset: "-04:00"}
      - {instant: "2027-04-07T15:00:00Z", time_zone: America/New_York, expected_local: "2027-04-07T11:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-10T00:00:00-03:00", end: "2027-04-08T00:00:00-04:00"}
      participants:
        candidate:
          time_zone: America/Santiago
          available: [["2027-03-10T09:00:00-03:00", "2027-03-10T12:00:00-03:00"], ["2027-03-17T09:00:00-03:00", "2027-03-17T12:00:00-03:00"], ["2027-04-07T09:00:00-04:00", "2027-04-07T12:00:00-04:00"]]
        int_cfo: {time_zone: America/New_York, available: [["2027-03-10T09:00:00-05:00", "2027-03-10T17:00:00-05:00"]]}
        int_ctrl: {time_zone: America/New_York, available: [["2027-03-17T09:00:00-04:00", "2027-03-17T17:00:00-04:00"]]}
        int_ceo: {time_zone: America/New_York, available: [["2027-04-07T09:00:00-04:00", "2027-04-07T17:00:00-04:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_cfo]}
        - {id: S2, duration_min: 60, attendees: [candidate, int_ctrl]}
        - {id: S3, duration_min: 60, attendees: [candidate, int_ceo]}
      constraints:
        order: [S1, S2, S3]
      expect_feasible: true
      valid_examples:
        - {S1: "2027-03-10T11:00:00-03:00", S2: "2027-03-17T11:00:00-03:00", S3: "2027-04-07T11:00:00-04:00"}
      invalid_examples:
        - {S1: "2027-03-10T10:00:00-03:00", S2: "2027-03-17T10:00:00-03:00", S3: "2027-04-07T10:00:00-04:00", note: "S1 is 8:00 a.m. EST, before Harold's availability."}
      valid_start_bounds:
        S1: {earliest: "2027-03-10T11:00:00-03:00", latest: "2027-03-10T11:00:00-03:00"}
        S2: {earliest: "2027-03-17T10:00:00-03:00", latest: "2027-03-17T11:00:00-03:00"}
        S3: {earliest: "2027-04-07T09:00:00-04:00", latest: "2027-04-07T11:00:00-04:00"}

  - id: TZ-013
    title: Cairo and Berlin share a clock until Egypt starts DST on Apr 30, then diverge again
    category: cross_timezone
    subcategory: egypt_dst_start
    description: >-
      From March 28 to April 29, 2027 Cairo (UTC+2) and Berlin (CEST, UTC+2) match. Egypt starts DST at midnight
      between Thursday, April 29 and Friday, April 30, so on May 3 Cairo is one hour ahead. The recruiter proposes
      "3-4 pm Berlin either Thursday or Monday - same clock as Cairo". Thursday works at 3:00 p.m. on both clocks; on
      Monday 3:00 p.m. Berlin is 4:00 p.m. Cairo, outside the candidate's window. Sunday is offered by the candidate
      but is outside the Berlin interviewer's Monday-Friday week.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1, technical_coding]
    tags: [egypt_dst, cairo, berlin, workweek_policy, same_clock_assumption]
    requirement_refs: [AVL-10, AVL-03, SCH-01, EC-019, EC-026]
    inputs:
      now: "2027-04-20T10:00:00+02:00"
      recruiter: {id: rec_katrin, name: Katrin Vogel, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Youssef Abdelrahman
        time_zone: Africa/Cairo
        availability:
          - {start: "2027-04-29T14:00:00+02:00", end: "2027-04-29T16:00:00+02:00"}
          - {start: "2027-05-02T14:00:00+03:00", end: "2027-05-02T16:00:00+03:00"}
          - {start: "2027-05-03T14:00:00+03:00", end: "2027-05-03T16:00:00+03:00"}
      interview_plan:
        name: Embedded Software Engineer - coding interview
        sessions:
          - {id: S1, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_lukas]}
      policies:
        workweeks:
          - {who: int_lukas, days: [Mon, Tue, Wed, Thu, Fri], source: Berlin office policy}
          - {who: candidate, days: [Sun, Mon, Tue, Wed, Thu], source: candidate's employer, informational only}
      interviewers:
        - id: int_lukas
          name: Lukas Hartmann
          time_zone: Europe/Berlin
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-04-29T14:00:00+02:00", end: "2027-04-29T15:00:00+02:00", status: busy}
            - {start: "2027-05-03T13:00:00+02:00", end: "2027-05-03T14:00:00+02:00", status: busy}
      conversation:
        - role: candidate
          channel: email
          text: I can do 2-4 pm Cairo time on Thursday 29 April, Sunday 2 May or Monday 3 May.
        - role: recruiter
          text: Let's offer 3-4pm Berlin time either Thursday or Monday - same clock as Cairo now anyway.
    expected:
      disposition: propose_options
      solution_summary: >-
        Thursday, April 29, 2027: 3:00-4:00 p.m. in both Berlin and Cairo. Monday, May 3: only 2:00-3:00 p.m. CEST =
        3:00-4:00 p.m. Cairo (EEST). Sunday, May 2 is outside Lukas's workweek.
      must:
        - Offer Thursday, April 29 at 3:00 p.m. (same clock in Berlin and Cairo that day).
        - Offer Monday, May 3 only at 2:00 p.m. CEST = 3:00 p.m. Cairo time, explaining that Egypt moves to UTC+3 on April 30, 2027.
        - Exclude Sunday, May 2 because Lukas works Monday-Friday per the supplied policy.
        - Ask whether to book one of the options.
      must_not:
        - Offer 3:00 p.m. Berlin on May 3 (4:00 p.m. Cairo, outside the candidate's window).
        - Claim Cairo and Berlin still share a clock on May 3.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-04-29T13:00:00Z", time_zone: Africa/Cairo, expected_local: "2027-04-29T15:00", expected_weekday: Thursday, expected_utc_offset: "+02:00"}
      - {instant: "2027-04-29T13:00:00Z", time_zone: Europe/Berlin, expected_local: "2027-04-29T15:00", expected_utc_offset: "+02:00"}
      - {instant: "2027-05-03T12:00:00Z", time_zone: Africa/Cairo, expected_local: "2027-05-03T15:00", expected_weekday: Monday, expected_utc_offset: "+03:00"}
      - {instant: "2027-05-03T12:00:00Z", time_zone: Europe/Berlin, expected_local: "2027-05-03T14:00"}
      - {local: "2027-04-30T00:30", time_zone: Africa/Cairo, expect: nonexistent}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-04-29T00:00:00+02:00", end: "2027-05-04T00:00:00+02:00"}
      participants:
        candidate:
          time_zone: Africa/Cairo
          available: [["2027-04-29T14:00:00+02:00", "2027-04-29T16:00:00+02:00"], ["2027-05-02T14:00:00+03:00", "2027-05-02T16:00:00+03:00"], ["2027-05-03T14:00:00+03:00", "2027-05-03T16:00:00+03:00"]]
        int_lukas:
          time_zone: Europe/Berlin
          working_hours: {time_zone: Europe/Berlin, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2027-04-29T14:00:00+02:00", "2027-04-29T15:00:00+02:00"], ["2027-05-03T13:00:00+02:00", "2027-05-03T14:00:00+02:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_lukas]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-04-29T15:00:00+02:00"}
        - {S1: "2027-05-03T14:00:00+02:00"}
      invalid_examples:
        - {S1: "2027-05-03T15:00:00+02:00", note: "4:00 p.m. Cairo, after the candidate's window."}
        - {S1: "2027-05-02T14:00:00+03:00", note: Sunday is outside Lukas's workweek.}
      valid_start_bounds:
        S1: {earliest: "2027-04-29T15:00:00+02:00", latest: "2027-05-03T14:00:00+02:00"}

  - id: TZ-014
    title: Lord Howe Island's 30-minute DST change makes it half an hour ahead of Sydney from Apr 4
    category: cross_timezone
    subcategory: half_hour_dst
    description: >-
      Lord Howe Island shifts only 30 minutes for DST (UTC+11 in summer, UTC+10:30 in winter). Until April 4, 2027 it
      shares Sydney's clock; afterwards it is 30 minutes ahead. A remote ranger candidate on the island is free
      9:00-10:00 a.m. island time on Tuesday, April 6; the Sydney interviewer starts at 9:00 a.m. Only one 30-minute
      start works: 9:00 a.m. AEST = 9:30 a.m. Lord Howe time.
    difficulty: advanced
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [lord_howe, half_hour_dst, sydney, exact_boundary, same_clock_assumption]
    requirement_refs: [AVL-10, SCH-01, EC-020]
    inputs:
      now: "2027-03-31T10:00:00+11:00"
      recruiter: {id: rec_mia, name: Mia Kowalczyk, time_zone: Australia/Sydney}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Brodie Kerrigan
        time_zone: Australia/Lord_Howe
        availability:
          - {start: "2027-04-06T09:00:00+10:30", end: "2027-04-06T10:00:00+10:30"}
      interview_plan:
        name: Marine Park Ranger - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_tamsin]}
      interviewers:
        - id: int_tamsin
          name: Tamsin Arbuckle
          time_zone: Australia/Sydney
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar: []
      conversation:
        - role: candidate
          channel: email
          text: Tuesday 6 April I'm free 9 to 10 in the morning, island time.
        - role: recruiter
          text: Lord Howe is on Sydney time, right? Last week's call was 9am for both of them. Book something 9-10 with Tamsin.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, April 6, 2027: only 9:00-9:30 a.m. AEST (Sydney) = 9:30-10:00 a.m. Lord Howe time (UTC+10:30).
      must:
        - Explain that Lord Howe Island's DST shift is 30 minutes, so after April 4, 2027 it is 30 minutes ahead of Sydney.
        - Propose only 9:00 a.m. AEST = 9:30 a.m. Lord Howe time.
        - Show the candidate's time with its UTC+10:30 offset.
        - Ask whether to book.
      must_not:
        - Propose 9:30 a.m. AEST (10:00 a.m. on Lord Howe, after the candidate's window).
        - Propose 9:00 a.m. Lord Howe time (8:30 a.m. AEST, before Tamsin's day).
        - Claim the island is on Sydney time in April or shifts a full hour.
      side_effects: {external_writes: none}
    local_time_checks:
