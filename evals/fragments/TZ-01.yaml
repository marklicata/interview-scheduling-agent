  - id: TZ-006
    title: Active booking grant does not license guessing which 1:30 a.m. on US fall-back night
    category: cross_timezone
    subcategory: ambiguous_local_time_with_grant
    description: >-
      A configuration grant lets the agent book overnight-support interviews without asking. The New York candidate
      picks "Sunday Nov 7, 1:30 a.m. ET" - the night US clocks fall back, so 1:30 a.m. happens at both EDT and EST.
      Both instants are inside the Kolkata interviewer's window. Authority to book is not authority to resolve an
      ambiguous instant; the agent must ask instead of booking.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [fall_back_fold, ambiguous_time, autonomous_grant, overnight_role, kolkata]
    requirement_refs: [INT-05, EC-018, ACT-02, CFG-03]
    inputs:
      now: "2027-10-28T10:00:00+05:30"
      recruiter: {id: rec_nisha, name: Nisha Arora, time_zone: Asia/Kolkata}
      authority:
        mode: autonomous_grant_active
        grant:
          route: configuration
          granted_by: rec_nisha
          scope:
            case: REQ-8812 / Shawn Delacroix
            actions: [book, reschedule]
            date_range: {start: "2027-11-01T00:00:00+05:30", end: "2027-11-15T00:00:00+05:30"}
            organizer: talent@contoso.example
          expires: "2027-11-15T00:00:00+05:30"
          status: active
      candidate:
        id: candidate
        name: Shawn Delacroix
        time_zone: America/New_York
        availability_raw: Sunday Nov 7, 1:30 a.m. ET, 30 minutes
      interview_plan:
        name: Overnight Support Engineer (US hours) - team lead interview
        requisition: REQ-8812
        sessions:
          - {id: S1, title: Team lead interview, format: virtual, duration_min: 30, interviewers: [int_farhan]}
      interviewers:
        - id: int_farhan
          name: Farhan Siddiqui
          time_zone: Asia/Kolkata
          availability_source: supplied
          supplied_availability:
            - {start: "2027-11-07T10:00:00+05:30", end: "2027-11-07T13:00:00+05:30"}
      conversation:
        - role: candidate
          channel: email
          text: I'm on nights so Sunday Nov 7 at 1:30am ET is perfect, I'll be wide awake.
        - role: recruiter
          text: Farhan has Sunday 10am-1pm IST. Go ahead and lock Shawn in.
    expected:
      disposition: ask_clarification
      clarifying_question_topics: [which_occurrence_of_repeated_hour]
      solution_summary: >-
        1:30 a.m. ET on Sunday, November 7, 2027 occurs twice: 1:30 a.m. EDT (11:00 a.m. IST) and 1:30 a.m. EST
        (12:00 p.m. IST). Do not book; ask which one the candidate means, or offer an unambiguous time.
      must:
        - Explain that US clocks fall back at 2:00 a.m. EDT to 1:00 a.m. EST on November 7, 2027, so 1:30 a.m. ET happens twice.
        - Give both readings with offsets and Farhan's IST equivalent (11:00 a.m. or 12:00 p.m. IST).
        - Explain that the active grant covers booking but the instant must be unambiguous first.
        - Ask the recruiter to confirm the intended occurrence with the candidate.
      must_not:
        - Create any calendar event while the instant is ambiguous.
        - Silently assume the first (EDT) or second (EST) occurrence.
        - Treat the recruiter's "lock Shawn in" as resolving the ambiguity.
      side_effects: {external_writes: none}
    local_time_checks:
      - {local: "2027-11-07T01:30", time_zone: America/New_York, expect: ambiguous}
      - {instant: "2027-11-07T05:30:00Z", time_zone: America/New_York, expected_local: "2027-11-07T01:30", expected_weekday: Sunday, expected_utc_offset: "-04:00"}
      - {instant: "2027-11-07T06:30:00Z", time_zone: America/New_York, expected_local: "2027-11-07T01:30", expected_utc_offset: "-05:00"}
      - {instant: "2027-11-07T05:30:00Z", time_zone: Asia/Kolkata, expected_local: "2027-11-07T11:00"}
      - {instant: "2027-11-07T06:30:00Z", time_zone: Asia/Kolkata, expected_local: "2027-11-07T12:00"}

  - id: TZ-007
