      - {instant: "2027-03-26T13:00:00Z", time_zone: Asia/Jerusalem, expected_local: "2027-03-26T16:00", expected_weekday: Friday}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-25T00:00:00-04:00", end: "2027-03-29T00:00:00-04:00"}
      participants:
        candidate:
          time_zone: America/New_York
          available: [["2027-03-25T09:00:00-04:00", "2027-03-25T11:00:00-04:00"], ["2027-03-26T09:00:00-04:00", "2027-03-26T11:00:00-04:00"], ["2027-03-28T09:00:00-04:00", "2027-03-28T11:00:00-04:00"]]
        int_liora:
          time_zone: Asia/Jerusalem
          working_hours: {time_zone: Asia/Jerusalem, days: [Sun, Mon, Tue, Wed, Thu], start: "09:00", end: "17:00"}
          busy: [["2027-03-25T16:00:00+02:00", "2027-03-25T17:00:00+02:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_liora]}
      expect_feasible: true
      valid_examples:
