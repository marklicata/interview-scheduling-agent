  - id: TZ-019
    title: Bengaluru candidate's evening window maps to different Chicago mornings before and after Mar 14
    category: cross_timezone
    subcategory: recurring_window_dst_shift
    description: >-
      The candidate is free 7:00-9:00 p.m. IST on weekdays; Chicago interviewers can meet 8:00-9:30 a.m. Central before
      stand-up. India has no DST, so the gap is 11.5 hours on March 9, 2027 and 10.5 hours on March 16. Round 1
      (March 9) can start 7:30-8:00 p.m. IST; round 2 (March 16) only at 7:00 p.m. IST. The recruiter asks to keep
      "8 pm IST both weeks", which fails on March 16 (9:30 a.m. CDT).
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, hiring_manager]
    tags: [india_no_dst, chicago, us_dst_change, recurring_window, two_rounds]
    requirement_refs: [AVL-10, SCH-01, EC-019]
    inputs:
      now: "2027-03-02T09:00:00+05:30"
      recruiter: {id: rec_kavya, name: Kavya Iyer, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Rohan Deshpande
        time_zone: Asia/Kolkata
        availability:
          - {start: "2027-03-09T19:00:00+05:30", end: "2027-03-09T21:00:00+05:30"}
          - {start: "2027-03-16T19:00:00+05:30", end: "2027-03-16T21:00:00+05:30"}
      interview_plan:
        name: Site Reliability Engineer - two rounds
        sessions:
          - {id: R1, title: Technical round, format: virtual, duration_min: 60, interviewers: [int_brenda], order: 1}
          - {id: R2, title: Manager round, format: virtual, duration_min: 60, interviewers: [int_luis], order: 2}
      interviewers:
        - {id: int_brenda, name: Brenda Kowalski, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-03-09T08:00:00-06:00", end: "2027-03-09T09:30:00-06:00"}]}
        - {id: int_luis, name: Luis Carmona, time_zone: America/Chicago, availability_source: supplied,
           supplied_availability: [{start: "2027-03-16T08:00:00-05:00", end: "2027-03-16T09:30:00-05:00"}]}
      conversation:
        - role: recruiter
          text: >-
            Rohan is free 7-9pm IST on Tue 9 Mar (Brenda) and Tue 16 Mar (Luis). Both interviewers can do 8-9:30am
            Chicago time. Keep it simple - 8pm IST both weeks.
    expected:
      disposition: propose_options
      solution_summary: >-
        R1 Tuesday, March 9, 2027: start 7:30-8:00 p.m. IST (8:00-8:30 a.m. CST); 8:00 p.m. IST works. R2 Tuesday, March 16:
        only 7:00-8:00 p.m. IST = 8:30-9:30 a.m. CDT; 8:00 p.m. IST would be 9:30 a.m. CDT, after Luis's window.
      must:
        - Propose R1 between 7:30 and 8:00 p.m. IST on March 9 and R2 only at 7:00 p.m. IST on March 16, with Chicago times.
        - Explain that Chicago moves to CDT on March 14, 2027 so the gap shrinks from 11.5 to 10.5 hours.
        - Tell the recruiter that a single "8 pm IST both weeks" slot is impossible.
        - Ask whether to book.
      must_not:
        - Propose R2 at 8:00 p.m. IST on March 16.
        - Use an 11.5-hour difference for March 16.
        - Book before confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-09T14:00:00Z", time_zone: Asia/Kolkata, expected_local: "2027-03-09T19:30", expected_weekday: Tuesday}
      - {instant: "2027-03-09T14:00:00Z", time_zone: America/Chicago, expected_local: "2027-03-09T08:00", expected_utc_offset: "-06:00"}
      - {instant: "2027-03-16T13:30:00Z", time_zone: Asia/Kolkata, expected_local: "2027-03-16T19:00", expected_weekday: Tuesday}
      - {instant: "2027-03-16T13:30:00Z", time_zone: America/Chicago, expected_local: "2027-03-16T08:30", expected_utc_offset: "-05:00"}
