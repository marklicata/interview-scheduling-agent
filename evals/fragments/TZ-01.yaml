  - id: TZ-020
    title: Recruiter confirms a proposal whose two time labels were computed with a stale offset
    category: cross_timezone
    subcategory: inconsistent_confirmed_proposal
    description: >-
      A proposal drafted on March 8 read "Tue Mar 16, 9:00-10:00 a.m. PT (5:00-6:00 p.m. GMT)". After the US change on
      March 14, 9:00 a.m. PDT is 4:00 p.m. GMT. The candidate accepted 9:00 a.m. PT and the Edinburgh interviewer
      accepted 5:00 p.m. GMT - two different instants. The recruiter says "both said yes, book it". The confirmation
      covers an inconsistent action, and 9:00 a.m. PDT also collides with Hamish's 4:00 p.m. 1:1. The agent must not
      book either reading; it must explain and offer corrected options.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [stale_offset, inconsistent_confirmation, us_dst_change, edinburgh, recheck_before_booking]
    requirement_refs: [ACT-02, AVL-05, AVL-10, EC-019, EC-030]
    inputs:
      now: "2027-03-12T09:00:00-08:00"
      recruiter: {id: rec_dana, name: Dana Whitfield, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Noah Feldmann
        time_zone: America/Los_Angeles
        availability:
          - {start: "2027-03-16T08:00:00-07:00", end: "2027-03-16T10:30:00-07:00"}
      interview_plan:
        name: Geospatial Data Engineer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_hamish]}
      interviewers:
        - id: int_hamish
          name: Hamish Drummond
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          calendar:
            - {start: "2027-03-16T16:00:00+00:00", end: "2027-03-16T16:30:00+00:00", status: busy, subject: 1:1}
      case_state:
        prior_proposals:
          - {created_at: "2027-03-08T10:00:00-08:00", text: "Tue Mar 16, 9:00-10:00 a.m. PT (5:00-6:00 p.m. GMT)"}
      conversation:
        - role: agent
          at: "2027-03-08T10:00:00-08:00"
          text: "Option 1: Tue Mar 16, 9:00-10:00 a.m. PT (5:00-6:00 p.m. GMT) with Hamish. Want me to book it?"
        - role: recruiter
          at: "2027-03-12T09:00:00-08:00"
          confirmation: true
          text: Noah confirmed 9am PT and Hamish confirmed 5pm GMT. Both said yes - book option 1.
    expected:
      disposition: propose_options
      secondary_dispositions: [ask_clarification]
      solution_summary: >-
        Do not book. On Tuesday, March 16, 2027, 9:00 a.m. PDT = 4:00 p.m. GMT (Hamish has a 1:1 then) and 5:00 p.m. GMT =
        10:00 a.m. PDT (runs past Noah's 10:30 limit). Valid corrected options are 8:00-9:00 a.m. PDT (3:00-4:00 p.m. GMT)
        or 9:30-10:30 a.m. PDT (4:30-5:30 p.m. GMT); each needs re-agreement before booking.
      must:
        - Refuse to execute the confirmation because the two acceptances refer to different instants, and say the earlier conversion was wrong.
        - Explain that after March 14, 2027 Los Angeles is 7 hours behind London, so 9:00 a.m. PDT is 4:00 p.m. GMT.
        - Note that 9:00 a.m. PDT conflicts with Hamish's 4:00-4:30 p.m. GMT event and 5:00 p.m. GMT exceeds Noah's 10:30 a.m. PDT limit.
        - Offer the corrected options 8:00 a.m. PDT or 9:30 a.m. PDT with GMT equivalents and ask the recruiter to reconfirm with the affected people.
      must_not:
        - Create an event at 9:00 a.m. PDT or 5:00 p.m. GMT.
        - Treat the recruiter's confirmation as covering a corrected time.
        - Reveal the subject of Hamish's calendar event to the candidate.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-16T16:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-16T09:00", expected_weekday: Tuesday, expected_utc_offset: "-07:00"}
      - {instant: "2027-03-16T17:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-16T10:00"}
      - {instant: "2027-03-09T17:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-03-09T09:00", expected_utc_offset: "-08:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-03-16T00:00:00-07:00", end: "2027-03-17T00:00:00-07:00"}
      participants:
        candidate: {time_zone: America/Los_Angeles, available: [["2027-03-16T08:00:00-07:00", "2027-03-16T10:30:00-07:00"]]}
        int_hamish:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          busy: [["2027-03-16T16:00:00+00:00", "2027-03-16T16:30:00+00:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_hamish]}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-03-16T08:00:00-07:00"}
        - {S1: "2027-03-16T09:30:00-07:00"}
      invalid_examples:
        - {S1: "2027-03-16T09:00:00-07:00", note: "Overlaps Hamish's 4:00 p.m. GMT event."}
        - {S1: "2027-03-16T17:00:00+00:00", note: "10:00-11:00 a.m. PDT, past Noah's 10:30 limit."}
      valid_start_bounds:
        S1: {earliest: "2027-03-16T08:00:00-07:00", latest: "2027-03-16T09:30:00-07:00"}

  - id: TZ-021
    title: Lagos, Nairobi and Johannesburg panel for a Warsaw candidate - Lagos stops matching Warsaw on Mar 28
    category: cross_timezone
    subcategory: africa_europe_panel
    description: >-
      African zones here have no DST (Lagos UTC+1, Johannesburg UTC+2, Nairobi UTC+3); Warsaw moves from UTC+1 to UTC+2
      on March 28, 2027. A 90-minute panel needs all three interviewers; the Nairobi interviewer stops at 4:00 p.m. EAT.
      On Thursday, March 25 the overlap is only 60 minutes; on Tuesday, March 30 it is 120 minutes. The recruiter thinks
      "Lagos is on the same clock as Warsaw anyway", which is false after March 28.
