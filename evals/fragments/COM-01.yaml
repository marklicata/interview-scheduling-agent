          text: Rebecca can only do Friday 8-10am our time. Can you fit both interviews?
    expected:
      disposition: report_infeasible
      solution_summary: >-
        Neither interview fits on Friday, December 11, 2026. Rebecca's 8:00-10:00 a.m. EST window is 2:00-4:00 p.m. in Berlin;
        Katrin is out of office all that day and Lukas is busy for that entire window. Next steps - ask Rebecca for other times
        (for example the week of December 14, mornings Eastern, which are afternoons in Berlin), or ask whether other approved
        interviewers can cover either session.
