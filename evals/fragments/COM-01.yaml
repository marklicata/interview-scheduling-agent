      - {instant: "2026-12-11T13:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-12-11T14:00", expected_utc_offset: "+01:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-11T00:00:00-05:00", end: "2026-12-12T00:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2026-12-11T08:00:00-05:00", "2026-12-11T10:00:00-05:00"]]}
        int_katrin: {time_zone: Europe/Berlin, busy: [["2026-12-11T00:00:00+01:00", "2026-12-12T00:00:00+01:00"]]}
        int_lukas: {time_zone: Europe/Berlin, busy: [["2026-12-11T14:00:00+01:00", "2026-12-11T16:00:00+01:00"]]}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_katrin]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_lukas]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-12-11T08:00:00-05:00", S2: "2026-12-11T09:05:00-05:00", note: Katrin is out of office and Lukas is busy.}

  - id: COM-011
    title: Invitation in Japanese for a candidate whose preferred language policy supports it
    category: communication_quality
    subcategory: localization_japanese
    description: >-
      Tenant policy allows candidate invitations in English or Japanese using approved templates, chosen by the candidate's
      preferred language. The Osaka candidate prefers Japanese; the interviewer is in Seattle. The candidate invitation must be
      in Japanese with an unambiguous date, weekday, 24-hour time, and named zone; the interviewer invitation stays in English
      with Pacific time and the candidate's local date.
    difficulty: advanced
