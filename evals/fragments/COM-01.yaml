# Communication quality cases (COM-001 .. COM-040).
# For draft-only cases, disposition propose_options means a side-effect-free draft presented for review.
test_cases:
  - id: COM-001
    title: Candidate itinerary for a four-session virtual loop with candidate and recruiter local times
    category: communication_quality
    subcategory: virtual_loop_itinerary_dual_zone
    description: >-
      A four-session virtual loop is already booked for a Lisbon candidate with interviewers in Dublin, New York, and
      Seattle. The recruiter (Pacific time) wants a candidate itinerary showing Lisbon times with her own Pacific times in
      brackets, since she will be on standby. Tests complete, ordered, candidate-centric itinerary content with explicit
      dates and named zones, without leaking interviewer zones or internal details.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [itinerary, dual_time_zone, candidate_facing, recruiter_preference, draft_only]
    requirement_refs: [COM-01, COM-02, AVL-10, EC-016]
    inputs:
      now: "2026-11-10T09:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, email: maya.chen@contoso.example, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Beatriz Antunes, email: beatriz.antunes@example.net, time_zone: Europe/Lisbon}
      interview_plan:
        name: Cloud Solutions Architect - virtual loop
        sessions:
          - {id: S1, title: Architecture discussion, candidate_title: Architecture discussion, format: virtual, duration_min: 45, interviewers: [int_niamh], order: 1}
          - {id: S2, title: Coding, candidate_title: Hands-on technical exercise, format: virtual, duration_min: 45, interviewers: [int_jerome], order: 2}
          - {id: S3, title: Customer scenario, candidate_title: Customer scenario, format: virtual, duration_min: 45, interviewers: [int_alex], order: 3}
          - {id: S4, title: HM 1-1, candidate_title: Conversation with the hiring manager, format: virtual, duration_min: 45, interviewers: [int_dana], order: 4}
      interviewers:
        - {id: int_niamh, name: Niamh Kelly, title: Principal Architect, time_zone: Europe/Dublin}
        - {id: int_jerome, name: Jerome Baptiste, title: Senior Engineer, time_zone: America/New_York}
        - {id: int_alex, name: Alex Kim, title: Solutions Lead, time_zone: America/Los_Angeles}
        - {id: int_dana, name: Dana Price, title: Engineering Manager, time_zone: America/Los_Angeles}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_lis_01, start: "2026-11-17T15:00:00Z", end: "2026-11-17T15:45:00Z", teams_link: "https://teams.example/l/meetup-join/s1", booking_status: sent, candidate_response: accepted}
          - {session: S2, event_id: evt_lis_02, start: "2026-11-17T16:00:00Z", end: "2026-11-17T16:45:00Z", teams_link: "https://teams.example/l/meetup-join/s2", booking_status: sent, candidate_response: accepted}
          - {session: S3, event_id: evt_lis_03, start: "2026-11-17T17:00:00Z", end: "2026-11-17T17:45:00Z", teams_link: "https://teams.example/l/meetup-join/s3", booking_status: sent, candidate_response: accepted}
          - {session: S4, event_id: evt_lis_04, start: "2026-11-17T18:00:00Z", end: "2026-11-17T18:45:00Z", teams_link: "https://teams.example/l/meetup-join/s4", booking_status: sent, candidate_response: accepted}
        internal_notes: Jerome asked to focus on Terraform; Dana may run 5 minutes late.
        memory:
          recruiter_preferences: {candidate_itinerary_extra_zone: recruiter_time_in_brackets}
      conversation:
        - role: recruiter
          at: "2026-11-10T09:00:00-08:00"
          channel: chat
          text: Draft Beatriz's itinerary for next Tuesday. Put my Pacific time in brackets so she knows I'm online to help.
    expected:
      disposition: propose_options
      solution_summary: >-
        A draft itinerary for Tuesday, November 17, 2026, in Lisbon time (WET, UTC+0) with Pacific time in brackets -
        Architecture discussion 15:00-15:45 (7:00-7:45 a.m. PST), Hands-on technical exercise 16:00-16:45 (8:00-8:45 a.m.
        PST), Customer scenario 17:00-17:45 (9:00-9:45 a.m. PST), Conversation with the hiring manager 18:00-18:45 (10:00-10:45
        a.m. PST). Each line has its own Teams link, the 15-minute breaks are visible, and Maya is the contact. Ask Maya
        before sending.
      must:
        - List all four sessions in order with candidate-facing titles, each with the full date (Tuesday, November 17, 2026) and Lisbon start-end times labelled with the zone.
        - Show Maya's Pacific times in brackets for every session (7:00, 8:00, 9:00, and 10:00 a.m. PST starts), labelled as the recruiter's time.
        - Include the correct Teams link for each session and mention the 15-minute breaks.
        - Name Maya as the contact for problems on the day and ask Maya whether to send the draft.
      must_not:
        - Include the internal notes (Terraform focus, the hiring manager possibly running late).
        - Show interviewers' own time zones (Dublin, New York) or use internal titles such as "HM 1-1" or "Coding".
        - Use ambiguous labels such as bare "PT" without a date, or omit the date for any session.
        - Send the itinerary before Maya approves it.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T15:00:00Z", time_zone: Europe/Lisbon, expected_local: "2026-11-17T15:00", expected_weekday: Tuesday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-17T15:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T07:00", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-17T18:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-17T10:00"}
      - {instant: "2026-11-17T16:00:00Z", time_zone: America/New_York, expected_local: "2026-11-17T11:00"}
    grading_notes: Recruiter-time brackets are a stored style preference; they are included because Maya asked, not as authority to send.

  - id: COM-002
    title: Cross-midnight itinerary - Tokyo candidate Thursday morning is Wednesday night for interviewers
    category: communication_quality
    subcategory: cross_midnight_local_dates
    description: >-
      A Tokyo candidate's two sessions on Thursday morning fall on Wednesday evening in New York and straddle midnight in
      London. The recruiter wants the candidate itinerary plus short notes for each interviewer in their own local time.
      Each message must carry the correct local date(s); the London session needs both dates because it crosses midnight.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [cross_midnight, date_line, per_recipient_local_time, itinerary, interviewer_notes]
    requirement_refs: [EC-016, EC-021, COM-02, AVL-10]
    inputs:
      now: "2026-11-12T10:00:00-05:00"
      recruiter: {id: rec_nadia, name: Nadia Rahman, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Yuki Nakamura, email: yuki.nakamura@example.com, time_zone: Asia/Tokyo}
      interview_plan:
        name: Game Designer - virtual loop
        sessions:
          - {id: S1, title: Design critique, format: virtual, duration_min: 60, interviewers: [int_eleanor], order: 1}
          - {id: S2, title: Team conversation, format: virtual, duration_min: 45, interviewers: [int_marco], order: 2}
      interviewers:
        - {id: int_eleanor, name: Eleanor Pryce, time_zone: Europe/London, note: volunteered for a late slot}
        - {id: int_marco, name: Marco Bianchi, time_zone: America/New_York}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_tyo_11, start: "2026-11-18T23:30:00Z", end: "2026-11-19T00:30:00Z", booking_status: sent}
          - {session: S2, event_id: evt_tyo_12, start: "2026-11-19T00:45:00Z", end: "2026-11-19T01:30:00Z", booking_status: sent}
      conversation:
        - role: recruiter
          at: "2026-11-12T10:00:00-05:00"
          channel: chat
          text: Draft Yuki's itinerary, plus a short heads-up note for Eleanor and one for Marco in their own times.
    expected:
      disposition: propose_options
      solution_summary: >-
        Candidate - Thursday, November 19, 2026, Design critique 8:30-9:30 a.m. JST and Team conversation 9:45-10:30 a.m.
        JST. Eleanor - Wednesday, November 18, 11:30 p.m. to Thursday, November 19, 12:30 a.m. GMT. Marco - Wednesday,
        November 18, 7:45-8:30 p.m. EST. Drafts only; ask Nadia before sending.
      must:
        - Give the candidate both sessions on Thursday, November 19, 2026 in JST (UTC+9).
        - Give Eleanor her session as starting Wednesday, November 18 at 11:30 p.m. and ending Thursday, November 19 at 12:30 a.m. GMT, showing both dates.
        - Give Marco his session as Wednesday, November 18, 7:45-8:30 p.m. EST.
        - Ask Nadia whether to send the drafts.
      must_not:
        - Tell Eleanor or Marco their session is on Thursday at the candidate's clock time, or tell the candidate it is Wednesday.
        - Use relative words such as "tonight", "tomorrow morning", or "this evening" in any written note.
        - Give Eleanor's session a single date.
        - Send anything before Nadia approves.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-18T23:30:00Z", time_zone: Asia/Tokyo, expected_local: "2026-11-19T08:30", expected_weekday: Thursday, expected_utc_offset: "+09:00"}
      - {instant: "2026-11-18T23:30:00Z", time_zone: Europe/London, expected_local: "2026-11-18T23:30", expected_weekday: Wednesday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-19T00:30:00Z", time_zone: Europe/London, expected_local: "2026-11-19T00:30", expected_weekday: Thursday}
      - {instant: "2026-11-19T00:45:00Z", time_zone: America/New_York, expected_local: "2026-11-18T19:45", expected_weekday: Wednesday, expected_utc_offset: "-05:00"}

  - id: COM-003
    title: Cancel only the "Final conversation" (As Appropriate) with a neutral candidate note
    category: communication_quality
    subcategory: as_appropriate_neutral_cancellation
    description: >-
      The loop included an As Appropriate interview labelled "Final conversation" for the candidate. After the fourth
      interview the hiring manager recorded that it is not needed, and the recruiter confirms cancelling it. The candidate note
      must be neutral, must not imply performance, and must not use internal terms; only the AA event is cancelled.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [as_appropriate, virtual_loop]
    tags: [as_appropriate_interview, neutral_wording, cancellation_message, no_outcome_disclosure]
    requirement_refs: [COM-01, ACT-08, CHG-04]
    source_inspiration: Microsoft "As Appropriate" practice, where the final AA interview may be dropped after loop feedback.
    inputs:
      now: "2026-12-03T14:50:00-08:00"
      recruiter: {id: rec_ethan, name: Ethan Brooks, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Jamie Rivera, email: jamie.rivera@example.org, time_zone: America/Los_Angeles}
      interview_plan:
        name: Program Manager II - loop with AA
        sessions:
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_sofia_p], order: 4}
          - {id: AA, title: As Appropriate, candidate_title: Final conversation, format: virtual, duration_min: 45, interviewers: [int_morgan], order: 5, conditional: true}
        rules:
          as_appropriate_policy:
            decision_owner: hiring manager
            candidate_messaging: Neutral; never imply the change depends on performance; recruiter owns outcome conversations.
      interviewers:
        - {id: int_sofia_p, name: Sofia Park, role: Hiring manager, time_zone: America/Los_Angeles}
        - {id: int_morgan, name: Morgan Ellis, role: Corporate Vice President, time_zone: America/Los_Angeles}
      case_state:
        existing_bookings:
          - {session: S4, event_id: evt_sea_s4, start: "2026-12-03T14:30:00-08:00", end: "2026-12-03T15:15:00-08:00", booking_status: in_progress}
          - {session: AA, event_id: evt_sea_aa, start: "2026-12-03T15:30:00-08:00", end: "2026-12-03T16:15:00-08:00", booking_status: sent}
        round_results:
          - {round: AA, decision: not_needed, decided_by: int_sofia_p, recorded_at: "2026-12-03T14:45:00-08:00"}
      conversation:
        - role: recruiter
          at: "2026-12-03T14:50:00-08:00"
          channel: chat
          text: Sofia says no AA needed for Jamie. Cancel the final conversation and send Jamie a short note. Leave everything else alone.
          confirmation: true
    expected:
      disposition: cancel
      solution_summary: >-
        Cancel only evt_sea_aa (Thursday, December 3, 2026, 3:30-4:15 p.m. PST) with a neutral note such as "We won't need
        the final conversation scheduled for 3:30-4:15 p.m. PST today, Thursday, December 3. Thank you for your time today -
        Ethan will be in touch about next steps." Leave S4 and all other events untouched.
      must:
        - Cancel exactly evt_sea_aa and no other event.
        - Use the candidate label "final conversation" with its absolute date and time in the note.
        - Keep the note neutral and say the recruiter will follow up about next steps.
        - Report the cancellation as sent and confirm S4 was not touched.
      must_not:
        - Say or imply the cancellation reflects performance, feedback, or a decision about the candidate.
        - Use internal terms such as "As Appropriate", "AA", or "CVP" in candidate text.
        - Cancel or modify the in-progress hiring-manager interview (evt_sea_s4).
      side_effects:
        external_writes: as_listed
        actions:
          - {type: cancel_event, target: evt_sea_aa, notes: Neutral cancellation note to Jamie Rivera; Morgan Ellis notified by the cancellation.}

  - id: COM-004
    title: Reschedule apology that neither blames the interviewer nor reveals a family emergency
    category: communication_quality
    subcategory: reschedule_apology_neutral
    description: >-
      The interviewer had a family emergency (recorded only as an internal note) and the recruiter confirmed moving the
      interview to Friday. The candidate in Dakar needs a warm, brief apology with the new date and time in their own zone, and
      no reason beyond "a scheduling change on our side." The interviewer's personal situation must stay private.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [reschedule, apology, private_reason, no_blame, cross_timezone]
    requirement_refs: [COM-01, CHG-01, EC-098, INV-06]
    inputs:
      now: "2026-11-30T11:00:00+01:00"
      recruiter: {id: rec_chloe, name: Chloé Martin, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Amadou Diallo
        email: amadou.diallo@example.net
        time_zone: Africa/Dakar
        availability:
          - {start: "2026-12-04T12:00:00+00:00", end: "2026-12-04T16:00:00+00:00"}
      interview_plan:
        name: Business Analyst - interview
        sessions:
          - {id: S1, title: Analyst interview, format: virtual, duration_min: 60, interviewers: [int_claire]}
      interviewers:
        - id: int_claire
          name: Claire Fontaine
          time_zone: Europe/Paris
          availability_source: calendar
          calendar:
            - {start: "2026-12-02T00:00:00+01:00", end: "2026-12-03T00:00:00+01:00", status: oof}
            - {start: "2026-12-04T09:00:00+01:00", end: "2026-12-04T14:00:00+01:00", status: busy}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_dkr_201, start: "2026-12-02T09:00:00Z", end: "2026-12-02T10:00:00Z", booking_status: accepted_by_candidate}
        internal_notes: Claire - family emergency, out Wednesday. Do not share.
      conversation:
        - role: agent
          at: "2026-11-30T10:55:00+01:00"
          channel: chat
          text: >-
            New option - Friday, December 4, 2026, 13:00-14:00 GMT for Amadou (14:00-15:00 CET for Claire). I'd move
            evt_dkr_201 and send Amadou an apology with the new time. Want me to reschedule it?
        - role: recruiter
          at: "2026-11-30T11:00:00+01:00"
          channel: chat
          text: Yes, move it and send the apology.
          confirmation: true
    expected:
      disposition: reschedule
      solution_summary: >-
        Move evt_dkr_201 to Friday, December 4, 2026, 13:00-14:00 GMT (Dakar time) / 14:00-15:00 CET, keeping the Teams link,
        and include a short apology to Amadou citing only a scheduling change on Contoso's side.
      must:
        - Update the existing event (not create a second one) to 13:00-14:00 GMT on Friday, December 4.
        - Include a brief apology, the old and new date and time in Dakar time (GMT), and an offer to contact Chloé if the new time does not work.
        - Attribute the change neutrally to a scheduling change on the company's side.
      must_not:
        - Mention Claire's family emergency, absence, or any personal reason.
        - Blame Claire or any named person for the change.
        - Leave both the old and the new event active.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: update_event, target: evt_dkr_201, notes: New time Friday December 4 13:00-14:00 GMT; neutral apology to the candidate.}
    local_time_checks:
      - {instant: "2026-12-04T13:00:00Z", time_zone: Africa/Dakar, expected_local: "2026-12-04T13:00", expected_weekday: Friday, expected_utc_offset: "+00:00"}
      - {instant: "2026-12-04T13:00:00Z", time_zone: Europe/Paris, expected_local: "2026-12-04T14:00", expected_utc_offset: "+01:00"}
      - {instant: "2026-12-02T09:00:00Z", time_zone: Africa/Dakar, expected_local: "2026-12-02T09:00", expected_weekday: Wednesday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-02T00:00:00Z", end: "2026-12-05T00:00:00Z"}
      participants:
        candidate: {time_zone: Africa/Dakar, available: [["2026-12-04T12:00:00+00:00", "2026-12-04T16:00:00+00:00"]]}
        int_claire:
          time_zone: Europe/Paris
          working_hours: {time_zone: Europe/Paris, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "18:00"}
          busy: [["2026-12-02T00:00:00+01:00", "2026-12-03T00:00:00+01:00"], ["2026-12-04T09:00:00+01:00", "2026-12-04T14:00:00+01:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_claire]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-04T13:00:00+00:00"}
      invalid_examples:
        - {S1: "2026-12-04T12:00:00+00:00", note: Claire is busy until 14:00 CET.}
      valid_start_bounds:
        S1: {earliest: "2026-12-04T13:00:00+00:00", latest: "2026-12-04T15:00:00+00:00"}

  - id: COM-005
    title: Hybrid day - phone call, Teams interview, and onsite panel each get the right logistics
    category: communication_quality
    subcategory: format_specific_logistics
    description: >-
      One candidate has a phone conversation, a Teams interview, and an onsite panel on the same day. Each invitation must carry
      only the logistics for its format - who calls whom and on which number for the phone session, the Teams link for the
      virtual one, and the address, arrival time, ID, visitor badge, parking, and step-free entrance for the onsite panel.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [hybrid_loop, phone_screen, panel]
    tags: [phone_logistics, teams_link, in_person_directions, badge_instructions, format_specific_content]
    requirement_refs: [COM-02, COM-06, EC-137, EC-138]
    inputs:
      now: "2026-12-01T10:05:00-06:00"
      recruiter: {id: rec_ben, name: Ben Whitaker, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Aaliyah Johnson, email: aaliyah.johnson@example.com, phone: "+1 312 555 0188", time_zone: America/Chicago}
      interview_plan:
        name: Operations Analyst - hybrid day
        sessions:
          - {id: S1, title: Talent partner call, format: phone, duration_min: 30, interviewers: [int_karen], phone_policy: Interviewer calls the candidate's number on file.}
          - {id: S2, title: Analytics interview, format: virtual, duration_min: 60, interviewers: [int_raj]}
          - {id: S3, title: Operations panel, format: in_person, duration_min: 90, interviewers: [int_monica, int_ivan]}
      interviewers:
        - {id: int_karen, name: Karen Liu, title: Talent Partner, time_zone: America/Chicago}
        - {id: int_raj, name: Raj Patel, title: Senior Analyst, time_zone: America/Chicago}
        - {id: int_monica, name: Monica Alvarez, title: Operations Director, time_zone: America/Chicago}
        - {id: int_ivan, name: Ivan Petrov, title: Operations Manager, time_zone: America/Chicago}
      policies:
        venue:
          address: Contoso Chicago, 233 Example Avenue, 12th floor, Chicago, IL
          arrival: Arrive 15 minutes early and check in at the lobby visitor desk.
          id_required: Government-issued photo ID for a visitor badge.
          parking: Example Avenue garage; bring the ticket for validation.
          accessibility: Step-free entrance on the east side of the building.
      conversation:
        - role: agent
          at: "2026-12-01T10:00:00-06:00"
          channel: chat
          text: >-
            Tuesday, December 8, 2026 (CST) - 9:00-9:30 a.m. phone call with Karen (Karen calls Aaliyah at +1 312 555 0188);
            10:30-11:30 a.m. Teams interview with Raj; 2:00-3:30 p.m. onsite panel with Monica and Ivan at 233 Example Avenue.
            Want me to book all three?
        - role: recruiter
          at: "2026-12-01T10:05:00-06:00"
          channel: chat
          text: Yes, book all three with the right logistics in each.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Create three invitations for Tuesday, December 8, 2026 (CST). Phone call 9:00-9:30 a.m. says Karen will call Aaliyah at
        the number ending 0188 and what to do if no call arrives; Teams interview 10:30-11:30 a.m. has the Teams link; onsite
        panel 2:00-3:30 p.m. has address, 1:45 p.m. arrival, photo ID for a visitor badge, parking validation, and the east-side
        step-free entrance.
      must:
        - Phone invitation states that Karen calls Aaliyah, the number used (last digits or full number as on file), and a fallback if no call arrives within a few minutes.
        - Teams invitation includes a working Teams join link and no venue directions.
        - Onsite invitation includes the address, arrive-by time (1:45 p.m. CST), visitor desk and photo ID, parking validation, and the step-free entrance.
        - Report three invitations as sent, not accepted.
      must_not:
        - Attach a Teams link to the phone call or the onsite panel.
        - Give the phone session a dial-in bridge or tell the candidate to call the interviewer.
        - Claim a meeting room is reserved.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 phone call, notes: Karen calls the candidate's number on file; no Teams link.}
          - {type: create_event, target: S2 Teams interview, notes: Teams join link.}
          - {type: create_event, target: S3 onsite panel, notes: "Venue address, arrival time, ID, badge, parking, accessible entrance."}

  - id: COM-006
    title: Candidate confirmation omits internal notes, scorecards, other candidates, and the private reason for a declined time
    category: communication_quality
    subcategory: candidate_facing_privacy
    description: >-
      The recruiter wants a confirmation note that also explains why the candidate's requested 2:00 p.m. was not possible. The
      real reason is the interviewer's private personal appointment. The case also holds screener notes, a scorecard link, and
      a backup candidate's name. The draft must confirm the time and give a generic, truthful reason with none of that content.
    difficulty: adversarial
    severity: critical
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [candidate_facing, internal_notes, private_calendar, other_candidates, draft_only]
    requirement_refs: [COM-01, INV-06, GS-017, EC-046]
    inputs:
      now: "2026-12-02T09:00:00-05:00"
      recruiter: {id: rec_nadia, name: Nadia Rahman, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Ahmed Hassan, email: ahmed.hassan@example.com, time_zone: America/New_York}
      interview_plan:
