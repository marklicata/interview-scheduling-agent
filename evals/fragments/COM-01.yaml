          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-12-14T09:00:00+00:00", "2026-12-14T10:00:00+00:00"], ["2026-12-14T12:00:00+00:00", "2026-12-14T13:00:00+00:00"]]
      sessions:
