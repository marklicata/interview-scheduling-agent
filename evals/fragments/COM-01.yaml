  - id: COM-026
    title: Itinerary across the US daylight-saving change - London times differ between the two days
    category: communication_quality
    subcategory: dst_label_change
    description: >-
      A London candidate meets New York interviewers on Friday, March 12, 2027 (EST) and Tuesday, March 16, 2027 (EDT, after
      the US change on March 14 while the UK has not changed yet). Both sessions are at 10:00 a.m. New York time, but for the
      candidate they are 15:00 and 14:00. The itinerary must not copy one London time to both days and must label EST vs EDT.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [dst_mismatch, zone_labels, itinerary, new_york, london]
    requirement_refs: [EC-019, EC-075, COM-02]
    inputs:
      now: "2027-03-01T10:00:00-05:00"
      recruiter: {id: rec_nadia, name: Nadia Rahman, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Freya Morgan, time_zone: Europe/London}
      interview_plan:
        name: Equity Research Associate - two-day virtual loop
        sessions:
          - {id: S1, title: Modelling interview, format: virtual, duration_min: 60, interviewers: [int_sam_r]}
          - {id: S2, title: Desk head conversation, format: virtual, duration_min: 60, interviewers: [int_julia]}
      interviewers:
        - {id: int_sam_r, name: Sam Reyes, time_zone: America/New_York}
        - {id: int_julia, name: Julia Novak, time_zone: America/New_York}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_ny_m12, start: "2027-03-12T15:00:00Z", end: "2027-03-12T16:00:00Z", booking_status: sent}
          - {session: S2, event_id: evt_ny_m16, start: "2027-03-16T14:00:00Z", end: "2027-03-16T15:00:00Z", booking_status: sent}
      conversation:
        - role: recruiter
          at: "2027-03-01T10:00:00-05:00"
          channel: chat
          text: Both of Freya's interviews are at 10am our time. Draft her itinerary - should be 3pm London both days, right?
    expected:
      disposition: propose_options
      solution_summary: >-
        Correct Nadia - Friday, March 12, 2027 is 15:00-16:00 GMT (10:00-11:00 a.m. EST); Tuesday, March 16, 2027 is 14:00-15:00
        GMT (10:00-11:00 a.m. EDT) because the US moves its clocks on March 14 and the UK not until March 28. Draft the itinerary
        with those London times and an explicit note that the second interview is an hour earlier in London.
      must:
        - Show 15:00-16:00 GMT on Friday, March 12, 2027 and 14:00-15:00 GMT on Tuesday, March 16, 2027.
        - Label the New York references EST for March 12 and EDT for March 16.
        - Correct the recruiter's "3pm both days" assumption and explain the US/UK daylight-saving gap briefly.
      must_not:
        - Put 15:00 London time for March 16.
        - Label March 16 as EST or March 12 as EDT.
        - Send without Nadia's approval.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-12T15:00:00Z", time_zone: America/New_York, expected_local: "2027-03-12T10:00", expected_weekday: Friday, expected_utc_offset: "-05:00"}
      - {instant: "2027-03-16T14:00:00Z", time_zone: America/New_York, expected_local: "2027-03-16T10:00", expected_weekday: Tuesday, expected_utc_offset: "-04:00"}
      - {instant: "2027-03-16T14:00:00Z", time_zone: Europe/London, expected_local: "2027-03-16T14:00", expected_utc_offset: "+00:00"}
      - {local: "2027-03-14T02:30", time_zone: America/New_York, expect: nonexistent}

