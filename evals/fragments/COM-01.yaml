  - id: COM-019
    title: Gated round failed - cancel the provisional round 2 with a neutral note that reveals no result
    category: communication_quality
    subcategory: gated_round_neutral_cancellation
    description: >-
      Under a provisional_book_cancel_on_fail policy, round 2 was booked in advance. Round 1 now has a recorded fail, and the
      recruiter confirms cancelling round 2 while saying she will call the candidate about the outcome herself. The cancellation
      text to the candidate and interviewer must be neutral and must not reveal or hint at the result.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [gated_rounds, virtual_1on1]
    tags: [gate_policy, provisional_booking, neutral_cancellation, no_outcome_disclosure, apac]
    requirement_refs: [COM-01, ACT-08, CHG-04]
    inputs:
      now: "2026-12-04T15:00:00+08:00"
      recruiter: {id: rec_meilin, name: Mei Lin Goh, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Paolo Reyes, email: paolo.reyes@example.com, time_zone: Asia/Manila}
      interview_plan:
        name: Network Engineer - sequential rounds
        region: APAC
        sessions:
          - {id: R1, title: Technical round, format: virtual, duration_min: 60, interviewers: [int_ken]}
          - {id: R2, title: Manager round, format: virtual, duration_min: 60, interviewers: [int_joy], gate: R1 pass}
        rules:
          gating_policy: provisional_book_cancel_on_fail
          outcome_communication: Recruiter informs the candidate of outcomes personally; scheduling messages never state results.
      interviewers:
        - {id: int_ken, name: Ken Matsuda, time_zone: Asia/Singapore}
        - {id: int_joy, name: Joy Santos, time_zone: Asia/Manila}
      case_state:
        existing_bookings:
          - {session: R2, event_id: evt_mnl_r2, start: "2026-12-08T10:00:00+08:00", end: "2026-12-08T11:00:00+08:00", booking_status: sent}
        round_results:
          - {round: R1, result: fail, recorded_by: int_ken, recorded_at: "2026-12-04T13:30:00+08:00", source: ATS scorecard}
      conversation:
        - role: recruiter
          at: "2026-12-04T15:00:00+08:00"
          channel: chat
          text: Paolo didn't clear R1. Cancel R2 and send the cancellation - I'll call him about the outcome myself.
          confirmation: true
    expected:
      disposition: cancel
      solution_summary: >-
        Cancel evt_mnl_r2 (Tuesday, December 8, 2026, 10:00-11:00 a.m. Philippine time) with a neutral note such as "We need
        to cancel the conversation scheduled for Tuesday, December 8, 10:00-11:00 a.m. (Philippine time). Mei Lin will be in
        touch with you directly." Joy receives a neutral cancellation.
      must:
        - Cancel exactly evt_mnl_r2.
        - Keep the candidate note neutral, with the absolute date and time in Manila time, and say Mei Lin will be in touch.
        - Keep the interviewer notice neutral (session cancelled; no action needed).
        - Confirm to Mei Lin that the cancellation was sent and that no result was mentioned.
      must_not:
        - State, hint at, or apologize for a result ("unfortunately", "did not pass", "not moving forward", "based on round 1").
        - Mention the round 1 score or feedback to the candidate or Joy.
        - Cancel any other event.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: cancel_event, target: evt_mnl_r2, notes: Neutral cancellation; outcome left to the recruiter.}
    local_time_checks:
      - {instant: "2026-12-08T02:00:00Z", time_zone: Asia/Manila, expected_local: "2026-12-08T10:00", expected_weekday: Tuesday, expected_utc_offset: "+08:00"}
      - {instant: "2026-12-08T02:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-08T10:00", expected_utc_offset: "+08:00"}

  - id: COM-020
    title: Options email must not say the times are "held" when no hold exists
    category: communication_quality
    subcategory: no_reservation_promise
    description: >-
      The recruiter asks for an options email telling the candidate the three times are "held for her." The agent creates no
      holds (holds are post-MVP) and a proposal is not a reservation. The draft must present three valid options in the
      candidate's zone and say they are not reserved until she chooses and an invitation is sent; the recruiter should be told why.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [not_a_reservation, holds_later_scope, options_email, cross_timezone, africa]
    requirement_refs: [AVL-06, ACT-09, COM-02, EC-062]
    inputs:
