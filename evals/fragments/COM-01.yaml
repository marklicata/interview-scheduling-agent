            - {start: "2026-12-08T15:00:00+00:00", end: "2026-12-08T16:00:00+00:00", status: busy}
        - {id: int_george, name: George Mensah, time_zone: Europe/London, availability_source: calendar, calendar: []}
        - {id: int_sana, name: Sana Qureshi, time_zone: Europe/London, availability_source: calendar, calendar: []}
        - id: int_arjun
          name: Arjun Nair
          time_zone: Asia/Kolkata
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "12:00", end: "21:00"}
          calendar:
            - {start: "2026-12-08T19:30:00+05:30", end: "2026-12-08T20:30:00+05:30", status: busy}
      conversation:
