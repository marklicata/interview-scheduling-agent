      recruiter: {id: rec_grace, name: Grace Mwangi, time_zone: Africa/Nairobi}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Wanjiru Kamau
        time_zone: Africa/Nairobi
        availability:
          - {start: "2026-12-14T10:00:00+03:00", end: "2026-12-14T17:00:00+03:00"}
      interview_plan:
        name: Credit Analyst - interview
        sessions:
          - {id: S1, title: Credit interview, format: virtual, duration_min: 60, interviewers: [int_tom]}
      interviewers:
        - id: int_tom
          name: Tom Hughes
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-12-14T09:00:00+00:00", end: "2026-12-14T10:00:00+00:00", status: busy}
            - {start: "2026-12-14T12:00:00+00:00", end: "2026-12-14T13:00:00+00:00", status: busy}
      conversation:
        - role: recruiter
          at: "2026-12-07T09:00:00+03:00"
          channel: chat
          text: Draft an email offering Wanjiru three times with Tom on Monday. Tell her they're held for her until Friday.
    expected:
      disposition: propose_options
      solution_summary: >-
        Draft offering Monday, December 14, 2026 in East Africa Time - 1:00-2:00 p.m., 2:00-3:00 p.m., and 4:00-5:00 p.m. EAT
        (10:00, 11:00, and 13:00 GMT for Tom) - saying the times are currently open but not reserved until she replies and an
        invitation is sent. Tell Grace that no holds are placed, so "held until Friday" would be inaccurate.
      must:
        - Offer only valid starts (1:00 to 2:00 p.m. EAT, or 4:00 p.m. EAT) with the date and EAT named.
        - State in the draft that the options are not reserved until confirmed.
