          text: >-
            Technical interview - Thursday, December 10, 2026, 9:00-10:00 JST for Aiko (Wednesday, December 9, 4:00-5:00 p.m.
            PST for Ryan), Teams. Aiko's invitation in Japanese per policy. Want me to book it?
