          text: "Thursday, December 10, 2026 (PST) - S1 10:00-10:45, S2 11:00-11:45, S3 12:00-12:45, with 15-minute breaks. Want me to book all three?"
        - role: recruiter
          at: "2026-12-03T09:05:00-08:00"
          channel: chat
          text: Yes, book them.
          confirmation: true
