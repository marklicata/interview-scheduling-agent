  - id: COM-036
    title: Drafted follow-up asks only the one missing fact - which time zone applies on each day
    category: communication_quality
    subcategory: minimal_clarifying_question
    description: >-
      The candidate gave explicit dates and hours ("Monday, December 7 or Tuesday, December 8, 9-11am") but mentioned
      travelling between Chicago and Denver that week. Duration, interviewer, and dates are known. The drafted follow-up should
      ask a single question - where the candidate will be (or which time zone the hours refer to) on each day - not re-request
      everything.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [clarifying_question, minimal_question, candidate_travel, missing_time_zone]
    requirement_refs: [INT-05, EC-001, GS-002]
    inputs:
      now: "2026-12-03T14:00:00-06:00"
      recruiter: {id: rec_ben, name: Ben Whitaker, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Mateo Fernández
        time_zone_raw: unknown (travelling between Chicago and Denver)
      interview_plan:
        name: Inside Sales Rep - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_kelsey]}
      interviewers:
        - {id: int_kelsey, name: Kelsey Moore, time_zone: America/Chicago}
      conversation:
        - role: candidate
          at: "2026-12-03T12:40:00-06:00"
          channel: email
          text: Monday, December 7 or Tuesday, December 8, 9-11am works. I'm bouncing between Chicago and Denver that week.
        - role: recruiter
          at: "2026-12-03T14:00:00-06:00"
          channel: chat
          text: Draft a follow-up to Mateo asking whatever we still need.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        Draft one short question - "Will you be in Chicago (Central time) or Denver (Mountain time) on Monday, December 7 and on
        Tuesday, December 8, so we read your 9-11 a.m. correctly?" - and present it to Ben for approval.
      must:
        - Ask only which city or time zone the 9-11 a.m. refers to on each of the two dates.
        - Restate the dates absolutely (Monday, December 7 and Tuesday, December 8, 2026).
        - Present the draft for Ben's approval.
      must_not:
        - Re-ask for dates, hours, duration, or other information already given.
        - Assume Central time because the recruiter or interviewer is in Chicago.
        - Send the follow-up without approval.
      side_effects: {external_writes: none}
      clarifying_question_topics: [candidate_time_zone_per_day]
    local_time_checks:
      - {instant: "2026-12-07T15:00:00Z", time_zone: America/Chicago, expected_local: "2026-12-07T09:00", expected_weekday: Monday, expected_utc_offset: "-06:00"}
      - {instant: "2026-12-07T15:00:00Z", time_zone: America/Denver, expected_local: "2026-12-07T08:00", expected_utc_offset: "-07:00"}
      - {instant: "2026-12-08T16:00:00Z", time_zone: America/Denver, expected_local: "2026-12-08T09:00", expected_weekday: Tuesday}
    grading_notes: The two readings of "9-11am" differ by one hour; the point is a single targeted question, not a full re-intake.

