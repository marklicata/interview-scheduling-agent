        sessions:
          - {id: S1, title: Entrevista técnica, format: virtual, duration_min: 60, interviewers: [int_elena_v]}
      interviewers:
        - {id: int_elena_v, name: Elena Vidal, time_zone: Europe/Madrid}
      policies:
        candidate_message_languages: {supported: [en, es]}
      conversation:
        - role: agent
          at: "2026-11-24T09:55:00+01:00"
          channel: chat
          text: >-
            Two valid options for Alejandro (Mexico City time) - 1) Tuesday, December 1, 2026, 10:00-11:00 (17:00-18:00 Madrid)
            2) Wednesday, December 2, 2026, 11:00-12:00 (18:00-19:00 Madrid).
        - role: recruiter
          at: "2026-11-24T10:00:00+01:00"
          channel: chat
          text: Draft the options email to Alejandro in Spanish, please.
    expected:
      disposition: propose_options
      solution_summary: >-
        A Spanish draft offering "martes 1 de diciembre de 2026, de 10:00 a 11:00 (hora de la Ciudad de México, UTC-6)" and
        "miércoles 2 de diciembre de 2026, de 11:00 a 12:00 (hora de la Ciudad de México, UTC-6)", asking him to reply with his
        choice and stating that the times are not reserved until confirmed. Presented to Lucía for approval.
      must:
        - Write the email in Spanish with both dates spelled out with weekday, day, month, and year.
        - State times in Mexico City time with the zone named (hora de la Ciudad de México / UTC-6).
        - Say the options are not reserved until Alejandro chooses and an invitation is sent.
        - Ask Lucía whether to send it.
      must_not:
        - Use numeric dates such as 01/12/2026 or 12/01/2026.
        - Present Madrid times as the candidate's times.
        - Say the times are held, reserved, or confirmed.
        - Send the email before approval.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-01T16:00:00Z", time_zone: America/Mexico_City, expected_local: "2026-12-01T10:00", expected_weekday: Tuesday, expected_utc_offset: "-06:00"}
      - {instant: "2026-12-01T16:00:00Z", time_zone: Europe/Madrid, expected_local: "2026-12-01T17:00", expected_utc_offset: "+01:00"}
      - {instant: "2026-12-02T17:00:00Z", time_zone: America/Mexico_City, expected_local: "2026-12-02T11:00", expected_weekday: Wednesday}

  - id: COM-013
    title: Recruiter's US template "03/04/2027 at 9:00 AM ET" would mislead a UK candidate
    category: communication_quality
    subcategory: unambiguous_date_format
    description: >-
      The recruiter asks to use the standard US template "Your interview is confirmed for 03/04/2027 at 9:00 AM ET." The UK
      candidate would read 03/04 as 3 April and would have to convert ET herself. The agent should flag the ambiguity and draft
      an unambiguous version with weekday, day, month name, year, and the candidate's local time first.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [date_format, locale_ambiguity, candidate_local_time, template_adaptation]
    requirement_refs: [EC-003, COM-02, EC-075]
    inputs:
      now: "2027-02-22T10:00:00-05:00"
      recruiter: {id: rec_nadia, name: Nadia Rahman, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Imogen Clarke, time_zone: Europe/London, locale: en-GB}
      interview_plan:
        name: Communications Manager - interview
        sessions:
          - {id: S1, title: Communications interview, format: virtual, duration_min: 60, interviewers: [int_devon]}
      interviewers:
        - {id: int_devon, name: Devon Shaw, time_zone: America/New_York}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_nyc_0304, start: "2027-03-04T14:00:00Z", end: "2027-03-04T15:00:00Z", booking_status: sent}
      conversation:
        - role: recruiter
          at: "2027-02-22T10:00:00-05:00"
          channel: chat
          text: "Draft Imogen's confirmation with our standard line: 'Your interview is confirmed for 03/04/2027 at 9:00 AM ET.'"
    expected:
      disposition: propose_options
      solution_summary: >-
        Draft "Your interview is on Thursday, 4 March 2027, 14:00-15:00 UK time (GMT) - that's 9:00-10:00 a.m. Eastern (EST)."
        Explain to Nadia that 03/04 reads as 3 April in the UK and that the candidate's local time should come first. Ask
        whether to send.
      must:
        - Write the date as Thursday, 4 March 2027 (or March 4, 2027 with weekday), never as a numeric slash date.
        - Put the candidate's local time (14:00-15:00 GMT) first, with Eastern time as reference.
        - Briefly explain the 03/04 ambiguity to Nadia and ask whether to send the adapted text.
      must_not:
        - Keep "03/04/2027" in the candidate text.
        - Give only Eastern time to the UK candidate.
        - Send without approval.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-03-04T14:00:00Z", time_zone: Europe/London, expected_local: "2027-03-04T14:00", expected_weekday: Thursday, expected_utc_offset: "+00:00"}
      - {instant: "2027-03-04T14:00:00Z", time_zone: America/New_York, expected_local: "2027-03-04T09:00", expected_utc_offset: "-05:00"}

  - id: COM-014
    title: Recruiter says "tell her it's tomorrow at 8" - but it is already Thursday in Singapore
    category: communication_quality
    subcategory: avoid_relative_dates_cross_zone
    description: >-
      On Wednesday morning in Los Angeles the recruiter confirms a Thursday 8:00 a.m. Singapore interview and asks to tell the
      candidate "it's tomorrow at 8." When the invitation is sent it is already 2:00 a.m. Thursday in Singapore, so "tomorrow"
      would mean Friday to the candidate. The invitation must use absolute dates.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [relative_dates, tomorrow_trap, date_line, absolute_dates, short_notice]
    requirement_refs: [EC-016, COM-02, AVL-10]
    inputs:
      now: "2026-12-09T10:00:00-08:00"
      recruiter: {id: rec_maya, name: Maya Chen, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Siti Rahmah
        email: siti.rahmah@example.com
        time_zone: Asia/Singapore
        availability:
          - {start: "2026-12-10T08:00:00+08:00", end: "2026-12-10T10:00:00+08:00"}
      interview_plan:
        name: Partner Manager - interview
        sessions:
          - {id: S1, title: Partner interview, format: virtual, duration_min: 60, interviewers: [int_noah]}
      interviewers:
        - {id: int_noah, name: Noah Feldman, time_zone: America/Los_Angeles, availability_source: calendar, working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: agent
          at: "2026-12-09T09:55:00-08:00"
          channel: chat
          text: "Only option - Thursday, December 10, 2026, 8:00-9:00 a.m. SGT for Siti = Wednesday, December 9, 4:00-5:00 p.m. PST for Noah. Want me to book it?"
        - role: recruiter
          at: "2026-12-09T10:00:00-08:00"
          channel: chat
          text: Book it and tell her it's tomorrow at 8.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book Thursday, December 10, 2026, 8:00-9:00 a.m. SGT (Wednesday, December 9, 4:00-5:00 p.m. PST). The candidate
        invitation states the absolute date and time; tell Maya that "tomorrow" was replaced because it is already Thursday
        in Singapore and the interview is about six hours away.
      must:
        - Create one event with Siti's invitation saying Thursday, December 10, 2026, 8:00-9:00 a.m. SGT (UTC+8).
        - Tell Maya why "tomorrow" was not used (it is already December 10 in Singapore at send time).
        - Mention the short notice (about six hours) so Maya can give Siti a heads-up.
        - Report the invitation as sent, not accepted.
      must_not:
        - Use "tomorrow", "today", or "tonight" in the candidate invitation.
        - Book a Friday time or shift the instant to match the word "tomorrow".
        - Give Noah the Thursday date.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 for Siti Rahmah and Noah Feldman, notes: Absolute date in the candidate's zone; Teams link.}
    local_time_checks:
      - {instant: "2026-12-10T00:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-10T08:00", expected_weekday: Thursday, expected_utc_offset: "+08:00"}
      - {instant: "2026-12-10T00:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-12-09T16:00", expected_weekday: Wednesday}
      - {instant: "2026-12-09T18:00:00Z", time_zone: Asia/Singapore, expected_local: "2026-12-10T02:00", expected_weekday: Thursday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-09T00:00:00-08:00", end: "2026-12-11T00:00:00-08:00"}
      participants:
        candidate: {time_zone: Asia/Singapore, available: [["2026-12-10T08:00:00+08:00", "2026-12-10T10:00:00+08:00"]]}
        int_noah:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_noah]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-10T08:00:00+08:00"}
      invalid_examples:
        - {S1: "2026-12-11T08:00:00+08:00", note: Friday in Singapore - what "tomorrow" would mean to the candidate.}
        - {S1: "2026-12-10T09:00:00+08:00", note: Ends after Noah's working hours.}
      valid_start_bounds:
        S1: {earliest: "2026-12-10T08:00:00+08:00", latest: "2026-12-10T08:00:00+08:00"}

  - id: COM-015
    title: Invitation uses the candidate's preferred name and pronouns, never the legal name
    category: communication_quality
    subcategory: preferred_name_pronouns
    description: >-
      The ATS holds the legal name "Katherine Nguyen", but the candidate uses "Kit Nguyen" and they/them pronouns and opted to
      share pronouns with interviewers. The booked invitation's subject, greeting, and interviewer-facing text must use "Kit"
      and they/them consistently, with no legal name or gendered honorific.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [preferred_name, pronouns, respectful_communication, invitation_content]
    requirement_refs: [COM-01, COM-06]
    inputs:
      now: "2026-12-02T09:00:00-07:00"
      recruiter: {id: rec_amara, name: Amara Nwosu, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Katherine Nguyen
        legal_name: Katherine Nguyen
        preferred_name: Kit Nguyen
        pronouns: they/them
        share_pronouns_with_interviewers: true
        email: kit.nguyen@example.org
        time_zone: America/Denver
      interview_plan:
        name: UX Designer - design interview
        sessions:
          - {id: S1, title: Design interview, format: virtual, duration_min: 45, interviewers: [int_mateus]}
      interviewers:
        - {id: int_mateus, name: Mateus Oliveira, time_zone: America/Phoenix}
      conversation:
        - role: agent
          at: "2026-12-02T08:55:00-07:00"
          channel: chat
          text: "Design interview - Wednesday, December 9, 2026, 10:00-10:45 a.m. MST (same time in Phoenix), Kit Nguyen with Mateus Oliveira, Teams. Want me to book it?"
        - role: recruiter
          at: "2026-12-02T09:00:00-07:00"
          channel: chat
          text: Yes, book it.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book Wednesday, December 9, 2026, 10:00-10:45 a.m. MST. Subject and greeting use "Kit Nguyen" / "Hi Kit"; the
        interviewer-facing details say "Kit Nguyen (they/them)" and use they/them throughout.
      must:
        - Use "Kit Nguyen" in the subject and "Kit" in the greeting.
        - Include "(they/them)" for Mateus, since the candidate opted in, and use they/them in any sentence about the candidate.
        - Report the invitation as sent, not accepted.
      must_not:
        - Use "Katherine" anywhere in the invitation or summary.
        - Use she/her, he/him, "Ms.", "Mr.", or other gendered honorifics.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 for Kit Nguyen and Mateus Oliveira, notes: Preferred name and pronouns; Teams link.}
    local_time_checks:
      - {instant: "2026-12-09T17:00:00Z", time_zone: America/Denver, expected_local: "2026-12-09T10:00", expected_weekday: Wednesday, expected_utc_offset: "-07:00"}
      - {instant: "2026-12-09T17:00:00Z", time_zone: America/Phoenix, expected_local: "2026-12-09T10:00", expected_utc_offset: "-07:00"}

  - id: COM-016
    title: Screen-reader-friendly plain-text itinerary without disclosing the accommodation reason
    category: communication_quality
    subcategory: accessible_formatting
    description: >-
      The candidate uses a screen reader and asked for plain-text email with no tables or images. The itinerary for a
      three-session day must be linear, with headings like "Session 1 of 3", full dates and spelled-out time zones, descriptive
      link text, and no colour-only or emoji status markers. Interviewers may learn only the operational need, not the reason.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [accessibility, screen_reader, plain_text, descriptive_links, accommodation_privacy]
    requirement_refs: [UX-02, COM-01, EC-069, EC-098]
    inputs:
      now: "2026-12-03T10:00:00+00:00"
      recruiter: {id: rec_ines, name: Inês Costa, time_zone: Europe/Lisbon}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Tiago Mendes
        time_zone: Europe/Lisbon
        accommodation:
          operational_need: Plain-text email only; no tables, images, or colour coding; descriptive link text.
          reason: Uses a screen reader (restricted - recruiter only).
      interview_plan:
        name: Backend Developer - virtual day
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 45, interviewers: [int_rita]}
          - {id: S2, title: System design, format: virtual, duration_min: 45, interviewers: [int_pedro]}
          - {id: S3, title: Team conversation, format: virtual, duration_min: 60, interviewers: [int_sara]}
      interviewers:
        - {id: int_rita, name: Rita Carvalho, time_zone: Europe/Lisbon}
        - {id: int_pedro, name: Pedro Almeida, time_zone: Europe/Lisbon}
        - {id: int_sara, name: Sara Lopes, time_zone: Europe/Lisbon}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_lis_t1, start: "2026-12-09T10:00:00Z", end: "2026-12-09T10:45:00Z", teams_link: "https://teams.example/l/meetup-join/t1"}
          - {session: S2, event_id: evt_lis_t2, start: "2026-12-09T11:00:00Z", end: "2026-12-09T11:45:00Z", teams_link: "https://teams.example/l/meetup-join/t2"}
          - {session: S3, event_id: evt_lis_t3, start: "2026-12-09T13:00:00Z", end: "2026-12-09T14:00:00Z", teams_link: "https://teams.example/l/meetup-join/t3"}
      conversation:
        - role: recruiter
          at: "2026-12-03T10:00:00+00:00"
          channel: chat
          text: Draft Tiago's itinerary in the format he asked for, and a one-line note for the interviewers if they need to know anything.
    expected:
      disposition: propose_options
      solution_summary: >-
        A plain-text itinerary for Wednesday, December 9, 2026, Lisbon time (WET, UTC+0) - "Session 1 of 3 - Technical
        interview with Rita Carvalho, 10:00 to 10:45"; "Session 2 of 3 - System design with Pedro Almeida, 11:00 to 11:45";
        "Session 3 of 3 - Team conversation with Sara Lopes, 13:00 to 14:00"; breaks stated in words; links labelled like
        "Join the Teams meeting for session 1". Interviewer note - send any shared materials as accessible text in advance and
        describe on-screen content aloud. No reason given.
      must:
        - Use a linear plain-text structure with one session per block and "Session N of 3" headings.
        - State the full date once at the top and each start and end time with the zone spelled out (Lisbon time, WET).
        - Use descriptive link text that names the session, and state breaks in words (15-minute break, 75-minute lunch break).
        - Give interviewers only the operational need (accessible materials, describe visuals) without the reason.
      must_not:
        - Use tables, images, colour-only status, emoji, or ASCII art in the candidate draft.
        - Use link text such as "click here" or bare URLs as the only label.
        - Mention a screen reader, visual impairment, or disability in the interviewer note.
        - Send anything without Inês's approval.
      side_effects: {external_writes: none}

  - id: COM-017
    title: Confidential executive search uses the code name in every invitation and avoids the work email
    category: communication_quality
    subcategory: confidential_code_names
    description: >-
      A confidential CFO search runs as "Project Falcon." Policy requires the code name as the only subject, private events,
      no role, company, or candidate name in interviewer-visible subjects, and use of the candidate's personal email (she is
      employed at Fabrikam). The booked invitations must follow this exactly.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [executive, virtual_1on1]
    tags: [confidential_search, code_name, private_event, current_employer_privacy, executive]
    requirement_refs: [EC-070, EC-073, COM-01, COM-06]
