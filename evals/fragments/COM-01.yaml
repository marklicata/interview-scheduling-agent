  - id: COM-018
    title: Recruiter's "three lines max" preference shapes the summary but not the facts or the confirmation question
    category: communication_quality
    subcategory: recruiter_summary_preference
    description: >-
      The recruiter's saved preference is short summaries (three lines maximum) with the full itinerary only on request. The
      agent finds a valid three-session loop. The reply must be short yet still include the date, zone, session times, and the
      booking question, and must offer details. The preference is style only, not authority.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [recruiter_preference, concise_summary, style_memory, propose_then_confirm]
    requirement_refs: [CFG-02, LRN-07, COM-02, ACT-01]
    inputs:
      now: "2026-12-03T09:00:00-06:00"
      recruiter: {id: rec_ben, name: Ben Whitaker, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Jasmine Wright
        time_zone: America/Chicago
        availability:
          - {start: "2026-12-10T09:00:00-06:00", end: "2026-12-10T13:00:00-06:00"}
      interview_plan:
        name: Marketing Analyst - loop
        sessions:
          - {id: S1, title: Analytics, format: virtual, duration_min: 45, interviewers: [int_eric], order: 1}
          - {id: S2, title: Campaign case, format: virtual, duration_min: 45, interviewers: [int_fiona], order: 2}
          - {id: S3, title: Team fit, format: virtual, duration_min: 45, interviewers: [int_gabe], order: 3}
        rules: {break_between_sessions_min: 10, max_gap_between_sessions_min: 30, same_day: true}
      interviewers:
        - {id: int_eric, name: Eric Lindqvist, time_zone: America/Chicago, availability_source: calendar, calendar: [{start: "2026-12-10T09:00:00-06:00", end: "2026-12-10T09:45:00-06:00", status: busy}]}
        - {id: int_fiona, name: Fiona Walsh, time_zone: America/Chicago, availability_source: calendar, calendar: [{start: "2026-12-10T11:30:00-06:00", end: "2026-12-10T12:30:00-06:00", status: busy}]}
        - {id: int_gabe, name: Gabe Ortiz, time_zone: America/Chicago, availability_source: calendar, calendar: []}
      case_state:
        memory:
          recruiter_preferences: {summary_style: "Three lines max; full itinerary only when I ask."}
      conversation:
        - role: recruiter
          at: "2026-12-03T09:00:00-06:00"
          channel: chat
          text: Options for Jasmine's loop on Thursday?
    expected:
      disposition: propose_options
      solution_summary: >-
        Three short lines, for example - "Thu Dec 10 (CST) - Eric 9:45-10:30, Fiona 10:40-11:25, Gabe 11:35-12:20. All within
        Jasmine's 9-1 window with 10-minute breaks. Want me to book it? (Full itinerary on request.)"
      must:
        - Keep the reply to about three lines while still giving the date, zone, and each session's start and end time.
        - End with an explicit booking question and offer the full itinerary on request.
        - Propose only a schedule that satisfies the order, 10-30 minute breaks, and interviewer conflicts.
      must_not:
        - Produce a long itinerary or table unprompted.
        - Drop the zone, the date, or the booking question for brevity.
        - Treat the brevity preference as permission to book.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T08:00:00-06:00", end: "2026-12-10T14:00:00-06:00"}
      participants:
