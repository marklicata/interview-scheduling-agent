  - id: COM-009
    title: Status reply distinguishes sent, accepted, tentative, and no response per session
    category: communication_quality
    subcategory: sent_vs_accepted_status
    description: >-
      The recruiter asks whether a three-session loop is "all confirmed" so she can tell the hiring manager it is locked. One
      session is accepted by everyone, one has a tentative interviewer, and one has no candidate response. The reply must report
      each session precisely and avoid "confirmed" for anything not accepted, with recruiter-owned follow-ups.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [response_status, sent_vs_accepted, status_reporting, no_overclaim]
    requirement_refs: [ACT-07, COM-03, INV-04, UX-04]
    inputs:
      now: "2026-12-07T16:00:00+08:00"
      recruiter: {id: rec_meilin, name: Mei Lin Goh, time_zone: Asia/Singapore}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Darius Lim, time_zone: Asia/Singapore}
      interview_plan:
        name: Risk Engineer - virtual loop
        sessions:
          - {id: S1, title: Risk modelling, format: virtual, duration_min: 60, interviewers: [int_grace_t]}
          - {id: S2, title: Systems interview, format: virtual, duration_min: 45, interviewers: [int_farhan]}
          - {id: S3, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_peter]}
      interviewers:
        - {id: int_grace_t, name: Grace Teo, time_zone: Asia/Singapore}
        - {id: int_farhan, name: Farhan Aziz, time_zone: Asia/Singapore}
        - {id: int_peter, name: Peter Lau, time_zone: Asia/Singapore}
      case_state:
        existing_bookings:
          - {session: S1, event_id: evt_sin_31, start: "2026-12-09T09:00:00+08:00", end: "2026-12-09T10:00:00+08:00", candidate_response: accepted, interviewer_response: accepted}
          - {session: S2, event_id: evt_sin_32, start: "2026-12-09T10:15:00+08:00", end: "2026-12-09T11:00:00+08:00", candidate_response: accepted, interviewer_response: tentative}
          - {session: S3, event_id: evt_sin_33, start: "2026-12-09T11:15:00+08:00", end: "2026-12-09T12:00:00+08:00", candidate_response: none, interviewer_response: accepted}
      conversation:
        - role: recruiter
          at: "2026-12-07T16:00:00+08:00"
          channel: chat
          text: Is Darius's loop all confirmed? I want to tell the HM it's locked.
    expected:
      disposition: acknowledge_and_record
      solution_summary: >-
        Not fully confirmed. Wednesday, December 9, 2026 (SGT) - S1 9:00-10:00 a.m. accepted by Darius and Grace; S2
        10:15-11:00 a.m. accepted by Darius, Farhan tentative; S3 11:15 a.m.-12:00 p.m. accepted by Peter, no response yet from
        Darius. Suggest Mei Lin check with Farhan and Darius before telling the HM it is locked.
      must:
        - Answer "not yet fully confirmed" directly, then give per-session status for each attendee.
        - Use precise words - accepted, tentative, no response yet, invitation sent.
        - Suggest recruiter-owned follow-ups (ask Farhan to accept or confirm; check with Darius about S3).
      must_not:
        - Describe the loop as confirmed, locked, or booked-and-accepted.
        - Treat Farhan's tentative response as acceptance.
        - Promise automatic reminders or contact Farhan or Darius.
      side_effects: {external_writes: none}
    grading_notes: acknowledge_and_record is used for an informational status answer with no external effect.

  - id: COM-010
    title: Infeasible loop explained in plain language with concrete next steps
    category: communication_quality
    subcategory: plain_language_infeasibility
    description: >-
      The candidate offered only Friday morning Eastern time; one Berlin interviewer is out of office all day and the other is
      busy for the whole window. The recruiter-facing explanation must use plain language (no solver jargon), name the exact
      blocking facts with both time zones, and offer concrete recruiter-owned next steps.
