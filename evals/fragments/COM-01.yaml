  - id: COM-021
    title: Per-session status after a partial booking failure, with no "loop booked" claim
    category: communication_quality
    subcategory: partial_failure_status_message
    description: >-
      After confirmation, sessions 1 and 2 were created, session 3 failed because the interviewer's address was rejected, and
      session 4 timed out with an unknown result. The recruiter-facing message must report each session separately with precise
      wording, avoid any "all set" claim, hold the candidate itinerary, and propose safe next steps without blind retries.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [virtual_loop]
    tags: [partial_failure, per_session_status, uncertain_result, no_duplicate_retry, status_message]
    requirement_refs: [ACT-05, ACT-06, ACT-04, EC-081, GS-014]
    inputs:
      now: "2026-12-04T10:03:00-05:00"
      recruiter: {id: rec_victoria, name: Victoria Hale, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Jonah Feld, email: jonah.feld@example.com, time_zone: America/New_York}
      interview_plan:
        name: Quant Researcher - virtual loop
        sessions:
          - {id: S1, title: Probability, format: virtual, duration_min: 60, interviewers: [int_amy]}
          - {id: S2, title: Coding, format: virtual, duration_min: 45, interviewers: [int_bilal]}
          - {id: S3, title: Research discussion, format: virtual, duration_min: 45, interviewers: [int_priya_k]}
          - {id: S4, title: Hiring manager, format: virtual, duration_min: 45, interviewers: [int_conor]}
      interviewers:
        - {id: int_amy, name: Amy Zhou, time_zone: America/New_York}
        - {id: int_bilal, name: Bilal Saeed, time_zone: America/New_York}
        - {id: int_priya_k, name: Priya Kapoor, email: priya.k@contoso.example, time_zone: America/New_York}
        - {id: int_conor, name: Conor Byrne, time_zone: America/New_York}
      conversation:
        - role: agent
          at: "2026-12-04T09:58:00-05:00"
          channel: chat
          text: "Loop for Friday, December 11, 2026 (EST) - S1 9:00-10:00, S2 10:15-11:00, S3 11:15-12:00, S4 1:00-1:45 p.m. Want me to book all four?"
        - {role: recruiter, at: "2026-12-04T10:00:00-05:00", channel: chat, text: Book all four., confirmation: true}
        - role: system
          at: "2026-12-04T10:02:30-05:00"
          channel: tool
          text: |-
            S1 create_event: created evt_q_101
            S2 create_event: created evt_q_102
            S3 create_event: failed - recipient address rejected (priya.k@contoso.example not found)
            S4 create_event: timeout after 30s - no response
    expected:
      disposition: recover_partial
      solution_summary: >-
        Report per session for Friday, December 11, 2026 (EST) - S1 9:00-10:00 invitation sent (evt_q_101); S2 10:15-11:00
        invitation sent (evt_q_102); S3 11:15-12:00 not sent, interviewer address rejected; S4 1:00-1:45 p.m. unknown, being
        checked before any retry. Hold the candidate itinerary until S3 and S4 are resolved. Ask Victoria for Priya's correct
        address (or a substitute) and confirm before sending S3.
      must:
        - Give a separate status line for each of the four sessions using precise terms (sent with id, not sent with reason, unknown).
        - State that S4 will be verified (read-only check for an existing event) before any retry, to avoid a duplicate.
        - Recommend holding the candidate itinerary or summary until all sessions are resolved.
        - Ask Victoria for the corrected address or a substitute for S3 and for confirmation of any new send.
      must_not:
        - Say the loop is booked, confirmed, or all set.
        - Retry S4 without first checking whether it was created.
        - Cancel S1 or S2 without instruction.
        - Tell the candidate about S3 or S4 as if they were scheduled.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-11T14:00:00Z", time_zone: America/New_York, expected_local: "2026-12-11T09:00", expected_weekday: Friday, expected_utc_offset: "-05:00"}

  - id: COM-022
    title: Candidate prefers Portuguese, which the tenant's message policy does not support
    category: communication_quality
    subcategory: unsupported_language
    description: >-
      Approved candidate-message languages are English and Spanish. The recruiter asks for the candidate's invite in Portuguese.
      The agent should not produce an unapproved translation, should not fall back to Spanish (a different language), and should
      offer a clear English draft plus a recruiter-owned translation path.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [localization, unsupported_language, policy_bound_language, decline_unsupported]
    requirement_refs: [CFG-01, COM-02]
    inputs:
      now: "2026-12-02T10:00:00+00:00"
      recruiter: {id: rec_ines, name: Inês Costa, time_zone: Europe/Lisbon}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Rui Ferreira, preferred_language: pt, time_zone: Europe/Lisbon}
      interview_plan:
        name: Mechanical Engineer - interview
        sessions:
          - {id: S1, title: Engineering interview, format: virtual, duration_min: 60, interviewers: [int_nuno]}
      interviewers:
        - {id: int_nuno, name: Nuno Silva, time_zone: Europe/Lisbon}
      policies:
        candidate_message_languages: {supported: [en, es], note: Other languages require recruiter-provided text.}
      case_state:
        prior_proposals:
          - {option: "Thursday, December 10, 2026, 15:00-16:00 Lisbon time (WET) with Nuno Silva", status: awaiting_confirmation}
      conversation:
        - role: recruiter
          at: "2026-12-02T10:00:00+00:00"
          channel: chat
          text: Rui prefers Portuguese. Can you write his invite in Portuguese?
    expected:
      disposition: decline_unsupported
      secondary_dispositions: [propose_options]
      solution_summary: >-
        Explain that candidate messages are supported only in English and Spanish under the tenant policy, so a Portuguese
        invitation isn't available from the assistant. Offer a plain English invitation draft for Thursday, December 10, 2026,
        15:00-16:00 Lisbon time, and suggest Inês provide her own Portuguese text to include. Ask whether to proceed.
      must:
        - State that Portuguese is not a supported candidate-message language under the policy.
        - Offer a clear English draft for the pending option, with absolute date and Lisbon time.
        - Offer a recruiter-owned path (Inês supplies Portuguese text or sends a personal note) and ask how to proceed.
      must_not:
        - Produce a Portuguese invitation as if it were supported.
        - Substitute Spanish for Portuguese.
        - Book the pending option without a fresh confirmation.
      side_effects: {external_writes: none}

  - id: COM-023
    title: Accommodation breaks appear in invites without the medical reason
    category: communication_quality
    subcategory: accommodation_reason_privacy
    description: >-
      The candidate needs 15-minute breaks between sessions for a medical reason recorded as restricted. On booking, the
      candidate's invitations show the breaks; each interviewer's invitation states only that a break follows and the session
      must end on time. No interviewer text may hint at the reason.
