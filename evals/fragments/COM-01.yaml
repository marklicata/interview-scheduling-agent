  - id: COM-039
    title: Invitation went out without a Teams link - do not call the candidate ready
    category: communication_quality
    subcategory: missing_join_details_status
    description: >-
      The confirmed invitation was created, but the Teams meeting failed to provision (online meeting is null). The candidate
      has an invitation with no way to join. The recruiter-facing status must say so plainly, must not call the interview ready,
      and must propose a specific fix (update the event with a Teams link, which sends an update) for confirmation.
    difficulty: intermediate
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [missing_join_link, readiness_status, partial_success, honest_reporting]
    requirement_refs: [EC-132, EC-074, COM-03, ACT-05]
    inputs:
      now: "2026-12-04T13:02:00+01:00"
      recruiter: {id: rec_chloe, name: Chloé Martin, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Léa Girard, email: lea.girard@example.fr, time_zone: Europe/Paris}
      interview_plan:
        name: Legal Counsel - interview
        sessions:
          - {id: S1, title: Legal interview, format: virtual, duration_min: 60, interviewers: [int_antoine]}
      interviewers:
        - {id: int_antoine, name: Antoine Lefèvre, time_zone: Europe/Paris}
      conversation:
        - role: agent
          at: "2026-12-04T12:58:00+01:00"
          channel: chat
          text: "Legal interview - Wednesday, December 9, 2026, 15:00-16:00 CET, Léa Girard with Antoine Lefèvre, Teams. Want me to book it?"
        - {role: recruiter, at: "2026-12-04T13:00:00+01:00", channel: chat, text: Book it., confirmation: true}
        - role: system
          at: "2026-12-04T13:01:00+01:00"
          channel: tool
          text: 'create_event result: {"status": "created", "eventId": "evt_par_901", "isOnlineMeeting": false, "onlineMeeting": null, "warning": "Teams meeting provisioning failed"}'
    expected:
      disposition: recover_partial
      solution_summary: >-
        Report that evt_par_901 (Wednesday, December 9, 2026, 15:00-16:00 CET) was sent to Léa and Antoine but has no Teams join
        link, so it is not ready for the candidate. Propose updating that same event to add a Teams meeting (Léa and Antoine
        receive an update) and ask Chloé to confirm; do not create a second event.
      must:
        - State plainly that the invitation was sent without join details.
        - Avoid calling the interview ready or confirmed for the candidate.
        - Propose updating evt_par_901 with a Teams link and ask for confirmation, noting attendees will receive an update.
      must_not:
        - Create a second invitation for the same interview.
        - Send a separate "you're all set" message to Léa.
        - Say the invitation includes a Teams link.
      side_effects: {external_writes: none}

  - id: COM-040
    title: Quarter-hour and half-hour offsets - Kathmandu candidate, Adelaide interviewer, London recruiter
    category: communication_quality
    subcategory: non_hour_offsets_in_messages
    description: >-
      The candidate is in Kathmandu (UTC+5:45), the interviewer in Adelaide (UTC+10:30 in December, daylight time), and the
      recruiter in London. The candidate's 10:00 is 14:45 in Adelaide and 04:15 in London. Each message must carry exact minutes,
      not rounded times, with each recipient's own zone named.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [quarter_hour_offset, half_hour_offset, exact_minutes, cross_timezone, apac]
    requirement_refs: [EC-020, COM-02, AVL-10]
    inputs:
      now: "2026-12-03T09:05:00+00:00"
      recruiter: {id: rec_kwame, name: Kwame Asante, time_zone: Europe/London}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Sujan Shrestha
        time_zone: Asia/Kathmandu
        availability:
          - {start: "2026-12-10T09:00:00+05:45", end: "2026-12-10T12:00:00+05:45"}
      interview_plan:
        name: Hydrology Data Scientist - interview
        sessions:
          - {id: S1, title: Data science interview, format: virtual, duration_min: 60, interviewers: [int_lachlan]}
      interviewers:
        - {id: int_lachlan, name: Lachlan Price, time_zone: Australia/Adelaide, availability_source: calendar, working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}, calendar: []}
      conversation:
        - role: agent
          at: "2026-12-03T09:00:00+00:00"
          channel: chat
          text: "Thursday, December 10, 2026 - 10:00-11:00 Nepal time for Sujan = 14:45-15:45 ACDT for Lachlan (04:15-05:15 GMT for you). Want me to book it?"
        - role: recruiter
          at: "2026-12-03T09:05:00+00:00"
          channel: chat
          text: Book it.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book Thursday, December 10, 2026. Sujan's invitation reads 10:00-11:00 Nepal Time (UTC+5:45); Lachlan's reads
        2:45-3:45 p.m. Australian Central Daylight Time (UTC+10:30); Kwame's confirmation shows 04:15-05:15 GMT.
      must:
        - Show 10:00-11:00 Nepal Time (UTC+5:45) to the candidate and 14:45-15:45 ACDT (UTC+10:30) to Lachlan, both on December 10.
        - Report the booking to Kwame with 04:15-05:15 GMT.
        - Report the invitation as sent, not accepted.
      must_not:
        - Round any time to the nearest hour or half hour (for example 14:30 or 15:00 ACDT, or 04:00 GMT).
        - Use ACST (standard time) for Adelaide in December.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: S1 for Sujan Shrestha and Lachlan Price, notes: Exact minute offsets per recipient; Teams link.}
    local_time_checks:
      - {instant: "2026-12-10T04:15:00Z", time_zone: Asia/Kathmandu, expected_local: "2026-12-10T10:00", expected_weekday: Thursday, expected_utc_offset: "+05:45"}
      - {instant: "2026-12-10T04:15:00Z", time_zone: Australia/Adelaide, expected_local: "2026-12-10T14:45", expected_weekday: Thursday, expected_utc_offset: "+10:30"}
      - {instant: "2026-12-10T04:15:00Z", time_zone: Europe/London, expected_local: "2026-12-10T04:15", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-10T00:00:00Z", end: "2026-12-10T12:00:00Z"}
      participants:
        candidate: {time_zone: Asia/Kathmandu, available: [["2026-12-10T09:00:00+05:45", "2026-12-10T12:00:00+05:45"]]}
        int_lachlan:
          time_zone: Australia/Adelaide
          working_hours: {time_zone: Australia/Adelaide, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_lachlan]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-12-10T10:00:00+05:45"}
      invalid_examples:
        - {S1: "2026-12-10T11:30:00+05:45", note: Runs past the candidate's 12:00 Nepal-time end.}
      valid_start_bounds:
        S1: {earliest: "2026-12-10T09:00:00+05:45", latest: "2026-12-10T11:00:00+05:45"}
