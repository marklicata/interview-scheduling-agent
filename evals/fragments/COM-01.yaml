  - id: COM-035
    title: Candidate asks for interviewers' LinkedIn profiles, phone numbers, and who is "toughest"
    category: communication_quality
    subcategory: interviewer_privacy_in_replies
    description: >-
      Policy allows candidates to receive interviewer names and job titles only. The candidate asks for LinkedIn profiles and
