        No complete panel fits. Conditional option - Tuesday, December 8, 2026, 14:00-15:00 GMT if Arjun can attend; for Arjun
        that is 7:30-8:30 p.m. IST the same Tuesday, when his calendar shows busy. Liam should ask Arjun and report back so the
