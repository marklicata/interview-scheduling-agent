        - {id: int_ben_c, name: Ben Carter, time_zone: America/New_York, status_private: medical leave (restricted)}
        - {id: int_tomas, name: Tomás Ruiz, title: Senior Engineer, time_zone: America/New_York, availability_source: calendar, calendar: []}
      case_state:
        existing_bookings:
          - {session: S2, event_id: evt_nyc_s2, start: "2026-12-09T11:00:00-05:00", end: "2026-12-09T11:45:00-05:00", booking_status: accepted, teams_link: "https://teams.example/l/meetup-join/s2h"}
      conversation:
        - role: agent
          at: "2026-12-07T09:00:00-05:00"
          channel: chat
          text: "Swap Ben Carter for Tomás Ruiz on Hana's Systems interview (Wednesday, December 9, 2026, 11:00-11:45 a.m. EST); same time and Teams link. Want me to update it?"
        - role: recruiter
          at: "2026-12-07T09:05:00-05:00"
          channel: chat
          text: Yes, update it.
          confirmation: true
    expected:
