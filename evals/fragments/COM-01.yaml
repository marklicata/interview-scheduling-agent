          - {id: S2, title: Program execution, format: virtual, duration_min: 45, interviewers: [int_lukas]}
      interviewers:
        - id: int_katrin
          name: Katrin Weber
          time_zone: Europe/Berlin
          availability_source: calendar
          calendar:
            - {start: "2026-12-11T00:00:00+01:00", end: "2026-12-12T00:00:00+01:00", status: oof}
        - id: int_lukas
          name: Lukas Brandt
          time_zone: Europe/Berlin
          availability_source: calendar
          calendar:
            - {start: "2026-12-11T14:00:00+01:00", end: "2026-12-11T16:00:00+01:00", status: busy}
      conversation:
        - role: recruiter
          at: "2026-12-04T09:00:00-05:00"
