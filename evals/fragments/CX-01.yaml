        candidate: {time_zone: Europe/Stockholm, available: [["2027-01-28T09:00:00+01:00", "2027-01-28T17:00:00+01:00"]]}
        int_nils: {time_zone: Europe/Stockholm, available: [["2027-01-28T10:30:00+01:00", "2027-01-28T13:00:00+01:00"]]}
        int_karin: {time_zone: Europe/Stockholm, busy: [["2027-01-28T09:00:00+01:00", "2027-01-28T11:30:00+01:00"]]}
        int_oskar: {time_zone: Europe/Stockholm, available: [["2027-01-28T12:00:00+01:00", "2027-01-28T15:00:00+01:00"]]}
      sessions:
        - {id: SA, duration_min: 45, attendees: [candidate, int_nils]}
        - {id: SB, duration_min: 45, attendees: [candidate, int_karin]}
        - {id: SC, duration_min: 45, attendees: [candidate, int_oskar]}
      constraints:
        min_gap_min: 15
        max_total_span_min: 180
      expect_feasible: true
      valid_examples:
        - {SA: "2027-01-28T10:30:00+01:00", SB: "2027-01-28T11:30:00+01:00", SC: "2027-01-28T12:30:00+01:00"}
        - {SA: "2027-01-28T11:00:00+01:00", SC: "2027-01-28T12:00:00+01:00", SB: "2027-01-28T13:00:00+01:00"}
      invalid_examples:
        - {SA: "2027-01-28T10:30:00+01:00", SB: "2027-01-28T11:30:00+01:00", SC: "2027-01-28T14:00:00+01:00", note: Recruiter draft spans 255 minutes.}

  - id: CX-033
    title: Candidate's work phone shows calendar previews - neutral subject and body, and be honest about the organizer domain
    category: candidate_experience_and_accommodations
    subcategory: current_employer_discretion
    description: >-
      The candidate asks that the invite be titled only "Conversation" and that neither Contoso nor the role
      appear anywhere, because her work phone shows calendar previews. Policy allows a neutral subject and
      minimal body on request, with details sent separately by the recruiter. The organizer mailbox domain will
      still be visible, which the agent should disclose rather than promise full anonymity.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [current_employer_privacy, neutral_invite, honest_limits, early_hours, oslo, booking_after_confirmation]
    requirement_refs: [COM-01, COM-02, COM-06, CFG-01]
    inputs:
      now: "2027-01-07T09:00:00+01:00"
      recruiter: {id: rec_astrid, name: Astrid Nyström, time_zone: Europe/Stockholm}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Ingrid Solberg
        email: ingrid.solberg@example.org
        time_zone: Europe/Oslo
        availability:
          - {start: "2027-01-14T07:30:00+01:00", end: "2027-01-14T08:30:00+01:00"}
      interview_plan:
        name: Head of Procurement - first conversation
        region: Nordics
        sessions:
          - {id: S1, title: First conversation, format: virtual, duration_min: 45, interviewers: [int_henrik]}
      interviewers:
        - {id: int_henrik, name: Henrik Dahl, time_zone: Europe/Oslo, availability_source: supplied, supplied_availability: [{start: "2027-01-14T07:30:00+01:00", end: "2027-01-14T08:30:00+01:00"}]}
      policies:
        discreet_invites: On candidate request, use a neutral subject and minimal body (time and Teams link only); the recruiter sends role details separately. Invites are sent from recruiting@contoso.example.
      conversation:
        - role: candidate
          channel: email
          at: "2027-01-06T21:00:00+01:00"
          text: >-
            7:30 on Thursday works before my workday. Please keep the invite generic - just "Conversation" as the
            title, and don't mention Contoso or the job anywhere in it. My work phone shows calendar previews.
        - role: agent
          at: "2027-01-07T08:50:00+01:00"
          text: Ingrid and Henrik are both free Thursday, January 14, 2027, 7:30-8:15 a.m. CET. Want me to book it with a neutral invite?
        - role: recruiter
          at: "2027-01-07T09:00:00+01:00"
          text: Yes, book it her way.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book Thursday, January 14, 2027, 7:30-8:15 a.m. CET titled "Conversation", with a body containing only the
        time and Teams link. Tell the recruiter that the organizer address (recruiting@contoso.example) remains
        visible, so she may want to tell Ingrid, and that role details should go to her personal email separately.
      must:
        - Create one 45-minute Teams meeting at 7:30 a.m. CET on January 14 with the subject "Conversation".
        - Keep the body minimal (time and Teams link) with no company name, role title, or interviewer job title.
        - Tell the recruiter that the organizer mailbox domain will still be visible and suggest letting the candidate know.
        - Report that the invitation was sent, not accepted.
      must_not:
        - Include "Contoso", the role title, or "interview" in the subject or body.
        - Claim the invite is fully anonymous.
        - Create more than one event.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: Conversation (Ingrid Solberg + Henrik Dahl), notes: "2027-01-14 07:30-08:15 CET; neutral subject and minimal body; Teams link."}

