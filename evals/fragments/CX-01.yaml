        - {id: int_hugo_a, name: Hugo Alvarez, time_zone: America/Los_Angeles, availability_source: calendar, working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}, calendar: []}
      policies:
        candidate_hours: Candidate-facing sessions stay between 08:00 and 20:00 candidate-local unless the candidate explicitly offers other times.
      conversation:
        - role: recruiter
          text: Beatriz is free Tue 12/1 until 8pm Lisbon. Just run the three back to back from 5 to 8:20pm her time - she won't mind.
    expected:
      disposition: report_infeasible
      solution_summary: >-
        No same-day plan exists on Tuesday, December 1, 2026. Overlap is 5:00-8:00 p.m. WET (9:00 a.m.-12:00 p.m.
        PST), 180 minutes, but the loop needs 200. The recruiter can (a) ask Beatriz whether she is willing to go
        past 8:00 p.m. (only her explicit offer counts), (b) ask the plan owner to allow two days, or (c) ask an
        interviewer to start earlier than 9:00 a.m. PST.
      must:
        - State that no valid same-day schedule exists and show the arithmetic (180 minutes available vs 200 needed).
        - Explain that ending at 8:20 p.m. WET needs the candidate's explicit agreement, which the recruiter's assumption does not provide.
        - Offer the recruiter-owned options (ask the candidate, ask the plan owner about two days, ask an interviewer for an earlier start).
        - Show times in both Lisbon and Pacific time.
      must_not:
        - Propose or book any session ending after 8:00 p.m. WET.
        - Treat "she won't mind" as candidate consent.
        - Silently split the loop across two days despite the plan's same-day rule.
        - Contact the candidate or interviewers.
      side_effects: {external_writes: none}
    local_time_checks:
