            - {start: "2027-03-10T11:00:00+01:00", end: "2027-03-10T12:00:00+01:00", status: busy}
      policies:
        reschedules: Candidate-requested reschedules carry no penalty. After the second, the recruiter is notified and decides whether to keep offering times. Case notes record dates and who requested each change, never evaluative labels.
      case_state:
        existing_bookings:
          - {event_id: evt_hm_3, session: HM, start: "2027-03-04T10:00:00+01:00", end: "2027-03-04T11:00:00+01:00", invite_status: sent}
        reschedule_history:
          - {from: "2027-02-18T10:00:00+01:00", to: "2027-02-25T10:00:00+01:00", requested_by: candidate}
          - {from: "2027-02-25T10:00:00+01:00", to: "2027-03-04T10:00:00+01:00", requested_by: candidate}
      conversation:
        - role: candidate
          channel: email
          at: "2027-03-01T18:40:00+01:00"
          text: I'm so sorry - something has come up on Thursday. Could we move to next Tuesday or Wednesday morning?
        - role: recruiter
          at: "2027-03-02T09:00:00+01:00"
