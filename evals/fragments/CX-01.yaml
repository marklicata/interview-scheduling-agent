      interview_plan:
        name: Accessibility Program Manager - virtual loop
        region: Americas
        sessions:
          - {id: S1, title: Program management, format: virtual, duration_min: 45, interviewers: [int_lauren], order: 1}
          - {id: S2, title: Stakeholder interview, format: virtual, duration_min: 45, interviewers: [int_dmitri], order: 2}
      interviewers:
        - {id: int_lauren, name: Lauren Fisher, time_zone: America/New_York, availability_source: calendar, calendar: []}
        - {id: int_dmitri, name: Dmitri Volkov, time_zone: America/New_York, availability_source: calendar, calendar: []}
