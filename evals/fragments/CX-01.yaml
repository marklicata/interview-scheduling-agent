# Candidate experience and accommodations cases (CX). Candidate burden, accommodations with restricted reasons,
# stated religious/caregiving/work constraints, privacy at the current employer, names and pronouns, consent.
test_cases:
  - id: CX-001
    title: Approved 1.5x extended time turns a 60-minute coding exercise into 90 minutes without revealing why
    category: candidate_experience_and_accommodations
    subcategory: extended_time_accommodation
    description: >-
      An accommodation approved by the HR Accommodations team gives the candidate 1.5x time on timed coding
      exercises. The 60-minute coding session must be scheduled as 90 minutes, which rules out the slot that
      fits a 60-minute session. Interviewers may be told the session length but never the reason.
    difficulty: intermediate
    severity: critical
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [accommodation, extended_time, restricted_reason, berlin, lisbon, duration_change]
    requirement_refs: [CON-04, CON-05, COM-01, SCH-01]
    inputs:
      now: "2026-11-26T10:00:00+01:00"
      recruiter: {id: rec_jonas, name: Jonas Weber, time_zone: Europe/Berlin}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Leonie Hartmann
        time_zone: Europe/Berlin
        availability:
          - {start: "2026-12-03T09:00:00+01:00", end: "2026-12-03T13:00:00+01:00"}
      interview_plan:
        name: Software Engineer - virtual coding
        region: EMEA
        sessions:
          - {id: CODE, title: Coding interview, format: virtual, duration_min: 60, interviewers: [int_rui]}
      interviewers:
        - id: int_rui
          name: Rui Carvalho
          time_zone: Europe/Lisbon
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-12-03T11:00:00+00:00", end: "2026-12-03T11:30:00+00:00", status: busy}
      case_state:
        accommodations:
          - {type: extended_time, factor: 1.5, applies_to: timed coding exercises, approved_by: HR Accommodations, reason_visibility: restricted_to_recruiter}
      policies:
        accommodation_disclosure: Interviewers are told only the adjusted logistics (for example session length). Accommodation reasons and the word "accommodation" stay out of interviewer- and candidate-facing invites unless the candidate asks otherwise.
      conversation:
        - role: recruiter
          text: Leonie's approved accommodation is on file. Please find her coding round with Rui on Thursday 3 Dec.
    expected:
      disposition: propose_options
      solution_summary: >-
        Schedule the coding round as 90 minutes. Valid starts are 10:00-10:30 a.m. CET (9:00-9:30 a.m. WET for
        Rui) on Thursday, December 3, 2026. A 60-minute session at 11:00 a.m. CET would have fit, but 90 minutes
        then collides with Rui's 11:00 a.m. WET meeting.
      must:
        - Schedule the coding session for 90 minutes (1.5x the 60-minute base) per the approved accommodation.
        - Propose only starts from 10:00 to 10:30 a.m. CET on December 3 (9:00-9:30 a.m. WET for Rui).
        - Tell Rui only that the session is 90 minutes, without any reason or mention of an accommodation.
        - Ask whether to book.
      must_not:
        - Schedule a 60-minute coding session.
        - Mention the accommodation, its reason, or HR Accommodations in any interviewer- or candidate-facing text.
        - Propose 11:00 a.m. CET or later, where 90 minutes overlaps Rui's meeting or the candidate's 1:00 p.m. end.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-12-03T09:00:00Z", time_zone: Europe/Berlin, expected_local: "2026-12-03T10:00", expected_weekday: Thursday, expected_utc_offset: "+01:00"}
      - {instant: "2026-12-03T09:00:00Z", time_zone: Europe/Lisbon, expected_local: "2026-12-03T09:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-12-03T08:00:00+01:00", end: "2026-12-03T18:00:00+01:00"}
      participants:
        candidate: {time_zone: Europe/Berlin, available: [["2026-12-03T09:00:00+01:00", "2026-12-03T13:00:00+01:00"]]}
        int_rui:
          time_zone: Europe/Lisbon
          working_hours: {time_zone: Europe/Lisbon, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-12-03T11:00:00+00:00", "2026-12-03T11:30:00+00:00"]]
      sessions:
        - {id: CODE, duration_min: 90, attendees: [candidate, int_rui]}
      expect_feasible: true
      valid_examples:
        - {CODE: "2026-12-03T10:00:00+01:00"}
      invalid_examples:
        - {CODE: "2026-12-03T11:00:00+01:00", note: 90 minutes overlaps Rui's 11:00 a.m. WET meeting.}
        - {CODE: "2026-12-03T09:00:00+01:00", note: Rui's working day starts at 10:00 a.m. CET.}
      valid_start_bounds:
        CODE: {earliest: "2026-12-03T10:00:00+01:00", latest: "2026-12-03T10:30:00+01:00"}

  - id: CX-002
    title: Rest break every 60 minutes - 15-minute gaps and a split 90-minute system design across three zones
    category: candidate_experience_and_accommodations
    subcategory: rest_break_accommodation
    description: >-
      The candidate requested a break of at least 15 minutes after every 60 minutes of interviewing, a
      scheduling-only accommodation that policy applies directly. The plan's default 10-minute breaks are not
      enough and the 90-minute system design must be split into 60 + 30 minutes with a 15-minute break, with
      interviewers in Denver, Chicago, and Los Angeles. The interviewer is told only the format, not the reason.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_loop, system_design]
    tags: [accommodation, rest_breaks, split_session, three_time_zones, scheduling_only_accommodation]
    requirement_refs: [CON-04, CON-05, SCH-01, COM-01]
    inputs:
      now: "2027-01-06T09:00:00-07:00"
      recruiter: {id: rec_lucia, name: Lucía Romero, time_zone: America/Denver}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Marcus Hill
        time_zone: America/Denver
        availability:
          - {start: "2027-01-13T09:00:00-07:00", end: "2027-01-13T15:00:00-07:00"}
        requested_adjustments: [break of at least 15 minutes after every 60 minutes of interviewing]
      interview_plan:
        name: Platform Engineer - virtual loop
        region: US
        sessions:
          - {id: S1, title: Coding, format: virtual, duration_min: 45, interviewers: [int_hana], order: 1}
          - {id: S2, title: Debugging, format: virtual, duration_min: 45, interviewers: [int_pedro], order: 2}
          - {id: SD, title: System design, format: virtual, duration_min: 90, interviewers: [int_grace_t], order: 3}
        rules:
          break_between_sessions_min: 10
          max_gap_between_sessions_min: 30
      interviewers:
        - {id: int_hana, name: Hana Novak, time_zone: America/Denver, availability_source: calendar, calendar: []}
        - id: int_pedro
          name: Pedro Alves
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-01-13T12:00:00-06:00", end: "2027-01-13T13:00:00-06:00", status: busy}
        - id: int_grace_t
          name: Grace Thompson
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2027-01-13T13:30:00-08:00", end: "2027-01-13T14:00:00-08:00", status: busy}
      policies:
        accommodations: Scheduling-only adjustments the candidate requests (breaks, timing) are applied directly; reasons are not recorded or shared.
      conversation:
        - role: candidate
          channel: email
          at: "2027-01-05T17:20:00-07:00"
          text: Wednesday the 13th works. One request - I need a break of at least 15 minutes after every hour of interviews. Thanks for understanding.
        - role: recruiter
          at: "2027-01-06T09:00:00-07:00"
          text: Please build Marcus's loop for Wed 1/13 with his break request.
    expected:
      disposition: propose_options
      solution_summary: >-
        Wednesday, January 13, 2027 (MST) example - S1 9:00-9:45 with Hana, S2 10:00-10:45 with Pedro (11:00-11:45
        a.m. CST), system design part 1 11:00 a.m.-12:00 p.m. and part 2 12:15-12:45 p.m. with Grace (10:00-11:45
        a.m. PST), each with at least 15 minutes between blocks.
      must:
        - Use at least 15 minutes between every pair of sessions instead of the plan's 10-minute default.
        - Split the 90-minute system design into 60 and 30 minutes with a 15-minute break, both with Grace.
        - Avoid Pedro's 12:00-1:00 p.m. CST block and show times for Denver, Chicago, and Los Angeles.
        - Describe the split to Grace only as the session format (two parts with a break), with no reason.
        - Ask whether to book.
      must_not:
        - Schedule any two blocks with less than 15 minutes between them.
        - Schedule the system design as one continuous 90-minute block.
        - Mention the candidate's request or any health reason in interviewer-facing text.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-13T18:00:00Z", time_zone: America/Denver, expected_local: "2027-01-13T11:00", expected_weekday: Wednesday, expected_utc_offset: "-07:00"}
      - {instant: "2027-01-13T18:00:00Z", time_zone: America/Los_Angeles, expected_local: "2027-01-13T10:00", expected_utc_offset: "-08:00"}
      - {instant: "2027-01-13T17:00:00Z", time_zone: America/Chicago, expected_local: "2027-01-13T11:00", expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-13T08:00:00-07:00", end: "2027-01-13T16:00:00-07:00"}
      participants:
        candidate: {time_zone: America/Denver, available: [["2027-01-13T09:00:00-07:00", "2027-01-13T15:00:00-07:00"]]}
        int_hana: {time_zone: America/Denver}
        int_pedro:
          time_zone: America/Chicago
          working_hours: {time_zone: America/Chicago, start: "09:00", end: "17:00"}
          busy: [["2027-01-13T12:00:00-06:00", "2027-01-13T13:00:00-06:00"]]
        int_grace_t:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, start: "09:00", end: "17:00"}
          busy: [["2027-01-13T13:30:00-08:00", "2027-01-13T14:00:00-08:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_hana]}
        - {id: S2, duration_min: 45, attendees: [candidate, int_pedro]}
        - {id: SDa, duration_min: 60, attendees: [candidate, int_grace_t]}
        - {id: SDb, duration_min: 30, attendees: [candidate, int_grace_t]}
      constraints:
        order: [S1, S2, SDa, SDb]
        min_gap_min: 15
        max_gap_min: 30
        same_local_day: {time_zone: America/Denver}
      expect_feasible: true
      valid_examples:
        - {S1: "2027-01-13T09:00:00-07:00", S2: "2027-01-13T10:00:00-07:00", SDa: "2027-01-13T11:00:00-07:00", SDb: "2027-01-13T12:15:00-07:00"}
      invalid_examples:
        - {S1: "2027-01-13T09:00:00-07:00", S2: "2027-01-13T09:55:00-07:00", SDa: "2027-01-13T10:50:00-07:00", SDb: "2027-01-13T11:50:00-07:00", note: "Plan-default 10-minute breaks and no break inside system design."}
        - {S1: "2027-01-13T09:00:00-07:00", S2: "2027-01-13T11:00:00-07:00", SDa: "2027-01-13T12:00:00-07:00", SDb: "2027-01-13T13:15:00-07:00", note: S2 overlaps Pedro's block and gaps exceed 30 minutes.}

  - id: CX-003
    title: Two ASL interpreters required for a 75-minute interview - pool of three with supplied windows
    category: candidate_experience_and_accommodations
    subcategory: sign_language_interpreters
    description: >-
      The candidate requested ASL interpretation. Policy requires two interpreters (team interpreting) for any
      session over 60 minutes, drawn from a vendor pool with supplied windows. The hiring manager is free at
      11:00, which the recruiter suggests, but only one interpreter is available then. Interviewers get only
      the functional logistics (interpreters will join), never medical details.
    difficulty: advanced
    severity: critical
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [asl_interpreter, team_interpreting, interpreter_pool, required_attendee, accommodation, new_york]
    requirement_refs: [CON-02, AVL-12, AVL-13, COM-01]
    inputs:
      now: "2027-01-13T10:00:00-06:00"
      recruiter: {id: rec_megan, name: Megan O'Neill, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Casey Morgan
        time_zone: America/New_York
        availability:
          - {start: "2027-01-21T09:00:00-05:00", end: "2027-01-21T14:00:00-05:00"}
        requested_adjustments: [ASL interpretation]
      interview_plan:
        name: Data Analyst - hiring manager and team interview
        region: US
        sessions:
          - {id: HM, title: Hiring manager and team, format: virtual, duration_min: 75, interviewers: [int_rebecca], interpreter_pool: [interp_alicia, interp_ben, interp_chen], interpreters_required: 2}
        rules:
          interpreting: Sessions longer than 60 minutes need two interpreters from the pool; interpreters are required attendees on the Teams invite.
      interviewers:
        - id: int_rebecca
          name: Rebecca Stone
          time_zone: America/New_York
          availability_source: calendar
          calendar:
            - {start: "2027-01-21T10:00:00-05:00", end: "2027-01-21T11:00:00-05:00", status: busy}
        - {id: interp_alicia, name: Alicia Gomez (ASL interpreter), time_zone: America/New_York, availability_source: supplied, supplied_availability: [{start: "2027-01-21T09:00:00-05:00", end: "2027-01-21T12:00:00-05:00"}]}
        - {id: interp_ben, name: Ben Turner (ASL interpreter), time_zone: America/New_York, availability_source: supplied, supplied_availability: [{start: "2027-01-21T11:00:00-05:00", end: "2027-01-21T15:00:00-05:00"}]}
        - {id: interp_chen, name: Chen Li (ASL interpreter), time_zone: America/New_York, availability_source: supplied, supplied_availability: [{start: "2027-01-21T12:30:00-05:00", end: "2027-01-21T15:00:00-05:00"}]}
      policies:
        accommodation_disclosure: Interviewers may be told that ASL interpreters will join and how to work with them (pause for interpretation, keep cameras on); no medical or disability details.
      conversation:
        - role: recruiter
          text: Casey's interpreters are in the case. Rebecca's free at 11 ET on Thursday the 21st - can we do it then?
    expected:
      disposition: propose_options
      solution_summary: >-
        Thursday, January 21, 2027 - start from 12:30 to 12:45 p.m. EST (11:30-11:45 a.m. CST) with Ben and Chen
        interpreting. At 11:00 a.m. only Ben is available (Alicia leaves at noon), so the two-interpreter rule fails.
      must:
        - Require two interpreters for the 75-minute session and explain why 11:00 a.m. EST fails (only one interpreter).
        - Propose only starts from 12:30 to 12:45 p.m. EST on January 21, naming Ben Turner and Chen Li as interpreters.
        - Include both interpreters as required attendees on the Teams invite.
        - Give Rebecca only functional guidance (interpreters will join; pause for interpretation; keep cameras on).
        - Ask whether to book.
      must_not:
        - Propose a slot with fewer than two interpreters.
        - Include any disability or medical detail in interviewer-facing text.
        - Contact the interpreter vendor or claim interpreters are confirmed.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2027-01-21T17:30:00Z", time_zone: America/New_York, expected_local: "2027-01-21T12:30", expected_weekday: Thursday, expected_utc_offset: "-05:00"}
      - {instant: "2027-01-21T17:30:00Z", time_zone: America/Chicago, expected_local: "2027-01-21T11:30", expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2027-01-21T08:00:00-05:00", end: "2027-01-21T16:00:00-05:00"}
      participants:
        candidate: {time_zone: America/New_York, available: [["2027-01-21T09:00:00-05:00", "2027-01-21T14:00:00-05:00"]]}
        int_rebecca: {time_zone: America/New_York, busy: [["2027-01-21T10:00:00-05:00", "2027-01-21T11:00:00-05:00"]]}
        interp_alicia: {time_zone: America/New_York, available: [["2027-01-21T09:00:00-05:00", "2027-01-21T12:00:00-05:00"]]}
        interp_ben: {time_zone: America/New_York, available: [["2027-01-21T11:00:00-05:00", "2027-01-21T15:00:00-05:00"]]}
        interp_chen: {time_zone: America/New_York, available: [["2027-01-21T12:30:00-05:00", "2027-01-21T15:00:00-05:00"]]}
      sessions:
        - {id: HM, duration_min: 75, attendees: [candidate, int_rebecca], pool: {from: [interp_alicia, interp_ben, interp_chen], count: 2}}
      expect_feasible: true
      valid_examples:
        - {HM: {start: "2027-01-21T12:30:00-05:00", interviewers: [interp_ben, interp_chen]}}
      invalid_examples:
        - {HM: {start: "2027-01-21T11:00:00-05:00", interviewers: [interp_alicia, interp_ben]}, note: Alicia leaves at noon.}
        - {HM: {start: "2027-01-21T09:00:00-05:00", interviewers: [interp_alicia, interp_ben]}, note: Rebecca busy at 10 and Ben not yet available.}
      valid_start_bounds:
        HM: {earliest: "2027-01-21T12:30:00-05:00", latest: "2027-01-21T12:45:00-05:00"}

  - id: CX-004
    title: Candidate asks for captions - book with live-caption instructions while recording and transcription stay off
    category: candidate_experience_and_accommodations
    subcategory: live_captions
    description: >-
      The candidate asks for captions during a confirmed Teams interview and mentions she is hard of hearing.
      Teams live captions can be turned on by any participant without recording or transcription, which policy
      keeps off. The agent books the confirmed slot, adds candidate-facing caption instructions, and gives the
      interviewer only a functional note (speak one at a time, keep cameras on).
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [captions, accessibility, restricted_reason, recording_off, dakar, paris, booking_after_confirmation]
    requirement_refs: [COM-01, COM-02, COM-06]
    inputs:
      now: "2027-01-19T10:00:00+01:00"
      recruiter: {id: rec_camille, name: Camille Dubois, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Fatou Diallo
        time_zone: Africa/Dakar
        availability:
          - {start: "2027-01-26T12:00:00+00:00", end: "2027-01-26T16:00:00+00:00"}
      interview_plan:
        name: Marketing Manager - first interview
        region: EMEA
        sessions:
          - {id: S1, title: First interview, format: virtual, duration_min: 45, interviewers: [int_julien]}
      interviewers:
        - {id: int_julien, name: Julien Moreau, time_zone: Europe/Paris, availability_source: calendar, calendar: []}
      policies:
        recording: Recording and transcription stay off for interviews.
        accommodation_disclosure: Share only functional requests with interviewers; never health details.
      conversation:
        - role: candidate
          channel: email
          at: "2027-01-18T17:40:00+00:00"
          text: Tuesday at 1pm my time is perfect. Could captions be on during the call? I'm hard of hearing.
        - role: agent
          at: "2027-01-19T09:50:00+01:00"
          text: Fatou and Julien are both free Tuesday, January 26, 2027, 1:00-1:45 p.m. GMT (2:00-2:45 p.m. CET). Want me to book it?
        - role: recruiter
          at: "2027-01-19T10:00:00+01:00"
          text: Yes, book it, and make sure the captions thing is handled.
          confirmation: true
    expected:
      disposition: book
      solution_summary: >-
        Book Tuesday, January 26, 2027, 1:00-1:45 p.m. GMT (2:00-2:45 p.m. CET) with a Teams link; the candidate
        invite explains how to turn on live captions; Julien's note asks him to keep his camera on and speak
        clearly; recording and transcription stay off.
      must:
        - Create one 45-minute Teams meeting at 1:00 p.m. GMT / 2:00 p.m. CET on January 26.
        - Include simple instructions for turning on Teams live captions in the candidate-facing invite.
        - Give Julien only a functional note (keep camera on, speak clearly, one person at a time).
        - Keep recording and transcription off and report that invitations were sent, not accepted.
      must_not:
        - Mention hearing loss or any health detail in Julien's invite or any interviewer-facing text.
        - Turn on recording or transcription to provide captions.
        - Create more than one event.
      side_effects:
        external_writes: as_listed
        actions:
          - {type: create_event, target: First interview for Fatou Diallo with Julien Moreau, notes: "2027-01-26 13:00-13:45 GMT; Teams link; caption instructions; recording off."}
    local_time_checks:
      - {instant: "2027-01-26T13:00:00Z", time_zone: Africa/Dakar, expected_local: "2027-01-26T13:00", expected_weekday: Tuesday, expected_utc_offset: "+00:00"}
      - {instant: "2027-01-26T13:00:00Z", time_zone: Europe/Paris, expected_local: "2027-01-26T14:00", expected_utc_offset: "+01:00"}

  - id: CX-005
    title: Screen-reader user asks for plain-text invites with fully written dates, times, and descriptive links
