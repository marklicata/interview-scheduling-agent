# NLP-02: languages, locales, formats and multi-message threads (availability_interpretation)
test_cases:
  - id: NLP-026
    title: French "mardi 10 novembre entre 9h et 11h" against a London interviewer
    category: availability_interpretation
    subcategory: french_language
    description: >-
      A Paris candidate offers "mardi 10 novembre entre 9h et 11h" and says Thursday is complicated. Paris is one hour
      ahead of London in November. The London interviewer starts at 9:00 GMT and is busy until 9:20, leaving starts
      only from 10:20 to 10:30 CET. Tests French date/time notation (9h) and a non-quarter-hour boundary.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [french, non_english, h_time_notation, exact_boundary, paris, london]
    requirement_refs: [INT-03, AVL-10, EC-024]
    inputs:
      now: "2026-11-05T10:00:00+01:00"
      recruiter: {id: rec_margaux, name: Margaux Lefèvre, time_zone: Europe/Paris}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Camille Dubois, time_zone: Europe/Paris}
      interview_plan:
        name: Brand Strategist - screening interview
        sessions:
          - {id: S1, title: Screening interview, format: virtual, duration_min: 30, interviewers: [int_tom]}
      interviewers:
        - id: int_tom
          name: Tom Fletcher
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar:
            - {start: "2026-11-10T09:00:00+00:00", end: "2026-11-10T09:20:00+00:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-05T09:30:00+01:00"
          channel: email
          text: |-
            Bonjour Margaux,
            Je serais disponible mardi 10 novembre entre 9h et 11h. Jeudi, c'est plus compliqué pour moi.
            Bien à vous,
            Camille
        - role: recruiter
          at: "2026-11-05T10:00:00+01:00"
          channel: chat
          text: Camille can do Tuesday morning. Please set up 30 minutes with Tom in London.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 10, 2026, 9:00-11:00 CET = 8:00-10:00 GMT. Tom starts at 9:00 GMT and is busy until 9:20, so
        the call can start from 10:20 to 10:30 CET (9:20-9:30 GMT).
      must:
        - Parse "mardi 10 novembre entre 9h et 11h" as Tuesday, November 10, 9:00-11:00 Paris time.
        - Propose only starts from 10:20 to 10:30 CET (9:20-9:30 GMT).
        - Ask whether to book.
      must_not:
        - Treat 9h-11h as London time.
        - Propose Thursday, November 12, which the candidate said is complicated.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-10T09:20:00Z", time_zone: Europe/Paris, expected_local: "2026-11-10T10:20", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-10T09:20:00Z", time_zone: Europe/London, expected_local: "2026-11-10T09:20", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00+01:00", end: "2026-11-11T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/Paris
          available: [["2026-11-10T09:00:00+01:00", "2026-11-10T11:00:00+01:00"]]
        int_tom:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          busy: [["2026-11-10T09:00:00+00:00", "2026-11-10T09:20:00+00:00"]]
      sessions:
        - {id: S1, duration_min: 30, attendees: [candidate, int_tom]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-10T10:20:00+01:00"}
      invalid_examples:
        - {S1: "2026-11-10T10:30:00+00:00", note: '9h-11h read as London time; 11:30 CET is after the window.'}
        - {S1: "2026-11-10T10:00:00+01:00", note: Tom busy until 9:20 GMT.}
      valid_start_bounds:
        S1: {earliest: "2026-11-10T10:20:00+01:00", latest: "2026-11-10T10:30:00+01:00"}

  - id: NLP-027
    title: Portuguese "terça à tarde ... quarta só depois das 16h" with Brazil-configured part-of-day hours
    category: availability_interpretation
    subcategory: portuguese_language
    description: >-
      A São Paulo candidate writes "Terça à tarde fica ótimo. Quarta também, mas só depois das 16h." Sent on
      Wednesday, November 4, terça is Tuesday, November 10. The org's Brazil configuration defines afternoon as
      13:00-18:00. Tuesday afternoon has only 30 free interviewer minutes; Wednesday after 16h fits. São Paulo has no
      DST, so it is two hours ahead of New York in November.
    difficulty: intermediate
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [portuguese, non_english, part_of_day, org_definitions, sao_paulo, new_york]
    requirement_refs: [INT-03, AVL-10]
    inputs:
      now: "2026-11-05T09:00:00-03:00"
      recruiter: {id: rec_juliana, name: Juliana Costa, time_zone: America/Sao_Paulo}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Thiago Almeida, time_zone: America/Sao_Paulo}
      interview_plan:
        name: Partner Manager - interview
        sessions:
          - {id: S1, title: Partner management interview, format: virtual, duration_min: 45, interviewers: [int_rachel]}
      interviewers:
        - id: int_rachel
          name: Rachel Goldberg
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-10T11:00:00-05:00", end: "2026-11-10T15:30:00-05:00", status: busy}
            - {start: "2026-11-11T14:00:00-05:00", end: "2026-11-11T14:30:00-05:00", status: busy}
      policies:
        part_of_day_defaults:
          region: Brazil
          basis: candidate local time unless the candidate defines the term differently
          morning: "09:00-12:00"
          afternoon: "13:00-18:00"
      conversation:
        - role: candidate
          at: "2026-11-04T18:00:00-03:00"
          channel: email
          text: Oi Juliana! Terça à tarde fica ótimo pra mim. Quarta também, mas só depois das 16h. Abraço, Thiago
        - role: recruiter
          at: "2026-11-05T09:00:00-03:00"
          channel: chat
          text: Thiago respondeu. Please find 45 minutes with Rachel in New York.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 10 afternoon (13:00-18:00 BRT = 11:00-16:00 EST) leaves only 3:30-4:00 p.m. EST with Rachel,
        too short. Wednesday, November 11 after 16h (16:00-18:00 BRT = 14:00-16:00 EST): Rachel is busy until 2:30 p.m.
        EST, so starts from 16:30 to 17:15 BRT (2:30-3:15 p.m. EST) fit.
      must:
        - Resolve "terça" to Tuesday, November 10 and "quarta" to Wednesday, November 11, 2026.
        - Apply the configured afternoon (13:00-18:00) and the explicit "só depois das 16h" bound for Wednesday.
        - Propose only Wednesday starts from 16:30 to 17:15 BRT (2:30-3:15 p.m. EST).
        - Ask whether to book.
      must_not:
        - Propose Tuesday 3:30 p.m. EST, where only 30 minutes are free.
        - Propose Wednesday before 16:00 BRT.
        - Assume Brazil observes daylight saving time.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-11T19:30:00Z", time_zone: America/Sao_Paulo, expected_local: "2026-11-11T16:30", expected_weekday: Wednesday, expected_utc_offset: "-03:00"}
      - {instant: "2026-11-11T19:30:00Z", time_zone: America/New_York, expected_local: "2026-11-11T14:30", expected_utc_offset: "-05:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00-03:00", end: "2026-11-12T00:00:00-03:00"}
      participants:
        candidate:
          time_zone: America/Sao_Paulo
          available: [["2026-11-10T13:00:00-03:00", "2026-11-10T18:00:00-03:00"], ["2026-11-11T16:00:00-03:00", "2026-11-11T18:00:00-03:00"]]
        int_rachel:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy: [["2026-11-10T11:00:00-05:00", "2026-11-10T15:30:00-05:00"], ["2026-11-11T14:00:00-05:00", "2026-11-11T14:30:00-05:00"]]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_rachel]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-11T16:30:00-03:00"}
      invalid_examples:
        - {S1: "2026-11-10T17:30:00-03:00", note: Only 30 minutes free on Tuesday.}
        - {S1: "2026-11-11T15:00:00-03:00", note: Before 16h on Wednesday.}
      valid_start_bounds:
        S1: {earliest: "2026-11-11T16:30:00-03:00", latest: "2026-11-11T17:15:00-03:00"}

  - id: NLP-028
    title: Hinglish "kal shaam 6 baje ke baad, 8:30 tak" read the next morning
    category: availability_interpretation
    subcategory: hinglish_code_mixed
    description: >-
      A Hyderabad candidate messages at 9:10 p.m. on Monday, November 9: "kal shaam 6 baje ke baad free hoon, 8:30
      tak" (tomorrow evening after 6, until 8:30). The recruiter asks the next morning, when "kal" relative to now
      would be Wednesday. Kal can also mean yesterday in Hindi; context (free hoon) makes it tomorrow. Tests
      code-mixed language, send-time anchoring and shaam (evening, p.m.).
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [technical_coding, virtual_1on1]
    tags: [hinglish, code_mixed, relative_date, send_time_anchor, india, london]
    requirement_refs: [INT-03, AVL-10]
    inputs:
      now: "2026-11-10T09:00:00+05:30"
      recruiter: {id: rec_neha, name: Neha Sharma, time_zone: Asia/Kolkata}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Aditya Verma, location: Hyderabad, time_zone: Asia/Kolkata}
      interview_plan:
        name: Android Developer - technical interview
        sessions:
          - {id: S1, title: Technical interview, format: virtual, duration_min: 60, interviewers: [int_grace_a]}
      interviewers:
        - id: int_grace_a
          name: Grace Adebayo
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar:
            - {start: "2026-11-10T12:30:00+00:00", end: "2026-11-10T13:30:00+00:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-09T21:10:00+05:30"
          channel: teams
          text: Hi ma'am, kal shaam 6 baje ke baad free hoon, 8:30 tak. Office se nikal ke call le lunga.
        - role: recruiter
          at: "2026-11-10T09:00:00+05:30"
          channel: chat
          text: Aditya messaged last night (below). Please set up the technical round with Grace in London.
    expected:
      disposition: propose_options
      solution_summary: >-
        Sent Monday night, "kal shaam 6 baje ke baad, 8:30 tak" means Tuesday, November 10, 2026, 6:00-8:30 p.m. IST
        (12:30-3:00 p.m. GMT) - today from the recruiter's point of view. Grace is busy until 1:30 p.m. GMT, so the hour
        can start from 7:00 to 7:30 p.m. IST (1:30-2:00 p.m. GMT).
      must:
        - Resolve "kal" to Tuesday, November 10 based on the Monday-night send time.
        - Interpret "shaam 6 baje" as 6:00 p.m. and "8:30 tak" as ending by 8:30 p.m. IST.
        - Propose only starts from 7:00 to 7:30 p.m. IST (1:30-2:00 p.m. GMT) on November 10.
        - Ask whether to book.
      must_not:
        - Move the interview to Wednesday, November 11 because "kal" is read relative to now.
        - Use 6:00 a.m.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-10T13:30:00Z", time_zone: Asia/Kolkata, expected_local: "2026-11-10T19:00", expected_weekday: Tuesday, expected_utc_offset: "+05:30"}
      - {instant: "2026-11-10T13:30:00Z", time_zone: Europe/London, expected_local: "2026-11-10T13:30", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-10T00:00:00+05:30", end: "2026-11-12T00:00:00+05:30"}
      participants:
        candidate:
          time_zone: Asia/Kolkata
          available: [["2026-11-10T18:00:00+05:30", "2026-11-10T20:30:00+05:30"]]
        int_grace_a:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          busy: [["2026-11-10T12:30:00+00:00", "2026-11-10T13:30:00+00:00"]]
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_grace_a]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-10T19:00:00+05:30"}
      invalid_examples:
        - {S1: "2026-11-11T19:00:00+05:30", note: '"kal" anchored on now instead of the send time.'}
        - {S1: "2026-11-10T06:00:00+05:30", note: shaam means evening.}
        - {S1: "2026-11-10T18:00:00+05:30", note: Grace busy.}
      valid_start_bounds:
        S1: {earliest: "2026-11-10T19:00:00+05:30", latest: "2026-11-10T19:30:00+05:30"}

  - id: NLP-029
    title: Korean "다음 주 수요일 오후 2시~5시" falls on Tuesday night in Seattle - no overlap
    category: availability_interpretation
    subcategory: korean_language
    description: >-
      A Seoul candidate writes "다음 주 수요일 오후 2시~5시" (next week Wednesday, 2-5 p.m.). That is Wednesday, November 11
      KST, which is Tuesday, November 10, 9:00 p.m.-midnight in Seattle. The interviewer works 8:00-18:00 PST, so nothing
      fits; proposing "Wednesday 2 p.m." in Seattle would be a different day for the candidate. Tests Korean parsing
      and the date shift across the Pacific.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [system_design, virtual_1on1]
    tags: [korean, non_english, date_line_shift, infeasible, seoul, seattle]
    requirement_refs: [INT-03, AVL-10, EC-016]
    inputs:
      now: "2026-11-06T09:00:00-08:00"
      recruiter: {id: rec_jenna, name: Jenna Park, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Kim Min-jun, time_zone: Asia/Seoul}
      interview_plan:
        name: Senior Backend Engineer - system design
        sessions:
          - {id: S1, title: System design, format: virtual, duration_min: 60, interviewers: [int_brian]}
      interviewers:
        - id: int_brian
          name: Brian Walsh
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"}
          calendar: []
      conversation:
        - role: candidate
          at: "2026-11-06T10:30:00+09:00"
          channel: email
          text: |-
            안녕하세요, Jenna님.
            다음 주 수요일 오후 2시~5시 사이에 가능합니다. (한국 시간 기준)
            감사합니다.
            김민준 드림
        - role: recruiter
          at: "2026-11-06T09:00:00-08:00"
          channel: chat
          text: Min-jun can do next Wednesday afternoon. Put him on Brian's calendar Wednesday at 2?
    expected:
      disposition: report_infeasible
      secondary_dispositions: [request_availability]
      solution_summary: >-
        The window is Wednesday, November 11, 2026, 2:00-5:00 p.m. KST = Tuesday, November 10, 9:00 p.m.-midnight PST,
        outside Brian's hours, so nothing fits. "Wednesday at 2" Pacific would be Thursday 7:00 a.m. KST, which the
        candidate did not offer. Suggest asking the candidate about Thursday, November 12, 9:00-11:00 a.m. KST
        (Wednesday, November 11, 4:00-6:00 p.m. PST), which fits Brian's day.
      must:
        - Parse the message as Wednesday, November 11, 2:00-5:00 p.m. Korea time.
        - Show that this is Tuesday evening, November 10, in Pacific time and outside Brian's working hours.
        - Explain that the recruiter's "Wednesday at 2" Pacific is Thursday 7:00 a.m. in Seoul and not offered.
        - Suggest a concrete alternative for the recruiter to ask the candidate about (e.g., Thursday 9-11 a.m. KST).
      must_not:
        - Propose or book Wednesday, November 11, 2:00 p.m. PST.
        - Propose times outside Brian's 8:00 a.m.-6:00 p.m. PST hours as if they fit.
        - Contact the candidate or Brian directly.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-11T05:00:00Z", time_zone: Asia/Seoul, expected_local: "2026-11-11T14:00", expected_weekday: Wednesday, expected_utc_offset: "+09:00"}
      - {instant: "2026-11-11T05:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-10T21:00", expected_weekday: Tuesday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-11T22:00:00Z", time_zone: Asia/Seoul, expected_local: "2026-11-12T07:00", expected_weekday: Thursday}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-11T00:00:00+09:00", end: "2026-11-13T00:00:00+09:00"}
      participants:
        candidate:
          time_zone: Asia/Seoul
          available: [["2026-11-11T14:00:00+09:00", "2026-11-11T17:00:00+09:00"]]
        int_brian:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"}
      sessions:
        - {id: S1, duration_min: 60, attendees: [candidate, int_brian]}
      expect_feasible: false
      invalid_examples:
        - {S1: "2026-11-11T14:00:00-08:00", note: Wednesday 2 p.m. Pacific is Thursday 7 a.m. in Seoul.}
        - {S1: "2026-11-11T14:00:00+09:00", note: Tuesday 9 p.m. for Brian.}

  - id: NLP-030
    title: Dutch "tussen 13.30 en 15.00 uur" - dotted 24-hour times are not decimals
    category: availability_interpretation
    subcategory: dutch_language
    description: >-
      An Amsterdam candidate writes "dinsdag 17 november tussen 13.30 en 15.00 uur, of woensdag 18 november na 16.00
      uur (tot 17.30)". Dutch uses a dot as the hour-minute separator; 13.30 is 13:30, not 13.3 hours. The London
      interviewer's calendar leaves exactly one hour. Tests Dutch notation and exact fits.
    difficulty: basic
    severity: medium
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [dutch, non_english, dotted_time_separator, twenty_four_hour, exact_fit]
    requirement_refs: [INT-03, AVL-10]
    inputs:
      now: "2026-11-09T10:00:00+01:00"
      recruiter: {id: rec_pieter, name: Pieter Jansen, time_zone: Europe/Amsterdam}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Sanne de Vries, time_zone: Europe/Amsterdam}
      interview_plan:
        name: Supply Chain Analyst - interview
        sessions:
          - {id: S1, title: Analytics interview, format: virtual, duration_min: 60, interviewers: [int_liam]}
      interviewers:
        - id: int_liam
          name: Liam Byrne
          time_zone: Europe/London
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
          calendar:
            - {start: "2026-11-17T12:30:00+00:00", end: "2026-11-17T13:00:00+00:00", status: busy}
            - {start: "2026-11-18T15:00:00+00:00", end: "2026-11-18T16:00:00+00:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-09T09:05:00+01:00"
          channel: email
          text: |-
            Beste Pieter,
            Ik kan dinsdag 17 november tussen 13.30 en 15.00 uur, of woensdag 18 november na 16.00 uur (tot 17.30).
            Met vriendelijke groet,
            Sanne
        - role: recruiter
          at: "2026-11-09T10:00:00+01:00"
          channel: chat
          text: Sanne's options are below. One hour with Liam please.
    expected:
      disposition: propose_options
      solution_summary: >-
        Tuesday, November 17, 13:30-15:00 CET = 12:30-14:00 GMT; Liam is busy until 13:00 GMT, so the only start is
        14:00 CET (13:00 GMT). Wednesday, November 18, 16:00-17:30 CET = 15:00-16:30 GMT leaves only 30 minutes after
        Liam's meeting. Propose Tuesday, November 17, 14:00-15:00 CET.
      must:
        - Read 13.30, 15.00, 16.00 and 17.30 as clock times.
        - Propose exactly Tuesday, November 17, 2026, 14:00-15:00 CET (13:00-14:00 GMT).
        - Explain why Wednesday does not fit.
        - Ask whether to book.
      must_not:
        - Treat 13.30 as a decimal hour (13:18).
        - Propose 13:30 CET, which overlaps Liam's meeting.
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-17T13:00:00Z", time_zone: Europe/Amsterdam, expected_local: "2026-11-17T14:00", expected_weekday: Tuesday, expected_utc_offset: "+01:00"}
      - {instant: "2026-11-17T13:00:00Z", time_zone: Europe/London, expected_local: "2026-11-17T13:00", expected_utc_offset: "+00:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-17T00:00:00+01:00", end: "2026-11-19T00:00:00+01:00"}
      participants:
        candidate:
          time_zone: Europe/Amsterdam
          available: [["2026-11-17T13:30:00+01:00", "2026-11-17T15:00:00+01:00"], ["2026-11-18T16:00:00+01:00", "2026-11-18T17:30:00+01:00"]]
        int_liam:
          time_zone: Europe/London
          working_hours: {time_zone: Europe/London, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:30"}
