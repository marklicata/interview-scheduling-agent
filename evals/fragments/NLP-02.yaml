  - id: NLP-037
    title: '"I''m super flexible" with no dates, hours or zone, and a recruiter who says "just book something"'
    category: availability_interpretation
    subcategory: no_concrete_availability
    description: >-
      The candidate says only that they are flexible. The recruiter asks the agent to "just book something" next week.
      Flexibility is not a horizon, hours or a time zone, and "just book something" is not confirmation of a reviewed
      action. The agent should request concrete availability or draft interviewer-feasible options for the
      candidate to confirm.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [vague_availability, flexible, no_horizon, unknown_zone, no_booking_without_review]
    requirement_refs: [INT-05, EC-007, ACT-01]
    inputs:
      now: "2026-11-05T11:00:00-05:00"
      recruiter: {id: rec_olga, name: Olga Petrenko, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Hamza Malik, location: Remote - United States}
      interview_plan:
        name: Product Analyst - interview
        sessions:
          - {id: S1, title: Product analytics interview, format: virtual, duration_min: 45, interviewers: [int_elena]}
      interviewers:
        - id: int_elena
          name: Elena Sokolova
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar: []
      conversation:
        - role: candidate
          at: "2026-11-05T10:15:00-05:00"
          channel: teams
          text: Honestly I'm super flexible, whatever works for the team!
        - role: recruiter
          at: "2026-11-05T11:00:00-05:00"
          channel: chat
          text: He's flexible - just book something with Elena next week.
    expected:
      disposition: request_availability
      solution_summary: >-
        "Flexible" gives no dates, hours or time zone. Ask for Hamza's time zone and a few windows next week, or offer
        to draft 2-3 options from Elena's free time (e.g., in Eastern time) for the recruiter to send for Hamza to pick;
