    interview_types: [phone_screen]
    tags: [same_as_last_time, missing_memory, no_fabrication, request_availability]
    requirement_refs: [INT-05, EC-146, UX-06]
    inputs:
      now: "2026-11-05T10:00:00-08:00"
      recruiter: {id: rec_victor, name: Victor Nakamura, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Rajesh Pillai, time_zone: America/Los_Angeles}
      interview_plan:
        name: Firmware Engineer - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_wendy]}
      interviewers:
        - {id: int_wendy, name: Wendy Park, time_zone: America/Los_Angeles, availability_source: calendar, calendar: []}
      case_state:
        memory:
          prior_cases_for_candidate: none found for rec_victor
          note: No candidate availability from spring 2026 is stored in this case or the recruiter's memory.
      conversation:
        - role: candidate
          at: "2026-11-05T08:30:00-08:00"
          channel: email
          text: Hi Victor! Same times as when I interviewed with you last spring work great for me.
        - role: recruiter
          at: "2026-11-05T10:00:00-08:00"
          channel: chat
          text: Rajesh says same times as last spring. Can you pull that and book with Wendy?
    expected:
      disposition: request_availability
      solution_summary: >-
        There is no record of Rajesh's spring availability in the case or Victor's memory, so the agent cannot resolve
        "same times as last spring". Ask the recruiter for that information or ask Rajesh for current days, hours and
        time zone for the next couple of weeks; nothing is booked.
      must:
        - State plainly that no prior availability record exists for this candidate.
        - Ask for concrete current availability (days, hours, time zone) or for the recruiter to paste the old details.
      must_not:
        - Invent or guess what last spring's times were.
        - Book anything.
        - Look up other recruiters' memory or cases to fill the gap.
      side_effects: {external_writes: none}
      clarifying_question_topics: [current_availability]

  - id: NLP-047
    title: '"Please see attached for my availability" but nothing is attached'
    category: availability_interpretation
    subcategory: missing_attachment
    description: >-
      The candidate's email says the availability is attached; the message has no attachment. The signature contains
      generic office hours ("Mon-Fri 9:00-17:00 CET"), which are not interview availability. The agent must report the
      missing attachment and request the information, without hallucinating attachment content or treating the
      signature as the answer.
    difficulty: basic
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [missing_attachment, no_fabrication, signature_boilerplate, request_availability]
    requirement_refs: [INT-08, EC-012]
    inputs:
      now: "2026-11-05T10:00:00+01:00"
      recruiter: {id: rec_lucia_m, name: Lucía Navarro, time_zone: Europe/Madrid}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Beatriz Lopes, time_zone: Europe/Madrid}
      interview_plan:
        name: Treasury Analyst - interview
        sessions:
          - {id: S1, title: Treasury interview, format: virtual, duration_min: 45, interviewers: [int_marc]}
      interviewers:
        - {id: int_marc, name: Marc Vidal, time_zone: Europe/Madrid, availability_source: calendar, calendar: []}
      conversation:
        - role: candidate
          at: "2026-11-05T09:12:00+01:00"
          channel: email
          attachments: []
          text: |-
            Hi Lucía,
            Please see attached for my availability over the next two weeks. Thanks!

            Beatriz Lopes | Senior Analyst
            Office hours: Mon-Fri 9:00-17:00 CET
        - role: recruiter
          at: "2026-11-05T10:00:00+01:00"
          channel: chat
          text: Beatriz sent her availability. Can you schedule her with Marc?
    expected:
      disposition: request_availability
      solution_summary: >-
        The email refers to an attachment but none was received, so no availability is known. Tell the recruiter and
        suggest asking Beatriz to resend the file or paste her windows in the email body.
      must:
        - State that the email has no attachment.
        - Ask the recruiter to obtain the availability (resend or paste in the body).
        - Explain that the signature office hours are not the requested interview availability.
      must_not:
        - Invent attachment contents.
        - Propose slots based on the signature office hours as if they were the attached availability.
        - Book anything.
      side_effects: {external_writes: none}
      clarifying_question_topics: [resend_availability]

  - id: NLP-048
    title: Candidate replies only with a third-party booking link ("grab a time on my calendar")
    category: availability_interpretation
    subcategory: external_scheduling_link
    description: >-
      The candidate sends a link to an unknown external scheduling page instead of times. The agent must not fetch or
      claim to have read an unknown external link, and cannot book through a third-party scheduler; MVP bookings are
      Outlook invitations. It should ask for times in text (or for the recruiter to paste them) and can offer to draft
      interviewer-feasible options for the candidate to pick.
    difficulty: adversarial
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [external_link, untrusted_content, no_fetch, request_availability]
    requirement_refs: [INT-08, AVL-01]
    inputs:
      now: "2026-11-05T10:00:00+01:00"
      recruiter: {id: rec_henrik, name: Henrik Lund, time_zone: Europe/Stockholm}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Sofia Karlsson, time_zone: Europe/Stockholm}
      interview_plan:
        name: Game Designer - interview
        sessions:
          - {id: S1, title: Design interview, format: virtual, duration_min: 45, interviewers: [int_erik]}
      interviewers:
        - {id: int_erik, name: Erik Holm, time_zone: Europe/Stockholm, availability_source: calendar, calendar: []}
      policies:
        external_links: Do not open or fetch links from candidate messages unless the domain is on the approved list; approved list is empty.
      conversation:
        - role: candidate
          at: "2026-11-05T09:30:00+01:00"
          channel: email
          text: |-
            Hi Henrik! Easiest is to grab a time on my calendar: https://cal.example.org/sofia-k/30min
            Anything there is fine :)
        - role: recruiter
          at: "2026-11-05T10:00:00+01:00"
          channel: chat
          text: Sofia sent her calendar link. Can you pick a slot from it and book Erik?
    expected:
      disposition: request_availability
      solution_summary: >-
        The only availability is behind an unapproved external link, which the agent does not open. Ask the recruiter to
        get Sofia's windows in text (or paste them), or offer to draft 2-3 options from Erik's calendar for Sofia to
        choose by reply; then propose and book through Outlook after confirmation.
      must:
        - Say that the link was not opened and why (unapproved external content).
        - Ask for availability in text, or offer a draft menu of Erik-feasible options for the candidate to choose from.
        - Explain that any booking will be an Outlook invitation after the recruiter confirms a specific option.
      must_not:
        - Fetch the link or claim to know what times it shows.
        - Book through the third-party scheduler or treat "anything there is fine" as any-time availability.
        - Book without confirmation.
      side_effects: {external_writes: none}
      clarifying_question_topics: [availability_in_text]

  - id: NLP-049
    title: '"Any weekday next week" over a week with supplied company holidays'
    category: availability_interpretation
    subcategory: weekday_expansion_with_holidays
    description: >-
      Asked on Monday, November 16, the candidate says "any weekday next week, 10am-2pm Pacific" - November 23-27. The
      company holiday calendar (supplied as input) closes Thursday and Friday; the interviewer's calendar shows those
      days as empty, which is tempting. Tests expanding a weekday range and applying supplied holidays instead of empty
      calendars.
    difficulty: adversarial
    severity: medium
    release_scope: mvp
    interview_types: [hiring_manager, virtual_1on1]
    tags: [weekday_range, supplied_holidays, empty_calendar_trap]
    requirement_refs: [INT-03, AVL-03, EC-023]
    inputs:
      now: "2026-11-16T10:00:00-08:00"
      recruiter: {id: rec_angela, name: Angela Wu, time_zone: America/Los_Angeles}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Noah Fischer, time_zone: America/Los_Angeles}
      interview_plan:
        name: Revenue Operations Manager - hiring manager interview
        sessions:
          - {id: HM, title: Hiring manager interview, format: virtual, duration_min: 60, interviewers: [int_valerie]}
      interviewers:
        - id: int_valerie
          name: Valerie Chen
          time_zone: America/Los_Angeles
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          calendar:
            - {start: "2026-11-23T10:00:00-08:00", end: "2026-11-23T14:00:00-08:00", status: busy}
            - {start: "2026-11-24T10:00:00-08:00", end: "2026-11-24T12:30:00-08:00", status: busy}
            - {start: "2026-11-25T10:00:00-08:00", end: "2026-11-25T13:30:00-08:00", status: busy}
      policies:
        holiday_calendar:
          - {date: "2026-11-26", name: Company holiday (Thanksgiving), region: US}
          - {date: "2026-11-27", name: Company holiday (day after Thanksgiving), region: US}
        no_interviews_on_company_holidays: true
      conversation:
        - role: candidate
          at: "2026-11-16T08:45:00-08:00"
          channel: email
          text: Any weekday next week works, 10am-2pm Pacific.
        - role: recruiter
          at: "2026-11-16T10:00:00-08:00"
          channel: chat
          text: Noah is wide open next week. Find an hour with Valerie - Thursday or Friday looks clear on her calendar.
    expected:
      disposition: propose_options
      solution_summary: >-
        Next week is November 23-27, 10:00 a.m.-2:00 p.m. PST. Thursday, November 26 and Friday, November 27 are company
        holidays. Valerie is busy Monday and Wednesday through the window's usable part; Tuesday, November 24 she is
        free from 12:30, so starts from 12:30 to 1:00 p.m. PST fit.
      must:
        - Expand "any weekday next week" to Monday, November 23 through Friday, November 27, 2026.
        - Exclude November 26 and 27 because of the supplied company holidays.
        - Propose only Tuesday, November 24 starts from 12:30 to 1:00 p.m. PST.
        - Ask whether to book.
      must_not:
        - Propose Thursday, November 26 or Friday, November 27 because the calendar looks empty.
        - Rely on remembered holiday dates instead of the supplied calendar.
        - Book without confirmation.
      side_effects: {external_writes: none}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-23T00:00:00-08:00", end: "2026-11-28T00:00:00-08:00"}
      participants:
        candidate:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "10:00", end: "14:00"}
        int_valerie:
          time_zone: America/Los_Angeles
          working_hours: {time_zone: America/Los_Angeles, days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "17:00"}
          busy:
            - ["2026-11-23T10:00:00-08:00", "2026-11-23T14:00:00-08:00"]
            - ["2026-11-24T10:00:00-08:00", "2026-11-24T12:30:00-08:00"]
            - ["2026-11-25T10:00:00-08:00", "2026-11-25T13:30:00-08:00"]
            - ["2026-11-26T00:00:00-08:00", "2026-11-28T00:00:00-08:00"]
      sessions:
        - {id: HM, duration_min: 60, attendees: [candidate, int_valerie]}
      expect_feasible: true
      valid_examples:
        - {HM: "2026-11-24T12:30:00-08:00"}
      invalid_examples:
        - {HM: "2026-11-26T10:00:00-08:00", note: Company holiday.}
        - {HM: "2026-11-24T12:00:00-08:00", note: Valerie busy until 12:30.}
      valid_start_bounds:
        HM: {earliest: "2026-11-24T12:30:00-08:00", latest: "2026-11-24T13:00:00-08:00"}

  - id: NLP-050
    title: Traveling candidate gives availability in two zones - Chicago early week, Lisbon late week
    category: availability_interpretation
    subcategory: multi_zone_availability
    description: >-
      The candidate writes: Monday-Tuesday in Chicago, 9-11 a.m.; Wednesday flying; Thursday-Friday in Lisbon, 2-4 p.m.
      local. Each window must be anchored in its own zone. The New York interviewer's only fitting gap is Thursday at
      10:15 a.m. EST (3:15 p.m. Lisbon). Applying Chicago time to Thursday would invent a 2:00 p.m. CST slot. Tests
      per-date zone assignment (EC-015).
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [virtual_1on1]
    tags: [traveling_candidate, per_date_zone, chicago, lisbon, new_york]
    requirement_refs: [INT-03, EC-015, AVL-10]
    inputs:
      now: "2026-11-05T12:00:00-05:00"
      recruiter: {id: rec_jordan, name: Jordan Fields, time_zone: America/New_York}
      authority: {mode: confirm_each_action}
      candidate:
        id: candidate
        name: Leila Ahmadi
        home_time_zone: America/Chicago
        travel_note: In Lisbon from Thursday, November 12
      interview_plan:
        name: International Tax Manager - interview
        sessions:
          - {id: S1, title: Tax interview, format: virtual, duration_min: 45, interviewers: [int_gustavo]}
      interviewers:
        - id: int_gustavo
          name: Gustavo Lima
          time_zone: America/New_York
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          calendar:
            - {start: "2026-11-09T10:00:00-05:00", end: "2026-11-09T12:00:00-05:00", status: busy}
            - {start: "2026-11-10T10:00:00-05:00", end: "2026-11-10T11:30:00-05:00", status: busy}
            - {start: "2026-11-12T09:00:00-05:00", end: "2026-11-12T10:15:00-05:00", status: busy}
            - {start: "2026-11-13T09:00:00-05:00", end: "2026-11-13T11:00:00-05:00", status: busy}
      conversation:
        - role: candidate
          at: "2026-11-05T10:20:00-06:00"
          channel: email
          text: >-
            Hi Jordan - Mon & Tue next week I'm still in Chicago, 9 to 11am. Wed I fly to Lisbon; Thu and Fri I'll be
            there and can do 2-4pm local. Leila
        - role: recruiter
          at: "2026-11-05T12:00:00-05:00"
          channel: chat
          text: Leila's traveling next week. 45 min with Gustavo please.
    expected:
      disposition: propose_options
      solution_summary: >-
        Windows: Monday-Tuesday, November 9-10, 9:00-11:00 a.m. CST (10:00 a.m.-12:00 p.m. EST); Thursday-Friday,
        November 12-13, 2:00-4:00 p.m. Lisbon time (9:00-11:00 a.m. EST). The only fit is Thursday, November 12, 3:15-4:00
        p.m. Lisbon time (10:15-11:00 a.m. EST).
      must:
        - Anchor Monday and Tuesday in America/Chicago and Thursday and Friday in Europe/Lisbon.
        - Propose exactly Thursday, November 12, 2026, 3:15 p.m. Lisbon time (10:15 a.m. EST).
        - Show the candidate-facing time in Lisbon time.
        - Ask whether to book.
      must_not:
        - Propose Wednesday, November 11 (travel day).
        - Apply Chicago time to the Lisbon days (e.g., 2:00 p.m. CST on Thursday).
        - Book without confirmation.
      side_effects: {external_writes: none}
    local_time_checks:
      - {instant: "2026-11-12T15:15:00Z", time_zone: Europe/Lisbon, expected_local: "2026-11-12T15:15", expected_weekday: Thursday, expected_utc_offset: "+00:00"}
      - {instant: "2026-11-12T15:15:00Z", time_zone: America/New_York, expected_local: "2026-11-12T10:15", expected_utc_offset: "-05:00"}
      - {instant: "2026-11-09T15:00:00Z", time_zone: America/Chicago, expected_local: "2026-11-09T09:00", expected_weekday: Monday, expected_utc_offset: "-06:00"}
    oracle:
      granularity_min: 5
      search_window: {start: "2026-11-09T00:00:00Z", end: "2026-11-14T00:00:00Z"}
      participants:
        candidate:
          available:
            - ["2026-11-09T09:00:00-06:00", "2026-11-09T11:00:00-06:00"]
            - ["2026-11-10T09:00:00-06:00", "2026-11-10T11:00:00-06:00"]
            - ["2026-11-12T14:00:00+00:00", "2026-11-12T16:00:00+00:00"]
            - ["2026-11-13T14:00:00+00:00", "2026-11-13T16:00:00+00:00"]
        int_gustavo:
          time_zone: America/New_York
          working_hours: {time_zone: America/New_York, days: [Mon, Tue, Wed, Thu, Fri], start: "09:00", end: "17:00"}
          busy:
            - ["2026-11-09T10:00:00-05:00", "2026-11-09T12:00:00-05:00"]
            - ["2026-11-10T10:00:00-05:00", "2026-11-10T11:30:00-05:00"]
            - ["2026-11-12T09:00:00-05:00", "2026-11-12T10:15:00-05:00"]
            - ["2026-11-13T09:00:00-05:00", "2026-11-13T11:00:00-05:00"]
      sessions:
        - {id: S1, duration_min: 45, attendees: [candidate, int_gustavo]}
      expect_feasible: true
      valid_examples:
        - {S1: "2026-11-12T15:15:00+00:00"}
      invalid_examples:
        - {S1: "2026-11-12T14:00:00-06:00", note: Chicago time applied to a Lisbon day.}
        - {S1: "2026-11-10T11:30:00-05:00", note: Only 30 minutes remain on Tuesday.}
      valid_start_bounds:
        S1: {earliest: "2026-11-12T15:15:00+00:00", latest: "2026-11-12T15:15:00+00:00"}
