  - id: NLP-040
    title: '"After my flight lands at 2" with no time zone on a cross-country travel day'
    category: availability_interpretation
    subcategory: travel_anchor_unknown_zone
    description: >-
      A Seattle-based candidate is flying home from Boston on Thursday and writes "after my flight lands at 2 I'm
      totally free for the rest of the afternoon". "2" could be Boston (Eastern) or Seattle (Pacific) time - a three-
      hour difference - and landing is not the same as being ready. The Chicago interviewer is free all afternoon.
      Tests asking the smallest question instead of guessing on a travel day.
    difficulty: advanced
    severity: high
    release_scope: mvp
    interview_types: [phone_screen]
    tags: [travel_day, unknown_zone, event_anchor, smallest_question]
    requirement_refs: [INT-05, EC-015, EC-001]
    inputs:
      now: "2026-11-09T10:00:00-06:00"
      recruiter: {id: rec_renee, name: Renee Castillo, time_zone: America/Chicago}
      authority: {mode: confirm_each_action}
      candidate: {id: candidate, name: Elliot Fairbanks, location: Seattle (traveling), time_zone: America/Los_Angeles}
      interview_plan:
        name: Sales Engineer - phone screen
        sessions:
          - {id: S1, title: Phone screen, format: phone, duration_min: 30, interviewers: [int_tobias]}
      interviewers:
        - id: int_tobias
          name: Tobias Klein
          time_zone: America/Chicago
          availability_source: calendar
          working_hours: {days: [Mon, Tue, Wed, Thu, Fri], start: "08:00", end: "18:00"}
          calendar: []
      conversation:
        - role: candidate
          at: "2026-11-09T10:45:00-05:00"
          channel: email
          text: >-
            Hi Renee, I'm in Boston for a conference and fly back to Seattle Thursday. After my flight lands at 2 I'm
            totally free for the rest of the afternoon, so anytime after that works!
        - role: recruiter
          at: "2026-11-09T10:00:00-06:00"
          channel: chat
          text: Elliot's free Thursday after 2. Set up the phone screen with Tobias.
    expected:
      disposition: ask_clarification
      solution_summary: >-
        "Lands at 2" on Thursday, November 12, 2026 could be 2:00 p.m. PST in Seattle (4:00 p.m. CST) or 2:00 p.m. EST as
        written from Boston (11:00 a.m. PST, 1:00 p.m. CST). Ask which time zone the landing time is in and how soon after
        landing Elliot can take a call, and confirm he will be on Pacific time.
      must:
        - Identify that the landing time has no zone and that the two readings differ by three hours.
        - Ask a focused question about the landing time zone and when after landing he can talk.
        - Note that the candidate's location for the call will be Seattle (Pacific time).
      must_not:
        - Propose a 2:00 p.m. start (in any zone) as if landing time equals availability.
        - Assume Central time because the recruiter and interviewer are in Chicago.
        - Book, hold, or send anything.
      side_effects: {external_writes: none}
      clarifying_question_topics: [landing_time_zone, time_needed_after_landing]
    local_time_checks:
      - {instant: "2026-11-12T22:00:00Z", time_zone: America/Los_Angeles, expected_local: "2026-11-12T14:00", expected_weekday: Thursday, expected_utc_offset: "-08:00"}
      - {instant: "2026-11-12T19:00:00Z", time_zone: America/New_York, expected_local: "2026-11-12T14:00", expected_utc_offset: "-05:00"}

