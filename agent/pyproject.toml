[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduling-agent"
version = "0.1.0"
description = "Recruiter-facing interview scheduling agent (host-agnostic core; harness and Microsoft 365 hosts)"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.75",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Microsoft 365 Copilot / Teams host (custom engine agent) and Microsoft Graph calendar provider.
m365 = [
    "microsoft-agents-hosting-aiohttp",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-activity",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "azure-identity>=1.15",
]
# Claude through GitHub Copilot with the signed-in GitHub account (Python 3.11+).
copilot = ["github-copilot-sdk>=1.0.28"]
dev = ["pytest>=8", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
